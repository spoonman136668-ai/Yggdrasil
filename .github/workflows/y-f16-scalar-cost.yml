name: Y-F16 frozen scalar risk NN online overhead vs cheap control
on:
  push:
    branches: [research/y-f16-cheap-scalar-risk-stopper-20261014-r1]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install scientific repository dependencies
        run: python3 -m pip install -e '.[test]'
      - name: Verify frozen F15 source and separately preregistered F16
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ada4c0a3d5a8f674beb693f12d5640e6dad951c6 HEAD
          test "$(git hash-object research/foundational/20261014-y-f15/execute.py)" = "$(git rev-parse ada4c0a3d5a8f674beb693f12d5640e6dad951c6:research/foundational/20261014-y-f15/execute.py)"
          python3 -m py_compile research/foundational/20261014-y-f16/execute.py
          python3 -m json.tool research/foundational/20261014-y-f16/prereg.json >/dev/null
      - name: One new F16 original frozen scalarization development study
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -B research/foundational/20261014-y-f16/execute.py > /tmp/y-f16-original-development.json
          python3 -m json.tool /tmp/y-f16-original-development.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F16-original-scalar-risk-online-development
          path: /tmp/y-f16-original-development.json
          if-no-files-found: error
          retention-days: 90
      - name: Independent F16 row/decision/per-repetition timing verification
        run: |
          python3 - <<'PY'
          import json,collections,statistics
          d=json.load(open("/tmp/y-f16-original-development.json"))
          assert d["stage"]=="DEVELOPMENT_ONLY"
          assert d["graphs"]==96 and d["questions"]==576 and d["positives"]==192 and d["negatives"]==384
          assert d["state_bytes"]==576 and d["repeats"]==3
          assert not d["model_retrained"] and d["same_answer_and_halt_step"]
          assert d["family_derivation_disclosed"] and d["timing_includes_feature_and_policy_overhead"]
          assert not d["source_born_independently"] and not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert d["frozen_head_sha256"]=="415020f5dfa310b63c15b579045a53811062a72e467789f7af69a42ae575ac39"
          assert collections.Counter(r["family"] for r in d["rows"])=={80:144,81:144,82:144,83:144}
          assert collections.Counter(r["variant"] for r in d["rows"])==dict.fromkeys(range(6),96)
          assert all(r["answers"]["scalar"]==r["answers"]["old_nn"] for r in d["rows"])
          for mode in ("scalar","old_nn","full","static"):
            s=d["scores"][mode]
            assert s["correct"]==sum(r["answers"][mode]["answer"]==r["truth"] for r in d["rows"])
            assert s["steps"]==sum(r["answers"][mode]["steps"] for r in d["rows"])
            assert s["wall_ns_by_repeat"]==[sum(r["timing_ns"][mode][i] for r in d["rows"]) for i in range(3)]
            assert all(0<=r["answers"][mode]["steps"]<=r["depth"] for r in d["rows"])
          assert d["scores"]["full"]["steps"]==sum(r["depth"] for r in d["rows"])
          assert d["registered_verdict"] in ("DEVELOPMENT_FROZEN_SCALAR_OUTPERFORMS_CHEAP_STATIC",
            "DEVELOPMENT_FROZEN_SCALAR_ROBUST_NO_NET_GAIN",
            "DEVELOPMENT_FROZEN_SCALAR_POLICY_NOT_ROBUST","INVALID_TYPED_FULL_CONTROL")
          print("Y_F16_VERDICT",d["registered_verdict"])
          print("Y_F16_GAINS",d["wall_saved_by_repeat"])
          print("Y_F16_SCORES",d["scores"])
          PY
      - name: One complete repository regression
        run: python3 -m pytest -q tests
