name: WSP152 source-free confidence ceiling and full inherited regression
on:
  push:
    branches: [research/wsp152-confidence-coverage-probe-20261117]
permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify single-file frozen prereg, parent, no original scientific first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse d7698974f5c2930a0bbf54ed137d41f5c6dad340^)" = "86595cd728c2978502f877e2cd6b61a9802e00d9"
          test "$(git diff-tree --no-commit-id --name-only -r d7698974f5c2930a0bbf54ed137d41f5c6dad340)" = "research/contrib/chatgpt/WSP-152/prereg.json"
          git merge-base --is-ancestor d7698974f5c2930a0bbf54ed137d41f5c6dad340 HEAD
          git diff --exit-code d7698974f5c2930a0bbf54ed137d41f5c6dad340 HEAD -- research/contrib/chatgpt/WSP-152/prereg.json
          git diff --exit-code 86595cd728c2978502f877e2cd6b61a9802e00d9 HEAD -- research/contrib/chatgpt/WSP-151 research/contrib/chatgpt/WSP-149
          test ! -e research/contrib/chatgpt/WSP-152/source.py
          test ! -e research/contrib/chatgpt/WSP-152/experiment.py
          test ! -e research/contrib/chatgpt/WSP-152/result.json
          test ! -e research/contrib/chatgpt/WSP-152/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-152/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Exact source-free ceiling, fabricated-policy, and negative checks
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-152 -p 'test_*.py' -v
      - name: Keep clean source
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(wsp152): source-pin G29 atlas' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: wsp152-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly derived G29 source index at fresh SHA
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code d7698974f5c2930a0bbf54ed137d41f5c6dad340 HEAD -- research/contrib/chatgpt/WSP-152/prereg.json
          git diff --exit-code 86595cd728c2978502f877e2cd6b61a9802e00d9 HEAD -- research/contrib/chatgpt/WSP-151 research/contrib/chatgpt/WSP-149
          test ! -e research/contrib/chatgpt/WSP-152/source.py
          test ! -e research/contrib/chatgpt/WSP-152/result.json
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp152): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp152-confidence-coverage-probe-20261117

  final-regression:
    needs: [preflight]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp152): pin G29 source atlas at ') && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact final source, pristine frozen science, and generated atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code d7698974f5c2930a0bbf54ed137d41f5c6dad340 HEAD -- research/contrib/chatgpt/WSP-152/prereg.json
          git diff --exit-code 86595cd728c2978502f877e2cd6b61a9802e00d9 HEAD -- research/contrib/chatgpt/WSP-151 research/contrib/chatgpt/WSP-149
          test ! -e research/contrib/chatgpt/WSP-152/source.py
          test ! -e research/contrib/chatgpt/WSP-152/result.json
          test ! -e research/contrib/chatgpt/WSP-152/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-152/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Static frozen WSP149 original negative, no source calls
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/contrib/chatgpt/WSP-149/result.json').read_text(encoding='utf8'))
          assert a['frozen_outcome']=='DEVELOPMENT_EXACT_WEIGHT_MEMORY_TRANSFER_NO_GO'
          assert a['cross_platform_all_nonresource_science_and_per_world_exact'] is True
          assert a['original_first_positive_study_sha']=='f0f3069dd36c10127214b677f02d66b7a22f7661'
          assert a['original_run']==44137575798
          print('WSP149_ORIGINAL_NEGATIVE_INTACT_WITHOUT_REPLAY')
          PY
      - name: Mandatory full inherited WSP135-151, WSP152 and complete root regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 138 139 140 141 142 143 144 145 146 147 148; do
            if [ -d "research/contrib/chatgpt/WSP-$n" ]; then
              python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
            fi
          done
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_exact_weights.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_source_custody.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-151 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-152 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
