name: CKAD30 pre-primary G29 source atlas materialization
on:
  push:
    branches: [research/ckad30-sparse-composition-20261118]
permissions:
  contents: read
jobs:
  refresh:
    if: "github.event.head_commit.message == 'ci(ckad30): materialize pre-primary G29 atlas'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild G29 only from exact pre-primary source; never score B
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/contrib/chatgpt/CKAD-30/campaign.py)" = 298bce2aa314374ce4dda7719f209b7d8ef11dea
          test ! -e research/contrib/chatgpt/CKAD-30/primary_result.json
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.json','.ice/code-atlas.html','.ice/code-atlas.ice'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ckad30): qualify pre-primary source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad30-sparse-composition-20261118
