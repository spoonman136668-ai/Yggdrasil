name: ITD-02 pinned MiniGrid memory source preflight
on:
  pull_request:
    paths:
      - 'research/native/itd02/minigrid_memory_event_contract.py'
      - 'tests/test_itd02_minigrid_memory_event_contract.py'
      - 'tests/test_itd02_minigrid_memory_source_preflight.py'
      - '.github/workflows/itd02-minigrid-memory-source-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-memory-source:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external-minigrid
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Public event contract focused tests
        run: python -B -m unittest discover -s tests -p test_itd02_minigrid_memory_event_contract.py -v
      - name: Verify clean pinned source and memory semantics statically
        env:
          MINIGRID_SOURCE: external-minigrid
        run: python -B -m unittest discover -s tests -p test_itd02_minigrid_memory_source_preflight.py -v
      - name: No local changes
        run: git diff --exit-code
