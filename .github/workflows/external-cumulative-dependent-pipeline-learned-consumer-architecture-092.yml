name: Yggdrasil learned cognition-consumer pilot 092
on:
  push:
    branches:
      - 'repair/y092-bounded-single-runtime-r2-validation'
    paths:
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.ice'
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092-manifest.json'
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-learned-consumer-architecture-092.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 'd311a56ea6a838f6025c5b32c3ef01f641e17748' HEAD
          git merge-base --is-ancestor '4a5a30845354aad1ed9809adc276c7e341a0a5f9' HEAD
          changed="$(git diff --name-only 'd311a56ea6a838f6025c5b32c3ef01f641e17748..HEAD' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-cumulative-dependent-pipeline-learned-consumer-architecture-092.yml' \
            'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.py' \
            'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092-manifest.json' \
            'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.ice' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse '4a5a30845354aad1ed9809adc276c7e341a0a5f9:research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.ice')" = 'd091140ebede7d41ad25436855d15f49975f3051'
          test "$(git rev-parse '4a5a30845354aad1ed9809adc276c7e341a0a5f9:research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092-manifest.json')" = '42dd1066845825b8337209efec7c5cdb0cba8bc9'
          python - <<'PY'
          import json
          p=json.load(open("research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.ice"))
          m=json.load(open("research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092-manifest.json"))
          assert p["experiment"]=="EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-LEARNED-CONSUMER-ARCHITECTURE-092"
          assert p["candidate_search"]["candidate_count"]==4
          assert p["resource_envelope"]["capacity"]=="16 total / 7 active / 9 retained"
          assert p["governance"]["broad_continual_training"] is False
          assert m["manifest_sha256"]=="ea4dfd21ac7d2b6bc98e8e26c45bfef768a0bf9ea6d2a3502ab67469df346cf3"
          assert m["source_count"]==6 and m["total_prefix_bytes"]==114544
          PY
      - name: Verify exact READY_RESEARCH receipt
        shell: bash
        env:
          AUTHORITY_RECEIPT_SHA256: '1068c8dbc0ed8219fbefbb37c5a2dff82b94886e6dd3a390611504f7d6c77a50'
          AUTHORITY_RECEIPT_B64: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib
          raw=base64.b64decode(os.environ["AUTHORITY_RECEIPT_B64"],validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ["AUTHORITY_RECEIPT_SHA256"]
          r=json.loads(raw)
          assert r["schema"]=="ckb-plane.external-exposure-ready-research-receipt.v1"
          assert r["project"]=="Yggdrasil"
          assert r["experiment"]=="EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-LEARNED-CONSUMER-ARCHITECTURE-092"
          assert r["preregistration_sha"]=="4a5a30845354aad1ed9809adc276c7e341a0a5f9"
          assert r["manifest_sha256"]=="ea4dfd21ac7d2b6bc98e8e26c45bfef768a0bf9ea6d2a3502ab67469df346cf3"
          assert r["ckb_plane_main_sha"]=="6916c3c80428b2fa111bbc636025b29fc1bb4304"
          assert r["plan_decision"]["disposition"]=="READY_PLAN"
          assert r["fetch_decision"]["disposition"]=="READY_FETCH"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_bytes(raw)
          PY
      - name: Fetch frozen historical and sealed unseen contexts
        shell: bash
        run: |
          set -euo pipefail
          for n in transfer third fourth fifteenth sixteenth; do mkdir -p "$RUNNER_TEMP/y092-$n"; done
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          roots={n:root/("y092-"+n) for n in ("transfer","third","fourth","fifteenth","sixteenth")}
          historical={
            "transfer":[
              ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py",61896,"3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
              ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json",14490,"ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
              ("technical_prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md",3124,"c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b")],
            "third":[
              ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c",303863,"9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
              ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json",118601,"d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
              ("technical_prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md",11025,"61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017")],
            "fourth":[
              ("code","https://raw.githubusercontent.com/kubernetes/kubernetes/e7967bb9b76d43a6388abb7a4e90d2f899ef97ff/pkg/kubelet/kubelet.go",156626,"e0f247ef45cb281166b58ba1a013dc6925023388193bd74c1f126c695b770d34",41453,"283073d9f6c0dd868c39a913364bce6744ff1e29c038f6920197c0d33e0c2ac1"),
              ("structured","https://raw.githubusercontent.com/microsoft/TypeScript/50d70a3f5f453a79a4323b263165da51f656a4e3/package-lock.json",143844,"52b6c9bd0a26ef1b0fc27dfbfaa00df6a047cdddd587d07c4f6c1c3345faf5cf",14365,"a46fcfb7d862b03b750b61a5f667d4ac25a064df9ccb746e395db7e864068933"),
              ("technical_prose","https://raw.githubusercontent.com/django/django/a461af8ce48762d7ec602260aaff81014ddccbcb/docs/intro/tutorial01.txt",10844,"1cf1817e6211b7c0fa9e8044ee808fde1e8f16ca5f9d5ab5358510a5c9591b96",1454,"5d0c2efd139bd6094098bc893ed746020f03e0860a25f278348f43f47c236222")]}
          for group,sources in historical.items():
            for domain,url,full_n,full_h,prefix_n,prefix_h in sources:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"yggdrasil-y092"}),timeout=90).read(full_n+1)
              assert len(data)==full_n and hashlib.sha256(data).hexdigest()==full_h
              p=data[:prefix_n];assert hashlib.sha256(p).hexdigest()==prefix_h
              filename={"code":"code.bin","structured":"structured.bin","technical_prose":"technical-prose.bin"}[domain]
              (roots[group]/filename).write_bytes(p)
          manifest=json.load(open("research/experiments/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092-manifest.json"))
          assert manifest["manifest_sha256"]=="ea4dfd21ac7d2b6bc98e8e26c45bfef768a0bf9ea6d2a3502ab67469df346cf3"
          for group in manifest["unseen"]:
            name=group["name"]
            for src in group["sources"]:
              url=f"https://raw.githubusercontent.com/{src['repo']}/{src['commit']}/{urllib.parse.quote(src['path'])}"
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"yggdrasil-y092"}),timeout=90).read()
              got=hashlib.sha1((f"blob {len(data)}\0").encode()+data).hexdigest()
              assert got==src["git_blob"] and len(data)>=src["prefix_bytes"]
              p=data[:src["prefix_bytes"]]
              assert hashlib.sha256(p).hexdigest()==src["prefix_sha256"]
              filename={"code":"code.bin","structured":"structured.bin","technical_prose":"technical-prose.bin"}[src["domain"]]
              (roots[name]/filename).write_bytes(p)
          PY
          for n in transfer third fourth fifteenth sixteenth; do
            key="$(echo "$n" | tr '[:lower:]' '[:upper:]')_ROOT"
            echo "$key=$RUNNER_TEMP/y092-$n" >> "$GITHUB_ENV"
          done
      - name: Focused harness qualification
        run: python -m py_compile research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.py
      - name: Install native test surface
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Full Yggdrasil regression
        run: python -m pytest -q
      - name: Prove bounded single-run historical replay runtime
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          script='research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-learned-consumer-architecture-092.py'
          args=(--transfer-root "$TRANSFER_ROOT" --third-root "$THIRD_ROOT" --fourth-root "$FOURTH_ROOT" --fifteenth-root "$FIFTEENTH_ROOT" --sixteenth-root "$SIXTEENTH_ROOT")
          timeout --signal=TERM 3300s python "$script" "${args[@]}" --historical-probe-out /tmp/y092-runtime-probe.json
          python - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path("/tmp/y092-runtime-probe.json").read_text())
          assert p["schema"]=="yggdrasil.y092-historical-runtime-probe.v1"
          assert p["experiment"]=="EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-LEARNED-CONSUMER-ARCHITECTURE-092"
          assert p["historical_context_count"]==3
          assert p["historical_full_pool_row_count"]==17
          assert p["historical_identity_mismatch_count"]==0
          assert p["invalid_evaluation_rows"]==0
          assert len(p["candidate_history"])==4
          assert p["historical_cache_entries"]>0
          print("Y092_BOUNDED_HISTORICAL_RUNTIME_PROOF=PASS")
          print("elapsed_ns="+str(p["elapsed_ns"]))
          print("cache_entries="+str(p["historical_cache_entries"]))
          PY
      - name: Delete external bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP"/y092-*
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-learned-consumer-architecture-092
          path: |
            /tmp/authority.json
            /tmp/y092-runtime-probe.json
          if-no-files-found: error
