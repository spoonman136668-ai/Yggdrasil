name: WSP149 prospective transfer and exact-source qualification
on:
  push:
    branches: [research/wsp149-exact-gf2-memory-transfer-20261117]
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze prereg and no original protected first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r b74f205d7ed02fe6d29a714e91a378e9152beb0d)" = "research/contrib/chatgpt/WSP-149/prereg.json"
          git merge-base --is-ancestor b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD
          git diff --exit-code b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD -- research/contrib/chatgpt/WSP-149/prereg.json
          git diff --exit-code 233e7e3cc6714d698172824969fbb1f8c674c150 HEAD -- research/contrib/chatgpt/WSP-148 research/contrib/chatgpt/WSP-147
          test ! -e research/contrib/chatgpt/WSP-149/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-149/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Source-free exact coefficient and owner negative controls
        run: |
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_exact_weights.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_source_custody.py' -v
      - name: AST syntax of frozen source and independent study; no source calls
        shell: bash
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ('source.py','experiment.py','test_source_study.py','exact_weights.py'):
              p=Path('research/contrib/chatgpt/WSP-149')/name
              ast.parse(p.read_text(encoding='utf8'),filename=str(p))
          print('WSP149_SOURCE_FREE_AST_PASS')
          PY
          test -z "$(git status --porcelain)"
  first-public-source:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(wsp149): first public synthetic source once' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original synthetic once and no old data change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%s HEAD)" = "ci(wsp149): first public synthetic source once"
          git diff --exit-code b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD -- research/contrib/chatgpt/WSP-149/prereg.json
          test ! -e research/contrib/chatgpt/WSP-149/result.json
          test ! -e research/contrib/chatgpt/WSP-149/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-149/SCIENTIFIC_PASS.json
      - name: First fresh public FIT worlds and independent TRANSFER controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_source_study.py' -v
      - name: No source output file mutations
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(wsp149): source-pin G29 atlas' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: wsp149-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate only three source-pinned derived G29 atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -f research/contrib/chatgpt/WSP-149/result.json
          test ! -e research/contrib/chatgpt/WSP-149/SCIENTIFIC_PASS.json
          git diff --exit-code b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD -- research/contrib/chatgpt/WSP-149/prereg.json
          git diff --exit-code 233e7e3cc6714d698172824969fbb1f8c674c150 HEAD -- research/contrib/chatgpt/WSP-148 research/contrib/chatgpt/WSP-147
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp149): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp149-exact-gf2-memory-transfer-20261117
  final-regression:
    needs: [preflight]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp149): pin G29 source atlas at ') && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen source receipt, no first-use replay, pinned derived G29 atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD -- research/contrib/chatgpt/WSP-149/prereg.json
          git diff --exit-code 916f7eca01553c5db6454662cd36b75988673942 HEAD -- research/contrib/chatgpt/WSP-149
          git diff --exit-code 233e7e3cc6714d698172824969fbb1f8c674c150 HEAD -- research/contrib/chatgpt/WSP-148 research/contrib/chatgpt/WSP-147
          test ! -e research/contrib/chatgpt/WSP-149/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-149/SCIENTIFIC_PASS.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Static verify frozen original raw scientific results without re-querying WSP149 source
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/contrib/chatgpt/WSP-149/result.json')
          a=json.loads(p.read_text(encoding='utf8'))
          assert a['frozen_outcome']=='DEVELOPMENT_EXACT_WEIGHT_MEMORY_TRANSFER_NO_GO'
          assert a['cross_platform_all_nonresource_science_and_per_world_exact'] is True
          assert a['original_first_positive_study_sha']=='f0f3069dd36c10127214b677f02d66b7a22f7661'
          assert a['original_run']==44137575798
          for name in ('linux','windows'):
              r=a['platform_raw_results'][name]
              assert r['source_safe_charged_public_effects']==6144
              assert r['protected_original_effects']==0
              assert r['all_exact_fits_32_effects']==192
              assert all(x==512 for x in r['cold_relabel_512'].values())
              assert r['scientific_pass'] is False
          assert a['platform_raw_results']['linux']['source_owner_receipts_sha256']==a['platform_raw_results']['windows']['source_owner_receipts_sha256']
          print('WSP149_ORIGINAL_FROZEN_RESULTS_NO_REPLAY_PASS')
          PY
      - name: Mandatory all inherited WSP135-148 plus WSP149 source-free and complete root regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 138 139 140 141 142 143 144 145 146 147 148; do
            if [ -d "research/contrib/chatgpt/WSP-$n" ]; then
              python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
            fi
          done
          # Deliberately exclude WSP149 first-use positive study:
          # original run 44137575798 is frozen, reproducible and archived.
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_exact_weights.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_source_custody.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
