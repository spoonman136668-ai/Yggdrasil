name: ITD-02 V31M legacy-assertion diagnosis
on:
  push:
    branches: [research/itd02-v31m-assertion-triage-20261028]
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin immutable v12 source and freeze chronological prereg
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2380f6e0527e12505382f5d92646a951a1a47569 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Run seven inherited failed assertions independently with no waivers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31m"
          set +e
          PYTHONPATH=.:tests python -B -m unittest -v             test_itd02_cell_temporal_register_dev.LocalRegisterTests.test_real_retention_per_public_transition_and_frozen_veto             test_itd02_two_phase_public_native_dev.TemporalLocalPublicTests.test_each_reward_cell_sees_unique_15_contexts_across_two_phases             test_itd02_neighbor_trace_dev.NeighborTraceTests.test_frozen_never_updates_neighbor_state             test_itd02_neighbor_trace_dev.NeighborTraceTests.test_reward_site_traces_react_to_two_neighbor_bits             test_itd02_context_credit_v7_dev.TestContextCredit.test_only_observed_context_and_action_credit_changes             test_itd02_local_credit_v6_dev.LocalCredit.test_selected_only             test_code_atlas.G29.test_source_and_pinned_artifact > "$RUNNER_TEMP/v31m/seven.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$RUNNER_TEMP/v31m/exit"
          python - "$RUNNER_TEMP/v31m" <<'PY'
          import json,pathlib,re,sys
          p=pathlib.Path(sys.argv[1]);s=(p/"seven.log").read_text(errors="replace")
          names=sorted(set(re.findall(r'^(?:FAIL|ERROR): ([^\n]+)',s,re.M)))
          assert len(names)>=7,(names,s[-2000:])
          result={"classification":"V31M_SOURCE_ASSERTION_TRIAGE__INHERITED_BLOCKED__NO_SCIENCE",
            "failed_assertions":names,"schema_v8_explicit_legacy_expectations":5,
            "seven_run_exit_status":int((p/"exit").read_text()),
            "native_source_modified":False,"q_holdout_evaluated":False,"scientific_first_use":False}
          (p/"report.json").write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain original test traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31m-${{ matrix.os }}
          path: ${{ runner.temp }}/v31m/*
          retention-days: 7
          if-no-files-found: warn
