name: Quine P0 isolated engineering regression
'on':
  push:
    branches:
      - research/causal-quine-retention-p0-20261119
      - research/causal-amalgam-g41-native-capacity-20261121
permissions:
  contents: read
jobs:
  atlas:
    if: "github.event.head_commit.message == 'ci(quine): seal P0 source atlas' || github.event.head_commit.message == 'ci(g41): seal native capacity atlas'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Seal source atlas on isolated PR branch only
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_REF_NAME" in
            research/causal-quine-retention-p0-20261119|research/causal-amalgam-g41-native-capacity-20261121) ;;
            *) echo "G41_UNRECOGNIZED_BRANCH"; exit 1 ;;
          esac
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f 1)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(quine): atlas for $GITHUB_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regression:
    needs: atlas
    if: github.ref_name == 'research/causal-quine-retention-p0-20261119'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      EXPECTED_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check P0 custody and unchanged frozen scientific source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          git rev-parse HEAD HEAD^{tree}
          AMALGAM=research/contrib/chatgpt/CAUSAL-AMALGAM
          git diff --exit-code 86264b41a08d49f558418c0fba367f3a2636befa HEAD -- \
            "$AMALGAM/transfer_curve.py" "$AMALGAM/transfer_curve_protocol.json" \
            "$AMALGAM/transfer-curve-dev-01" "$AMALGAM/selection_protocol_dev.json" \
            yggdrasil/native_causal_amalgam.py yggdrasil/native_cumulative_learner.py \
            yggdrasil/native_episode_experience.py
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          root = Path("research/contrib/chatgpt/CAUSAL-AMALGAM")
          data = (root / "transfer_curve_protocol.json").read_bytes()
          assert sha256(data).hexdigest() == "22edfde67e981c561ade96b988e4ae9ba1f0d8cf2fb3ae6c9560b6f421b8a60e"
          selection = json.loads((root / "selection_protocol_dev.json").read_bytes())
          assert selection["joint_sha256"] == "576370a1963158f7dc43099360f491eb6a1e49355448922943b6bde374d484c8"
          print("P0_SOURCE_AND_PROTOCOL_PINS=PASS")
          PY
      - name: Install exact native test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Quine hard-veto and exact-prefix controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v tests/test_amalgam_quine_retention.py
          python -B -c "from pathlib import Path; p = Path('research/contrib/chatgpt/CAUSAL-AMALGAM/quine_retention.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec')"
      - name: Full inherited native and research regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py'
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
      - name: Authenticate archived P0 research-only cold policy readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: spoonman136668-ai/Yggdrasil
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quine-p0-original-research"
          mkdir -p "$archive"
          # Download original completed research archives only; no source actions.
          gh run download 44391641043 -n CKAD26-refresh-primary -D "$archive"
          gh run download 44420677720 -n YGG-JEPA2-03-ubuntu-latest -D "$archive"
          gh run download 44499793023 -n Amalgam-shared-consequence-ubuntu-latest -D "$archive"
          python -B research/contrib/chatgpt/CAUSAL-AMALGAM/archive_p0_cold_replay.py "$archive"
          # Authenticate BOTH independently archived original research checkpoint JSONs.
          archived_windows="$RUNNER_TEMP/quine-p0-original-research-windows"
          mkdir -p "$archived_windows"
          gh run download 44499793023 -n Amalgam-shared-consequence-windows-2022 -D "$archived_windows"
          # This calls original NativeEpisodeExperience.restore and NativeCumulativeLearner.restore.
          # The SHA-pinned Linux/Windows unpacked originals must agree exactly; cold restore twice.
          python -B research/contrib/chatgpt/CAUSAL-AMALGAM/native_segment_unpacked_acceptance.py \
            "$archive/amalgam-joint-state.json" \
            "$archived_windows/amalgam-joint-state.json" \
            | tee "$RUNNER_TEMP/g39-original-native-restore.json"
      - name: Verify committed G29 atlas and clean exact-source tree
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          git status --porcelain
          test -z "$(git status --porcelain)"

  g41-native-dev-regression:
    needs: atlas
    if: github.ref_name == 'research/causal-amalgam-g41-native-capacity-20261121'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      EXPECTED_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check isolated G41 candidate ancestry and source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          git merge-base --is-ancestor bbcca1d06d394a7bcfdc514f4e04bb269cb023cb HEAD
          git merge-base --is-ancestor 285e2e116d2f0b5f1ad986036c41bc623c3b3a57 HEAD
          git rev-parse HEAD HEAD^{tree}
          git diff --name-only bbcca1d06d394a7bcfdc514f4e04bb269cb023cb HEAD | while IFS= read -r path; do
            case "$path" in
              yggdrasil/native_episode_experience.py|yggdrasil/native_causal_amalgam.py|yggdrasil/native_jepa2_multilearner.py|yggdrasil/native_jepa_temporal.py|research/contrib/chatgpt/CAUSAL-AMALGAM/segmented_episode_checkpoint.py|tests/test_amalgam_segmented_episode_checkpoint.py|tests/test_native_episode_growth_g41.py|tests/test_g41_amalgam_capacity_integration.py|.github/workflows/causal-quine-retention-p0.yml|.ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json) ;;
              *) echo "G41_OUT_OF_SCOPE_CHANGE: $path"; exit 1 ;;
            esac
          done
          git diff --exit-code 86264b41a08d49f558418c0fba367f3a2636befa HEAD -- \
            research/contrib/chatgpt/CAUSAL-AMALGAM/transfer_curve.py \
            research/contrib/chatgpt/CAUSAL-AMALGAM/transfer_curve_protocol.json \
            research/contrib/chatgpt/CAUSAL-AMALGAM/selection_protocol_dev.json
          echo G41_FROZEN_RESEARCH_AND_CHANGE_SCOPE_PASS
      - name: Install pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full 2048 native DEV stress and 2049 reject, G41 focused negatives
        shell: bash
        env:
          YGG_G41_FULL_2048: '1'
          YGG_G41_EARLY_1033: '1'
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            tests/test_native_episode_growth_g41.py \
            tests/test_g41_amalgam_capacity_integration.py \
            tests/test_amalgam_segmented_episode_checkpoint.py
          echo G41_FOCUSED_NATIVE_FULL_DEV_PASS
      - name: Complete inherited native and research regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py'
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
          echo G41_FULL_INHERITED_REGRESSION_PASS
      - name: Archived original native compatibility, read only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: spoonman136668-ai/Yggdrasil
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g41-original"
          gh run download 44499793023 -n Amalgam-shared-consequence-ubuntu-latest -D "$RUNNER_TEMP/g41-original"
          python -B - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from yggdrasil.native_context_basis import digest
          from yggdrasil.native_episode_experience import NativeEpisodeExperience
          from yggdrasil.native_cumulative_learner import NativeCumulativeLearner
          import json, os
          joint=json.loads((Path(os.environ["RUNNER_TEMP"])/"g41-original"/"amalgam-joint-state.json").read_bytes())
          parent=joint["native_ascii"].encode("ascii")
          episode=json.loads(parent)["experience_ascii"].encode("ascii")
          assert sha256(parent).hexdigest()=="5720151e18b52f7219763027c2ad9c7c37476e099b4334e42417615adb7f959d"
          assert sha256(episode).hexdigest()=="9158254b80f147d7eb7516d630f6003441df4b8373375b994d864ee1d55568f4"
          assert NativeEpisodeExperience.restore(episode,digest(episode)).checkpoint()==episode
          outer=NativeCumulativeLearner.restore(parent,digest(parent))
          assert outer.checkpoint()==parent
          assert outer._episode_reader().checkpoint()==episode
          print("G41_ORIGINAL_NATIVE_1025_COLD_ABI_PASS")
          PY
          mkdir -p "$RUNNER_TEMP/g41-original-native-parent" "$RUNNER_TEMP/g41-original-donor-parent"
          gh run download 44391641043 -n CKAD26-refresh-primary -D "$RUNNER_TEMP/g41-original-native-parent"
          gh run download 44420677720 -n YGG-JEPA2-03-ubuntu-latest -D "$RUNNER_TEMP/g41-original-donor-parent"
          YGG_G41_ORIGINAL_DIR="$RUNNER_TEMP" YGG_G41_TRAINED_1153=1 \
            python -B -m unittest -v \
              tests.test_g41_amalgam_capacity_integration.G41CapacityIntegrationTests.test_original_trained_root_four_heads_1153
          echo G41_ORIGINAL_TRAINED_FOUR_HEAD_1153_PASS
          YGG_G41_ORIGINAL_DIR="$RUNNER_TEMP" YGG_G41_TRAINED_2048=1 YGG_G41_RETENTION_2048=1 \
            python -B -m unittest -v \
              tests.test_g41_amalgam_capacity_integration.G41CapacityIntegrationTests.test_original_trained_root_four_heads_2048_cold_replay_and_2049_veto
          echo G41_ORIGINAL_TRAINED_FOUR_HEAD_2048_COLD_AND_RETROSPECTIVE_DIAGNOSTIC_PASS
      - name: Final sealed atlas and exact worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo G41_ATLAS_AND_CLEAN_TREE_PASS
