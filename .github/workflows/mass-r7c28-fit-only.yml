name: Mass R7-C28 original-source FIT-only causal information value qualification
on:
  push:
    branches:
      - research/mass-r7c28-observation-value-fit-20261025
permissions:
  contents: read
concurrency:
  group: mass-r7c28-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-minigrid-three-arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: research
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate source-first freeze, owner source, upstream original
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$GITHUB_SHA"
          git -C research merge-base --is-ancestor b7f05b2f41b264e1349a47594b81e32007f2e56a "$GITHUB_SHA"
          test "$(git -C external/minigrid rev-parse HEAD)" = "7f5853792ea7f04f75614661006d87fcf949f26d"
          test "$(git -C external/minigrid hash-object minigrid/envs/dynamicobstacles.py)" = "68436cecc35116c23c2f196c22fa3a19c6410b95"
          test "$(git -C research hash-object research/native/itd02/r1/native_policy.py)" = "3aa22b1e418a7f8cd9619c476f02b8c614917b16"
          test "$(git -C research hash-object research/native/itd02/r2/affordance_cells.py)" = "f7e47dfef309e1c0bcc871d518154fd950b3eca0"
          test "$(git -C research hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          python -m py_compile research/research/mass_r7c28/run.py research/research/mass_r7c28/compare.py
          echo "R7C28_FROZEN_FIT_ONLY_SOURCE=PASS"
      - name: Install exact upstream original package (no paid services)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./external/minigrid
      - name: Focused original native learner regression
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r1 -p test_native_policy.py -q
          python -B -m unittest discover -s research/native/itd02/r2 -p test_affordance_cells.py -q
          python -B -m unittest discover -s research/native/itd02/r3 -p test_navigator.py -q
          echo "R7C28_OWNER_ORIGINAL_NATIVE_FOCUSED=PASS"
      - name: FIT-only true source action-consequence information-value and matched learner qualifier
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mass-r7c28-results"
          # Native FIT prerequisite first in two independent source processes.
          for rep in 1 2; do
            python -B research/mass_r7c28/run.py --kind native --out "$RUNNER_TEMP/mass-r7c28-results/native-$rep.json"
          done
          # Source-original mechanistic veto is not a runner failure:
          # if no native causal signal, never execute FIT validation or controls.
          qualified="$(python -c "import json,sys; x=json.load(open(sys.argv[1])); print('yes' if x['gate']=='FIT_CAUSAL_INFORMATION_IDENTIFIED_TRAIN_ONLY' else 'no')" "$RUNNER_TEMP/mass-r7c28-results/native-1.json")"
          if [ "$qualified" = yes ]; then
            for rep in 1 2; do
              python -B research/mass_r7c28/run.py --kind conventional --out "$RUNNER_TEMP/mass-r7c28-results/conventional-$rep.json"
            done
          else
            echo "R7C28_FIT_GATE_BLOCKED_CONVENTIONAL_AND_VALIDATION=YES"
          fi
          python -B research/mass_r7c28/compare.py "$RUNNER_TEMP/mass-r7c28-results"
      - name: Preserve complete original-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mass-r7c28-original-source-fit-causal-value-evidence
          path: ${{ runner.temp }}/mass-r7c28-results/
          if-no-files-found: warn
          retention-days: 80
