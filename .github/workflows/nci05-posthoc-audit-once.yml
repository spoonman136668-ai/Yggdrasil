name: NCI-05 sourcefree posthoc stronger-control exact-SHA audit (one shot)
'on':
  push:
    branches: [research/nci05-posthoc-strong-control-qualifier-20261119]
    paths: ['.github/workflows/nci05-posthoc-audit-once.yml']
permissions:
  contents: read
jobs:
  sourcefree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable auto CRLF
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 46e7ac86c5978812effe4dfbab622fd1f909e6a1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source SHA, original and prior source-first receipts
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          test "$(git rev-parse HEAD)" = "46e7ac86c5978812effe4dfbab622fd1f909e6a1"
          test "$(git hash-object "$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git rev-parse '21553596e3da52e0f4f5afe335792c9d346aa0dd':"$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git hash-object "$root/challenge_prereg.json.txt")" = 5ba9503358d634c729c2220f9ce5c3e4b9cb6149
          test "$(git rev-parse '69f797974ad2fa41f10a214d32b59dc50ebbcbcd':"$root/challenge_prereg.json.txt")" = 5ba9503358d634c729c2220f9ce5c3e4b9cb6149
          test "$(git hash-object "$root/role_probe.py.txt")" = 86a3e461dbd3bf0adc0e172321f087ceed4c0e51
          test "$(git hash-object "$root/challenge_guard.py.txt")" = d8e6f690a0e3c9acd46b23904b207e9d6a72f187
          test "$(git hash-object "$root/strong_fixed_control_audit.py.txt")" = 8ba5fa10874ad261fc392ef378184a6dd5c50e09
          test "$(git hash-object "$root/test_strong_fixed_control_audit.py.txt")" = 4113176740c143f97be7b6995df6b022c6a902a2
          echo NCI05_STRONG_CONTROL_SOURCE_CUSTODY_PASS
      - name: Mandatory full native original regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo NCI05_STRONG_CONTROL_FULL_NATIVE_REGRESSION_PASS
      - name: Original and new source-free tests, complete symbolic audit
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          d="$RUNNER_TEMP/nci05-strong-control"
          mkdir -p "$d"
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          cp "$root/challenge_prereg.json.txt" "$d/challenge_prereg.json.txt"
          for name in role_probe test_role_probe challenge_guard test_challenge_guard strong_fixed_control_audit test_strong_fixed_control_audit; do
            cp "$root/$name.py.txt" "$d/$name.py"
            test "$(git hash-object "$d/$name.py")" = "$(git hash-object "$root/$name.py.txt")"
          done
          (cd "$d" && python -B -m unittest -v test_role_probe test_challenge_guard test_strong_fixed_control_audit)
          (cd "$d" && python -B strong_fixed_control_audit.py)
          echo NCI05_STRONG_CONTROL_POSTHOC_840_LAWS_624_ALIASES_PASS
      - name: Exact checkout unchanged, no owner/private source access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "46e7ac86c5978812effe4dfbab622fd1f909e6a1"
          test -z "$(git status --porcelain)"
          echo NCI05_STRONG_CONTROL_CLEAN_NO_OWNER_CHANGE_PASS
