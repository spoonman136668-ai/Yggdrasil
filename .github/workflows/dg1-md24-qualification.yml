name: DG1-MD24 novel blocker public-only toy qualification
on:
  push:
    branches: [research/dg1-md24-unknown-blocker-transfer-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md24-20261114/**'
      - '.github/workflows/dg1-md24-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualify:
    name: MD24 toy-only and source-pinned inherited regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen MD24 parent, predecessor untouched, and exact tree identity
        shell: bash
        run: |
          test "$(git rev-parse 81e167c174097df83e50e57e0ae6494231cbd032^)" = "9b0557f2cfe829d7991fd41c9f131c41a141626f"
          git merge-base --is-ancestor 81e167c174097df83e50e57e0ae6494231cbd032 HEAD
          git diff --exit-code 9b0557f2cfe829d7991fd41c9f131c41a141626f HEAD -- \
            research/contrib/chatgpt/dg1-md23-20261114/md23.py \
            research/contrib/chatgpt/dg1-md23-20261114/registered_md23.py \
            research/contrib/chatgpt/dg1-md23-20261114/prereg.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("research/contrib/chatgpt/dg1-md24-20261114/prereg.json").read_text())
          assert x["experiment_id"]=="DG1-MD24-20261114"
          assert x["status"]=="PREREGISTRATION_ONLY_NO_PRIMARY_FIRST_USE"
          assert x["base_commit"]=="9b0557f2cfe829d7991fd41c9f131c41a141626f"
          assert len(x["frozen_design"]["arms"])==6
          print("MD24_FROZEN_PREREG_PAST_SOURCE_AND_PREDECESSOR_UNCHANGED_PASS")
          PY
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install exact pinned public CPU dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python -m pip freeze > md24-toy-packages.txt
          python - <<'PY'
          from importlib.metadata import version
          for pkg,v in (("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")):
              assert version(pkg)==v
          print("MD24_PINNED_PUBLIC_CPU_PACKAGES_PASS")
          PY
      - name: Disjoint toy-only source and semantic/negative tests; NO primary seed
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md24-20261114/md24.py research/contrib/chatgpt/dg1-md24-20261114/test_md24.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md24-20261114 -p 'test_md24.py' -v
      - name: Build new pinned G29 code atlas before inherited regression
        id: atlas
        shell: bash
        run: |
          python - <<'PY'
          import base64,os,subprocess
          from pathlib import Path
          names=(".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice")
          def git(*args):
              return subprocess.check_output(("git",)+args,text=True).strip()
          head=git("rev-parse","HEAD")
          changed=set(git("diff","--name-only","HEAD^","HEAD").splitlines())
          atlas_only=changed==set(names)
          source=git("rev-parse","HEAD^") if atlas_only else head
          subprocess.run(("python","scripts/build_code_atlas.py",
                          "--source-commit",source,"--write"),check=True)
          committed=atlas_only and all(subprocess.check_output(
              ("git","show","HEAD:"+p))==Path(p).read_bytes() for p in names)
          if not committed and os.environ.get("RUNNER_OS")=="Linux":
              for p in names:
                  encoded=base64.b64encode(Path(p).read_bytes()).decode("ascii")
                  chunks=[encoded[i:i+1200] for i in range(0,len(encoded),1200)]
                  for i,chunk in enumerate(chunks):
                      print("MD24_ATLAS_B64|"+p+"|"+str(i)+"|"+
                            str(len(chunks))+"|"+chunk,flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("committed="+str(committed).lower()+"\n")
              f.write("source="+source+"\n")
          print("MD24_G29_SOURCE:"+source)
          print("MD24_G29_COMMITTED:"+str(committed))
          PY
      - name: Full inherited regression on exact committed G29 source
        if: steps.atlas.outputs.committed == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check
          git diff --exit-code -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
      - name: Source-only preflight requires exclusively derived uncommitted atlas
        if: steps.atlas.outputs.committed != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed=={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"},changed
          print("MD24_SOURCE_ONLY_TOY_PASS_PENDING_DERIVED_ATLAS_COMMIT")
          PY
      - name: GitHub-only toy environment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-md24-toy-prefirstuse-${{ matrix.os }}
          path: md24-toy-packages.txt
          if-no-files-found: ignore
