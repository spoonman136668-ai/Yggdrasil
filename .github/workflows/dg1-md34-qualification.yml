name: DG1-MD34 partial-observation causal routes physics qualification
on:
  push:
    branches: [research/dg1-md34-partial-observation-causal-routes-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md34-20261114/**'
      - '.github/workflows/dg1-md34-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    name: MD34 complete regression and anti-shortcut physics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable prereg-before-source, parent and derived atlas
        shell: bash
        run: |
          git merge-base --is-ancestor ba1ba1fc56a42e41913e6ecfaf2ab1f68de2642c HEAD
          git merge-base --is-ancestor 665bd80646ae675d32f2a875dde72387be226d2d HEAD
          git diff --exit-code 665bd80646ae675d32f2a875dde72387be226d2d HEAD -- research/contrib/chatgpt/dg1-md34-20261114/prereg.json
          git diff --exit-code ba1ba1fc56a42e41913e6ecfaf2ab1f68de2642c HEAD -- research/contrib/chatgpt/dg1-md30-20261114 research/contrib/chatgpt/dg1-md31-20261114 research/contrib/chatgpt/dg1-md32-20261114 research/contrib/chatgpt/dg1-md33-20261114
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path("research/contrib/chatgpt/dg1-md34-20261114/prereg.json").read_text("utf-8"))
          assert p["status"]=="TASK_ONLY_FROZEN_BEFORE_GENERATOR_OR_OUTCOMES"
          assert p["source_parent"]=="ba1ba1fc56a42e41913e6ecfaf2ab1f68de2642c"
          assert p["fixture"]["synthetic_only_seed_range"]==[15000,15095]
          assert p["observation_and_physics"]["global_probe_cap"]==1
          a=json.loads(Path(".ice/code-atlas.json").read_text("utf-8"))
          source=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          assert a["source_commit"]==source,(a["source_commit"],source)
          print("MD34_PREREG_FROZEN_BEFORE_SOURCE_PASS")
          print("MD34_PRIOR_NULLS_AND_MD33_MODELS_UNMODIFIED_PASS")
          PY
          python scripts/build_code_atlas.py --check
      - name: Install exact pinned inherited regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python - <<'PY'
          from importlib.metadata import version
          for k,w in (("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")):
              assert version(k)==w,(k,version(k))
          print("MD34_PINNED_CPU_REQUIREMENTS_PASS")
          PY
      - name: Full inherited Yggdrasil regression (54)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          echo MD34_MANDATORY_FULL_INHERITED_54_PASS
      - name: Frozen MD30 and MD31 tests (32 plus 7)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s research/contrib/chatgpt/dg1-md30-20261114 -p 'test_*.py' -v
          python -m unittest discover -s research/contrib/chatgpt/dg1-md31-20261114 -p 'test_*.py' -v
          echo MD34_FROZEN_MD30_MD31_39_PASS
      - name: Frozen MD32 and MD33 tests (8 plus 8)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s research/contrib/chatgpt/dg1-md32-20261114 -p 'test_*.py' -v
          python -m unittest discover -s research/contrib/chatgpt/dg1-md33-20261114 -p 'test_*.py' -v
          echo MD34_FROZEN_MD32_MD33_16_PASS
      - name: New MD34 physics and negative controls before fixture scoring
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md34-20261114/partial_routes.py research/contrib/chatgpt/dg1-md34-20261114/test_partial_routes.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md34-20261114 -p 'test_*.py' -v
          echo MD34_NEW_PARTIAL_CAUSAL_10_TESTS_PASS
      - name: Frozen fixture-only causal information headroom, no trained learner
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/contrib/chatgpt/dg1-md34-20261114/partial_routes.py > md34-task-result.json
          python - <<'PY'
          import json,subprocess,platform
          from pathlib import Path
          from importlib.metadata import version
          d=json.loads(Path("md34-task-result.json").read_text("utf-8"))
          assert d["status"]=="TASK_PHYSICS_PREFLIGHT_ONLY_NOT_MODEL_SCIENCE"
          assert d["official_first_use"] is False
          assert d["trained_agent_evaluated"] is False
          assert d["fixture_seed_range"]==[15000,15095]
          assert d["fixture_physical_worlds"]==192
          assert d["four_episode_law_blocks"]==24
          assert len(d["six_family_structural_manifest"]["six_mechanism_sha256"])==6
          assert d["oracle_mean_reward"]==0.94
          assert d["blind_mean_reward"]==-0.185
          assert d["one_paid_bit_mean_reward"]==0.1
          assert d["blind_success_fraction"]==0.25
          assert d["one_paid_bit_success_fraction"]==0.50
          assert d["oracle_minus_one_bit"]==0.84
          assert d["conventional_training_headroom"]=="UNVERIFIED"
          Path("md34-parity.json").write_bytes((json.dumps(d,sort_keys=True,separators=(",",":"),ensure_ascii=True)+chr(10)).encode("utf-8"))
          provenance={
              "schema":"md34.exact-source-task-physics-provenance.v1",
              "sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "source_sha":subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip(),
              "platform":platform.platform(),
              "python":platform.python_version(),
              "numpy":version("numpy"),"gymnasium":version("gymnasium"),
              "minigrid":version("minigrid"),
              "official_first_use":False,
              "trained_model_executed":False,
          }
          Path("md34-provenance.json").write_bytes((json.dumps(provenance,sort_keys=True,indent=2)+chr(10)).encode("utf-8"))
          print("MD34_TASK_PREFLIGHT_ONLY_PASS")
          print("MD34_ORACLE_BLIND_GAP:",d["oracle_minus_blind"])
          print("MD34_ORACLE_ONE_BIT_GAP:",d["oracle_minus_one_bit"])
          print("MD34_FIXED_ONE_BIT_POLICY_SUCCESS:",d["one_paid_bit_success_fraction"])
          print("MD34_NO_LEARNER_FIRST_USE_OR_SCIENTIFIC_PASS")
          PY
          python scripts/build_code_atlas.py --check
          git diff --exit-code
      - name: Retain source-locked synthetic fixture receipts in repo CI only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: md34-partial-physics-${{ matrix.os }}
          path: |
            md34-task-result.json
            md34-parity.json
            md34-provenance.json
          if-no-files-found: error
  parity:
    name: MD34 two-OS byte-exact physical action and one-bit causal evidence
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md34-partial-physics-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md34-partial-physics-windows-2022
          path: windows
      - name: Verify exact public physical receipts and original first-use fence
        shell: bash
        run: |
          cmp linux/md34-parity.json windows/md34-parity.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("linux/md34-parity.json").read_text("utf-8"))
          assert r["official_first_use"] is False
          assert r["trained_agent_evaluated"] is False
          assert r["oracle_minus_one_bit"]==0.84
          assert r["fixture_physical_worlds"]==192
          print("MD34_CROSS_OS_EXACT_PAID_PHYSICAL_ONE_BIT_PARITY_PASS")
          print("MD34_ORIGINAL_FIRST_USE_NOT_OPENED")
          PY
