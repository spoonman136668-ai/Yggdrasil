name: NCI-04 S4C0 Dual Native Conventional Recurrent Adequacy
on:
  push:
    branches:
      - research/nci04-s4c0-recurrent-adequacy-20261021
  pull_request:
    branches:
      - research/mr34f-prospective-history-controls-20261021
permissions:
  contents: read
concurrency:
  group: nci04-s4c0-dual-original-trained-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-frozen-control-training:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Prevent source-line-ending mutation on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact Yggdrasil S4C0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Independent original Farama MiniGrid source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Independent original DeepMind Pycolab source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Python for native source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned native original source dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 six==1.17.0 psutil==6.1.1 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Windows curses dependency for original Pycolab
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Reverify exact source-authored Farama original blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: True original source gradient qualification and frozen recurrent training
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.nci04_s4c0.recurrent_adequacy ../external/minigrid ../external/pycolab | tee ../nci04-s4c0-original-control.log
          grep -q '^NCI04_S4C0_INDEPENDENT_NATIVE_RECURRENT_ADEQUACY=' ../nci04-s4c0-original-control.log
      - name: Exact project and independent author source worktrees unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          git -C external/pycolab diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
          test -z "$(git -C external/pycolab status --porcelain)"
