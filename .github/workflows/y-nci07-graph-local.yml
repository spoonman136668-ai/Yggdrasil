name: Yggdrasil NCI07 Torch graph-local learned retained memory
on:
  push:
    branches: [research/y-nci07-graph-local-torch-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install native Yggdrasil Torch runtime
        run: python3 -m pip install -e '.[test]'
      - name: Exact original NCI06 and new science source identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a0c890e74317870c7d310da533d989a532fc3089 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-y-nci06/execute.py)" = 02796ae8722705bc54b5a5064262c9bfd36bb1f6
          test "$(git hash-object src/yggdrasil/pool.py)" = 0580da8f1a111c8c0b7b4ebfa51c2128865e7a8a
          test "$(git hash-object research/contrib/chatgpt/20261014-y-nci07/execute.py)" = 69391c53ef58ffce0127b3b3eb147b1cac42fea9
          test "$(git hash-object research/contrib/chatgpt/20261014-y-nci07/prereg.json)" = 68c0fc3b70bdd358c57d6943fc40f1ac6876a328
          python3 -m py_compile research/contrib/chatgpt/20261014-y-nci07/execute.py
          python3 -m json.tool research/contrib/chatgpt/20261014-y-nci07/prereg.json >/dev/null
      - name: Dev-only native Torch local-graph retention learning
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -B research/contrib/chatgpt/20261014-y-nci07/execute.py --phase development > /tmp/Y-NCI07-dev.json
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y-NCI07-dev.json"))
          assert a["phase"]=="development" and a["development_examples"]==25600
          assert len(a["weights"])==3 and a["learned_retention_parameters"]==4
          assert a["sealed_seed_range"]==[27680,27704]
          assert a["native_state_bytes"]==576 and a["capacity"]==7
          assert not a["nci01_full_acceptance"] and a["external_llm_calls"]==0
          print("Y07_DEV_VALIDATION",a["validation_accuracy"])
          PY
      - name: Execute exactly one original frozen new graph-family heldout
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          PYTHONPATH=src python3 -B research/contrib/chatgpt/20261014-y-nci07/execute.py --phase sealed > /tmp/Y-NCI07-original.json
          end=$(date +%s%N)
          printf '{"elapsed_wall_ms":%s,"runner":"ubuntu-latest","cost_usd":"unverified"}\n' "$(((end-start)/1000000))" > /tmp/Y-NCI07-resources.json
          python3 -m json.tool /tmp/Y-NCI07-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-NCI07-original-sealed-evidence
          path: |
            /tmp/Y-NCI07-original.json
            /tmp/Y-NCI07-resources.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify frozen original science rubric after evidence custody
        run: |
          python3 - <<'PY'
          import json,collections
          a=json.load(open("/tmp/Y-NCI07-original.json"))
          assert a["phase"]=="sealed" and a["sealed_seed_range"]==[27680,27704]
          assert len(a["records"])==96 and a["checkpoint_restores"]==96
          assert collections.Counter(r["family"] for r in a["records"])=={i:24 for i in range(4)}
          assert all(r["graph_edges"]==7 for r in a["records"])
          assert a["verdict"] in ("GRAPH_LOCAL_LEARNED_RETENTION_TRANSFER",
             "PARTIAL_GRAPH_LOCAL_RETENTION_GAIN","NO_GRAPH_LOCAL_RETENTION_TRANSFER")
          assert not a["nci01_full_acceptance"] and a["external_llm_calls"]==0
          assert not a["accepted_ref_mutation"]
          print("Y07_VERDICT",a["verdict"])
          print("Y07_ACCURACY",a["accuracy"])
          print("Y07_BY_FAMILY",a["by_family"])
          print("Y07_RESOURCE",a["join_candidate_evaluations"])
          PY
      - name: Full native Yggdrasil repository regression
        run: python3 -m pytest -q tests
