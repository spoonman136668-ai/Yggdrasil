name: Yggdrasil F75 mild arrival jitter source feasibility
on:
  push:
    branches:
      - research/y-f75-mild-public-order-source-feasibility-20261016-r1
permissions:
  contents: read
jobs:
  frozen-source-feasibility:
    if: "${{ github.event.head_commit.message == 'ci(y-f75): qualify mild public arrival jitter without using FIT' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source, prereg and unmodified F60 controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 734e77564b7a879943e2fe27dc8fc91696bbbdc7 HEAD
          test "$(git hash-object research/foundational/20261016-y-f75/prereg.json)" = 0abfd46d50b333ab854ab2c2f846740b532cf7e2
          test "$(git hash-object research/foundational/20261016-y-f75/source_feasibility.py)" = be05cd57d69b4bb7f9adc2b9bb5ca7c008a9c571
          test "$(git hash-object research/foundational/20261016-y-f63c/source.py)" = c04b73306861098eecf55db77b2db486aa918819
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
          test "$(git hash-object research/foundational/20261015-y-f62/audit_public.py)" = 383fff0bdd8c8b48fde9538d4e4d768db1c1896f
      - name: Independently qualify source graph under three frozen mild order perturbations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f75-source"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f75-source/exact-head.txt"
          python3 -B research/foundational/20261016-y-f75/source_feasibility.py --synthetic-only > "$RUNNER_TEMP/y-f75-source/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f75-source/result.json" >/dev/null
          python3 -B -c 'import os,json;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f75-source/result.json")));print("F75_LOCAL_JITTER_FEASIBILITY",d["by_order"]);print("F75_FULL_SOURCE_QUALIFICATION",d["source_family_qualifies_all_frozen_gates"]);assert d["all_public_multisets_identical"] and d["all_independent_72_prefix_audits_pass"] and not d["registered_FIT_train_used"]'
          sha256sum "$RUNNER_TEMP/y-f75-source/result.json" > "$RUNNER_TEMP/y-f75-source/sha256.txt"
          echo 'NO_PROSPECTIVE_EXPERIMENT_NO_F3=TRUE'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f75-mild-arrival-source-feasibility
          path: ${{ runner.temp }}/y-f75-source/
          retention-days: 90
          if-no-files-found: warn
