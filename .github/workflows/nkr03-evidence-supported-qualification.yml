name: NKR03 evidence-supported novel public causal relationships
on:
  push:
    branches: [research/nkr03-supported-public-evidence-20261115]
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin CPU numerical dependencies and prereg/source boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          python -c "import numpy as np;assert np.__version__=='2.2.6'"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 257a37a0e5c6c962191da5c247a2fc133eb9ba42 HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/contrib/chatgpt/NKR-03/prereg.json').read_text())
          assert j['status']=='FROZEN_BEFORE_IMPL_AND_SOURCE'
          assert j['frozen_scale']['audit_budget_descending_per_slot']==[12,8,4,0]
          assert j['frozen_scale']['slots']==16
          PY
          test -z "$(git status --porcelain)"
      - name: Fresh fabricated evidence, novel causal exception and legacy negative tests
        run: |
          python -m unittest discover -s tests -p test_native_relation_supported.py -v
          python -m unittest discover -s tests -p test_native_relation_memory.py -v
          python -m unittest discover -s tests -p 'test_native_cells*.py' -v
      - name: No hidden science source or generated dirt
        shell: bash
        run: test -z "$(git status --porcelain)"

  one-shot-source-pin:
    needs: [fixtures]
    if: "github.event.head_commit.message == 'ci(nkr03): arm G29 source-pin' && github.run_attempt == 1 && needs.fixtures.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: nkr03-source-pin-G29-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly three pinned G29 source-index artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          S="$GITHUB_SHA"
          python scripts/build_code_atlas.py --write --source-commit "$S"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(nkr03): pinned G29 source at $S"
          C="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$C" | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/nkr03-supported-public-evidence-20261115
          echo "NKR03_SOURCE_PIN=$S"
          echo "NKR03_GENERATED_ONLY_COMPANION=$C"

  final-regression:
    needs: [fixtures]
    if: "startsWith(github.event.head_commit.message, 'docs(nkr03): pinned G29 source at ') && github.run_attempt == 1 && needs.fixtures.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen numerical source
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          python -c "import numpy as np;assert np.__version__=='2.2.6'"
      - name: Exact original model, all root regression, generated graph and pristine tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 257a37a0e5c6c962191da5c247a2fc133eb9ba42 HEAD
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"

  independent-g29:
    needs: [fixtures]
    if: "startsWith(github.event.head_commit.message, 'docs(nkr03): pinned G29 source at ') && github.run_attempt == 1 && needs.fixtures.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent G29 source check and clean input
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --check-if-present
          python -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"

  public-dev-independent:
    needs: [fixtures, final-regression, independent-g29]
    if: "startsWith(github.event.head_commit.message, 'docs(nkr03): pinned G29 source at ') && github.run_attempt == 1 && needs.fixtures.result == 'success' && needs.final-regression.result == 'success' && needs.independent-g29.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU NumPy
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          python -c "import numpy as np;assert np.__version__=='2.2.6'"
      - name: Frozen high-first independent actual public knowledge comparison
        run: python research/contrib/chatgpt/NKR-03/independent_evaluation.py
      - name: Confirm no accepted model or original scientific state changed
        shell: bash
        run: test -z "$(git status --porcelain)"
