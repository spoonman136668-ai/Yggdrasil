name: T3 yggdrasil learned-cognition correction nonconsuming
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t3-yggdrasil.yml']
permissions:
  contents: read
concurrency:
  group: t3-yggdrasil-frozen-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-source-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 35
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preimplementation T3 freeze and run only source-neutral math/native checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T3_EXACT_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t3-mechanism-freeze.json').Trim() -cne '075ef353e9a856ed62eb699b3369111685a7a812'){throw 'T3_SOURCE_FROZEN_BLOB_DRIFT'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261018-yggdrasil-t3-mechanism-freeze.json').Trim() -cne 'f66c957324c58aa4f65b08235f22ea0f10300044'){throw 'T3_SOURCE_FREEZE_AFTER_IMPLEMENTATION'}
          git merge-base --is-ancestor 'f66c957324c58aa4f65b08235f22ea0f10300044' HEAD
          if($LASTEXITCODE -ne 0){throw 'T3_FREEZE_NOT_ANCESTOR'}
          if((git hash-object 'research/foundational/20261015-y-f62/source_pilot.py').Trim() -cne '7ed72deca5584d7c0b6562d74456fa7d4bee6712'){throw 'T3_UNCHANGED_HISTORICAL_BASELINE_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t3-fast-native.py').Trim() -cne 'c486e9a93b02304ce11964056b06a4115160f9f0'){throw 'T3_NEW_CORRECTION_DRIFT'}
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261018-yggdrasil-t3-fast-native.py'
          if($LASTEXITCODE -ne 0){throw 'T3_FROZEN_FOCUSED_NONCONSUMING_FAIL'}
          Write-Output 'T3_YGGDRASIL_FOCUSED_SOURCE_QUALIFICATION=PASS'
          Write-Output 'T3_YGGDRASIL_ORIGINAL_PROTECTED_COHORTS_CONSUMED=0'
          Write-Output 'T3_YGGDRASIL_FULL_RESOURCE_PARITY_NOT_ASSUMED=true'
          Write-Output 'T3_YGGDRASIL_SCIENTIFIC_TRANSFER_ACCEPTANCE=false'
