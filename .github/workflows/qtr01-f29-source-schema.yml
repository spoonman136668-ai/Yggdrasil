name: QTR-01 F29 source schema diagnostic

on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114

permissions:
  contents: read

jobs:
  f29-units:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    name: F29 schema negative checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Stable Windows source checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify F29 frozen before diagnostic code
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d991dca367a8194c07b958d00c20637df8fe8622 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f29_prereg.json)" = "1d9b101fe51590aee855011308a4c3e6fddafe0c"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f27_versioned_entitydata.py)" = "db561564c949ffe1a15c99dc460d18d0143588d1"
      - name: Only metadata source-shaped negative tests, no network
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f29_*.py' -v
      - name: Clean checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  f29-read-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'research(qtr): F29 one-shot two-ID schema diagnostic'
    name: F29 exact two-GET schema-only first-party read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact frozen source and empty one-shot marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f29_prereg.json)" = "1d9b101fe51590aee855011308a4c3e6fddafe0c"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f29_schema_diagnostic.py)" = "40f92750fcf014a25f36722314a1879d17e1283c"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f29_schema_diagnostic.py)" = "925a3aa48ab011efab8c138efb455744df4c0608"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f27_versioned_entitydata.py)" = "db561564c949ffe1a15c99dc460d18d0143588d1"
          test "$(git log -1 --format=%s)" = "research(qtr): F29 one-shot two-ID schema diagnostic"
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test -z "$(git status --porcelain)"
      - name: Offline schema-negative unit tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f29_*.py' -v
      - name: Single read of Q42 and Q5 JSON shape only, emit redacted metadata
        run: python -B research/contrib/chatgpt/QTR-01/f29_schema_diagnostic.py --metadata-only
      - name: Source custody unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
