name: MR27 Original Native Natural Causal Memory
on:
  push:
    branches:
      - research/mr27-natural-causal-memory-20261021
  pull_request:
    branches:
      - research/mr26-public-novelty-acquisition-20261021
permissions:
  contents: read
concurrency:
  group: mr27-original-memory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-natural-causal-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Exact source bytes before Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Frozen Yggdrasil source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Independent original Farama MiniGrid source at fixed author SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Original MiniGrid source runtime Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify all eight original upstream Git source blobs and unresolved licensing
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Frozen original public source runtime and resource instrumentation
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Genuine native uninterrupted MR26 public curiosity actions and MR27 native learning versus fully trained controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr27.natural_memory ../external/minigrid | tee ../mr27-native-evidence.log
          grep -q '^MR27_ORIGINAL_NATURAL_CAUSAL_MEMORY=' ../mr27-native-evidence.log
      - name: Preserve the exact original upstream and candidate Git checkout
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
