name: YGG CAP04 clock-only source trap, original archive (no source first-use)
on:
  push:
    branches: [research/ygg-cap04-action-history-unalias-20261119]
    paths:
      - '.github/workflows/ygg-cap04-action-history-atlas.yml'
permissions:
  contents: read
concurrency:
  group: ygg-cap04-clock-unalias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-source-atlas:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.seal.outputs.source_sha }}
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - name: Preserve original LF source
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Strict original-source custody and clock-only focused negatives
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/ygg-cap04-action-history-unalias-20261119
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1c312d6aed3e960d912d7e09120375cb8b987155 "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = 04d143797ec0c727882e9172df6dbb87e8a931de
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prereg.json)" = 1d79e222685ea1a6889bff49e5bf405a9aed9580
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = 51b987c6f181fcec86570b9f907f5ee7b93ccac5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          git diff --name-only 1c312d6aed3e960d912d7e09120375cb8b987155 "$GITHUB_SHA" |
            python -B -c 'import sys; files=set(sys.stdin.read().splitlines()); permitted={".github/workflows/ygg-cap04-action-history-atlas.yml","research/contrib/chatgpt/YGG-CAP04/CLOCK-ONLY-NEGATIVE-CONTROL.md","research/contrib/chatgpt/YGG-CAP04/clock_only_negative_control.py","tests/test_cap04_clock_only_negative_control.py"}; assert files==permitted,(files,permitted)'
          test -z "$(git status --porcelain)"
          python -B -m unittest discover -s tests -p test_cap04_clock_only_negative_control.py -v
          python -B -m unittest discover -s tests -p test_cap04_prospective_source_contract.py -v
          python -B research/contrib/chatgpt/YGG-CAP04/clock_only_negative_control.py
          test -z "$(git status --porcelain)"
          echo CAP04_CLOCK_NEGATIVE_SOURCE_AND_FIRST_USE_FENCE_PASS
      - name: G29 derived index only and source SHA
        id: seal
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git diff --cached --name-only |
            python -B -c 'import sys; files=set(sys.stdin.read().splitlines()); expected={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert files==expected,(files,expected)'
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "index(cap04): exact derived Atlas clock-only source $SOURCE"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source_sha=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo CAP04_CLOCK_G29_SOURCE_ATLAS_PASS

  exact-final-regression:
    needs: exact-source-atlas
    if: ${{ needs.exact-source-atlas.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_SOURCE_SHA: ${{ needs.exact-source-atlas.outputs.source_sha }}
      EXPECTED_CANDIDATE_SHA: ${{ needs.exact-source-atlas.outputs.candidate }}
    steps:
      - name: Preserve source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.exact-source-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact final immutable source and derived index guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = 04d143797ec0c727882e9172df6dbb87e8a931de
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prereg.json)" = 1d79e222685ea1a6889bff49e5bf405a9aed9580
          git diff --name-only HEAD^ HEAD |
            python -B -c 'import sys; x=set(sys.stdin.read().splitlines()); assert x=={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"},x'
          python -B scripts/build_code_atlas.py --check-if-present
          echo CAP04_CLOCK_EXACT_FINAL_SHA_AND_SOURCE_PASS
      - name: Reuse pinned historical original Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory COMPLETE inherited full original suite on final SHA
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/YGG-CAP04/clock_only_negative_control.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo CAP04_CLOCK_EXACT_FINAL_FULL_REGRESSION_PASS
