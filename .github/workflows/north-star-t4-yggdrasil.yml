name: T4 yggdrasil train-only learning and real resource parity
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t4-yggdrasil.yml']
permissions:
  contents: read
concurrency:
  group: northstar-t4-yggdrasil-nonprotected-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-aware-open-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable source, T3 controls and complete frozen T4 admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T4_EXACT_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t4-frozen-train-only.json').Trim() -cne '5475cea4126c14f18063d7627a4729c54cee68ab'){throw 'T4_FREEZE_BLOB_CHANGED'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261018-yggdrasil-t4-frozen-train-only.json').Trim() -cne 'dacf36d4d23366faa3f4b47b2e79ed2a73c29238'){throw 'T4_FREEZE_NOT_PRECODE'}
          git merge-base --is-ancestor 'dacf36d4d23366faa3f4b47b2e79ed2a73c29238' HEAD
          if($LASTEXITCODE -ne 0){throw 'T4_FREEZE_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t4-learning.py').Trim() -cne 'f88a561b5455a442e9e1d0549ea6da762b4db53c'){throw 'T4_TRAINING_SOURCE_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t3-fast-native.py').Trim() -cne 'c486e9a93b02304ce11964056b06a4115160f9f0'){throw 'T4_T3_FROZEN_LEARNER_DRIFT'}
          Write-Output 'T4_YGGDRASIL_EXACT_SOURCE_FREEZE=PASS'
      - name: Execute disjoint public learning and compare genuine controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261018-yggdrasil-t4-learning.py' | Tee-Object -FilePath 't4-yggdrasil-original.json'
          if($LASTEXITCODE -ne 0){throw 'T4_YGGDRASIL_LEARNING_EVALUATION_FAIL'}
          $j=Get-Content 't4-yggdrasil-original.json' -Raw | ConvertFrom-Json
          if($j.'scientific_resource_parity_acceptance' -ne $false){throw 'T4_PROTECTED_SCIENCE_UNAUTHORIZED'}
          if($j.'original_protected_first_use' -ne 0 -and $j.'original_protected_first_use' -ne $false){throw 'T4_PROTECTED_SOURCE_USED'}
          Write-Output 'T4_YGGDRASIL_TRAINING_AND_RESOURCE_EVIDENCE=PASS'
          Write-Output 'T4_YGGDRASIL_INDEPENDENT_PROTECTED_TRANSFER_ACCEPTANCE=false'
          Write-Output 'T4_YGGDRASIL_AUTOMATIC_PROMOTION=false'
      - uses: actions/upload-artifact@v4
        with:
          name: t4-yggdrasil-nonprotected-${{ matrix.os }}-${{ github.sha }}
          path: t4-yggdrasil-original.json
          retention-days: 90
          if-no-files-found: error
