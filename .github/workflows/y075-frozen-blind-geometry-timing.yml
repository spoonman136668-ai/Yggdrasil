name: Yggdrasil Y075 frozen sensor blindness vs onset
on:
  push:
    branches: [research/y075-blind-geometry-timing-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact lineage and immutable source gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 92ff8efb2489cf2e986562d6f51155387dac957e HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-y074-novel-affine-transfer/execute.py)" = 9c653efea5783ac8f312d450176e9e50e6e6f525
          test "$(git hash-object research/contrib/chatgpt/20261014-y075-blind-geometry-timing/prereg.json)" = 7ff78e721e88c19db5d8845a446c7fc719c70015
          test "$(git hash-object research/contrib/chatgpt/20261014-y075-blind-geometry-timing/execute.py)" = 3a0292998e7d6f4fbd0ea35805bc90ca0e3a0a10
          python3 -m json.tool research/contrib/chatgpt/20261014-y075-blind-geometry-timing/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261014-y075-blind-geometry-timing/execute.py
      - name: One prospective first-use sealed scientific trial
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-y075-blind-geometry-timing/execute.py > /tmp/Y075-original.json
          python3 -m json.tool /tmp/Y075-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y075-original.json"))
          assert a["sealed_heldout_seeds"] == list(range(9392,9408))
          assert len(a["complete_heldout_records"]) == 1152
          assert len(a["comparisons"])==4
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          assert a["classification"] in ("POSITIVE_CONTROL_FAILED","PERSISTENT_SENSOR_BLIND_SPOT","DELAYED_ONSET_SAFE_RECOVERY","DETECTION_WITHOUT_SAFE_RECOVERY","MIXED_SENSOR_VISIBILITY")
          print("CLASSIFICATION",a["classification"])
          print("COMPARISONS",a["comparisons"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y075-original-blind-geometry
          path: /tmp/Y075-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
