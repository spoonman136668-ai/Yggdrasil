name: MR34I0 Original Independent Third Source Birth
on:
  push:
    branches:
      - research/mr34i-independent-third-source-birth-20261022
permissions:
  contents: read
concurrency:
  group: mr34i0-independent-native-birth-\${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-gym-gridworlds-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve exact original third-party bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact research admission checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independently authored original Simone Parisi source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sparisi/gym_gridworlds
          ref: c6d406680d552489c3230dec9714b066c7fd303d
          path: external/gym_gridworlds
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned original source interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install source-native unmodified runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Execute exact original native action-public development source birth
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr34i.admit_gridworld ../external/gym_gridworlds | tee ../mr34i0-original-source-birth.log
          grep -q '^MR34I0_INDEPENDENT_THIRD_SOURCE_BIRTH=' ../mr34i0-original-source-birth.log
      - name: Verify original upstream and candidate stay unmodified
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/gym_gridworlds diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/gym_gridworlds status --porcelain)"
