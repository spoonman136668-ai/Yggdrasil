name: Yggdrasil critical row preservation 029

on:
  push:
    branches:
      - research/external-hosted-yggdrasil-critical-row-preservation-r1
    paths:
      - 'research/applications/plane/exp-dgr-external-critical-row-preservation-029.py'
      - '.github/workflows/external-critical-row-preservation-029.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8de95c0b9d2869d0b97d5d3a11392a5e6d3634c0"
          test "$(git rev-parse HEAD^^)" = "83d16efec53c2e704f5715be7547ef2d0b0b2968"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CRITICAL-ROW-PRESERVATION-029","preregistration_sha":"8de95c0b9d2869d0b97d5d3a11392a5e6d3634c0","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001400","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="d9e265a684ba8ce4937a395e12dd498ee21dd7e259e60f03f7e89a3a53b66d3e"
          assert json.loads(raw)["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-029"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,h,n in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"ygg-029"}),timeout=30).read(n+1)
              assert len(b)==n and hashlib.sha256(b).hexdigest()==h
              (root/(d+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen preservation twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-critical-row-preservation-029.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-critical-row-preservation-029.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and m["base_training_identity_mismatch_count"]==0 and m["schedule_count"]==6 and m["preservation_case_count"]==6 and m["protected_row_absent_case_count"]==6 and m["protected_row_insert_case_count"]==6 and m["preserved_state_structure_count_min"]==16 and m["preserved_state_structure_count_max"]==16 and m["active_structure_count_min"]==7 and m["active_structure_count_max"]==7 and m["retained_structure_count_min"]==9 and m["retained_structure_count_max"]==9 and m["heldout_selection_use_count"]==0 and m["capacity_growth_event_count"]==0 and m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and m["invalid_evaluation_rows"]==0 and all(math.isfinite(float(v)) for v in m.values()))
          cpass=(m["c_positive_reactivation_case_count"]==6 and m["minimum_c_preserved_incremental_correct_count"]>=1)
          cost=m["minimum_non_target_preserved_to_unprotected_fraction"]>=0.95
          cls="invalid" if not valid else ("negative" if not cpass else ("supported" if cost else "mixed"))
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CRITICAL-ROW-PRESERVATION-029","classification":cls,"validity_pass":valid,"c_preservation_pass":cpass,"non_target_cost_pass":cost,"authority_receipt_sha256":"d9e265a684ba8ce4937a395e12dd498ee21dd7e259e60f03f7e89a3a53b66d3e","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-029"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-external-critical-row-preservation-029
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
