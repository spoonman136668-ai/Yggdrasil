name: YGG-CAP01 original-artifact audit recovery (no retraining)
'on':
  push:
    branches:
      - research/ygg-cap01-segmented-continuation-20261119
    paths:
      - '.github/workflows/ygg-cap01-recovery.yml'
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Prevent native source line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-CAP01-ubuntu-latest
          run-id: 44497769180
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/CAP01-original-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-CAP01-windows-2022
          run-id: 44497769180
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/CAP01-original-windows
      - name: Check source freeze; reuse EXACT original completed artifacts, then evidence-seal and G29
        id: seal
        shell: bash
        env:
          CAP01_LINUX_ARTIFACT: ${{ runner.temp }}/CAP01-original-linux
          CAP01_WINDOWS_ARTIFACT: ${{ runner.temp }}/CAP01-original-windows
          CAP01_SOURCE_SHA: e8695b48af082ee7fe95fbb5ada0927d4d07032f
          CAP01_RUN: '44497769180'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code e8695b48af082ee7fe95fbb5ada0927d4d07032f HEAD -- \
            yggdrasil/native_segmented_continuation.py \
            tests/test_native_segmented_continuation.py \
            research/contrib/chatgpt/YGG-CAP01/prereg.json \
            research/contrib/chatgpt/YGG-CAP01/source.py \
            research/contrib/chatgpt/YGG-CAP01/campaign.py \
            research/contrib/chatgpt/YGG-CAP01/audit.py \
            research/contrib/chatgpt/YGG-CAP01/parity.py \
            research/contrib/chatgpt/YGG-CAP01/seal.py \
            research/contrib/chatgpt/YGG-CAP01/test_parity.py
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_recovery.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_parity.py' -v
          python -B research/contrib/chatgpt/YGG-CAP01/seal_recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/contrib/chatgpt/YGG-CAP01/
          git commit -m 'research(cap01): seal exact original native continuation on both OS with explicit byte-size receipts'
          EVIDENCE_SHA="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$EVIDENCE_SHA"
          git add .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git commit -m "docs(cap01): source-exact G29 atlas for $EVIDENCE_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ygg-cap01-segmented-continuation-20261119
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Prevent native source line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact native numeric dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Mandatory full exact-candidate native regression, negatives and G29
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.seal.outputs.final_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
