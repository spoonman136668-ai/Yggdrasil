name: LR-92AR DEV01 final exact-SHA source/native regression, no DEV rerun
'on':
  push:
    branches: [research/lr92ar-dev01-final-regression-20261119]
    paths: ['.github/workflows/lr92ar-dev01-final-once.yml']
permissions:
  contents: read
jobs:
  final:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable byte-changing line ending checkout transforms
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 81d0dcdcf0118be767edc49e8192d942e58df934
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact final candidate SHA, first protocol blobs and scientific holds
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior'
          test "$(git rev-parse HEAD)" = "81d0dcdcf0118be767edc49e8192d942e58df934"
          test "$(git hash-object "$root/prereg.json.txt")" = 9aa65a206e805f4975741836cb9a5e02158c597e
          test "$(git hash-object "$root/dev01_prereg.json.txt")" = f43079dc1adddfecebb33a60f99b7b6b0b934606
          test "$(git rev-parse 'e7cfc6416a75e6f8a2272966567955e56bdd450f':"$root/dev01_prereg.json.txt")" = f43079dc1adddfecebb33a60f99b7b6b0b934606
          test "$(git hash-object "$root/phase_blind_posterior.py.txt")" = b53eba44cc5cdcdacfc65e2a9af282a7972ea497
          test "$(git hash-object "$root/dev01_worlds.py.txt")" = e0b72d8b8ada885ec87d0e2d00559e7c5286d9d2
          test "$(git hash-object "$root/dev01_screen.py.txt")" = e8248b98924e1e4850a88b22c49a7c989997a93b
          test "$(git hash-object "$root/test_dev01_screen.py.txt")" = cdd8165aabe098e6616dfd8e2144b89fee446e0b
          test "$(git hash-object "$root/dev01_result.json.txt")" = 6017bda9a5dfa9ff36d9359f79d6016eaeb12cab
          echo LR92AR_FINAL_EXACT_SHA_SOURCE_CUSTODY_PASS
      - name: Validate persisted evidence read-only, no source/world regeneration
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior/dev01_result.json.txt')
          j=json.loads(p.read_text(encoding='utf8'))
          assert j['schema']=='LR92AR_DEV01_VERIFIED_CROSS_PLATFORM_RESULT_V1'
          assert j['source_candidate_sha']=='8e8f06f1a89459133d8458b02622f62d2d65071f'
          assert j['data']['worlds']==36 and j['data']['events_per_model']==6912
          assert len(j['data']['per_world_scores_and_stream_digests'])==36
          assert j['data']['public_action_consequence_digest']=='c84edcc0974bba3b34c6a59655593c32a86b346df2404c66342fb052af555705'
          assert j['results']['development_decision']=='DEV_NO_GO'
          assert len(j['results']['three_seed_groups'])==3
          assert all(x['GO'] is False for x in j['results']['three_seed_groups'])
          assert j['qualification']['two_os_world_metadata_and_per_model_metric_diffs_gt_1e12']==0
          assert j['qualification']['protected_primary_worlds_consumed']==0
          assert j['interpretation']['not_owner_training'] is True
          assert j['interpretation']['not_scientific_first_use'] is True
          assert j['deployment']['main_unchanged'] is True
          print('LR92AR_FINAL_IMMUTABLE_NEGATIVE_EVIDENCE_PASS')
          PY
      - name: Mandatory full original native regression at evidence-bearing SHA
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo LR92AR_FINAL_ROOT_NATIVE_REGRESSION_PASS
      - name: Requalify original research candidate structural semantics only
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior'
          d="$RUNNER_TEMP/lr92ar-final-structural"
          mkdir -p "$d"
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          cp "$root/phase_blind_posterior.py.txt" "$d/phase_blind_posterior.py"
          cp "$root/test_phase_blind_posterior.py.txt" "$d/test_phase_blind_posterior.py"
          (cd "$d" && python -B -m unittest -v test_phase_blind_posterior)
          echo LR92AR_FINAL_STRUCTURAL_TESTS_PASS_NO_DEV_REPLAY
      - name: Preserve clean final candidate without owner or protected first use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81d0dcdcf0118be767edc49e8192d942e58df934"
          test -z "$(git status --porcelain)"
          echo LR92AR_FINAL_CLEAN_READ_ONLY_HOLD_PASS
