name: Yggdrasil Y063 frozen causal cache-factor separation
on:
  push:
    branches: [research/y063-cache-intervention-factorial-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pre-first-use frozen identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 53693c35db7253916082e6574218fc6e1b50ca41 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y062-cache-flush/execute.py)" = 7e820563fe92613d0f0459fbdfe459d788faefd1
          test "$(git hash-object research/contrib/chatgpt/20261013-y063-cache-components/prereg.json)" = 8178a77216d0f0722237f1d3e4831095ab4f1b33
          test "$(git hash-object research/contrib/chatgpt/20261013-y063-cache-components/execute.py)" = 793824e76adf2635ad2882d87c18222150b85a9d
          python3 -m json.tool research/contrib/chatgpt/20261013-y063-cache-components/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y063-cache-components/execute.py
      - name: Exactly one original sealed five-arm cache component experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y063-cache-components/execute.py > /tmp/Y063-first-use.json
          python3 -m json.tool /tmp/Y063-first-use.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y063-first-use.json'))
          assert a['development_seeds']==list(range(3940,3948))
          assert a['sealed_heldout_seeds']==list(range(3960,3976))
          assert len(a['heldout_records'])==2*3*4*16*3
          assert all(len(g['arms'])==5 for g in a['source_groups'].values())
          assert a['public_scalar_reads_per_trial']==10
          assert a['active']==7 and a['cache_limit']==9
          print('CLASSIFICATION',a['classification'])
          print('STEADY',a['steady_zero_mismatches'])
          print('BLIND',a['source_invisible_no_oracle_action'])
          print('COMPONENT_EFFECTS',a['factorial_comparisons'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y063-original-cache-components
          path: /tmp/Y063-first-use.json
          retention-days: 90
          if-no-files-found: error
      - name: One required full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
