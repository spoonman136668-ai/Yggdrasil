name: Yggdrasil Y035 observed-frequency memory qualification
on:
  push:
    branches: [research/y035-frequency-memory-r1]
permissions:
  contents: read
jobs:
  scientific_first_use:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable parent preregistration and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 70e14ff87ac10ec5f64b0159ee1e7ba805627b55 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-sticky-cache/execute.py)" = a5c567f76bc019350989bf89d85099dc4c9624f5
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-frequency-eviction/prereg.json)" = 59aabfc0a021b9304ded7fb2f4f69ffa1460a4c5
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-frequency-eviction/execute.py)" = 859cb95a9a6daa3c1d62fa33a94c4ab20616c69c
          python3 -m json.tool research/contrib/chatgpt/20261013-y035-frequency-eviction/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y035-frequency-eviction/execute.py
      - name: Original preregistered scientific execution
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y035-frequency-eviction/execute.py > /tmp/y035-original.json
          python3 -m json.tool /tmp/y035-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y035-original
          path: /tmp/y035-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One complete repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
