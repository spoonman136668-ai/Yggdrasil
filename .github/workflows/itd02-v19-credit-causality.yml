name: ITD-02 V19 local-credit causal responsibility source-only audit
on:
  push:
    branches:
      - research/itd02-v19-local-credit-causality-audit-20261028
permissions:
  contents: read
jobs:
  v19-credit-causality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Byte-identical source checkout policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source SHA without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact original learner, original baseline and prereg chronology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 46097b7fd03e40ceec6b74918430b7f6c11cc53e "$GITHUB_SHA"
          git merge-base --is-ancestor 25df62bdbe406541d68fd3474ad5b8883815aefc "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v18_intermediate_plasticity_dev.py)" = 711391944be7bd94f1898005d1233bfe52a6f216
          test "$(git hash-object research/itd02_v18_intermediate_plasticity_audit.py)" = 7a8f361ff13cf75f716c544add192c2ff9c5aae9
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Source-exact V19 local-credit finite-difference diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v19"
          PYTHONPATH=. python -B research/itd02_v19_local_credit_causality_audit.py > "$RUNNER_TEMP/v19/audit.json"
          python - "$RUNNER_TEMP/v19/audit.json" <<'PY'
          import json, math, sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert r["schema"]=="ygg.itd02.v19.credit_causal_responsibility.source_only.v1"
          assert r["source_only"] and not r["scientific_first_use"]
          assert not r["original_world_training"]
          assert r["original_native_model_parameters_unchanged"]
          assert r["public_contexts_per_family"]==36
          assert r["synthetic_family_count"]==2
          assert r["initial_zero_sensitivity_cases"]==72
          assert r["original_v18_learned_scalar_budget"]==116
          assert r["max_checkpoint_bytes"]<=8192
          assert r["total_forward_neighbor_scalar_messages"]>0
          assert r["total_reward_credit_scalar_messages"]>0
          assert len(r["canonical_case_sha256"])==64
          assert r["classification"] in (
              "V19_V18_UNATTRIBUTED_LOCAL_CREDIT_CONFIRMED__NO_SCIENCE",
              "V19_V18_INITIAL_CREDIT_ALIGNED__NO_SCIENCE",
          )
          print("ITD02_V19_FINITE_DIFFERENCE_CREDIT_DIAGNOSTIC_COMPLETE_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v19/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: V19 source-only negative controls
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v19_local_credit_causality.py' -v > "$RUNNER_TEMP/v19/controls.log" 2>&1
          cat "$RUNNER_TEMP/v19/controls.log"
          echo "ITD02_V19_CREDIT_CAUSALITY_CONTROLS_PASS_NO_SCIENCE"
      - name: One final V18 V17 V16 V15 V12 original-native regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v18_intermediate_plasticity_dev.py' -v
          PYTHONPATH=. python -B research/itd02_v18_intermediate_plasticity_audit.py > "$RUNNER_TEMP/v19/inherited-v18.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v17_neighbor_carried_learner_dev.py' -v
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v19/inherited-v16.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ITD02_V19_FINAL_INHERITED_ORIGINAL_NATIVE_REGRESSION_PASS_NO_SCIENCE"
      - name: Retain exact host source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v19-credit-causality-${{ matrix.os }}
          path: ${{ runner.temp }}/v19/*
          if-no-files-found: warn
          retention-days: 7
