name: FKP09 final immutable evidence records plus G29 dual-OS regression (no DEV rerun)

on:
  push:
    branches: [ci/fkp09-one-shot-20261115]
    paths: [.github/workflows/fkp09-once.yml]

permissions:
  contents: read

concurrency:
  group: fkp09-once-exact-source-20261115
  cancel-in-progress: false

jobs:
  atlas-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-09): one-shot exact-source public DEV qualification' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE: f3b84665046ea97afaa0e70430a5a0ec7fe1982c
      SOURCE_TREE: f848525e1d0bed105cc0b249d9fa393f7b203aa1
      TARGET: research/fkp09-shared-core-rebase-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      exact_head: ${{ steps.seal.outputs.exact_head }}
    steps:
      - name: Pin no-CRLF checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f3b84665046ea97afaa0e70430a5a0ec7fe1982c
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify first prereg, exact source SHA/tree and all file blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 63fac40726d6ec2fe49fc5f78aebf6d2d97260bf "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/prereg.json)" = ea0cdcb51189801897d5de07cd8fff0bcbbaf4e7
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/source.py)" = 9c971c0b0c8fc433147c76ef79d82f5aa5b89e5c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/model.py)" = cf9de7a3762de7246935a779d3d6e3ff6fe0638a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/run_dev.py)" = 9709f3d8c3f2eacc23009b10bf638983fcb64587
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/test_fkp09.py)" = e3461d720dd09b1959a06d8e1f546b12590843ea
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/README.md)" = 078f595d7b5eb2adb218752b39ca847b9beb4b9c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/result.json)" = 265bd022a61c84f846852eb33dda2b718cb64fe2
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-09/provenance.json)" = 7b1c1bb704861ec4a88a5f0a2750c263f1bdaa64
          echo "FKP09_SOURCE_CUSTODY_PASS"
      - name: Regenerate only exactly three G29 source-index artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test -z "$(git diff --name-only)"
      - name: Source-preserving G29 child on isolated FKP09 research branch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-09): refresh generated G29 source atlas"
          NEW="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "exact_head=$NEW" >> "$GITHUB_OUTPUT"
          echo "FKP09_G29_CHILD=$NEW"

  fixture-and-full-regression:
    needs: atlas-only
    if: needs.atlas-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep source bytes identical on each OS
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-only.outputs.exact_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source G29 and G29 fixture tests
        shell: bash
        run: |
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
      - name: FKP09 fixture-only cases, no original DEV first use
        shell: bash
        run: |
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-09 -p test_fkp09.py -v
      - name: Mandatory full inherited regression on exact source
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FKP09_FULL_PRE_FIRST_USE_REGRESSION=PASS"

