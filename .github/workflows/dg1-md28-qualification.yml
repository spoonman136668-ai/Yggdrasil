name: DG1-MD28 CausalRelay paid-intervention toy qualification
on:
  push:
    branches: [research/dg1-md28-shifting-relay-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md28-20261114/**'
      - '.github/workflows/dg1-md28-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  toy-and-inherited:
    name: MD28 pre-first-use toy + exact-source regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze ancestor verified and previous original studies untouched
        shell: bash
        run: |
          test "$(git rev-parse 3b89e764ee859cc17ebaeea7bef6403cb770e3ea^)" = "9f9cc2e50837f60945694473f4ae51621a0b19e2"
          git merge-base --is-ancestor 3b89e764ee859cc17ebaeea7bef6403cb770e3ea HEAD
          git diff --exit-code 9f9cc2e50837f60945694473f4ae51621a0b19e2 HEAD -- \
            research/contrib/chatgpt/dg1-md26-20261114/ \
            research/contrib/chatgpt/dg1-md25-20261114/ \
            research/contrib/chatgpt/dg1-md24-20261114/ \
            research/contrib/chatgpt/dg1-md23-20261114/
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/contrib/chatgpt/dg1-md28-20261114/prereg.json").read_text())
          assert p["status"]=="PREREGISTRATION_ONLY_NO_TOY_OR_REGISTERED_RUN"
          assert p["exact_parent_sha"]=="9f9cc2e50837f60945694473f4ae51621a0b19e2"
          assert p["data"]["primary_seeds"]==[1050001,1050096]
          print("MD28_FROZEN_PREREG_AND_UNMODIFIED_PREDECESSORS_PASS")
          PY
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Pinned public CPU packages for inherited regression only
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python -m pip freeze > md28-packages.txt
          python - <<'PY'
          from importlib.metadata import version
          for n,v in (("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")):
              assert version(n)==v
          print("MD28_PINNED_CPU_PROVENANCE_PASS")
          PY
      - name: Exact toy-only consequential physical tests; registered seeds forbidden
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md28-20261114/shifting_relay.py research/contrib/chatgpt/dg1-md28-20261114/test_shifting_relay.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md28-20261114 -p 'test_shifting_relay.py' -v
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,"research/contrib/chatgpt/dg1-md28-20261114")
          from relay import canon,toy_study
          record=toy_study()
          assert record["registered_seeds_touched"] is False
          def without_timing(x):
              if isinstance(x,dict):
                  return {k:without_timing(v) for k,v in x.items()
                          if k not in ("decision_cpu_ns","cpu_ns")}
              if isinstance(x,list):return [without_timing(v) for v in x]
              return x
          out=without_timing(record)
          Path("md28-toy-metrics.json").write_text(canon(out)+"\n")
          print("MD28_TOY_QUALIFICATION:"+record["classification"])
          print("MD28_TOY_REGISTERED_SEEDS_NEVER_USED")
          PY
      - name: Independently regenerate source-indexed deterministic G29 atlas
        id: atlas
        shell: bash
        run: |
          python - <<'PY'
          import base64,os,subprocess
          from pathlib import Path
          names=(".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice")
          def git(*args):
              return subprocess.check_output(("git",)+args,text=True).strip()
          head=git("rev-parse","HEAD")
          changed=set(git("diff","--name-only","HEAD^","HEAD").splitlines())
          derived=changed==set(names)
          source=git("rev-parse","HEAD^") if derived else head
          subprocess.run(("python","scripts/build_code_atlas.py",
                          "--source-commit",source,"--write"),check=True)
          committed=derived and all(subprocess.check_output(
              ("git","show","HEAD:"+p))==Path(p).read_bytes() for p in names)
          if not committed and os.environ.get("RUNNER_OS")=="Linux":
              for p in names:
                  value=base64.b64encode(Path(p).read_bytes()).decode("ascii")
                  chunks=[value[i:i+1200] for i in range(0,len(value),1200)]
                  for i,c in enumerate(chunks):
                      print("MD28_ATLAS_B64|"+p+"|"+str(i)+"|"+
                            str(len(chunks))+"|"+c,flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("committed="+str(committed).lower()+"\n")
              f.write("source="+source+"\n")
          print("MD28_G29_SOURCE:"+source)
          print("MD28_G29_COMMITTED:"+str(committed))
          PY
      - name: Mandatory full inherited regression on exact committed candidate
        if: steps.atlas.outputs.committed == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check
          git diff --exit-code -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
      - name: Source-only preflight must change generated atlas exclusively
        if: steps.atlas.outputs.committed != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed=={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"},changed
          print("MD28_PREFIRSTUSE_TOY_ONLY_PENDING_DERIVED_ATLAS_COMMIT")
          PY
      - name: Preserve only toy software and action receipts in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-md28-toy-${{ matrix.os }}
          path: |
            md28-packages.txt
            md28-toy-metrics.json
          if-no-files-found: ignore
  toy-parity:
    name: MD28 physically charged toy result cross-OS parity
    needs: toy-and-inherited
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-md28-toy-ubuntu-latest
          path: toy-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-md28-toy-windows-2022
          path: toy-windows
      - name: Compare every public action, consequence, model checkpoint and reward
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("toy-linux/md28-toy-metrics.json").read_text())
          b=json.loads(Path("toy-windows/md28-toy-metrics.json").read_text())
          assert a==b,"MD28_TOY_NON_TIMING_CROSS_OS_PARITY_DRIFT"
          assert a["registered_seeds_touched"] is False
          assert len(a["physical_toy_traces"])==8
          assert all(len(x)==48 for x in a["physical_toy_traces"].values())
          assert all(len(x["trace_sha256"])==64 for row in a["physical_toy_traces"].values() for x in row)
          print("MD28_DUAL_OS_PUBLIC_ACTION_CONSEQUENCE_MODEL_PARITY_PASS")
          print("MD28_FROZEN_CLASSIFICATION:"+a["classification"])
          PY
