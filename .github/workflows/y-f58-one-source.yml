name: Yggdrasil F58 exact-source FIT-only scientific feasibility
on:
  push:
    branches:
      - research/y-f58-frontier-memory-20261015-r1
permissions:
  contents: read
jobs:
  source-qualification:
    if: "${{ github.event.head_commit.message == 'science(y-f58): once-only FIT causal frontier source qualification' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen precode prereg and exact source/test/audit identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor dd188d9bc39f1c3a73dd033b70ef8811860ebe3a HEAD
          test "$(git hash-object research/foundational/20261015-y-f58/prereg.json)" = 9cb54ec69a04fc1ec963b347ef802615b42f7b48
          test "$(git hash-object research/foundational/20261015-y-f58/source_feasibility.py)" = f275d28e3755e2c90ea482d076d7401d722d71b8
          test "$(git hash-object research/foundational/20261015-y-f58/test_preflight.py)" = cffde10df55b75ec05454927ba044a9a979b7465
          test "$(git hash-object research/foundational/20261015-y-f58/audit_fit.py)" = 813845f495128d444deb220a19ab6933edb742d1
          python3 -m json.tool research/foundational/20261015-y-f58/prereg.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-y-f58 -p test_preflight.py -v
      - name: One full independent repository regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e '.[test]'
          python3 -m pytest -q tests
      - name: Exactly one new FIT-only scientific source and source-free audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f58"
          git rev-parse HEAD > "$RUNNER_TEMP/y-f58/SOURCE_SHA"
          python3 -B research/foundational/20261015-y-f58/source_feasibility.py --fit-only             > "$RUNNER_TEMP/y-f58/result.json"
          python3 -m json.tool "$RUNNER_TEMP/y-f58/result.json" >/dev/null
          python3 -B research/foundational/20261015-y-f58/audit_fit.py             "$RUNNER_TEMP/y-f58/result.json"             research/foundational/20261015-y-f58/prereg.json             > "$RUNNER_TEMP/y-f58/source-free-audit.txt"
          cat "$RUNNER_TEMP/y-f58/source-free-audit.txt"
          (cd "$RUNNER_TEMP/y-f58" && sha256sum result.json source-free-audit.txt > manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yggdrasil-F58-once-FIT-feasibility-evidence
          path: ${{ runner.temp }}/y-f58/
          retention-days: 90
          if-no-files-found: error
      - name: Scientific authority boundary
        run: |
          echo "NEW_FIT_ONLY=TRUE"
          echo "DIAG_AND_ORIGINAL=UNCONSUMED"
          echo "F3=NOT_INDEPENDENT"
          echo "WHOLE_NATIVE_576B=UNVERIFIED"
          echo "FORGE_OPTIMIZER_AND_ACCEPTED_REFS=UNCHANGED"
