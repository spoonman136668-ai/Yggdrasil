name: WSP130 frozen structural interaction induction and source-safe final qualification
on:
  push:
    branches: [research/wsp130-induce-highorder-consequence-20261116]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg FIRST, exact ancestry and original science disarmed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 48cf06e66c1fafe3857c16c2d12e242d3875846e HEAD
          git diff --exit-code 48cf06e66c1fafe3857c16c2d12e242d3875846e HEAD -- research/contrib/chatgpt/WSP-130/prereg.json
          test ! -e research/contrib/chatgpt/WSP-130/result.json
          test ! -e research/contrib/chatgpt/WSP-130/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-130/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-129/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Run original 144-world WSP130 development once with source-only negative
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-130 -p 'test_*.py' -v
      - name: Check unchanged checkout and immutable prereg
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp130): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp130-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly three source-pinned G29 derived atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 48cf06e66c1fafe3857c16c2d12e242d3875846e HEAD
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp130): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp130-induce-highorder-consequence-20261116

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp130): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install inherited pinned runtime comparators
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6'
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Verify first prereg, exact candidate and pinned G29
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 48cf06e66c1fafe3857c16c2d12e242d3875846e HEAD
          git diff --exit-code 48cf06e66c1fafe3857c16c2d12e242d3875846e HEAD -- research/contrib/chatgpt/WSP-130/prereg.json
          test ! -e research/contrib/chatgpt/WSP-130/result.json
          test ! -e research/contrib/chatgpt/WSP-130/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Mandatory full WSP117 through WSP130 focused regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 117 118 119 120 121 122 123 124 125 126 127 128 129 130; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory whole-root regression and clean source G29
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
