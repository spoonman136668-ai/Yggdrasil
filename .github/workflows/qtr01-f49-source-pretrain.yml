name: QTR-01 F49 full source-only conventional pretraining
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 source pretrained controls derive atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin F49 source-only entry and untouched frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ba8702890f627b1e1f8df56a1396436765afdd6e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f49-source-pretrain.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_worlds.py)" = '9a5185584b965f6529ceceadc1da8da8eb36be70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_conventional_controls.py)" = '5eaad015cc0388854268bc36fda1a673b28ffcaf'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_source_pretrain.py)" = '8e47908eee50a0631766e637e39149a81a8758fc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_source_pretrain.py)" = '042a0a761f7c9a8eeebed43530e246bac0147243'
          test -z "$(git status --porcelain)"
          echo F49_PRETRAIN_ATLAS_SOURCE_CUSTODY=PASS
      - name: Generate derived G29 atlas only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F49 source-only pretraining G29 companion'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "F49_PRETRAIN_ATLAS_COMPANION_SHA=$(git rev-parse HEAD)"
  full-source:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 source-only pretrained baselines final qualification'
    name: F49 full source-only 1024-to-256 training (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows checkout source bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-only code and exact G29 companion
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test "$(git log -1 --format=%s)" = 'ci(qtr): F49 source-only pretrained baselines final qualification'
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): derive F49 source-only pretraining G29 companion'
          git merge-base --is-ancestor ba8702890f627b1e1f8df56a1396436765afdd6e HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_worlds.py)" = '9a5185584b965f6529ceceadc1da8da8eb36be70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_conventional_controls.py)" = '5eaad015cc0388854268bc36fda1a673b28ffcaf'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_source_pretrain.py)" = '8e47908eee50a0631766e637e39149a81a8758fc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_source_pretrain.py)" = '042a0a761f7c9a8eeebed43530e246bac0147243'
          python scripts/build_code_atlas.py --check
          echo F49_SOURCE_PRETRAIN_CANDIDATE_PIN=PASS
      - name: Install exact inherited regression dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: Source-only and other F49 focused tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f49_*.py' -v
      - name: Mandatory original repository regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory complete QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Fully train six source-only baselines 1024 first
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f49_source_pretrain.py --source-fit-only --source-commit "$GITHUB_SHA" --out "$RUNNER_TEMP/f49-sources"
          F49_RECEIPT="$RUNNER_TEMP/f49-sources/f49-source-pretrain-receipt.json" python - <<'PY'
          import json, os, pathlib
          a=json.loads(pathlib.Path(os.environ['F49_RECEIPT']).read_text())
          assert a['full_source_fits']==6
          assert a['bank_sizes_high_first']==[1024,512,256]
          assert all(z['cold_restore'] and z['train_only'] and not z['target_first_use'] for z in a['results'])
          assert all(z['source_rows']==z['size']*128 for z in a['results'])
          assert a['dev_target_observations']==0 and not a['scientific_pass'] and not a['protected_first_use']
          print('F49_COMPLETE_SOURCE_TRAINING_AND_COLD_RESTORE=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f49-source-fit-${{ matrix.os }}
          path: ${{ runner.temp }}/f49-sources/
          retention-days: 7
          if-no-files-found: error
      - name: Verify source clean and no scientific target first-use
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F49_SOURCE_ONLY_NO_TARGET_FIRST_USE_AND_UNCHANGED_MODEL=PASS
  compare:
    needs: full-source
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 source-only pretrained baselines final qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: f49-source-fit-*
          path: ${{ runner.temp }}/f49-source-compare
          merge-multiple: false
      - name: Verify complete source identity and independent OS receipts
        shell: bash
        run: |
          set -euo pipefail
          F49_COMPARE="$RUNNER_TEMP/f49-source-compare" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['F49_COMPARE'])
          a=json.loads((root/'f49-source-fit-ubuntu-24.04'/'f49-source-pretrain-receipt.json').read_text())
          b=json.loads((root/'f49-source-fit-windows-2022'/'f49-source-pretrain-receipt.json').read_text())
          assert len(a['results'])==len(b['results'])==6
          for x,y in zip(a['results'],b['results']):
              assert (x['kind'],x['size'],x['source_rows'],x['data_sha256'])==(y['kind'],y['size'],y['source_rows'],y['data_sha256'])
              assert x['cold_restore'] and y['cold_restore'] and not x['target_first_use'] and not y['target_first_use']
          assert not a['scientific_pass'] and not b['scientific_pass']
          print('F49_CROSS_OS_SOURCE_IDENTITY_AND_BASELINE_RECEIPTS=PASS')
          PY
