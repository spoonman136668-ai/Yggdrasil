name: NCI04 ST11 source-only adaptive intervention contract
on:
  push:
    branches: [research/nci04-st11-public-outcome-probe-values-20261118]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    timeout-minutes: 18
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert frozen ST9 immutable source and parent lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a2e697cddd1c5a494880401c4e7beffe72158d0a HEAD
          test "$(git rev-parse HEAD:research/nci04_st9/native_repair.py)" = 8409f7e3352aabb6a5937a6a7443f2dc4a82f07a
          test "$(git rev-parse HEAD:research/nci04_st9/private_world.py)" = d1bdf67503bd797d79386406820679b70403e8bb
          test "$(git rev-parse HEAD:research/nci04_st9/frozen_protocol.json)" = 9ad8bc15e8dd8b0757c8db13772de23c57d2f3cf
      - name: Source-only ST11 and inherited ST9 native mechanical negatives
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st11_public_probe_preference.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04_st10_adaptive_actor.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04_st9_native_repair.py' -v
          echo NCI04_ST11_SOURCE_ONLY_FOCUSED=PASS
      - name: Assert no checkout modifications
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  atlas:
    name: ST11 bounded generated-only G29 companion
    if: "${{ startsWith(github.event.head_commit.message, 'engineering(st11): source-pinned') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce exact ST9 ancestry and sole ST11 source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/nci04-st11-public-outcome-probe-values-20261118"
          git merge-base --is-ancestor e7a66bf90f142292b2efbb955eb50387edf8cade HEAD
          test "$(git rev-parse HEAD:research/nci04_st9/native_repair.py)" = 8409f7e3352aabb6a5937a6a7443f2dc4a82f07a
          test "$(git rev-parse HEAD:research/nci04_st9/private_world.py)" = d1bdf67503bd797d79386406820679b70403e8bb
      - name: Generate the three original source-pinned G29 artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python -B - <<'PY'
          import subprocess
          got=set(subprocess.check_output(
              ["git","diff","--name-only"],text=True).splitlines())
          expect={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"}
          assert got==expect,(got,expect)
          print("ST11_G29_GENERATED_ONLY_DELTA=PASS")
          PY
      - name: Publish bounded derived-only companion to the same research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore(g29): generated-only ST11 source-pinned atlas"
          git push origin "HEAD:refs/heads/research/nci04-st11-public-outcome-probe-values-20261118"

  full:
    name: ST11 mandatory exact-SHA full Python/native/G29 (${{ matrix.os }})
    if: "${{ startsWith(github.event.head_commit.message, 'qualify(st11):') }}"
    needs: focused
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Byte-preserving source checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original native test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0 psutil==6.1.1
      - name: Run complete root/native source regression and strict G29
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}'
          test "$(git rev-parse HEAD:research/nci04_st9/native_repair.py)" = 8409f7e3352aabb6a5937a6a7443f2dc4a82f07a
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -B - <<'PY'
          from pathlib import Path
          import importlib.util
          import unittest
          forbidden = {
              "test_free_fanout_sidecar.py",
              "test_nci04g6_native_credit.py",
              "test_nci04g7_source_producer.py",
              "test_nci04g7a_environment.py",
          }
          assert importlib.util.find_spec("resource") is None
          names = {p.name for p in Path("tests").glob("test_*.py")}
          assert forbidden <= names, (forbidden - names)
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for name in sorted(names - forbidden):
              suite.addTests(loader.discover(start_dir="tests", pattern=name))
          print("ST11_WINDOWS_RESOURCE_ONLY_MODULE_EXCLUSIONS=" +
                ",".join(sorted(forbidden)), flush=True)
          print("ST11_WINDOWS_RUNNABLE_TESTS=" + str(suite.countTestCases()), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py' -v
          fi
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          test -z "$(git status --porcelain)"
          echo NCI04_ST11_FULL_ROOT_NATIVE_G29=PASS
