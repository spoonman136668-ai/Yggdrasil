name: Y045 original prospective science full regression
on:
  push:
    branches: [research/chatgpt-isolated-y045-correlated-witness-20261013]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identity and non-executing preflight
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 55dc60e166034f1110d6d2ac152ab2acc1ae49d3 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-hibernation/execute.py)" = 6c6ba3ebf39456056fca0e60a8210d941cf69e43
          test "$(git hash-object research/contrib/chatgpt/20261013-isolated-y045-correlated-witness/prereg.json)" = f7fb70b2c0e9043b903440c1d96396de761b244a
          test "$(git hash-object research/contrib/chatgpt/20261013-isolated-y045-correlated-witness/execute.py)" = feda84b0ff6b9e66af02d3c528187d10803a00e6
          python3 -m json.tool research/contrib/chatgpt/20261013-isolated-y045-correlated-witness/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-isolated-y045-correlated-witness/execute.py
      - name: Original one-shot prospective Y045 research
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-isolated-y045-correlated-witness/execute.py > /tmp/Y045-original.json
          python3 -m json.tool /tmp/Y045-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Y045-frozen-first-use
          path: /tmp/Y045-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
