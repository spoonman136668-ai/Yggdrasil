name: Yggdrasil state carry depth 048

on:
  push:
    branches:
      - research/external-hosted-yggdrasil-cumulative-multirow-state-carry-depth-r2
    paths:
      - 'research/applications/plane/exp-dgr-external-cumulative-multirow-state-carry-depth-048.py'
      - '.github/workflows/external-cumulative-multirow-state-carry-depth-048.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "d04b0202fd471b1e96e90ad455192fff245aec7e" HEAD
          python3 - <<'PY'
          import subprocess
          prereg="d04b0202fd471b1e96e90ad455192fff245aec7e"
          parent="5e30f1f341d9a7da7abd54be756c1b771ee8796d"
          pp="research/experiments/exp-dgr-external-cumulative-multirow-state-carry-depth-048.ice"
          assert subprocess.check_output(["git","rev-parse",prereg+"^"],text=True).strip()==parent
          assert set(subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",prereg],text=True).splitlines())=={pp}
          changed=set(subprocess.check_output(["git","diff","--name-only",parent+"..HEAD"],text=True).splitlines())
          expected={pp,"research/applications/plane/exp-dgr-external-cumulative-multirow-state-carry-depth-048.py",".github/workflows/external-cumulative-multirow-state-carry-depth-048.yml"}
          assert changed==expected,(sorted(changed),sorted(expected))
          print("FROZEN_PACKAGE_OK",sorted(changed))
          PY
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-MULTIROW-STATE-CARRY-DEPTH-048","preregistration_sha":"d04b0202fd471b1e96e90ad455192fff245aec7e","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001751","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="c0c68f9c43ba8c8410662f8d79030ce28b14207be2f58cf84006ef873673619d"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="d04b0202fd471b1e96e90ad455192fff245aec7e"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-048"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,h,n in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"ygg-048"}),timeout=30).read(n+1)
              assert len(b)==n and hashlib.sha256(b).hexdigest()==h
              (root/(d+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen three-row carry twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-cumulative-multirow-state-carry-depth-048.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-cumulative-multirow-state-carry-depth-048.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(
            m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["base_case_count"]==36 and m["reuse_cycle_count_per_case"]==6 and
            m["novel_interference_episode_count"]==432 and m["state_carry_application_count"]==180 and
            m["state_carry_width_min"]==3 and m["state_carry_width_max"]==3 and
            m["post_episode_target_recovery_check_count"]==432 and m["post_episode_partner_recovery_check_count"]==432 and
            m["preserved_state_structure_count_min"]==16 and m["preserved_state_structure_count_max"]==16 and
            m["active_structure_count_min"]==7 and m["active_structure_count_max"]==7 and
            m["retained_structure_count_min"]==9 and m["retained_structure_count_max"]==9 and
            m["state_carry_accounting_error_count"]==0 and m["heldout_selection_use_count"]==0 and
            m["capacity_growth_event_count"]==0 and m["row_mutation_event_count"]==0 and
            m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and
            m["invalid_evaluation_rows"]==0 and all(math.isfinite(float(v)) for v in m.values())
          )
          protected=(m["positive_post_episode_target_recovery_check_count"]==432 and m["positive_post_episode_partner_recovery_check_count"]==432)
          safety=(m["non_target_safety_failure_count"]==0 and m["minimum_applicable_non_target_preserved_to_unprotected_fraction"]>=0.95)
          if not valid: cls="invalid"
          elif protected and safety: cls="supported"
          elif protected: cls="mixed"
          else: cls="negative"
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-MULTIROW-STATE-CARRY-DEPTH-048","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"c0c68f9c43ba8c8410662f8d79030ce28b14207be2f58cf84006ef873673619d","metrics":m,"first_failure":r.get("first_failure")}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-048"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-state-carry-depth-048
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
