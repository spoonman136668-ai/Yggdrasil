name: ITD-02 C38 FIT-only source numerical model fingerprint attribution
on:
  push:
    branches:
      - research/itd02-c38-fit-numerical-identity-20261025
permissions:
  contents: read
  actions: read
concurrency:
  group: itd02-c38-numeric-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-public-numeric-fingerprint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate source-first audit and frozen original R3/C36/C37
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b5121c68621949f28aa7b2608f8896a0f9358c7d "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          test "$(git hash-object research/mass_r7c36/run.py)" = "6262dd2f70a972ab7fca7d6b294582fecc87ce23"
          test "$(git hash-object research/mass_r7c37/PREREG.json)" = "1bc5ace19e8bdcae2509bfc293cb1442415b0064"
          python -m pip install numpy==1.26.4
          python -m py_compile research/mass_r7c38/numeric_identity.py research/mass_r7c38/test_numeric_identity.py
          python -B -m unittest research.mass_r7c38.test_numeric_identity -v
          echo C38_ORIGINAL_SOURCE_ONLY_NUMERIC_IDENTITY_FOCUS=PASS
      - name: Download exact original archived physical FIT only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c38-c35-FIT" "$RUNNER_TEMP/c38-results"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/c38-original-C35.zip" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/12603145885/zip"
          echo "4e35aef3238b6ba2b9d83c4e9e288ff2d8dd3edd23177974b9deb088cca66ca3  $RUNNER_TEMP/c38-original-C35.zip" | sha256sum -c -
          python -m zipfile -e "$RUNNER_TEMP/c38-original-C35.zip" "$RUNNER_TEMP/c38-c35-FIT"
          echo C38_ORIGINAL_C35_PUBLIC_PHYSICAL_FIT_SHA256=PASS
      - name: Repeat FIT-model fingerprints in fresh processes at one-thread and two-thread BLAS
        shell: bash
        run: |
          set -euo pipefail
          export OPENBLAS_NUM_THREADS=1
          python -B -m research.mass_r7c38.numeric_identity --original-fit-dir "$RUNNER_TEMP/c38-c35-FIT" --out "$RUNNER_TEMP/c38-results/source-one-thread-a.json"
          python -B -m research.mass_r7c38.numeric_identity --original-fit-dir "$RUNNER_TEMP/c38-c35-FIT" --out "$RUNNER_TEMP/c38-results/source-one-thread-b.json"
          export OPENBLAS_NUM_THREADS=2
          python -B -m research.mass_r7c38.numeric_identity --original-fit-dir "$RUNNER_TEMP/c38-c35-FIT" --out "$RUNNER_TEMP/c38-results/source-two-threads.json"
          python - <<'PY'
          import os,json,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"c38-results"
          a,b,c=(json.loads((folder/n).read_text()) for n in ("source-one-thread-a.json","source-one-thread-b.json","source-two-threads.json"))
          assert a["science"]==b["science"] and a["science_sha256"]==b["science_sha256"],"C38_FRESH_PROCESS_SAME_HOST_DRIFT"
          fields=("source_original_FIT_training_order_sha256",
                  "real_selected_source_FIT_model_features_sha256",
                  "real_selected_source_FIT_real_progress_labels_sha256",
                  "model_prior_count_sha256","model_conditional_count_sha256",
                  "actual_source_motor_count_sha256","feature_XTX_float64_bytes_sha256",
                  "feature_XTY_float64_bytes_sha256","normal_equations_matrix_float64_bytes_sha256")
          diffs=[k for k in fields if a["science"][k]!=c["science"][k]]
          if diffs:status="SOURCE_OR_NORMAL_EQUATION_INPUT_DRIFT"
          elif a["science"]["original_C36_unmodified_fitted_model_sha256"]!=c["science"]["original_C36_unmodified_fitted_model_sha256"]:
              status="RIDGE_FLOAT64_SOLVER_THREAD_DRIFT_WITH_IDENTICAL_INPUT"
          else:status="FIT_ONLY_THIS_HOST_THREAD_INVARIANCE_NO_CROSSHOST_IDENTITY_ASSUMED"
          print("C38_ORIGINAL_C35_WHOLE_PHYSICAL_SOURCE=PASS")
          print("C38_FRESH_PROCESS_SAME_HOST_SOURCE_MODEL=PASS")
          print("C38_THREAD_1_VS_2_ATTRIBUTION="+status)
          print("C38_FROZEN_OLD_C37_CROSS_HOST_DRIFT_STILL_UNQUALIFIED=TRUE")
          print("C38_NEW_MINIGRID_RESET_STEP=ZERO; C38_PROTECTED_FIRST_USE=DENIED")
          PY
      - name: Preserve public-only source numeric identity in GitHub Actions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-c38-FIT-only-numeric-fingerprint-${{ matrix.os }}
          path: ${{ runner.temp }}/c38-results/
          if-no-files-found: warn
          retention-days: 80
