name: Yggdrasil Y028 frozen alternating-drift science
on:
  push:
    branches: [research/y028-alternating-drift-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen parent prereg and source before first use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 953cdd64cfac1dc84ac782653f2d49a54101e90a HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y027-drift-dose/execute.py)" = 121e488c19a4e0536d76304e3a4c0524bf5b1f8c
          test "$(git hash-object research/contrib/chatgpt/20261012-y028-alternating-drift/prereg.json)" = c1242c88f4bea6df2b6e204277e5096678c16d69
          test "$(git hash-object research/contrib/chatgpt/20261012-y028-alternating-drift/execute.py)" = b0a570bc7fddc0580f335e586262a0580288be61
          python3 -m json.tool research/contrib/chatgpt/20261012-y028-alternating-drift/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-y028-alternating-drift/execute.py
      - name: Original frozen alternating-drift science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-y028-alternating-drift/execute.py > /tmp/Y028-original.json
          python3 -m json.tool /tmp/Y028-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y028-original-alternating-drift
          path: /tmp/Y028-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Final Yggdrasil full regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
