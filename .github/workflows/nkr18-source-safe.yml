name: NKR18 knowledge acquisition and compact retention
on:
  push:
    branches: [research/nkr18-knowledge-acquisition-retention-20261116]
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  final-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact candidate and preregistration custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 23e95651f408ca05a8307e172575afe0d581925f HEAD
          git merge-base --is-ancestor 4287499900d9911038d3113eb201e16adc37d3b9 HEAD
          test -f research/contrib/chatgpt/NKR-18/result.json
          test -z "$(git status --porcelain)"
      - name: Focused qualification and mandatory complete root regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_native_compact_knowledge.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: One frozen Windows replication of local Linux primary
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/NKR-18/experiment.py --verify research/contrib/chatgpt/NKR-18/result.json
          test -z "$(git status --porcelain)"
  independent-g29:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent exact-source code index qualification
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
