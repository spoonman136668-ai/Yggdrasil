name: Yggdrasil research autonomy dispatcher

on:
  workflow_run:
    workflows:
      - YGG-A Developmental Lane
      - YGG-B Language Lane
      - YGG-C Scaling Lane
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: yggdrasil-research-autonomy-dispatch-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.head_branch == 'research/ygg-a-developmental' ||
        github.event.workflow_run.head_branch == 'research/ygg-b-language' ||
        github.event.workflow_run.head_branch == 'research/ygg-c-scaling'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch pre-staged successor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PARENT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, json, os, urllib.error, urllib.parse, urllib.request, zipfile

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPO"]
          run_id=os.environ["RUN_ID"]
          branch=os.environ["PARENT_BRANCH"]
          parent_sha=os.environ["PARENT_SHA"]
          api=f"https://api.github.com/repos/{repo}"

          lane_map={
              "research/ygg-a-developmental":("YGG-A","research/control/ygg-a-next.json","research/control/ygg-a-run.json"),
              "research/ygg-b-language":("YGG-B","research/control/ygg-b-next.json","research/control/ygg-b-run.json"),
              "research/ygg-c-scaling":("YGG-C","research/control/ygg-c-next.json","research/control/ygg-c-run.json"),
          }
          lane,next_path,control_path=lane_map[branch]

          def request(method,url,body=None,accept="application/vnd.github+json"):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(
                  url,data=data,method=method,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":accept,
                      "X-GitHub-Api-Version":"2026-03-10",
                      "Content-Type":"application/json",
                      "User-Agent":"yggdrasil-research-autonomy/1",
                  })
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status,r.read(),r.headers
              except urllib.error.HTTPError as e:
                  return e.code,e.read(),e.headers

          def get_content(path,ref):
              q=urllib.parse.urlencode({"ref":ref})
              st,raw,_=request("GET",f"{api}/contents/{urllib.parse.quote(path,safe='/')}?{q}")
              if st==404:
                  return None
              if st!=200:
                  raise SystemExit(f"CONTENT_GET_FAILED path={path} status={st} body={raw[:300]!r}")
              obj=json.loads(raw)
              return obj,base64.b64decode(obj["content"])

          item=get_content(next_path,branch)
          if item is None:
              print("AUTONOMY_NO_PRESTAGED_SUCCESSOR")
              raise SystemExit(3)
          next_meta,next_bytes=item
          plan=json.loads(next_bytes.decode("utf-8-sig"))
          if plan.get("schema")!="yggdrasil.research-autonomy-next.v1":
              raise SystemExit("AUTONOMY_PLAN_SCHEMA_MISMATCH")
          if plan.get("enabled") is not True:
              print("AUTONOMY_PLAN_DISABLED")
              raise SystemExit(0)
          if plan.get("parent_run_head_sha")!=parent_sha:
              raise SystemExit(f"AUTONOMY_PARENT_SHA_MISMATCH expected={plan.get('parent_run_head_sha')} actual={parent_sha}")
          if plan.get("lane")!=lane:
              raise SystemExit("AUTONOMY_LANE_MISMATCH")

          st,raw,_=request("GET",f"{api}/actions/runs/{run_id}/artifacts")
          if st!=200:
              raise SystemExit(f"AUTONOMY_ARTIFACT_LIST_FAILED status={st}")
          artifacts=[a for a in json.loads(raw).get("artifacts",[]) if not a.get("expired")]
          if not artifacts:
              raise SystemExit("AUTONOMY_RESULT_ARTIFACT_MISSING")

          parent_experiment=plan.get("parent_experiment")
          classification=None
          for art in sorted(artifacts,key=lambda x:x["id"],reverse=True):
              st,zraw,_=request("GET",art["archive_download_url"],accept="application/octet-stream")
              if st!=200:
                  continue
              try:
                  with zipfile.ZipFile(io.BytesIO(zraw)) as z:
                      for name in z.namelist():
                          if not name.lower().endswith(".json"):
                              continue
                          try:
                              obj=json.loads(z.read(name).decode("utf-8-sig"))
                          except Exception:
                              continue
                          if obj.get("experiment")==parent_experiment:
                              q=obj.get("qualification") or {}
                              classification=q.get("classification") or obj.get("classification")
                              if classification:
                                  break
                  if classification:
                      break
              except zipfile.BadZipFile:
                  continue
          if not classification:
              raise SystemExit(f"AUTONOMY_CLASSIFICATION_MISSING parent_experiment={parent_experiment}")

          routes=plan.get("routes") or {}
          route=routes.get(classification) or routes.get("*")
          if not isinstance(route,dict):
              raise SystemExit(f"AUTONOMY_ROUTE_MISSING classification={classification}")
          next_control=route.get("next_control")
          if not isinstance(next_control,dict):
              raise SystemExit("AUTONOMY_NEXT_CONTROL_MISSING")
          if next_control.get("schema")!=1 or next_control.get("lane")!=lane:
              raise SystemExit("AUTONOMY_NEXT_CONTROL_INVALID")
          if not str(next_control.get("request_id","")).startswith(lane+"-"):
              raise SystemExit("AUTONOMY_NEXT_REQUEST_ID_INVALID")

          current_item=get_content(control_path,branch)
          if current_item is None:
              raise SystemExit("AUTONOMY_CONTROL_MISSING")
          current_meta,current_bytes=current_item
          canonical=(json.dumps(next_control,indent=2)+"\n").encode()
          if current_bytes==canonical:
              print(f"AUTONOMY_ALREADY_DISPATCHED lane={lane} request={next_control['request_id']}")
              raise SystemExit(0)

          body={
              "message":f"research: autonomous dispatch {next_control['request_id']}",
              "content":base64.b64encode(canonical).decode(),
              "sha":current_meta["sha"],
              "branch":branch,
          }
          st,raw,_=request("PUT",f"{api}/contents/{urllib.parse.quote(control_path,safe='/')}",body)
          if st not in (200,201):
              raise SystemExit(f"AUTONOMY_DISPATCH_WRITE_FAILED status={st} body={raw[:300]!r}")
          print(json.dumps({
              "schema":"yggdrasil.research-autonomy-dispatch.v1",
              "lane":lane,
              "parent_sha":parent_sha,
              "parent_experiment":parent_experiment,
              "classification":classification,
              "successor_request_id":next_control["request_id"],
              "status":"DISPATCHED",
          },sort_keys=True))
          PY
