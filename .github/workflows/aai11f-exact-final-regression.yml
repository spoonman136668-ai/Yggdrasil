name: AAI-11F exact-final 124-test per OS original Yggdrasil and benchmark regression
on:
  push:
    branches: [research/aai11f-final-regression-once-20261114]
    paths: [.github/workflows/aai11f-exact-final-regression.yml]
permissions:
  contents: read
concurrency:
  group: aai11f-final-full-once-20261114
  cancel-in-progress: false
jobs:
  final-readonly:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11F immutable final 124-test per OS regression one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Prove independent one-shot harness based on verified immutable main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11f-exact-final-regression.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI11F_INDEPENDENT_NO_WRITE_HARNESS_PASS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: 36cc12381a4153048e5971899fa388a0aafd7480
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin exact final candidate, original main, stacked source/prereg and G29
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '36cc12381a4153048e5971899fa388a0aafd7480'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai11e-risk-suppression-diagnostic-20261114 | cut -f1)" = 'f9429b90e35c6b98b85a328e8b5c6186519ea27d'
          test "$(git ls-remote origin refs/heads/research/aai11f-oracle-goal-ceiling-audit-20261114 | cut -f1)" = '36cc12381a4153048e5971899fa388a0aafd7480'
          test "$(git rev-parse a595a2ccb701f6e69c530c701906740ae01483f0^)" = 'f9429b90e35c6b98b85a328e8b5c6186519ea27d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/prereg.json)" = '60b0015b9c39c043084b6c9bd8368e7ac85c3883'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/prereg.json)" = "$(git rev-parse a595a2ccb701f6e69c530c701906740ae01483f0:research/contrib/chatgpt/AAI-11F/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/audit.py)" = '299a79cf8101a6a7a8231c693d52b022fab22e07'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/test_audit.py)" = '3dc247a8ea35aa84133d889ce03bc2e33def91f7'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11E/diagnose.py)" = '07447fba4ebc4a3fa175f1a479a48424b793e11d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/dev.py)" = 'ce807c4fa3b7742b4299580087dc41b68359533e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/diagnose.py)" = '499662a5939796f502ccd47c97950a4d1fbd6b2f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11B/contrast.py)" = '69ff21daf627feeaaca6661f8f3c8096efbe4de8'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/admission.py)" = '0f921dfeebda9ad3a0e217747e4b0365ba9c655e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI11F_EXACT_FINAL_AUDIT_PROVENANCE_AND_ATLAS_PASS
      - name: Original native full and all seven independent benchmark suites
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11P -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11A -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11B -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11C -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11D -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11E -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11F -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11F/audit.py --primary >/dev/null 2>&1; then
            echo AAI11F_UNAUTHORIZED_FIRST_USE >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo AAI11F_MANDATORY_EXACT_FINAL_FULL_REGRESSION_PASS_NO_SCIENCE
