name: WSP99 source-pinned G29 + exact-tree final regression
on:
  push:
    branches:
      - research/wsp99-delayed-causal-task-20261114
permissions:
  contents: read
jobs:
  one-shot-g29:
    if: "github.event.head_commit.message == 'ci(wsp99): source-pin G29 atlas' && github.run_attempt == 1"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp99-one-shot-g29-source-pin
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dev-control dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: Prove frozen WSP98 source, prereg lineage, fixture-only successful qualification
        shell: bash
        run: |
          set -euo pipefail
          S="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$S"
          git merge-base --is-ancestor babec7b7a352ab5f322217dac200dbf5591edee6 "$S"
          git merge-base --is-ancestor 42d0b79ef173b00c3a2b0270fadb80b30bcdf044 "$S"
          git merge-base --is-ancestor 9c0beaf1a55a7b1dd73e5e21d3936042f94d1788 "$S"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          git diff --exit-code a24c6ec7d23e56b6462dcf43cbd4a72256a35ff3 "$S" -- research/contrib/chatgpt/WSP-98
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p 'test_*.py' -v
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
      - name: One-shot source-pinned G29 regenerate generated artifacts ONLY
        shell: bash
        run: |
          set -euo pipefail
          S="$GITHUB_SHA"
          python scripts/build_code_atlas.py --source-commit "$S" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(wsp99): pin G29 source atlas at $S"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp99-delayed-causal-task-20261114
          echo "WSP99_G29_SOURCE=$S"
          echo "WSP99_G29_ARTIFACT_COMMIT=$B"
  exact-tree-regression:
    if: "github.event.head_commit.message == 'ci(wsp99): exact-tree final dual-platform qualification' && github.run_attempt == 1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned control dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: Verify exact SHA, accepted ancestor, prereg, first-use preservation, G29
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a24c6ec7d23e56b6462dcf43cbd4a72256a35ff3 HEAD
          git merge-base --is-ancestor babec7b7a352ab5f322217dac200dbf5591edee6 HEAD
          git merge-base --is-ancestor 9c0beaf1a55a7b1dd73e5e21d3936042f94d1788 HEAD
          git diff --exit-code a24c6ec7d23e56b6462dcf43cbd4a72256a35ff3 HEAD -- research/contrib/chatgpt/WSP-98
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          python scripts/build_code_atlas.py --check-if-present
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
      - name: Complete WSP99 tests including numerical gradient negative controls
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p 'test_*.py' -v
      - name: Retain WSP98 source-blind focused regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-98 -p 'test_*.py' -v
      - name: Mandatory inherited WSP80-WSP97 full focused regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 80 81 82 83 84 85 86 87 88 89 90 91 92 93 94 95 96 97; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory complete Yggdrasil root regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Final frozen source and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
