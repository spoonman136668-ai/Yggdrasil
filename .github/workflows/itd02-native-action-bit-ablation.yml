name: ITD-02 original native action-input vs reward-output control
on:
  push:
    branches:
      - qualification/itd02-native-action-bit-ablation-20261027
permissions:
  contents: read
jobs:
  original-native-action-output:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SOURCE_SHA: a39171a76d0d7817e3563682bb139a9d7ecf37c4
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable platform-specific Git source rewrites
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen source exactly and read-only diagnostic additions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          source=os.environ["SOURCE_SHA"]
          for p in ("yggdrasil/task_runtime.py",
                    "yggdrasil/developmental.py",
                    "yggdrasil/itd02_native_task_bridge_dev.py",
                    "yggdrasil/itd02_local_ring_memory_dev.py",
                    "tests/test_itd02_native_task_bridge_dev.py"):
              expected=subprocess.check_output(["git","show",source+":"+p])
              assert Path(p).read_bytes()==expected,("FROZEN_ORIGINAL_SOURCE_DRIFT",p)
          actual=set(subprocess.check_output(
              ["git","diff","--name-only",source,"HEAD"],text=True).splitlines())
          authorized={
            "research/diagnostics/itd02-native-action-output-overlap-prereg-20261027.md",
            "research/diagnostics/itd02_native_action_reward_overlap_20261027.py",
            ".github/workflows/itd02-native-action-bit-ablation.yml"}
          assert actual==authorized,("FORBIDDEN_SOURCE_CHANGES",actual)
          print("SOURCE_FROZEN_UNCHANGED_PASS")
          PY
          test -z "$(git status --porcelain)"
      - name: Contrast each action bit with identical observation-only probe
        shell: bash
        run: |
          set -euo pipefail
          python -B research/diagnostics/itd02_native_action_reward_overlap_20261027.py
          test -z "$(git status --porcelain)"
      - name: Preserve input-site intervention evidence and all trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd02-action-output-overlap-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/itd02_native_action_bit_summary.json
            ${{ runner.temp }}/itd02_native_action_bit_trials.json
          if-no-files-found: warn
          retention-days: 14
