name: QTR-01 F18 real-causal public DEV headroom

on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-f18-headroom-dev.yml
      - research/contrib/chatgpt/QTR-01/f18_headroom_screen.py
      - research/contrib/chatgpt/QTR-01/test_f18_headroom_screen.py
      - research/contrib/chatgpt/QTR-01/f18_dev_prereg.json

permissions:
  contents: read

jobs:
  open-dev-headroom:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      UPSTREAM_SHA: 51f1431515e310dec72e3f4b6db378df46f832ea
      UPSTREAM_TREE: c1bf53ecf03ae326b69c0321f4412d81f3122894
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Acquire exact public upstream commit/tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qtr-f18-upstream"
          git init -q "$root"
          git -C "$root" remote add origin https://github.com/noumenal-ai/causal-worlds.git
          git -C "$root" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$root" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(git -C "$root" rev-parse 'HEAD^{tree}')" = "$UPSTREAM_TREE"
      - name: Install exact upstream core environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.9.17
          cd "$RUNNER_TEMP/qtr-f18-upstream"
          uv sync --locked --no-dev
      - name: Focused source-free linear, nonlinear and MLP tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qtr-f18-upstream/.venv/bin/python" -m unittest discover \
            -s research/contrib/chatgpt/QTR-01 -p 'test_f18_*.py' -v
      - name: Frozen public DEV intervention baseline screen
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qtr-f18-upstream/.venv/bin/python" \
            research/contrib/chatgpt/QTR-01/f18_headroom_screen.py \
            --upstream-root "$RUNNER_TEMP/qtr-f18-upstream"
      - name: Verify checkout unchanged
        shell: bash
        run: git diff --exit-code
