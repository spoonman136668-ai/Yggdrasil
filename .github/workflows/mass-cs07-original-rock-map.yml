name: Mass CS07 original POBAX public-map discovery and sensor identifiability
on:
  push:
    branches:
      - research/mass-cs07-original-rock-map-identifiability-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs07-pobax-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-rock-information:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout original immutable source-first research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Verify CS07 frozen prereg is first and files are additive
        shell: bash
        run: |
          set -euo pipefail
          first=0dfedae472a0acd1a449fdfd5ad42f4e4bd406e8
          parent=b49b87fb56ff3141cf1e06749b0d48c1c5df39df
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS07_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS07_PREREG.md","research/native/itd01/mass_r10/run_cs07_original_rock_map.py",".github/workflows/mass-cs07-original-rock-map.yml"};assert got==want,(got,want)'
      - name: Checkout exact independent original POBAX source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taodav/pobax
          ref: a5e1d62d14e4efe783885b9d4f19cffa2a568eec
          path: external/pobax-original
          persist-credentials: false
      - name: Set Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original source CPU JAX dependencies under bound
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs07-evidence
          set +e
          timeout 480s python -m pip install --no-cache-dir --timeout 35 --retries 1 'jax==0.6.2' 'jaxlib==0.6.2' chex gymnax flax brax >cs07-evidence/pip-install.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 60s python -m pip install --no-deps -e external/pobax-original >>cs07-evidence/pip-install.log 2>&1
            rc=$?
          fi
          set -e
          echo "$rc" >cs07-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Execute frozen real original-source public location identification
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs07_original_rock_map.py \
            --upstream external/pobax-original --out cs07-evidence/
      - name: Preserve untouched source-native proof and negative receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs07-pobax-public-rock-map-source
          path: cs07-evidence/
          retention-days: 30
