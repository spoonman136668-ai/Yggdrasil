name: WSP103 frozen train-only source headroom DEV audit
on:
  push:
    branches: [research/wsp103-real-kg-headroom-20261114]
permissions:
  contents: read
jobs:
  dev-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin prereg before code, source parent and no original first use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b31875fa8306eb13a742d103cfb08f6273916e1e HEAD
          git merge-base --is-ancestor e9c7e396d8229a3d8296b072e3474bcdc9543498 HEAD
          git diff --exit-code b31875fa8306eb13a742d103cfb08f6273916e1e HEAD -- research/contrib/chatgpt/WSP-102
          test ! -f research/contrib/chatgpt/WSP-103/SCIENTIFIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-103/PROTECTED_FIRST_USE.json
          test -z "$(git status --porcelain)"
      - name: WSP103 source-only fake-data positive and negative tests
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-103 -p 'test_*.py' -v
      - name: Check no source mutation
        shell: bash
        run: test -z "$(git status --porcelain)"

  one-shot-g29:
    needs: [dev-fixtures]
    if: "github.event.head_commit.message == 'ci(wsp103): source-pin G29 atlas' && github.run_attempt == 1 && needs.dev-fixtures.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp103-source-pinned-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin frozen design and generator, reanchor atlas only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e9c7e396d8229a3d8296b072e3474bcdc9543498 HEAD
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          git diff --exit-code b31875fa8306eb13a742d103cfb08f6273916e1e HEAD -- research/contrib/chatgpt/WSP-102
          S="$GITHUB_SHA"
          python scripts/build_code_atlas.py --write --source-commit "$S"
          git add -- .ice/code-atlas.json .ice/code-atlas.ice .ice/code-atlas.html
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp103): pin G29 source atlas at $S"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp103-real-kg-headroom-20261114
          echo "WSP103_G29_SOURCE=$S"
          echo "WSP103_G29_COMPANION=$B"

  final-regression:
    needs: [dev-fixtures]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp103): pin G29 source atlas at ') && github.run_attempt == 1 && needs.dev-fixtures.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact candidate, unchanged WSP102, G29 and public admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e9c7e396d8229a3d8296b072e3474bcdc9543498 HEAD
          git diff --exit-code b31875fa8306eb13a742d103cfb08f6273916e1e HEAD -- research/contrib/chatgpt/WSP-102
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          python scripts/build_code_atlas.py --check-if-present
          test ! -f research/contrib/chatgpt/WSP-103/PROTECTED_FIRST_USE.json
          test -z "$(git status --porcelain)"
      - name: Complete WSP103 source-only unit regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-103 -p 'test_*.py' -v
      - name: Complete inherited WSP102 and WSP98 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s research/contrib/chatgpt/WSP-102 -p 'test_*.py' -v
          python -m unittest discover -s research/contrib/chatgpt/WSP-98 -p 'test_*.py' -v
      - name: Mandatory WSP80-97 focused regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 80 81 82 83 84 85 86 87 88 89 90 91 92 93 94 95 96 97; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory root regression and exact-tree cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"

  train-only-headroom-audit:
    needs: [dev-fixtures, final-regression]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp103): pin G29 source atlas at ') && github.run_attempt == 1 && needs.final-regression.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    permissions:
      contents: read
    concurrency:
      group: wsp103-historical-train-only-source-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze exact source and enforce original-first-use prohibition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e9c7e396d8229a3d8296b072e3474bcdc9543498 HEAD
          test ! -f research/contrib/chatgpt/WSP-103/PROTECTED_FIRST_USE.json
          test ! -f research/contrib/chatgpt/WSP-103/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Original real TRAIN-only structural headroom audit; no learning or scoring
        run: python research/contrib/chatgpt/WSP-103/train_headroom_audit.py --train-only-dev-source-headroom
      - name: Verify checkout unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"
