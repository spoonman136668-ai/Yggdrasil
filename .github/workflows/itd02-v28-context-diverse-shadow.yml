name: ITD-02 V28 source-only context-diverse shadow falsification
on:
  push:
    branches:
      - research/itd02-v28-context-diverse-return-20261028
permissions:
  contents: read
jobs:
  v28-shadow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and prereg chronology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 24f2f3919c8bb378831f48f8c7bd0a6e2423e45f "$GITHUB_SHA"
          git merge-base --is-ancestor adc8ee5ce606740edceda943f86a8a0a9ef5b25b "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
      - name: Preregistered shadow selector, unchanged V27 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v28"
          if ! PYTHONPATH=. python -B research/itd02_v28_context_diverse_shadow_audit.py > "$RUNNER_TEMP/v28/audit.json" 2> "$RUNNER_TEMP/v28/error.log"; then
            cat "$RUNNER_TEMP/v28/error.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v28/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="ygg.itd02.v28.context_diverse_shadow_source_only.v1"
          assert d["streams"]==7 and d["distinct_context_negative_control"]
          assert d["offline_stage_label_invariant"] and d["tamper_digest_changes"]
          assert d["candidate_is_shadow_counterfactual_not_deployed_module"]
          assert len(d["canonical_shadow_sha256"])==64
          assert not d["scientific_first_use"] and not d["original_world_training"]
          print("V28_CONTEXT_DIVERSE_SHADOW_DIAGNOSTIC_SOURCE_ONLY")
          PY
          cat "$RUNNER_TEMP/v28/audit.json"
      - name: Inherited V27 and original-native scoped checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve host audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v28-shadow-${{ matrix.os }}
          path: ${{ runner.temp }}/v28/*
          retention-days: 7
          if-no-files-found: warn
