name: WSP156 native six-bit witnessed projection and full regression
on:
  push:
    branches: [research/wsp156-partial-witness-native-projection-20261117]
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require immutable prereg-before-code, parent and trusted semantics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse a4635cf282689edeb97a3d88249cdfba5b8deed9^)" = "188a57a1af3e392096c0690590f5c4e4e58a3fbd"
          test "$(git diff-tree --no-commit-id --name-only -r a4635cf282689edeb97a3d88249cdfba5b8deed9)" = "research/contrib/chatgpt/WSP-156/prereg.json"
          git merge-base --is-ancestor a4635cf282689edeb97a3d88249cdfba5b8deed9 HEAD
          git diff --exit-code a4635cf282689edeb97a3d88249cdfba5b8deed9 HEAD -- research/contrib/chatgpt/WSP-156/prereg.json
          git diff --exit-code 188a57a1af3e392096c0690590f5c4e4e58a3fbd HEAD -- yggdrasil/native_evidence_compiler.py yggdrasil/native_relation_memory.py yggdrasil/public_causal_cells.py research/contrib/chatgpt/NKR-04 yggdrasil/native_sixbit_projection.py tests/test_native_sixbit_projection.py research/contrib/chatgpt/WSP-155
          test ! -e research/contrib/chatgpt/WSP-156/source.py
          test ! -e research/contrib/chatgpt/WSP-156/experiment.py
          test ! -e research/contrib/chatgpt/WSP-156/result.json
          test ! -e research/contrib/chatgpt/WSP-156/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-156/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: New source-free native projection and inherited NKR04 tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_native_partial_sixbit_projection.py -v
          python -B -m unittest discover -s tests -p test_native_sixbit_projection.py -v
          python -B -m unittest discover -s tests -p test_native_evidence_compiler.py -v
          python -B -m unittest discover -s tests -p test_native_relation_supported.py -v
          python -B -m unittest discover -s tests -p test_native_relation_memory.py -v
          python -B -m unittest discover -s tests -p 'test_native_cells*.py' -v
          test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(wsp156): source-pin G29 atlas' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: wsp156-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Produce only three derived G29 files, exact source identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code a4635cf282689edeb97a3d88249cdfba5b8deed9 HEAD -- research/contrib/chatgpt/WSP-156/prereg.json
          git diff --exit-code 188a57a1af3e392096c0690590f5c4e4e58a3fbd HEAD -- yggdrasil/native_evidence_compiler.py yggdrasil/native_relation_memory.py yggdrasil/public_causal_cells.py research/contrib/chatgpt/NKR-04 yggdrasil/native_sixbit_projection.py tests/test_native_sixbit_projection.py research/contrib/chatgpt/WSP-155
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp156): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp156-partial-witness-native-projection-20261117

  final-regression:
    needs: [preflight]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp156): pin G29 source atlas at ') && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing original root suite dependency
        run: python -m pip install --disable-pip-version-check --no-input 'numpy==2.2.6'
      - name: Mandatory full inherited original root regression, safety and source atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse a4635cf282689edeb97a3d88249cdfba5b8deed9^)" = "188a57a1af3e392096c0690590f5c4e4e58a3fbd"
          git diff --exit-code a4635cf282689edeb97a3d88249cdfba5b8deed9 HEAD -- research/contrib/chatgpt/WSP-156/prereg.json
          git diff --exit-code 188a57a1af3e392096c0690590f5c4e4e58a3fbd HEAD -- yggdrasil/native_evidence_compiler.py yggdrasil/native_relation_memory.py yggdrasil/public_causal_cells.py research/contrib/chatgpt/NKR-04 yggdrasil/native_sixbit_projection.py tests/test_native_sixbit_projection.py research/contrib/chatgpt/WSP-155
          test ! -e research/contrib/chatgpt/WSP-156/result.json
          test ! -e research/contrib/chatgpt/WSP-156/first_use_authorization.json
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
