name: ITD-02 R10-on-R9 original-source qualification
on:
  push:
    branches: [qualification/itd02-r10-on-r9-g29-20261025]
permissions:
  contents: read
jobs:
  source-and-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original R9 and R10 provenance is preserved, new G29 is exact accepted blob
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d17faaf05fc2e13d8cf66b1f1e9bcfde0fef8f9f HEAD
          git merge-base --is-ancestor c66064abb438e743fc4c30cf9c1a382cebef8e98 HEAD
          git merge-base --is-ancestor 50bad5c0568e2eba0c38ab204876f2abae7abdeb HEAD
          git merge-base --is-ancestor 1ff734e7d5c8b0d4a9f26395b23eb50547a4177e HEAD
          test "$(git rev-parse HEAD:.github/workflows/yggdrasil-g29-atlas.yml)" = baa005e32579327d5dde27a1a7bf653eb85c665c
          test "$(git rev-parse HEAD:research/native/itd02/r9/evidence_cells.py)" = 66ec3befe92e2d2c2b7116217354a40f59e659d7
          test "$(git rev-parse HEAD:research/native/itd02/r9/PREREG.json)" = 84637ba02627a4b817b0d894b124055ce352543d
          test "$(git rev-parse HEAD:research/native/itd02/r10/public_adapter.py)" = 3917d36ce9f86a2c1b998a0a2f93fb27674a9205
          test "$(git rev-parse HEAD:research/native/itd02/r10/test_public_adapter.py)" = f48835a97579821f45875db30dba3887d76b6595
          test "$(git rev-parse HEAD:research/native/itd02/r10/PREREG.json)" = 8cfbbe0b17842361a173af3f14ab1a8837cfb763
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = 204ecd993b954b23e66d6d1e8b3568e7c93183c5
          test "$(git rev-parse HEAD:research/native/itd02/r8/revision.py)" = 346fb9eb7462208a6cbd28cfb51716c22e5ec857
          echo R10_R9_ORIGINAL_CUSTODY_PASS
      - name: Complete all original R9 and R10 source-only tests and atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r9 -p 'test_evidence_cells.py' -v
          python -B -m unittest discover -s research/native/itd02/r10 -p 'test_public_adapter.py' -v
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo R10_ON_REPAIRED_R9_SOURCE_ONLY_PASS
          echo ORIGINAL_MINIGRID_EPISODES_ZERO
          echo FSA_PROTECTED_SCIENCE_FIRST_USE_ZERO
  one-shot-atlas:
    if: github.event.head_commit.message == 'Arm R10-on-R9 G29 qualification artifact reanchor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reanchor only three generated artifacts to authenticated combined-source commit
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor d17faaf05fc2e13d8cf66b1f1e9bcfde0fef8f9f "$A"
          git merge-base --is-ancestor c66064abb438e743fc4c30cf9c1a382cebef8e98 "$A"
          test "$(git rev-parse HEAD:.github/workflows/yggdrasil-g29-atlas.yml)" = baa005e32579327d5dde27a1a7bf653eb85c665c
          test "$(git rev-parse HEAD:research/native/itd02/r10/public_adapter.py)" = 3917d36ce9f86a2c1b998a0a2f93fb27674a9205
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-anchor R10-on-R9 source-only atlas to $A"
          B="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$A" "$B"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/qualification/itd02-r10-on-r9-g29-20261025
          echo R10_INTEGRATED_SOURCE_A="$A"
          echo R10_G29_ARTIFACT_ONLY_B="$B"
