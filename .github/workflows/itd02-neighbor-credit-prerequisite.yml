name: ITD-02 neighbor-local conditional credit prerequisite
on:
  push:
    branches:
      - research/itd02-neighbor-local-context-credit-20261027
permissions:
  contents: read
jobs:
  frozen-capacity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: 3a32bd54f270058462d662302eb5732878d2edee
    steps:
      - name: Preserve git bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-frozen read-only original/native diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          for p in ("yggdrasil/itd02_native_task_bridge_dev.py",
                    "yggdrasil/itd02_local_ring_memory_dev.py",
                    "yggdrasil/task_runtime.py"):
              assert Path(p).read_bytes()==subprocess.check_output(
                  ["git","show",os.environ["SOURCE_SHA"]+":"+p]),p
          allowed={
           "research/experiments/itd02-neighbor-credit-prerequisite-20261027.md",
           "research/diagnostics/itd02_neighbor_credit_capacity_20261027.py",
           ".github/workflows/itd02-neighbor-credit-prerequisite.yml"}
          changed=set(subprocess.check_output(
            ["git","diff","--name-only",os.environ["SOURCE_SHA"],"HEAD"],text=True).splitlines())
          assert changed==allowed,changed
          PY
      - name: Verify local observation-action credit capacity
        shell: bash
        run: |
          set -euo pipefail
          python -B research/diagnostics/itd02_neighbor_credit_capacity_20261027.py
          test -z "$(git status --porcelain)"
      - name: Save source-frozen capacity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd02-local-credit-capacity-${{ matrix.os }}
          path: ${{ runner.temp }}/itd02_neighbor_credit_prerequisite.json
          if-no-files-found: warn
          retention-days: 14
