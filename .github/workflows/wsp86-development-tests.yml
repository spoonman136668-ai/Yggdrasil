name: WSP86 216-triple coverage unit qualification
on:
  push:
    branches: [research/wsp80-paid-novelty-structural-weight-repair-20261113]
permissions:
  contents: read
jobs:
  coverage-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Six synthetic coverage and isolation tests, zero scientific first-use
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-86 -p 'test_*.py' -v
      - name: Exact checkout, no modified artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
