name: ITD-02 source-frozen temporal state feasibility
on:
  push:
    branches:
      - qualification/itd02-temporal-state-feasibility-20261027
permissions:
  contents: read
jobs:
  feasibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SOURCE_SHA: 50f7326026f6bf857ab9c62a29fa1b57db4ad815
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable source line ending rewriting
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-custody read-only fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          original=os.environ["SOURCE_SHA"]
          paths=("yggdrasil/task_runtime.py","yggdrasil/developmental.py",
              "yggdrasil/itd02_native_task_bridge_dev.py",
              "yggdrasil/itd02_local_ring_memory_dev.py")
          for p in paths:
              assert Path(p).read_bytes()==subprocess.check_output(
                  ["git","show",original+":"+p]),p
          diff=set(subprocess.check_output(
              ["git","diff","--name-only",original,"HEAD"],text=True).splitlines())
          assert diff=={
             "research/diagnostics/itd02_temporal_state_feasibility_20261027.py",
             ".github/workflows/itd02-temporal-state-feasibility.yml"
          },diff
          print("EXACT_ORIGINAL_SOURCE_READONLY_PASS")
          PY
      - name: Test trained native phase order and cold process retention
        shell: bash
        run: |
          set -euo pipefail
          python -B research/diagnostics/itd02_temporal_state_feasibility_20261027.py
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itd02-temporal-feasibility-${{ matrix.os }}
          path: ${{ runner.temp }}/itd02_temporal_feasibility.json
          if-no-files-found: warn
          retention-days: 14
