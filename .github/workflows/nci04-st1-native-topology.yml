name: NCI04 ST1 Native Structural Learning Qualification
on:
  push:
    branches:
      - research/nci04-st1-adaptive-local-topology-20261114
  pull_request:
    branches:
      - research/nci04-s2-learned-topology-necessity-20261021
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Byte-stable checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze/provenance and registered nonfirstuse audit
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          doc=json.loads(Path('research/nci04_st1/frozen_protocol.json').read_text('utf-8'))
          assert doc['schema']=='yggdrasil.nci04.st1.adaptive-local-topology.dev.v1'
          assert doc['status']=='PREREG_FROZEN_BEFORE_IMPLEMENTATION_OR_ANY_NEW_OUTCOME'
          assert doc['independent_first_use'] is False
          parent=doc['base_source_sha']
          assert subprocess.run(['git','merge-base','--is-ancestor',parent,'HEAD']).returncode==0
          actual=subprocess.check_output(['git','rev-parse','HEAD:research/nci04_st1/frozen_protocol.json']).decode().strip()
          assert actual=='34d24983ac542e1a280fbe144e88b07b736c9d78'
          print('ST1_FROZEN_SOURCE_BOUNDARY_PASS')
          PY
      - name: Fixed-native-coefficient adaptive-topology mechanical and negatives
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st1_adaptive_topology.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04d2_task.py' -v
          python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
      - name: No generated or mutated source
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  derived_g29:
    if: "${{ github.event.head_commit.message == 'ci(st1): arm one-shot source atlas' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Commit ONLY generated source-pinned atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 43749c5ff285546afc0bae1a4848e48cbe23b6d1 "$A"
          test "$(git rev-parse HEAD:research/nci04_st1/frozen_protocol.json)" = "34d24983ac542e1a280fbe144e88b07b736c9d78"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          EXPECT="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          FOUND="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$FOUND" = "$EXPECT"
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(st1): derived exact-source G29 atlas (three files)"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "3"
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/nci04-st1-adaptive-local-topology-20261114
          echo "ST1_ATLAS_SOURCE=$A"
          echo "ST1_ATLAS_COMPANION=$B"

  full_final:
    if: "${{ github.event.head_commit.message == 'ci(st1): qualify final source' }}"
    name: ST1 final full native regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Byte-stable Windows source checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned inherited source regression dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Exact source and atlas immutable boundaries
        shell: bash
        run: |
          git merge-base --is-ancestor 43749c5ff285546afc0bae1a4848e48cbe23b6d1 HEAD
          test "$(git rev-parse HEAD:research/nci04_st1/frozen_protocol.json)" = "34d24983ac542e1a280fbe144e88b07b736c9d78"
          python scripts/build_code_atlas.py --check
      - name: Full Linux and strictly Windows-applicable inherited native regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python - <<'PY'
          from pathlib import Path
          import unittest
          # These four frozen predecessor modules use POSIX-only Python
          # import resource. Do NOT patch, stub, or reclassify their tests.
          excluded = {
              'test_free_fanout_sidecar.py',
              'test_nci04g6_native_credit.py',
              'test_nci04g7_source_producer.py',
              'test_nci04g7a_environment.py',
          }
          files = sorted(Path('tests').glob('test_*.py'))
          assert excluded.issubset({p.name for p in files})
          for path in files:
              if path.name in excluded:
                  text=path.read_text('utf-8')
                  if path.name == 'test_free_fanout_sidecar.py':
                      # The test dynamically imports the existing sidecar,
                      # whose top-level resource import is POSIX-only.
                      assert 'spec_from_file_location(' in text
                      assert 'free_fanout_sidecar.py' in text
                      assert any(line.strip() == 'import resource' for line in
                          Path('scripts/free_fanout_sidecar.py')
                          .read_text('utf-8').splitlines())
                  else:
                      assert any(line.strip() == 'import resource'
                                 for line in text.splitlines()), path
          suite = unittest.TestSuite()
          loader = unittest.TestLoader()
          for path in files:
              if path.name not in excluded:
                  suite.addTests(loader.discover('tests', pattern=path.name))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print('ST1_WINDOWS_APPLICABLE_NATIVE_REGRESSION_PASS')
          print('ST1_WINDOWS_UNAVAILABLE_POSIX_RESOURCE_MODULES=' +
                ','.join(sorted(excluded)))
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py' -v
            echo ST1_LINUX_FULL_NATIVE_REGRESSION_PASS
          fi
      - name: All original source unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
