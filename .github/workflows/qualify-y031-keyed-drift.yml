name: Yggdrasil Y031 fresh-keyed alternating-drift science
on:
  push:
    branches: [research/y031-keyed-alternating-drift-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check parent, preregistration and first-use exact code
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 72b64a2b9a5344ad3064978c9a4a823c26cac4c4 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y030-new-family/execute.py)" = c6396dd8fb125044618c5e4cfa99a89243a0c481
          test "$(git hash-object research/contrib/chatgpt/20261013-y031-keyed-drift/prereg.json)" = 37af9799a5bc733f8e36e64f3705153c83865464
          test "$(git hash-object research/contrib/chatgpt/20261013-y031-keyed-drift/execute.py)" = aa5336ce09c5ade4477d34d8129ff2f97387f366
          python3 -m json.tool research/contrib/chatgpt/20261013-y031-keyed-drift/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y031-keyed-drift/execute.py
      - name: Original finite keyed-drift matched-cache science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y031-keyed-drift/execute.py > /tmp/Y031-original.json
          python3 -m json.tool /tmp/Y031-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y031-original-keyed-alternating-drift
          path: /tmp/Y031-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
