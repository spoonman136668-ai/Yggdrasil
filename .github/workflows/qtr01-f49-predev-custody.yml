name: QTR-01 F49 seven-arm retention and ablation qualification
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 preregistered retention derive source atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify only the approved workflow was added
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '0414b6cfc6a072ef57f8725c26a67ade406dee15'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f49-predev-custody.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_discrete_learners.py)" = '098f7d791097d433eb72e0dd0cb801330d5ca3b8'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_predev_custody.py)" = '00a1415ce6f23b0d7fe555def2c7a31fd90510f3'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_predev_custody.py)" = '1fa98aeda76f965fa4e68d352b89671e6922b5e9'
          test -z "$(git status --porcelain)"
          echo F49_COLD_AND_ABLATION_SOURCE_PIN=PASS
      - name: Generate exact derived G29 companion only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F49 preregistered cold-memory atlas'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo F49_PREDEV_ATLAS_DERIVED=PASS
  qualify:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 preregistered retention final regression'
    name: F49 cold and ablation final qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows checkout source bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen research and derived atlas source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F49 preregistered retention final regression'
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): derive F49 preregistered cold-memory atlas'
          test -z "$(git diff --name-only HEAD^ HEAD)"
          git merge-base --is-ancestor 0414b6cfc6a072ef57f8725c26a67ade406dee15 HEAD
          git merge-base --is-ancestor e9714f125e73050cdac3114559f58b4b2f8e738b HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_discrete_learners.py)" = '098f7d791097d433eb72e0dd0cb801330d5ca3b8'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_predev_custody.py)" = '00a1415ce6f23b0d7fe555def2c7a31fd90510f3'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_predev_custody.py)" = '1fa98aeda76f965fa4e68d352b89671e6922b5e9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_source_pretrain.py)" = '8e47908eee50a0631766e637e39149a81a8758fc'
          python scripts/build_code_atlas.py --check
          echo F49_COLD_NO_DEVELOPMENT_DATA_SOURCE_PIN=PASS
      - name: Install frozen existing regression dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: Focused F49 cold, ablations, adversarial controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f49_*.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f49-source-fit-${{ matrix.os }}
          path: ${{ runner.temp }}/f49-source-reused
          run-id: 43743198013
          github-token: ${{ github.token }}
      - name: Reuse six fully trained source models and prove adapted cold state
        shell: bash
        run: |
          set -euo pipefail
          F49_MODELS="$RUNNER_TEMP/f49-source-reused" python - <<'PY'
          import json,os,pathlib,sys
          base=pathlib.Path(os.environ['F49_MODELS'])
          sys.path.insert(0,'research/contrib/chatgpt/QTR-01')
          import f49_source_pretrain as p
          import f49_conventional_controls as c
          import f49_predev_custody as m
          report=json.loads((base/'f49-source-pretrain-receipt.json').read_text())
          assert report['source_commit']=='e9714f125e73050cdac3114559f58b4b2f8e738b'
          assert report['full_source_fits']==6 and report['dev_target_observations']==0
          for z in report['results']:
              pretrained=p.load_checkpoint(base/z['checkpoint'],z['checkpoint_sha256'],report['source_commit'])
              arm=c.ConventionalArm(pretrained,163)
              i,_=arm.select()
              arm.observe(i,(0,1))  # synthetic negative test, NOT evaluator outcome
              saved=m.cold_conventional(arm,pretrained)
              restored=m.restore_conventional(saved,pretrained)
              assert saved==m.cold_conventional(restored,pretrained)
              assert restored.observed_bits==2
          print('F49_SIX_PINNED_TRAINED_MODEL_REUSE_AND_ADAPTED_COLD=PASS')
          print('F49_SYNTHETIC_NEGATIVE_INPUT_ONLY_NO_TARGET_OUTCOMES=PASS')
          PY
      - name: Full original native Yggdrasil regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Verify untouched source and no protected or development first use
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f49_predev_custody.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F49_NO_DEV_FIRST_USE_OR_ACCEPTED_WEIGHT_MUTATION=PASS
