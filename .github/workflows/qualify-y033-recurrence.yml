name: Yggdrasil Y033 frozen recurrence cost science
on:
  push:
    branches: [research/y033-recurrence-break-even-r1]
permissions:
  contents: read
jobs:
  first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact frozen source and prereg identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 128d005f98e99b14ebdc35a5eac6f7cb197cf073 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y032-stationarity/execute.py)" = 7ffd41c75748c6a0796a491635efa31549992da0
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-recurrence/prereg.json)" = 98f3384d32f6a4055e17af3c3aafd48e434de9a8
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-recurrence/execute.py)" = 006a7c06ffd3d8efb95d2ab3f96c8c273ee98a5a
          python3 -m json.tool research/contrib/chatgpt/20261013-y033-recurrence/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y033-recurrence/execute.py
      - name: Run original science once
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y033-recurrence/execute.py > /tmp/Y033-original.json
          python3 -m json.tool /tmp/Y033-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y033-original-frozen
          path: /tmp/Y033-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Complete Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
