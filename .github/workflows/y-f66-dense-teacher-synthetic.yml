name: Yggdrasil F66 dense public-continuation synthetic qualification
on:
  push:
    branches:
      - research/y-f66-dense-teacher-synthetic-20261016-r1
permissions:
  contents: read
jobs:
  synthetic-dense-policy-training:
    if: "${{ github.event.head_commit.message == 'ci(y-f66): qualify dense future-public teacher on unregistered synthetic cases' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify transitive sources and frozen teacher objective
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9cf28f8b576871585dbca1ae19a3f97fcd34399f HEAD
          test "$(git hash-object research/foundational/20261016-y-f66/prereg.json)" = fc3283f28ab307b6834c93d530fffce98ad7c0de
          test "$(git hash-object research/foundational/20261016-y-f66/two_head_continuation.py)" = fa08d72d79380a82814c86482e98b206b69b4d4a
          test "$(git hash-object research/foundational/20261016-y-f66/dense_teacher.py)" = 4924a409a446403c0c2a5d1e146adc8171ae4791
      - name: Run independent synthetic future-public method fit and causal guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f66-dense-teacher/"
          python3 -B research/foundational/20261016-y-f66/dense_teacher.py --synthetic-only > "$RUNNER_TEMP/y-f66-dense-teacher/synthetic_qualification.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f66-dense-teacher/synthetic_qualification.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f66-dense-teacher/synthetic_qualification.json")));print("F66_TEACHER_COUNTS",d["teacher_counts"]);print("F66_LEARNED_MERGES",d["learned_merge_steps"]);print("F66_LEARNED_SYNTHETIC_QUALIFIED",d["model_synthetic_merge_qualified"]);assert not d["actual_FIT_train_executed"] and not d["heldout_executed"]'
          sha256sum "$RUNNER_TEMP/y-f66-dense-teacher/synthetic_qualification.json" > "$RUNNER_TEMP/y-f66-dense-teacher/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f66-dense-teacher/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f66-synthetic-dense-continuation-evidence
          path: ${{ runner.temp }}/y-f66-dense-teacher/
          retention-days: 90
          if-no-files-found: warn
