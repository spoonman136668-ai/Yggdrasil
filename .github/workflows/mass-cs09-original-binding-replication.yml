name: Mass CS09 independently replicated binding K4 evictions
on:
  push:
    branches:
      - research/mass-cs09-independent-k4-replication-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs09-original-replication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact source-FIRST history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Check exact immutable prereg-first ancestor and additive code
        shell: bash
        run: |
          set -euo pipefail
          first=906e71ebbf0f74b890501d31feb941be014a8aed
          parent=c822b8e80757895ab44e64c19111685eb9a68f46
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS09_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS09_PREREG.md","research/native/itd01/mass_r10/run_cs09_binding_priority_replication.py","research/native/itd01/mass_r10/test_cs09_binding_priority_replication.py",".github/workflows/mass-cs09-original-binding-replication.yml"};assert got==want,(got,want)'
      - name: Checkout unchanged real original external POPGym source at pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install untouched original POPGym source dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs09-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/popgym >cs09-evidence/pip-install.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" >cs09-evidence/pip-exit.txt
          test "$code" -eq 0
      - name: Source-free weight-selection, true eviction, and bootstrap guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs09_binding_priority_replication.py 2>&1 | tee cs09-evidence/focused-tests.log
      - name: Execute original prospective FIT VALID DEV and retain every real episode
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs09_binding_priority_replication.py --upstream external/popgym --out cs09-evidence/
      - name: Upload complete positive and negative original per-episode receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs09-original-binding-independent-replication
          path: cs09-evidence/
          retention-days: 30
