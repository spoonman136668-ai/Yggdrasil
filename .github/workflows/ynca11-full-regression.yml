name: YNCA11 exact-final inherited regression
on:
  push:
    branches:
      - research/ynca11-multioperator-interference-20261118
    paths:
      - .ice/code-atlas.ice
permissions:
  contents: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned conventional test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full regression, G29 exact source and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if test -d research/contrib/chatgpt/NKR-05; then
            python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          fi
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-11 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
      - name: Process 1 — save two learned memories after B training blocks
        shell: bash
        env:
          PYTHONPATH: research/contrib/chatgpt/YNCA-11
        run: |
          python -B - "$RUNNER_TEMP/ynca11-cold.json" <<'PY'
          import hashlib,json,pathlib,sys,experiment as e
          memories=e.bank('B')
          a,b=tuple(map(e.compress,memories['separate']))
          observed=memories['history'][0][1][:3]
          outputs={'A':e.prediction(a,b,'A',observed),
                   'C':e.gated_prediction(a,b,'C',((0,0),(7,1)))}
          data={'weights':{'A':{str(t):w for t,w in a.items()},'B':{str(t):w for t,w in b.items()}},
                'observed':observed,'expected':outputs}
          p=pathlib.Path(sys.argv[1]);p.write_text(json.dumps(data,sort_keys=True),encoding='utf-8')
          assert len(a)==len(b)==3
          print('YNCA11_TWO_SLOT_MEMORY_BYTES_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Process 2 — cold memory reload and future composition prediction
        shell: bash
        env:
          PYTHONPATH: research/contrib/chatgpt/YNCA-11
        run: |
          set -euo pipefail
          python -B - "$RUNNER_TEMP/ynca11-cold.json" <<'PY'
          import json,pathlib,sys,experiment as e
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          a,b=[{int(t):v for t,v in d['weights'][k].items()} for k in ('A','B')]
          observed=tuple(tuple(x) for x in d['observed'])
          got={'A':e.prediction(a,b,'A',observed),
               'C':e.gated_prediction(a,b,'C',((0,0),(7,1)))}
          maxima={k:max(abs(v-u) for v,u in zip(got[k],d['expected'][k])) for k in got}
          assert len(a)==len(b)==3
          assert all(x<=1e-12 for x in maxima.values()),maxima
          print('YNCA11_NEW_PROCESS_MEMORY_RECALL_PASS',len(a),len(b),maxima)
          PY
          test -z "$(git status --porcelain)"

