name: MR32 Residual Belief Source-Only Qualification
on:
  push:
    branches:
      - research/mr32-residual-belief-dev-20261031
  pull_request:
    branches:
      - research/mr31-acquisition-contrast-20261021
permissions:
  contents: read
concurrency:
  group: mr32-source-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source syntax and focused tests
        shell: bash
        run: |
          cd research/native/itd02/mr32
          python -B -m py_compile residual_belief.py test_residual_belief.py mr32_controls.py test_mr32_controls.py
          python -B -m unittest -v test_residual_belief test_mr32_controls
      - name: Clean source checkout
        shell: bash
        run: git diff --exit-code
