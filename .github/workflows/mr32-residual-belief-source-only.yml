name: MR32 Residual Belief Source-Only Qualification
on:
  push:
    branches:
      - research/mr32-residual-belief-dev-20261031
  pull_request:
    branches:
      - research/mr31-acquisition-contrast-20261021
permissions:
  contents: read
concurrency:
  group: mr32-source-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned process-resource measurement dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check psutil==6.1.1
      - name: Exact source syntax and focused tests
        shell: bash
        run: |
          cd research/native/itd02/mr32
          python -B -m py_compile residual_belief.py test_residual_belief.py mr32_controls.py test_mr32_controls.py recurrent_control.py test_recurrent_control.py diagonal_bayes_control.py test_diagonal_bayes_control.py interaction_bayes_control.py test_interaction_bayes_control.py learned_memory_allocator.py test_learned_memory_allocator.py content_aware_memory_allocator.py test_content_aware_memory_allocator.py resource_inventory.py test_common_checkpoint.py learned_retention_eval.py learned_retention_cv.py task_utility_trial.py test_task_utility_trial.py
          python -B -m unittest -v test_residual_belief test_mr32_controls test_recurrent_control test_diagonal_bayes_control test_interaction_bayes_control test_learned_memory_allocator test_content_aware_memory_allocator test_common_checkpoint test_task_utility_trial
          python -B resource_inventory.py --steps 256
          python -B learned_retention_eval.py
          python -B learned_retention_cv.py
          python -B task_utility_trial.py | tee ../mr32m-task-utility-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('../mr32m-task-utility-receipt.json').read_text())
          assert result['schema']=='yggdrasil.mr32m.task-derived-utility.v1'
          assert result['fit']['fit_episodes']==48
          assert len(result['fit']['fit_episode_receipts'])==48
          assert len(result['fit']['fit_feedback_receipts'])==(
              result['fit']['fit_feedback_count_h']+
              result['fit']['fit_feedback_count_bayesian'])
          assert len(result['fit']['bayesian_fit_checkpoint_sha256'])==64
          assert result['transfer']['seed_cluster_count']==16
          assert len(result['transfer']['per_episode_receipts'])==64
          assert result['transfer']['feedback_events_h']==0
          assert result['transfer']['feedback_events_bayesian']==0
          assert all(e['transfer_feedback_events']==0
                     for e in result['transfer']['per_episode_receipts'])
          assert result['resource_diagnostics']['process_peak_rss_bytes'] is not None
          assert result['resource_diagnostics']['process_peak_rss_method'] in (
              'windows_peak_working_set','linux_ru_maxrss')
          assert set(result['resource_diagnostics']['selector_state_bytes_mean'])=={
              'random','fixed_recency','evidence_only','mr32_h_learned',
              'interaction_bayesian'}
          assert result['falsifiers']['fit_transfer_seeds_disjoint']
          print('MR32M_TASK_DERIVED_FEEDBACK_SOURCE_ONLY_CONTRACT=PASS')
          PY
      - name: Clean source checkout
        shell: bash
        run: git diff --exit-code
