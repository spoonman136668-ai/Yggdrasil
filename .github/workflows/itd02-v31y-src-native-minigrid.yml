name: ITD-02 V31Y-SRC authentic native MiniGrid feasibility
on:
  push:
    branches: [research/itd02-v31y-src-native-environment-20261028]
permissions:
  contents: read
jobs:
  native-trial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and install independent external environment
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 079deb72df93d15e19091c53a055ca41652e95b3 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
          python -m pip install --disable-pip-version-check 'gymnasium==1.2.1' 'minigrid==3.0.0'
      - name: Run measured public native-vs-controls experiment
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v31y_public_native_trial.py
          test -z "$(git status --porcelain --untracked-files=all)"
