name: CKAD21 two-timescale retained causal planning
on:
  push:
    branches: [research/ckad21-dual-timescale-retention-20261117]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ckad21): run frozen two-timescale development'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve file bytes across OS
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin the preregistered evidence-only experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8736e1358e34eea1c0823de80122ce8da7b5539a HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-21/campaign.py)" = 1fa707ea1585de7d207e8262b31300bf95df12cc
          test "$(git hash-object research/contrib/chatgpt/CKAD-21/test_ckad21.py)" = 96a4a696d2ac88227ac48ef7193f2988d2c438c2
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-21 -p test_ckad21.py -v
          python -B -m unittest discover -s tests -p test_native_cumulative_learner.py -v
          test -z "$(git status --porcelain)"
  primary:
    needs: [development]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stable: ${{ steps.proof.outputs.stable }}
    steps:
      - name: Preserve bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute the frozen dual-timescale experiment on retained real checkpoints
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-21/campaign.py --output-directory "$RUNNER_TEMP/ckad21-linux"
          python -B research/contrib/chatgpt/CKAD-21/independent_audit.py --result "$RUNNER_TEMP/ckad21-linux/result.json"
          python -c "import json,os,pathlib; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ckad21-linux/result.json').read_text()); open(os.environ['GITHUB_OUTPUT'],'a').write('stable='+d['stable_sha256']+'\n')"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CKAD21-linux-executed-source-proof
          path: ${{ runner.temp }}/ckad21-linux/result.json
          if-no-files-found: error
          retention-days: 30
  replication:
    needs: [primary]
    if: github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Preserve bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent Windows source and policy-value reproduction
        env:
          EXPECTED_STABLE: ${{ needs.primary.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-21/campaign.py --output-directory "$RUNNER_TEMP/ckad21-windows"
          python -B research/contrib/chatgpt/CKAD-21/independent_audit.py --result "$RUNNER_TEMP/ckad21-windows/result.json"
          python -c "import json,os,pathlib; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ckad21-windows/result.json').read_text()); assert d['stable_sha256']==os.environ['EXPECTED_STABLE']"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CKAD21-windows-executed-source-proof
          path: ${{ runner.temp }}/ckad21-windows/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [primary, replication]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CKAD21-linux-executed-source-proof
          path: ${{ runner.temp }}/ckad21-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CKAD21-windows-executed-source-proof
          path: ${{ runner.temp }}/ckad21-windows
      - name: Seal both executed result receipts and build the exact-source atlas
        id: seal
        env:
          CKAD21_LINUX_DIRECTORY: ${{ runner.temp }}/ckad21-linux
          CKAD21_WINDOWS_DIRECTORY: ${{ runner.temp }}/ckad21-windows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-21/seal.py
          git add -- research/contrib/chatgpt/CKAD-21
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ckad21): seal dual-timescale retention and shift outcomes'
          RESULT_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git commit -m "docs(ckad21): qualify dual-timescale source atlas at $RESULT_SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad21-dual-timescale-retention-20261117
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact conventional solver and full-regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory full regression and exact-candidate policy evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-21 -p test_ckad21.py -v
          python -B research/contrib/chatgpt/CKAD-21/campaign.py --output-directory "$RUNNER_TEMP/ckad21-final"
          python -B research/contrib/chatgpt/CKAD-21/independent_audit.py --result "$RUNNER_TEMP/ckad21-final/result.json"
          python -c "import json,os,pathlib; r=pathlib.Path(os.environ['RUNNER_TEMP']); actual=json.loads((r/'ckad21-final/result.json').read_text()); frozen=json.loads(pathlib.Path('research/contrib/chatgpt/CKAD-21/result.json').read_text()); assert actual['stable_sha256']==frozen['stable_sha256']; assert actual['classification']==frozen['classification']"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-g29:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent source atlas and retained historical receipts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CKAD-13/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-14/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-15/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-16/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-17/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-18/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-19/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-20/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-21/independent_audit.py
          test -z "$(git status --porcelain)"
