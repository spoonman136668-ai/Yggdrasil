name: Mass MR34I11 original source initial preactivation numerical custody
on:
  pull_request:
    branches: [research/mass-mr34i10-fixed160-portable-fast-20261023]
    paths:
      - 'research/mr34i11/**'
      - '.github/workflows/mass-mr34i11-initial-u.yml'
permissions:
  contents: read
concurrency:
  group: mass-mr34i11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
jobs:
  source-native-first-logit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Prevent original source Git file changes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: original_s4c1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact pinned original public-source numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Original Pycolab Windows curses
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify frozen FIRST-only provenance and exactly additive source scope
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          parent=1ab12be5dce0502c32c532ac32d095b2378dc82c
          first=a12f477b12d74e7c383cb944318ea371fbef292f
          test "$(git rev-parse "${first}^")" = "$parent"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git show --format= --name-only "$first")" = "research/mr34i11/FROZEN_PROTOCOL.md"
          for p in research/mr34i10/fixed160_train.py research/mr34i9/optin_train.py research/mr34i7/portable_kernel.py; do
            test "$(git hash-object "$p")" = "$(git rev-parse "$parent:$p")"
          done
          actual="$(git diff --name-only "$parent" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mass-mr34i11-initial-u.yml' \
            'research/mr34i11/FROZEN_PROTOCOL.md' \
            'research/mr34i11/initial_u.py' \
            'research/mr34i11/test_initial_u.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo MR34I11_FROZEN_FIRST_ONLY_SCOPE_PASS
      - name: Validate source-free native initial projection and read-only fsum
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m unittest -v research.mr34i11.test_initial_u 2>&1 | tee ../mr34i11-focused.log
      - name: Acquire only previously consumed genuine original TRAIN observations
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m research.mr34i11.initial_u ../original_s4c1 ../external/minigrid ../external/pycolab ../mr34i11-source.json 2>&1 | tee ../mr34i11-original.log
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("../mr34i11-source.json").read_text())
          assert d["original_protected_first_use"] is False
          assert d["native_learning_advanced_or_modified"] is False
          assert d["genuine_original_TRAIN_only"] is True
          assert len(d["source_reports"])==2
          for n,x in d["source_reports"].items():
              assert x["candidate_first_logit_count"]==160
              assert len(x["original_source_first_only_reset_traces"])==20
              assert x["protected_or_original_heldout_source_actions_generated"]==0
              assert x["native_source_and_trainer_unchanged"] is True
          print("MR34I11_ORIGINAL_TRAIN_SOURCE_CUSTODY_COMPLETE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-mr34i11-${{ matrix.os }}-${{ matrix.repeat }}
          path: |
            mr34i11-focused.log
            mr34i11-original.log
            mr34i11-source.json
          if-no-files-found: warn
          retention-days: 30
      - name: Original native/independent original public source worktrees unchanged
        shell: bash
        run: |
          set -euo pipefail
          for p in audit original_s4c1 external/minigrid external/pycolab; do
            git -C "$p" diff --exit-code
            test -z "$(git -C "$p" status --porcelain)"
          done
          echo MR34I11_SOURCE_AND_NATIVE_ORIGINAL_READONLY_PASS

  independent-initial-input-reconciliation:
    needs: source-native-first-logit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mass-mr34i11-*
          path: evidence
      - name: Strict original public events and 4-way native/candidate stage classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          data={}
          for os in ("ubuntu-24.04","windows-2025"):
              for repetition in (1,2):
                  p=pathlib.Path("evidence")/f"mass-mr34i11-{os}-{repetition}"/"mr34i11-source.json"
                  d=json.loads(p.read_text())
                  assert d["original_protected_first_use"] is False
                  assert d["scientific_admission"]=="NO_GO"
                  data[os,repetition]=d
          names=("FaramaMiniGridDoorKey8","DeepMindPycolabApprehend")
          originals=[data[k] for k in (("ubuntu-24.04",1),("ubuntu-24.04",2),
                                       ("windows-2025",1),("windows-2025",2))]
          stages=("original_first_public23","native_source_cell_features_8x7",
                  "public_action_angle_cos_sin","native_original_g0_dot",
                  "native_original_g1_dot","native_original_local_role0",
                  "native_original_local_role1","native_original_read",
                  "native_original_u","source_neutral_fsum_candidate_u",
                  "source_neutral_fixed160_projection_only")
          result={}
          admission=True
          for name in names:
              r=[a["source_reports"][name] for a in originals]
              for z in r[1:]:
                  for fld in ("original_authored_source_git_sha",
                              "original_source_events_sha256",
                              "original_training_only_public_input_target_tensors",
                              "original_native_initial_45_checkpoint_SHA256"):
                      assert r[0][fld]==z[fld],("ORIGINAL_SOURCE_OR_NATIVE_MODEL_DRIFT",name,fld)
              observations=[z["original_source_first_only_reset_traces"] for z in r]
              assert all(len(x)==20 for x in observations)
              first=None
              for k,seed in enumerate(observations[0]):
                  for stage in stages:
                      a=[o[k][stage] for o in observations]
                      if len({x["sha256"] for x in a})!=1:
                          baseline=a[0]["hex"]
                          first_idx=next((i for i in range(len(baseline))
                             if any(z["hex"][i]!=baseline[i] for z in a[1:])),None)
                          first={"original_reset_seed":seed["original_source_train_seed"],
                                 "stage":stage,"float_coordinate":first_idx,
                                 "four_original_values":[z["hex"][first_idx] if first_idx is not None else None for z in a]}
                          break
                  if first:break
              f_equal=len({z["candidate_source_neutral_first_logits_sha256"] for z in r})==1
              feat_equal=all(
                  observations[0][i]["native_source_cell_features_8x7"]["sha256"]==
                  observations[j][i]["native_source_cell_features_8x7"]["sha256"]
                  for i in range(20) for j in range(1,4))
              old_match=[z["original_first_logits_match_previous_consumed_identity"] for z in r]
              qualified=f_equal and feat_equal
              admission=admission and qualified
              result[name]={
                  "source_original_event_digest":r[0]["original_source_events_sha256"],
                  "four_original_initial_u_SHA256":[z["original_first_logits_sha256"] for z in r],
                  "matches_historically_frozen_original_u_SHA":[bool(x) for x in old_match],
                  "four_readonly_fsum_u_SHA256":[z["candidate_source_neutral_first_logits_sha256"] for z in r],
                  "4_of_4_native_public_features_exact":feat_equal,
                  "4_of_4_readonly_fsum_u_exact":f_equal,
                  "first_identified_cross_worker_arithmetic_difference":first,
                  "source_only_engineering_diagnostic_positive":qualified,
                  "original_s4c1_checkpoint_qualified":False,
                  "scientific_admission":"NO_GO"}
          verdict=("MR34I11_INITIAL_PREACTIVATION_PORTABILITY_SIGNAL_NOT_SCIENCE"
                   if admission else "MR34I11_INITIAL_PREACTIVATION_NOT_QUALIFIED")
          print("MR34I11_INDEPENDENT_ORIGINAL_SOURCE_PREACTIVATION="+json.dumps(result,sort_keys=True))
          print("MR34I11_FROZEN_TERMINAL_DISPOSITION="+verdict)
          print("MR34I11_PROTECTED_FIRST_USE_ZERO")
          PY
