name: QTR-01 F39 source-only preflight and full regression

on:
  pull_request:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-f39-source-preflight.yml
      - research/contrib/chatgpt/QTR-01/f39_*.py
      - research/contrib/chatgpt/QTR-01/test_f39_*.py
      - research/contrib/chatgpt/QTR-01/f39_source_disjoint_protocol_candidate.json
  push:
    branches:
      - research/qtr01-f39-source-disjoint-preflight-20261115
    paths:
      - .github/workflows/qtr01-f39-source-preflight.yml
      - research/contrib/chatgpt/QTR-01/f39_*.py
      - research/contrib/chatgpt/QTR-01/test_f39_*.py
      - research/contrib/chatgpt/QTR-01/f39_source_disjoint_protocol_candidate.json
permissions:
  contents: read
jobs:
  exact-source-full-regression:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    name: F39 full-source regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows source checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact F38 baseline not modified
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8849236b7f682c8e1eea9808b308b3cab264425f HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f38_prereg.json)" = bb86d3d7f8b8d9052eb7522f7ed7b616c3b0d66c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f38_composition_dev.py)" = 988ed16297dd70d4a6557d9f3410d22743fe2da5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f32_source_snapshot.json)" = 453dad0363689cff785c26db5441555c6841f95d
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f35_source_depth2_snapshot.json)" = 3fc50ddf7453958c458db697eacf2e27d3d52f57
          test -z "$(git status --porcelain)"
          echo F39_BASELINE_SOURCE_UNCHANGED=PASS
      - name: F39 source-free negative controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p "test_f39_*.py" -v
      - name: Install inherited regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: Full original regression
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p "test_*.py" -v
      - name: Verify final source checkout clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F39_SOURCE_ONLY_FULL_REGRESSION_PASS
