name: ITD-02 V31D distinct-context development source
on:
  push:
    branches: [research/itd02-v31d-independent-return-control-20261028]
permissions:
  contents: read
jobs:
  dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original source and frozen rules
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 31a60b7bfeb68e5714b5a485c5109a61816dc1e8 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Development seven-stream witness and original native safety
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v31d_distinct_return_dev_audit.py
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_public_history_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
