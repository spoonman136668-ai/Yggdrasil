name: Yggdrasil F69 learned endpoint-survival synthetic qualification
on:
  push:
    branches: [research/y-f69-learned-endpoint-survival-precode-20261016-r1]
permissions:
  contents: read
jobs:
  independent-synthetic-learner:
    if: "${{ github.event.head_commit.message == 'ci(y-f69): qualify causal endpoint-survival learning and one full regression' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen prereg and learned source identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 942056062642ead1d6bbd1cc057857748c6a9ac8 HEAD
          test "$(git hash-object research/foundational/20261016-y-f69/prereg.json)" = 08a5afaa34df9d151c6103abc8cdd5f2ba4116b5
          test "$(git hash-object research/foundational/20261016-y-f69/endpoint_survival.py)" = 8e6f669534139967e3f356d2008a424896702f28
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
      - name: Train only unregistered synthetic endpoints and replay separate guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f69-synthetic"
          python3 -B research/foundational/20261016-y-f69/endpoint_survival.py --synthetic-only > "$RUNNER_TEMP/f69-synthetic/qualification.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f69-synthetic/qualification.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f69-synthetic/qualification.json")));print("F69_ENDPOINT_LABELS",d["fit_info"]);print("F69_GUARD_SCORES",d["trained_synthetic_guard_correct"],d["frozen_F60_guard_correct"]);print("F69_EARLY_DEVIATIONS",d["early_prelink_deviations"]);assert d["source_prequalification_pass"] and not d["FIT_train_used"] and not d["FIT_validation_used"]'
          sha256sum "$RUNNER_TEMP/f69-synthetic/qualification.json" > "$RUNNER_TEMP/f69-synthetic/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f69-synthetic/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f69-unregistered-endpoint-prediction
          path: ${{ runner.temp }}/f69-synthetic/
          retention-days: 90
          if-no-files-found: warn
  one-full-regression:
    needs: independent-synthetic-learner
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free hosted dependencies
        run: |
          python -m pip install pytest pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run one full regression on exact scientific source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f69-regression"
          test "$(git hash-object research/foundational/20261016-y-f69/endpoint_survival.py)" = 8e6f669534139967e3f356d2008a424896702f28
          python -B -m pytest -q > "$RUNNER_TEMP/f69-regression/result.txt" 2>&1
          cat "$RUNNER_TEMP/f69-regression/result.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f69-regression/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f69-one-full-regression
          path: ${{ runner.temp }}/f69-regression/
          retention-days: 90
