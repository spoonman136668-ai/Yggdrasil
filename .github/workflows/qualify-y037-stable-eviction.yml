name: Yggdrasil Y037 stable home frequency memory
on:
  push:
    branches: [research/y037-stable-geometry-eviction-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen predecessor and exact experiment identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 30c3385ac5761ab02d38012c0d1b62ce3e2842bc HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-real-eviction/execute.py)" = d583f168de51910712ebce91633db274fef0a849
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-stable-eviction/prereg.json)" = e8f4dcc8dd880ea300157fef65ff5e17d1933329
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-stable-eviction/execute.py)" = 0ee069c039f7628c43ad57e15b911d3326de9d83
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-stable-eviction/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-stable-eviction/execute.py
      - name: Frozen first-use original scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-stable-eviction/execute.py > /tmp/y037-original.json
          python3 -m json.tool /tmp/y037-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original
          path: /tmp/y037-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One complete project regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
