name: YGG-JEPA2-02 exact original evidence seal and final qualification
'on':
  push:
    branches:
      - research/ygg-jepa2-02-native-shift-specialists-20261118
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  seal:
    if: "github.event.head_commit.message == 'ci(jepa2-02): seal original trained evidence without retraining'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-JEPA2-02-ubuntu-latest
          run-id: 44415015937
          repository: spoonman136668-ai/Yggdrasil
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/YGG-JEPA2-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-JEPA2-02-windows-2022
          run-id: 44415015937
          repository: spoonman136668-ai/Yggdrasil
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/YGG-JEPA2-windows
      - name: Seal previously qualified original bytes and reanchor G29
        id: seal
        shell: bash
        env:
          YGG_JEPA2_LINUX: ${{ runner.temp }}/YGG-JEPA2-linux
          YGG_JEPA2_WINDOWS: ${{ runner.temp }}/YGG-JEPA2-windows
          YGG_JEPA2_RUN_ID: '44415015937'
          YGG_JEPA2_SOURCE_SHA: '20b5a1fd7d31346c0954470589b52024f91ae5f5'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 20b5a1fd7d31346c0954470589b52024f91ae5f5 HEAD -- \
            yggdrasil/native_jepa2_multilearner.py \
            tests/test_native_jepa2_multilearner.py \
            research/contrib/chatgpt/YGG-JEPA2-02/prereg.json \
            research/contrib/chatgpt/YGG-JEPA2-02/campaign.py \
            research/contrib/chatgpt/YGG-JEPA2-02/audit.py
          python -B research/contrib/chatgpt/YGG-JEPA2-02/seal.py
          python -B research/contrib/chatgpt/YGG-JEPA2-02/audit.py research/contrib/chatgpt/YGG-JEPA2-02
          git add -- research/contrib/chatgpt/YGG-JEPA2-02/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(jepa2-02): seal original unchanged Linux/Windows trained state and scores'
          RESULT_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git commit -m "docs(jepa2-02): exact final native training atlas at $RESULT_SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ygg-jepa2-02-native-shift-specialists-20261118
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original native pinned solver and test deps
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Mandatory full exact SHA native regression, negative controls and G29
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.seal.outputs.final_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
