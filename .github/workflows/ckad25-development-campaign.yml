name: CKAD25 source-owned bounded development training proof
on:
  push:
    branches: [research/ckad-native-stage-dev-20261118]
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  training-and-cold-restore:
    if: "github.event.head_commit.message == 'ci(ckad24): seal source atlas'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned native comparator dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Execute and independently replay two source-owned development learning stages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          OUT="$RUNNER_TEMP/ckad25-dev-$GITHUB_RUN_ID"
          python -B -m yggdrasil.native_ckad_dev_campaign --output-directory "$OUT"
          python -B -m yggdrasil.native_ckad_dev_campaign --output-directory "$OUT" --verify-existing
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25-development-training-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25-dev-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: error

  seal-cumulative-development:
    needs: [training-and-cold-restore]
    if: "github.event.head_commit.message == 'ci(ckad24): seal source atlas'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Preserve exact checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore source-owned Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad25-development-training-ubuntu-latest
          path: ${{ runner.temp }}/ckad25-seal/linux
      - name: Restore source-owned Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad25-development-training-windows-2022
          path: ${{ runner.temp }}/ckad25-seal/windows
      - name: Install already qualified native dependencies for independent replay
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Seal persistent development-only checkpoints and reanchor G29 source atlas
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/ckad-native-stage-dev-20261118
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          from yggdrasil.native_context_basis import canonical
          from yggdrasil.native_ckad_dev_campaign import verify, FILES
          root=Path(os.environ['RUNNER_TEMP'])/'ckad25-seal'
          left,right=root/'linux',root/'windows'
          l,r=verify(left),verify(right)
          assert l==r and l['source_sha']==os.environ['GITHUB_SHA']
          assert l['scientific_pass'] is False and l['forge_dispatch_authorized'] is False
          assert l['stages_completed']==2 and l['evaluations_completed']==1
          for name in ('initial.native.json','stage-01.native.json',
                       'stage-02.native.json','evaluation.json',
                       'stage-01.packet.json','stage-02.packet.json',
                       'campaign-result.json'):
              assert (left/name).read_bytes()==(right/name).read_bytes(),name
          run_id=os.environ['GITHUB_RUN_ID']
          assert run_id.isdecimal() and int(run_id)>0
          target=Path('research/contrib/chatgpt/CKAD-25/qualified-development-runs')/run_id
          assert not target.exists()
          target.mkdir(parents=True,exist_ok=False)
          for key,origin in [('linux',left),('windows',right)]:
              shutil.copytree(origin,target/key)
          files={}
          for path in sorted(target.rglob('*')):
              if path.is_file():
                  files[str(path.relative_to(target))]=hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(files)==2*len(FILES)
          manifest={
              'schema':'yggdrasil.ckad.persistent-development-evidence.v1',
              'original_source_sha':os.environ['GITHUB_SHA'],
              'original_source_tree':subprocess.check_output(
                  ['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'github_run_id':int(run_id),
              'campaign_result_sha256':hashlib.sha256(canonical(l)).hexdigest(),
              'final_checkpoint_sha256':l['final_checkpoint_sha256'],
              'all_platform_files_sha256':files,
              'scientific_first_use':False,
              'scientific_pass':False,
              'accepted_native':False,
              'forge_dispatch_authorized':False,
          }
          (target/'manifest.json').write_bytes(canonical(manifest))
          print('CKAD25_DEV_CUMULATIVE_PERSISTED_CHECKPOINT=PASS')
          PY
          git add -- research/contrib/chatgpt/CKAD-25/qualified-development-runs
          test -n "$(git diff --cached --name-only)"
          git diff --cached --name-only | while IFS= read -r name; do
              case "$name" in
                research/contrib/chatgpt/CKAD-25/qualified-development-runs/*) ;;
                *) echo "CKAD25_UNAUTHORIZED_EVIDENCE_PATH=$name" >&2; exit 1 ;;
              esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ckad25): preserve development native checkpoints from run $GITHUB_RUN_ID"
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          python -B - <<'PY'
          import subprocess
          files=set(subprocess.check_output(
              ['git','diff','--cached','--name-only'],text=True).splitlines())
          assert files=={'.ice/code-atlas.json','.ice/code-atlas.html',
                         '.ice/code-atlas.ice'},files
          PY
          git commit -m "ci(ckad25): reanchor persisted development evidence atlas"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "CKAD25_DEV_EVIDENCE_COMMIT=$SOURCE"
          echo "CKAD25_DEV_FINAL_SOURCE=$(git rev-parse HEAD)"
