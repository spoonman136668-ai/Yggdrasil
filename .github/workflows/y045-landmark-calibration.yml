name: Yggdrasil Y045 frozen observable landmark frame calibration
on:
  push:
    branches: [research/y045-landmark-calibrated-cell-frame-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen source identity and first-use gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2db6dfe3e464531f60531dc1c75416ea3d276e75 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-affine-family/execute.py)" = 18664bdc0ddfc873e221a9761d2dbe0b5c315d55
          test "$(git hash-object research/contrib/chatgpt/20261013-y045-landmark-calibration/prereg.json)" = 88de874d118455be259ca5995c4111dc5b75f30f
          test "$(git hash-object research/contrib/chatgpt/20261013-y045-landmark-calibration/execute.py)" = aaa3d50d564c56a0ebcf9ea16f53a79b4c7a9690
          python3 -m json.tool research/contrib/chatgpt/20261013-y045-landmark-calibration/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y045-landmark-calibration/execute.py
      - name: First original heldout experiment - no replay
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y045-landmark-calibration/execute.py > /tmp/Y045-original.json
          python3 -m json.tool /tmp/Y045-original.json > /dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y045-original.json'))
          assert x['sealed_heldout_seeds']==list(range(1168,1184))
          assert len(x['by_family'])==4
          print('CLASSIFICATION',x['classification'])
          print('ASSIGNMENT_MISMATCHES',x['heldout_assignment_mismatches'])
          print('OBSERVATION_COST',x['anchor_observations_per_episode'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y045-original-landmark-calibration
          path: /tmp/Y045-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
