name: MR31 Native Equal-Budget Causal Experience Acquisition
on:
  push:
    branches:
      - research/mr31-acquisition-contrast-20261021
  pull_request:
    branches:
      - research/mr30-independent-causal-replication-20261021
permissions:
  contents: read
concurrency:
  group: mr31-source-original-public-exploration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-native-paired-acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve exact original source bytes before Windows checkouts
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact MR31 scientific development source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original independently authored Farama MiniGrid source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python original native environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact original native source blobs and license evidence
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install exact pinned original environment and process measurement dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Run actual original MiniGrid matched-resource public-only causal acquisition
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr31.original_acquisition ../external/minigrid | tee ../mr31-authentic-source-receipt.log
          grep -q '^MR31_ORIGINAL_NATIVE_EQUAL_BUDGET_ACQUISITION=' ../mr31-authentic-source-receipt.log
      - name: Exact source Git trees clean, with no untracked generated files
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
