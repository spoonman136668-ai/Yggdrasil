name: EXT-MHE01 exact-SHA static source fence full regression (one-shot)
'on':
  push:
    branches: [research/mhe01-exact-qualification-20261119]
    paths: ['.github/workflows/mhe01-sourcefree-once.yml']
permissions:
  contents: read
jobs:
  source_free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable Git line-ending transformations
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4fe5aad62d6af0268dffd86284fb13655ae35296
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen chronological source and candidate custody
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/mhe01-public-packet-fence'
          test "$(git rev-parse HEAD)" = "4fe5aad62d6af0268dffd86284fb13655ae35296"
          test "$(git hash-object "$root/prereg.json.txt")" = 12b941082da273555d1718296107e1be0857e74e
          test "$(git rev-parse '5123c0a36db5fda8c4763cba69abaff0352abf1c':"$root/prereg.json.txt")" = 12b941082da273555d1718296107e1be0857e74e
          test "$(git hash-object "$root/packet_fence.py.txt")" = 54591ea714522f50ddb8377c007087df791007ca
          test "$(git hash-object "$root/test_packet_fence.py.txt")" = 2e6b30703fc538af06a8acec6bf823361c278273
          test "$(git hash-object "$root/README.md.txt")" = e600007941a5bce63ba19137aa10552cebace815
          echo EXT_MHE01_SOURCE_FIRST_EXACT_SHA_PASS
      - name: Mandatory full original native regression on exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo EXT_MHE01_FULL_NATIVE_REGRESSION_PASS
      - name: Source-free public packet leakage and intervention negative tests
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/mhe01-public-packet-fence'
          d="$RUNNER_TEMP/mhe01"
          mkdir -p "$d"
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          for n in packet_fence test_packet_fence; do
            cp "$root/$n.py.txt" "$d/$n.py"
            test "$(git hash-object "$d/$n.py")" = "$(git hash-object "$root/$n.py.txt")"
          done
          (cd "$d" && python -B -m unittest -v test_packet_fence)
          echo EXT_MHE01_SOURCEFREE_21_NEGATIVE_TESTS_PASS
      - name: Verify source working tree clean and no model/external source run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4fe5aad62d6af0268dffd86284fb13655ae35296"
          test -z "$(git status --porcelain)"
          echo EXT_MHE01_CLEAN_CHECKOUT_NO_OWNER_FIRST_USE_PASS
