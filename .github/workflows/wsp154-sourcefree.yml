name: WSP154 source-free OOD structural shield and inherited regression
on:
  push:
    branches: [research/wsp154-ood-structural-shield-20261117]
permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify prereg frozen before first implementation, source owner absent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse deba7852e1e0197aeab79799ea5072a0f5a420b0^)" = "6f130c72f645da324611bd66d347e43d0c87c150"
          test "$(git diff-tree --no-commit-id --name-only -r deba7852e1e0197aeab79799ea5072a0f5a420b0)" = "research/contrib/chatgpt/WSP-154/prereg.json"
          git merge-base --is-ancestor deba7852e1e0197aeab79799ea5072a0f5a420b0 HEAD
          git diff --exit-code deba7852e1e0197aeab79799ea5072a0f5a420b0 HEAD -- research/contrib/chatgpt/WSP-154/prereg.json
          git diff --exit-code 6f130c72f645da324611bd66d347e43d0c87c150 HEAD -- research/contrib/chatgpt/WSP-153 research/contrib/chatgpt/WSP-151 research/contrib/chatgpt/WSP-149
          for name in source.py experiment.py result.json SCIENTIFIC_PASS.json first_use_authorization.json; do
            test ! -e "research/contrib/chatgpt/WSP-154/$name"
          done
          test -z "$(git status --porcelain)"
      - name: Exact algebra, source-free off-class alias and independent symbolic controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-154 -p 'test_*.py' -v
      - name: Checkout unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(wsp154): source-pin G29 atlas' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: wsp154-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Write exact three G29 derived files once
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code deba7852e1e0197aeab79799ea5072a0f5a420b0 HEAD -- research/contrib/chatgpt/WSP-154/prereg.json
          git diff --exit-code 6f130c72f645da324611bd66d347e43d0c87c150 HEAD -- research/contrib/chatgpt/WSP-153 research/contrib/chatgpt/WSP-151 research/contrib/chatgpt/WSP-149
          for name in source.py experiment.py result.json SCIENTIFIC_PASS.json first_use_authorization.json; do
            test ! -e "research/contrib/chatgpt/WSP-154/$name"
          done
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp154): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp154-ood-structural-shield-20261117

  final-regression:
    needs: [preflight]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp154): pin G29 source atlas at ') && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable science and pinned source index
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code deba7852e1e0197aeab79799ea5072a0f5a420b0 HEAD -- research/contrib/chatgpt/WSP-154/prereg.json
          git diff --exit-code 6f130c72f645da324611bd66d347e43d0c87c150 HEAD -- research/contrib/chatgpt/WSP-153 research/contrib/chatgpt/WSP-151 research/contrib/chatgpt/WSP-149
          for name in source.py experiment.py result.json SCIENTIFIC_PASS.json first_use_authorization.json; do
            test ! -e "research/contrib/chatgpt/WSP-154/$name"
          done
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Keep frozen WSP149 original science negative without calling source
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/contrib/chatgpt/WSP-149/result.json').read_text(encoding='utf8'))
          assert a['frozen_outcome']=='DEVELOPMENT_EXACT_WEIGHT_MEMORY_TRANSFER_NO_GO'
          assert a['cross_platform_all_nonresource_science_and_per_world_exact'] is True
          assert a['original_first_positive_study_sha']=='f0f3069dd36c10127214b677f02d66b7a22f7661'
          assert a['original_run']==44137575798
          print('WSP149_FROZEN_NEGATIVE_NO_REPLAY_PASS')
          PY
      - name: Mandatory inherited WSP135-153 source-free plus complete root regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 138 139 140 141 142 143 144 145 146 147 148; do
            if [ -d "research/contrib/chatgpt/WSP-$n" ]; then
              python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
            fi
          done
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_exact_weights.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_source_custody.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-151 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-153 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-154 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
