name: Optimizer O22-V authentic FIT multi-step learned action value
on:
  push:
    branches:
      - research/optimizer-o22v-delayed-action-value-20261025
  pull_request:
    paths:
      - research/optimizer_o22v/**
      - .github/workflows/optimizer-o22v-delayed-value.yml
permissions:
  contents: read
  actions: read
jobs:
  local-selected-effect-units:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confirm R1 original and source-first qualification
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f1e2b28dcb4eb5fe900c6a798cb6ba53cf018867 HEAD
          git merge-base --is-ancestor d96ed6a0a62f1ac50a33c3d454f122c83b884daf HEAD
          git merge-base --is-ancestor 45fe7cb7893ca9918bcf3ecf6e9c4c44326a1add HEAD
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = '3aa22b1e418a7f8cd9619c476f02b8c614917b16'
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = '5348238f4ec2183bea29262659883391b5f429fd'
          python -B -c "import json;d=json.load(open('research/optimizer_o22v/PREREG.json')); assert d['governance']['source_original_new_actions_allowed']==0 and d['governance']['protected_first_use_allowed'] is False"
          echo O22V_ORIGINAL_NATIVE_R1_R3_AND_SOURCE_FIRST=PASS
      - name: Seven selected 3-step public learning and cold tests
        run: python -B -m unittest -v research.optimizer_o22v.test_delayed_cells

  authentic-already-consumed-FIT-only:
    needs: local-selected-effect-units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Read-only exact C28 source FIT archive; never invoke MiniGrid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o22v-original" "$RUNNER_TEMP/o22v-report"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12596362847/zip" \
            --output "$RUNNER_TEMP/o22v-original/source-c28.zip"
          python -B -c "import os,hashlib,pathlib,json;p=json.load(open('research/optimizer_o22v/PREREG.json'));f=pathlib.Path(os.environ['RUNNER_TEMP'])/'o22v-original/source-c28.zip';assert hashlib.sha256(f.read_bytes()).hexdigest()==p['immutable_source_fit']['zip_sha256']"
          echo O22V_PINNED_AUTHENTIC_SOURCE_ZIP=PASS
      - name: Truly selected action multi-step native cells versus fitted conventional
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.optimizer_o22v.evaluate \
            --source-zip "$RUNNER_TEMP/o22v-original/source-c28.zip" \
            --out "$RUNNER_TEMP/o22v-report/comparison.json"
          python -B -m json.tool "$RUNNER_TEMP/o22v-report/comparison.json"
      - name: Archive full independent native/conventional FIT-only receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22v-selected-action-three-step-FIT-learning
          path: ${{ runner.temp }}/o22v-report/comparison.json
          if-no-files-found: warn
          retention-days: 80
