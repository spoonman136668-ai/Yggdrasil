name: Y-F22 train-only sensor reliability composition original
on:
  push:
    branches: [research/y-f22-learned-context-reliability-transfer-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install scientific test dependencies
        run: python3 -m pip install -e '.[test]'
      - name: Freeze Y21 source and prereg before new cohort
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 31d1f2afa4bc073464fa1d02208d57cc7362c596 HEAD
          test "$(git hash-object research/foundational/20261015-y-f21/execute.py)" = "$(git rev-parse 31d1f2afa4bc073464fa1d02208d57cc7362c596:research/foundational/20261015-y-f21/execute.py)"
          python3 -m py_compile research/foundational/20261015-y-f22/execute.py
          python3 -m json.tool research/foundational/20261015-y-f22/prereg.json >/dev/null
      - name: One NEW Y-F22 original mixed-reliability primitive transfer
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -B research/foundational/20261015-y-f22/execute.py > /tmp/y-f22-original.json
          python3 -m json.tool /tmp/y-f22-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F22-original-unseen-sensor-compositions
          path: /tmp/y-f22-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Independent row scores and train-test identity audit
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/y-f22-original.json'))
          assert d["stage"]=="DEVELOPMENT_ONLY" and d["questions"]==1440
          assert d["new_graph_count"]==96 and d["regime_graph_groups"]==480
          assert d["trained_context_params"]==15 and d["native_resident_bytes"]==576
          assert not d["known_F19_descriptor_metric_retrained"] and not d["known_task_core_retrained"]
          assert not d["candidate_regime_label_given"] and not d["true_descriptor_given_to_candidate"]
          assert d["source_context_generator_programmed"]
          assert not d["source_born_independently"] and not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert collections.Counter(r["regime"] for r in d["rows"])==dict.fromkeys(d["heldout_new_combinations"],96)
          assert d["scores"]["descriptor_oracle"]["correct"]==1440
          for name in ("robust","prior_frozen","first_sensor","two_sensor","untrained","descriptor_oracle"):
            score=d["scores"][name]
            assert score["correct"]==sum(sum(a==b for a,b in zip(r["predictions"][name],r["truth"])) for r in d["rows"])
            assert score["false_positives"]==sum(r["predictions"][name][i] for r in d["rows"] for i in (1,2))
            assert score["false_negatives"]==sum(not r["predictions"][name][0] for r in d["rows"])
          assert d["registered_verdict"] in ("INVALID_YF22_TYPED_REFERENCE",
           "DEVELOPMENT_LEARNED_SENSOR_RELIABILITY_COMPOSITION_TRANSFER",
           "DEVELOPMENT_NO_LEARNED_SENSOR_RELIABILITY_COMPOSITION_TRANSFER")
          print("Y_F22_VERDICT",d["registered_verdict"],d["scores"])
          print("Y_F22_BY_REGIME",d["by_regime"])
          PY
      - name: One complete pytest repository regression
        run: python3 -m pytest -q tests
