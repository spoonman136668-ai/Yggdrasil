name: ITD-02 V26 exact preregistered return-selectivity behavioral witness
on:
  push:
    branches:
      - research/itd02-v26-return-selectivity-20261028
permissions:
  contents: read
jobs:
  v26-behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Deterministic git checkout behavior
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact V26 Git SHA without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen chronology and immutable original-source pins
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f3d16b542e83c87abdacdf8e8988ca20c1e215e "$GITHUB_SHA"
          git merge-base --is-ancestor 9eb4e7305cbd55e146ff64c8f82f06edb87a5350 "$GITHUB_SHA"
          git merge-base --is-ancestor 28075b87f76a6a03d525fcacc0eabac940915736 "$GITHUB_SHA"
          git merge-base --is-ancestor 19ec2bcd6c3529fbc5c17d8c47afdf9490402bbe "$GITHUB_SHA"
          git merge-base --is-ancestor 66023a984ff6bbaf93344cc45fd295faf1823dc6 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object research/itd02_v25_return_sequence_audit.py)" = 6bd7b9ffc92b8b4739f7d2c7f73d4e7cdbd2b0a5
          test "$(git hash-object research/itd02_v26_return_selectivity_preregistration.md)" = 6e672b6a2d20b372e8ff0d1bb2f05c15697c84b4
          test "$(git hash-object research/itd02_v26_frozen_source_only_schedule.md)" = 052e3cba3f059c3430df461299c81155a0eb85ce
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Execute eight immutable source-only streams and strong controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v26_behavior"
          if ! PYTHONPATH=. python -B research/itd02_v26_return_selectivity_audit.py > "$RUNNER_TEMP/v26_behavior/audit.json" 2> "$RUNNER_TEMP/v26_behavior/audit.err"; then
            cat "$RUNNER_TEMP/v26_behavior/audit.err"
            exit 1
          fi
          python - "$RUNNER_TEMP/v26_behavior/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d["schema"]=="ygg.itd02.v26.return_selectivity.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["original_world_training"] and not d["independent_unfamiliar_world_transfer_proven"]
          assert d["original_native_unchanged"] and d["candidate_scalars"]==326
          assert d["full_matrix_rls_conventional_control"] and d["v25_control_unchanged"]
          assert d["streams_count"]==8
          assert len(d["canonical_case_regret_sha256"])==64
          assert all(s["source_sha_unchanged"] and s["max_checkpoint_bytes"]<=12288
                     and s["stored_learned_scalars"]==326 for s in d["streams"])
          assert d["classification"] in {
            "V26_SOURCE_RETURN_SELECTIVITY_NOT_ESTABLISHED__NO_SCIENCE",
            "V26_REACTIVATION_WITHOUT_STRONG_CONTROL_GAIN__NO_SCIENCE",
            "V26_RETURN_GAIN_NOT_ROBUST__NO_SCIENCE",
            "V26_BOUNDED_SYNTHETIC_RETURN_SELECTIVITY_ENGINEERING_POSITIVE__NO_SCIENCE"}
          print("V26_SOURCE_ONLY_CLASSIFICATION",d["classification"])
          print("V26_CANONICAL_CASE_REGRET_SHA",d["canonical_case_regret_sha256"])
          print("V26_PREDECLARED_GATE_RESULTS",json.dumps(d["gates"],sort_keys=True))
          for s in d["streams"]:
            last=s["stages"][-1]
            print("V26_STREAM",s["name"],"latency",last["return_latency"],
                  "false",last["false_reactivations_postwarmup"],
                  "slow_after_warmup",last["slow_occupancy_postwarmup"])
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Source-only V26 focused and V25 original safety checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_crosscue_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo ITD02_V26_BEHAVIOR_WITNESS_NOT_ORIGINAL_SCIENCE
      - name: Retain immutable host audit and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v26-evaluation-${{ matrix.os }}
          path: ${{ runner.temp }}/v26_behavior/*
          retention-days: 7
          if-no-files-found: warn
