name: Yggdrasil Y036 intermediate graph-conflict quorum
on:
  push:
    branches: [research/y036-intermediate-conflict-gate-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact preregistration and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 35eace118e16ab8195a6810f2bc6ec569dfd0106 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/execute.py)" = 692e92cf931a2d63b39a618c0044af390984f099
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-intermediate/prereg.json)" = 78f3ba1dd2fbc9369db2223d9ff3c37c1723da26
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-intermediate/execute.py)" = 3180b9ae3c6866dd5804963873d9fbce4f6cf8d1
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-intermediate/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-intermediate/execute.py
      - name: Original frozen 20-cell intermediate conflict evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-intermediate/execute.py > /tmp/Y036-original.json
          python3 -m json.tool /tmp/Y036-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y036-original.json'))
          assert x['heldout_seeds']==list(range(208,224))
          assert len(x['regimes'])==4
          print('CLASSIFICATION',x['classification'])
          for r in x['regimes']:
              print('REGIME',r['regime'],r['heldout_churn'],r['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original-intermediate-conflict
          path: /tmp/Y036-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One final full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
