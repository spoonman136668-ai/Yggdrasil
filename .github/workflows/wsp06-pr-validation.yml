# Public DEV read-only full regression; no schedule, dispatch or self-hosted workers.
name: WSP-06 numeric weight-space causal circuit DEV regression
on:
  pull_request:
    branches:
      - research/wsp05-causal-state-signature-20261110
      - main
    paths:
      - 'research/contrib/chatgpt/WSP-06/**'
      - '.ice/code-atlas.*'
      - '.github/workflows/wsp06-pr-validation.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source G29 atlas integrity
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Full existing Yggdrasil Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preserve WSP-01
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-01 -p "test_*.py" -v
      - name: Preserve WSP-02 scientific negative
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-02 -p "test_*.py" -v
      - name: Preserve WSP-03
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-03 -p "test_*.py" -v
      - name: Preserve WSP-04
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-04 -p "test_*.py" -v
      - name: Preserve WSP-05
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-05 -p "test_*.py" -v
      - name: Numeric circuit, safety and ablation tests WSP-06
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-06 -p "test_*.py" -v
      - name: Frozen 32-world numeric weights and trained baseline comparison
        run: python research/contrib/chatgpt/WSP-06/run_dev.py
      - name: Reject source mutation
        run: git diff --exit-code
