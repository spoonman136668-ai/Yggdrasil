name: YGG-CAP01 source-bound native memory and six-head continuation
'on':
  push:
    branches:
      - research/ygg-cap01-segmented-continuation-20261119
    paths:
      - '.github/workflows/ygg-cap01.yml'
      - 'yggdrasil/native_segmented_continuation.py'
      - 'tests/test_native_segmented_continuation.py'
      - 'research/contrib/chatgpt/YGG-CAP01/prereg.json'
      - 'research/contrib/chatgpt/YGG-CAP01/source.py'
      - 'research/contrib/chatgpt/YGG-CAP01/campaign.py'
      - 'research/contrib/chatgpt/YGG-CAP01/audit.py'
      - 'research/contrib/chatgpt/YGG-CAP01/parity.py'
      - 'research/contrib/chatgpt/YGG-CAP01/test_parity.py'
      - 'research/contrib/chatgpt/YGG-CAP01/seal.py'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Disable platform-specific source line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install qualified native numeric dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Immutable parent, prereg, source and original native model focused controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code d7107c0f63260684ed47fbf1e6baf32c34922fb4 HEAD -- research/contrib/chatgpt/YGG-CAP01/prereg.json
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP01/source.py)" = 9e34144de876778d8931b7dacce9b990bb36716a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-05/original/linux/seed-14071-state.json)" = 33b648ef36e381a2eb753094f930a4722570b448
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-05/original/linux/seed-14072-state.json)" = 5b9df452e45a1ebc3faadb265ceeffbc580ed7bf
          python -B -m unittest discover -s tests -p 'test_native_segmented_continuation.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_parity.py' -v
          python -B research/contrib/chatgpt/YGG-CAP01/campaign.py --help
          python -B research/contrib/chatgpt/YGG-CAP01/audit.py --help
          test -z "$(git status --porcelain)"
  train:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Disable platform-specific source line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install qualified native numeric dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Train actual original source Yggdrasil beyond 1024 and independently audit evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code d7107c0f63260684ed47fbf1e6baf32c34922fb4 HEAD -- research/contrib/chatgpt/YGG-CAP01/prereg.json
          mkdir -p "$RUNNER_TEMP/YGG-CAP01"
          python -B research/contrib/chatgpt/YGG-CAP01/campaign.py --output "$RUNNER_TEMP/YGG-CAP01"
          python -B research/contrib/chatgpt/YGG-CAP01/audit.py "$RUNNER_TEMP/YGG-CAP01" --output "$RUNNER_TEMP/YGG-CAP01/audit.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: YGG-CAP01-${{ matrix.os }}
          path: ${{ runner.temp }}/YGG-CAP01/
          if-no-files-found: warn
          retention-days: 30
  seal:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Disable platform-specific source line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-CAP01-ubuntu-latest
          path: ${{ runner.temp }}/CAP01-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-CAP01-windows-2022
          path: ${{ runner.temp }}/CAP01-windows
      - name: Seal both original trained receipts and G29 without repeating scored source
        id: seal
        shell: bash
        env:
          CAP01_LINUX_ARTIFACT: ${{ runner.temp }}/CAP01-linux
          CAP01_WINDOWS_ARTIFACT: ${{ runner.temp }}/CAP01-windows
          CAP01_SOURCE_SHA: ${{ github.sha }}
          CAP01_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code d7107c0f63260684ed47fbf1e6baf32c34922fb4 HEAD -- research/contrib/chatgpt/YGG-CAP01/prereg.json
          python -B research/contrib/chatgpt/YGG-CAP01/seal.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/contrib/chatgpt/YGG-CAP01/
          git commit -m 'research(cap01): seal original capacity continuation evidence from both platforms'
          EVIDENCE_SHA="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$EVIDENCE_SHA"
          git add .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git commit -m "docs(cap01): exact G29 atlas for $EVIDENCE_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ygg-cap01-segmented-continuation-20261119
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Disable platform-specific source line ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install qualified native numeric dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Mandatory full Yggdrasil exact-SHA final regression and source atlas
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.seal.outputs.final_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
