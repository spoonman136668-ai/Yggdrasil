name: AAI-09A generated source-pinned atlas companion (no science)
on:
  push:
    branches: [research/aai09a-protected-regime-memory-20261114]
    paths: [.github/workflows/aai09a-atlas.yml]
permissions:
  contents: write
jobs:
  generated-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-09A generated-only pinned atlas and full G29' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify registered original source and generate only the three existing code-atlas files
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'ba1cfa027f50a9e904269572aacea1c737db6d0f'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai09a-atlas.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-09A/prereg.json)" = "$(git rev-parse d9e9f3f11d04cdcf99c5e5b1e0c7a5008e0c2026:research/contrib/chatgpt/AAI-09A/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-09A/models.py)" = "$(git rev-parse 8e9b6e6ba91b320ecfc36733eaa048895d99a948:research/contrib/chatgpt/AAI-09A/models.py)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-09A/evaluate.py)" = "$(git rev-parse 430d5b2571435d02b1de6c59ed134fd959594a55:research/contrib/chatgpt/AAI-09A/evaluate.py)"
          test -z "$(git status --porcelain)"
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-09A -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-09A generated source-pinned G29 atlas files only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch origin research/aai09a-protected-regime-memory-20261114
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai09a-protected-regime-memory-20261114
          echo AAI09A_G29_GENERATED_ONLY_PASS
