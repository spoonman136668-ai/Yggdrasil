name: WSP-209 Frozen Synthetic Mechanism Diagnostic
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-209/**'
      - '.github/workflows/wsp209-source-free.yml'
permissions:
  contents: read
jobs:
  frozen-diagnostic:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact pinned source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python --version
      - name: Full repository unit regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Inherited WSP-200 source-free regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-200 -p 'test_*.py' -v
      - name: Frozen WSP-209 synthetic diagnostic with emitted evidence
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-209 -p 'test_*.py' -v
      - name: G29 source-index qualification
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Clean source and generated artifacts
        run: git diff --exit-code
