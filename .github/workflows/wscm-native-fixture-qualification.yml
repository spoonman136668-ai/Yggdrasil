name: WSCM native fixture exact-candidate qualification
on:
  push:
    branches:
      - research/wscm-epistemic-guard-integration-20261123
    paths:
      - '.github/workflows/wscm-native-fixture-qualification.yml'
      - '.ice/code-atlas.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  reanchor-g29:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ci(wscm): reanchor generated G29 and qualify Grid5'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      head: ${{ steps.seal.outputs.head }}
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Write exactly three generated G29 artifacts on the authorized draft PR branch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/wscm-epistemic-guard-integration-20261123"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Frozen source: do not qualify arbitrary subsequent code changes.
          FROZEN_SOURCE_SHA="266c8613305681e0e88979175954b0a0e991a804"
          test "$(git rev-parse "$FROZEN_SOURCE_SHA^{tree}")" = "c4da7b27ab3d6c53676402137e3a65898eee300a"
          git merge-base --is-ancestor "$FROZEN_SOURCE_SHA" "$GITHUB_SHA"
          test "$(git diff --name-only "$FROZEN_SOURCE_SHA" "$GITHUB_SHA")" = ".github/workflows/wscm-native-fixture-qualification.yml"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/wscm-native-fixture-qualification.yml"
          test "$(git rev-parse HEAD:yggdrasil/native_grid5_evidence.py)" = "e743a02d194e2e76c6a689268d376bb3d2b4880e"
          test "$(git rev-parse HEAD:tests/test_native_grid5_evidence_dev.py)" = "2e358daaaeec71207a1c58b35f02e9f2e29c22c9"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_episode_scope_dev.py)" = "7085619c0386b06faa122d04a0a30ac41501e1b6"
          test "$(git rev-parse HEAD:tests/test_wscm_native_grid5_dev.py)" = "941547a72fb0711a092ec0edc9f9b16a00bf8983"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_learned_delta_dev.py)" = "6c79ddcec1b959566dd51c0b1a902c25c427a6c9"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/operator-delta-prereg.json)" = "ae23cb0ca55761e485f1a49c7f4026da4bf2f1eb"
          test "$(git rev-parse HEAD:yggdrasil/native_episode_experience.py)" = "5a77232cdd4a0fda314e47278c9ba0ed109cfd50"
          test "$(git rev-parse HEAD:yggdrasil/native_cumulative_learner.py)" = "88a184fa172cd5b912546c786bd5c26785c9e060"
          test "$(git rev-parse HEAD:yggdrasil/native_causal_amalgam.py)" = "cdf0ac676ea231bd780dbe63346bd50a59ced55f"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/prereg.json)" = "e971a574113bcc5dd6e2e5b57d2556e10a1aea13"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-EPISTEMIC-GUARD-01/guard.py)" = "4e2970cade642aa46426165d9d74aa6e219ff9dd"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-EPISTEMIC-GUARD-01/test_guard.py)" = "f4c9e847fc27acdea236c9467486577b456faa42"
          test "$(git rev-parse HEAD:tests/test_wscm_epistemic_guard01_native.py)" = "08176163a7c8dafb7c42ccd18baea16207bc6b40"
          test "$(git rev-parse HEAD:tests/test_wscm_epistemic_guard01_cross_readout.py)" = "3227eaf0f65dab629b0b8c0a43bdf8b4ffa35fd4"
          # Frozen opt-in WSCM implementation, focused tests and G29 builder.
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/conditional_rule_dev.py)" = "f1abe0f883019478730409ab1e917b6ed4995f13"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/evidence_gate_dev.py)" = "71bd54a0b975f1ad4d46cacaefa8ebfd2b186f5d"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/discrimination_preflight_dev.py)" = "d3fc4d191fd2b620adeabd4a2e8ab6c978b4d93d"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/native_version_space_dev.py)" = "37c12c98fd9ba13b937feed953efcd3f09438ca4"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_conditional_native_dev.py)" = "a5feb10136027a23c1f30157af6513aa78552fc9"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_corroboration_dev.py)" = "48e9d926d9b12d0252469eb5409534b9d5608198"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_discrimination_preflight_dev.py)" = "1e4235a2a6046be8ed2926e0b44d4e12e3275d60"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_version_space_dev.py)" = "7adb53e547e81c8ff6248e653452e31eee029c48"
          test "$(git rev-parse HEAD:yggdrasil/native_sparse_operator_evidence.py)" = "1fda97c9a3c53e32d0be880353bda2ce02b32237"
          test "$(git rev-parse HEAD:tests/test_native_sparse_operator_evidence.py)" = "0a427227c6e418c37e9e0586b470473e9c8089b3"
          test "$(git rev-parse HEAD:tests/test_native_sparse_operator_integration.py)" = "bdff9a80bb894f3c3a8881d3b8e8c7789f9fdaf5"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-SPARSE-OPERATOR-DEV-01/sparse_operator_dev.py)" = "e915d18f3b4914debd637c05e257332bed8f1c60"
          test "$(git rev-parse HEAD:tests/test_wscm_sparse_operator_dev.py)" = "08c45c9b99a9d5e7b9b0d4518cc6e11cc9decbe4"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-SPARSE-NATIVE-DEV-02/README.md)" = "5ecf1b1d685c478f85de5b24f398a6982677f98b"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-SPARSE-NATIVE-DEV-02/result.json)" = "301165bd31073363236753b90a844f5742fbd3b3"
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          grep -Fx "SOURCE_COMMIT: $GITHUB_SHA" .ice/code-atlas.ice
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wscm): regenerate G29 atlas from source $GITHUB_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/wscm-epistemic-guard-integration-20261123"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "WSCM_G29_ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          git rev-parse HEAD^{tree}
  native-fixture:
    needs: reanchor-g29
    if: "needs.reanchor-g29.result == 'success'"
    env:
      QUALIFIED_SHA: ${{ needs.reanchor-g29.outputs.head }}
      G29_SOURCE_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.reanchor-g29.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source candidate and generated atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse HEAD^)" = "$G29_SOURCE_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          echo "WSCM_CANDIDATE_SHA=$QUALIFIED_SHA"
          echo "WSCM_SOURCE_SHA=$G29_SOURCE_SHA"
          git rev-parse HEAD^{tree}
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: Deterministic exact-head G29 re-render (temporary evidence, no source mutation)
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$G29_SOURCE_SHA" --write
          grep -Fx "SOURCE_COMMIT: $GITHUB_SHA" .ice/code-atlas.ice
          cp .ice/code-atlas.json "$RUNNER_TEMP/wscm-code-atlas.json"
          cp .ice/code-atlas.html "$RUNNER_TEMP/wscm-code-atlas.html"
          cp .ice/code-atlas.ice "$RUNNER_TEMP/wscm-code-atlas.ice"
          python -B scripts/build_code_atlas.py --source-commit "$G29_SOURCE_SHA" --write
          cmp .ice/code-atlas.json "$RUNNER_TEMP/wscm-code-atlas.json"
          cmp .ice/code-atlas.html "$RUNNER_TEMP/wscm-code-atlas.html"
          cmp .ice/code-atlas.ice "$RUNNER_TEMP/wscm-code-atlas.ice"
          sha256sum "$RUNNER_TEMP"/wscm-code-atlas.*
          git restore -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WSCM-exact-G29-${{ runner.os }}-${{ needs.reanchor-g29.outputs.head }}
          path: ${{ runner.temp }}/wscm-code-atlas.*
          if-no-files-found: error
          retention-days: 30
      - name: Focused original-native external-ID, sparse-v9, and cold-memory tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_wscm_transfer02_fixture_plan.py test_native_episode_external_fixture_envelope.py test_native_external_action_identity.py test_native_grid5_evidence_dev.py test_wscm_grid5_episode_scope_dev.py test_wscm_native_grid5_dev.py test_wscm_grid5_conditional_native_dev.py test_wscm_grid5_corroboration_dev.py test_wscm_grid5_discrimination_preflight_dev.py test_wscm_grid5_version_space_dev.py test_wscm_grid5_learned_delta_dev.py test_wscm_sparse_operator_dev.py test_native_sparse_operator_evidence.py test_native_sparse_operator_integration.py test_wscm_epistemic_guard01_native.py test_wscm_epistemic_guard01_cross_readout.py; do
            python -B -m unittest discover -s tests -p "$suite" -v
          done
          (cd research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01 && python -B -m unittest discover -s . -p 'test_conditional_rule_dev.py' -v)
          (cd research/contrib/chatgpt/WSCM-EPISTEMIC-GUARD-01 && python -B -m unittest discover -s . -p 'test_guard.py' -v)
          (cd research/contrib/chatgpt/WSCM-EPISTEMIC-GUARD-01 && python -O -B -m unittest discover -s . -p 'test_guard.py' -v)
          test -z "$(git status --porcelain)"
      - name: Install existing pinned native solver test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory complete existing test regression
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # POSIX-only historical EPOCH sources require Python's 'resource'.
            # They execute on Linux; Windows records TWO explicit module skips,
            # without loading/replaying or altering their immutable sources.
            python -B - <<'PY'
          import sys
          import unittest

          class PlatformLoader(unittest.TestLoader):
              def _get_module_from_name(self, name):
                  if name in ("test_wscm_epoch01", "test_wscm_epoch02"):
                      raise unittest.SkipTest(
                          "POSIX resource-dependent historical tests: Linux-only")
                  return super()._get_module_from_name(name)

          result = unittest.TextTestRunner(verbosity=1).run(
              PlatformLoader().discover("tests", pattern="test_*.py"))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py'
          fi
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
          # Include the new pure conditional-rule tests outside tests/; native
          # integration and version-space tests are included by the full suite.
          PYTHONPATH=".:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01" python -B -m unittest discover -s research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01 -p 'test_conditional_rule_dev.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
