name: WSCM native fixture exact-candidate qualification
on:
  push:
    branches:
      - research/wscm-transfer02-full-regression-20261124
    paths:
      - '.github/workflows/wscm-native-fixture-qualification.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  reanchor-g29:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      head: ${{ steps.seal.outputs.head }}
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reanchor exactly three generated atlas artifacts
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/wscm-transfer02-full-regression-20261124"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "b56f22ca784a3afe7cb76a6c4f75455d11a3bac2"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/wscm-native-fixture-qualification.yml"
          test "$(git rev-parse '9caa00de3d08100829fcf86557570f2d51834b44^{tree}')" = "056039459c71aa50aff0805c4c05d0b1ee801165"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          diff -u <(git diff --name-only 9caa00de3d08100829fcf86557570f2d51834b44 HEAD | LC_ALL=C sort) <(printf '%s\n' '.github/workflows/wscm-native-fixture-qualification.yml' '.research-autonomy/evidence/WSCM-TRANSFER02-NATIVE-FUNCTIONAL-CONSENSUS-QUAL-01-45520440018/result.json' '.research-autonomy/evidence/WSCM-TRANSFER02-NATIVE-FUNCTIONAL-CONSENSUS-QUAL-01-45520440018/summary.json' '.research-autonomy/state.json' | LC_ALL=C sort)
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wscm): reanchor G29 for exact native composition regression"
          python -B scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/wscm-transfer02-full-regression-20261124"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD^{tree}
  native-fixture:
    needs: reanchor-g29
    env:
      QUALIFIED_SHA: ${{ needs.reanchor-g29.outputs.head }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.reanchor-g29.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          diff -u <(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          python -B scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          echo "WSCM_CANDIDATE_SHA=$(git rev-parse HEAD)"
          git rev-parse HEAD^{tree}
      - name: Focused exact native composition fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -B research/applications/plane/wscm_transfer02_native_qualification.py --out "$RUNNER_TEMP/wscm-focused.json"
          python -B -c "import json,sys; r=json.load(open(sys.argv[1],encoding='utf-8')); assert r['status']=='ORIGINAL_NATIVE_FIXTURE_PASS' and r['metrics']['test_count_total']==39 and r['metrics']['skipped_total']==0" "$RUNNER_TEMP/wscm-focused.json"
      - name: Install existing pinned native solver test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory complete existing test regression
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # POSIX-only historical EPOCH sources require Python's 'resource'.
            # They execute on Linux; Windows records TWO explicit module skips,
            # without loading/replaying or altering their immutable sources.
            python -B - <<'PY'
          import sys
          import unittest

          class PlatformLoader(unittest.TestLoader):
              def _get_module_from_name(self, name):
                  if name in ("test_wscm_epoch01", "test_wscm_epoch02"):
                      raise unittest.SkipTest(
                          "POSIX resource-dependent historical tests: Linux-only")
                  return super()._get_module_from_name(name)

          result = unittest.TextTestRunner(verbosity=1).run(
              PlatformLoader().discover("tests", pattern="test_*.py"))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py'
          fi
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
          # Include the new pure conditional-rule tests outside tests/; native
          # integration and version-space tests are included by the full suite.
          PYTHONPATH=".:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01" python -B -m unittest discover -s research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01 -p 'test_conditional_rule_dev.py' -v
          test -z "$(git status --porcelain)"
      - name: Existing G29 atlas check (read only)
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
