name: WSCM native fixture exact-candidate qualification
on:
  push:
    branches:
      - research/wscsm01-wake-sleep-protocol-20261121
    paths:
      - '.github/workflows/wscm-native-fixture-qualification.yml'
      - '.ice/code-atlas.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  reanchor-g29:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'ci(wscm): reanchor generated G29 and qualify Grid5'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      head: ${{ steps.seal.outputs.head }}
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Write exactly three generated G29 artifacts on the authorized draft PR branch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/wscsm01-wake-sleep-protocol-20261121"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "27ab1f79b0448f9e1be714f2d1334b6d32eaa59b"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/wscm-native-fixture-qualification.yml"
          test "$(git rev-parse HEAD:yggdrasil/native_grid5_evidence.py)" = "e743a02d194e2e76c6a689268d376bb3d2b4880e"
          test "$(git rev-parse HEAD:tests/test_native_grid5_evidence_dev.py)" = "2e358daaaeec71207a1c58b35f02e9f2e29c22c9"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_episode_scope_dev.py)" = "7085619c0386b06faa122d04a0a30ac41501e1b6"
          test "$(git rev-parse HEAD:tests/test_wscm_native_grid5_dev.py)" = "941547a72fb0711a092ec0edc9f9b16a00bf8983"
          test "$(git rev-parse HEAD:tests/test_wscm_grid5_learned_delta_dev.py)" = "6c79ddcec1b959566dd51c0b1a902c25c427a6c9"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/operator-delta-prereg.json)" = "ae23cb0ca55761e485f1a49c7f4026da4bf2f1eb"
          test "$(git rev-parse HEAD:yggdrasil/native_episode_experience.py)" = "498c22f4b6cd71fe713cceb2773cc51971ea5953"
          test "$(git rev-parse HEAD:yggdrasil/native_cumulative_learner.py)" = "1a1ea559de730c7aa230548d04b893ba61f030b4"
          test "$(git rev-parse HEAD:yggdrasil/native_causal_amalgam.py)" = "cdf0ac676ea231bd780dbe63346bd50a59ced55f"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSCM-GRID5-ROLE-DEV-01/prereg.json)" = "e971a574113bcc5dd6e2e5b57d2556e10a1aea13"
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          grep -Fx "SOURCE_COMMIT: $GITHUB_SHA" .ice/code-atlas.ice
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wscm): regenerate G29 atlas from source $GITHUB_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/wscsm01-wake-sleep-protocol-20261121"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "WSCM_G29_ARTIFACT_COMMIT=$(git rev-parse HEAD)"
          git rev-parse HEAD^{tree}
  native-fixture:
    needs: reanchor-g29
    if: "needs.reanchor-g29.result == 'success'"
    env:
      QUALIFIED_SHA: ${{ needs.reanchor-g29.outputs.head }}
      G29_SOURCE_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.reanchor-g29.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source candidate and generated atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          test "$(git rev-parse HEAD^)" = "$G29_SOURCE_SHA"
          echo "WSCM_CANDIDATE_SHA=$QUALIFIED_SHA"
          echo "WSCM_SOURCE_SHA=$G29_SOURCE_SHA"
          git rev-parse HEAD^{tree}
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: Deterministic exact-head G29 re-render (temporary evidence, no source mutation)
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$G29_SOURCE_SHA" --write
          grep -Fx "SOURCE_COMMIT: $GITHUB_SHA" .ice/code-atlas.ice
          cp .ice/code-atlas.json "$RUNNER_TEMP/wscm-code-atlas.json"
          cp .ice/code-atlas.html "$RUNNER_TEMP/wscm-code-atlas.html"
          cp .ice/code-atlas.ice "$RUNNER_TEMP/wscm-code-atlas.ice"
          python -B scripts/build_code_atlas.py --source-commit "$G29_SOURCE_SHA" --write
          cmp .ice/code-atlas.json "$RUNNER_TEMP/wscm-code-atlas.json"
          cmp .ice/code-atlas.html "$RUNNER_TEMP/wscm-code-atlas.html"
          cmp .ice/code-atlas.ice "$RUNNER_TEMP/wscm-code-atlas.ice"
          sha256sum "$RUNNER_TEMP"/wscm-code-atlas.*
          git restore -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WSCM-exact-G29-${{ runner.os }}-${{ needs.reanchor-g29.outputs.head }}
          path: ${{ runner.temp }}/wscm-code-atlas.*
          if-no-files-found: error
          retention-days: 30
      - name: Focused original-native external-ID and cold-memory tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_wscm_transfer02_fixture_plan.py test_native_episode_external_fixture_envelope.py test_native_external_action_identity.py test_native_grid5_evidence_dev.py test_wscm_grid5_episode_scope_dev.py test_wscm_native_grid5_dev.py; do
            python -B -m unittest discover -s tests -p "$suite" -v
          done
          test -z "$(git status --porcelain)"
      - name: Install existing pinned native solver test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory complete existing test regression
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # POSIX-only historical EPOCH sources require Python's 'resource'.
            # They execute on Linux; Windows records TWO explicit module skips,
            # without loading/replaying or altering their immutable sources.
            python -B - <<'PY'
          import sys
          import unittest

          class PlatformLoader(unittest.TestLoader):
              def _get_module_from_name(self, name):
                  if name in ("test_wscm_epoch01", "test_wscm_epoch02"):
                      raise unittest.SkipTest(
                          "POSIX resource-dependent historical tests: Linux-only")
                  return super()._get_module_from_name(name)

          result = unittest.TextTestRunner(verbosity=1).run(
              PlatformLoader().discover("tests", pattern="test_*.py"))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py'
          fi
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
