name: WSCM native fixture exact-candidate qualification
on:
  push:
    branches:
      - research/wscsm01-wake-sleep-protocol-20261121
    paths:
      - '.github/workflows/wscm-native-fixture-qualification.yml'
      - '.ice/code-atlas.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  native-fixture:
    if: "startsWith(github.event.head_commit.message, 'docs(wscm): regenerate G29 atlas')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source candidate and generated atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "WSCM_CANDIDATE_SHA=$GITHUB_SHA"
          git rev-parse HEAD^{tree}
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: Focused original-native external-ID and cold-memory tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_wscm_transfer02_fixture_plan.py test_native_episode_external_fixture_envelope.py test_native_external_action_identity.py; do
            python -B -m unittest discover -s tests -p "$suite" -v
          done
          test -z "$(git status --porcelain)"
      - name: Install existing pinned native solver test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory complete existing test regression
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # POSIX-only historical EPOCH sources require Python's 'resource'.
            # They execute on Linux; Windows records TWO explicit module skips,
            # without loading/replaying or altering their immutable sources.
            python -B - <<'PY'
          import sys
          import unittest

          class PlatformLoader(unittest.TestLoader):
              def _get_module_from_name(self, name):
                  if name in ("test_wscm_epoch01", "test_wscm_epoch02"):
                      raise unittest.SkipTest(
                          "POSIX resource-dependent historical tests: Linux-only")
                  return super()._get_module_from_name(name)

          result = unittest.TextTestRunner(verbosity=1).run(
              PlatformLoader().discover("tests", pattern="test_*.py"))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py'
          fi
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
