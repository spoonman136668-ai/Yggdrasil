name: Yggdrasil F55 one frozen synthetic heldout TRAIN science (not F3)
on:
  push:
    branches:
      - science/y-f55-once-only-heldout-20261015-r1
permissions:
  contents: read
  actions: read
jobs:
  one-source:
    if: "${{ github.event.head_commit.message == 'science(y-f55): single frozen heldout TRAIN diagnostic and source-free audit' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on original source and precode controls identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 70a4a95d3fd243c6ddcc84aa6073ee7fd48b6360 HEAD
          test "$(git hash-object research/foundational/20261015-y-f55/prereg-candidate.json)" = eb815347e331ec34dc8247ff28d99bbcd13e621a
          test "$(git hash-object research/foundational/20261015-y-f55/source_pilot.py)" = f8e6cb5b36b037b17848d6d68abab37a0d20911a
          test "$(git hash-object research/foundational/20261015-y-f55/audit_result.py)" = 8cf20d12e400724374417a9482748115f0e7e9bf
          python3 -m json.tool research/foundational/20261015-y-f55/prereg-candidate.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-y-f55 -p test_fit_preflight.py -v
          python3 -B -m unittest discover -s research/foundational/20261015-y-f55 -p test_model_fit.py -v
      - name: Verify exact FIT qualification before first-use
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=$(curl --fail --silent --show-error --retry 2 --max-time 25             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/runs/38833038757")
          echo "$d" | jq -e --arg source "70a4a95d3fd243c6ddcc84aa6073ee7fd48b6360"             '.head_sha==$source and .status=="completed" and .conclusion=="success" and .run_attempt==1'
      - name: One full original repository regression before scientific source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e '.[test]'
          python3 -m pytest -q tests
      - name: Exactly one new frozen TRAIN diagnostic and independent source-free recount
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y55"
          git rev-parse HEAD > "$RUNNER_TEMP/y55/FROZEN_EXACT_HEAD"
          python3 -B research/foundational/20261015-y-f55/source_pilot.py --diagnostic-train              > "$RUNNER_TEMP/y55/one-source-result.json"
          python3 -m json.tool "$RUNNER_TEMP/y55/one-source-result.json" >/dev/null
          python3 -B research/foundational/20261015-y-f55/audit_result.py              "$RUNNER_TEMP/y55/one-source-result.json"              research/foundational/20261015-y-f55/prereg-candidate.json              > "$RUNNER_TEMP/y55/independent-audit.json"
          cat "$RUNNER_TEMP/y55/independent-audit.json"
          (cd "$RUNNER_TEMP/y55" && sha256sum one-source-result.json independent-audit.json > manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yggdrasil-F55-once-only-TRAIN-heldout-and-audit
          path: ${{ runner.temp }}/y55/
          if-no-files-found: warn
          retention-days: 90
      - name: Authority exclusion
        run: |
          echo "NEW_DIAGNOSTIC_IS_SYNTHETIC_TRAIN_ONLY"
          echo "F3_INDEPENDENT=FALSE; PRIMARY_ORIGINALS_EXECUTED=ZERO"
          echo "NATIVE_TOTAL_576B=UNQUALIFIED"
          echo "ACCEPTED_REFS_AND_LIVE_FORGE_UNCHANGED=TRUE"
