name: AAI-08P official NS-Gym stochastic RNG custody (mechanical only)
on:
  push:
    branches: [research/aai08-nsgym-nonstationary-bridge-20261114]
    paths: [.github/workflows/aai08p-stochastic-custody.yml]
permissions:
  contents: read
jobs:
  two-platform-rng-custody:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-08P scoped stochastic RNG mechanical one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source and mechanical-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'b0d6b9bf4cd79ce492acb9b0f00b6422d8588757'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai08p-stochastic-custody.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-08P/stochastic_custody.py)" = "$(git rev-parse b0d6b9bf4cd79ce492acb9b0f00b6422d8588757:research/contrib/chatgpt/AAI-08P/stochastic_custody.py)"
          echo AAI08P_STOCHASTIC_SOURCE_LOCK_PASS
      - name: Verify official immutable NS-Gym source and minimal runtime
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/aai08-upstream"
          git -C "$RUNNER_TEMP/aai08-upstream" remote add origin https://github.com/scope-lab-vu/ns_gym.git
          git -C "$RUNNER_TEMP/aai08-upstream" fetch -q --no-tags --depth 1 origin 127df4b714fe4fcf680721d8e9278a96090acd7e
          git -C "$RUNNER_TEMP/aai08-upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aai08-upstream" rev-parse HEAD)" = '127df4b714fe4fcf680721d8e9278a96090acd7e'
          test "$(git -C "$RUNNER_TEMP/aai08-upstream" rev-parse HEAD:ns_gym/envs/Bridge.py)" = '02415d65ff8a0c419d32f274e2669f9e54e8d29f'
          test "$(git -C "$RUNNER_TEMP/aai08-upstream" rev-parse HEAD:ns_gym/wrappers/toy_text.py)" = 'cd94311a4d312b9d8c35b7719207020150caa300'
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            numpy==1.26.4 'gymnasium[mujoco]==1.2.2' scipy==1.15.3 PyYAML==6.0.2 \
            mujoco==3.3.7 pygame==2.6.1
          python -m pip install --disable-pip-version-check --no-input --no-deps -e "$RUNNER_TEMP/aai08-upstream"
          echo AAI08P_OFFICIAL_SOURCE_STOCHASTIC_IMPORT_PASS
      - name: Scoped stochastic replay and negative stationary controls, reserved seeds only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-08P -p test_stochastic_custody.py -v
          python -B research/contrib/chatgpt/AAI-08P/stochastic_custody.py
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$RUNNER_TEMP/aai08-upstream" status --porcelain)"
          echo AAI08P_STOCHASTIC_SCOPED_RNG_PASS
