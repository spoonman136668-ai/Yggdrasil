name: Y-F33 dual evaluator source preflight (NO original)
on:
  push:
    branches:
      - research/y-f33-posterior-evaluator-qualification-20261015-r1
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependency setup
        run: python3 -m pip install -e '.[test]'
      - name: Validate frozen predecessor and prereg
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 88b1f9b8e383d748d35f51ad61668a7837bbdd4a HEAD
          git merge-base --is-ancestor 05bf66e0b7c2b9e1765eea5b3d41f3ebed70e26a HEAD
          test "$(git hash-object research/foundational/20261015-y-f32/pilot.py)" = "$(git rev-parse 88b1f9b8e383d748d35f51ad61668a7837bbdd4a:research/foundational/20261015-y-f32/pilot.py)"
          python3 -m json.tool research/foundational/20261015-y-f33/source-prereg.json > /dev/null
          python3 -m py_compile research/foundational/20261015-y-f33/source_pilot.py
          python3 -m py_compile research/foundational/20261015-y-f33/evaluator_only.py
      - name: Focused source-only tests
        run: python3 -m unittest discover -s research/foundational/20261015-y-f33 -p test_preflight.py -v
      - name: Exactly one full pytest regression
        run: python3 -m pytest -q tests
      - name: Scope
        run: echo "Y-F33 source engineering only; no train-only pilot and NO primary original executed"
