name: ITD-02 V31I cold restart engineering
on:
  push:
    branches: [research/itd02-v31i-cold-checkpoint-20261028]
permissions:
  contents: read
jobs:
  cold-restart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact prereg and native bridge source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3e2fb223b670f10914c8ced769ac60530530632f "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Cold restart and tampered checkpoint rejection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31i"
          PYTHONPATH=. python -B research/itd02_v31i_cold_restart_audit.py > "$RUNNER_TEMP/v31i/audit.json"
          python - "$RUNNER_TEMP/v31i/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["classification"]=="V31I_COLD_RESTART_SCOPED_ENGINEERING_PASS__NO_SCIENCE"
          assert d["events"]==24 and d["checkpoint_bytes"]<=12288
          assert d["continuous_vs_restored_identical"] and d["tampered_digest_rejected"]
          assert not d["reserved_q_holdout_evaluated"] and not d["scientific_first_use"]
          print("V31I_COLD_RESTART_SOURCE_ONLY")
          PY
          cat "$RUNNER_TEMP/v31i/audit.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31i-${{ matrix.os }}
          path: ${{ runner.temp }}/v31i/*
          retention-days: 7
          if-no-files-found: warn
