name: ITD-02 V34 native local-credit spillover diagnostic and same-feedback ablation
on:
  push:
    branches:
      - research/itd02-v34-local-credit-spillover-20261028
permissions:
  contents: read
jobs:
  v34-credit-witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Cross-platform source line ending normalization
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact-source credential-free checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin exact V33 parent, frozen prereg before code and native original blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5bb6d0cfe095cddce438028cdd30d934239c4de7 "$GITHUB_SHA"
          git merge-base --is-ancestor 8f6ced6d662bdff819e6133ed6974830a47d4524 "$GITHUB_SHA"
          git merge-base --is-ancestor 6efa1bce658278e29482b9b3fbece99e42b87c73 "$GITHUB_SHA"
          git merge-base --is-ancestor 1eec903d5872f32367a2c79ef6a3998ee66a5248 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object yggdrasil/itd02_v26_calibrated_return_dev.py)" = 8a0417d34c6ba94a4eaef33d767da14a4a5c9709
          test "$(git hash-object yggdrasil/itd02_v30_public_probe_policy_dev.py)" = bcc1f0b4e2ec0fcd8b2af69dfb0e6d4d2ca27a4a
          test "$(git hash-object yggdrasil/itd02_v32_source_surprise_probation_dev.py)" = 9252b554c25bfdc5b6adb733f94b0c3d2b2ec92e
          test "$(git hash-object research/itd02_v33_unseen_family_independent_controls_audit.py)" = 3545f88f5689f8d5aa6e5d75b1344d7a7a83a8f2
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Frozen output/native credit public provenance focused tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v34_local_credit_spillover.py' -v
          echo V34_FOCUSED_SAFETY_PASS_NOT_SCIENCE
      - name: V34 three-world matched-selected-feedback credit and collateral ablation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v34"
          if ! PYTHONPATH=. python -B research/itd02_v34_local_credit_spillover_audit.py > "$RUNNER_TEMP/v34/audit.json" 2> "$RUNNER_TEMP/v34/errors.txt"; then
            cat "$RUNNER_TEMP/v34/errors.txt"
            exit 1
          fi
          python - "$RUNNER_TEMP/v34/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="ygg.itd02.v34.native_local_credit_spillover.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["native_original_changed"] and not d["trained_new_autonomous_model"]
          assert not d["original_world_training"]
          assert d["worlds"]==["U1","U2","U3"]
          assert d["source_training_selected_rewards"]==576
          assert d["actual_selected_target_updates_per_family"]==15
          assert d["each_original_native_bank_learned_scalars"]==163
          assert d["protected_dual_stored_scalars"]==326
          assert d["matched_public_feedback_mirror"] and d["nonlearning_control_verified"]
          assert d["conventional_full_matrix_rls_same_selected_feedback"]
          assert d["preregistration_verified"]
          assert len(d["canonical_case_credit_and_score_sha256"])==64
          assert len(d["rows"])==3
          assert all(r["base_selected_events"]==12 and r["target_extra_probes"]==3 for r in d["rows"])
          assert all(max(r["checkpoint_bytes"].values())<=12288 for r in d["rows"])
          assert d["classification"] in {
             "V34_ACTION_PARTITION_LOCALIZATION_DIAGNOSTIC_POSITIVE__NO_SCIENCE",
             "V34_FIXED_LOCAL_CREDIT_ABLATION_NO_RESCUE__NO_SCIENCE"}
          print("V34_CLASSIFICATION",d["classification"])
          print("V34_CANONICAL_CREDIT_SCORE_SHA",d["canonical_case_credit_and_score_sha256"])
          print("V34_PREDECLARED_CREDIT_COMPARISON",json.dumps(d["gates"],sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Original V33 through V22 inherited focused regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v33_unseen_family_independent_controls.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v32_source_surprise_probation.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_credit_readout_attribution.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v30_public_probe_policy.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v29_observational_equivalence.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V34_ORIGINAL_NATIVE_INHERITED_SAFETY_PASS_NOT_SCIENCE
      - name: Retain exact host evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v34-native-credit-witness-${{ matrix.os }}
          path: ${{ runner.temp }}/v34/*
          retention-days: 7
          if-no-files-found: warn
