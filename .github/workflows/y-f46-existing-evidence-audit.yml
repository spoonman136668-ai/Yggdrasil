name: Y-F46 independently audit existing TRAIN artifact (NO new experiment)
on:
  push:
    branches:
      - audit/y-f46-existing-train-evidence-20261015-r1
permissions:
  contents: read
  actions: read
jobs:
  audit-existing-f46:
    if: "${{ github.event.head_commit.message == 'audit(y-f46): independently audit one existing train result' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact-head prereg/source and existing source run identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 88963d04511a49e935c0873bf14af15f771274d0 HEAD
          test "$(git hash-object research/foundational/20261015-y-f46/prereg-candidate.json)" = 33de367980978df489b84b5e93e9206f0e293cce
          test "$(git hash-object research/foundational/20261015-y-f46/source_pilot.py)" = 92956d784d63e1fd0674dc58aa8a4c13853d5275
          python3 -m py_compile research/foundational/20261015-y-f46/independent_audit.py
      - name: Verify existing original GitHub run and artifact metadata (GET only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=$(curl --fail --silent --show-error --retry 2 --max-time 20             -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/runs/38803873408")
          echo "$run" | jq -e --arg sha 88963d04511a49e935c0873bf14af15f771274d0             '.head_sha==$sha and .status=="completed" and .conclusion=="success" and .run_attempt==1 and .path==".github/workflows/y-f46-train-once.yml"'
          arts=$(curl --fail --silent --show-error --retry 2 --max-time 20             -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/runs/38803873408/artifacts")
          echo "$arts" | jq -e --arg sha 88963d04511a49e935c0873bf14af15f771274d0             '[.artifacts[] | select(.id==12005990427 and .name=="Y-F46-TRAIN-only-causal-pair-shuffle" and
              .digest=="sha256:9bb8a3845b4540a42ce24f9c01a1703704c633d85341216a0306638307e6cf5c" and
              (.expired|not) and .workflow_run.id==38803873408 and .workflow_run.head_sha==$sha)]|length==1'
      - uses: actions/download-artifact@v4
        with:
          name: Y-F46-TRAIN-only-causal-pair-shuffle
          run-id: 38803873408
          github-token: ${{ github.token }}
          repository: spoonman136668-ai/Yggdrasil
          path: ${{ runner.temp }}/yf46-evidence
      - name: Audit all 128 existing rows, public values, acquisitions and frozen gates
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yf46-evidence"
          test "$(cat "$root/SOURCE_SHA")" = "88963d04511a49e935c0873bf14af15f771274d0"
          (cd "$root" && sha256sum -c result.sha256)
          python3 -B research/foundational/20261015-y-f46/independent_audit.py             "$root/result.json" > "$RUNNER_TEMP/y-f46-independent-audit.json"
          cat "$RUNNER_TEMP/y-f46-independent-audit.json"
          sha256sum "$RUNNER_TEMP/y-f46-independent-audit.json"             > "$RUNNER_TEMP/y-f46-independent-audit.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/y-f46-independent-audit-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Y-F46-existing-training-only-independent-audit
          path: |
            ${{ runner.temp }}/y-f46-independent-audit.json
            ${{ runner.temp }}/y-f46-independent-audit.sha256
            ${{ runner.temp }}/y-f46-independent-audit-head.txt
          retention-days: 90
          if-no-files-found: error
      - name: Authority limit
        run: |
          echo "NEW_SCIENCE_EXPERIMENTS=0"
          echo "SCIENTIFIC_ORIGINALS_EXECUTED=0"
          echo "INDEPENDENT_F3_CUSTODY=NOT_QUALIFIED"
          echo "ACCEPTED_REFS_MUTATED=FALSE"
