name: YGG CAP04 action-history source identifiability fixture qualification
on:
  push:
    branches:
      - research/ygg-cap04-action-history-unalias-20261119
    paths:
      - '.github/workflows/ygg-cap04-action-history-fixtures.yml'
permissions:
  contents: read
jobs:
  source-contract-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve exact bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source first-use-locked structural fixture qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = 04d143797ec0c727882e9172df6dbb87e8a931de
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = 51b987c6f181fcec86570b9f907f5ee7b93ccac5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          test "$(git diff --name-only c94c99d116bcc8912dc2309352e99b1fbdf9b550 HEAD | LC_ALL=C sort | tr '\n' '|')" = ".github/workflows/ygg-cap04-action-history-fixtures.yml|research/contrib/chatgpt/YGG-CAP04/prospective_source.py|tests/test_cap04_prospective_source_contract.py|"
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -p 'test_cap04_prospective_source_contract.py' -v
          test -z "$(git status --porcelain)"
          echo CAP04_HISTORY_IDENTIFIABILITY_ENGINEERING_FIXTURE_PASS
