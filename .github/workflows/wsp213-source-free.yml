name: WSP-213 Frozen Direct-Weight vs Converged Refit Research
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-213/**'
      - '.github/workflows/wsp213-source-free.yml'
      - '.ice/code-atlas.json'
      - '.ice/code-atlas.html'
      - '.ice/code-atlas.ice'
permissions:
  contents: read
jobs:
  source_exact:
    # Prevent replay of consumed source-free primaries on later stacked PRs.
    if: github.event.pull_request.head.ref == 'research/wsp213-matched-direct-weight-20261119-training-gaps'
    name: WSP213 Python3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact immutable source and Python
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python --version
      - name: Emit G29 atlas bounded source-pinned bundle for pre-evaluation seal
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          sha = "${{ github.event.pull_request.head.sha }}"
          out = subprocess.run(["python", "scripts/build_code_atlas.py",
              "--source-commit", sha, "--emit-base64"],
              capture_output=True, text=True, check=True).stdout
          chunks = [s.split(":", 1)[1] for s in out.splitlines()
                    if s.startswith("YGG_ATLAS_BUNDLE_B64:")]
          assert len(chunks) == 1
          b64 = chunks[0]
          print("WSP213_ATLAS_SOURCE=" + sha)
          for i in range(0, len(b64), 4096):
              print(f"WSP213_ATLAS_CHUNK_{i//4096:04d}=" + b64[i:i+4096])
          print("WSP213_ATLAS_TOTAL_CHUNKS=" + str((len(b64)+4095)//4096))
          PY
      - name: Root mandatory full regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: WSP200 inherited full regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-200 -p 'test_*.py' -v
      - name: WSP209 inherited regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-209 -p 'test_*.py' -v
      - name: WSP210 original smoke only (NOT invalid frozen primary)
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-210 -p 'test_00_smoke.py' -v
      - name: WSP211 allowlist only (NOT consumed calibration)
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-211 -p test_calibration.py -k strict_world_allowlist -v
      - name: WSP212 prereg and source-only negative preflight (NOT consumed calibration)
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-212 -p test_preflight.py -v
      - name: WSP213 NEW source-only prereg and negative preflight (NO target labels)
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-213 -p test_preflight.py -v
      - name: Require pinned G29 source seal BEFORE first WSP213 primary
        run: python scripts/build_code_atlas.py --check
      - name: Run ONE frozen WSP213 source-free primary; preserve null result
        run: python research/contrib/chatgpt/WSP-213/study.py --output "${{ runner.temp }}/wsp213.json"
      - name: Upload no-model, minimal synthetic JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsp213-${{ matrix.os }}
          path: ${{ runner.temp }}/wsp213.json
          if-no-files-found: warn
          retention-days: 7
      - name: Final clean git checkout
        run: git diff --exit-code
  independent_cross_os:
    needs: source_exact
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wsp213-ubuntu-24.04
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: wsp213-windows-2022
          path: artifacts/windows
      - name: Validate frozen scientific classification and numeric cross-OS parity
        run: python research/contrib/chatgpt/WSP-213/verify_parity.py artifacts/linux/wsp213.json artifacts/windows/wsp213.json
      - name: Final clean git checkout
        run: git diff --exit-code
