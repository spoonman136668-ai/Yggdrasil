name: Mass MR34I4 exact original native preactivation versus sigmoid probe
on:
  pull_request:
    branches: [research/mass-mr34i3-native-gradient-coordinate-20261023]
    paths:
      - 'research/mr34i4/**'
      - '.github/workflows/mass-mr34i4-forward-original.yml'
permissions:
  contents: read
concurrency:
  group: mass-mr34i4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
jobs:
  original-frozen-source-training:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve original source Git blobs on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: original_s4c1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact previously qualified public-source numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Install Pycolab Windows curses
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify frozen FIRST-only scope, exact original model and pre-existing protocol
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          parent=90721d4d4af97bb11c58b993d059604479c214e8
          first=e294f1417ac5048f71be79d6db5099c5b6c40f44
          test "$(git rev-parse "${first}^")" = "$parent"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git show --format= --name-only "$first")" = "research/mr34i4/FROZEN_PROTOCOL.md"
          test "$(git hash-object research/mr34i3/coordinate_probe.py)" = "$(git rev-parse "$parent:research/mr34i3/coordinate_probe.py")"
          actual="$(git diff --name-only "$parent" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mass-mr34i4-forward-original.yml' \
            'research/mr34i4/FROZEN_PROTOCOL.md' \
            'research/mr34i4/forward_probe.py' \
            'research/mr34i4/test_probe.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo MR34I4_FIRST_PROTOCOL_SOURCE_SCOPE_PASS
      - name: Source-free exact arithmetic / custody tests
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m unittest -v research.mr34i4.test_probe 2>&1 | tee ../mr34i4-focused.log
      - name: Capture only existing original TRAIN episodes' actual native stage arithmetic
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m research.mr34i4.forward_probe ../original_s4c1 ../external/minigrid ../external/pycolab ../mr34i4-stages.json | tee ../mr34i4-original.log
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("../mr34i4-stages.json").read_text())
          assert d["no_scientific_original_held_or_protected_first_use"] is True
          assert d["read_only_diagnostic_not_training_substitute"] is True
          assert len(d["real_original_source_reports"])==2
          for name,z in d["real_original_source_reports"].items():
              assert z["original_training_reset_count"]==20
              assert z["original_held_or_protected_source_actions"]==0
              assert len(z["first_three_original_training_updates"])==3
              assert all(len(e["chronological_native_forward_stages"])>0
                         for e in z["first_three_original_training_updates"])
          print("MR34I4_PINNED_ORIGINAL_TRAIN_ONLY_FIRST3_COMPLETE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-mr34i4-${{ matrix.os }}-${{ matrix.repeat }}
          path: |
            mr34i4-focused.log
            mr34i4-original.log
            mr34i4-stages.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm original source and unchanged native code read-only
        shell: bash
        run: |
          set -euo pipefail
          for p in audit original_s4c1 external/minigrid external/pycolab; do
            git -C "$p" diff --exit-code
            test -z "$(git -C "$p" status --porcelain)"
          done
          echo MR34I4_ALL_ORIGINAL_WORKTREES_CLEAN

  original-independent-stage-comparison:
    needs: original-frozen-source-training
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mass-mr34i4-*
          path: evidence
      - name: Independently check original source integrity and first differing original numeric stage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          originals={}
          for os in ("ubuntu-24.04","windows-2025"):
              for repeat in (1,2):
                  p=pathlib.Path("evidence")/f"mass-mr34i4-{os}-{repeat}"/"mr34i4-stages.json"
                  originals[os,repeat]=json.loads(p.read_text())
          order=("public_features","original_prior_state","original_read_matmul",
                 "original_read_after_role","original_cached_read","original_u_matmul",
                 "original_u_after_role","original_recurrent_state_term",
                 "original_u_preactivation","original_clipped_u","original_negated_clipped_u",
                 "original_numpy_exp","original_sigmoid_denominator",
                 "original_predicted_probability","original_cached_predicted_probability",
                 "original_next_native_state")
          reports={}
          for name in ("FaramaMiniGridDoorKey8","DeepMindPycolabApprehend"):
              a,b,c,d=[originals[os,n]["real_original_source_reports"][name] for os,n in
                       (("ubuntu-24.04",1),("ubuntu-24.04",2),
                        ("windows-2025",1),("windows-2025",2))]
              for other in (b,c,d):
                  for field in ("original_source_git_sha","source_train_public_original_event_sha256",
                                "source_public_input_and_consequence_tensors",
                                "native_initial_45_snapshot_sha256","original_training_action_count"):
                      assert a[field]==other[field],("SOURCE_OR_INITIAL_DRIFT",name,field)
              aa,bb,cc,dd=[z["first_three_original_training_updates"] for z in (a,b,c,d)]
              repeat_equal={"linux":aa==bb,"windows":cc==dd}
              first=None
              for idx,(left,right) in enumerate(zip(aa,cc),1):
                  if left["original_45_pre_update_weight_sha256"]!=right["original_45_pre_update_weight_sha256"]:
                      first={"classification":"PREVIOUS_NATIVE_WEIGHT_DRIFT","training_update":idx}
                      break
                  la,ra=left["chronological_native_forward_stages"],right["chronological_native_forward_stages"]
                  assert len(la)==len(ra),("ORIGINAL_EPISODE_LENGTH_DRIFT",name,idx)
                  for t,(x,y) in enumerate(zip(la,ra)):
                      diffs=[]
                      for field in order:
                          lhs,rhs=x[field],y[field]
                          if lhs["sha256"]!=rhs["sha256"]:
                              at=next(i for i,(u,v) in enumerate(zip(lhs["hex"],rhs["hex"])) if u!=v)
                              diffs.append({"stage":field,"cell":at,
                                            "linux_hex":lhs["hex"][at],
                                            "windows_hex":rhs["hex"][at]})
                      if diffs:
                          first={"classification":"ORIGINAL_FORWARD_ARITHMETIC_DIFF",
                                 "training_update":idx,"source_time":t,
                                 "first_stage":diffs[0],"all_stages_at_first_divergent_time":diffs,
                                 "read_only_scalar_reference_not_used_for_training":True}
                          break
                  if first:break
              if first and first["classification"]=="ORIGINAL_FORWARD_ARITHMETIC_DIFF":
                  fld=first["first_stage"]["stage"]
                  if fld in ("original_numpy_exp",):
                      diagnosis="EXP_DIFFERENCE_WITH_IDENTICAL_PRIOR_OPERATIONS"
                  elif fld in ("original_sigmoid_denominator","original_predicted_probability",
                               "original_cached_predicted_probability"):
                      diagnosis="SIGMOID_AFTER_EXP_DIFFERENCE"
                  elif fld in order[:11]:
                      diagnosis="PREACTIVATION_OR_UPSTREAM_DIFFERENCE"
                  else:
                      diagnosis="LATER_OR_STATE_DIFFERENCE"
              else:
                  diagnosis="INCONCLUSIVE_NO_ORIGINAL_FORWARD_SPLIT"
              reports[name]={"same_OS_repeats_exact":repeat_equal,
                             "first_original_cross_OS_difference":first,
                             "bounded_localization":diagnosis,
                             "actual_source_training_only":True,
                             "scientific_admission":"NO_GO"}
          print("MR34I4_FIRST_NATIVE_FORWARD_OPERATION="+json.dumps(reports,sort_keys=True))
          print("MR34I4_SCIENTIFIC_FIRST_USE=ZERO")
          assert all(x["same_OS_repeats_exact"]["linux"] for x in reports.values()),"LINUX_SAME_OS_NUMERIC_DRIFT"
          PY
