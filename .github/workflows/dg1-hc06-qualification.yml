name: DG1-HC06 Independent Bayesian Challenge
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-hc06-20261113/**'
      - '.github/workflows/dg1-hc06-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  challenge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile frozen independent baseline and physical evaluator
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-hc06-20261113/bayesian_control.py
          python -m py_compile research/contrib/chatgpt/dg1-hc06-20261113/eval_dev.py
      - name: HC06 source-only qualification tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-hc06-20261113 -p "test_*.py" -v
      - name: Prospective disjoint-source Bayesian challenge, immutable classifier
        run: python research/contrib/chatgpt/dg1-hc06-20261113/eval_dev.py > hc06-result.json
      - name: Report all frozen verdicts, including outside grammar negatives
        run: python -c "import json; r=json.load(open('hc06-result.json')); print(r['classification'],'iid',r['iid_primary_pass'],'rewired',r['rewired_ood_pass'],'return_A',r['return_A_cold_retention_pass'],'majority_confident_wrong',r['majority_confident_wrong']); print(r['cohort_metrics'])"
      - name: Preserve complete physical ledgers and whole-process timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc06-dev-evidence-${{ matrix.os }}
          path: hc06-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Mandatory inherited source repository regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: G29 exact pinned atlas verification
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Ensure no source files modified
        run: git diff --exit-code
      - name: Generate candidate G29 atlas on exact source SHA
        if: always() && matrix.os == 'ubuntu-latest'
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
      - name: Emit bounded atlas chunks for final generated-only commit
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for ext in ('json', 'html', 'ice'):
              raw = Path('.ice/code-atlas.' + ext).read_bytes()
              print('DG1_HC06_ATLAS_START:' + ext + ':' + str(len(raw)))
              b64 = base64.b64encode(raw).decode('ascii')
              for i in range(0,len(b64),4096):
                  print('DG1_HC06_ATLAS_CHUNK:' + ext + ':' + b64[i:i+4096])
              print('DG1_HC06_ATLAS_END:' + ext)
          PY
      - name: Archive exact-source atlas
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc06-g29-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: warn
          retention-days: 7
