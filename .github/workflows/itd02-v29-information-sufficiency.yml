name: ITD-02 V29 public information sufficiency
on:
  push:
    branches:
      - research/itd02-v29-return-information-sufficiency-20261028
permissions:
  contents: read
jobs:
  v29-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prereg and native source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e226cf23ef7c130f7edb72822052e88d52059766 "$GITHUB_SHA"
          git merge-base --is-ancestor 90b8156340a8d3b7a021afcbefbefe0c0c778e30 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
      - name: Run V29 evidence-only ambiguity analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v29"
          if ! PYTHONPATH=. python -B research/itd02_v29_return_information_sufficiency_audit.py > "$RUNNER_TEMP/v29/summary.json" 2> "$RUNNER_TEMP/v29/error.log"; then
            cat "$RUNNER_TEMP/v29/error.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v29/summary.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="ygg.itd02.v29.information_sufficiency.source_only.v1"
          assert not d["scientific_first_use"] and not d["original_world_training"]
          assert d["true_t2_return_latency_preserved"]==5
          assert d["false_t1_source_events_preserved"]==4
          assert d["seven_predeclared_streams"]==7
          assert len(d["canonical_windows_sha256"])==64
          print("V29_SOURCE_ONLY_INFORMATION_AUDIT_PASS_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v29/summary.json"
      - name: Inherited original-native and return safety
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v29-information-${{ matrix.os }}
          path: ${{ runner.temp }}/v29/*
          retention-days: 7
          if-no-files-found: warn
