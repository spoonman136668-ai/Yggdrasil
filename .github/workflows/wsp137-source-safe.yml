name: WSP137 source-safe active causal structure selection
on:
  push:
    branches: [research/wsp137-active-structure-selection-20261117]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prereg and pre-source amendment; protected first-use DENIED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e0bebfc7cc0b243363f1d0729f0432b06f344103 HEAD
          git merge-base --is-ancestor dbe230554734eae83a20df67ae53e29fc093e06e HEAD
          git diff --exit-code dbe230554734eae83a20df67ae53e29fc093e06e HEAD -- research/contrib/chatgpt/WSP-137/prereg.json research/contrib/chatgpt/WSP-137/pre_source_paired_test_amendment.json
          git merge-base --is-ancestor 337fe0ba190a271df2ee538078dd91932bd36ee6 HEAD
          test ! -e research/contrib/chatgpt/WSP-137/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-137/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Authentic source-safe active-vs-fixed study with equal-information controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-137 -p 'test_*.py' -v
      - name: Exact checkout unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp137): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp137-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exact source-pinned G29 derived files only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor dbe230554734eae83a20df67ae53e29fc093e06e HEAD
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp137): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp137-active-structure-selection-20261117

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp137): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source G29 and frozen prereg check exact final sha
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor dbe230554734eae83a20df67ae53e29fc093e06e HEAD
          git diff --exit-code dbe230554734eae83a20df67ae53e29fc093e06e HEAD -- research/contrib/chatgpt/WSP-137/prereg.json research/contrib/chatgpt/WSP-137/pre_source_paired_test_amendment.json
          test ! -e research/contrib/chatgpt/WSP-137/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Mandatory WSP135-137 plus complete original root exact-source regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
