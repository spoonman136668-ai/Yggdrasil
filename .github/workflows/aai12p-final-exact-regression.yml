name: AAI-12P mandatory final exact-source native and diverse causal benchmark regression
on:
  push:
    branches: [research/aai12p-final-regression-once-20261114]
    paths: [.github/workflows/aai12p-final-exact-regression.yml]
permissions:
  contents: read
concurrency:
  group: aai12p-original-main-final-once-20261114
  cancel-in-progress: false
jobs:
  immutable-final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-12P immutable independent 64-test native final qualification one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Original-main based source-exact independent no-write qualification harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai12p-final-exact-regression.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI12P_INDEPENDENT_FINAL_READONLY_HARNESS_FROM_MAIN_PASS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: abd374e7dc433981df991e103d8ebdff0b5eb093
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact PR candidate, parent main, immutable prereg BEFORE implementation and G29 atlas
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'abd374e7dc433981df991e103d8ebdff0b5eb093'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai12p-diverse-causal-worlds-20261114 | cut -f1)" = 'abd374e7dc433981df991e103d8ebdff0b5eb093'
          test "$(git rev-parse c3a866409bdcf7435c1154c60871801d2b1a8a67^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/prereg.json)" = '74f57c2175e7ae87926e4f7fd985d741f719c0a9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/prereg.json)" = "$(git rev-parse c3a866409bdcf7435c1154c60871801d2b1a8a67:research/contrib/chatgpt/AAI-12P/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/world.py)" = '488c54aee283434599f106b22b6008cd596bac37'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/controls.py)" = '042b36f66fa14e0c7c7f39fe709ed58df9776eed'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/admit.py)" = '1aedb903e6c359c962b3d36009d78ce2d2f235b2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/test_benchmark.py)" = 'e3310597abf3cae08bd860e2a497be920baf3202'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI12P_FINAL_PREREG_SOURCE_G29_AND_MAIN_EXACT_READBACK_PASS
      - name: Mandatory full original native Yggdrasil regression plus new negative/provenance/causal tests
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-12P -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-12P/admit.py --primary >/dev/null 2>&1; then
            echo AAI12P_UNAUTHORIZED_SCIENTIFIC_FIRST_USE >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo AAI12P_MANDATORY_IMMUTABLE_FINAL_64_TESTS_PER_OS_PASS_NO_SCIENCE
