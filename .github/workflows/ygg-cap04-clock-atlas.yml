name: YGG CAP04 clock-controls source-exact G29 atlas reanchor
on:
  push:
    branches:
      - research/ygg-cap04-clock-only-controls-20261119
    paths:
      - '.github/workflows/ygg-cap04-clock-atlas.yml'
permissions:
  contents: read
jobs:
  reanchor_source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Preserve line ending custody
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate only source-pinned G29 locator artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 3128a6a1fbb526bd5b35380be2b35040263a70ca
          test "$(git diff --name-only 3128a6a1fbb526bd5b35380be2b35040263a70ca HEAD)" = ".github/workflows/ygg-cap04-clock-atlas.yml"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = b78122a274ca63b38bafdd52f121d7ac0869a81b
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = cd3065a30edf5c08ec92eccc9eec1776d4570da4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/clock_controls.py)" = 9f23fdd3ace32695b3f753bb8b37e869641cdd48
          test "$(git rev-parse HEAD:tests/test_cap04_clock_only_controls.py)" = 1c3bebccba505941de55a5419eb28d099a8626bc
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          test -z "$(git status --porcelain)"
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' '|')" = ".ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json|"
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(cap04): pin G29 atlas to clock-only controls source $SOURCE"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/ygg-cap04-clock-only-controls-20261119"
          echo "CAP04_HISTORY_SOURCE=$SOURCE"
          echo "CAP04_HISTORY_ATLAS_CANDIDATE=$(git rev-parse HEAD)"
          echo "CAP04_HISTORY_TREE=$(git rev-parse HEAD^{tree})"
