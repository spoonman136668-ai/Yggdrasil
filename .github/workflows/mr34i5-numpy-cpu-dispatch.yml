name: MR34I5 Frozen Nonlearning NumPy CPU Dispatch Qualification
on:
  push:
    branches:
      - research/mr34i5-numpy-cpu-dispatch-custody-20261022
permissions:
  contents: read
concurrency:
  group: mr34i5-numeric-source-20261022
  cancel-in-progress: false
jobs:
  source-native-nonlearning-dispatch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve source byte identity on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout isolated MR34I5 audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact original Yggdrasil S4C1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: original-s4c1
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact original Farama source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact original Pycolab source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Install original Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original exact numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Install Pycolab Windows binding
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Run frozen original-source input NumPy CPU dispatch diagnostic
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          BLIS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          set -o pipefail
          python -B audit/research/mr34i5/dispatch_probe.py audit original-s4c1 external/minigrid external/pycolab | tee mr34i5-source-dispatch.log
          grep -q '^MR34I5_DISPATCH_SUMMARY=' mr34i5-source-dispatch.log
      - name: Verify original and audit source remained clean
        shell: bash
        run: |
          for path in audit original-s4c1 external/minigrid external/pycolab; do
            git -C "$path" diff --exit-code
            test -z "$(git -C "$path" status --porcelain)"
          done
