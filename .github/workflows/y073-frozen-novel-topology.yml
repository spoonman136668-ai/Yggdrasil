name: Yggdrasil Y073 frozen unseen shock-topology science
on:
  push:
    branches: [research/y073-novel-cross-pair-topology-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original scientific source and frozen first-use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6a2bafd89b4500ac700d04415f41e2552f87014c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y072-cross-pairs/execute.py)" = 02f7f634e5eeff5aa484fe0dea5a8caf750e11cb
          test "$(git hash-object research/contrib/chatgpt/20261014-y073-novel-topology/prereg.json)" = 376c94f2f4cd8350b1b5c2c35e377e5fcd70bf77
          test "$(git hash-object research/contrib/chatgpt/20261014-y073-novel-topology/execute.py)" = 99c25979ab2b741271570dda210821b93bf03a79
          python3 -m json.tool research/contrib/chatgpt/20261014-y073-novel-topology/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261014-y073-novel-topology/execute.py
      - name: Execute first-use frozen new cross-gap shock-topology study
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-y073-novel-topology/execute.py > /tmp/Y073-original.json
          python3 -m json.tool /tmp/Y073-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y073-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(9104,9120))
          assert a["pairs"]==[[4,11],[5,12]]
          assert len(a["comparisons"])==2
          assert len(a["original_y070_unchanged_trial_evidence"]["complete_heldout_records"])==768
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          assert a["classification"] in ("TOPOLOGY_TRANSFER","PARTIAL_TOPOLOGY_TRANSFER","NO_POSTDETECTION_OPPORTUNITY","NO_GAIN")
          print("CLASSIFICATION",a["classification"])
          print("PAIRS",a["comparisons"])
          print("STEADY_ZERO",a["original_y070_unchanged_trial_evidence"]["steady_zero_mismatches"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y073-original-new-shock-topologies
          path: /tmp/Y073-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
