name: LR-92AR exact-candidate full original/native regression (one shot)
'on':
  push:
    branches: [research/lr92ar-exact-candidate-full-regression-20261119]
    paths: ['.github/workflows/lr92ar-check-pinned-candidate.yml']
permissions:
  contents: read
jobs:
  pinned_regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable automatic checkout line-ending changes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2f8763bed46450115b1d9a384c82219c9cb95980
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin exact original research SHA and source-first immutable protocol
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2f8763bed46450115b1d9a384c82219c9cb95980"
          root='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior'
          test "$(git hash-object "$root/prereg.json.txt")" = 9aa65a206e805f4975741836cb9a5e02158c597e
          test "$(git rev-parse '2e0b0ecb0f4c9d7b3d6431480a81587410d7b3e6':"$root/prereg.json.txt")" = 9aa65a206e805f4975741836cb9a5e02158c597e
          test "$(git hash-object "$root/phase_blind_posterior.py.txt")" = b53eba44cc5cdcdacfc65e2a9af282a7972ea497
          test "$(git hash-object "$root/test_phase_blind_posterior.py.txt")" = 793532b79f20f2b9579f8ce99b20ac3842651c8f
          echo LR92AR_EXACT_CANDIDATE_SOURCE_CUSTODY_PASS
      - name: Mandatory full original native regression on exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo LR92AR_EXACT_CANDIDATE_NATIVE_REGRESSION_PASS
      - name: Reconfirm scoped research structural tests on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior'
          dir="$RUNNER_TEMP/lr92ar-clean"
          mkdir -p "$dir"
          cp "$root/prereg.json.txt" "$dir/prereg.json.txt"
          cp "$root/phase_blind_posterior.py.txt" "$dir/phase_blind_posterior.py"
          cp "$root/test_phase_blind_posterior.py.txt" "$dir/test_phase_blind_posterior.py"
          (cd "$dir" && python -B -m unittest -v test_phase_blind_posterior)
          echo LR92AR_EXACT_CANDIDATE_12_STRUCTURAL_TESTS_PASS
      - name: Require untouched exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2f8763bed46450115b1d9a384c82219c9cb95980"
          test -z "$(git status --porcelain)"
          echo LR92AR_FULL_FINAL_REGRESSION_AND_CLEAN_SOURCE_PASS
