name: NCI-04 S2 Original Native Learned Graph Necessity
on:
  push:
    branches:
      - research/nci04-s2-learned-topology-necessity-20261021
  pull_request:
    branches:
      - research/nci04-s1-local-predictive-messaging-20261021
permissions:
  contents: read
concurrency:
  group: nci04-s2-original-native-graph-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-original-learned-neighbor-causality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve original Git source bytes before Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact S2 source and frozen parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Independent original Farama source exact Git revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python original source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original Farama source independent Git byte and license checks
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Existing pinned original source runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Train original S1 once then run native same-weight edge rewiring ablations
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.nci04_s2.original_native_graph ../external/minigrid | tee ../nci04-s2-real-native-receipt.log
          grep -q '^NCI04_S2_NATIVE_LEARNED_TOPOLOGY_NECESSITY=' ../nci04-s2-real-native-receipt.log
      - name: No source mutation or unexpected generated artifacts
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
