name: Yggdrasil F93B retired F92 legal action rescue audit
on:
  push:
    branches:
      - research/y-f93b-f92-exposed-legal-rescue-audit-20261016-r1
permissions:
  contents: read
jobs:
  read-only-retired-cohort-rescue:
    if: "${{ github.event.head_commit.message == 'ci(y-f93b): audit frozen F92 legal rescue potential on consumed cases' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin original F92 and F93A science identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor df9bf8826d66c8bc6ca62321a03687d20334faf3 HEAD
          test "$(git hash-object research/foundational/20261016-y-f93b/prereg.json)" = 4da2180b3ec78c1659e8a9b6045c15490472cbac
          test "$(git hash-object research/foundational/20261016-y-f93b/counterfactual_rescue.py)" = e0b7789aaf6d52fcc25ce69bc0415168a14e1b05
          test "$(git hash-object research/foundational/20261016-y-f93a/forensic_probabilities.py)" = 86ebbbbf56791a2a10e0e311d25d0a4cb4e69289
          test "$(git hash-object research/foundational/20261016-y-f92/dense_path_credit.py)" = 7fdaf5d24866c347275c2ffa3aec7dfeaed6ac5b
          test "$(git hash-object research/foundational/20261016-y-f92/frozen-policy.json)" = 6a94f730baefe008a21f7286416f3163835ed93e
      - name: Independently replay native one-action rescues against consumed F92 six-step cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f93b-retired-causal-rescue"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f93b-retired-causal-rescue/exact-head.txt"
          python3 -B research/foundational/20261016-y-f93b/counterfactual_rescue.py --already-consumed-F92-only > "$RUNNER_TEMP/y-f93b-retired-causal-rescue/forensics.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f93b-retired-causal-rescue/forensics.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f93b-retired-causal-rescue/forensics.json")));print("F93B_RESCUE_POTENTIAL",d["totals"]);print("F93B_SCORE_GATE_ATTRIBUTION",d["rescue_gate_counts"]);print("F93B_BY_ARRIVAL",d["by_arrival"]);assert d["total_cases"]==12 and d["exact_72_prefix_independent_audit"] and d["frozen_F92_has_zero_interventions"];assert d["no_model_fitted"] and d["no_new_source_used"] and d["consumed_cases_NEVER_reusable_as_independent_holdout"]'
          sha256sum "$RUNNER_TEMP/y-f93b-retired-causal-rescue/forensics.json" > "$RUNNER_TEMP/y-f93b-retired-causal-rescue/sha256.txt"
          echo 'F93B_NONCOMPETITIVE_NO_NEW_SOURCE_NO_F3=TRUE'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f93b-retired-f92-native-rescue-audit
          path: ${{ runner.temp }}/y-f93b-retired-causal-rescue/
          retention-days: 90
          if-no-files-found: warn
