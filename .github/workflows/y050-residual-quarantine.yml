name: Yggdrasil Y050 frozen observed residual-gated quarantine
on:
  push:
    branches: [research/y050-residual-triggered-cache-quarantine-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact predecessor and frozen science identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a148fb90b4527ac5b0d60dd6e9aca4f32adf8833 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y049-reset-timing/execute.py)" = 402dde9f1ef94458ba36d9f236b88784e023a9f9
          test "$(git hash-object research/contrib/chatgpt/20261013-y050-residual-quarantine/prereg.json)" = 4feead4371c7b7e01db9bf3faaa0f8f82b7f4ff0
          test "$(git hash-object research/contrib/chatgpt/20261013-y050-residual-quarantine/execute.py)" = 87b686362fabddd8f0454bc56f38bdd3d89a7563
          python3 -m json.tool research/contrib/chatgpt/20261013-y050-residual-quarantine/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y050-residual-quarantine/execute.py
      - name: First-use frozen heldout experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y050-residual-quarantine/execute.py >/tmp/Y050-original.json
          python3 -m json.tool /tmp/Y050-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y050-original.json"))
          assert a["development_seeds"]==list(range(1728,1736))
          assert a["sealed_heldout_seeds"]==list(range(1736,1752))
          assert len(a["by_family_seed_policy"])==4*4*24*3
          print("CLASSIFICATION",a["classification"])
          print("MISMATCHES",a["paired_mismatch_summary"])
          print("LANDMARK_READINGS",a["resource_landmark_readings_per_8_episodes"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y050-original-observed-residual-quarantine
          path: /tmp/Y050-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One required full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
