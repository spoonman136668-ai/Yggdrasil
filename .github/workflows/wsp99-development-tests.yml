name: WSP99 DEV fixtures only (no original-world first use)
on:
  push:
    branches:
      - research/wsp99-delayed-causal-task-20261114
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical control dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: exact source and untouched original-world guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor babec7b7a352ab5f322217dac200dbf5591edee6 HEAD
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
      - name: Fixture-only tests; no original science
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p "test_*.py" -v
      - name: clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical control dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: exact source and untouched original-world guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor babec7b7a352ab5f322217dac200dbf5591edee6 HEAD
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
      - name: Fixture-only tests; no original science
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p "test_*.py" -v
      - name: clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
