name: WSP99 DEV fixtures only (no original-world first use)
on:
  push:
    branches:
      - research/wsp99-delayed-causal-task-20261114
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical control dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: exact source and untouched original-world guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor babec7b7a352ab5f322217dac200dbf5591edee6 HEAD
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
      - name: Fixture-only tests; no original science
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p "test_*.py" -v
      - name: clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical control dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: exact source and untouched original-world guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor babec7b7a352ab5f322217dac200dbf5591edee6 HEAD
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
      - name: Fixture-only tests; no original science
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p "test_*.py" -v
      - name: clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  diagnose-inherited-wsp87:
    if: "github.event.head_commit.message == 'ci(wsp99): diagnose inherited WSP87 Windows' && github.run_attempt == 1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only inherited WSP87 fixture checks and CPU clock resolution
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, sys, time
          sys.path.insert(0, 'research/contrib/chatgpt/WSP-87')
          from experiment import FIXTURE_SEEDS, single_world, classify
          rows = [single_world(seed) for seed in FIXTURE_SEEDS]
          result = classify(rows, dev=False)
          print('WSP87_INHERITED_READONLY_DIAGNOSTIC=' + json.dumps({
              'classification': result['classification'],
              'checks': result['checks'],
              'fixture_cpu_ns': [r['whole_portfolio_process_cpu_ns'] for r in rows],
              'novel_true_two_hop_correct': result['novel_true_two_hop_correct'],
              'stageA_correct': result['stageA_correct'],
              'stageB_correct': result['stageB_correct'],
              'clock': {'resolution': time.get_clock_info('process_time').resolution,
                        'monotonic': time.get_clock_info('process_time').monotonic},
          }, sort_keys=True), flush=True)
          PY
          test -z "$(git status --porcelain)"
