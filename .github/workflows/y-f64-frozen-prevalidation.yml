name: Yggdrasil F64 frozen bridge prevalidation
on:
  push:
    branches:
      - research/y-f64-frozen-prevalidation-20261016-r1
permissions:
  contents: read
jobs:
  independent-public-audit:
    if: "${{ github.event.head_commit.message == 'ci(y-f64): audit frozen causal model and bridge ablation before heldout' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable model and prereg identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 700e5b32b5f5ee328a7342c4e160ee7955c04ae8 HEAD
          test "$(git hash-object research/foundational/20261016-y-f64/prereg.json)" = aa12b1785b92eec5eb5096d6ef0cd600e97904ad
          test "$(git hash-object research/foundational/20261016-y-f64/bridge_features.py)" = 75d952228c53cf9d41d1cb557fee27e421a96972
          test "$(git hash-object research/foundational/20261016-y-f64/frozen_model_receipt.json)" = 122b5cfd0463ab0f5d95a10cd123e934e91d5210
      - name: Independent frozen synthetic causal replay and ablation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f64-frozen-prevalidation/"
          python3 -B research/foundational/20261016-y-f64/prevalidate_frozen.py > "$RUNNER_TEMP/f64-frozen-prevalidation/replay.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f64-frozen-prevalidation/replay.json" >/dev/null
          python3 -B -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f64-frozen-prevalidation/replay.json"))); print("F64_FROZEN_SYNTHETIC",d["totals"],"BRIDGE_ABLATION_POSITIVE",d["bridge_feature_ablation_positive_on_synthetic"],"DIRECT_BRIDGE_COEFFICIENT",d["direct_public_bridge_coefficient"])'
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f64-frozen-prevalidation/exact-head.txt"
          sha256sum "$RUNNER_TEMP/f64-frozen-prevalidation/replay.json" > "$RUNNER_TEMP/f64-frozen-prevalidation/hashes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f64-frozen-synthetic-causal-prevalidation
          path: ${{ runner.temp }}/f64-frozen-prevalidation/
          retention-days: 90
          if-no-files-found: warn
