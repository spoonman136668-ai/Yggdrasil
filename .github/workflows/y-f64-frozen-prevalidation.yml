name: Yggdrasil F64 frozen bridge model prevalidation
on:
  push:
    branches: [research/y-f64-frozen-model-prevalidation-20261016-r1]
permissions:
  contents: read
jobs:
  frozen-synthetic-replay:
    if: "${{ github.event.head_commit.message == 'ci(y-f64): run frozen synthetic causal model and ablation qualification' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze source, receipt and historical controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 700e5b32b5f5ee328a7342c4e160ee7955c04ae8 HEAD
          test "$(git hash-object research/foundational/20261016-y-f64/frozen_model_receipt.json)" = bc4672326454bceeabc4374afa2b55fbcdae3e65
          test "$(git hash-object research/foundational/20261016-y-f64/prevalidate_frozen.py)" = da31d94d03fb5273b55b66c316a986330956a2a2
          test "$(git hash-object research/foundational/20261016-y-f64/bridge_features.py)" = 75d952228c53cf9d41d1cb557fee27e421a96972
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
      - name: Independently audit every synthetic public memory prefix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f64-prevalidation/"
          python3 -B research/foundational/20261016-y-f64/prevalidate_frozen.py > "$RUNNER_TEMP/f64-prevalidation/independent_replay.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f64-prevalidation/independent_replay.json" >/dev/null
          python3 -B -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f64-prevalidation/independent_replay.json"))); print("F64_FROZEN_SYNTHETIC_SCORES",d["scores"]); print("F64_BRIDGE_ABLATION",d["positive_bridge_ablation_on_synthetic"]); assert d["fit_validation_consumed"] is False'
          sha256sum "$RUNNER_TEMP/f64-prevalidation/independent_replay.json" > "$RUNNER_TEMP/f64-prevalidation/result_sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f64-prevalidation/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f64-frozen-synthetic-prevalidation
          path: ${{ runner.temp }}/f64-prevalidation/
          retention-days: 90
          if-no-files-found: warn
