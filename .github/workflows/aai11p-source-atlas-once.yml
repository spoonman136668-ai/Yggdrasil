name: AAI-11P frozen stronger causal-world + fully trained controls admission
on:
  push:
    branches: [research/aai11p-six-bit-causal-world-20261114]
    paths: [.github/workflows/aai11p-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11p-mechanical-source-only-20261114
  cancel-in-progress: false
jobs:
  exact-source:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11P frozen source-only hard-causal controls and atlas qualification' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg frozen prior to source and code readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '90a6ca07d8b8639c4425fc693e55e8aa50837c7e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11p-source-atlas-once.yml'
          test "$(git rev-parse c74de47446bcd14923c0b1d95db8119d96ed6b81^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/prereg.json)" = 'd86b0f88d3d66e89ad14d0096751241fcc52a1d4'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/prereg.json)" = "$(git rev-parse c74de47446bcd14923c0b1d95db8119d96ed6b81:research/contrib/chatgpt/AAI-11P/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/admission.py)" = '0f921dfeebda9ad3a0e217747e4b0365ba9c655e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/test_world.py)" = 'a4a580fa606e3ae5f3ee1540ebc3d855826be2bf'
          test -z "$(git status --porcelain)"
          echo AAI11P_PREREG_FIRST_FROZEN_SOURCE_BLOBS_PASS
      - name: Public causal mechanics, conventional training, cold forks, privacy and disarm
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11P -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11P/admission.py --primary >/dev/null 2>&1; then
            echo AAI11P_SCIENCE_FIRST_USE_FENCE_FAILED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11P_MECHANICAL_HARDER_WORLD_TESTS_PASS
      - name: Frozen admission against ALL eight fully trained real conventional controls
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11P/admission.py --fixture-admission
          test -z "$(git status --porcelain)"
          echo AAI11P_FULLY_TRAINED_MATCHED_HEADROOM_DIAGNOSTIC_RECORDED
  atlas:
    needs: exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate ONLY three standard G29 atlas artifacts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '90a6ca07d8b8639c4425fc693e55e8aa50837c7e'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11P generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11p-six-bit-causal-world-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11p-six-bit-causal-world-20261114
          echo AAI11P_G29_PINNED_ATLAS_GENERATED_ONLY_PASS
