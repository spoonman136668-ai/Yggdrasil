name: QTR-01 F47 hypothesis-tournament causal intervention DEV
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F47 focused coverage-constrained causal tournament DEV'
    name: F47 intervention DEV (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Normalize Windows Git bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen F47 prereg and original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '205f74b67e244f401a7f2508e4c42364f7b510e2'
          test "$(git log -1 --format=%s)" = 'ci(qtr): F47 focused coverage-constrained causal tournament DEV'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f47-hypothesis-tournament.yml'
          git merge-base --is-ancestor 642204c772df5b55839367669dadb198ffbeb018 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_prereg.json)" = '916c385e104809b8029940b43fc25cc4892033af'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py)" = 'a10c28d4534d22ce43d3c003835b29b757ff0d84'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f46_active_intervention_dev.py)" = '56da60c2fca7e7a62349af5d521a6ccacab6b302'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f45_context_causal_induction_dev.py)" = '0167e3d3118dd0e949ab6c94a57c34647b8879f9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f47_hypothesis_tournament_dev.py)" = '146c3c59c9fb6b9945d743ca3913fbf4383566bc'
          test "$(git rev-parse HEAD:yggdrasil/public_causal_cells.py)" = '5c9a9904e31688bebc2e53723569e1fb988a981f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f42_exact_index_dev.py)" = '997d2d13c4725d5b33d993d252aac7108304b529'
          echo F47_SOURCE_AND_PRECODE_PROTOCOL_PIN=PASS
      - name: F47 focused learning, negative, cold and scope tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f47_*.py' -v
      - name: Frozen maximum-first three-seed world comparison
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py | tee "$RUNNER_TEMP/f47-raw.log"
          F47_LOG="$RUNNER_TEMP/f47-raw.log" F47_JSON="$RUNNER_TEMP/f47-stable.json" python - <<'PY'
          import json,os,pathlib,hashlib
          lines=pathlib.Path(os.environ["F47_LOG"]).read_text(encoding="utf-8").splitlines()
          found=[line.split("=",1)[1] for line in lines if line.startswith("F47_CAUSAL_HYPOTHESIS_TOURNAMENT_DEV_RESULT=")]
          assert len(found)==1
          d=json.loads(found[0])
          assert d["classification"] in ("DEV_TOURNAMENT_ACTIVE_POLICY_GO","DEV_TOURNAMENT_ACTIVE_POLICY_NO_GO")
          assert len(d["world_results"])==27
          assert d["scales_high_first"]==[64,32,16] and d["seeds"]==[127,131,137]
          assert d["budgets_high_first"]==[24,12,6]
          assert d["scientific_pass"] is False
          assert d["protected_scientific_first_use"] is False
          assert d["accepted_native_source_changed"] is False
          assert d["hidden_world_graph_provided_to_learner"] is False
          assert d["all_action_budgets_equal"] is True
          assert d["all_cold_and_interference_controls_pass"] is True
          assert d["all_native_min_exploration_and_row_caps"] is True
          for x in d["world_results"]:
              assert len(x["policies"])==4
              for arm in x["policies"].values():
                  assert arm["same_stream_independent_MLE_equal"] is True
                  assert arm["cold_restore_exact"] is True
                  assert arm["real_intervention_held_unrelated_row"] is True
          for row in d["elapsed_DEV_only"]:
              row.pop("dev_elapsed_seconds",None)
          raw=(json.dumps(d,sort_keys=True,separators=(",",":"))+"\n").encode("utf-8")
          pathlib.Path(os.environ["F47_JSON"]).write_bytes(raw)
          print("F47_DEV_CLASSIFICATION="+d["classification"])
          print("F47_MACRO_DIRECT_F1="+str(d["native_tournament_direct_F1_b12"]))
          print("F47_CROSS_OS_RECORD_SHA256="+hashlib.sha256(raw).hexdigest())
          print("F47_NO_PROTECTED_FIRST_USE=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtr01-f47-dev-${{ matrix.os }}
          path: ${{ runner.temp }}/f47-stable.json
          retention-days: 3
          if-no-files-found: error
      - name: Verify no source mutation
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F47_SOURCE_FREE_CLEAN=PASS
  compare:
    needs: focused
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F47 focused coverage-constrained causal tournament DEV'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qtr01-f47-dev-*
          path: ${{ runner.temp }}/f47-compare
          merge-multiple: false
      - name: Cross-platform exact DEV science/null receipt comparison
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/f47-compare/qtr01-f47-dev-ubuntu-24.04/f47-stable.json"
          B="$RUNNER_TEMP/f47-compare/qtr01-f47-dev-windows-2022/f47-stable.json"
          test -s "$A" && test -s "$B"
          cmp "$A" "$B"
          sha256sum "$A" "$B"
          echo F47_CROSS_OS_STABLE_RESULT_PARITY=PASS
  atlas-once:
    needs: compare
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F47 focused coverage-constrained causal tournament DEV'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin prereg and candidate exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F47 focused coverage-constrained causal tournament DEV'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_prereg.json)" = '916c385e104809b8029940b43fc25cc4892033af'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py)" = 'a10c28d4534d22ce43d3c003835b29b757ff0d84'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f46_active_intervention_dev.py)" = '56da60c2fca7e7a62349af5d521a6ccacab6b302'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f45_context_causal_induction_dev.py)" = '0167e3d3118dd0e949ab6c94a57c34647b8879f9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f47_hypothesis_tournament_dev.py)" = '146c3c59c9fb6b9945d743ca3913fbf4383566bc'
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = 'cef1378fd3c47ebc74675bd9dde19a183775ceeb'
          test -z "$(git status --porcelain)"
      - name: Regenerate three exact ICE code atlas companion files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          EXPECTED="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          ACTUAL="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F47 source-exact ICE code atlas'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo F47_DERIVED_ICE_EXACT=PASS
  full-final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F47 final full source-exact regression'
    name: F47 full final regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows Git bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify F47 frozen prereg, source and derived ICE
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F47 final full source-exact regression'
          test -z "$(git diff --name-only HEAD^ HEAD)"
          git merge-base --is-ancestor 642204c772df5b55839367669dadb198ffbeb018 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_prereg.json)" = '916c385e104809b8029940b43fc25cc4892033af'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py)" = 'a10c28d4534d22ce43d3c003835b29b757ff0d84'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f46_active_intervention_dev.py)" = '56da60c2fca7e7a62349af5d521a6ccacab6b302'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f45_context_causal_induction_dev.py)" = '0167e3d3118dd0e949ab6c94a57c34647b8879f9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f47_hypothesis_tournament_dev.py)" = '146c3c59c9fb6b9945d743ca3913fbf4383566bc'
          test "$(git rev-parse HEAD:yggdrasil/public_causal_cells.py)" = '5c9a9904e31688bebc2e53723569e1fb988a981f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f32_source_snapshot.json)" = '453dad0363689cff785c26db5441555c6841f95d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f35_source_depth2_snapshot.json)" = '3fc50ddf7453958c458db697eacf2e27d3d52f57'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f39_fit_breadth_source_snapshot.json)" = 'f0972e2d2987a0ee3205a7e3b7e3c0c2b60c6108'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          echo F47_FINAL_SOURCE_AND_ICE=PASS
      - name: Install inherited regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: Entire original repository regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Entire QTR contributor regression including F47
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Verify final source worktree clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F47_FULL_FINAL_SOURCE_EXACT_PASS
