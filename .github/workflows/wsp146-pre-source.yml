name: WSP146 source-free shallow hypothesis challenge
on:
  push:
    branches: [research/wsp146-shallow-hypothesis-challenge-20261117]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact parent and sole-file pre-source freeze, no scored source use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 0c85eb2095b23c53f420babaa020451798d66323^)" = "e1d1129fda0dd78487f4d1299048d4588bb59d9c"
          test "$(git diff-tree --no-commit-id --name-only -r 0c85eb2095b23c53f420babaa020451798d66323)" = "research/contrib/chatgpt/WSP-146/prereg.json"
          git merge-base --is-ancestor 0c85eb2095b23c53f420babaa020451798d66323 HEAD
          git diff --exit-code 0c85eb2095b23c53f420babaa020451798d66323 HEAD -- research/contrib/chatgpt/WSP-146/prereg.json
          git diff --exit-code e1d1129fda0dd78487f4d1299048d4588bb59d9c HEAD -- research/contrib/chatgpt/WSP-145 research/contrib/chatgpt/WSP-144 research/contrib/chatgpt/WSP-143 research/contrib/chatgpt/WSP-142 research/contrib/chatgpt/WSP-135
          test ! -e research/contrib/chatgpt/WSP-146/source.py
          test ! -e research/contrib/chatgpt/WSP-146/experiment.py
          test ! -e research/contrib/chatgpt/WSP-146/result.json
          test -z "$(git status --porcelain)"
      - name: No-source confidence-unit tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-146 -p 'test_*.py' -v
      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
