name: Yggdrasil Y043 frozen moving motif identity coordinate
on:
  push:
    branches: [research/y043-key-identity-frame-equivariance-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable prereg and exact source lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b368758c9f772046f2e67eed628dc3d5e4c6ae4d HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-moving-frame/execute.py)" = 6c12b0d1fd722ba516483c0b9ef0c4f0ecc30a76
          test "$(git hash-object research/contrib/chatgpt/20261013-y043-key-frame/prereg.json)" = 148d0bd8683e700e5e3d4a4ef8d000b320fae704
          test "$(git hash-object research/contrib/chatgpt/20261013-y043-key-frame/execute.py)" = 0ad179dbef1fd4bc91c127fb5a17395c7ee1f678
          python3 -m json.tool research/contrib/chatgpt/20261013-y043-key-frame/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y043-key-frame/execute.py
      - name: First-use sealed moving-key frame scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y043-key-frame/execute.py > /tmp/Y043-original.json
          python3 -m json.tool /tmp/Y043-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y043-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(1000,1016))
          assert len(a["by_regime"])==3
          print("CLASSIFICATION",a["classification"])
          print("RAW_MISMATCH",a["raw_assignment_mismatch_count"])
          print("AWARE_MISMATCH",a["aware_assignment_mismatch_count"])
          print("BOOKKEEPING_DIFFERENCE",a["raw_cache_bookkeeping_disparity_events"])
          for regime,policies in a["heldout_physical_churn"].items():
              print("REGIME",regime,policies)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y043-original-moving-key-identity
          path: /tmp/Y043-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
