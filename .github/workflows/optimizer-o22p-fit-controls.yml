name: Optimizer O22-P equal original-FIT learning controls

on:
  push:
    branches:
      - research/optimizer-o22p-native-effect-fit-20261025
  pull_request:
    paths:
      - research/optimizer_o22p/**
      - .github/workflows/optimizer-o22p-fit-controls.yml

permissions:
  contents: read
  actions: read

jobs:
  focused-unit:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate protocol frozen before code
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1d80a566b0812c837ba1c4e68c31bca5db45ea70 HEAD
          git merge-base --is-ancestor f77bd56b1d16f609796af1f8f445992ebba7f512 HEAD
          python -B -c "import json;d=json.load(open('research/optimizer_o22p/PREREG.json'));assert d['source_artifact']['training_data_only'] is True"
      - name: Independently trained public effect unit and cold state
        run: python -B -m unittest -v research.optimizer_o22p.test_effect_models

  frozen-authentic-FIT:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: focused-unit
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Retrieve ONLY immutable preexisting original FIT artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o22p-source" "$RUNNER_TEMP/o22p-result"
          gh run download 40186158097 --repo "$GITHUB_REPOSITORY" --name optimizer-o22o-authentic-original-turn-action-FIT-receipts --dir "$RUNNER_TEMP/o22p-source"
          python -B -c "import json,pathlib,hashlib,os;d=json.load(open('research/optimizer_o22p/PREREG.json'))['source_artifact'];r=pathlib.Path(os.environ['RUNNER_TEMP'])/'o22p-source';assert hashlib.sha256((r/'fit-1.json').read_bytes()).hexdigest()==d['fit1_file_sha256'];assert hashlib.sha256((r/'fit-2.json').read_bytes()).hexdigest()==d['fit2_file_sha256']"
          echo 'O22P_IMMUTABLE_AUTHENTIC_SOURCE_FIT=PASS'
      - name: Real-source FIT-only native and independent conventional comparison
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o22p/evaluate.py --authentic-fit-artifact-dir "$RUNNER_TEMP/o22p-source" --out "$RUNNER_TEMP/o22p-result/comparison.json"
          python -B -m json.tool "$RUNNER_TEMP/o22p-result/comparison.json"
      - name: Archive real-source FIT-only learner comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22p-source-FIT-only-model-comparison
          path: ${{ runner.temp }}/o22p-result/
          if-no-files-found: warn
          retention-days: 80
