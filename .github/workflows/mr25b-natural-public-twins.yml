name: MR25B Natural Original Public Causal Twin Audit
on:
  push:
    branches:
      - research/mr25b-natural-public-twin-audit-20261021
  pull_request:
    branches:
      - research/mr24-natural-native-history-custody-20261021
permissions:
  contents: read
concurrency:
  group: mr25b-original-uninterrupted-public-twins-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-original-naturally-reached-public-contrasts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve exact Windows Git checkout bytes
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: MR25B exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Independent Farama original code source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Original source Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact independent original Git source blob verification
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install original source pinned runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Run actual uninterrupted same-public-action different-outcome audit
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr25b.natural_twin_audit ../external/minigrid | tee ../mr25b-native-receipt.log
          grep -q '^MR25B_ORIGINAL_NATURAL_PUBLIC_TWIN_IDENTIFIABILITY=' ../mr25b-native-receipt.log
      - name: Both independent original source trees are unmodified
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C external/minigrid status --porcelain)"
