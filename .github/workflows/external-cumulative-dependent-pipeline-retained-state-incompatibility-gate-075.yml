name: Yggdrasil retained-state incompatibility gate 075
on:
  push:
    branches:
      - research/external-hosted-yggdrasil-dependent-pipeline-retained-state-incompatibility-gate-r1
    paths:
      - 'research/experiments/external-future-data-fourth-context-manifest-075.json'
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.ice'
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 'f0058645552e146a0a1d656e3ac388998954da94' HEAD
          git merge-base --is-ancestor 'b4792d561201a9cbbcd304a7bdf1c14a65a9c15b' HEAD
          changed="$(git diff --name-only 'f0058645552e146a0a1d656e3ac388998954da94..HEAD' | sort)"
          expected="$(printf '%s\n'             '.github/workflows/external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.yml'             'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.py'             'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.ice'             'research/experiments/external-future-data-fourth-context-manifest-075.json' | sort)"
          test "$changed" = "$expected"
          python -m py_compile research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.py
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-RETAINED-STATE-INCOMPATIBILITY-GATE-075","preregistration_sha":"b4792d561201a9cbbcd304a7bdf1c14a65a9c15b","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001918","manifest_sha256":"974ecf332c019ac094ecb7098f371001fa7e37fd4b476ac7513341fff6f812e5","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"c499c28c2c62c675350c56c7301f62c89a0bc1e5"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="a06f19009c5cc13d89d64a4a30d8f478aa9806bad9314f122207b5a6c941b582"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="b4792d561201a9cbbcd304a7bdf1c14a65a9c15b"
          assert r["manifest_sha256"]=="974ecf332c019ac094ecb7098f371001fa7e37fd4b476ac7513341fff6f812e5"
          assert r["ckb_plane_main_sha"]=="c499c28c2c62c675350c56c7301f62c89a0bc1e5"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact fourth-context sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/yggdrasil-075"; mkdir -p "$EXTERNAL_ROOT"
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/kubernetes/kubernetes/e7967bb9b76d43a6388abb7a4e90d2f899ef97ff/pkg/kubelet/kubelet.go",156626,"e0f247ef45cb281166b58ba1a013dc6925023388193bd74c1f126c695b770d34",41453,"283073d9f6c0dd868c39a913364bce6744ff1e29c038f6920197c0d33e0c2ac1"),
            ("structured","https://raw.githubusercontent.com/microsoft/TypeScript/50d70a3f5f453a79a4323b263165da51f656a4e3/package-lock.json",143844,"52b6c9bd0a26ef1b0fc27dfbfaa00df6a047cdddd587d07c4f6c1c3345faf5cf",14365,"a46fcfb7d862b03b750b61a5f667d4ac25a064df9ccb746e395db7e864068933"),
            ("technical-prose","https://raw.githubusercontent.com/django/django/a461af8ce48762d7ec602260aaff81014ddccbcb/docs/intro/tutorial01.txt",10844,"1cf1817e6211b7c0fa9e8044ee808fde1e8f16ca5f9d5ab5358510a5c9591b96",1454,"5d0c2efd139bd6094098bc893ed746020f03e0860a25f278348f43f47c236222"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for name,url,full_n,full_h,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"yggdrasil-075"}),timeout=60).read(full_n+1)
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h
              p=b[:prefix_n]
              assert len(p)==prefix_n and hashlib.sha256(p).hexdigest()==prefix_h
              (root/(name+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen incompatibility gate twice
        shell: bash
        run: |
          set -euo pipefail
          script='research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-incompatibility-gate-075.py'
          python "$script" --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python "$script" --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"];decision=r["decision"]
          valid=(
            m["target_source_count"]==3 and m["target_total_source_bytes"]==57272 and
            m["target_source_identity_mismatch_count"]==0 and m["base_training_identity_mismatch_count"]==0 and
            m["donor_row_count"]==16 and m["eligible_candidate_count"]>=1 and
            m["source_state_identity_mismatch_count"]==0 and m["source_state_mutation_count"]==0 and
            m["heldout_gate_input_count"]==0 and m["post_result_gate_change_count"]==0 and
            m["all_child_source_identity_mismatch_count"]==0 and m["all_child_transport_identity_mismatch_count"]==0 and
            m["capacity_growth_event_count"]==0 and m["persistent_state_write_count"]==0 and
            m["invalid_evaluation_rows"]==0 and all(math.isfinite(float(v)) for v in m.values())
          )
          source_rescue=(
            m["source_positive_prose_collateral_schedule_count"]>m["original_positive_prose_collateral_schedule_count"] and
            m["source_positive_prose_collateral_schedule_count"]>m["local_positive_prose_collateral_schedule_count"] and
            m["source_partner_collateral_failure_count"]==0
          )
          if not valid: cls="invalid"
          elif decision=="REJECT" and not source_rescue: cls="supported"
          elif decision=="ALLOW_SOURCE_PRIOR" and source_rescue: cls="supported"
          elif decision=="ALLOW_SOURCE_PRIOR" and m["source_behavior_change_count"]>0: cls="mixed"
          else: cls="negative"
          out={
            "schema":"yggdrasil.research-classification.v1",
            "experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-RETAINED-STATE-INCOMPATIBILITY-GATE-075",
            "classification":cls,"validity_pass":valid,"decision":decision,
            "gate_correct":bool(cls=="supported"),"source_rescue":source_rescue,
            "source_selected":r.get("source_selected"),"local_selected":r.get("local_selected"),
            "authority_receipt_sha256":"a06f19009c5cc13d89d64a4a30d8f478aa9806bad9314f122207b5a6c941b582",
            "rsi_success":False,
            "rsi_success_reason":"A correct REJECT is compatibility/safety progress, not retained-state transfer; useful ALLOW still requires replication on another disjoint context.",
            "metrics":m
          }
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/yggdrasil-075"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-retained-state-incompatibility-gate-075
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
