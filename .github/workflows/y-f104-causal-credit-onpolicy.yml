name: Y-F104 native causal-credit teacher-vs-onpolicy public study
on:
  push:
    branches:
      - research/y-f104-causal-credit-onpolicy-20261017-r1
    paths:
      - '.github/workflows/y-f104-causal-credit-onpolicy.yml'
      - 'research/foundational/20261017-y-f104/**'
permissions:
  contents: read
jobs:
  frozen-native-public:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve signed by Git object bytes before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify F104 pre-code preregistration and unchanged native parent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='bf844517215e5e8374c7a5409cc417a04943eb5b'
          $prereg='01ad8b5d0427675396ae204301e28ed0fedab539'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'F104_SHA_DRIFT' }
          git merge-base --is-ancestor $parent HEAD
          if ($LASTEXITCODE -ne 0) { throw 'F104_PARENT_NOT_ANCESTOR' }
          git merge-base --is-ancestor $prereg HEAD
          if ($LASTEXITCODE -ne 0) { throw 'F104_FROZEN_BEFORE_SOURCE_NOT_ANCESTOR' }
          $expected=@(
            '.github/workflows/y-f104-causal-credit-onpolicy.yml',
            'research/foundational/20261017-y-f104/prereg.json',
            'research/foundational/20261017-y-f104/causal_credit.py',
            'research/foundational/20261017-y-f104/test_causal_credit.py'
          )
          $actual=@(git diff --name-only $parent HEAD | Where-Object { $_ -ne '' })
          if (@(Compare-Object $actual $expected).Count -ne 0) { throw 'F104_UNEXPECTED_SCIENTIFIC_SOURCE_CHANGE' }
          if ((git hash-object 'research/foundational/20261017-y-f104/prereg.json') -cne '60757f68e275a9af7c4179fe54a26b3406be8de7') { throw 'F104_FROZEN_PROTOCOL_DRIFT' }
          if ((git hash-object 'research/foundational/20261017-y-f103/diagnose.py') -cne 'a9f58b5d96e4ba15283961bc4bc2db6ed09ccf0a') { throw 'F104_F103_DRIFT' }
          if ((git hash-object 'research/foundational/20261017-y-f102/delayed_credit.py') -cne '8686390483c1e367c5cc1016a865a15c926b8376') { throw 'F104_F102_DRIFT' }
      - name: Adversarial causal label and future-blind native online tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -B -m unittest discover -s research/foundational/20261017-y-f104 -p 'test_causal_credit.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'F104_SOURCE_CONTRACTS_FAILED' }
      - name: Execute frozen TRAIN-only causal credit and fresh GUARD
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'y-f104-native'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $out=Join-Path $dir 'f104-causal-credit-public.json'
          python -B research/foundational/20261017-y-f104/causal_credit.py --source-ref $env:GITHUB_SHA |
            Out-File -LiteralPath $out -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'F104_PUBLIC_EVALUATION_FAILED' }
          $p=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($p.schema -cne 'yggdrasil.f104.causal-credit-teacher-onpolicy-public.v1' -or
              $p.exact_head -cne $env:GITHUB_SHA -or
              $p.parent_F103_exact_sha -cne 'bf844517215e5e8374c7a5409cc417a04943eb5b' -or
              $p.TRAIN_episodes -ne 16 -or $p.GUARD_episodes -ne 24 -or
              $p.GUARD_blocks.Count -ne 3 -or
              $p.TRAIN_causal_credit_receipts.Count -ne 192 -or
              -not $p.original_F102_F103_GUARD_never_loaded -or
              -not $p.native_actions_and_144byte_record_cap_unchanged -or
              -not $p.all_future_queries_hidden_from_online_policy -or
              $p.protected_first_use -or $p.scientific_acceptance -or
              $p.accepted_ref_mutation -or $p.optimizer_promotion -or
              $p.CKB_connected -or $p.Codex_used -or $p.MindPalace_written) {
              throw 'F104_FABRICATED_SCIENTIFIC_SOURCE_OR_AUTHORITY'
          }
          foreach ($name in @('teacher','onpolicy','mixed')) {
            $v=$p.training_support.$name
            if ($v.total -ne ($v.positive+$v.negative+$v.zero)) {
              throw 'F104_TRAIN_CREDIT_LABELS_MISSING'
            }
          }
          foreach ($block in $p.GUARD_blocks) {
            if ($block.cases.Count -ne 8) { throw 'F104_GUARD_MISSING_CASE' }
            foreach ($case in $block.cases) {
              if ($case.events -ne 72 -or $case.memory_budget_bytes -ne 144 -or
                  $case.question_visible_to_online_policy) { throw 'F104_MEMORY_OR_FUTURE_LEAK' }
              foreach ($name in @('F60_fixed','F102_original_raw',
                           'F104_teacher_credit','F104_mixed_onpolicy_credit','F62_zero')) {
                if ($case.outcome.$name -notin @(0,1)) { throw 'F104_MISSING_OR_INVALID_CASE_OUTCOME' }
              }
            }
          }
          Write-Host ('F104_TEACHER_CREDIT_POS='+$p.training_support.teacher.positive)
          Write-Host ('F104_ONPOLICY_CREDIT_POS='+$p.training_support.onpolicy.positive)
          Write-Host ('F104_F60='+$p.totals.F60_fixed+'/24')
          Write-Host ('F104_OLD_F102='+$p.totals.F102_original_raw+'/24')
          Write-Host ('F104_TEACHER_TRAINED='+$p.totals.F104_teacher_credit+'/24')
          Write-Host ('F104_ONPOLICY_MIXED='+$p.totals.F104_mixed_onpolicy_credit+'/24')
          Write-Host ('F104_DATA_COLLECTION_GAIN='+$p.onpolicy_data_collection_gain)
          Write-Host ('F104_DELAYED_SUPERIORITY='+$p.delayed_answer_superiority_screen_passed)
          Write-Host ('F104_DISPOSITION='+$p.disposition)
          # Both NEGATIVE and POSITIVE experiments pass instrumentation;
          # science cannot be declared by CI alone.
          $sha=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $dir 'f104-causal-credit-public.sha256'),
            ("$sha  f104-causal-credit-public.json"+[Environment]::NewLine),
            [System.Text.UTF8Encoding]::new($false))
      - name: Verify source readonly and no model or protected original authority
        shell: pwsh
        run: |
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) { throw 'F104_SOURCE_MUTATED' }
          Write-Host 'F104_PUBLIC_ONLY_NO_SCIENTIFIC_FIRST_USE=TRUE'
          Write-Host 'F104_NO_CODEX_CKB_CLOUDFLARE_OR_EXTERNAL_CONTROLLER=TRUE'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: y-f104-causal-credit-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/y-f104-native/f104-causal-credit-public.json
            ${{ runner.temp }}/y-f104-native/f104-causal-credit-public.sha256
          retention-days: 90
