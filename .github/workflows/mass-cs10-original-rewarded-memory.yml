name: Mass CS10 original POBAX rewarded cross-episode retained map learning
on:
  push:
    branches:
      - research/mass-cs10-rewarded-cross-episode-memory-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs10-real-reward-map-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-rewarded-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout prereg-first version and additive implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Fail-closed prove exactly frozen first commit and allowed additive paths
        shell: bash
        run: |
          set -euo pipefail
          first=2000868632a0dab106a20c0375d74fe560ec9f05
          parent=3ab1f8549fbb10a5bb46ac70a968e2f36efaed52
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS10_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS10_PREREG.md","research/native/itd01/mass_r10/run_cs10_original_rewarded_cross_episode.py","research/native/itd01/mass_r10/test_cs10_original_rewarded_cross_episode.py",".github/workflows/mass-cs10-original-rewarded-memory.yml"};assert got==want,(got,want)'
      - name: Checkout original independent POBAX unchanged at immutable Git commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taodav/pobax
          ref: a5e1d62d14e4efe783885b9d4f19cffa2a568eec
          path: external/pobax-original
          persist-credentials: false
      - name: Set Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded original source JAX CPU dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs10-evidence
          set +e
          timeout 480s python -m pip install --no-cache-dir --timeout 35 --retries 1 'jax==0.6.2' 'jaxlib==0.6.2' chex gymnax flax brax >cs10-evidence/pip-install.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 60s python -m pip install --no-deps -e external/pobax-original >>cs10-evidence/pip-install.log 2>&1
            rc=$?
          fi
          set -e
          printf '%s\n' "$rc" >cs10-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Run source-free fitted-learning and negative control focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs10_original_rewarded_cross_episode.py 2>&1 | tee cs10-evidence/focused-tests.log
      - name: Exact source-original public FIT VALID DEV actual rewarded collection episodes
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs10_original_rewarded_cross_episode.py \
            --upstream external/pobax-original --out cs10-evidence/
      - name: Preserve all original native FIT histories and negative/positive rewards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs10-original-source-cross-episode-reward
          path: cs10-evidence/
          retention-days: 30
