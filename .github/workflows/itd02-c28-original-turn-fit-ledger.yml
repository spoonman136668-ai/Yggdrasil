name: ITD-02 C28 original-source selected turn-inclusive FIT ledger
on:
  push:
    branches:
      - research/itd02-c28-original-turn-fit-ledger-20261025
permissions:
  contents: read
concurrency:
  group: itd02-c28-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-event-custody-preflight:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check source-first freeze and exact original Ygg source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 51a56b444e1eef5b4d776e20e0c9f3cd2ad3cf8d "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = "3aa22b1e418a7f8cd9619c476f02b8c614917b16"
          test "$(git hash-object research/native/itd02/r2/affordance_cells.py)" = "f7e47dfef309e1c0bcc871d518154fd950b3eca0"
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          test "$(git hash-object research/mass_r7c20/run.py)" = "8de70742db29aa56ab928ba10b6fb1003fc82351"
          python -m py_compile research/mass_r7c28/run.py research/mass_r7c28/compare.py research/mass_r7c28/test_ledger.py
          echo "C28_ORIGINAL_OWNER_FROZEN_SOURCE_FIRST=PASS"
      - name: Bounded fail-closed synthetic event grammar tests only
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest research.mass_r7c28.test_ledger -v
          echo "C28_PUBLIC_ACTION_RECEIPT_UNIT=PASS"
          echo "C28_UNIT_ORIGINAL_SOURCE_EPISODES=0"

  original-source-fit-only:
    needs: [public-event-custody-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          path: research
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          fetch-depth: 0
          persist-credentials: false
          path: external/minigrid
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original source identity and strict frozen public FIT only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$GITHUB_SHA"
          git -C research merge-base --is-ancestor 51a56b444e1eef5b4d776e20e0c9f3cd2ad3cf8d "$GITHUB_SHA"
          test "$(git -C external/minigrid rev-parse HEAD)" = "7f5853792ea7f04f75614661006d87fcf949f26d"
          test "$(git -C external/minigrid hash-object minigrid/envs/dynamicobstacles.py)" = "68436cecc35116c23c2f196c22fa3a19c6410b95"
          test "$(git -C research hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          echo "C28_REAL_ORIGINAL_UPSTREAM_AND_OWNER_IDENTITY=PASS"
      - name: Install independently authored pinned upstream MiniGrid source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./external/minigrid
      - name: Existing original native R1 R2 R3 focused regressions
        working-directory: research
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r1 -p test_native_policy.py -q
          python -B -m unittest discover -s research/native/itd02/r2 -p test_affordance_cells.py -q
          python -B -m unittest discover -s research/native/itd02/r3 -p test_navigator.py -q
          echo "C28_FROZEN_NATIVE_R1_R2_R3_FOCUSED=PASS"
      - name: Execute twice actual source FIT only, then reconcile exact public events
        working-directory: research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/itd02-c28-results"
          for rep in 1 2; do
            python -B research/mass_r7c28/run.py --out "$RUNNER_TEMP/itd02-c28-results/original-fit-$rep.json"
          done
          python -B -m research.mass_r7c28.compare "$RUNNER_TEMP/itd02-c28-results"
          echo "C28_ORIGINAL_SOURCE_FIT_ONLY_COMPLETED=PASS"
          echo "C28_NEW_DEVELOPMENT_EPISODES=0"
          echo "C28_PROTECTED_FIRST_USE=DENIED"
      - name: Preserve complete source-original FIT event ledger, no Library output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-c28-original-public-fit-turn-ledger
          path: ${{ runner.temp }}/itd02-c28-results/
          if-no-files-found: warn
          retention-days: 80
