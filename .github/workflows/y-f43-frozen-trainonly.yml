name: Y-F43 one frozen learned-reliability TRAIN-only diagnostic (NO original)
on:
  push:
    branches:
      - science/y-f43-one-frozen-trainonly-20261015-r1
permissions:
  contents: read
jobs:
  diagnostic:
    if: "${{ github.event.head_commit.message == 'science(y-f43): one frozen learned-reliability train-only evaluation' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind to precode prereg, passed preflight identity, original-exclusion
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 476f12dfc9737308f26bd624ecf1b4982d9c495a HEAD
          git merge-base --is-ancestor 92590a1eb318379bd647b5691f4aa9580d17da0c HEAD
          test "$(git hash-object research/foundational/20261015-y-f43/source_pilot.py)" = 5778091fb1e23d219e33f180013b4716589304d2
          test "$(git hash-object research/foundational/20261015-y-f43/prereg-candidate.json)" = 787c29f30ae436e825675ddda2cdc241159966cd
          python3 -m unittest discover -s research/foundational/20261015-y-f43 -p test_preflight.py -v
      - name: Exactly one disjoint fit + fresh TRAIN-only diagnostic cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261015-y-f43/source_pilot.py > /tmp/y-f43-train.json
          python3 -m json.tool /tmp/y-f43-train.json >/dev/null
          sha256sum /tmp/y-f43-train.json > /tmp/y-f43-train.sha256
          git rev-parse HEAD > /tmp/y-f43-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F43-once-only-learned-reliability-train
          path: |
            /tmp/y-f43-train.json
            /tmp/y-f43-train.sha256
            /tmp/y-f43-head.txt
          retention-days: 90
          if-no-files-found: error
      - name: Independently recount all rows, subgroups, paid reads, model budget and prereg verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math
          d=json.load(open('/tmp/y-f43-train.json'))
          p=json.load(open('research/foundational/20261015-y-f43/prereg-candidate.json'))
          assert d['schema']=='yggdrasil.f43.learned-typed-task-reliability.trainonly.v1'
          assert d['stage']=='TRAIN_ONLY_LEARNED_PROXY_NOT_NATIVE_OR_F3'
          assert d['fit_seeds']==p['train_only']['fit_seeds']
          assert d['diagnostic_seeds']==p['train_only']['diagnostic_seeds']
          assert d['reserved_original_seeds']==[p['reserved_original']['seed_start'],p['reserved_original']['seed_stop_exclusive']]
          assert d['families']==p['train_only']['families']
          assert d['reserved_original_families']==p['reserved_original']['families']
          assert d['questions']==128 and len(d['rows'])==128
          assert d['public_reference_anchors']==p['train_only']['anchors_per_source']==24
          assert d['physical_reads_per_role']==p['train_only']['physical_paid_reads_per_role']==2
          assert d['train_examples']==8*4*2*2*24*3*3
          assert 0<d['parameter_payload_bytes']<=576
          assert d['parameter_payload_is_not_native_resident_measurement']
          assert d['fitted_gaussian_bandwidth'] in (.12,.17,.25) and d['elapsed_seconds']>0
          assert d['diagnostic_labels_never_fit'] and d['private_modes_and_truth_evaluator_only']
          assert not d['independent_F3_custody'] and d['primary_original_not_executed']
          assert not d['native_576_byte_resident_physically_qualified']
          assert not d['accepted_ref_mutation'] and d['paid_api_calls']==0
          rows=d['rows'];arms=p['comparators']
          assert len({(r['seed'],r['family'],r['mechanism'],r['condition']) for r in rows})==128
          for row in rows:
              assert 342100<=row['seed']<342108
              assert row['family'] in p['train_only']['families']
              assert row['mechanism'] in p['train_only']['mechanisms']
              assert row['condition'] in p['train_only']['conditions']
              assert row['public_anchor_count']==24
              assert set(row['predictions'])==set(arms)
              assert set(row['receipts'])==set(arms)-{'private_truth_oracle_unfair'}
              for arm,per_role in row['receipts'].items():
                  assert len(per_role)==3
                  assert all(len(pair)==2 and pair[0]==0 and pair[1] in (1,2,3) for pair in per_role)
          def recount(sub,arm):
              n=len(sub)
              correct=sum(r['predictions'][arm]==r['truth'] for r in sub)
              fp=sum(bool(r['predictions'][arm]) and not r['truth'] for r in sub)
              fn=sum(not bool(r['predictions'][arm]) and r['truth'] for r in sub)
              return dict(correct=correct,total=n,accuracy=correct/n,fp=fp,fn=fn)
          for arm in arms:
              assert d['scores'][arm]==recount(rows,arm)
          assert d['scores']['private_truth_oracle_unfair']['correct']==128
          for field,key,values in (
              ('by_mechanism','mechanism',p['train_only']['mechanisms']),
              ('by_condition','condition',p['train_only']['conditions'])):
              for value in values:
                  sub=[r for r in rows if r[key]==value]
                  assert len(sub)==64
                  for arm in arms: assert d[field][value][arm]==recount(sub,arm)
          fair=arms[1:-1]
          baseline=max(d['scores'][a]['accuracy'] for a in fair)
          gain=d['scores']['learned_interaction_reliability']['accuracy']-baseline
          masked=d['scores']['learned_interaction_reliability']['accuracy']-d['scores']['first_read_masked']['accuracy']
          nondegrade=all(d['by_mechanism'][m]['learned_interaction_reliability']['correct']>=
              max(d['by_mechanism'][m][a]['correct'] for a in fair) for m in p['train_only']['mechanisms'])
          assert math.isclose(d['gain_over_strongest_fair'],gain,abs_tol=1e-12)
          assert math.isclose(d['masked_first_ablation_gain'],masked,abs_tol=1e-12)
          assert d['no_unseen_mechanism_degradation']==nondegrade
          passed=gain>=p['acceptance']['accuracy_gain_over_strongest_fair_min'] and masked>0 and nondegrade
          expected='TRAIN_ONLY_LEARNED_RELIABILITY_HEADROOM' if passed else 'TRAIN_ONLY_LEARNED_RELIABILITY_NOT_QUALIFIED'
          assert d['verdict']==expected
          print('Y_F43',expected,'correct',{a:d['scores'][a]['correct'] for a in arms},'gain',gain,'masked_gain',masked,'no_mechanism_degrade',nondegrade,'runtime_s',d['elapsed_seconds'])
          PY
      - name: Explicit authority limit
        run: echo "Synthetic TRAIN-only learned proxy, not reserved original/F3 or physically qualified native 576B. No controller/accepted ref mutations."
