name: YGG-RET01 source-frozen native readout retention
'on':
  push:
    branches:
      - research/ygg-ret01-evidence-readout-20261118
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: "github.event.head_commit.message == 'ci(ret01): preflight source-locked native readout' || github.event.head_commit.message == 'ci(ret01): run frozen native readout evidence learning'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve original public source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned native numeric testing dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Frozen original checkpoint pins, source invariants and fail-closed new reader
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}'
          git diff --exit-code 91100fa70086e5c1b2bc604da07c98dbe70af9e4 HEAD -- research/contrib/chatgpt/YGG-RET01/prereg.json
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-03/seed-14071-state.json)" = 958cc6050d167355af43b12f10ddd85542033319
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-03/seed-14072-state.json)" = 08d8b357a3baa290e5a4c6773160aab6765b9fb5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-04/seed-14071-state.json)" = 752b53d424dda55c0d18eb42bedef752e5492594
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-04/seed-14072-state.json)" = 2e7ed2218d8b88f47a463d752fb9e304f2535940
          python -B -m unittest discover -s tests -p test_native_readout_retention.py -v
          python -B -m unittest discover -s tests -p test_native_jepa_future.py -v
          python -B -m unittest discover -s tests -p test_native_jepa_temporal.py -v
          python -B research/contrib/chatgpt/YGG-RET01/campaign.py --help
          python -B research/contrib/chatgpt/YGG-RET01/audit.py --help
          test -z "$(git status --porcelain)"
  train:
    needs: preflight
    if: "github.event.head_commit.message == 'ci(ret01): run frozen native readout evidence learning'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve original public source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned native numeric dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Continue original learned Yggdrasil under new witnessed causality and audit exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 91100fa70086e5c1b2bc604da07c98dbe70af9e4 HEAD -- research/contrib/chatgpt/YGG-RET01/prereg.json
          python -B research/contrib/chatgpt/YGG-RET01/campaign.py --output "$RUNNER_TEMP/YGG-RET01"
          python -B research/contrib/chatgpt/YGG-RET01/audit.py "$RUNNER_TEMP/YGG-RET01"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: YGG-RET01-${{ matrix.os }}
          path: ${{ runner.temp }}/YGG-RET01/
          if-no-files-found: warn
          retention-days: 30
  seal:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Preserve original public source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned native numeric dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-RET01-ubuntu-latest
          path: ${{ runner.temp }}/YGG-RET01-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-RET01-windows-2022
          path: ${{ runner.temp }}/YGG-RET01-windows
      - name: Independent source-matched two-OS receipt seal and G29
        id: seal
        shell: bash
        env:
          YGG_RET01_LINUX: ${{ runner.temp }}/YGG-RET01-linux
          YGG_RET01_WINDOWS: ${{ runner.temp }}/YGG-RET01-windows
          YGG_RET01_RUN: ${{ github.run_id }}
          YGG_RET01_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 91100fa70086e5c1b2bc604da07c98dbe70af9e4 HEAD -- research/contrib/chatgpt/YGG-RET01/prereg.json
          python -B research/contrib/chatgpt/YGG-RET01/seal.py
          python -B research/contrib/chatgpt/YGG-RET01/audit.py research/contrib/chatgpt/YGG-RET01
          git add -- research/contrib/chatgpt/YGG-RET01/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ret01): seal frozen readout evidence and native source retention'
          EVIDENCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$EVIDENCE"
          git add .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git commit -m "docs(ret01): exact G29 source atlas at $EVIDENCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ygg-ret01-evidence-readout-20261118
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Preserve original public source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned native dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Mandatory full original+new exact SHA native regression and G29
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.seal.outputs.final_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
