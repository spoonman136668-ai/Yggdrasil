name: QTR-01 F50 development transport final qualification
on:
  push:
    branches: [research/qtr01-qwen38-donor-intake-20261114]
permissions:
  contents: read
jobs:
  atlas:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 fixture correction derive G29'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen source and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_target_evaluator.py)" = '22137159932ee4bebbf308fb565861eb67b651b3'
          test "$(git rev-parse HEAD^)" = '344b6dc20dfeeaae04a7ceb490a74a2b2e6fad61'
          expected="$(printf '%s\n' .github/workflows/qtr01-f50-development-transport.yml research/contrib/chatgpt/QTR-01/test_f50_source_arm_factory.py | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_arm_factory.py)" = 'ed36b5e784d9524933c8fe44fa99ddcee47ff129'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_comparison_harness.py)" = 'ec5d329118ef3e53ef4c2fd7d4382684d2d6e47f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_source_arm_factory.py)" = 'da2f5b7a86ccb2488001db804b380f6327b38f28'
          test -z "$(git status --porcelain)"
      - name: Derive G29 exact-source atlas
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): F50 fixture correction G29 companion'
          python scripts/build_code_atlas.py --check
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
  qualify:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 fixture correction final'
    name: F50 development transport exact-SHA full regression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate exact-source companion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F50 fixture correction final'
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): F50 fixture correction G29 companion'
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_target_evaluator.py)" = '22137159932ee4bebbf308fb565861eb67b651b3'
          git merge-base --is-ancestor 344b6dc20dfeeaae04a7ceb490a74a2b2e6fad61 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_arm_factory.py)" = 'ed36b5e784d9524933c8fe44fa99ddcee47ff129'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_comparison_harness.py)" = 'ec5d329118ef3e53ef4c2fd7d4382684d2d6e47f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_source_arm_factory.py)" = 'da2f5b7a86ccb2488001db804b380f6327b38f28'
          python scripts/build_code_atlas.py --check
      - name: Install pinned CPU toolchain
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Focused F50
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f50_*.py' -v
      - name: Mandatory original regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory full contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: No development first use or modified sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_NO_DEVELOPMENT_FIRST_USE=PASS
  source-custody:
    name: F50 retained nine actual source checkpoints; no target first-use
    needs: qualify
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 fixture correction final'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned source-only CPU tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Retrieve existing GitHub source artifacts without uploads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f50-source-custody"
          for id in 14185250784 14191256763; do
            curl --fail --silent --show-error --location --retry 3 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/$id/zip" \
              --output "$RUNNER_TEMP/f50-source-custody/$id.zip"
          done
          echo F50_EXISTING_ARTIFACT_RETRIEVAL=PASS
      - name: Source-only nine real checkpoints and twelve arm factory preflight
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f50_source_arm_factory.py \
            --source-only \
            --archive-4096 "$RUNNER_TEMP/f50-source-custody/14185250784.zip" \
            --archive-lower "$RUNNER_TEMP/f50-source-custody/14191256763.zip" \
            --candidate-sha "$GITHUB_SHA" \
            --cold-arms \
            --synthetic-one-event
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_NO_TARGET_FIRST_USE_NO_ACCEPTED_WEIGHT_MUTATION=PASS
