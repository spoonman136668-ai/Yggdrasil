name: ITD-02 V31P-SRC strict source matched Atlas
on:
  push:
    branches: [research/itd02-v31p-src-g29-authoritative-refresh-20261028]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-source-only:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.generate.outputs.source_sha }}
      artifact_sha: ${{ steps.generate.outputs.artifact_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Strict single-commit Atlas content-addressed publication
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ec9ed11e85aa0c93a3c2194c4b1d72db846c6043 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
          if python scripts/build_code_atlas.py --check >/dev/null 2>&1; then
            echo "source_sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            echo "artifact_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "G29_ALREADY_PINNED"
            exit 0
          fi
          source="$(git rev-parse HEAD)"
          test "$source" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --source-commit "$source" --write
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          a=json.loads(Path('.ice/code-atlas.json').read_text())
          assert a['source_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert a['source_reviewed_labels']==0 and a['wingless_evidence_imported'] is False
          allowed={'.ice/code-atlas.json','.ice/code-atlas.html','.ice/code-atlas.ice'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          PY
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(g29): publish exact source-matched atlas artifacts'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          test "$(git rev-parse HEAD^)" = "$source"
          python scripts/build_code_atlas.py --check
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          echo "source_sha=$source" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/research/itd02-v31p-src-g29-authoritative-refresh-20261028
  qualify-original:
    needs: publish-source-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish-source-only.outputs.artifact_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact original G29 acceptance with no waivers
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.publish-source-only.outputs.source_sha }}
          ARTIFACT_SHA: ${{ needs.publish-source-only.outputs.artifact_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARTIFACT_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
          python - "$SOURCE_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          assert json.loads(Path('.ice/code-atlas.json').read_text())['source_commit']==sys.argv[1]
          PY
          python scripts/build_code_atlas.py --check
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
