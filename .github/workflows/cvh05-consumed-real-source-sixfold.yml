name: CVH05 sixfold consumed original public-return robustness and off-policy falsification

on:
  push:
    branches: [research/cvh05-authentic-public-sixfold-identifiability-20261116]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  source-only-development:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Git exact bytes, avoid CRLF reinterpretation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Source-independent frozen prereg and consumed FKP26 receipt checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5836c5dcdb74a8a1a7c5c32097d02ee955a4b2c3 HEAD
          git merge-base --is-ancestor 75abed7e43f04d23cf54ae2ed34130c8a4c46a54 HEAD
          test "$(git diff 5836c5dcdb74a8a1a7c5c32097d02ee955a4b2c3 75abed7e43f04d23cf54ae2ed34130c8a4c46a54 --name-only)" = "research/contrib/chatgpt/CVH-05/prereg.json"
          test -z "$(git status --porcelain)"
          for n in 01 02 03 04 05; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CVH-$n" -p 'test_*.py' -v
          done
          python -B research/contrib/chatgpt/CVH-05/sixfold_falsification.py --output-json "$RUNNER_TEMP/cvh05-source-only-result.json"
          test -s "$RUNNER_TEMP/cvh05-source-only-result.json"
          test -z "$(git status --porcelain)"
          echo CVH05_SIXFOLD_NO_NEW_SOURCE_DEV=PASS
      - name: Upload bounded 124-original-public-action retrospective metrics, never source-private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cvh05-original-consumed-public-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/cvh05-source-only-result.json
          if-no-files-found: error
          retention-days: 30

  source-atlas-once:
    needs: [source-only-development]
    if: "github.event.head_commit.message == 'ci(cvh05): pin original consumed-source G29' && github.run_attempt == 1 && needs.source-only-development.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: cvh05-original-consumed-source-g29-once
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate only three official derived code atlas files once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          SOURCE="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(cvh05): pinned original consumed-source G29 at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/cvh05-authentic-public-sixfold-identifiability-20261116

  final-exact-regression:
    needs: [source-only-development]
    if: "github.event.head_commit.message == 'ci(cvh05): exact original public-source regression' && github.run_attempt == 1 && needs.source-only-development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Configure byte-stable checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Full inherited native root + CVH01-CVH05 + G29 on same final SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 0
          git merge-base --is-ancestor 75abed7e43f04d23cf54ae2ed34130c8a4c46a54 HEAD
          python -B scripts/build_code_atlas.py --check-if-present
          for n in 01 02 03 04 05; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CVH-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B research/contrib/chatgpt/CVH-05/sixfold_falsification.py --output-json "$RUNNER_TEMP/cvh05-final-result.json"
          test -s "$RUNNER_TEMP/cvh05-final-result.json"
          test -z "$(git status --porcelain)"
          echo CVH05_SIXFOLD_FULL_FINAL_REGRESSION=PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cvh05-final-retrospective-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/cvh05-final-result.json
          if-no-files-found: error
          retention-days: 30

  independent-g29:
    needs: [source-only-development]
    if: "github.event.head_commit.message == 'ci(cvh05): exact original public-source regression' && github.run_attempt == 1 && needs.source-only-development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Configure byte-stable checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent source atlas check never touches causal environment
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
