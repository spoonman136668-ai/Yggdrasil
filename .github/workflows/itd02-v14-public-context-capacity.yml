name: ITD-02 V14 public-context capacity source-only audit
on:
  push:
    branches:
      - research/itd02-v14-three-phase-local-context-capacity-20261028
permissions:
  contents: read
jobs:
  three-phase-public-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep source byte identity cross-platform
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact pushed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original source and chronological prereg
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 214657d6acdca51493022b96a8688f7f41ff8752 "$GITHUB_SHA"
          git merge-base --is-ancestor 703b2c4f98c332e8f5ba54860e825f597cd3d6a4 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run deterministic source-only 36-context audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v14-context"
          PYTHONPATH=. python -B research/itd02_v14_three_phase_context_capacity.py > "$RUNNER_TEMP/v14-context/audit.json"
          python - "$RUNNER_TEMP/v14-context/audit.json" <<'PY'
          import json, sys
          from pathlib import Path
          x = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["public_context_count"] == 36
          assert x["distinct_full_context_codes"] == 36
          assert x["minimum_binary_neighbor_phases"] == 3
          assert x["per_reward_site_distinct_ordered_codes"] == {"0": 36, "2": 36, "5": 36}
          assert x["negative_control_per_site_two_phase_codes"] == {"0": 16, "2": 16, "5": 16}
          assert x["source_only"] is True
          assert x["scientific_first_use"] is False
          assert x["original_world_training"] is False
          assert x["learner_parameters_modified"] is False
          assert x["native_ring_modified"] is False
          assert x["classification"] == "V14_PUBLIC_CONTEXT_CAPACITY_POSSIBLE__NO_SCIENCE"
          print("ITD02_V14_PUBLIC_THREE_PHASE_CAPACITY_SOURCE_ONLY_PASS")
          PY
          cat "$RUNNER_TEMP/v14-context/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve read-only audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v14-context-capacity-${{ matrix.os }}
          path: ${{ runner.temp }}/v14-context/audit.json
          if-no-files-found: warn
          retention-days: 7
