name: DG1-MD23 toy-only public-reward prefirstuse qualification
on:
  push:
    branches: [research/dg1-md23-rewarded-box-transfer-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md23-20261114/**'
      - '.github/workflows/dg1-md23-qualification.yml'
permissions:
  contents: read
jobs:
  toy-and-regression:
    name: MD23 no-primary-seeds toy, inherited full regression, G29 generation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact prereg ancestor and unmodified predecessor source
        shell: bash
        run: |
          git merge-base --is-ancestor ea927ae080aee59d2dc0783f45eb703735dfb52f HEAD
          test "$(git rev-parse ea927ae080aee59d2dc0783f45eb703735dfb52f^)" = "155cb5c3c3f4802166ffb26695b7f7353384cb42"
          git diff --exit-code 155cb5c3c3f4802166ffb26695b7f7353384cb42 HEAD --             research/contrib/chatgpt/dg1-mg20-20261113/mg20.py             research/contrib/chatgpt/dg1-mg21-20261113/mg21.py             research/contrib/chatgpt/dg1-md22-20261114/md22.py
          echo "MD23_EXACT_SOURCE_AND_PREDECESSOR_IMMUTABILITY_PASS"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install pinned public CPU dependencies and record package provenance
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python -m pip freeze > md23-toy-packages.txt
          python - <<'PY'
          import importlib.metadata as im
          assert all(im.version(n)==v for n,v in (
            ("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")))
          print("MD23_CPU_DEPENDENCY_IDENTITY_PASS")
          PY
      - name: Pre-first-use toy physical reward and negative-control tests ONLY
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md23-20261114/md23.py research/contrib/chatgpt/dg1-md23-20261114/test_md23.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md23-20261114 -p 'test_md23.py' -v
      - name: Mandatory full inherited regression on exact source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Independently regenerate deterministic G29 atlas for candidate
        shell: bash
        run: |
          python scripts/build_code_atlas.py --source-commit "$(git rev-parse HEAD)" --write
          python scripts/build_code_atlas.py --check-if-present
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          names=[".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"]
          before=[hashlib.sha256(Path(x).read_bytes()).hexdigest() for x in names]
          subprocess.run(["python","scripts/build_code_atlas.py","--source-commit",
                          subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                          "--write"],check=True)
          after=[hashlib.sha256(Path(x).read_bytes()).hexdigest() for x in names]
          assert before==after,"MD23_NONDETERMINISTIC_ATLAS"
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed.issubset(set(names)),sorted(changed)
          print("MD23_G29_GENERATION_DETERMINISTIC_PASS")
          print("MD23_G29_ONLY_GENERATED_WORKTREE:"+str(sorted(changed)))
          print("MD23_G29_COMMITTED_ATLAS_PENDING")
          PY
      - name: Preserve toy-only software qualification receipt in GitHub Actions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-md23-toy-prefirstuse-${{ matrix.os }}
          path: md23-toy-packages.txt
          if-no-files-found: ignore
