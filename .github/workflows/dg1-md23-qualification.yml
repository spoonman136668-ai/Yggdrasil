name: DG1-MD23 toy-only public-reward prefirstuse qualification
on:
  push:
    branches: [research/dg1-md23-rewarded-box-transfer-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md23-20261114/**'
      - '.github/workflows/dg1-md23-qualification.yml'
      - '.ice/code-atlas.*'
  pull_request:
    branches: [research/dg1-md22-keydoor-intervention-20261114]
    types: [opened, synchronize]
    paths:
      - 'research/contrib/chatgpt/dg1-md23-20261114/**'
      - '.github/workflows/dg1-md23-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  toy-and-regression:
    name: MD23 no-primary-seeds toy, inherited full regression, G29 generation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact prereg ancestor and unmodified predecessor source
        shell: bash
        run: |
          git merge-base --is-ancestor ea927ae080aee59d2dc0783f45eb703735dfb52f HEAD
          test "$(git rev-parse ea927ae080aee59d2dc0783f45eb703735dfb52f^)" = "155cb5c3c3f4802166ffb26695b7f7353384cb42"
          git diff --exit-code 155cb5c3c3f4802166ffb26695b7f7353384cb42 HEAD --             research/contrib/chatgpt/dg1-mg20-20261113/mg20.py             research/contrib/chatgpt/dg1-mg21-20261113/mg21.py             research/contrib/chatgpt/dg1-md22-20261114/md22.py
          echo "MD23_EXACT_SOURCE_AND_PREDECESSOR_IMMUTABILITY_PASS"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install pinned public CPU dependencies and record package provenance
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python -m pip freeze > md23-toy-packages.txt
          python - <<'PY'
          import importlib.metadata as im
          assert all(im.version(n)==v for n,v in (
            ("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")))
          print("MD23_CPU_DEPENDENCY_IDENTITY_PASS")
          PY
      - name: Pre-first-use toy physical reward and negative-control tests ONLY
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md23-20261114/md23.py research/contrib/chatgpt/dg1-md23-20261114/registered_md23.py research/contrib/chatgpt/dg1-md23-20261114/test_md23.py research/contrib/chatgpt/dg1-md23-20261114/test_md23_registered.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md23-20261114 -p 'test_md23*.py' -v
      - name: Generate exact-source G29 atlas; export only when not committed
        id: atlas
        shell: bash
        run: |
          python - <<'PY'
          import base64,os,subprocess
          from pathlib import Path
          names=(".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice")
          def git(*args):
              return subprocess.check_output(("git",)+args,text=True).strip()
          head=git("rev-parse","HEAD")
          changed=set(git("diff","--name-only","HEAD^","HEAD").splitlines())
          only_atlas=changed==set(names)
          source=git("rev-parse","HEAD^") if only_atlas else head
          subprocess.run(["python","scripts/build_code_atlas.py",
                          "--source-commit",source,"--write"],check=True)
          committed=only_atlas and all(subprocess.check_output(
              ("git","show","HEAD:"+path))==Path(path).read_bytes()
              for path in names)
          # Stable, complete base64 transport of generated atlas for an
          # independent GitHub-scope commit. Never mutate refs from CI.
          if not committed and os.environ.get("RUNNER_OS")=="Linux":
              for path in names:
                  encoded=base64.b64encode(Path(path).read_bytes()).decode("ascii")
                  chunks=[encoded[i:i+1200] for i in range(0,len(encoded),1200)]
                  for index,chunk in enumerate(chunks):
                      print("MD23_ATLAS_B64|"+path+"|"+str(index)+"|"+
                            str(len(chunks))+"|"+chunk,flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fp:
              fp.write("committed="+str(committed).lower()+"\n")
              fp.write("source="+source+"\n")
          print("MD23_G29_SOURCE:"+source)
          print("MD23_G29_COMMITTED:"+str(committed))
          PY
      - name: Mandatory full inherited regression on exact pinned G29 atlas
        if: steps.atlas.outputs.committed == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check
          git diff --exit-code -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
      - name: Verify only generated atlas differs on source-only preflight
        if: steps.atlas.outputs.committed != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          modified=set(subprocess.check_output(["git","diff","--name-only"],
                            text=True).splitlines())
          allowed={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"}
          assert modified==allowed,modified
          print("MD23_PREFIRSTUSE_TOY_ONLY_G29_PENDING_COMMIT")
          PY
      - name: Official registered first use ONLY on exact named draft PR opening
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'research/dg1-md23-rewarded-box-transfer-20261114' && github.base_ref == 'research/dg1-md22-keydoor-intervention-20261114' && steps.atlas.outputs.committed == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          MD23_FIRST_USE: MD23_PR_OPENED_FROZEN_SOURCE_ONCE
        run: |
          python research/contrib/chatgpt/dg1-md23-20261114/registered_md23.py > md23-firstuse.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("md23-firstuse.json").read_text())
          assert x["schema"]=="yggdrasil.dg1-md23-original.v1"
          assert x["frozen_prereg_sha"]=="ea927ae080aee59d2dc0783f45eb703735dfb52f"
          assert x["exact_parent_sha"]=="155cb5c3c3f4802166ffb26695b7f7353384cb42"
          assert x["registered_first_use"] is True
          assert x["episode_count"]==348 and 0<x["charged_actions"]<=89088
          assert all(x[k]["count"]==72 for k in ("cold_before","cold_after","heldout_size","heldout_box"))
          assert all(len(x[k]["by_arm"])==6 for k in ("cold_before","cold_after","heldout_size","heldout_box"))
          assert all(len(v["episodes"])==12 for k in ("cold_before","cold_after","heldout_size","heldout_box") for v in x[k]["by_arm"].values())
          assert all(len(v["sha256"])==64 for v in x["checkpoints"].values())
          assert x["scientific_acceptance"]=="UNVERIFIED"
          print("MD23_ORIGINAL_PHYSICAL_EVAL_CUSTODY_PASS")
          print("MD23_CLASSIFICATION:"+x["classification"])
          print("MD23_GATES:"+json.dumps(x["registered_gates"],sort_keys=True))
          print("MD23_TRAIN_COVERAGE:"+json.dumps({
             z:{k:x["training"][z][k] for k in ("goals","no_key_probes","with_key_unlocks","rewarded_boxes")}
             for z in ("door","box")},sort_keys=True))
          print("MD23_EVAL:"+json.dumps({
             z:{arm:{"goals":p["goal_count"],"reward":p["mean_discounted_reward"],
                      "edge_use":p["learned_edge_use_episodes"]}
             for arm,p in x[z]["by_arm"].items()}
             for z in ("cold_before","cold_after","heldout_size","heldout_box")},sort_keys=True))
          PY
      - name: Preserve original registered real-action trace only in GitHub Actions
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'research/dg1-md23-rewarded-box-transfer-20261114' && github.base_ref == 'research/dg1-md22-keydoor-intervention-20261114' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-md23-original-${{ matrix.os }}
          path: |
            md23-firstuse.json
            md23-toy-packages.txt
          if-no-files-found: ignore
      - name: Preserve toy-only software qualification receipt in GitHub Actions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-md23-toy-prefirstuse-${{ matrix.os }}
          path: md23-toy-packages.txt
          if-no-files-found: ignore
  original-cross-os-parity:
    name: MD23 registered real-action checkpoint and reward parity
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.head_ref == 'research/dg1-md23-rewarded-box-transfer-20261114' && github.base_ref == 'research/dg1-md22-keydoor-intervention-20261114'
    needs: toy-and-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-md23-original-ubuntu-latest
          path: original-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-md23-original-windows-2022
          path: original-windows
      - name: Verify non-timing action, reward, checkpoint and frozen classification parity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("original-linux/md23-firstuse.json").read_text())
          b=json.loads(Path("original-windows/md23-firstuse.json").read_text())
          def no_timing(x):
              if isinstance(x,dict):
                  return {k:no_timing(v) for k,v in x.items()
                          if k not in ("decision_cpu_ns","cpu_ratio","cpu_to_trained_recurrent")}
              if isinstance(x,list):return [no_timing(v) for v in x]
              return x
          assert no_timing(a)==no_timing(b),"MD23_NON_TIMING_CROSS_OS_PARITY_MISMATCH"
          assert a["episode_count"]==b["episode_count"]==348
          assert a["charged_actions"]==b["charged_actions"]
          print("MD23_REGISTERED_DUAL_OS_NON_TIMING_PHYSICAL_PARITY_PASS")
          print("MD23_ORIGINAL_RESULT:"+a["classification"])
          PY
