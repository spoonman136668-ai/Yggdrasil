name: ITD-02 frozen action-history native trace parity qualification
on:
  push:
    branches:
      - research/itd02-frozen-action-trace-parity-20261027
permissions:
  contents: read
jobs:
  exact-source-frozen-inference-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes across OS
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout source-only preregistration and evaluator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout exact original frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658b855d1b217d20ed9d431fe99b2e866469b7e9
          path: native-original
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout exact frozen-trace parity candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cd3821f8429ce48580f3132bb2ca0d93e2c94782
          path: native-parity
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail-closed original/candidate source and preregistration custody
        shell: bash
        run: |
          set -euo pipefail
          git -C harness merge-base --is-ancestor 04051633ed0cadf40943906e788ea2c05f2264ca "$GITHUB_SHA"
          test "$(git -C native-original rev-parse HEAD)" = 658b855d1b217d20ed9d431fe99b2e866469b7e9
          test "$(git -C native-parity rev-parse HEAD)" = cd3821f8429ce48580f3132bb2ca0d93e2c94782
          test -z "$(git -C harness status --porcelain --untracked-files=all)"
          test -z "$(git -C native-original status --porcelain --untracked-files=all)"
          test -z "$(git -C native-parity status --porcelain --untracked-files=all)"
          python - <<'PY'
          from pathlib import Path
          import difflib
          a=Path("native-original/yggdrasil/itd02_native_task_bridge_dev.py").read_text("utf-8")
          b=Path("native-parity/yggdrasil/itd02_native_task_bridge_dev.py").read_text("utf-8")
          assert a != b
          assert "if learning:" in a and "self.cell_trace = [" in b
          from subprocess import check_output
          assert check_output(["git","-C","native-original","show","HEAD:yggdrasil/task_runtime.py"]) == check_output(["git","-C","native-parity","show","HEAD:yggdrasil/task_runtime.py"])
          assert check_output(["git","-C","native-original","show","HEAD:yggdrasil/itd02_local_ring_memory_dev.py"]) == check_output(["git","-C","native-parity","show","HEAD:yggdrasil/itd02_local_ring_memory_dev.py"])
          print("ITD02_ORIGINAL_NATIVE_GENOME_AND_RING_SOURCE_BYTE_IDENTICAL")
          PY
      - name: Native frozen-mode and original source unit regressions
        shell: bash
        run: |
          set -euo pipefail
          cd native-parity
          python -B -m unittest discover -s tests -p test_itd02_native_task_bridge_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_local_ring_memory_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
      - name: Compare unchanged fitted checkpoints across source-exact frozen history probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-trace-evidence"
          for variant in original parity; do
            python -B harness/research/itd02_frozen_action_trace_parity_dev.py \
              --variant "$variant" --root "$GITHUB_WORKSPACE/native-$variant" \
              --output "$RUNNER_TEMP/native-trace-evidence/$variant.json"
          done
          python -B harness/research/itd02_frozen_action_trace_parity_dev.py \
            --compare "$RUNNER_TEMP/native-trace-evidence" \
            --output "$RUNNER_TEMP/native-trace-evidence/comparison.json"
      - name: Validate exact action-prefix counts, frozen weights and no-science classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"native-trace-evidence"
          r=json.loads((p/"comparison.json").read_text("utf-8"))
          assert r["trained_checkpoint_sha256_equal"] is True
          assert r["max_action_pair_splits"]==18
          assert r["scientific_first_use"] is False
          assert r["promotion_authorized"] is False
          assert r["actual_multi_step_learning_success_tested"] is False
          for name in ("original","parity"):
            d=json.loads((p/(name+".json")).read_text("utf-8"))
            assert d["training_events"]==54 and d["frozen_prefix_probes"]==18
            assert [a["fit_events"] for a in d["snapshots"]]==[0,27,54]
            assert all(not h["fitted_parameters_mutated"] for c in d["snapshots"]
                   for v in c["by_first_cue"].values() for h in v["history_probes"])
          print("ITD02_FROZEN_ACTION_TRACE_SOURCE_ONLY_PARITY_AUDIT_PASS_NO_SCIENCE")
          PY
          test -z "$(git -C harness status --porcelain --untracked-files=all)"
          test -z "$(git -C native-original status --porcelain --untracked-files=all)"
          test -z "$(git -C native-parity status --porcelain --untracked-files=all)"
      - name: Preserve cross-OS negative and history alias measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-frozen-action-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/native-trace-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
