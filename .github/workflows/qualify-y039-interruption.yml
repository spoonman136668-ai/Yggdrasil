name: Yggdrasil Y039 observed-state interruption recovery
on:
  push:
    branches: [research/y039-interrupted-retention-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze predecessor, prereg, and interruption source identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e99b3609b36fffd528bfa3e9c74aab7f3f8c168f HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-retention-capacity/execute.py)" = 491d29bad77a07281e06e985b0703ff846c2f190
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-interrupt/prereg.json)" = cfeffae76c60f08d9781fbba4904b4d69ea461f5
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-interrupt/execute.py)" = 45f067d356dccf05dea55dd58039a5049f4d0a1e
          python3 -m json.tool research/contrib/chatgpt/20261013-y039-interrupt/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y039-interrupt/execute.py
      - name: First-use sealed environment interruption study
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y039-interrupt/execute.py > /tmp/Y039-original.json
          python3 -m json.tool /tmp/Y039-original.json >/dev/null
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/Y039-original.json'))
          assert r['heldout_seeds']==list(range(376,392))
          assert r['reset_episode_starts']==[3,6]
          assert len(r['regimes'])==4
          assert all(x['unique_environment_count']==24 for x in r['regimes'])
          print('CLASSIFICATION',r['classification'])
          for x in r['regimes']:
              print('REGIME',x['regime'],x['heldout_churn'],
                    'INTERRUPTED_SAVING',x['interrupted_memory_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y039-original-interrupted-memory
          path: /tmp/Y039-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Complete Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
