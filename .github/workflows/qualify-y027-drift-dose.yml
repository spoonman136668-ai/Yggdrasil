name: Yggdrasil Y027 frozen retention-drift dose qualification
on:
  push:
    branches: [research/y027-retention-drift-dose-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source, parent and preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3983e1f9a99b57786eafa28d9b4d5b0cb7be575e HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y026-rapid-drift/execute.py)" = 4c528a0af0573dba82a43ef8ab000cd293e6db99
          test "$(git hash-object research/contrib/chatgpt/20261012-y027-drift-dose/prereg.json)" = ffab4dedbfe069dc62df99887bbbd56c79d26ab0
          test "$(git hash-object research/contrib/chatgpt/20261012-y027-drift-dose/execute.py)" = 121e488c19a4e0536d76304e3a4c0524bf5b1f8c
          python3 -m json.tool research/contrib/chatgpt/20261012-y027-drift-dose/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-y027-drift-dose/execute.py
      - name: First frozen drift-dose scientific run
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-y027-drift-dose/execute.py > /tmp/Y027-original.json
          python3 -m json.tool /tmp/Y027-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y027-original-drift-dose
          path: /tmp/Y027-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
