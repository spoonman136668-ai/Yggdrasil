name: Yggdrasil Y021 Hall deficiency science
on:
  push:
    branches: [research/y021-hall-deficiency-r1]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen predecessor identity
        run: git merge-base --is-ancestor 04055c51f3438da78ac3e110b1dd43a221d2d39c HEAD
      - name: Project test dependencies
        run: python -m pip install -e ".[test]"
      - name: Execute original Y021 bounded native experiment
        run: |
          python -B research/contrib/chatgpt/20261012-y021-hall-deficiency/execute.py --output "$RUNNER_TEMP/y021.json"
          python -m json.tool "$RUNNER_TEMP/y021.json"
      - uses: actions/upload-artifact@v4
        with:
          name: y021-original-hall-witnesses
          path: ${{ runner.temp }}/y021.json
          if-no-files-found: error
          retention-days: 90
      - name: Full scientific repository regression
        run: python -m pytest -q tests
