name: WSP149 source-free exact coefficient and cold-memory qualification
on:
  push:
    branches: [research/wsp149-exact-gf2-memory-transfer-20261117]
permissions:
  contents: read
jobs:
  no-source:
    if: "github.sha == '4e704b230f9c9933f8487eb1815d783ae3c1de0e'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin parent and prove sole-file prereg before source first use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse b74f205d7ed02fe6d29a714e91a378e9152beb0d^)" = "233e7e3cc6714d698172824969fbb1f8c674c150"
          test "$(git diff-tree --no-commit-id --name-only -r b74f205d7ed02fe6d29a714e91a378e9152beb0d)" = "research/contrib/chatgpt/WSP-149/prereg.json"
          git merge-base --is-ancestor b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD
          git diff --exit-code b74f205d7ed02fe6d29a714e91a378e9152beb0d HEAD -- research/contrib/chatgpt/WSP-149/prereg.json
          git diff --exit-code 233e7e3cc6714d698172824969fbb1f8c674c150 HEAD -- research/contrib/chatgpt/WSP-148 research/contrib/chatgpt/WSP-147 research/contrib/chatgpt/WSP-146
          test ! -e research/contrib/chatgpt/WSP-149/source.py
          test ! -e research/contrib/chatgpt/WSP-149/experiment.py
          test ! -e research/contrib/chatgpt/WSP-149/result.json
          test ! -e research/contrib/chatgpt/WSP-149/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Fabricated-row exact fit and memory-source denial
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_*.py' -v
      - name: No generated artifacts or changed source
        shell: bash
        run: test -z "$(git status --porcelain)"
