name: MR26 Original Public-Novelty Causal Acquisition
on:
  push:
    branches:
      - research/mr26-public-novelty-acquisition-20261021
  pull_request:
    branches:
      - research/mr25-natural-native-learning-20261021
permissions:
  contents: read
concurrency:
  group: mr26-original-public-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-equal-budget-public-exploration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Freeze original Git bytes before Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact Yggdrasil source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original independent Farama source at frozen SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python native upstream runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify authentic external upstream eight source Git blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Frozen original free native-runtime and process memory dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Original uninterrupted public-only exploration 8 new seeds matched budgets
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr26.audit_native ../external/minigrid
      - name: Preserve original MR25 source-native learner regression unchanged
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr25.natural_learning ../external/minigrid
      - name: Original external and candidate Git source trees remain clean
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
