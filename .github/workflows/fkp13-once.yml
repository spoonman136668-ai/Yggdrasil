name: FKP13 native causal-memory closed-loop intervention research once
on:
  push:
    branches: [ci/fkp13-closedloop-once-20261115]
    paths: [.github/workflows/fkp13-once.yml]
permissions:
  contents: write
concurrency:
  group: fkp13-original-once-20261115
  cancel-in-progress: false
jobs:
  atlas-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-13): fix preflight prereg key before source first-use' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.freeze.outputs.candidate }}
    env:
      SOURCE: 64ed94a8881274c5176ebdfc727a1133f57b83a2
      TREE: c21088530bb889b3d4979335a6d25bbeab3a69c5
      TARGET: research/fkp13-mysterypath-closedloop-weight-actions-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Source-safe byte config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 64ed94a8881274c5176ebdfc727a1133f57b83a2
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify prereg-first, original source blobs, clean unchanged research head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 48b977cd3263f749bebdcc109d629d97e571a272 "$SOURCE"
          git merge-base --is-ancestor 25c80e1f7f5a74a972038ffcd619064d206d5aee "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/prereg.json)" = 12e38b10fe5cc201e0d15217aa071f98cfb6b3a8
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/cohorts.py)" = dd29ad6823303362811eff8064d30deaefa73469
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/controller.py)" = c7703311d93737a1792e0290c95a92dc41566670
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/run_dev.py)" = ee8aabca90b0a1ef3e7313691047deee70072512
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/test_fkp13.py)" = 6103c13d2a8ec7ca1444ae2a409a6a2762a7db6f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/README.md)" = 020d3a72e93d98ef3456d1760dfec562c0027681
          python - <<'PY'
          import pathlib,ast,json
          root=pathlib.Path("research/contrib/chatgpt/FKP-13")
          for p in root.glob("*.py"):ast.parse(p.read_text(encoding="utf-8"))
          prereg=json.loads((root/"prereg.json").read_text(encoding="utf-8"))
          assert prereg["budget"]["total_real_actions_max"]==176128
          assert prereg["experiment_id"]=="FKP-13"
          print("FKP13_PREREG_FIRST_AND_STATIC_AST=PASS")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Generate exact-source G29 derived files only
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
      - name: Seal only three source-derived atlas files on same isolated research branch
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-13): source-locked G29 atlas"
          NEW="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "candidate=$NEW" >> "$GITHUB_OUTPUT"
          echo "FKP13_FROZEN_SOURCE_ATLAS_CHILD_SHA=$NEW"

  before-dev-full-cross-platform:
    needs: atlas-only
    if: needs.atlas-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Byte-exact source config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-only.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned real source and fully fitted conventional CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          python - <<'PY'
          import gymnasium,numpy,torch,pygame
          assert gymnasium.__version__=="0.29.0"
          assert numpy.__version__=="1.26.4"
          assert torch.__version__=="2.5.1+cpu"
          assert pygame.version.ver=="2.4.0"
          print("FKP13_CPU_STRONG_CONVENTIONAL_DEPS=PASS")
          PY
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp13-upstream"
          git -C "$RUNNER_TEMP/fkp13-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
          test "$(git -C "$RUNNER_TEMP/fkp13-upstream" rev-parse HEAD)" = a94f2b60d1769ea44df3226561488768e1dff9f4
          test -z "$(git -C "$RUNNER_TEMP/fkp13-upstream" status --porcelain --untracked-files=all)"
      - name: Source-safe 9-arm FKP13 fixture suite, trained recurrent control and G29
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-13 -p test_fkp13.py -v
          python - "$RUNNER_TEMP/fkp13-upstream" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"research/contrib/chatgpt/FKP-13")
          import cohorts
          c=cohorts.custody(Path(sys.argv[1]))
          assert c["source_sha"]==cohorts.SOURCE_SHA
          assert len(cohorts.DEV)==24
          print("FKP13_UNOPENED_DEV_UPSTREAM_CUSTODY=PASS")
          PY
      - name: MANDATORY exact-candidate entire root regression on both platforms before DEV
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/fkp13-upstream" status --porcelain --untracked-files=all)"
          echo FKP13_TWO_OS_FULL_PRE_DEV_ROOT_REGRESSION=PASS

  original-dev-one-shot:
    needs: [atlas-only,before-dev-full-cross-platform]
    if: needs.before-dev-full-cross-platform.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    outputs:
      train_receipt: ${{ steps.eval.outputs.train_receipt }}
      val_receipt: ${{ steps.eval.outputs.val_receipt }}
      blind_receipt: ${{ steps.eval.outputs.blind_receipt }}
      classification: ${{ steps.eval.outputs.classification }}
    steps:
      - name: Prevent shallow Git source ancestry regression
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-only.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned source and neural conventional controls, no paid calls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp13-upstream"
          git -C "$RUNNER_TEMP/fkp13-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
          git cat-file -t 64ed94a8881274c5176ebdfc727a1133f57b83a2
          python -B scripts/build_code_atlas.py --check-if-present
      - name: One high-budget original real closed-loop DEV across nine controllers; nulls preserved
        id: eval
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-13/run_dev.py --public-dev --upstream-root "$RUNNER_TEMP/fkp13-upstream" > "$RUNNER_TEMP/fkp13-original.json"
          python - "$RUNNER_TEMP/fkp13-original.json" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["schema"]=="fkp13.public-dev-closed-loop-consequence.v1"
          assert x["original_public_dev_consumed"] and not x["scientific_pass"]
          assert not x["protected_first_use"] and not x["reserved_transfer_opened"]
          assert not x["accepted_model_modified"] and x["direct_weights_raw_bytes"]==49152
          assert x["source_episodes"]=={"train":96,"validation":32,"development":216}
          assert x["source_actions"]["total"]<=176128
          assert set(x["mean_source_return_by_arm"])=={
              "DIRECT_ONLINE","COUNT_ONLINE","GRU_ONLINE","DIRECT_FROZEN",
              "GRU_FROZEN","MLP_FROZEN","RANDOM","MACRO8","SHUFFLED_FROZEN"}
          assert x["gru_full_training_receipts"]["GRU"]["full_epochs_per_seed"]==24
          assert x["gru_full_training_receipts"]["MLP"]["full_epochs_per_seed"]==24
          def pair_receipts():
              return [[seed,pol,next(r["public_source_sha256"] for r in x["row_metrics"]
                      if r["seed"]==seed and r["arm"]==arm),
                      next(r["steps"] for r in x["row_metrics"]
                      if r["seed"]==seed and r["arm"]==arm)]
                      for seed in range(973500,973524)
                      for pol,arm in (("uniform","RANDOM"),("macro8","MACRO8"))]
          blind=hashlib.sha256(json.dumps(pair_receipts(),sort_keys=True,
                 separators=(",",":")).encode()).hexdigest()
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write("train_receipt="+x["train_source_sha256"]+"\n")
              out.write("val_receipt="+x["validation_source_sha256"]+"\n")
              out.write("blind_receipt="+blind+"\n")
              out.write("classification="+x["classification"]+"\n")
          print("FKP13_PUBLIC_DEV="+json.dumps({k:x[k] for k in (
              "classification","source_actions","pre_dev_model_selection_seal_sha256",
              "best_return_control","mean_source_return_by_arm","positive_progress_by_arm",
              "goal_events_by_arm","direct_return_gain_over_strongest",
              "world_bootstrap_95ci_reselecting_strongest","retention_gate_pass",
              "gru_online_updates","preregistered_dev_action_signal","timing"
          )},sort_keys=True))
          print("FKP13_FROZEN_SOURCE_RECEIPTS="+json.dumps({
              "train":x["train_source_sha256"],
              "validation":x["validation_source_sha256"],
              "source_blind_dev":blind,
              "all_arms_dev":x["development_source_sha256"],
              "direct_cold_end":x["end_direct_snapshot_sha256"]
          },sort_keys=True))
          PY
      - name: Mandatory post-result full regression at same source and no dirty contents
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/fkp13-upstream" status --porcelain --untracked-files=all)"
          echo FKP13_POST_DEV_FULL_ORIGINAL_SOURCE_REGRESSION=PASS

  windows-consumed-replay:
    needs: [atlas-only,original-dev-one-shot]
    if: needs.original-dev-one-shot.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      EXPECT_TRAIN: ${{ needs.original-dev-one-shot.outputs.train_receipt }}
      EXPECT_VAL: ${{ needs.original-dev-one-shot.outputs.val_receipt }}
      EXPECT_BLIND: ${{ needs.original-dev-one-shot.outputs.blind_receipt }}
    steps:
      - name: No implicit CRLF rewrites
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-only.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Same original unmodified public source on Windows
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp13-upstream"
          git -C "$RUNNER_TEMP/fkp13-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
          test "$(git -C "$RUNNER_TEMP/fkp13-upstream" rev-parse HEAD)" = a94f2b60d1769ea44df3226561488768e1dff9f4
      - name: Replay ONLY consumed train/val and source-blind public DEV, no new scientific first-use
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-13/run_dev.py --replay-consumed --upstream-root "$RUNNER_TEMP/fkp13-upstream" > "$RUNNER_TEMP/fkp13-replay.json"
          python - "$RUNNER_TEMP/fkp13-replay.json" <<'PY'
          import hashlib,json,os,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["schema"]=="fkp13.consumed-source-replay.v1"
          assert x["classification"]=="CONSUMED_SOURCE_REPLAY_ONLY"
          assert x["train_source_sha256"]==os.environ["EXPECT_TRAIN"]
          assert x["validation_source_sha256"]==os.environ["EXPECT_VAL"]
          blind=hashlib.sha256(json.dumps(x["source_blind_dev_receipts"],sort_keys=True,
                 separators=(",",":")).encode()).hexdigest()
          assert blind==os.environ["EXPECT_BLIND"]
          assert not x["protected_first_use"] and not x["reserved_transfer_opened"]
          assert not x["scientific_pass"]
          print("FKP13_WINDOWS_SOURCE_AND_POLICY_REPLAY=PASS")
          print("FKP13_WINDOWS_REPLAY_RECEIPTS="+json.dumps({
              "train":x["train_source_sha256"],
              "validation":x["validation_source_sha256"],
              "source_blind_dev":blind,
              "direct_initial_memory":x["direct_snapshot_sha256"]
          },sort_keys=True))
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/fkp13-upstream" status --porcelain --untracked-files=all)"
          echo FKP13_WINDOWS_FINAL_FULL_REGRESSION=PASS
