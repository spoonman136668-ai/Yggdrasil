name: Y077 development-only public decoder qualification
on:
  push:
    branches: [qa/y077-public-decoder-compat-20261014-r1]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen Y076 source and development-only public decoder
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/20261014-y076-sentinel-coverage/execute.py)" = 5213602513cd27fc3f011a6d0085a3098876a2db
          python3 -B research/contrib/chatgpt/20261014-y076-sentinel-coverage/dev_only_decoder_compat.py
