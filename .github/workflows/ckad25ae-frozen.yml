name: CKAD25-AE native real H1 sheaf repair frozen source
on:
  push:
    branches: [research/ckad25ae-k4-scdr-source-repair-20261118]
    paths:
      - ".github/workflows/ckad25ae-frozen.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  disjoint-developer-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve exact source Git blob bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install inherited exact pinned conventional source controls
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Source hash and genuinely independent K4 H1 negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ckad25ae-k4-scdr-source-repair-20261118"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "ab4a592374400562b9faeea975ffa00c9a9575c7"
          test "$(git hash-object tests/test_native_scdr_k4.py)" = "087d3bd77c23f3c3ffda34ae66575566acd037bb"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AE/run.py)" = "0d2ef2212ae7e5c9498844264627ac2f4ae2080c"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AE/prereg.json)" = "85f064ea10cac1b31331fce55f006c5a2e77fcbb"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AB/run.py)" = "3c3d88a66e8fe343bc9fd7fa47c8992343cc4bbb"
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD-25/qualified-development-runs/44331408493")
          a=(root/"linux/stage-02.native.json").read_bytes()
          b=(root/"windows/stage-02.native.json").read_bytes()
          assert a==b and hashlib.sha256(a).hexdigest()=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          for p in ("yggdrasil/native_cumulative_learner.py",
                    "tests/test_native_scdr_k4.py",
                    "research/contrib/chatgpt/CKAD25-AE/run.py"):
              compile(Path(p).read_text(encoding="utf-8"),p,"exec")
          print("CKAD25AE_SOURCE_PINNED_NATIVE_AND_PREREG_PASS")
          PY
          python -B -m unittest discover -s tests -p 'test_native_scdr_k4.py' -v
          python -B -m unittest discover -s tests -p 'test_native_causal_witness.py' -v
          python -B -m unittest discover -s tests -p 'test_native_causal_active_history.py' -v
          python -B research/contrib/chatgpt/CKAD25-AE/run.py --preflight
          test -z "$(git status --porcelain)"
          echo "CKAD25AE_DISJOINT_NATIVE_SCDR_SOURCE_PREFLIGHT_PASS"

  prospective-original-first-use:
    needs: [disjoint-developer-preflight]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve source-bounded original science bytes across OS
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install inherited exact pinned dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Freeze original first-use model/source/seed/held gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "ab4a592374400562b9faeea975ffa00c9a9575c7"
          test "$(git hash-object tests/test_native_scdr_k4.py)" = "087d3bd77c23f3c3ffda34ae66575566acd037bb"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AE/run.py)" = "0d2ef2212ae7e5c9498844264627ac2f4ae2080c"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AE/prereg.json)" = "85f064ea10cac1b31331fce55f006c5a2e77fcbb"
          test ! -e research/contrib/chatgpt/CKAD25-AE/result.json
          test -z "$(git status --porcelain)"
          echo "CKAD25AE_FROZEN_ORIGINAL_FIRST_USE_SOURCE_LOCK_PASS"
      - name: Exactly one prospective original thirty-two-seed native experiment
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-AE/run.py --output "$RUNNER_TEMP/ckad25ae-result.json"
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ["RUNNER_TEMP"])/"ckad25ae-result.json"
          raw=r.read_bytes()
          d=json.loads(raw)
          assert d["schema"]=="yggdrasil.ckad25ae.source-backed-K4-H1-repair.v1"
          assert d["fresh_seeds"]==[81503,81517,81533,81551,81569,81587,81607,81623,81643,81659,81677,81697,81713,81731,81749,81769,81787,81803,81817,81839,81853,81869,81883,81901,81919,81937,81953,81971,81989,82003,82021,82037]
          assert d["scored_original_primary"] is True
          assert d["independent_source_actions"]==7552
          assert d["policy_world_episodes"]==800 and d["distinct_true_edge_labels"]==960
          assert d["conditional_held_edge_predictions"]==4800
          assert d["no_latent_vertex_labels_passed_to_native"] is True
          assert d["original_observed_negative_edges_immutable"] is True
          assert d["inferred_native_sheaf_restriction_maps"] is False
          assert d["source_free_synthetic_only"] is True
          assert d["frozen_gates"]["native_source_cold_and_old_causal_knowledge_retained"] is True
          assert d["frozen_gates"]["full_independent_conventional_k4_repair_parity"] is True
          assert d["scientific_pass"] is False and d["algorithmic_superiority"] is False
          assert d["universal_safety"] is False and d["owner_science_first_use"] is False
          assert d["accepted_main_changed"] is False and d["forge_dispatch"] is False
          assert d["merge"] is False and d["deployment"] is False
          assert d["executed_source_sha256"]==hashlib.sha256(Path("research/contrib/chatgpt/CKAD25-AE/run.py").read_bytes()).hexdigest()
          print("CKAD25AE_ORIGINAL_SOURCE_MODEL_AND_SAFETY_AUDIT_PASS")
          print("CKAD25AE_ORIGINAL_RESULT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("CKAD25AE_FROZEN_DEVELOPMENT="+d["development_disposition"])
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25ae-original-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25ae-result.json
          if-no-files-found: error
          retention-days: 60
