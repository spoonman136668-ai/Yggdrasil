name: Yggdrasil Y035 frozen heterogeneous repair selectivity
on:
  push:
    branches: [research/y035-heterogeneous-repair-falsification-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze identity and validate source without scientific run
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 08ab3be3bd28516b094084cc5722bf16876af7de HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-feedback-repair/execute.py)" = 4d682dc3835ad88fbf71593295d7461c3745559b
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-repair-selectivity/prereg.json)" = 8c9c218e8156f73e67f898eaafe9ae1af3ff476f
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-repair-selectivity/execute.py)" = 633daf46bcea2844a594cd9dff2f1fa8a3bce318
          python3 -m json.tool research/contrib/chatgpt/20261013-y035-repair-selectivity/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y035-repair-selectivity/execute.py
      - name: Original Y035 frozen heterogeneous-drift falsification
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y035-repair-selectivity/execute.py > /tmp/Y035-original.json
          python3 -m json.tool /tmp/Y035-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y035-original-heterogeneous-repair
          path: /tmp/Y035-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
