name: DG1-HC05 Information-Seeking Causal Interventions DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-hc05-20261113/**'
      - '.github/workflows/dg1-hc05-source-dev.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile frozen candidate and physical evaluator
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-hc05-20261113/model.py
          python -m py_compile research/contrib/chatgpt/dg1-hc05-20261113/eval_dev.py
      - name: Focused mechanism, custody and negative-control tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-hc05-20261113 -p "test_*.py" -v
      - name: Frozen public source-only intervention DEV (do not promote)
        run: python research/contrib/chatgpt/dg1-hc05-20261113/eval_dev.py > hc05-result.json
      - name: Emit bounded DEV verdict, preserving negative outcome
        run: python -c "import json; r=json.load(open('hc05-result.json')); print(r['classification'], 'main',r['stationary_main_pass'],'routing',r['routing_pass'],'OOD_confident_errors',r['out_of_grammar_confident_wrong'],'conventional_tie',r['equal_algorithmic_conventional_control_tied']); print(r['cohort_accuracy'])"
      - name: Preserve complete per-seed action ledgers and frozen metric artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc05-dev-evidence-${{ matrix.os }}
          path: hc05-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Mandatory full inherited Python repository regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Pinned G29 source atlas and source graph
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Clean git source
        run: git diff --exit-code
      - name: Build exact source G29 atlas for immutable custody
        if: always() && matrix.os == 'ubuntu-latest'
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
      - name: Emit bounded exact-source G29 chunks for final three-file commit
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for ext in ('json', 'html', 'ice'):
              raw = Path('.ice/code-atlas.' + ext).read_bytes()
              print('DG1_HC05_ATLAS_START:' + ext + ':' + str(len(raw)))
              b64 = base64.b64encode(raw).decode('ascii')
              for offset in range(0, len(b64), 4096):
                  print('DG1_HC05_ATLAS_CHUNK:' + ext + ':' + b64[offset:offset+4096])
              print('DG1_HC05_ATLAS_END:' + ext)
          PY
      - name: Archive exact-head generated atlas
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc05-g29-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: warn
          retention-days: 7
