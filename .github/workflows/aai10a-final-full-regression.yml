name: AAI-10A final source-pinned full regression (NO science first use)
on:
  push:
    branches: [research/aai10a-exact-final-qualification-20261114]
    paths: [.github/workflows/aai10a-final-full-regression.yml]
permissions:
  contents: read
concurrency:
  group: aai10a-final-full-regression-20261114
  cancel-in-progress: false
jobs:
  exact-final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10A exact-source final full qualification one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout independent read-only one-shot qualification harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - name: Exact harness isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10a-final-full-regression.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI10A_FINAL_HARNESS_ISOLATION_PASS
      - name: Checkout qualified candidate source at immutable exact PR SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 64a585010e13519c6290cc8c406154e1f23b9e78
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact head, prereg, benchmark, model and code atlas custody
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '64a585010e13519c6290cc8c406154e1f23b9e78'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai10p-compositional-causal-intervention-20261114 | cut -f1)" = '1deeb328abc478949b6d528e5cd2775c72021150'
          test "$(git ls-remote origin refs/heads/research/aai10a-operator-association-learner-20261114 | cut -f1)" = '64a585010e13519c6290cc8c406154e1f23b9e78'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/prereg.json)" = 'a3ab22f7bed1d7a3510ab32af8f661d0d0e92643'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/prereg.json)" = "$(git rev-parse c7e5914d31f488660cbef326a4b04cdbf5adae5e:research/contrib/chatgpt/AAI-10A/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/models.py)" = '9233ffaafe2f227de687116b0ed4204ee4e2b3a2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/test_models.py)" = '99d36fd8d6c08ffa0b08fd3396943df54ce0d3e2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/source_only.py)" = 'f0abb76d768aa84229ebba662676a929ad55ada2'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI10A_FINAL_FROZEN_SOURCE_AND_ATLAS_PASS
      - name: MANDATORY full original regression, benchmark and candidate focused suites
        shell: bash
        working-directory: candidate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10P -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10A -p 'test_*.py' -v
          python -B research/contrib/chatgpt/AAI-10P/benchmark.py --mechanical
          python -B research/contrib/chatgpt/AAI-10A/source_only.py --source-only > "$RUNNER_TEMP/aai10a-source-only.json"
          grep -F '"source_trace_sha256": "e11bee589cd88c1708a68843e11f74ee91ad7dcc90d06af3361f495cea4f2f4a"' "$RUNNER_TEMP/aai10a-source-only.json"
          if python -B research/contrib/chatgpt/AAI-10A/source_only.py --primary >/dev/null 2>&1; then
            echo AAI10A_FIRST_USE_FENCE_FAILED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          git diff --exit-code
          echo AAI10A_FINAL_FULL_SOURCE_AND_CROSS_OS_TRACE_PASS
