name: Direct ACE03-XFER01 nonstudy engineering qualification
on:
  push:
    branches: [research/ace03-sequential-contract-dev-20261124]
    paths:
      - '.github/workflows/direct-research-qualification.yml'
permissions:
  contents: read
concurrency:
  group: yggdrasil-direct-research-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Yggdrasil' && github.actor == 'spoonman136668-ai' && github.ref == 'refs/heads/research/ace03-sequential-contract-dev-20261124' && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout exact isolated qualification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify exact candidate custody and runner runtime
        run: |
          $ErrorActionPreference='Stop'
          $base='fd7a9557bddb472ed7c228ce6e78ed55f698851e'
          $tree='c4c5d94433725fcbbe2f7a60c4d76944ad9a9ff5'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'HEAD_DRIFT'}
          if((git rev-parse 'HEAD^').Trim() -cne $base){throw 'PARENT_DRIFT'}
          if((git rev-parse "$base^{tree}").Trim() -cne $tree){throw 'PARENT_TREE_DRIFT'}
          $delta=@(git diff --name-only $base HEAD)
          $allowed=@('.github/workflows/direct-research-qualification.yml','research/contrib/chatgpt/ACE03-WSCM-CONTROL/test_shared_count_control.py') | Sort-Object
          if((($delta | Sort-Object) -join '|') -cne ($allowed -join '|')){throw 'SCOPE_DRIFT'}
          if(@(git status --porcelain --untracked-files=all).Count){throw 'DIRTY_CHECKOUT'}
          $py='C:\ProgramData\CKBR\research-sidecar-yggdrasil\python312\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'NATIVE_RUNTIME_MISSING'}
          & $py -B -c "import sys,platform; print(sys.version); print(platform.platform()); assert sys.platform=='win32'"
          if($LASTEXITCODE -ne 0){throw 'RUNTIME_INVALID'}
          "ACE_PYTHON=$py" >> $env:GITHUB_ENV
          Write-Output "ACE_MODEL_PARENT=$base"
          Write-Output "ACE_MODEL_TREE=$tree"
          Write-Output "ACE_QUAL_SHA=$env:GITHUB_SHA"
          $headTree=(git rev-parse 'HEAD^{tree}').Trim()
          Write-Output "ACE_QUAL_TREE=$headTree"
          Write-Output 'REGISTERED_WORLDS=0'
      - name: All ACE03 engineering fixtures normal and optimized
        run: |
          $ErrorActionPreference='Stop'
          $p='research/contrib/chatgpt/ACE03-SEQUENTIAL-DEV'
          $q='research/contrib/chatgpt/ACE03-WSCM-CONTROL'
          foreach($mode in @('normal','optimized')){
            $flags=@('-B')
            if($mode -eq 'optimized'){$flags+= '-O'}
            foreach($dir in @($p,$q)){
              Write-Output "ACE_TEST_MODE=$mode DIRECTORY=$dir"
              & $env:ACE_PYTHON @flags -m unittest discover -s $dir -p 'test_*.py' -v
              if($LASTEXITCODE -ne 0){throw "ACE_TEST_FAILED mode=$mode dir=$dir"}
            }
          }
      - name: Matched full-size nonstudy benchmark and cold identity
        run: |
          $ErrorActionPreference='Stop'
          $code=@'
          import json, pathlib, statistics, sys, time
          from unittest.mock import patch
          p=pathlib.Path('research/contrib/chatgpt/ACE03-SEQUENTIAL-DEV').resolve()
          sys.path.insert(0,str(p))
          import transfer_prior as t
          from adaptive_contract import State
          from study_worker import execute_explicit, verify_pair, worker
          from transfer_study_eval import ARMS
          if pathlib.Path(t.__file__).resolve().parent != p:
              raise RuntimeError('import custody')
          held=tuple(range(384,512))
          phases=[dict(phase=i,events=[(k,j%384,(1,0,1,0)) for j in range(n)],
                       a_law=[[5]*4 for _ in held],c_law=[[5]*4 for _ in held],
                       negative_key=2)
                  for i,(k,n) in enumerate(((0,1024),(1,1024),(0,512),(2,256)))]
          for arm in ARMS:
              task=(1,'fixture',arm,False)
              a=execute_explicit(task,held,phases,False,time.monotonic()+60)
              b=execute_explicit(task,held,phases,True,time.monotonic()+60)
              verify_pair(a,b)
              if not (a['cold_identity'] and b['cold_identity'] and a['cursor']==2816):
                  raise RuntimeError('fixture identity')
              print('ACE_ARM='+json.dumps(dict(arm=arm,compute=a['compute_seconds'],
                    wall=a['wall_seconds'],rss=a['peak_rss_bytes'],
                    traced_peak=b['traced_peak_bytes'],cold_identity=True)),flush=True)
          req=dict(arm='candidate',seed=1,traced=False,held=held,phases=phases,
                   checkpoint=None,expected_before=None,expected_cursor=0)
          def legacy(rows):
              return [State.unpack(a.pack()) for a in rows]
          fast=t.clone
          timings={'legacy':[],'optimized':[]}
          identity=None
          for mode in ('legacy','optimized','optimized','legacy'):
              with patch.object(t,'clone',legacy if mode=='legacy' else fast):
                  result=worker(req)
              observed=(result['checkpoint'],result['reports'])
              if identity is None:
                  identity=observed
              elif identity!=observed:
                  raise RuntimeError('legacy/optimized full-size parity')
              timings[mode].append(result['compute_seconds'])
          med={k:statistics.median(v) for k,v in timings.items()}
          print('ACE_MATCHED='+json.dumps(dict(samples=timings,medians=med,
                 legacy_over_optimized=med['legacy']/med['optimized'],
                 exact_parity=True,registered_worlds=0)),flush=True)
          '@
          $code | & $env:ACE_PYTHON -B -
          if($LASTEXITCODE -ne 0){throw 'ACE_BENCHMARK_FAILED'}
      - name: Verify final source unchanged
        if: always()
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'FINAL_SHA_DRIFT'}
          if(@(git status --porcelain --untracked-files=all).Count){throw 'FINAL_DIRTY'}
          Write-Output 'NONSTUDY_ONLY_NO_PROMOTION_NO_FULL_REGRESSION_CLAIM'
