name: Direct Yggdrasil research qualification — Stage 7 preflight only
on:
  push:
    branches:
      - research/stage7-capacity-runner-preflight
    paths:
      - '.github/workflows/direct-research-qualification.yml'

permissions:
  contents: read

concurrency:
  group: yggdrasil-direct-research-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 15
    steps:
      - name: Require byte-stable runner and exact research scope
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -cne 'research/stage7-capacity-runner-preflight'){throw 'RESEARCH_BRANCH_MISMATCH'}
          if((git config --global --get core.autocrlf) -ne 'false'){throw 'BYTE_STABLE_GIT_NOT_CONFIGURED'}
          Write-Host 'STAGE7_PREFLIGHT_ONLY_NO_PRIMARY'
      - name: Checkout immutable Stage 7 candidate
        uses: actions/checkout@v4
        with:
          ref: 892dbd16f008d5fe9719dc18cd6fe9a898bdf177
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Checkout immutable original corpus
        uses: actions/checkout@v4
        with:
          ref: 5e74f8db85b2f5839c42148c0dfba69a88b1a2c9
          path: corpus
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Verify exact source, runtime and corpus; focused non-primary checks
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          $Py='C:\ProgramData\CKBR\research-sidecar-yggdrasil\python312\python.exe'
          if(-not(Test-Path -LiteralPath $Py -PathType Leaf)){throw 'PYTHON_RUNTIME_MISSING'}
          $Candidate=(Resolve-Path 'candidate').Path
          $Corpus=(Resolve-Path 'corpus').Path
          if((git -C $Candidate rev-parse HEAD).Trim() -cne '892dbd16f008d5fe9719dc18cd6fe9a898bdf177'){throw 'CANDIDATE_SHA_MISMATCH'}
          if((git -C $Candidate rev-parse 'HEAD^{tree}').Trim() -cne 'b63c664ce049f10d045f3a258ed55777365d1b21'){throw 'CANDIDATE_TREE_MISMATCH'}
          if((git -C $Corpus rev-parse HEAD).Trim() -cne '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'){throw 'CORPUS_SHA_MISMATCH'}
          if((git -C $Corpus rev-parse 'HEAD^{tree}').Trim() -cne '180008502f6bdfe5a06c3d0d6f47f941dd01f20b'){throw 'CORPUS_TREE_MISMATCH'}
          if((git -C $Candidate status --porcelain)-join''){throw 'CANDIDATE_DIRTY'}
          if((git -C $Corpus status --porcelain)-join''){throw 'CORPUS_DIRTY'}
          $env:STAGE7_CORPUS=$Corpus
          Push-Location $Candidate
          try {
            $Source='experiments/procedural_event_stage7_capacity.py'
            $Test='tests/test_procedural_event_stage7.py'
            if((git rev-parse "HEAD:$Source").Trim() -cne '3a9a830ba4e1f10e87bc313c7c44396e72bc6877'){throw 'SOURCE_BLOB_MISMATCH'}
            if((git rev-parse "HEAD:$Test").Trim() -cne 'a26abc0c2a7f38df86ddefc681630299264bf63a'){throw 'TEST_BLOB_MISMATCH'}
            if((Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'af248220dd3b16f1a736492566f695f7b612d74d2049c51643a493156a7fe4b8'){throw 'SOURCE_BYTES_MISMATCH'}
            if(Test-Path -LiteralPath 'research/contrib/chatgpt/stage7-capacity/result.json'){throw 'PRIMARY_EVIDENCE_PRESENT'}
            & $Py -B -c "import sys,torch; print('python='+sys.version); print('torch='+torch.__version__); print('threads='+str(torch.get_num_threads())); assert torch.get_num_threads()==1"
            if($LASTEXITCODE-ne0){throw 'STAGE7_RUNTIME_PREFLIGHT_FAILED'}
            & $Py -B -c "import os; from pathlib import Path; from experiments.procedural_event_stage7_capacity import corpus; tr,va=corpus(Path(os.environ['STAGE7_CORPUS'])); assert (tr.numel(),va.numel())==(78268,19568); print('STAGE7_CORPUS_HASHES=PASS')"
            if($LASTEXITCODE-ne0){throw 'STAGE7_CORPUS_PREFLIGHT_FAILED'}
            # Run the frozen positive test directly; mirror the frozen missing-corpus
            # negative with stdlib exception handling, without changing shared Python.
            $Focused = @'
          import runpy
          import tempfile
          from pathlib import Path
          from experiments.procedural_event_stage7_capacity import corpus
          tests = runpy.run_path("tests/test_procedural_event_stage7.py")
          tests["test_factor_identity_and_gradient"]()
          print("STAGE7_FROZEN_FACTOR_IDENTITY_AND_GRADIENT=PASS")
          with tempfile.TemporaryDirectory() as tmp:
              try:
                  corpus(Path(tmp))
              except FileNotFoundError:
                  print("STAGE7_MISSING_CORPUS_REFUSAL=PASS")
              else:
                  raise AssertionError("missing corpus was accepted")
          print("STAGE7_FOCUSED_DIRECT_CHECKS=2/2; PYTEST_SUITE_NOT_EXECUTED")
          '@
            $Focused | & $Py -B -
            if($LASTEXITCODE-ne0){throw 'STAGE7_FOCUSED_TEST_FAILED'}
            if(Test-Path -LiteralPath 'research/contrib/chatgpt/stage7-capacity/result.json'){throw 'UNEXPECTED_PRIMARY_EVIDENCE'}
            if((git status --porcelain)-join''){throw 'CANDIDATE_MUTATED'}
            Write-Host 'STAGE7_PREFLIGHT=PASS PRIMARY_TRAINING=NOT_STARTED'
          } finally { Pop-Location }
