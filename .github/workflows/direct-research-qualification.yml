name: Direct U-JEPA UJ-03A launch correction
on:
  push:
    branches: [dev/ujepa-uj03a-aqua-pilot]
    paths:
      - '.github/workflows/direct-research-qualification.yml'
      - '.ice/code-atlas.json'
      - '.ice/code-atlas.html'
      - '.ice/code-atlas.ice'
permissions:
  contents: read
concurrency:
  group: yggdrasil-direct-research-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Yggdrasil' && github.actor == 'spoonman136668-ai' && github.ref == 'refs/heads/dev/ujepa-uj03a-aqua-pilot' && github.run_attempt == 1
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 65
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout exact isolated qualification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify source custody and runner runtime
        id: custody
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $baseline='25caa29e0667a38f2ae258403a5d0f3c6e4ffce7'
          $baseTree='3500baf08f711189aff2c23b9317e08f949cae0e'
          $head=(git rev-parse HEAD).Trim()
          if($head -cne $env:GITHUB_SHA){throw 'CHECKOUT_SHA_MISMATCH'}
          if((git rev-parse "$baseline^{tree}").Trim() -cne $baseTree){throw 'BASELINE_TREE_MISMATCH'}
          $workflow='.github/workflows/direct-research-qualification.yml'
          $p='research/contrib/ujepa/uj-01'
          $expected=@($workflow,"$p/UJ03A-launch-failure.md") | Sort-Object
          $atlas=@('.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json')
          $parent=(git rev-parse 'HEAD^').Trim()
          $delta=@(git diff --name-only $parent HEAD | Sort-Object)
          if($parent -ceq $baseline -and ($delta -join '|') -ceq ($expected -join '|')){
            $phase='prepare'
            $anchor=$head
          } elseif((git rev-parse "$parent^").Trim() -ceq $baseline -and ($delta -join '|') -ceq ($atlas -join '|') -and (@(git diff --name-only $baseline $parent | Sort-Object) -join '|') -ceq ($expected -join '|')){
            $phase='qualify'
            $anchor=$parent
          } else {throw 'UNEXPECTED_UJ03A_TRANSITION'}
          "phase=$phase" >> $env:GITHUB_OUTPUT
          "UJ_ATLAS_ANCHOR=$anchor" >> $env:GITHUB_ENV
          Write-Output "UJ_PHASE=$phase"
          if(@(git status --porcelain --untracked-files=all).Count){throw 'DIRTY_CHECKOUT'}
          $py='C:\ProgramData\CKBR\research-sidecar-yggdrasil\python312\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'NATIVE_RUNTIME_MISSING'}
          & $py -B -c "import sys, torch; print(sys.version); print('torch='+torch.__version__)"
          if($LASTEXITCODE -ne 0){throw 'NATIVE_RUNTIME_INVALID'}
          "UJ_PYTHON=$py" >> $env:GITHUB_ENV
          Write-Output "UJ_BASELINE_SHA=$baseline"
          Write-Output "UJ_BASELINE_TREE=$baseTree"
          Write-Output "UJ_QUALIFICATION_SHA=$head"
          $headTree=(git rev-parse 'HEAD^{tree}').Trim()
          if($LASTEXITCODE -ne 0 -or $headTree -notmatch '^[0-9a-f]{40}$'){throw 'QUALIFICATION_TREE_INVALID'}
          Write-Output "UJ_QUALIFICATION_TREE=$headTree"
          Write-Output 'PROTECTED_SCIENTIFIC_FIRST_USE=FALSE'
      - name: Native package import and focused native regressions
        if: steps.custody.outcome == 'success'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          & $env:UJ_PYTHON -B -c "import sys,pathlib,runpy; root=pathlib.Path.cwd().resolve(); sys.path.insert(0,str(root)); import yggdrasil.public_causal_cells as m; assert pathlib.Path(m.__file__).resolve()==root/'yggdrasil'/'public_causal_cells.py'; print('NATIVE_PACKAGE_SOURCE=PASS'); runpy.run_module('unittest',run_name='__main__')" discover -s tests -p 'test_native_cells*.py' -v
          if($LASTEXITCODE -ne 0){throw 'NATIVE_FOCUSED_REGRESSION_FAILED'}
      - name: UJ-03A focused fabricated-data fixtures
        if: steps.custody.outcome == 'success'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          & $env:UJ_PYTHON -B -m unittest discover -s research/contrib/ujepa/uj-01 -p 'test_uj03a_pilot.py' -v
          if($LASTEXITCODE -ne 0){throw 'UJ03A_FIXTURES_FAILED'}
      - name: Verify exact training launcher before data access
        if: steps.custody.outcome == 'success'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          & $env:UJ_PYTHON -B -c "import sys,pathlib,runpy; p=pathlib.Path('research/contrib/ujepa/uj-01').resolve(); sys.path.insert(0,str(p)); import learned_jepa,pair_controls,anchor_adapter,anchor_loss,bounded_train,grounded_eval,checkpoint,symbolic_control; assert all(pathlib.Path(m.__file__).resolve().parent==p for m in (learned_jepa,pair_controls,anchor_adapter,anchor_loss,bounded_train,grounded_eval,checkpoint,symbolic_control)); runpy.run_path(str(p/'uj03a_pilot.py'),run_name='__main__')" --help
          if($LASTEXITCODE -ne 0){throw 'UJ03A_LAUNCH_PREFLIGHT_FAILED'}
          Write-Output 'UJ03A_LAUNCH_PREFLIGHT_PASS_NO_DATA'
      - name: Generate frozen atlas for exact committed source
        if: steps.custody.outputs.phase == 'prepare'
        run: |
          $ErrorActionPreference='Stop'
          & $env:UJ_PYTHON -B scripts/build_code_atlas.py --source-commit $env:UJ_ATLAS_ANCHOR --write
          if($LASTEXITCODE -ne 0){throw 'ATLAS_GENERATION_FAILED'}
          $expected=@('.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json')
          $changed=@(git diff --name-only | Sort-Object)
          if(($changed -join '|') -cne ($expected -join '|')){throw 'ATLAS_OUTPUT_SCOPE_DRIFT'}
          if(@(git ls-files --others --exclude-standard).Count){throw 'UNTRACKED_OUTPUT'}
          foreach($path in $expected){
            $bytes=[IO.File]::ReadAllBytes((Join-Path (Get-Location) $path))
            $blob=(git hash-object --no-filters -- $path).Trim()
            $hash=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $encoded=[Convert]::ToBase64String($bytes)
            Write-Output "UJ_ATLAS_FILE=$path SIZE=$($bytes.Length) BLOB=$blob SHA256=$hash"
            for($i=0;$i -lt $encoded.Length;$i+=2048){
              $chunk=$encoded.Substring($i,[Math]::Min(2048,$encoded.Length-$i))
              Write-Output "UJ_ATLAS_CHUNK=$path OFFSET=$i DATA=$chunk"
            }
          }
          Write-Output 'ATLAS_PREPARE_ONLY_NO_FULL_REGRESSION_CLAIM'
      - name: Full repository regression including original atlas gate
        if: steps.custody.outputs.phase == 'qualify'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          & $env:UJ_PYTHON -B scripts/build_code_atlas.py --source-commit $env:UJ_ATLAS_ANCHOR --check
          if($LASTEXITCODE -ne 0){throw 'PINNED_ATLAS_CHECK_FAILED'}
          & $env:UJ_PYTHON -B -c "import sys,pathlib,runpy; sys.path.insert(0,str(pathlib.Path.cwd().resolve())); runpy.run_module('unittest',run_name='__main__')" discover -s tests -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'FULL_REPOSITORY_REGRESSION_FAILED'}
      - name: All U-JEPA development fixtures and syntax build
        if: always() && steps.custody.outputs.phase == 'qualify'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          & $env:UJ_PYTHON -B -m unittest discover -s research/contrib/ujepa/uj-01 -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'UJ_FULL_FIXTURES_FAILED'}
          & $env:UJ_PYTHON -B -c "import pathlib; paths=list(pathlib.Path('research/contrib/ujepa/uj-01').glob('*.py')); [compile(p.read_bytes(),str(p),'exec') for p in paths]; print('UJ_SYNTAX_BUILD_FILES='+str(len(paths)))"
          if($LASTEXITCODE -ne 0){throw 'UJ_SYNTAX_BUILD_FAILED'}
      - name: Verify final tracked source unchanged
        if: always() && steps.custody.outputs.phase == 'qualify'
        run: |
          $ErrorActionPreference='Stop'
          if(@(git status --porcelain --untracked-files=all).Count){throw 'QUALIFICATION_MUTATED_SOURCE'}
          Write-Output 'UJ_SOURCE_UNCHANGED'
          Write-Output 'SCIENTIFIC_FIRST_USE=FALSE'
      - name: Acquire exact AQuA TRAIN only and execute one bounded DEV pilot
        if: success() && steps.custody.outputs.phase == 'qualify'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ("uj03a-launch-correction-"+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){throw 'TRIAL_PATH_ALREADY_EXISTS_NO_REPLAY'}
          New-Item -ItemType Directory -Path $root | Out-Null
          $data=Join-Path $root 'train.json'
          $url='https://raw.githubusercontent.com/google-deepmind/AQuA/26b64ed1f22208c6742f47df547dfd65088ec30d/train.json'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $data -TimeoutSec 120 -MaximumRedirection 0
          if((Get-Item -LiteralPath $data).Length -ne 47570935){throw 'TRAIN_SIZE_MISMATCH'}
          $blob=(git hash-object --no-filters -- $data).Trim()
          if($LASTEXITCODE -ne 0 -or $blob -cne 'a805bddefde8d70fdb66ff7ab85a1999bdc3eece'){throw 'TRAIN_BLOB_MISMATCH'}
          $hash=(Get-FileHash -LiteralPath $data -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -cne '35b70c7cb1660c34d302bb932dfd3656ce3d05e8c982c797767fec31d7d1e0ba'){throw 'TRAIN_HASH_MISMATCH'}
          Write-Output "UJ03A_DEV_TRIAL_STARTED=$env:GITHUB_RUN_ID"
          Write-Output 'PRIOR_RUN_45415819688_IMPORT_ABORT_ZERO_MODEL_OBSERVATIONS'
          & $env:UJ_PYTHON -B -c "import sys,pathlib,runpy; p=pathlib.Path('research/contrib/ujepa/uj-01').resolve(); sys.path.insert(0,str(p)); import learned_jepa,pair_controls,anchor_adapter,anchor_loss,bounded_train,grounded_eval,checkpoint,symbolic_control; assert all(pathlib.Path(m.__file__).resolve().parent==p for m in (learned_jepa,pair_controls,anchor_adapter,anchor_loss,bounded_train,grounded_eval,checkpoint,symbolic_control)); runpy.run_path(str(p/'uj03a_pilot.py'),run_name='__main__')" --train $data --source-sha $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'UJ03A_PILOT_FAILED_NO_REPLAY'}
          if(@(git status --porcelain --untracked-files=all).Count){throw 'PILOT_MUTATED_SOURCE'}
          Write-Output 'UJ03A_DEV_TRIAL_COMPLETE_NO_SCIENTIFIC_PROMOTION'
