name: Direct Yggdrasil research qualification

on:
  push:
    branches:
      - research/direct-ygg-032-state-floor64
    paths:
      - 'research/applications/plane/**'
      - '.yggdrasil/**'

permissions:
  contents: write

concurrency:
  group: yggdrasil-direct-research-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 90
    steps:
      - name: Checkout exact active branch
        uses: actions/checkout@v4
        with:
          ref: research/direct-ygg-032-state-floor64
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate frozen package
        id: frozen
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Branch='research/direct-ygg-032-state-floor64'
          $QPath='.yggdrasil/qualification-request.json'
          $RPath='.yggdrasil/isolated-run.json'
          foreach($P in @($QPath,$RPath)){if(-not(Test-Path -LiteralPath $P -PathType Leaf)){throw "REQUEST_MISSING path=$P"}}
          $Q=Get-Content -Raw -LiteralPath $QPath|ConvertFrom-Json
          $R=Get-Content -Raw -LiteralPath $RPath|ConvertFrom-Json
          if([string]$Q.schema-cne'yggdrasil.research-qualification-request.v1'){throw 'QUALIFICATION_SCHEMA_INVALID'}
          if([string]$Q.branch-cne$Branch){throw 'QUALIFICATION_BRANCH_MISMATCH'}
          if([string]$Q.baseline_sha-notmatch'^[0-9a-f]{40}$'){throw 'QUALIFICATION_BASELINE_INVALID'}
          if([string]$Q.experiment-notmatch'^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'){throw 'QUALIFICATION_EXPERIMENT_INVALID'}
          if([string]$Q.source-notmatch'^research/applications/plane/[A-Za-z0-9._/-]+\.py$'){throw 'QUALIFICATION_SOURCE_INVALID'}
          if([string]$Q.isolated_run_path-cne$RPath){throw 'QUALIFICATION_RUN_PATH_INVALID'}
          if([int]$R.schema-ne1){throw 'ISOLATED_RUN_SCHEMA_INVALID'}
          if([string]$R.request_id-cne[string]$Q.experiment){throw 'ISOLATED_RUN_REQUEST_ID_MISMATCH'}
          if([string]$R.source-cne[string]$Q.source){throw 'ISOLATED_RUN_SOURCE_MISMATCH'}
          if([int]$R.timeout_seconds-lt1 -or [int]$R.timeout_seconds-gt1800){throw 'ISOLATED_RUN_TIMEOUT_INVALID'}
          if(@($R.open_args).Count-ne0){throw 'ISOLATED_RUN_OPEN_ARGS_FORBIDDEN'}
          if(@(@($R.run_args)|Where-Object{[string]$_-ceq'{out}'}).Count-ne1){throw 'ISOLATED_RUN_OUT_ARG_REQUIRED'}

          $Head=(git rev-parse HEAD).Trim()
          $Baseline=[string]$Q.baseline_sha
          git merge-base --is-ancestor $Baseline $Head
          if($LASTEXITCODE-ne0){throw "BASELINE_ANCESTRY_FAILED baseline=$Baseline head=$Head"}
          $Commits=@(git rev-list --reverse "$Baseline..$Head"|Where-Object{$_ -and $_.Trim()})
          if($Commits.Count-ne3){throw "DIRECT_COMMIT_COUNT_INVALID count=$($Commits.Count)"}
          $FirstFiles=@(git diff-tree --no-commit-id --name-only -r $Commits[0]|Where-Object{$_ -and $_.Trim()})
          if($FirstFiles.Count-ne1 -or -not$FirstFiles[0].StartsWith('research/experiments/')){throw "PREREG_NOT_FIRST_AND_ALONE files=$($FirstFiles -join ',')"}
          $PreregPath=[string]$FirstFiles[0]
          $WorkflowPath='.github/workflows/direct-research-qualification.yml'
          $SecondFiles=@(git diff-tree --no-commit-id --name-only -r $Commits[1]|Where-Object{$_ -and $_.Trim()})
          if($SecondFiles.Count-ne1 -or [string]$SecondFiles[0]-cne$WorkflowPath){throw "INFRA_NOT_SEPARATE files=$($SecondFiles -join ',')"}
          $Prereg=Get-Content -Raw -LiteralPath $PreregPath|ConvertFrom-Json
          if([string]$Prereg.experiment_id-cne[string]$Q.experiment){throw 'PREREG_EXPERIMENT_MISMATCH'}
          if([string]$Prereg.exact_parent_sha-cne$Baseline){throw 'PREREG_PARENT_MISMATCH'}
          if([string]$Prereg.north_star_sha256-cne'3cd3b3d2fdbbb5b3541d433a527231b38fc441699cd0353fa86f0c3be6f0a905'){throw 'PREREG_NORTH_STAR_IDENTITY_MISMATCH'}

          $Allowed=@($PreregPath,$WorkflowPath,[string]$Q.source,$QPath,$RPath)
          $AllFiles=@()
          foreach($C in $Commits){$AllFiles+=@(git diff-tree --no-commit-id --name-only -r $C|Where-Object{$_ -and $_.Trim()})}
          foreach($F in $AllFiles){if($Allowed-notcontains[string]$F){throw "CHANGE_OUTSIDE_FROZEN_PACKAGE path=$F"}}
          $LastFiles=@(git diff-tree --no-commit-id --name-only -r $Commits[-1]|Where-Object{$_ -and $_.Trim()})
          foreach($Need in @([string]$Q.source,$QPath,$RPath)){if($LastFiles-notcontains$Need){throw "FINAL_COMMIT_MISSING path=$Need"}}

          $North='research/architecture/yggdrasil-north-star.ice'
          $Text=[IO.File]::ReadAllText((Resolve-Path $North))
          $Normalized=$Text.Replace("`r`n","`n").Replace("`r","`n")
          $Bytes=(New-Object Text.UTF8Encoding($false)).GetBytes($Normalized)
          $Sha=[Security.Cryptography.SHA256]::Create()
          try{$NorthHash=([BitConverter]::ToString($Sha.ComputeHash($Bytes))).Replace('-','').ToLowerInvariant()}finally{$Sha.Dispose()}
          if($NorthHash-cne[string]$Prereg.north_star_sha256){throw "NORTH_STAR_HASH_MISMATCH actual=$NorthHash"}

          $Source=[string]$Q.source
          if(-not(Test-Path -LiteralPath $Source -PathType Leaf)){throw "SOURCE_MISSING path=$Source"}
          $SourceText=Get-Content -Raw -LiteralPath $Source
          if($SourceText-notmatch[regex]::Escape('yggdrasil.research-scientific-result.v1')){throw 'SOURCE_RESULT_SCHEMA_TOKEN_MISSING'}
          if((git status --porcelain)-join''){throw 'START_WORKTREE_DIRTY'}

          "experiment=$($Q.experiment)" >> $env:GITHUB_OUTPUT
          "source=$Source" >> $env:GITHUB_OUTPUT
          "baseline=$Baseline" >> $env:GITHUB_OUTPUT
          "head=$Head" >> $env:GITHUB_OUTPUT
          "prereg=$PreregPath" >> $env:GITHUB_OUTPUT
          Write-Host 'YGGDRASIL_DIRECT_FROZEN_PACKAGE=PASS'

      - name: Run byte-identical duplicate qualification
        id: science
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Py='C:\ProgramData\CKBR\research-sidecar-yggdrasil\python312\python.exe'
          if(-not(Test-Path -LiteralPath $Py -PathType Leaf)){throw "PYTHON_RUNTIME_MISSING path=$Py"}
          $Q=Get-Content -Raw -LiteralPath '.yggdrasil/qualification-request.json'|ConvertFrom-Json
          $R=Get-Content -Raw -LiteralPath '.yggdrasil/isolated-run.json'|ConvertFrom-Json
          $Root=Join-Path $env:RUNNER_TEMP ("ygg-direct-"+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $Root){Remove-Item -LiteralPath $Root -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $Root|Out-Null
          function Invoke-One([string]$OutPath){
            $Args=New-Object Collections.Generic.List[string]
            foreach($A in @($R.run_args)){if([string]$A-ceq'{out}'){$Args.Add($OutPath)}else{$Args.Add([string]$A)}}
            $Prior=$env:PYTHONDONTWRITEBYTECODE
            try{
              $env:PYTHONDONTWRITEBYTECODE='1'
              & $Py ([string]$Q.source) @($Args)
              if($LASTEXITCODE-ne0){throw "SCIENTIFIC_RUN_FAILED exit=$LASTEXITCODE"}
            }finally{$env:PYTHONDONTWRITEBYTECODE=$Prior}
            if(-not(Test-Path -LiteralPath $OutPath -PathType Leaf)){throw 'SCIENTIFIC_RESULT_MISSING'}
          }
          $Out1=Join-Path $Root 'result-1.json'
          $Out2=Join-Path $Root 'result-2.json'
          Invoke-One $Out1
          Invoke-One $Out2
          $B1=[IO.File]::ReadAllBytes($Out1);$B2=[IO.File]::ReadAllBytes($Out2)
          if($B1.Length-ne$B2.Length){throw 'SCIENTIFIC_RESULT_NONDETERMINISTIC_LENGTH'}
          for($I=0;$I-lt$B1.Length;$I++){if($B1[$I]-ne$B2[$I]){throw 'SCIENTIFIC_RESULT_NONDETERMINISTIC_BYTES'}}
          $Science=Get-Content -Raw -LiteralPath $Out1|ConvertFrom-Json
          if([string]$Science.schema-cne'yggdrasil.research-scientific-result.v1'){throw 'SCIENTIFIC_RESULT_SCHEMA_INVALID'}
          if([string]$Science.experiment-cne[string]$Q.experiment){throw 'SCIENTIFIC_RESULT_EXPERIMENT_MISMATCH'}
          if($null-eq$Science.metrics){throw 'SCIENTIFIC_RESULT_METRICS_MISSING'}
          if((git status --porcelain)-join''){throw "QUALIFICATION_MUTATED_WORKTREE status=$((git status --porcelain)-join';')"}
          $ResultSha=(Get-FileHash -LiteralPath $Out1 -Algorithm SHA256).Hash.ToLowerInvariant()
          "result_path=$Out1" >> $env:GITHUB_OUTPUT
          "result_sha256=$ResultSha" >> $env:GITHUB_OUTPUT
          Write-Host "scientific_result_sha256=$ResultSha"
          Write-Host 'YGGDRASIL_DIRECT_DUPLICATE_QUALIFICATION=PASS'

      - name: Seal evidence on active branch
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Branch='research/direct-ygg-032-state-floor64'
          $Head='${{ steps.frozen.outputs.head }}'
          git fetch origin $Branch
          if($LASTEXITCODE-ne0){throw 'REMOTE_REFRESH_FAILED'}
          $Remote=(git rev-parse FETCH_HEAD).Trim()
          if($Remote-cne$Head){throw "REMOTE_HEAD_DRIFT expected=$Head actual=$Remote"}
          $Experiment='${{ steps.frozen.outputs.experiment }}'
          $Safe=$Experiment-replace'[^A-Za-z0-9._-]','_'
          $Bundle=Join-Path '.research-autonomy\evidence' ("$Safe-"+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $Bundle|Out-Null
          Copy-Item -LiteralPath '${{ steps.science.outputs.result_path }}' -Destination (Join-Path $Bundle 'result.json') -Force
          $Summary=[ordered]@{
            schema='yggdrasil.direct-qualification-summary.v1'
            experiment=$Experiment
            branch=$Branch
            baseline_sha='${{ steps.frozen.outputs.baseline }}'
            qualified_head_sha=$Head
            source='${{ steps.frozen.outputs.source }}'
            preregistration='${{ steps.frozen.outputs.prereg }}'
            duplicate_byte_identical=$true
            result_sha256='${{ steps.science.outputs.result_sha256 }}'
            execution_mode='direct-no-agent'
            github_run_id=$env:GITHUB_RUN_ID
            generated_at_utc=[DateTime]::UtcNow.ToString('o')
            authority='research-only'
            ckb_plane_role='governance-only'
          }
          $Summary|ConvertTo-Json -Depth 20|Set-Content -LiteralPath (Join-Path $Bundle 'summary.json') -Encoding UTF8
          $State=[ordered]@{
            schema='research.repo-local-state.v1'
            program='Yggdrasil'
            active_branch=$Branch
            north_star_path='research/architecture/yggdrasil-north-star.ice'
            north_star_sha256='3cd3b3d2fdbbb5b3541d433a527231b38fc441699cd0353fa86f0c3be6f0a905'
            parent_sha='${{ steps.frozen.outputs.baseline }}'
            qualified_head_sha=$Head
            experiment=$Experiment
            result_sha256='${{ steps.science.outputs.result_sha256 }}'
            last_completed_utc=[DateTime]::UtcNow.ToString('o')
            github_run_id=$env:GITHUB_RUN_ID
            execution_mode='direct-no-agent'
            authority='research-only'
            ckb_plane_role='governance-only'
          }
          $State|ConvertTo-Json -Depth 20|Set-Content -LiteralPath '.research-autonomy\state.json' -Encoding UTF8
          git config user.name 'direct-research-qualification'
          git config user.email 'direct-research-qualification@users.noreply.github.com'
          git add -- '.research-autonomy'
          git commit -m ("research: record direct qualified evidence for "+$Experiment)
          if($LASTEXITCODE-ne0){throw 'EVIDENCE_COMMIT_FAILED'}
          git push origin ("HEAD:refs/heads/"+$Branch)
          if($LASTEXITCODE-ne0){throw 'EVIDENCE_PUSH_FAILED'}
          Write-Host 'YGGDRASIL_DIRECT_EVIDENCE_SEALED=PASS'
