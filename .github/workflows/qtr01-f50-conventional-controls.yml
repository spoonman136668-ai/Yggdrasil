name: QTR-01 F50 law-conditioned conventional source-control qualification
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 conventional controls derive G29 atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Lock baseline source and unchanged preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '415df0c78067184b393a9920b33d6f441c1ed726'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f50-conventional-controls.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_conventional_controls.py)" = '37d6b5d81eb061bd6629eb328f3949599a254446'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_conventional_controls.py)" = 'aefdc3688d2c95265281887eb9bf2677a57c8b61'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_fit.py)" = 'cb4fbf8ebf26cb2feded2bc0c9ee2ae6b9de877c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_source_fit.py)" = '5028d2a6583121a64d5f6a429d3a16a131021292'
          test -z "$(git status --porcelain)"
          echo F50_LAW_CONDITIONED_SOURCE_PIN=PASS
      - name: Generate derived G29 companion only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F50 conventional source G29 atlas companion'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "F50_CONVENTIONAL_ATLAS_SHA=$(git rev-parse HEAD)"
  full-regression:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 conventional controls exact-source qualification'
    name: F50 full conventional controls regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen F50 source, graph parity and G29 custody
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test "$(git log -1 --format=%s)" = 'ci(qtr): F50 conventional controls exact-source qualification'
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): derive F50 conventional source G29 atlas companion'
          git merge-base --is-ancestor 415df0c78067184b393a9920b33d6f441c1ed726 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_conventional_controls.py)" = '37d6b5d81eb061bd6629eb328f3949599a254446'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_conventional_controls.py)" = 'aefdc3688d2c95265281887eb9bf2677a57c8b61'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_fit.py)" = 'cb4fbf8ebf26cb2feded2bc0c9ee2ae6b9de877c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_source_fit.py)" = '5028d2a6583121a64d5f6a429d3a16a131021292'
          python scripts/build_code_atlas.py --check
          echo F50_THREE_CONVENTIONAL_ARMS_CANDIDATE=PASS
      - name: Install source-only dependencies pinned on CPU
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python - <<'PY'
          import numpy, scipy, torch
          assert numpy.__version__=='2.1.3'
          assert scipy.__version__=='1.14.1'
          assert torch.__version__.startswith('2.10.0')
          assert not torch.cuda.is_available()
          print('F50_EXACT_FREE_CPU_TOOLCHAIN=PASS')
          PY
      - name: Focused no-target three-source-model tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f50_*.py' -v
      - name: Mandatory native Yggdrasil regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Source-only custody, no unapproved data first use
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f50_conventional_controls.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_SOURCE_LAW_PARITY_WITH_NO_TARGET_OR_ACCEPTED_CHANGE=PASS
