name: YNCA06 four frontier ideas no-tuning qualifier
on:
  push:
    branches:
      - research/ynca06-four-mechanism-qualifier-20261118
    paths:
      - .github/workflows/ynca06-qualifier.yml
permissions:
  contents: read
jobs:
  frozen-screen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify preregistered source identity before any output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('research/contrib/chatgpt/YNCA-06-QUAL')
          h=hashlib.sha256((p/'qualify.py').read_bytes()).hexdigest()
          j=json.loads((p/'prereg.json').read_bytes())
          assert h == '8c606125e484ef8be7f669e56b6fd2d421730b31a0969d4cf1feaeb3cd84ee45',h
          assert j['frozen_design']['source_sha256']==h
          assert j['inputs'][0]['sha256']==h
          assert j['frozen_design']['source_commit_sha']=='d935c1dcc545c3c5e90167372cd96d4be1865dea'
          print('YNCA06_QUALIFIER_SOURCE_FREEZE_PASS',h)
          PY
      - name: Run exact controls then original analytic primary
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-06-QUAL -p 'test_*.py' -v
          python -B research/contrib/chatgpt/YNCA-06-QUAL/qualify.py --run > "$RUNNER_TEMP/ynca06-qualifier.json"
          python - "$RUNNER_TEMP/ynca06-qualifier.json" <<'PY'
          import hashlib,base64,json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          data=path.read_bytes().replace(b'\r\n',b'\n')
          path.write_bytes(data)
          result=json.loads(data)
          assert result['source_sha256']=='8c606125e484ef8be7f669e56b6fd2d421730b31a0969d4cf1feaeb3cd84ee45'
          assert set(result['gates'])=={'IPFC','SCDR','CRN','LTM'}
          assert not any(result['claims'].values())
          assert result['gates']['IPFC']['remaining_laws_after_two_probes']==[16]
          print('YNCA06_QUALIFIER_RESULT_SHA256',hashlib.sha256(data).hexdigest())
          print('YNCA06_QUALIFIER_METRICS',json.dumps(result['gates'],sort_keys=True,separators=(',',':')))
          print('YNCA06_QUALIFIER_B64',base64.b64encode(data).decode('ascii'))
          PY
          test -z "$(git status --porcelain)"
      - name: Preserve frozen stage-zero evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynca06-screen-${{ matrix.os }}
          path: ${{ runner.temp }}/ynca06-qualifier.json
          if-no-files-found: warn
          retention-days: 30
