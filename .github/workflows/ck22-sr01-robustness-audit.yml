name: CK22-SR01 independent robustness of retained novel-context learning
on:
  push:
    branches: [research/ck22-seed-robustness-audit-20261118]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ck22-sr01): run frozen post-result robustness audit'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original source and frozen post-result audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor fa9abc8ba0a0331960fc59f9ef6b7ccf4d9320e8 HEAD
          git merge-base --is-ancestor f04cfcac2aa07806a6b942d968119de87bfb6aaf HEAD
          test "$(git hash-object research/contrib/chatgpt/CK22-SR01/prereg.json)" = 961ca37261161f5f0113a09178d0957b6c1d5604
          test "$(git hash-object research/contrib/chatgpt/CK22-SR01/audit.py)" = 5d7f47b986c80c8f1a87a1634f959876053e5c05
          test "$(git hash-object research/contrib/chatgpt/CK22-SR01/test_audit.py)" = 6968f08e8295466127b7664adb85ac3d3254bf0c
      - name: Read-only post-result seed comparison and negatives
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CK22-SR01 -p test_audit.py -v
          python -B research/contrib/chatgpt/CK22-SR01/audit.py --output "$RUNNER_TEMP/ck22-sr01/result.json"
          python -c "import json,os,pathlib; v=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ck22-sr01/result.json').read_text());assert v['source_case_count']==1152 and v['scientific_pass'] is False"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck22-sr01-${{ matrix.os }}-executed-audit
          path: ${{ runner.temp }}/ck22-sr01/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [development]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ck22-sr01-ubuntu-latest-executed-audit
          path: ${{ runner.temp }}/ck22-sr01-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ck22-sr01-windows-2022-executed-audit
          path: ${{ runner.temp }}/ck22-sr01-windows
      - name: Seal replicated diagnostic receipts and source atlas
        id: seal
        env:
          CK22SR_LINUX: ${{ runner.temp }}/ck22-sr01-linux
          CK22SR_WINDOWS: ${{ runner.temp }}/ck22-sr01-windows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CK22-SR01/seal.py
          git add -- research/contrib/chatgpt/CK22-SR01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ck22-sr01): seal seed-group robustness and negatives'
          RESULT_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git commit -m "docs(ck22-sr01): qualify frozen robustness atlas at $RESULT_SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ck22-seed-robustness-audit-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned native full-regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full final exact-candidate regression with already-qualified result comparison
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p test_*.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/CK22-SR01 -p test_audit.py -v
          python -B research/contrib/chatgpt/CK22-SR01/audit.py --output "$RUNNER_TEMP/ck22-sr01-final.json"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP']); a=json.loads((p/'ck22-sr01-final.json').read_text()); b=json.loads(pathlib.Path('research/contrib/chatgpt/CK22-SR01/result.json').read_text()); assert a['stable_sha256']==b['stable_sha256']; assert a['scientific_pass'] is False"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-atlas:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent G29 atlas and bounded post-result audit
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CK22-SR01/audit.py --output "$RUNNER_TEMP/ck22-sr01-independent.json"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP']); a=json.loads((p/'ck22-sr01-independent.json').read_text()); b=json.loads(pathlib.Path('research/contrib/chatgpt/CK22-SR01/result.json').read_text()); assert a['stable_sha256']==b['stable_sha256']"
          test -z "$(git status --porcelain)"
