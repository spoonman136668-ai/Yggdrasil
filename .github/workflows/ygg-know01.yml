name: YGG-KNOW01 source-only capacity inventory qualification
'on':
  push:
    branches:
      - docs/ygg-independent-review-assessment-20261119
    paths:
      - '.github/workflows/ygg-know01.yml'
      - 'research/contrib/chatgpt/YGG-KNOW01/**'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Stable Git source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen no-model negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-KNOW01 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
  atlas:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - name: Stable Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate exact candidate G29 source atlas
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          if ! git diff --cached --quiet; then
            git commit -m "docs(know01): seal G29 atlas on pinned knowledge-inventory source"
          fi
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/docs/ygg-independent-review-assessment-20261119
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-final:
    needs: atlas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Stable Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory complete source regression and G29 seal
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-KNOW01 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          test -z "$(git status --porcelain)"
