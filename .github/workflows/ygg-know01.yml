name: YGG-KNOW01 source-only capacity inventory qualification
'on':
  push:
    branches:
      - docs/ygg-independent-review-assessment-20261119
    paths:
      - '.github/workflows/ygg-know01.yml'
      - 'research/contrib/chatgpt/YGG-KNOW01/**'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Stable Git source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen no-model negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-KNOW01 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
  atlas:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - name: Stable Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate exact candidate G29 source atlas
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          if ! git diff --cached --quiet; then
            git commit -m "docs(know01): seal G29 atlas on pinned knowledge-inventory source"
          fi
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/docs/ygg-independent-review-assessment-20261119
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-final:
    needs: atlas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Stable Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory complete source regression and G29 seal
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-KNOW01 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          test -z "$(git status --porcelain)"

  real-source-compatibility:
    needs: [atlas, full-final]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Isolate NKR08 original source exactly; do not merge or execute model owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          NKR=e0ed615e2f65ba3a2b20cc700398675d58f5e73b
          git fetch --no-tags origin "$NKR"
          mkdir -p "$RUNNER_TEMP/know03-source/yggdrasil"
          touch "$RUNNER_TEMP/know03-source/yggdrasil/__init__.py"
          for spec in             "native_cumulative_facts.py:37d8d88198292b165eee0570049d4d3286dd900b"             "native_knowledge_activation.py:76f543b639810b786e5c604795f1997972e9ac6a"             "native_factual_weights.py:65aea0cafbe7534f8c473d78f2e852a4752836e0"; do
            f="${spec%%:*}"; blob="${spec#*:}"
            test "$(git rev-parse "$NKR:yggdrasil/$f")" = "$blob"
            git show "$NKR:yggdrasil/$f" > "$RUNNER_TEMP/know03-source/yggdrasil/$f"
          done
          test -z "$(git status --porcelain)"
      - name: Read existing already-consumed source artifact identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14220169461" > "$RUNNER_TEMP/nkr05-meta.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14517860401" > "$RUNNER_TEMP/amalgam-meta.json"
          python -B - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=json.loads((r/"nkr05-meta.json").read_bytes())
          b=json.loads((r/"amalgam-meta.json").read_bytes())
          assert (a["id"], a["expired"],a["name"],a["workflow_run"]["id"],
                  a["workflow_run"]["head_sha"]) == (
             14220169461,False,"NKR05-21M-full-historical-TRAIN-native-factual-weights",
             43856374741,"c4b4e97726f6541197913ad405a47d4c4019a3cf")
          assert (b["id"], b["expired"],b["name"],b["workflow_run"]["id"],
                  b["workflow_run"]["head_sha"]) == (
             14517860401,False,"Amalgam-shared-consequence-ubuntu-latest",
             44499793023,"e9aa921c57dca836c06c7125e52229cce728620a")
          PY
      - name: Reuse actual historical TRAIN image and recovered Amalgam joint bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/know03-nkr05" "$RUNNER_TEMP/know03-amalgam"
          gh run download 43856374741 -R "$GITHUB_REPOSITORY" -n NKR05-21M-full-historical-TRAIN-native-factual-weights -D "$RUNNER_TEMP/know03-nkr05"
          gh run download 44499793023 -R "$GITHUB_REPOSITORY" -n Amalgam-shared-consequence-ubuntu-latest -D "$RUNNER_TEMP/know03-amalgam"
          test "$(stat -c %s "$RUNNER_TEMP/know03-nkr05/facts.uint32le")" = 256124172
          test "$(stat -c %s "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json")" = 2921047
          test "$(sha256sum "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" | cut -d' ' -f1)" = 576370a1963158f7dc43099360f491eb6a1e49355448922943b6bde374d484c8
          PYTHONPATH="$RUNNER_TEMP/know03-source" python -B -m yggdrasil.native_knowledge_activation             --source "$RUNNER_TEMP/know03-nkr05" --destination-parent "$RUNNER_TEMP" --name know03-history-readonly             > "$RUNNER_TEMP/know03-install.json"
          PYTHONPATH="$RUNNER_TEMP/know03-source" python -B research/contrib/chatgpt/YGG-KNOW01/real_image_pairing.py             --installed-session "$RUNNER_TEMP/know03-history-readonly"             --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json"             --output "$RUNNER_TEMP/know03-pairing-receipt.json"
          test -z "$(git status --porcelain)"
      - name: Cold restore original native sublearner and shadow read historical facts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          AMALGAM=86264b41a08d49f558418c0fba367f3a2636befa
          git fetch --no-tags origin "$AMALGAM"
          test "$(git rev-parse "$AMALGAM:yggdrasil/native_cumulative_learner.py")" = 1bdeaa4277fc9b34bbf7c0f36c6d0a4cc00e1ca4
          test "$(git rev-parse "$AMALGAM:yggdrasil/native_cumulative_facts.py")" = 37d8d88198292b165eee0570049d4d3286dd900b
          mkdir "$RUNNER_TEMP/know06-amalgam-source"
          git archive "$AMALGAM" yggdrasil | tar -xf - -C "$RUNNER_TEMP/know06-amalgam-source"
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/native_cold_shadow.py --installed-session "$RUNNER_TEMP/know03-history-readonly" --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" --output "$RUNNER_TEMP/know06-cold-shadow-receipt.json"
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/historical_functional_retention.py --installed-session "$RUNNER_TEMP/know03-history-readonly" --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" --output "$RUNNER_TEMP/know08-retention-receipt.json"
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/historical_intervention_coverage.py --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" --output "$RUNNER_TEMP/know09-intervention-coverage-receipt.json"
          test -z "$(git status --porcelain)"
      - name: Fetch source-pinned original parent artifacts for full four-head cold replay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14470790752" > "$RUNNER_TEMP/know10-ckad-meta.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14482121653" > "$RUNNER_TEMP/know10-jepa-meta.json"
          python -B - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"know10-ckad-meta.json").read_bytes())
          b=json.loads((root/"know10-jepa-meta.json").read_bytes())
          assert (a["id"], a["expired"], a["name"], a["workflow_run"]["id"],
                  a["workflow_run"]["head_sha"]) == (
              14470790752, False, "CKAD26-refresh-primary", 44391641043,
              "5178110111fc8e3880170006b397ccce372e9a24")
          assert (b["id"], b["expired"], b["name"], b["workflow_run"]["id"],
                  b["workflow_run"]["head_sha"]) == (
              14482121653, False, "YGG-JEPA2-03-ubuntu-latest", 44420677720,
              "0630f84387bc0f5dec5b996261fb12fe7c2b0a6d")
          PY
          mkdir -p "$RUNNER_TEMP/know10-ckad" "$RUNNER_TEMP/know10-jepa"
          gh run download 44391641043 -R "$GITHUB_REPOSITORY" -n CKAD26-refresh-primary -D "$RUNNER_TEMP/know10-ckad"
          gh run download 44420677720 -R "$GITHUB_REPOSITORY" -n YGG-JEPA2-03-ubuntu-latest -D "$RUNNER_TEMP/know10-jepa"
          test "$(sha256sum "$RUNNER_TEMP/know10-ckad/seed-101-refresh-native.json" | cut -d' ' -f1)" = a00119c73a6431172c19b39ec67a1d94b470897a32c55c1c946071793f37dcc4
          test "$(sha256sum "$RUNNER_TEMP/know10-jepa/seed-14071-state.json" | cut -d' ' -f1)" = 7e7507af589ae6b08a7599f1abafa9dd998895299fbb423cfc2995ecbcf741cd
          test -z "$(git status --porcelain)"
      - name: Cold restore all Amalgam specialists and compare separate factual shadow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/full_amalgam_factual_shadow.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --native-parent "$RUNNER_TEMP/know10-ckad/seed-101-refresh-native.json" \
            --donor-parent "$RUNNER_TEMP/know10-jepa/seed-14071-state.json" \
            --output "$RUNNER_TEMP/know10-four-head-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW11 frozen synthetic factual to witnessed-causal development trial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/factual_causal_grounding_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know11-grounded-causal-dev-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW12 frozen source-blind factual-role identification development trial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/blind_fact_role_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know12-blind-role-dev-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW13 same-address cumulative causal learning frozen DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_accumulator.py)" = 3d18267ee96b3419f2afe246a9110a6bf36f8932
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/same_address_cumulative_facts_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know13-same-address-dev-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW14 frozen blind-source regime cue identification DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_accumulator.py)" = 3d18267ee96b3419f2afe246a9110a6bf36f8932
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/same_slot_blind_regime_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know14-blind-regime-dev-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW15 frozen factual-only regime cue leakage falsification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/source_only_regime_leakage.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --know14-receipt "$RUNNER_TEMP/know14-blind-regime-dev-receipt.json" \
            --output "$RUNNER_TEMP/know15-factual-only-regime-leakage-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW16 frozen source-identical counterfactual intervention DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_accumulator.py)" = 3d18267ee96b3419f2afe246a9110a6bf36f8932
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/same_source_active_intervention_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know16-source-identical-intervention-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW17 learned intervention-utility transfer frozen DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_accumulator.py)" = 3d18267ee96b3419f2afe246a9110a6bf36f8932
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/learned_intervention_policy_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know17-learned-intervention-policy-receipt.json"
          test -z "$(git status --porcelain)"
      - name: KNOW18 raw four-feature intervention-utility transfer frozen DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_accumulator.py)" = 3d18267ee96b3419f2afe246a9110a6bf36f8932
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
          PYTHONPATH="$RUNNER_TEMP/know06-amalgam-source:research/contrib/chatgpt/YGG-KNOW01" python -B research/contrib/chatgpt/YGG-KNOW01/raw_intervention_utility_dev.py \
            --installed-session "$RUNNER_TEMP/know03-history-readonly" \
            --joint-checkpoint "$RUNNER_TEMP/know03-amalgam/amalgam-joint-state.json" \
            --output "$RUNNER_TEMP/know18-raw-feature-utility-receipt.json"
          test -z "$(git status --porcelain)"
      - name: Preserve only bounded readout receipts (not original image or checkpoints)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: YGG-KNOW03-real-image-archived-amalgam-compatibility
          path: |
            ${{ runner.temp }}/know03-pairing-receipt.json
            ${{ runner.temp }}/know06-cold-shadow-receipt.json
            ${{ runner.temp }}/know08-retention-receipt.json
            ${{ runner.temp }}/know09-intervention-coverage-receipt.json
            ${{ runner.temp }}/know10-four-head-receipt.json
            ${{ runner.temp }}/know11-grounded-causal-dev-receipt.json
            ${{ runner.temp }}/know12-blind-role-dev-receipt.json
            ${{ runner.temp }}/know13-same-address-dev-receipt.json
            ${{ runner.temp }}/know14-blind-regime-dev-receipt.json
            ${{ runner.temp }}/know15-factual-only-regime-leakage-receipt.json
            ${{ runner.temp }}/know16-source-identical-intervention-receipt.json
            ${{ runner.temp }}/know17-learned-intervention-policy-receipt.json
            ${{ runner.temp }}/know18-raw-feature-utility-receipt.json
          retention-days: 30
          if-no-files-found: error
