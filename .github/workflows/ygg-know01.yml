          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_accumulator.py)" = 3d18267ee96b3419f2afe246a9110a6bf36f8932
          test "$(git rev-parse 86264b41a08d49f558418c0fba367f3a2636befa:yggdrasil/native_context_basis.py)" = d5159e9b7ba196ee283ae7140faa031d4b7c4291
