name: Yggdrasil Y055 frozen balanced allocation robustness
on:
  push:
    branches: [research/y055-balanced-allocation-robustness-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact predecessor and frozen preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c0dedfee971097e609342983b087d78de845cbff HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y054-portfolio-replication/execute.py)" = bd91fd8e82d590ea734f2af605db805900c83984
          test "$(git hash-object research/contrib/chatgpt/20261013-y055-allocation-keys/prereg.json)" = 78c47aec8783ca1dfbf96ecb0e1d50215a8c9fe9
          test "$(git hash-object research/contrib/chatgpt/20261013-y055-allocation-keys/execute.py)" = effdf1ce55436a22e1f45fb0516735cf25c3e679
          python3 -m json.tool research/contrib/chatgpt/20261013-y055-allocation-keys/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y055-allocation-keys/execute.py
      - name: Execute original single sealed first-use robustness experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y055-allocation-keys/execute.py >/tmp/Y055-original.json
          python3 -m json.tool /tmp/Y055-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y055-original.json'))
          assert a['development_seeds']==list(range(2160,2168))
          assert a['sealed_heldout_seeds']==list(range(2168,2184))
          assert len(a['heldout_records'])==5*4*16*3
          assert all(sum(x=='A' for x in mapping.values())==8 for mapping in a['balanced_assignments'].values())
          print('CLASSIFICATION',a['classification'])
          print('FROZEN_KEY_GAINS',a['frozen_key_gains'])
          print('RISK_BY_ARM',a['risk_by_arm'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y055-original-balanced-key-stress
          path: /tmp/Y055-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Required full Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
