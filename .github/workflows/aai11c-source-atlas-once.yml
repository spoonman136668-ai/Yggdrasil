name: AAI-11C frozen no-first-use causal prediction vs planner diagnostic
on:
  push:
    branches: [research/aai11c-causal-decision-diagnostic-20261114]
    paths: [.github/workflows/aai11c-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11c-source-once-20261114
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11C frozen public causal-prediction diagnostic source one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen prereg BEFORE diagnostic code and unchanged original learners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'dd11031ec4d48e5efa7ab4231e99cfabceed71de'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11c-source-atlas-once.yml'
          test "$(git rev-parse 9125ddf77c74db6818d37ac927e8e4711f21ce1f^)" = '425747038824324c161c4de5e960117c6be31145'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/prereg.json)" = '15dcef67ae7bfb2a7e59d5d57bf88f53c754dc87'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/prereg.json)" = "$(git rev-parse 9125ddf77c74db6818d37ac927e8e4711f21ce1f:research/contrib/chatgpt/AAI-11C/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/diagnose.py)" = '499662a5939796f502ccd47c97950a4d1fbd6b2f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/test_diagnose.py)" = 'b2fc7c8a875f673fe2754ccf83645176d53997c2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11B/contrast.py)" = '69ff21daf627feeaaca6661f8f3c8096efbe4de8'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11B/dev.py)" = '05682c4b98747701b779d264bf18d7ee29e67b7f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test -z "$(git status --porcelain)"
          echo AAI11C_IMMUTABLE_MODEL_AND_PREREG_BEFORE_DIAG_PASS
      - name: Public privacy, read-only causal prediction, real consequences, cold and first-use tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11C -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11C/diagnose.py --primary > /dev/null 2>&1; then
            echo AAI11C_FIRST_USE_DISARM_FAILED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11C_PUBLIC_MECHANISM_ATTRIBUTION_TESTS_PASS
      - name: Single preregistered 288-paired-episode diagnostic with private scoring only
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11C/diagnose.py --mechanical-diagnostic
          test -z "$(git status --porcelain)"
          echo AAI11C_CAUSAL_PREDICTION_VS_PLANNER_DIAGNOSTIC_RECORDED_NO_SCIENCE
  atlas:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate ONLY 3 existing G29 source-pinned atlas files
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'dd11031ec4d48e5efa7ab4231e99cfabceed71de'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11C source-pinned generated-only G29 atlas'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11c-causal-decision-diagnostic-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11c-causal-decision-diagnostic-20261114
          echo AAI11C_PINNED_G29_ATLAS_THREE_FILES_ONLY_PASS
