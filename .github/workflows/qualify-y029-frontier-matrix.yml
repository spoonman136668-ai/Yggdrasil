name: Yggdrasil Y029 frozen retention frontier matrix
on:
  push:
    branches: [research/y029-retention-frontier-matrix-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed original identity and preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 553870f7491390ff8884a824832691a60969f985 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y028-alternating-drift/execute.py)" = b0a570bc7fddc0580f335e586262a0580288be61
          test "$(git hash-object research/contrib/chatgpt/20261013-y029-frontier/prereg.json)" = 8222e406c01f873eb32022c2e51b0042ccf4f0bb
          test "$(git hash-object research/contrib/chatgpt/20261013-y029-frontier/execute.py)" = 9e099688869c8557f46c8b7120aaa35ee7407785
          python3 -m json.tool research/contrib/chatgpt/20261013-y029-frontier/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y029-frontier/execute.py
      - name: First and only frozen 12-cell scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y029-frontier/execute.py > /tmp/Y029-original.json
          python3 -m json.tool /tmp/Y029-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y029-original.json'))
          assert len(a['cells'])==12
          print('SCIENCE_CLASSIFICATION',a['classification'])
          for x in a['cells']:
              print('CELL',x['capacity'],x['regime'],'SAVED',x['heldout_total_saved_churn'],
                    'VALID_PREFS',x['heldout_legal_cached_preferences'],'LABEL',x['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y029-original-12-cell-frontier
          path: /tmp/Y029-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Single full Yggdrasil qualification regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
