name: Yggdrasil Y039 frozen moving coordinate cache
on:
  push:
    branches: [research/y039-moving-coordinate-frame-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on source/prereg/predecessor identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d0118d27e7204e3ade96d9db194eb44237782e78 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-multi-label/execute.py)" = 7d8d0377555d34deed9410acfa84a48dd9656928
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-moving-frame/prereg.json)" = 297745ebd58a9f56102adeb8f6bd4a83378d2efa
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-moving-frame/execute.py)" = 6c12b0d1fd722ba516483c0b9ef0c4f0ecc30a76
          python3 -m json.tool research/contrib/chatgpt/20261013-y039-moving-frame/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y039-moving-frame/execute.py
      - name: First original frozen coordinate frame science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y039-moving-frame/execute.py >/tmp/Y039-original.json
          python3 -m json.tool /tmp/Y039-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y039-original.json'))
          assert a['sealed_heldout_seeds']==list(range(272,288))
          print('CLASSIFICATION',a['classification'])
          print('ALLOC_MISMATCHES',a['heldout_physical_assignment_mismatches'])
          print('PHYSICAL_CHURN',a['heldout_physical_churn_by_mode'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y039-original-moving-frame
          path: /tmp/Y039-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
