name: YGG CAP04 clock-only controls fixture qualification
on:
  push:
    branches:
      - research/ygg-cap04-clock-only-controls-20261119
permissions:
  contents: read
jobs:
  source-contract-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Preserve exact source bytes on Windows and Linux
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Engineering-only source gate; registered seeds forbidden
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          export PYTHONDONTWRITEBYTECODE=1
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
          python -B -m unittest discover -s tests -p test_cap04_prospective_source_contract.py -v
          python -B -m unittest discover -s tests -p test_cap04_clock_only_controls.py -v
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              
              
          }
          for name, pinned in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              print("CAP04_STAGING_FILE_SHA256", name, actual)
              if actual != pinned:
                  raise SystemExit("CAP04_STAGING_SOURCE_BYTE_MISMATCH " + name)
          print("CAP04_CLOCK_CONTROL_FIXTURE_ONLY_PASS")
          PY
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = b78122a274ca63b38bafdd52f121d7ac0869a81b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/clock_controls.py)" = 9f23fdd3ace32695b3f753bb8b37e869641cdd48
          test "$(git rev-parse HEAD:tests/test_cap04_clock_only_controls.py)" = 1c3bebccba505941de55a5419eb28d099a8626bc
          test -z "$(git status --porcelain)"
