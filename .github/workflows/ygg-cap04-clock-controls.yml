name: YGG CAP04 clock-only and source-key oracle ENGINEERING qualification
on:
  push:
    branches:
      - research/ygg-cap04-clock-only-controls-20261119
    paths:
      - '.github/workflows/ygg-cap04-clock-controls.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve source line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned qualified native environment
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Source exactly pinned; fixture-only clock/identity diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = b78122a274ca63b38bafdd52f121d7ac0869a81b
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = cd3065a30edf5c08ec92eccc9eec1776d4570da4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/clock_controls.py)" = 9f23fdd3ace32695b3f753bb8b37e869641cdd48
          test "$(git rev-parse HEAD:tests/test_cap04_clock_only_controls.py)" = 1c3bebccba505941de55a5419eb28d099a8626bc
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          test "$(git diff --name-only 52eed12adb6187bb881e45ae30574c4714adb3fa HEAD | LC_ALL=C sort | tr '\n' '|')" = ".github/workflows/ygg-cap04-clock-controls.yml|research/contrib/chatgpt/YGG-CAP04/clock_controls.py|tests/test_cap04_clock_only_controls.py|"
          python -B -m unittest discover -s tests -p 'test_cap04_prospective_source_contract.py' -v
          python -B -m unittest discover -s tests -p 'test_cap04_clock_only_controls.py' -v
          test -z "$(git status --porcelain)"
          echo CAP04_CLOCK_ONLY_FIXTURE_QUALIFIED_WITH_SOURCE_KEY_LEAKAGE_WARNING
