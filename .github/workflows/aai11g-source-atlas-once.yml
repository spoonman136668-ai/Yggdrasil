name: AAI-11G oracle-reachable prospective benchmark and eleven-control qualification
on:
  push:
    branches: [research/aai11g-oracle-relative-benchmark-20261114]
    paths: [.github/workflows/aai11g-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11g-source-qualification-once-20261114
  cancel-in-progress: false
jobs:
  benchmark:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11G frozen 11-control oracle-recovery source admission one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin frozen prereg before code and untouched original world/learner source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '04686555989e6f9aabad61351f38bad4c53709c4'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11g-source-atlas-once.yml'
          test "$(git rev-parse a233c79b81f5a20ec7da6cff697526a91f5e14b5^)" = '36cc12381a4153048e5971899fa388a0aafd7480'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/prereg.json)" = '260c815900cc7f12aeab9a41a2caa6627482b6e9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/prereg.json)" = "$(git rev-parse a233c79b81f5a20ec7da6cff697526a91f5e14b5:research/contrib/chatgpt/AAI-11G/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/admit.py)" = '7fbeaf898d65cded838f74f1963da3b88af9604d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/test_admit.py)" = '3b1f1e12312c774a28f92ccd716f86482c0f17bf'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/audit.py)" = '299a79cf8101a6a7a8231c693d52b022fab22e07'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/dev.py)" = 'ce807c4fa3b7742b4299580087dc41b68359533e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/fixture.py)" = '191575e68f64858acf036cd1e10c1e266cf16692'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/admission.py)" = '0f921dfeebda9ad3a0e217747e4b0365ba9c655e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test -z "$(git status --porcelain)"
          echo AAI11G_ORACLE_RECOVERY_PREREG_BEFORE_SOURCE_AND_11_CONTROLS_PINNED_PASS
      - name: Focused oracle-relative feasibility, fairness, cold and disarm tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11G -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11G/admit.py --primary >/dev/null 2>&1; then
            echo AAI11G_PRIMARY_SCIENCE_FIRST_USE_NOT_DISARMED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11G_ORACLE_NORMALIZED_BENCHMARK_TESTS_PASS
      - name: Frozen all-eleven-control source-only benchmark and prospective acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11G/admit.py --source-protocol-admission
          test -z "$(git status --porcelain)"
          echo AAI11G_ALL_ELIGIBLE_CONVENTIONAL_BENCHMARK_CLASSIFIED_NO_SCIENCE
  atlas:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate only 3 existing G29 code-atlas artifacts pinned to immutable source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '04686555989e6f9aabad61351f38bad4c53709c4'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11G original source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11g-oracle-relative-benchmark-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11g-oracle-relative-benchmark-20261114
          echo AAI11G_SOURCE_PINNED_G29_THREE_FILES_ONLY_PASS
