name: ITD-02 V27 frozen return evidence falsification
on:
  push:
    branches:
      - research/itd02-v27-return-evidence-falsification-20261028
permissions:
  contents: read
jobs:
  v27-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact cross host source
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg and original exact source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 699b42d554aab67a5f5a4b6c366bcc897cb48ece "$GITHUB_SHA"
          git merge-base --is-ancestor 802a4a5604ffe858bc17c79eae1b7f6d83f3aeb0 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
      - name: Reconstruct source return and unchanged T1 negative evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v27"
          if ! PYTHONPATH=. python -B research/itd02_v27_return_evidence_falsification.py > "$RUNNER_TEMP/v27/audit.json" 2> "$RUNNER_TEMP/v27/error.log"; then
            cat "$RUNNER_TEMP/v27/error.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v27/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["classification"]=="V27_FALSE_RETURN_AND_LATE_RETURN_CAUSAL_WITNESS_PASS__NO_SCIENCE"
          assert d["t2_return_latency"]==5 and d["unchanged_t1_false_source_selections"]==4
          assert len(d["t2_return_windows"])==5
          assert len(d["unchanged_t1_false_windows"])==4
          assert d["offline_stage_label_swap_invariant"]
          assert d["public_reward_digest_tamper_detected"]
          assert not d["scientific_first_use"] and not d["original_world_training"]
          assert len(d["all_streams_sha256"])==64
          print("V27_NEGATIVE_MECHANISM_RECONSTRUCTION_PASS_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v27/audit.json"
      - name: Existing detector and original native source regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v27-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/v27/*
          retention-days: 7
          if-no-files-found: warn
