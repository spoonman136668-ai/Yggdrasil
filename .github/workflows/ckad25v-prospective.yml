name: CKAD25-V source-frozen native relation compilation
on:
  pull_request:
    paths:
      - "research/contrib/chatgpt/CKAD25-V/**"
      - "yggdrasil/native_causal_relation_posterior.py"
      - "yggdrasil/native_cumulative_learner.py"
      - "tests/test_native_causal_relation_posterior.py"
      - ".github/workflows/ckad25v-prospective.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source-frozen-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Keep tracked Git source bytes unchanged
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing native and conventional test controls
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exact frozen code and original native checkpoint preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object yggdrasil/native_causal_relation_posterior.py)" = "ac738c0fe03e5532f9e422dfe972c378728741c7"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "5a8315f7451ded843adeab9f0b22f7454a87ad0a"
          test "$(git hash-object tests/test_native_causal_relation_posterior.py)" = "58a7d5a74270482fa2215723c31bf3775eb56967"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-V/run.py)" = "959b5dccb64408016277a9add461d91997fba25a"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("research/contrib/chatgpt/CKAD-25/qualified-development-runs/44331408493")
          a=(p/"linux/stage-02.native.json").read_bytes()
          b=(p/"windows/stage-02.native.json").read_bytes()
          assert a==b and hashlib.sha256(a).hexdigest()=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          print("CKAD25V_FROZEN_NATIVE_CHECKPOINT_PASS")
          PY
      - name: Focused native checkpoint and forgery/continuation negatives
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p 'test_native_causal_relation_posterior.py' -v
      - name: First source-frozen prospective synthetic native compilation score
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-V/run.py --output "$RUNNER_TEMP/ckad25v-result.json"
          cp "$RUNNER_TEMP/ckad25v-result.json" "$RUNNER_TEMP/ckad25v-original.json"
      - name: Replay identical frozen cohort as deterministic check only
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-V/run.py --output "$RUNNER_TEMP/ckad25v-result.json"
          cmp "$RUNNER_TEMP/ckad25v-result.json" "$RUNNER_TEMP/ckad25v-original.json"
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"ckad25v-result.json").read_bytes()
          d=json.loads(raw)
          assert d["schema"]=="yggdrasil.ckad25v.native-persistent-relational-compiler.v1"
          assert d["synthetic_training_observations"]==216
          assert d["synthetic_held_interventions"]==72
          assert d["protected_original_source_actions"]==0
          assert d["source_first_use"] is False and d["accepted_main_changed"] is False
          assert d["model_compilation_opt_in_only"] is True
          assert d["scientific_pass"] is False and d["native_promotion"] is False
          assert d["owner_acceptance"] is False and d["forge_dispatch"] is False
          assert d["deployment"] is False
          assert len(d["per_seed_law"])==18
          assert d["gates"]["native_old_knowledge_retained"] is True
          assert d["gates"]["source_compilation_continuation_recomputes"] is True
          assert d["gates"]["exact_bayesian_parity_all_72"] is True
          assert d["source_script_sha256"]==hashlib.sha256(
              Path("research/contrib/chatgpt/CKAD25-V/run.py").read_bytes()).hexdigest()
          assert d["control_helper_sha256"]==hashlib.sha256(
              Path("research/contrib/chatgpt/CKAD25-S/run.py").read_bytes()).hexdigest()
          print("CKAD25V_FOCUSED_NATIVE_SOURCE_RESULT_AUDIT_PASS")
          print("CKAD25V_RESULT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("CKAD25V_SCIENCE_DISPOSITION="+d["disposition"])
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25v-native-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25v-result.json
          if-no-files-found: error
          retention-days: 60
