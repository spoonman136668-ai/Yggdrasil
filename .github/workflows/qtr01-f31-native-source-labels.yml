name: QTR-01 F31 unmodified first-party language relationship custody

on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114

permissions:
  contents: read

jobs:
  focused:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    name: F31 all-source-language typed associations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Stable Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen protocol pre-dates implementation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 211b1f4c77df7129bbbdf9f8936bb01e6c0ee1c2 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f31_prereg.json)" = "7017afb712f087e818942841cffbca4ae296c629"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f27_versioned_entitydata.py)" = "db561564c949ffe1a15c99dc460d18d0143588d1"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f30_multilingual_associations.py)" = "b8a7d9f47a160d40a97fe6fc0008f591e7fdb025"
      - name: F31 fully source-free negative tests, real-shaped first-party fixtures
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f31_*.py' -v
      - name: No tracked source changes
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  source-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'research(qtr): F31 one-shot final original-language association intake'
    name: F31 final bounded first-party Wikidata source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail closed unless candidate and one-shot marker match exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f31_prereg.json)" = "7017afb712f087e818942841cffbca4ae296c629"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f31_all_language_associations.py)" = "6746518963f07f8355fc4bd66716d86547183005"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f31_all_language_associations.py)" = "1ced11c7544add3f3a5653d3393ce837a09c00d1"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f27_versioned_entitydata.py)" = "db561564c949ffe1a15c99dc460d18d0143588d1"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f30_multilingual_associations.py)" = "b8a7d9f47a160d40a97fe6fc0008f591e7fdb025"
          test "$(git log -1 --format=%s)" = "research(qtr): F31 one-shot final original-language association intake"
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test -z "$(git status --porcelain)"
          echo F31_EXACT_FROZEN_SOURCE_CUSTODY=PASS
      - name: Source-free F31 negatives before original data
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f31_*.py' -v
      - name: Source original immutable-language semantic facts, strictly bounded once
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f31_all_language_associations.py --frozen-first-party-only --output ../f31-cc0-language-witnessed-source.json
          python - <<'PY'
          import hashlib,json,pathlib
          raw=pathlib.Path('../f31-cc0-language-witnessed-source.json').read_bytes()
          x=json.loads(raw)
          control=x['matched_symbolic_numeric_control']
          assert control['source_labeled_rows']>0
          assert control['canonical_cold_restore']
          assert control['numeric_vs_equal_info_symbolic_2hop_parity']
          assert all(row['s_language'] and row['p_language'] and row['o_language'] for row in x['typed_source_rows'])
          assert x['scientific_pass'] is False
          assert x['native_recipient_model_weights_edited'] is False
          assert len(raw)<=393217
          print('F31_FIRST_PARTY_SOURCE_RECEIPT_VERIFIED='+hashlib.sha256(raw).hexdigest())
          PY
      - name: Source checkout preserved after read-only association extraction
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve source hash receipt only in GitHub Actions, not user Library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtr01-f31-first-party-source-typed-multilingual
          path: ../f31-cc0-language-witnessed-source.json
          retention-days: 14
          if-no-files-found: error
