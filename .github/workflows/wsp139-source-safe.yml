name: WSP139 post-action query-blind causal generalization source-safe
on:
  push:
    branches: [research/wsp139-postaction-unseen-queries-20261117]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify first-only prereg, unchanged parent learner and original first-use disarmed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r b45a7e6ad65edeff26ecbc8b8864ba1535d2a676)" = "research/contrib/chatgpt/WSP-139/prereg.json"
          git merge-base --is-ancestor b45a7e6ad65edeff26ecbc8b8864ba1535d2a676 HEAD
          git diff --exit-code b45a7e6ad65edeff26ecbc8b8864ba1535d2a676 HEAD -- research/contrib/chatgpt/WSP-139/prereg.json
          git merge-base --is-ancestor b8dea2ec81df71bbca17d5668785dcf09b8cf142 HEAD
          git diff --exit-code b8dea2ec81df71bbca17d5668785dcf09b8cf142 HEAD -- research/contrib/chatgpt/WSP-137/policy.py research/contrib/chatgpt/WSP-137/controls.py research/contrib/chatgpt/WSP-135/learner.py research/contrib/chatgpt/WSP-136/oracle.py
          test ! -e research/contrib/chatgpt/WSP-139/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-139/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: New public-source post-action question trial and negative controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-139 -p 'test_*.py' -v
      - name: Test does not change source
        shell: bash
        run: test -z "$(git status --porcelain)"
  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp139): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp139-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-pin only derived G29 atlas html ice json
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor b45a7e6ad65edeff26ecbc8b8864ba1535d2a676 HEAD
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp139): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp139-postaction-unseen-queries-20261117
  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp139): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify final source and source-pinned G29 atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code b45a7e6ad65edeff26ecbc8b8864ba1535d2a676 HEAD -- research/contrib/chatgpt/WSP-139/prereg.json
          git diff --exit-code b8dea2ec81df71bbca17d5668785dcf09b8cf142 HEAD -- research/contrib/chatgpt/WSP-137/policy.py research/contrib/chatgpt/WSP-137/controls.py research/contrib/chatgpt/WSP-135/learner.py research/contrib/chatgpt/WSP-136/oracle.py
          test ! -e research/contrib/chatgpt/WSP-139/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Mandatory WSP135 WSP136 WSP137 WSP139 and root full regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 139; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
