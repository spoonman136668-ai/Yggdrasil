name: DG1-IV18 independent two-probe novelty veto DEV
on:
  push:
    branches: [research/dg1-iv18-two-probe-veto-20261113]
    paths:
      - 'research/contrib/chatgpt/dg1-iv18-20261113/**'
      - '.github/workflows/dg1-iv18-qualification.yml'
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/contrib/chatgpt/dg1-iv18-20261113/**'
      - '.github/workflows/dg1-iv18-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    name: IV18 preflight and full regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify separate immutable preregistration ancestor and exact frozen identities
        shell: bash
        run: |
          git merge-base --is-ancestor 20b0af804ffbd04d7e3d22cdf39b3c82a14d7093 HEAD
          test "$(git rev-parse 20b0af804ffbd04d7e3d22cdf39b3c82a14d7093^)" = "5e74f8db85b2f5839c42148c0dfba69a88b1a2c9"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/contrib/chatgpt/dg1-iv18-20261113")
          d=json.loads((p/"prereg.json").read_text())
          assert d["experiment_id"]=="DG1-IV18-20261113"
          assert d["exact_parent_sha"]=="5e74f8db85b2f5839c42148c0dfba69a88b1a2c9"
          assert d["inputs"][0]["sha256"]=="37b70a87720bfbc26a7fe05f6460cbf6c1607a7f07cdb2b04eb85c452f2a10fb"
          assert len(d["frozen_design"]["seeds"])==16
          print("IV18_FROZEN_PREREG_PASS")
          PY
      - name: Pre-first-use syntax, integer-baseline training and negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-iv18-20261113/iv18.py research/contrib/chatgpt/dg1-iv18-20261113/test_iv18.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-iv18-20261113 -p 'test_*.py' -v
      - name: Original 16-world paid two-step trial on PR opening only
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/contrib/chatgpt/dg1-iv18-20261113/iv18.py > iv18-firstuse.json
      - name: Validate physical custody and publish science verdict without making negatives fail CI
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("iv18-firstuse.json").read_text())
          assert d["schema"]=="yggdrasil.dg1-iv18-original.v1"
          assert d["freeze_sha"]=="20b0af804ffbd04d7e3d22cdf39b3c82a14d7093"
          assert d["world_count"]==16
          assert d["paid_steps"]==24576 and d["paid_training_steps"]==15360
          assert d["paid_audit_steps"]==9216 and len(d["controls"])==6
          for w in d["worlds"]:
              arms=w["arms"]
              assert len(arms)==6
              assert len({v["train_trace_sha256"] for v in arms.values()})==1
              for v in arms.values():
                  assert v["paid_steps"]==256 and v["charged_observations"]==160
                  assert len(v["cold_bytes"])==3 and max(v["cold_bytes"])<=65536
                  for mark in (128,160):
                      a=v["audits"][str(mark)]
                      assert len(a["choices"])==12
          print("IV18_PHYSICAL_CUSTODY_PASS")
          print("IV18_CLASSIFICATION:"+d["classification"])
          print("IV18_PRIMARY:"+str(d["primary_pass"]))
          print("IV18_GATES:"+json.dumps(d["primary_gates"],sort_keys=True))
          print("IV18_AGGREGATES:"+json.dumps(d["aggregate"],sort_keys=True))
          PY
      - name: Generate pinned G29 atlas and emit source-derived bytes only before final atlas commit
        id: atlas
        shell: bash
        run: |
          python - <<'PY'
          import base64,os,subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          import build_code_atlas as atlas
          def git(*args):
              return subprocess.check_output(["git",*args],text=True).strip()
          head=git("rev-parse","HEAD")
          changed=set(git("diff","--name-only","HEAD^","HEAD").splitlines())
          atlas_only=changed==set(atlas.OUT)
          source=git("rev-parse","HEAD^") if atlas_only else head
          subprocess.run(["python","scripts/build_code_atlas.py",
                          "--source-commit",source,"--write"],check=True)
          committed=atlas_only and all(
              subprocess.check_output(["git","show","HEAD:"+name])==
              Path(name).read_bytes() for name in atlas.OUT)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("committed="+str(committed).lower()+"\n")
              f.write("source="+source+"\n")
          print("IV18_G29_SOURCE:"+source)
          print("IV18_G29_COMMITTED:"+str(committed))
          if not committed and os.environ.get("RUNNER_OS")=="Linux":
              for name in atlas.OUT:
                  b64=base64.b64encode(Path(name).read_bytes()).decode("ascii")
                  chunks=[b64[k:k+1200] for k in range(0,len(b64),1200)]
                  for n,part in enumerate(chunks):
                      print("IV18_ATLAS_CHUNK|"+name+"|"+str(n)+"|"+
                            str(len(chunks))+"|"+part)
          PY
      - name: Mandatory full inherited regression on committed, source-identical G29 atlas
        if: steps.atlas.outputs.committed == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check-if-present
      - name: Prove only derived atlas worktree files differ
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only"],text=True).splitlines())
          allowed={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"}
          assert changed.issubset(allowed), sorted(changed)
          print("IV18_TRACKED_SCIENCE_SOURCE_UNMODIFIED_PASS")
          PY
      - name: Store original original-source physical JSON on GitHub Actions only
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-iv18-original-${{ matrix.os }}
          path: iv18-firstuse.json
          if-no-files-found: ignore
  original-cross-os-parity:
    name: Original IV18 Linux Windows strict non-timing and checkpoint equality
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-iv18-original-ubuntu-latest
          path: original-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-iv18-original-windows-2022
          path: original-windows
      - name: Independently fail on any non-timing mismatch
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("original-linux/iv18-firstuse.json").read_text())
          b=json.loads(Path("original-windows/iv18-firstuse.json").read_text())
          def strip_timing(x):
              if isinstance(x,dict):
                  return {k:strip_timing(v) for k,v in x.items()
                          if k not in ("cpu_ns","cpu_median_ratio")}
              if isinstance(x,list):
                  return [strip_timing(v) for v in x]
              return x
          if strip_timing(a)!=strip_timing(b):
              raise AssertionError("IV18_INVALID_REPRO_OR_CHECKPOINT_DRIFT")
          print("IV18_ORIGINAL_CROSS_OS_EXACT_NON_TIMING_PARITY_PASS")
          PY
