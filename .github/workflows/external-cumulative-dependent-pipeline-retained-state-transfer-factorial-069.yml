name: Yggdrasil retained-state transfer factorial 069
on:
  push:
    branches:
      - research/external-hosted-yggdrasil-dependent-pipeline-retained-state-transfer-factorial-r1
    paths:
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.ice'
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          prereg="9fa492b65640c3673af92174facf2378136ac30d"
          parent="36f38df165cb35cda6def1cc3ce8078b5f720a62"
          pp="research/experiments/exp-dgr-external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.ice"
          test "$(git rev-parse "$prereg^")" = "$parent"
          git merge-base --is-ancestor "$prereg" HEAD
          changed="$(git diff --name-only "$parent..HEAD" | sort)"
          expected="$(printf '%s\n'             '.github/workflows/external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.yml'             'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.py'             "$pp" | sort)"
          test "$changed" = "$expected"
          grep -F '"activation_positions"' "$pp"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-RETAINED-STATE-TRANSFER-FACTORIAL-069","preregistration_sha":"9fa492b65640c3673af92174facf2378136ac30d","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001872","manifest_sha256":"e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"2518306c74ff426278f31b1199f8ad9891299d14"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="4f7289f63effe70a7e0e31a893c91c2da0f3575dc90199e392ef939c1253ab7f"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="9fa492b65640c3673af92174facf2378136ac30d"
          assert r["manifest_sha256"]=="e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact third-manifest sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-069"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c","9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",303863,41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
            ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json","d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",118601,14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
            ("technical-prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md","61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",11025,1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,full_h,full_n,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"ygg-069"}),timeout=30).read(full_n+1)
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h
              p=b[:prefix_n]
              assert len(p)==prefix_n and hashlib.sha256(p).hexdigest()==prefix_h
              (root/(d+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen factorial twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-retained-state-transfer-factorial-069.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"];a=r["attribution"]
          valid=(m["position_variant_count"]==7 and m["all_variant_invalid_evaluation_rows"]==0 and
            m["all_variant_source_identity_mismatch_count"]==0 and m["all_variant_transport_identity_mismatch_count"]==0 and
            m["capacity_growth_event_count"]==0 and m["external_model_call_count"]==0 and m["tokenizer_use_count"]==0 and
            m["heldout_position_selection_count"]==0 and m["row_synthesis_count"]==0 and
            all(math.isfinite(float(v)) for v in m.values()))
          supported=valid and a in ("ACTIVATION_POSITION","PAYLOAD_MISMATCH","TARGET_CONTEXT_MISMATCH")
          mixed=valid and a=="MULTIPLE"
          cls="supported" if supported else ("mixed" if mixed else ("negative" if valid else "invalid"))
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-RETAINED-STATE-TRANSFER-FACTORIAL-069","classification":cls,"validity_pass":valid,"attribution":a,"authority_receipt_sha256":"4f7289f63effe70a7e0e31a893c91c2da0f3575dc90199e392ef939c1253ab7f","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-069"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-retained-state-transfer-factorial-069
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
