name: Yggdrasil Y040 frozen memory reset severity frontier
on:
  push:
    branches: [research/y040-reset-severity-frontier-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen source verification
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 286dfaec783ff017fd6921e0575e7bbf7e70c020 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-interrupt/execute.py)" = 45f067d356dccf05dea55dd58039a5049f4d0a1e
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-reset-frontier/prereg.json)" = 7089e0d5893c3995c7209c1ba80c37b4eff5bf67
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-reset-frontier/execute.py)" = d0b9dd4ca6ad47a1c4a8114cc8553288e6a53c45
          python3 -m json.tool research/contrib/chatgpt/20261013-y040-reset-frontier/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y040-reset-frontier/execute.py
      - name: Original first-use reset and capacity science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y040-reset-frontier/execute.py > /tmp/Y040-original.json
          python3 -m json.tool /tmp/Y040-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y040-original.json'))
          assert len(x['cells'])==48 and x['sealed_heldout_seeds']==list(range(400,416))
          print('CLASSIFICATION',x['classification'])
          for c in x['cells']:
              print('CELL',c['capacity'],c['reset_schedule'],c['regime'],c['saved_churn'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y040-original-reset-severity
          path: /tmp/Y040-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
