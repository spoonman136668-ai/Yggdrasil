name: Yggdrasil event-driven research continuation

on:
  workflow_run:
    workflows:
      - YGG-A Developmental Lane
      - YGG-B Language Lane
      - YGG-C Scaling Lane
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  continue-a:
    if: github.event.workflow_run.head_branch == 'research/ygg-a-developmental'
    runs-on: [self-hosted, Windows, X64, yggdrasil, ygg-a, research-only]
    timeout-minutes: 45
    concurrency:
      group: ygg-a-event-continuation
      cancel-in-progress: false
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: controller
          persist-credentials: false
          fetch-depth: 1
      - name: Read autonomy switch
        id: gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $C = Get-Content -LiteralPath 'controller\.research-autonomy\config.json' -Raw | ConvertFrom-Json
          if ($C.schema -cne 'research.autonomy.v1') { throw 'AUTONOMY_SCHEMA_INVALID' }
          "enabled=$([string]([bool]$C.enabled).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Checkout completed research head
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Continue A lane
        if: steps.gate.outputs.enabled == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & 'controller\scripts\Invoke-EventDrivenResearchContinuation.ps1' -RepoPath (Resolve-Path 'target').Path -Repository '${{ github.repository }}' -RunId ${{ github.event.workflow_run.id }} -HeadBranch '${{ github.event.workflow_run.head_branch }}' -HeadSha '${{ github.event.workflow_run.head_sha }}' -Conclusion '${{ github.event.workflow_run.conclusion }}' -Program yggdrasil -Lane a

  continue-b:
    if: github.event.workflow_run.head_branch == 'research/ygg-b-language'
    runs-on: [self-hosted, Windows, X64, yggdrasil, ygg-b, research-only]
    timeout-minutes: 45
    concurrency:
      group: ygg-b-event-continuation
      cancel-in-progress: false
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: controller
          persist-credentials: false
          fetch-depth: 1
      - name: Read autonomy switch
        id: gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $C = Get-Content -LiteralPath 'controller\.research-autonomy\config.json' -Raw | ConvertFrom-Json
          if ($C.schema -cne 'research.autonomy.v1') { throw 'AUTONOMY_SCHEMA_INVALID' }
          "enabled=$([string]([bool]$C.enabled).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Checkout completed research head
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Continue B lane
        if: steps.gate.outputs.enabled == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & 'controller\scripts\Invoke-EventDrivenResearchContinuation.ps1' -RepoPath (Resolve-Path 'target').Path -Repository '${{ github.repository }}' -RunId ${{ github.event.workflow_run.id }} -HeadBranch '${{ github.event.workflow_run.head_branch }}' -HeadSha '${{ github.event.workflow_run.head_sha }}' -Conclusion '${{ github.event.workflow_run.conclusion }}' -Program yggdrasil -Lane b

  continue-c:
    if: github.event.workflow_run.head_branch == 'research/ygg-c-scaling'
    runs-on: [self-hosted, Windows, X64, yggdrasil, ygg-c, research-only]
    timeout-minutes: 45
    concurrency:
      group: ygg-c-event-continuation
      cancel-in-progress: false
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: controller
          persist-credentials: false
          fetch-depth: 1
      - name: Read autonomy switch
        id: gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $C = Get-Content -LiteralPath 'controller\.research-autonomy\config.json' -Raw | ConvertFrom-Json
          if ($C.schema -cne 'research.autonomy.v1') { throw 'AUTONOMY_SCHEMA_INVALID' }
          "enabled=$([string]([bool]$C.enabled).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Checkout completed research head
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: true
      - name: Continue C lane
        if: steps.gate.outputs.enabled == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & 'controller\scripts\Invoke-EventDrivenResearchContinuation.ps1' -RepoPath (Resolve-Path 'target').Path -Repository '${{ github.repository }}' -RunId ${{ github.event.workflow_run.id }} -HeadBranch '${{ github.event.workflow_run.head_branch }}' -HeadSha '${{ github.event.workflow_run.head_sha }}' -Conclusion '${{ github.event.workflow_run.conclusion }}' -Program yggdrasil -Lane c
