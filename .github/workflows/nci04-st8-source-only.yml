name: NCI04 ST8 frozen original cubic source-only falsification
on:
  push:
    branches:
      - research/nci04-st8-contradiction-driven-growth-20261115
permissions:
  contents: read
jobs:
  actual_source:
    name: ST8 genuine cubic vs quadratic source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Windows byte-preserving Git settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact prereg and original source before stage0
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a8ec2023c9e9b49380d21e7d8e3ec20e18b4345f HEAD
          git merge-base --is-ancestor 2e9cdb5a84306f54f670fd17d9f063809604d236 HEAD
          test "$(git rev-parse HEAD:research/nci04_st8/frozen_protocol.json)" = 1bf9f460c8a38d271ed1299c8d86cb777b0b0a0e
          test "$(git rev-parse HEAD:research/nci04_st8/private_world.py)" = 39502f081e85ff0d3f7a5c22101a7bf3c1f3629a
          test "$(git rev-parse HEAD:research/nci04_st8/source_audit.py)" = b8bdfd1ca0106605485cb345ab0d96de10c19027
          python -B - <<'PY'
          from research.nci04_st8.source_audit import verify
          p=verify()
          assert p['authority']['merge'] is False
          assert p['authority']['protected_scientific_first_use'] is False
          print('ST8_SOURCE_FROZEN_PRE_OUTCOME_GIT_CUSTODY=PASS')
          PY
      - name: Bounded original-source falsification fixtures and inherited controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st8_source.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04_st7_source.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04d2_task.py' -v
          python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
          echo ST8_SOURCE_FOCUSED_TESTS=PASS
      - name: Execute ONLY prereg training-source original 7680 actions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import os
          from research.nci04_st8.source_audit import audit
          o=Path(os.environ['RUNNER_TEMP'])/'st8-original-source.json'
          x=audit(o)
          assert x['no_native_model_trained'] is True
          assert x['held_worlds_unopened'] is True
          assert x['different_rule_negative_unopened'] is True
          assert x['interference_source_unopened'] is True
          assert x['protected_scientific_first_use_unopened'] is True
          print('ST8_REAL_SOURCE_STAGE0_RECORDED=PASS')
          PY
      - name: Require untouched clean checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st8-original-source-${{ matrix.os }}
          path: ${{ runner.temp }}/st8-original-source.json
          if-no-files-found: error
          retention-days: 14
  original_parity:
    needs: actual_source
    name: ST8 source action history and cubic rank cross-OS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st8-original-source-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st8-original-source-windows-2022
          path: windows
      - name: Exact frozen original public source traces
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('linux/st8-original-source.json').read_text('utf-8'))
          y=json.loads(Path('windows/st8-original-source.json').read_text('utf-8'))
          for k in x:
              if x[k]!=y[k]:
                  raise SystemExit('ST8_CUBIC_SOURCE_CROSS_OS_DRIFT_'+k)
          print('ST8_ORIGINAL_PUBLIC_SOURCE_CROSS_OS=PASS')
          print('ST8_CUBIC_SOURCE_RANK='+str(x['observed_cubic_GF2_rank']))
          print('ST8_QUADRATIC_CONTRADICTIONS='+str(x['observed_quadratic_contradictions']))
          print('ST8_SOURCE_DISPOSITION='+x['source_gate']['disposition'])
          print('ST8_NO_HELD_OR_FIRST_USE=PASS')
          PY
