name: G29 PR515 merge-commit integration preview (no protected merge)
on:
  push:
    branches: [qualification/g29-pr515-mergecommit-preview-20261025]
permissions:
  contents: read
jobs:
  verify-merge-tree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6f534615adc55abbbc75476fd87d935f8ff4224e
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify simulated protected-base merge parents, original source ancestry, and tree identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f534615adc55abbbc75476fd87d935f8ff4224e"
          test "$(git rev-parse HEAD^{tree})" = "14eb2a54130bf98b406c921de25d3311877d20c7"
          test "$(git rev-list --parents -n 1 HEAD)" = "6f534615adc55abbbc75476fd87d935f8ff4224e 9b069040feeddd9f509ab2c8ac9656d0a2c07d77 14275a69ee553d2ed17c4a9e551d2486454d58f3"
          git merge-base --is-ancestor 9b069040feeddd9f509ab2c8ac9656d0a2c07d77 HEAD
          git merge-base --is-ancestor 14275a69ee553d2ed17c4a9e551d2486454d58f3 HEAD
          git merge-base --is-ancestor 4fa403f2b4203ce04eb82fb3f4733033a6c845a1 HEAD
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          test "$(git rev-parse HEAD:.github/workflows/yggdrasil-g29-atlas.yml)" = "baa005e32579327d5dde27a1a7bf653eb85c665c"
          test -z "$(git status --porcelain)"
          echo G29_SIMULATED_MERGE_TWO_PARENTS_AND_TREE=PASS
      - name: "Qualify unmodified merged tree - G29, supported OS regression, no source rewrites"
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
            python -B -m unittest discover -s tests -p 'test_portable_checkpoint.py' -v
            python -B -c "import importlib.util; assert importlib.util.find_spec('resource') is None"
            echo G29_WINDOWS_SIDECAR_POSIX_ONLY_RECORDED_NOT_EXECUTED=PASS
          else
            python -B -m unittest discover -s tests -p 'test_*.py' -v
            echo G29_LINUX_FULL_REPOSITORY_PYTHON=PASS
          fi
          test -z "$(git status --porcelain)"
          git diff --exit-code
          echo G29_SIMULATED_MERGE_COMMIT_QUALIFIED=PASS
          echo ORIGINAL_EXTERNAL_WORLD_SCIENCE_STEPS=ZERO
