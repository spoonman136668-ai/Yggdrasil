name: YDR LU2P Bound Artifact Open

on:
  push:
    branches: [dg1a-ar]
    paths:
      - research/control/lu2p-bound-open.json

permissions:
  contents: read
  actions: read

jobs:
  open-bound-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "spoonman136668-ai/Yggdrasil"
          test -f research/control/lu2p-bound-open.json

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ydr-venv
          /tmp/ydr-venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          /tmp/ydr-venv/bin/python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Download accepted LU2P duplicate
        uses: actions/download-artifact@v4
        with:
          name: ydr-isolated-36058520738-1
          path: /tmp/lu2p-accepted
          github-token: ${{ github.token }}
          run-id: 36058520738

      - name: Open exact accepted duplicate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lu2p-open
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
          ln -sfn "${GITHUB_WORKSPACE}/research/applications/track-a" /mnt/data/task1_loader_test
          test "$(wc -c < /tmp/lu2p-accepted/primary1.bin)" -eq 243510
          test "$(sha256sum /tmp/lu2p-accepted/primary1.bin | awk '{print $1}')" = "11f3d7372827a903f741a399ea9e73179168df5a688149ae2968671230dd24b4"
          cmp /tmp/lu2p-accepted/primary1.bin /tmp/lu2p-accepted/primary2.bin
          /tmp/ydr-venv/bin/python research/applications/track-a/lu2p_contiguous_lesion_mature_repair_v1.py \
            open /tmp/lu2p-accepted/primary1.bin /tmp/lu2p-accepted/primary2.bin /tmp/lu2p-open/qualification.json
          cat /tmp/lu2p-open/qualification.json

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: lu2p-bound-open-${{ github.run_id }}
          path: /tmp/lu2p-open/**
          if-no-files-found: error
          retention-days: 14
