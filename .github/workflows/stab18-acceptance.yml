name: STAB-18 Acceptance

on:
  push:
    branches:
      - stab18-acceptance

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: STAB-18 contracts
        run: python -m pytest -q tests/test_stab18_causal_latent_prune.py
      - name: Full regression
        run: python -m pytest -q
