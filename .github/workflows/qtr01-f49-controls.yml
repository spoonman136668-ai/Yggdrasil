name: QTR-01 F49 isolated causal learners and strong controls
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 derive control atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable prerequisite and workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5e0ab7d1cf40f1a05ea2cb64492ab6beee448ca7'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f49-controls.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_worlds.py)" = '9a5185584b965f6529ceceadc1da8da8eb36be70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_discrete_learners.py)" = '4981cdbcd3f46e4b54d5b991fd872e5a8d5761a0'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_conventional_controls.py)" = '5eaad015cc0388854268bc36fda1a673b28ffcaf'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_discrete_learners.py)" = 'ce091e7cc3747beefff00a6d90d129ae6fbe4d1e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_conventional_controls.py)" = '8b8b133f57819cb7316a8cdd409c7a6dd26ea618'
          test -z "$(git status --porcelain)"
          echo F49_CONTROL_ATLAS_SOURCE_PIN=PASS
      - name: Build only derived, source-locked G29 atlas
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F49 controls G29 atlas companion'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "F49_CONTROL_ATLAS_COMPANION_SHA=$(git rev-parse HEAD)"
  qualify:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 controls exact-source full qualification'
    name: F49 controls full regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows checkout file bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require exact candidate and immutable research source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F49 controls exact-source full qualification'
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): derive F49 controls G29 atlas companion'
          git merge-base --is-ancestor 5e0ab7d1cf40f1a05ea2cb64492ab6beee448ca7 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_worlds.py)" = '9a5185584b965f6529ceceadc1da8da8eb36be70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_discrete_learners.py)" = '4981cdbcd3f46e4b54d5b991fd872e5a8d5761a0'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_conventional_controls.py)" = '5eaad015cc0388854268bc36fda1a673b28ffcaf'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_discrete_learners.py)" = 'ce091e7cc3747beefff00a6d90d129ae6fbe4d1e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_conventional_controls.py)" = '8b8b133f57819cb7316a8cdd409c7a6dd26ea618'
          python scripts/build_code_atlas.py --check
          echo F49_SEVEN_ARM_CODE_SOURCE_PIN_PASS
      - name: Install pinned regression dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: F49 native and strong-control unit/negative tests (no target world use)
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f49_*.py' -v
      - name: Full original Yggdrasil regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Verify no target/scientific first use and no source drift
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f49_worlds.py
          python -B research/contrib/chatgpt/QTR-01/f49_discrete_learners.py
          python -B research/contrib/chatgpt/QTR-01/f49_conventional_controls.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F49_NO_TARGET_FIRST_USE_OR_ACCEPTED_WEIGHT_MUTATION=PASS
