name: ITD-02 V31C false-return source attribution
on:
  push:
    branches: [research/itd02-v31c-false-source-attribution-20261028]
permissions:
  contents: read
jobs:
  attribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source and freeze
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0d97bd518fb7ca4044a97bf125292ba6f26a4e36 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Attribute observed false return and preserve JSON evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31c"
          PYTHONPATH=. python -B research/itd02_v31c_false_return_attribution.py > "$RUNNER_TEMP/v31c/report.json"
          python - "$RUNNER_TEMP/v31c/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["classification"]=="V31C_FALSE_RETURN_ATTRIBUTED__V31B_STILL_NO_GO__NO_SCIENCE"
          assert d["return_latency"]==[1,4]
          assert d["false_unchanged_t1"]==3 and d["false_unchanged_t2"]==0
          assert not d["holdout_evaluated"] and not d["scientific_first_use"]
          assert len(d["canonical_public_sha256"])==64
          print("V31C_DIAGNOSTIC_ONLY_PASS_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v31c/report.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_public_history_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31c-${{ matrix.os }}
          path: ${{ runner.temp }}/v31c/*
          retention-days: 7
          if-no-files-found: warn
