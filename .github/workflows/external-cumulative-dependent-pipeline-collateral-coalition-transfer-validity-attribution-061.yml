name: Yggdrasil transfer validity attribution 061
on:
  push:
    branches:
      - research/external-hosted-yggdrasil-dependent-pipeline-collateral-coalition-transfer-validity-attribution-r1
    paths:
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          prereg="5b2be77e1403d68ede2e76b8ee76972c5a979570"
          parent="bf45fc1475b998555a20501199cd4e2426afe211"
          pp="research/experiments/exp-dgr-external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.ice"
          git merge-base --is-ancestor "$prereg" HEAD
          test "$(git rev-parse "$prereg^")" = "$parent"
          changed="$(git diff --name-only "$parent..HEAD" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.yml' \
            'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.py' \
            "$pp" | sort)"
          test "$changed" = "$expected"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-COLLATERAL-COALITION-TRANSFER-VALIDITY-ATTRIBUTION-061","preregistration_sha":"5b2be77e1403d68ede2e76b8ee76972c5a979570","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001840","manifest_sha256":"c79f09eb3841309b38827ceffee6a14eb87973c8aa2cf817908ed05f10e5c250","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"06c3cb723820407bc2db1bd3ec9e46f462059e41"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="b0c1720dccd3bc5c8fc2233bd78b9aba92968988eb2be59492fee2813d3428c5"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="5b2be77e1403d68ede2e76b8ee76972c5a979570"
          assert r["manifest_sha256"]=="c79f09eb3841309b38827ceffee6a14eb87973c8aa2cf817908ed05f10e5c250"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact disjoint external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-061"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py","3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",61896,41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json","ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14490,14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md","c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",3124,1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,full_h,full_n,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"ygg-061"}),timeout=30).read(full_n+1)
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h
              p=b[:prefix_n]; assert hashlib.sha256(p).hexdigest()==prefix_h
              (root/(d+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run diagnostic replay twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-coalition-transfer-validity-attribution-061.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          m=json.loads(pathlib.Path("/tmp/result1.json").read_text())["metrics"]
          replay=(
            m["source_identity_mismatch_count"]==0 and m["transfer_manifest_identity_mismatch_count"]==0 and
            m["base_training_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["baseline_mean_first_success_packet"]==3 and m["candidate_mean_first_success_packet"]==3 and
            m["candidate_mean_packet_reduction"]==0 and m["candidate_positive_reduction_schedule_count"]==0 and
            m["candidate_positive_prose_collateral_schedule_count"]==4 and m["candidate_partner_collateral_failure_count"]==0 and
            m["preserved_state_structure_count_min"]==16 and m["preserved_state_structure_count_max"]==16 and
            m["active_structure_count_min"]==7 and m["active_structure_count_max"]==7 and
            m["retained_structure_count_min"]==9 and m["retained_structure_count_max"]==9 and
            m["matched_assignment_failure_count"]==0 and m["invalid_evaluation_rows"]==26 and
            m["diagnostic_invalid_contribution_sum"]==26 and
            all(math.isfinite(float(v)) for v in m.values())
          )
          other_names=[
            "inject_missing_carry_key_count","inject_capacity_failure_count","build_structure_failure_count",
            "partition_failure_count","oversized_reserved_set_count","active_selection_failure_count",
            "empty_derived_count","short_history_rank_count","short_prose_rank_count","empty_future_count",
            "empty_packet_count","schedule_count_failure_count","other_low_level_invalid_count"
          ]
          others=sum(m[n] for n in other_names)
          if not replay: cls="invalid"
          elif m["candidate_reserved_key_missing_count"]==26 and m["candidate_reserved_key_missing_select_count"]>0 and others==0 and m["history_budget_failure_count"]==0: cls="supported"
          elif m["candidate_reserved_key_missing_count"]>0: cls="mixed"
          else: cls="negative"
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-COLLATERAL-COALITION-TRANSFER-VALIDITY-ATTRIBUTION-061","classification":cls,"validity_pass":replay,"authority_receipt_sha256":"b0c1720dccd3bc5c8fc2233bd78b9aba92968988eb2be59492fee2813d3428c5","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not replay: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-061"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-transfer-validity-attribution-061
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
