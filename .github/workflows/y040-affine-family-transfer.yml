name: Yggdrasil Y040 frozen unseen affine-family transfer
on:
  push:
    branches: [research/y040-affine-frame-family-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact parent and frozen science inputs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b368758c9f772046f2e67eed628dc3d5e4c6ae4d HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-moving-frame/execute.py)" = 6c12b0d1fd722ba516483c0b9ef0c4f0ecc30a76
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-affine-family/prereg.json)" = e121526561ae9f09f8a2d71dc8a08f9dd4da7f6a
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-affine-family/execute.py)" = 18664bdc0ddfc873e221a9761d2dbe0b5c315d55
          python3 -m json.tool research/contrib/chatgpt/20261013-y040-affine-family/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y040-affine-family/execute.py
      - name: First-use original frozen science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y040-affine-family/execute.py > /tmp/Y040-original-affine-transfer.json
          python3 -m json.tool /tmp/Y040-original-affine-transfer.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y040-original-affine-transfer.json'))
          assert a['sealed_heldout_seeds']==list(range(640,656))
          assert len(a['coordinate_families'])==4
          assert len(a['all_records'])==4*24*3
          print('CLASSIFICATION',a['classification'],'MISMATCHES',a['heldout_assignment_mismatches'],'CHURN',a['heldout_churn'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y040-original-affine-transfer
          path: /tmp/Y040-original-affine-transfer.json
          retention-days: 90
          if-no-files-found: error
      - name: One full repository regression and build
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
