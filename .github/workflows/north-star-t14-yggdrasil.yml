name: T14 yggdrasil exact-source original scientific diagnostic
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t14-yggdrasil.yml']
permissions:
  contents: read
concurrency:
  group: t14-yggdrasil-original-first-source
  cancel-in-progress: false
jobs:
  source-pinned-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed exact source and original assay provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T14_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t14-source.py').Trim() -cne '848149ac9752c7d9fa11a4429d985905a45953a1'){throw 'T14_SOURCE_DEFINITION_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t14-mechanism.py').Trim() -cne '9b22f32e0fcdef862d37878428d640dcce09c76f'){throw 'T14_LEARNER_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t14-complete-source-and-assay-freeze.json').Trim() -cne 'af6dad606834352fd21a6f048bb48101a4c5ed71'){throw 'T14_ASSAY_DRIFT'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t14-complete-source-and-assay-freeze.json').Trim() -cne 'ceca2b7f0bff4c561a5e91c47dfbac08a1d11407'){throw 'T14_FREEZE_NOT_BEFORE_MECHANISM'}
          git merge-base --is-ancestor 3cdca321f1d40d328b1078f021c38598f4435d51 HEAD
          if($LASTEXITCODE -ne 0){throw 'T14_SOURCE_NOT_ANCESTOR'}
          git merge-base --is-ancestor ceca2b7f0bff4c561a5e91c47dfbac08a1d11407 HEAD
          if($LASTEXITCODE -ne 0){throw 'T14_ASSAY_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t12-mechanism.py').Trim() -cne '18a42a9b79d99c751a436d72803fd9cd6d28cd88'){throw 'T14_CONTROL_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t13-mechanism.py').Trim() -cne '441057cf461a6c8a684b090cc5d495dc82aecabb'){throw 'T14_CONTROL_DRIFT'}
          Write-Output 'T14_YGGDRASIL_ORIGINAL_PROVENANCE_PREFLIGHT=PASS'
      - name: Nonconsuming Python structural preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile 'research/north-star-transfer/20261019-yggdrasil-t14-source.py' 'research/north-star-transfer/20261019-yggdrasil-t14-mechanism.py'
          if($LASTEXITCODE -ne 0){throw 'T14_STATIC_COMPILE_FAILED'}
          Write-Output 'T14_NONCONSUMING_IMPORT_AND_SYNTAX=PASS'
      - name: First original nonprotected TRAIN and OPEN qualification (Linux ONLY)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python 'research/north-star-transfer/20261019-yggdrasil-t14-mechanism.py' > t14-yggdrasil-original.json
          if($LASTEXITCODE -ne 0){throw 'T14_ORIGINAL_FAILED_IDS_CONSUMED_NO_REPLAY'}
          python -c "import json; d=json.load(open('t14-yggdrasil-original.json',encoding='utf-8-sig')); assert d['schema']=='yggdrasil.t14.original-sourceonly-diagnostic.v1' and d['signed_scientific_acceptance'] is False and d['optimizer_admission'] is False; print('T14_SOURCE_VERIFIED_NOT_SCIENTIFICALLY_ADMITTED=PASS')"
          if($LASTEXITCODE -ne 0){throw 'T14_RESULT_ASSERTION_FAILED_IDS_CONSUMED_NO_REPLAY'}
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: t14-yggdrasil-original-source-stdout
          path: t14-yggdrasil-original.json
          if-no-files-found: ignore
          retention-days: 90
