name: FKP15 pinned real-source learned 16-step macro values vs strong controls
on:
  push:
    branches: [ci/fkp15-real-value-learner-once-20261115]
    paths: [.github/workflows/fkp15-once.yml]
permissions:
  contents: write
concurrency:
  group: fkp15-one-original-public-20261115
  cancel-in-progress: false
jobs:
  source-atlas-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-15): one corrected public DEV after source accounting repair' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    env:
      SOURCE: 1610415e2d2e96e0d7f3ad558d37ce1f3e5d78a4
      TREE: fdc5ba1130efa8ef569e8c02aaa506fbceefbecb
      TARGET: research/fkp15-observation-to-16step-action-value-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: No implicit Windows line rewrites
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1610415e2d2e96e0d7f3ad558d37ce1f3e5d78a4
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert pre-experiment prereg FIRST and exact seven-source-blob immutable tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 0f8f70520e79563f9954360b13fe1ba4667d9d0d "$SOURCE"
          git merge-base --is-ancestor 5d99679baaf5ea57b615ff07ec691159585ed02a "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/prereg.json)" = 121a2a602a19a1b9b16e035737ea285eb47542e2
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/source.py)" = 3341d36270ef36d7f2e1ac8b7ae9aa1b81bf2212
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/learners.py)" = 29ed00e5db7d79c9889e87cbaf0240dca4f14443
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/baselines.py)" = c08c03d9159ac6a791f9c2fce8f7cd7d859287b4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/run_dev.py)" = 037679da0f6fb8d39c6feb0e4767a2e80c0ac8af
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/test_fkp15.py)" = c8f9566434d6ad64580dc2998829979d4813be55
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-15/README.md)" = b95e5ca14c5962d34425c8e16b4ea77410ea9cc9
          python - <<'PY'
          import ast,json,pathlib
          root=pathlib.Path("research/contrib/chatgpt/FKP-15")
          for path in root.glob("*.py"):ast.parse(path.read_text(encoding="utf-8"))
          p=json.loads((root/"prereg.json").read_text(encoding="utf-8"))
          assert p["experiment_id"]=="FKP-15"
          assert p["budgets"]["max_original_actions"]=="(64+16+32)*4*(1+9)*(64+16)=358400 conservative; count actual paid env.step, fail closed if exceeded"
          assert p["source"]["sha"]=="a94f2b60d1769ea44df3226561488768e1dff9f4"
          print("FKP15_FROZEN_SOURCE_AND_PRE_REGISTRATION=PASS")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Generate only approved G29 derived source atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
      - name: Publish exactly three generated index artifacts, no science mutation
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-15): source-locked G29 atlas"
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo "FKP15_FROZEN_SOURCE_CANDIDATE=$NEXT"

  before-first-use-two-os:
    needs: source-atlas-only
    if: needs.source-atlas-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: No CRLF source edits
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-atlas-only.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned source + full trained recurrent controls on CPU only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp15-upstream"
          git -C "$RUNNER_TEMP/fkp15-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
          test "$(git -C "$RUNNER_TEMP/fkp15-upstream" rev-parse HEAD)" = a94f2b60d1769ea44df3226561488768e1dff9f4
          test -z "$(git -C "$RUNNER_TEMP/fkp15-upstream" status --porcelain --untracked-files=all)"
          python - <<'PY'
          import gymnasium,numpy,torch,pygame
          assert gymnasium.__version__=="0.29.0"
          assert numpy.__version__=="1.26.4"
          assert torch.__version__=="2.5.1+cpu"
          assert pygame.version.ver=="2.4.0"
          print("FKP15_CPU_STRONG_CONTROL_DEPS=PASS")
          PY
      - name: G29, original source SHA and focused all-controls source-safe tests (NO original DEV)
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-15 -p test_fkp15.py -v
          python - "$RUNNER_TEMP/fkp15-upstream" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"research/contrib/chatgpt/FKP-15")
          import source
          assert source.admit.source_custody(Path(sys.argv[1]))["source_sha"]==source.SOURCE_SHA
          assert len(source.DEV)==32 and len(source.TRANSFER)==64
          print("FKP15_UPSTREAM_CUSTODY_AND_UNOPENED_PUBLIC_DEV=PASS")
          PY
      - name: MANDATORY complete inherited repository regression before original DEV on each OS
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/fkp15-upstream" status --porcelain --untracked-files=all)"
          echo FKP15_TWO_PLATFORM_FULL_REGRESSION_PRE_DEV=PASS

  first-public-source-dev:
    needs: [source-atlas-only,before-first-use-two-os]
    if: needs.before-first-use-two-os.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      train: ${{ steps.eval.outputs.train }}
      val: ${{ steps.eval.outputs.val }}
      dev: ${{ steps.eval.outputs.dev }}
      classification: ${{ steps.eval.outputs.classification }}
    steps:
      - name: No shallow checkout or line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-atlas-only.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned unchanged original source and strong conventional CPU deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp15-upstream"
          git -C "$RUNNER_TEMP/fkp15-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
          python -B scripts/build_code_atlas.py --check-if-present
      - name: One original new DEV, true chosen 16-step intervention after all controls trained
        id: eval
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-15/run_dev.py --public-dev --upstream-root "$RUNNER_TEMP/fkp15-upstream" > "$RUNNER_TEMP/fkp15-original.json"
          python - "$RUNNER_TEMP/fkp15-original.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["schema"]=="fkp15.source-trained-16step-action-choice.dev.v1"
          assert p["original_public_dev_consumed"] and not p["scientific_pass"]
          assert not p["protected_first_use"] and not p["reserved_transfer_opened"]
          assert not p["native_model_modified"] and not p["official_source_reward_tested"]
          assert p["source_action_budget"]["total"]<=p["source_action_budget"]["limit"]==358400
          assert p["candidate_direct_raw_weight_bytes"]==294912
          assert p["candidate_cold_restored_bit_exact"] and p["candidate_tamper_rejected"]
          assert p["source_anchor_counts"]["development"]==128
          assert set(p["trained_controls"])=={"GRU","MLP"}
          assert all(p["trained_controls"][x]["epochs_per_seed"]==24 for x in ("GRU","MLP"))
          for key,val in (("train",p["receipts"]["train_source"]),
                          ("val",p["receipts"]["validation_source"]),
                          ("dev",p["receipts"]["development_source_replay"]),
                          ("classification",p["classification"])):
              with open(sys.argv[2],"a",encoding="utf-8") as out:out.write(key+"="+str(val)+"\n")
          print("FKP15_FIRST_PUBLIC_DEV="+json.dumps({k:p[k] for k in (
              "classification","source_action_budget","source_anchor_counts",
              "best_return_control","mean_real_16step_return",
              "positive_return_action_choice_rate","public_goal_events_by_method",
              "privileged_unavailable_oracle_mean","oracle_minus_random_headroom",
              "candidate_return_gain_over_best_control","world_cluster_bootstrap_ci95",
              "frozen_dev_signal","trained_controls","ridge_val_choice","knn_val_choice","times_seconds"
          )},sort_keys=True))
          print("FKP15_SOURCE_RECEIPTS="+json.dumps(p["receipts"],sort_keys=True))
          PY
      - name: Preserve original full first-use evidence as private workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkp15-original-public-dev-exact-source
          path: ${{ runner.temp }}/fkp15-original.json
          if-no-files-found: error
          retention-days: 30
      - name: Mandatory full regression AFTER original DEV on same source-locked candidate
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/fkp15-upstream" status --porcelain --untracked-files=all)"
          echo FKP15_POST_DEV_FULL_REPO_REGRESSION=PASS

  consumed-source-windows-replay:
    needs: [source-atlas-only,first-public-source-dev]
    if: needs.first-public-source-dev.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECT_TRAIN: ${{ needs.first-public-source-dev.outputs.train }}
      EXPECT_VAL: ${{ needs.first-public-source-dev.outputs.val }}
      EXPECT_DEV: ${{ needs.first-public-source-dev.outputs.dev }}
    steps:
      - name: Source byte stable checkout config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-atlas-only.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned real original simulator source for REPLAY ONLY, no new learner training
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp15-upstream"
          git -C "$RUNNER_TEMP/fkp15-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
      - name: Source-deterministic consumed TRAIN/VAL/DEV physical branch replay and final root regression
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-15/run_dev.py --replay-consumed --upstream-root "$RUNNER_TEMP/fkp15-upstream" > "$RUNNER_TEMP/fkp15-consumed-replay.json"
          python - "$RUNNER_TEMP/fkp15-consumed-replay.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["schema"]=="fkp15.consumed-source-replay-only.v1"
          assert x["classification"]=="CONSUMED_PUBLIC_DEV_MECHANICAL_REPLAY_NOT_NEW_SCIENCE"
          assert x["train_source_sha256"]==os.environ["EXPECT_TRAIN"]
          assert x["validation_source_sha256"]==os.environ["EXPECT_VAL"]
          assert x["dev_source_sha256"]==os.environ["EXPECT_DEV"]
          assert not x["protected_first_use"] and not x["transfer_opened"] and not x["scientific_pass"]
          print("FKP15_WINDOWS_CONSUMED_SOURCE_RECEIPTS_EXACT=PASS")
          print("FKP15_WINDOWS_SOURCE_REPLAY="+json.dumps({k:x[k] for k in (
              "train_source_sha256","validation_source_sha256","dev_source_sha256",
              "initial_direct_snapshot_sha256","source_actions_train",
              "source_actions_validation","source_actions_dev_without_blind_selection"
          )},sort_keys=True))
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/fkp15-upstream" status --porcelain --untracked-files=all)"
          echo FKP15_WINDOWS_FINAL_SOURCE_REPLAY_AND_FULL_REGRESSION=PASS
