name: ITD-02 C33 physical C32 failure forensic (source-only)
on:
  push:
    branches:
      - research/itd02-c33-c32-trajectory-postmortem-20261025
permissions:
  contents: read
  actions: read
concurrency:
  group: itd02-c33-${{ github.ref }}
  cancel-in-progress: false
jobs:
  no-source-event-forensic-unit:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Frozen protocol and failed source original immutable SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 714ca75bb9624bacbe9d87a1a46ef314024d194d "$GITHUB_SHA"
          git merge-base --is-ancestor e0c391bd2d1ceada25ba4b88d419a4dcdd41b543 "$GITHUB_SHA"
          test "$(git hash-object research/mass_r7c32/PREREG.json)" = "5400dd02667db518a3de7ac3732799b492102603"
          test "$(git hash-object research/mass_r7c32/physical_episode.py)" = "ca30f27e13fec9c51fd4af93239cccaec93b6e61"
          test "$(git hash-object research/mass_r7c32/compare.py)" = "816d2da9f8616ff3327efe36e6377ce077a61aa6"
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          python -m py_compile research/mass_r7c33/audit.py research/mass_r7c33/test_audit.py
          echo "C33_ORIGINAL_C32_NEGATIVE_AND_SOURCE_FREEZE=PASS"
      - name: Source-only physical event provenance and loop fixture tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest research.mass_r7c33.test_audit -v
          echo "C33_FOCUSED_SOURCE_ONLY_EVENT_AUDIT=PASS"
          echo "C33_NEW_MINIGRID_ENV_RESETS_STEPS=0"
          echo "C33_PROTECTED_FIRST_USE=DENIED"

  authenticate_original_failed_source_trajectories:
    needs: [no-source-event-forensic-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_ARTIFACT_ID: '12598538562'
      GH_ORIGINAL_C32_ZIP_SHA: '25dfa8e78f2a3fde82e81b9bd7f6312e7413341a74d3579036757dbf9509b4bd'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Require exact old C32 original-source source-return archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/c33-original-C32" "$RUNNER_TEMP/c33-results"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/c32-failed-original.zip" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/$GH_ARTIFACT_ID/zip"
          echo "$GH_ORIGINAL_C32_ZIP_SHA  $RUNNER_TEMP/c32-failed-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c32-failed-original.zip" -d "$RUNNER_TEMP/c33-original-C32"
          echo "C33_EXACT_ARCHIVED_ORIGINAL_PHYSICAL_TRAJECTORIES=PASS"
      - name: Diagnose old original source physical actions but never rerun source simulator
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.mass_r7c33.audit --original-artifact-dir "$RUNNER_TEMP/c33-original-C32" --output "$RUNNER_TEMP/c33-results/c33-real-source-physical-failure-analysis.json"
          echo "C33_PREVIOUS_NEGATIVE_NATIVE_POLICY_UNCHANGED=PASS"
          echo "C33_NEW_FIT_DEV_VALID_PROTECTED_EPISODES=0"
      - name: Preserve immutable original physical failure-reason receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-c33-original-C32-physical-trajectory-negative-mechanisms
          path: ${{ runner.temp }}/c33-results/
          if-no-files-found: warn
          retention-days: 80
