name: CKAD25-W exact-final native regression and source-index G29
on:
  push:
    branches: [research/ckad25w-unlabeled-causal-recall-20261118]
    paths:
      - ".github/workflows/ckad25w-final-regression.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source-pinned-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.g29.outputs.final_sha }}
      source_sha: ${{ steps.g29.outputs.source_sha }}
    steps:
      - name: Exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify immutable original scoring, derive only G29 source-index sidecars
        id: g29
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/ckad25w-unlabeled-causal-recall-20261118
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "7b81c241c8eea19f669a826bb03c6232735c94c3"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-W/run.py)" = "b4bd546859ef038a34935b59988ebe1e124cf160"
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD25-W")
          raw=(root/"result.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="57bb674f9492e77390a25193a4b3f9ee0695d7fa7b391bf53b3fa9d92778b0e0"
          d=json.loads(raw)
          assert d["disposition"]=="DEVELOPMENT_SIGNAL" and all(d["frozen_gates"].values())
          assert d["scientific_pass"] is False and d["forge_dispatch"] is False
          assert d["known_regimes_selected_correctly"]==3
          assert d["A_return_repeated_not_independent"] is True
          print("CKAD25W_ORIGINAL_RESULT_SEALED_WITH_LIMITS_PASS")
          PY
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert changed=={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"},changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(ckad25w): pin exact original source G29 sidecar index"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CKAD25W_G29_SOURCE_SHA=$GITHUB_SHA"
          echo "CKAD25W_G29_FINAL_SHA=$(git rev-parse HEAD)"

  inherited-native-full-regression:
    needs: [source-pinned-atlas]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Keep exact file bytes across OS
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-pinned-atlas.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned conventional model and native regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full final native regression, new negative controls, original evidence audit and pinned G29
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-pinned-atlas.outputs.final_sha }}"
          test "$(git rev-parse 'HEAD^')" = "${{ needs.source-pinned-atlas.outputs.source_sha }}"
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "7b81c241c8eea19f669a826bb03c6232735c94c3"
          test "$(git hash-object tests/test_native_causal_regime_recall.py)" = "7821d910f9076b6d73e34c6958d1efe89d5d2df5"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-W/run.py)" = "b4bd546859ef038a34935b59988ebe1e124cf160"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p test_ckad23.py -v
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD25-W")
          raw=(root/"result.json").read_bytes()
          provenance=json.loads((root/"provenance.json").read_bytes())
          result=json.loads(raw)
          assert hashlib.sha256(raw).hexdigest()=="57bb674f9492e77390a25193a4b3f9ee0695d7fa7b391bf53b3fa9d92778b0e0"
          assert provenance["original_result_sha256"]==hashlib.sha256(raw).hexdigest()
          assert provenance["identical_original_result_bytes_across_platforms"] is True
          assert result["source_sha256"]==hashlib.sha256((root/"run.py").read_bytes()).hexdigest()
          assert result["independent_helper_sha256"]==hashlib.sha256(Path("research/contrib/chatgpt/CKAD25-S/run.py").read_bytes()).hexdigest()
          assert result["disposition"]=="DEVELOPMENT_SIGNAL" and all(result["frozen_gates"].values())
          assert result["overall_mean_brier"]["native_recall"]==.175
          assert result["overall_mean_brier"]["full_exact_bayes"]==.152853639
          assert result["known_regimes_selected_correctly"]==3
          assert result["known_confident_answered"]==12 and result["known_confident_wrong"]==0
          assert result["novel_brier"]==.25 and result["novel_confident_wrong"]==0
          assert result["unique_independent_world_held_labels"]==32
          assert result["scientific_pass"] is False and result["owner_first_use"] is False if "owner_first_use" in result else result["scientific_pass"] is False and result["source_owner_first_use"] is False
          assert result["accepted_main_changed"] is False
          assert result["forge_dispatch"] is False and result["native_promotion"] is False
          assert result["deployment"] is False
          print("CKAD25W_ORIGINAL_RESULT_AND_STRONG_CONVENTIONAL_AUDIT_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo "CKAD25W_FINAL_NATIVE_REGRESSION_PASS_SHA=$(git rev-parse HEAD)"
