name: Yggdrasil Y038 frozen multi-bijection tie-break
on:
  push:
    branches: [research/y038-multi-bijection-equivariance-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen parent, prereg and immutable evaluator identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c7a42ff087b9a477eebf7d3b3f04dbe316260ab7 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-coordinate-matching/execute.py)" = cb5ceb893448d50a561f8376f8f4d9a56f2b3ac1
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-multi-label/prereg.json)" = bab9e62ca459a633b14ae676e2b68313e3b88a33
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-multi-label/execute.py)" = 7d8d0377555d34deed9410acfa84a48dd9656928
          python3 -m json.tool research/contrib/chatgpt/20261013-y038-multi-label/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y038-multi-label/execute.py
      - name: First-use immutable four-bijection experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y038-multi-label/execute.py >/tmp/Y038-original.json
          python3 -m json.tool /tmp/Y038-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y038-original.json'))
          assert x['sealed_heldout_seeds']==list(range(248,264))
          assert len(x['maps'])==4
          print('CLASSIFICATION',x['classification'])
          for m in x['maps']:
              print('MAP',m['multiplier'],m['heldout_assignment_mismatches'],m['heldout_churn_by_policy_mode'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y038-original-multi-bijection
          path: /tmp/Y038-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Yggdrasil qualification regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
