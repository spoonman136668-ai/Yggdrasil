name: Yggdrasil F67 synthetic durable path learning
on:
  push:
    branches: [research/y-f67-future-continuation-fit-precode-20261016-r1]
permissions:
  contents: read
jobs:
  train-on-negative-unregistered:
    if: "${{ github.event.head_commit.message == 'ci(y-f67): evaluate pre-frozen durable path teacher on synthetic cases' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check independent source qualification and unchanged learner
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor df8554b1891825bdeda0765706de99955baf77ff HEAD
          test "$(git hash-object research/foundational/20261016-y-f67/prereg-teacher.json)" = 5d0fdf772b8e7db6a1166174b624cac8a9a8215e
          test "$(git hash-object research/foundational/20261016-y-f67/durable_policy.py)" = 21f2f3fc90a3d00d09029f39e4958e09a33908cc
          test "$(git hash-object research/foundational/20261016-y-f67/fit_teacher_synthetic.py)" = 14196380382ade36d046de70be548c380f1913f9
      - name: Frozen teacher prospective synthetic training, independent causal audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f67-synthetic-learner/"
          python3 -B research/foundational/20261016-y-f67/fit_teacher_synthetic.py --synthetic-only > "$RUNNER_TEMP/y-f67-synthetic-learner/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f67-synthetic-learner/result.json" >/dev/null
          python3 -B -c 'import json,os;r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f67-synthetic-learner/result.json")));print("F67_SYNTHETIC_LEARNED",r["training"],r["model_merges"],r["durable_final_paths"]);print("F67_TRAINING_GATE",r["genuine_learned_policy_preflight_qualified"]);assert r["genuine_learned_policy_preflight_qualified"] and not r["FIT_train_executed"]'
          sha256sum "$RUNNER_TEMP/y-f67-synthetic-learner/result.json" > "$RUNNER_TEMP/y-f67-synthetic-learner/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f67-synthetic-learner/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f67-prospective-synthetic-teacher-qualification
          path: ${{ runner.temp }}/y-f67-synthetic-learner/
          retention-days: 90
          if-no-files-found: warn
