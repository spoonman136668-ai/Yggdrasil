name: MR32A Isolated Original Native Causal Acquisition Cost
on:
  push:
    branches:
      - research/mr32a-isolated-acquisition-cost-20261021
  pull_request:
    branches:
      - research/mr31-acquisition-contrast-20261021
permissions:
  contents: read
concurrency:
  group: mr32a-full-worker-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-isolated-public-acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact MR32A research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Exact independently authored Farama original native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Python original native source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify independent original eight source blobs and license evidence
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install existing native dependency versions plus isolated process meter
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Run separate processes for each original public-only policy
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr32a.original_native_cost ../external/minigrid | tee ../mr32a-isolated-native-receipt.log
          grep -q '^MR32A_ISOLATED_NATIVE_PUBLIC_CAUSAL_COST=' ../mr32a-isolated-native-receipt.log
      - name: Verify no native original or project source modification
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
