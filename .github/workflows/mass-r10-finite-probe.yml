name: Mass R10 symbolic finite-probe identifiability audit
on:
  pull_request:
    branches: [review/mass-r8-action-causality-identifiability-20261022]
permissions:
  contents: read
concurrency:
  group: mass-r10-source-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  symbolic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 25
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Ensure frozen FIRST prereg and strictly independent additive source-only scope
        shell: bash
        run: |
          set -euo pipefail
          parent=587ee450ca2a74140d2357e814a1c2eab56314d0
          first=3f6f0ca30c9c1740b464d91d5ef16ab1f8353bc9
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/PREREG.md"
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; seen=set(sys.stdin.read().splitlines()); expected={"research/native/itd01/mass_r10/PREREG.md","research/native/itd01/mass_r10/finite_probe.py","research/native/itd01/mass_r10/test_finite_probe.py",".github/workflows/mass-r10-finite-probe.yml"}; assert seen==expected,(seen,expected)'
          test "$(git rev-parse "$first:research/native/itd01/mass_r10/PREREG.md")" = "$(git rev-parse HEAD:research/native/itd01/mass_r10/PREREG.md)"
          echo MASS_R10_SOURCE_AND_PREREG_FIRST=PASS
      - name: Exact rational hypothesis-risk proof and adversarial guards
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd01/mass_r10 -p 'test_finite_probe.py' -v
          python -B research/native/itd01/mass_r10/finite_probe.py --audit > mass_r10_audit.json
          python -B -c 'import json; x=json.load(open("mass_r10_audit.json")); assert x["probe_budget"]==32 and x["sampled_experiment_rows"]==0 and x["scientific_first_use"] is False and x["source_generator_created"] is False and x["actual_r10_source_certificate"]=="NOT_ESTABLISHED" and x["rare_latent_world"]["minimum_probes_for_error_le_5pct"]==147; print("MASS_R10_SOURCE_FREE_FINITE_RISK=PASS")'
          git status --porcelain --untracked-files=all | python -B -c 'import sys; x=sys.stdin.read().splitlines(); assert x==["?? mass_r10_audit.json"],x'
          sha256sum mass_r10_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-r10-symbolic-${{ matrix.os }}
          path: mass_r10_audit.json
          if-no-files-found: ignore
