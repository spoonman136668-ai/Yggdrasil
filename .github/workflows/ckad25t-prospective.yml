name: CKAD25-T evidence-certified native repair development
on:
  pull_request:
    paths:
      - "research/contrib/chatgpt/CKAD25-T/**"
      - ".github/workflows/ckad25t-prospective.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  frozen-native-prospective:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve Git source bytes on Windows and Linux
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install existing CKAD25 fitted-control dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Verify original source Git blob and cold native parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD25-T/run.py)" = "650a84097ba06aa0373f988ef8acb5d11619929c"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("research/contrib/chatgpt/CKAD-25/qualified-development-runs/44331408493")
          raw=(p/"linux/stage-02.native.json").read_bytes()
          assert raw==(p/"windows/stage-02.native.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          print("CKAD25T_NATIVE_SOURCE_PIN_PASS")
          PY
      - name: Source-interface negatives (not a heldout score)
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import importlib.util
          p=Path("research/contrib/chatgpt/CKAD25-T/run.py")
          sp=importlib.util.spec_from_file_location("ckad25t_interface",p)
          m=importlib.util.module_from_spec(sp)
          sp.loader.exec_module(m)
          h=m.load_predecessor()
          assert len(list(m.itertools.chain.from_iterable(m.itertools.combinations(range(16),k) for k in range(4))))==697
          assert m.sparse_certificate(h,[[0,0,0],[0,0,1]],[(0,0)])[0]==[None], "contradictory public rows must refuse"
          assert m.sparse_certificate(h,[],[(0,0)])[0]==[None], "uninformative public rows must abstain"
          print("CKAD25T_SAFE_ABSTENTION_NEGATIVES_PASS")
          PY
      - name: Frozen single prospective native training development score
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-T/run.py --output "$RUNNER_TEMP/ckad25t-result.json"
          cp "$RUNNER_TEMP/ckad25t-result.json" "$RUNNER_TEMP/ckad25t-original.json"
      - name: Byte-deterministic reproduction and authority checks
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-T/run.py --output "$RUNNER_TEMP/ckad25t-result.json"
          cmp "$RUNNER_TEMP/ckad25t-result.json" "$RUNNER_TEMP/ckad25t-original.json"
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ckad25t-result.json"
          d=json.loads(p.read_bytes())
          assert d["seed_law_cases"]==12 and d["new_synthetic_held_actions"]==48
          assert d["new_synthetic_training_interventions"]==144
          assert d["original_world_interventions"]==0 and d["source_first_use"] is False
          assert d["native_source_modified"] is False
          assert d["original_checkpoint_unchanged"] is True
          assert d["cold_native_retention_pass"] is True
          assert d["original_held_cohorts_reused"] is False
          assert d["scientific_pass"] is False and d["accepted_model"] is False
          assert d["native_promotion_authorized"] is False and d["forge_dispatch_authorized"] is False
          assert len(d["per_seed_law"])==12
          print("CKAD25T_FROZEN_PROSPECTIVE_AUDIT_PASS")
          print("CKAD25T_VERDICT="+d["disposition"])
          print("CKAD25T_CROSS_OS_RAW_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25t-prospective-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25t-result.json
          if-no-files-found: error
          retention-days: 60
