name: DG1-MD31 paid structural-change ledger synthetic qualification
on:
  push:
    branches: [research/dg1-md31-paid-structural-change-ledger-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md31-20261114/**'
      - '.github/workflows/dg1-md31-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    name: MD31 full regression and paid-change science (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg frozen, MD30 unchanged, exact G29 atlas
        shell: bash
        run: |
          git merge-base --is-ancestor 70a8e6de35d255ecf834a4ce8ee97650d54f32c7 HEAD
          git merge-base --is-ancestor 5e8a99a172d978c3dc31241c5d0e7efb129fa3b4 HEAD
          git diff --exit-code 5e8a99a172d978c3dc31241c5d0e7efb129fa3b4 HEAD -- research/contrib/chatgpt/dg1-md31-20261114/prereg.json
          git diff --exit-code 70a8e6de35d255ecf834a4ce8ee97650d54f32c7 HEAD -- research/contrib/chatgpt/dg1-md30-20261114
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path("research/contrib/chatgpt/dg1-md31-20261114/prereg.json").read_text())
          assert p["status"]=="FROZEN_PREREG_ONLY_NO_NEW_SOURCE_NO_OUTCOME"
          assert p["allocation"]["new_synthetic_scoring_seeds"]==[8301,8420]
          atlas=json.loads(Path(".ice/code-atlas.json").read_text())
          parent=subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip()
          assert atlas["source_commit"]==parent
          print("MD31_PREREG_AND_MD30_FROZEN_PASS")
          PY
          python scripts/build_code_atlas.py --check
      - name: Install pinned full-regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python - <<'PY'
          from importlib.metadata import version
          for name,want in (("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")):
              assert version(name)==want
          PY
      - name: Full inherited regression (required 54 tests)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          echo MD31_FULL_INHERITED_REGRESSION_PASS
      - name: All frozen MD30 focused and negative controls (32 tests)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s research/contrib/chatgpt/dg1-md30-20261114 -p 'test_*.py' -v
          echo MD31_PARENT_FROZEN_CONTROLS_PASS
      - name: New MD31 fixture-only tests before opening synthetic scoring
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md31-20261114/change_ledger.py research/contrib/chatgpt/dg1-md31-20261114/paired_preflight.py research/contrib/chatgpt/dg1-md31-20261114/test_change_ledger.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md31-20261114 -p 'test_*.py' -v
          echo MD31_PAID_DIAGNOSTIC_NEGATIVES_PASS
      - name: One frozen synthetic evaluation only (120 unused cases; no official first-use)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/contrib/chatgpt/dg1-md31-20261114/paired_preflight.py > md31-result.json
          python - <<'PY'
          import json,subprocess,platform
          from pathlib import Path
          from importlib.metadata import version
          r=json.loads(Path("md31-result.json").read_text("utf-8"))
          assert r["official_data_used"] is False
          assert r["status"]=="SYNTHETIC_DEV_ONLY_NO_OFFICIAL_FIRST_USE"
          assert r["evaluation_seed_range"]==[8301,8420]
          assert r["training"]["charged_actions"]==1920
          assert r["task_preflight"]["fixture_cases"]==12
          assert r["cold_replay"]["identical"] is True
          assert len(r["frozen_arms"])==6
          assert all(arm["episodes"]==120 for arm in r["frozen_arms"].values())
          assert r["paired_verdict"]["official_scientific_pass"] is False
          portable={k:v for k,v in r.items() if k!="cpu_seconds"}
          Path("md31-parity.json").write_bytes((json.dumps(portable,sort_keys=True,separators=(",",":"),ensure_ascii=True)+chr(10)).encode("utf-8"))
          proof={
              "schema":"md31.exact-source-synthetic-provenance.v1",
              "sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "source_sha":subprocess.check_output(["git","rev-parse","HEAD^"],text=True).strip(),
              "python":platform.python_version(), "platform":platform.platform(),
              "numpy":version("numpy"),"gymnasium":version("gymnasium"),
              "minigrid":version("minigrid"),"official_first_use":False,
              "classification":r["paired_verdict"]["classification"]
          }
          Path("md31-provenance.json").write_bytes((json.dumps(proof,sort_keys=True,indent=2)+chr(10)).encode("utf-8"))
          print("MD31_SYNTHETIC_RESULT:",r["paired_verdict"]["classification"])
          print("MD31_EVENT_ACCURACY:",r["paired_verdict"]["change_detection_accuracy"])
          print("MD31_FROZEN_REFERENCE:",r["paired_verdict"]["chosen_strongest_frozen_reference"])
          for name,arm in r["frozen_arms"].items():
              print("MD31_ARM:",name,"NET:",arm["mean_reward"],"PAID:",arm["charged_actions"],"PROBES:",arm["charged_probes"])
          print("MD31_PAIRED_DELTA:",r["paired_verdict"]["paired_mean_delta"])
          print("MD31_BOOTSTRAP_LOWER:",r["paired_verdict"]["paired_bootstrap_95pct_lower"])
          print("MD31_NO_SCIENTIFIC_PASS_NO_PROMOTION")
          PY
          python scripts/build_code_atlas.py --check
          git diff --exit-code
      - name: Upload result and source custody without touching user file library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: md31-synthetic-development-${{ matrix.os }}
          path: |
            md31-result.json
            md31-parity.json
            md31-provenance.json
          if-no-files-found: error
  parity:
    name: MD31 two-OS exact model/action/reward parity
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md31-synthetic-development-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md31-synthetic-development-windows-2022
          path: windows
      - name: Byte-equal two-platform synthetic receipts and classifications
        shell: bash
        run: |
          cmp linux/md31-parity.json windows/md31-parity.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("linux/md31-parity.json").read_text())
          assert a["official_data_used"] is False
          assert a["cold_replay"]["identical"] is True
          assert a["evaluation_seed_range"]==[8301,8420]
          assert a["paired_verdict"]["official_scientific_pass"] is False
          print("MD31_TWO_OS_EXACT_MODEL_ACTION_REWARD_PARITY_PASS")
          print("MD31_OFFICIAL_FIRST_USE_FORBIDDEN_PASS")
          PY
