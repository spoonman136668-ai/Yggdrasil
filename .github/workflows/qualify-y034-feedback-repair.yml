name: Yggdrasil Y034 frozen observed-feedback dormant repair
on:
  push:
    branches: [research/y034-feedback-triggered-repair-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen scientific identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 719cf42fd7df385483bb17a6a3c0002bdcc99942 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-associative-recall/execute.py)" = e91bb843e43addf6b0cae77d7fe33874056c37a9
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-feedback-repair/prereg.json)" = 0107beb505d8f717acc294fc5590e3e4e5e6abc1
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-feedback-repair/execute.py)" = 4d682dc3835ad88fbf71593295d7461c3745559b
          python3 -m json.tool research/contrib/chatgpt/20261013-y034-feedback-repair/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y034-feedback-repair/execute.py
      - name: Original frozen observed-only memory repair
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y034-feedback-repair/execute.py > /tmp/Y034-original.json
          python3 -m json.tool /tmp/Y034-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y034-original-observed-feedback-repair
          path: /tmp/Y034-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
