name: Yggdrasil Y091 fresh selector screen
on:
  push:
    branches:
      - research/external-hosted-yggdrasil-y091-fresh-selector-screen-r1
    paths:
      - 'research/packaging/y091_fresh_selector_screen.py'
      - '.github/workflows/y091-fresh-selector-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packaging-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f research/packaging/y091_fresh_selector_screen.py
          ! grep -q 'run_variant\|clean_rescue\|child outcome' research/packaging/y091_fresh_selector_screen.py
      - name: Screen frozen candidates
        shell: bash
        run: |
          set -euo pipefail
          python research/packaging/y091_fresh_selector_screen.py
      - name: Upload selector-screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y091-fresh-selector-screen
          path: y091-fresh-selector-screen.json
          if-no-files-found: error
