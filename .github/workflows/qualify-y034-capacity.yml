name: Yggdrasil Y034 frozen memory-capacity dose
on:
  push:
    branches: [research/y034-memory-capacity-dose-r1]
permissions:
  contents: read
jobs:
  original-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze check and source pinning
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 92fdc63bd3bc95ec284dfb47a6c1c6d446d9dfb4 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-recurrence/execute.py)" = 006a7c06ffd3d8efb95d2ab3f96c8c273ee98a5a
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-capacity/prereg.json)" = bdad3d370d4a6fae053f30dc4c1a0ba1633a2339
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-capacity/execute.py)" = a8d7ae550a54918aca6c8c6a37918dec5367e926
          python3 -m json.tool research/contrib/chatgpt/20261013-y034-capacity/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y034-capacity/execute.py
      - name: Execute first-use original scientific experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y034-capacity/execute.py > /tmp/Y034-original.json
          python3 -m json.tool /tmp/Y034-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y034-original-frozen
          path: /tmp/Y034-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
