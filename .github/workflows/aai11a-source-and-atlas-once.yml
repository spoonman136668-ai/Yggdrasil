name: AAI-11A frozen protected graph vs strongest matched controls — source-only
on:
  push:
    branches: [research/aai11a-protected-causal-graph-20261114]
    paths: [.github/workflows/aai11a-source-and-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11a-source-only-20261114
  cancel-in-progress: false
jobs:
  source-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11A frozen same-grammar candidate source-only one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin exact original source, prereg and benign independent branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'd5a2e8498d02479f4c440c2ef681d0891336e132'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11a-source-and-atlas-once.yml'
          test "$(git rev-parse a369f4eb2823a8c24dde110b49dc095142d4b7e0^)" = '40062783d0aa0e06fbe93b3419291150b306562d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/prereg.json)" = '91324443d73a18a71484a8a7a7243184d60cc6db'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/prereg.json)" = "$(git rev-parse a369f4eb2823a8c24dde110b49dc095142d4b7e0:research/contrib/chatgpt/AAI-11A/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = 'f162e684b226157bdf88798a0cee6899123a573b'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/fixture.py)" = '191575e68f64858acf036cd1e10c1e266cf16692'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/test_learner.py)" = 'd1be60dff7304fbefc3861c46f58adee42acad9c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/admission.py)" = '0f921dfeebda9ad3a0e217747e4b0365ba9c655e'
          test -z "$(git status --porcelain)"
          echo AAI11A_PREREG_BEFORE_LEARNER_AND_STRONG_CONTROLS_PINNED_PASS
      - name: Public causal grammar, cold retention, full-budget ablation, negative tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11A -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11A/fixture.py --primary >/dev/null 2>&1; then
            echo AAI11A_UNAUTHORIZED_FIRST_USE_FAILURE >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11A_FOCUSED_PUBLIC_ONLY_TESTS_PASS
      - name: Frozen one-shot 3-fixture headroom, matched 11 controls and cost admission
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11A/fixture.py --fixture-admission
          test -z "$(git status --porcelain)"
          echo AAI11A_DEV_RESULTS_RECORDED_WITHOUT_SCIENCE_FIRST_USE
  atlas:
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate existing three G29 source-pinned atlas artifacts only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'd5a2e8498d02479f4c440c2ef681d0891336e132'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11A generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11a-protected-causal-graph-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11a-protected-causal-graph-20261114
          echo AAI11A_G29_PINNED_ATLAS_ONLY_PASS
