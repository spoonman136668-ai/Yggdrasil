name: ITD02 V21 frozen V20 relay gain ablation
on:
  push:
    branches: [research/itd02-v21-relay-head-causal-ablation-20261028]
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PARENT_SHA: f5fd77ef7b56c84cf7d8e848a05eee3e2411e56f
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$PARENT_SHA" -- yggdrasil research/itd02_v20_responsibility_gated_audit.py
          python -B research/itd02_v21_gain_ablation_audit.py
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: itd02-v21-ablation-${{ matrix.os }}
          path: ${{ runner.temp }}/itd02_v21_ablation.json
          retention-days: 14
