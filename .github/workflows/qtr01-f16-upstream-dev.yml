name: QTR-01 F16 pinned upstream DEV smoke

on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-f16-upstream-dev.yml
      - research/contrib/chatgpt/QTR-01/f16_upstream_smoke.py
      - research/contrib/chatgpt/QTR-01/f14_boundary.py

permissions:
  contents: read

jobs:
  pinned-upstream-dev:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_TERMINAL_PROMPT: "0"
      UPSTREAM_SHA: 51f1431515e310dec72e3f4b6db378df46f832ea
      UPSTREAM_TREE: c1bf53ecf03ae326b69c0321f4412d81f3122894
    steps:
      - name: Checkout isolated QTR contributor candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Fetch exact public upstream commit and tree
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/qtr-f16-upstream"
          git init -q "$upstream"
          git -C "$upstream" remote add origin https://github.com/noumenal-ai/causal-worlds.git
          git -C "$upstream" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$upstream" -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(git -C "$upstream" rev-parse 'HEAD^{tree}')" = "$UPSTREAM_TREE"
          echo "F16_PINNED_SOURCE_AND_TREE=PASS"
      - name: Install exact upstream locked core and gym dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.9.17
          cd "$RUNNER_TEMP/qtr-f16-upstream"
          uv sync --locked --no-dev --extra gym
          uv pip list --python "$PWD/.venv/bin/python"
      - name: Run bounded public-world smoke (no model training)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qtr-f16-upstream/.venv/bin/python" \
            research/contrib/chatgpt/QTR-01/f16_upstream_smoke.py \
            --upstream-root "$RUNNER_TEMP/qtr-f16-upstream"
      - name: Verify candidate checkout unchanged
        shell: bash
        run: git diff --exit-code
