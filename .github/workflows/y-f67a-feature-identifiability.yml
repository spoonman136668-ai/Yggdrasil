name: Yggdrasil F67A causal-feature identifiability
on:
  push:
    branches: [research/y-f67-hierarchical-bridge-memory-precode-20261016-r1]
permissions:
  contents: read
jobs:
  feature-identifiability:
    if: "${{ github.event.head_commit.message == 'ci(y-f67a): audit whether junction features differentiate legal actions' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert immutable F67A source and read-only feature diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/foundational/20261016-y-f67a/prereg.json)" = 5ecade3402c33120a1eabfd34bbc66e91200dcb8
          test "$(git hash-object research/foundational/20261016-y-f67a/causal_memory.py)" = b370396b3c3571be2c01ab2b33effef14f248eef
          test "$(git hash-object research/foundational/20261016-y-f67a/audit_feature_identifiability.py)" = 5f55f3cd95a8c0aa0e59d6a90568409b22cc386b
      - name: Audit candidate decision identifiability using synthetic public streams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f67a-identifiability"
          python3 -B research/foundational/20261016-y-f67a/audit_feature_identifiability.py > "$RUNNER_TEMP/f67a-identifiability/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f67a-identifiability/result.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f67a-identifiability/result.json")));print("F67A_FEATURE_IDENTIFIABILITY",d["counts"]);assert d["source_unchanged"] and not d["fit_train_used"]'
          sha256sum "$RUNNER_TEMP/f67a-identifiability/result.json" > "$RUNNER_TEMP/f67a-identifiability/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f67a-identifiability/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f67a-candidate-feature-identifiability
          path: ${{ runner.temp }}/f67a-identifiability/
          retention-days: 90
          if-no-files-found: warn
