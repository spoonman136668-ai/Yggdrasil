name: WSP114 high-first 1024 intervention nonlinear causal weight qualification
on:
  push:
    branches: [research/wsp114-high-first-causal-weight-frontier-20261115]
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen CPU NumPy
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          python -c "import numpy as np; assert np.__version__=='2.2.6'"
      - name: Verify frozen original protocol and no inherited edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2c0dcf3270d19ec23b4f0197b5a02a06a14a7f54 HEAD
          git diff --exit-code e814137946e20452d7db4595f9c1fa7214a6e228 HEAD -- research/contrib/chatgpt/WSP-113 research/contrib/chatgpt/WSP-112 research/contrib/chatgpt/WSP-111
          test ! -f research/contrib/chatgpt/WSP-114/SCIENTIFIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-114/PROTECTED_FIRST_USE.json
          test -z "$(git status --porcelain)"
      - name: Fabricated coefficients and fake oracle ONLY
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-114 -p 'test_*.py' -v
      - name: Clean checkout guard
        shell: bash
        run: test -z "$(git status --porcelain)"

  one-shot-source-pin:
    needs: [fixtures]
    if: "github.event.head_commit.message == 'ci(wsp114): arm source-pin G29 atlas' && github.run_attempt == 1 && needs.fixtures.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp114-source-pin-G29-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly three G29 source-index artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2c0dcf3270d19ec23b4f0197b5a02a06a14a7f54 HEAD
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          S="$GITHUB_SHA"
          python scripts/build_code_atlas.py --write --source-commit "$S"
          git add -- .ice/code-atlas.json .ice/code-atlas.ice .ice/code-atlas.html
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp114): pinned G29 source at $S"
          C="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$C" | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp114-high-first-causal-weight-frontier-20261115
          echo "WSP114_FROZEN_SOURCE_SHA=$S"
          echo "WSP114_GENERATED_ONLY_COMPANION=$C"

  final-regression:
    needs: [fixtures]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp114): pinned G29 source at ') && github.run_attempt == 1 && needs.fixtures.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen CPU NumPy
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          python -c "import numpy as np; assert np.__version__=='2.2.6'"
      - name: Exact source, atlas, public-only admission, no inherited source edit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2c0dcf3270d19ec23b4f0197b5a02a06a14a7f54 HEAD
          git diff --exit-code e814137946e20452d7db4595f9c1fa7214a6e228 HEAD -- research/contrib/chatgpt/WSP-113 research/contrib/chatgpt/WSP-112
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          python scripts/build_code_atlas.py --check-if-present
          test ! -f research/contrib/chatgpt/WSP-114/SCIENTIFIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-114/PROTECTED_FIRST_USE.json
          test -z "$(git status --porcelain)"
      - name: Complete WSP114 and inherited WSP98 WSP102–113 suites
        shell: bash
        run: |
          set -euo pipefail
          for n in 114 113 112 111 110 109 108 107 106 105 104 103 102 98; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Complete WSP80–97 original tests
        shell: bash
        run: |
          set -euo pipefail
          for n in 80 81 82 83 84 85 86 87 88 89 90 91 92 93 94 95 96 97; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Entire Yggdrasil root regression, source atlas and pristine tree
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"

  independent-g29:
    needs: [fixtures]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp114): pinned G29 source at ') && github.run_attempt == 1 && needs.fixtures.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent source atlas clean acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --check-if-present
          python -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"

  one-shot-original-dev:
    needs: [fixtures, final-regression, independent-g29]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp114): pinned G29 source at ') && github.run_attempt == 1 && needs.fixtures.result == 'success' && needs.final-regression.result == 'success' && needs.independent-g29.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    concurrency:
      group: wsp114-original-high-first-synthetic-dev-once
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact CPU-only numerical dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input numpy==2.2.6
          python -c "import numpy as np; assert np.__version__=='2.2.6'"
      - name: Freeze original 1024-high result source and single-use
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2c0dcf3270d19ec23b4f0197b5a02a06a14a7f54 HEAD
          python scripts/build_code_atlas.py --check-if-present
          test ! -f research/contrib/chatgpt/WSP-114/PROTECTED_FIRST_USE.json
          test ! -f research/contrib/chatgpt/WSP-114/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: First original 64-node 1024-intervention transfer, then frozen capacity fallback only
        run: python research/contrib/chatgpt/WSP-114/experiment.py --frozen-1024-first-primary-dev
      - name: Unmodified source and no first-use artifact rewrite
        shell: bash
        run: test -z "$(git status --porcelain)"
