name: CKAD23 disjoint compositional causal-transfer training
on:
  push:
    branches: [research/ckad23-compositional-transfer-20261118]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ckad23): execute frozen disjoint transfer'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned native solver dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Verify frozen source, inherited checkpoint baseline, new causal structures and negative controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 43bf1854d0c12c3dc26a3010c3ee9d945bece28b HEAD
          git merge-base --is-ancestor f04cfcac2aa07806a6b942d968119de87bfb6aaf HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/prereg.json)" = 2b6da8f5437ece39ed80d5a5ad4917842fbb82ce
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/campaign.py)" = 39683e1f6907bc1adcdaba5be111c4f8fa028039
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/audit.py)" = ec2a2fb71dc5f015cd2a0ef5240ab59bb5b0b2e0
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/test_ckad23.py)" = 8d5346fac7bb9d03d31191eddcfabffb76a08962
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/test_ckad23_audit.py)" = b7d2dbfd271114948c30a06f79850455e3057a2b
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p test_native_cumulative_learner.py -v
          test -z "$(git status --porcelain)"
  primary:
    needs: [development]
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        parent: [101, 202, 303]
        half: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute exact 8-case shard with real synthetic interventions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/ckad23-shard"
          python -B research/contrib/chatgpt/CKAD-23/campaign.py \
            --parent ${{ matrix.parent }} --half ${{ matrix.half }} \
            --output "$RUNNER_TEMP/ckad23-shard/result.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ckad23-ubuntu-latest-${{ matrix.parent }}-${{ matrix.half }}-proof
          path: ${{ runner.temp }}/ckad23-shard/result.json
          if-no-files-found: error
          retention-days: 30
  replication:
    needs: [primary]
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        parent: [101, 202, 303]
        half: [0, 1]
    runs-on: windows-2022
    timeout-minutes: 23
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reexecute all corresponding causal training shards with exact source inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/ckad23-shard"
          python -B research/contrib/chatgpt/CKAD-23/campaign.py \
            --parent ${{ matrix.parent }} --half ${{ matrix.half }} \
            --output "$RUNNER_TEMP/ckad23-shard/result.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ckad23-windows-2022-${{ matrix.parent }}-${{ matrix.half }}-proof
          path: ${{ runner.temp }}/ckad23-shard/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [primary, replication]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ckad23-*-proof
          path: ${{ runner.temp }}/ckad23-all
          merge-multiple: false
      - name: Seal all 48 matched trainings and 12 platform/seed shards before atlas
        id: seal
        env:
          CKAD23_ARTIFACT_ROOT: ${{ runner.temp }}/ckad23-all
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-23/seal.py
          git add -- research/contrib/chatgpt/CKAD-23
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ckad23): preserve full compositional-transfer evidence and negatives'
          RESULT_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git commit -m "docs(ckad23): qualify disjoint causal-source atlas at $RESULT_SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad23-compositional-transfer-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned complete regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory full final regression and sealed independent score replay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/CKAD-23/independent_audit.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-g29:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent source atlas, CKAD22 parent and CKAD23 negative controls
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CKAD-22/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-23/independent_audit.py
          test -z "$(git status --porcelain)"

  repair-seal:
    if: "github.event.head_commit.message == 'ci(ckad23): qualify audit harness repair'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Requalify immutable trained outcome with corrected JSON-only audit
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 43bf1854d0c12c3dc26a3010c3ee9d945bece28b HEAD
          git merge-base --is-ancestor f04cfcac2aa07806a6b942d968119de87bfb6aaf HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/prereg.json)" = 2b6da8f5437ece39ed80d5a5ad4917842fbb82ce
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/campaign.py)" = 39683e1f6907bc1adcdaba5be111c4f8fa028039
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/audit.py)" = ec2a2fb71dc5f015cd2a0ef5240ab59bb5b0b2e0
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/seal.py)" = abe94c5f5b58049204351037d5690ed2b47f9e96
          python -B research/contrib/chatgpt/CKAD-23/independent_audit.py
          python -c "import json,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-23/result.json'); d=json.loads(p.read_text()); assert d['classification']=='DEVELOPMENT_NO_GO' and d['stable_sha256']=='9cd20b47bb9629f5b38ea44cdceee8d03f2b1931b9f7afb289434e12f0432064' and d['scientific_pass'] is False"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(ckad23): requalify corrected audit harness source atlas"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad23-compositional-transfer-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  repair-final-regression:
    needs: [repair-seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.repair-seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned native and complete full regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exact repaired SHA full regression, G29, retained predecessor, source-negative audits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.repair-seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/campaign.py)" = 39683e1f6907bc1adcdaba5be111c4f8fa028039
          test "$(git hash-object research/contrib/chatgpt/CKAD-23/audit.py)" = ec2a2fb71dc5f015cd2a0ef5240ab59bb5b0b2e0
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/CKAD-22/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-23/independent_audit.py
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
