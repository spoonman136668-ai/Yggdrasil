name: Yggdrasil Y038 frozen fallback transfer
on:
  push:
    branches: [research/y038-unseen-drift-fallback-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact parent and immutable science freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 78306244bb4f7b71bca9a0da987673f9f0710e8c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-fallback/execute.py)" = a36eba3011a93cbb3014385ff6f0a1c98fc85679
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-fallback-transfer/prereg.json)" = 621ddf1498173a26c696ad552b7f839566399029
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-fallback-transfer/execute.py)" = 12ba0e27e2ffdaab8f44f1f3facff50ceb0485eb
          python3 -m json.tool research/contrib/chatgpt/20261013-y038-fallback-transfer/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y038-fallback-transfer/execute.py
      - name: First original unseen drift fallback science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y038-fallback-transfer/execute.py > /tmp/Y038-original.json
          python3 -m json.tool /tmp/Y038-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y038-original.json'))
          assert len(x['regimes'])==5
          assert x['sealed_heldout_seeds']==list(range(256,272))
          print('CLASSIFICATION',x['classification'])
          for r in x['regimes']:
              print('REGIME',r['regime'],r['heldout_churn'],r['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y038-original-unseen-drift
          path: /tmp/Y038-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil test
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
