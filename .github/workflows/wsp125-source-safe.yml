name: WSP125 residual-triggered numerical relation growth qualification
on:
  push:
    branches: [research/wsp125-residual-feature-growth-20261116]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source, prereg-first ancestry, no original first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f291718dd1f33c2784001403e36c7d30650c110a HEAD
          test ! -e research/contrib/chatgpt/WSP-125/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-125/result.json
          test ! -e research/contrib/chatgpt/WSP-125/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-124/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-123/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Only WSP125 residual-triggered relation growth engineering tests and negatives
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-125 -p 'test_*.py' -v
      - name: Checkout remains clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp125): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp125-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate exactly three G29 derived artifacts, preserve frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f291718dd1f33c2784001403e36c7d30650c110a HEAD
          test -z "$(git status --porcelain)"
          SOURCE="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.json .ice/code-atlas.ice .ice/code-atlas.html
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp125): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp125-residual-feature-growth-20261116
          echo "WSP125_G29_SOURCE=$SOURCE"
          echo "WSP125_G29_ARCHIVE=$(git rev-parse HEAD)"

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp125): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned inherited numpy dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Install pinned inherited conventional comparator
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Require G29 archive and original first-use denial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f291718dd1f33c2784001403e36c7d30650c110a HEAD
          python -B scripts/build_code_atlas.py --check-if-present
          test ! -e research/contrib/chatgpt/WSP-125/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-125/result.json
          test ! -e research/contrib/chatgpt/WSP-124/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-123/first_use_authorization.json
      - name: Full inherited WSP117 through WSP125 regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 117 118 119 120 121 122 123 124 125; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory whole-root regression and G29 clean exact source
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
