name: Optimizer O22-Y true source-seed-excluded decision discrimination
on:
  push:
    branches:
      - research/optimizer-o22y-seed-exclusion-discrimination-20261025
  pull_request:
    paths:
      - research/optimizer_o22y/**
      - .github/workflows/optimizer-o22y-source-discrimination.yml
permissions:
  contents: read
  actions: read
jobs:
  source-public-decision-units:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original owner and source-first mechanism frozen
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cf34b2ba83a9ea85f90a32ea2276bd649c6a38a3 HEAD
          git merge-base --is-ancestor 5b193ab498f29afb2dd6b18b1bb174513bea0ee6 HEAD
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = '3aa22b1e418a7f8cd9619c476f02b8c614917b16'
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = '5348238f4ec2183bea29262659883391b5f429fd'
          python -B -c "import json;p=json.load(open('research/optimizer_o22y/PREREG.json')); assert p['governance']['new_original_source_actions']==0 and p['governance']['FORGE_FSA_83_protected_first_use_denied']"
          echo O22Y_SOURCE_FIRST_AND_ORIGINAL_NATIVE_UNCHANGED=PASS
      - name: Focused original native decision, cold-state and rights unit tests
        run: python -B -m unittest -v research.optimizer_o22y.test_decision_discrimination

  original-source-physical-seed-exclusion-only:
    needs: source-public-decision-units
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact previously executed C35 original source FIT physical forks only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/optimizer-o22y"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12603145885/zip" \
            --output "$RUNNER_TEMP/optimizer-o22y/c35-original-source.zip"
          python -B -c "import json,hashlib,pathlib,os;p=json.load(open('research/optimizer_o22y/PREREG.json'));f=pathlib.Path(os.environ['RUNNER_TEMP'])/'optimizer-o22y/c35-original-source.zip';assert hashlib.sha256(f.read_bytes()).hexdigest()==p['source_C35']['zip_sha256']"
          echo O22Y_ORIGINAL_C35_TWO_PROCESSES_CUSTODY_PINNED=PASS
      - name: Entire-world-seed-out native versus full9 controls and source-actual outcome comparison
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.optimizer_o22y.evaluate \
            --source-zip "$RUNNER_TEMP/optimizer-o22y/c35-original-source.zip" \
            --out "$RUNNER_TEMP/optimizer-o22y/run-a.json"
          python -B -m research.optimizer_o22y.evaluate \
            --source-zip "$RUNNER_TEMP/optimizer-o22y/c35-original-source.zip" \
            --out "$RUNNER_TEMP/optimizer-o22y/run-b.json"
          python -B -c "import json,os,pathlib;root=pathlib.Path(os.environ['RUNNER_TEMP'])/'optimizer-o22y';a=json.loads((root/'run-a.json').read_text());b=json.loads((root/'run-b.json').read_text());assert a['science']==b['science'] and a['science_canonical_SHA256']==b['science_canonical_SHA256'];print('O22Y_TWO_PROCESS_CANONICAL_SOURCE_SCIENCE=PASS');print('O22Y_FINAL_SCIENCE_SHA256='+a['science_canonical_SHA256'])"
          python -B -m json.tool "$RUNNER_TEMP/optimizer-o22y/run-a.json"
      - name: Archive all source FIT world-exclusion action identity and genuine physical results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22y-source-seed-exclusive-real-physical-discrimination
          path: ${{ runner.temp }}/optimizer-o22y/run-*.json
          if-no-files-found: warn
          retention-days: 80
