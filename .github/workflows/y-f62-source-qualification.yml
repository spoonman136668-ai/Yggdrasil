name: Yggdrasil F62 source-only qualification
on:
  push:
    branches:
      - research/y-f62-action-value-source-engineering-20261016-r1
permissions:
  contents: read
jobs:
  frozen-source:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository test dependencies
        run: |
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exact-commit source qualification, no FIT
        run: python -B research/foundational/20261015-y-f62/qualify_source.py --expect-head "$GITHUB_SHA"
