name: AAI-11E frozen causal calibration and risk-suppressed intervention diagnostic
on:
  push:
    branches: [research/aai11e-risk-suppression-diagnostic-20261114]
    paths: [.github/workflows/aai11e-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11e-diagnostic-source-20261114
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11E frozen public risk suppression and posterior calibration one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prereg before source, original model, exact full source and clean repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'e10de704956a975d194cab04b61078ca2ea78388'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11e-source-atlas-once.yml'
          test "$(git rev-parse a8c3461311d1d8aa4680d8c3d4a17735bf628fa5^)" = '56c6fd02d21a005708fa6998f2b3f2d056306f41'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11E/prereg.json)" = '454d0f960dfa6184177f687e12e72a3d1b49183c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11E/prereg.json)" = "$(git rev-parse a8c3461311d1d8aa4680d8c3d4a17735bf628fa5:research/contrib/chatgpt/AAI-11E/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11E/diagnose.py)" = '07447fba4ebc4a3fa175f1a479a48424b793e11d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11E/test_diagnose.py)" = '4dc2653245817bd8a45c09a32c4573d715046874'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/dev.py)" = 'ce807c4fa3b7742b4299580087dc41b68359533e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test -z "$(git status --porcelain)"
          echo AAI11E_FROZEN_SOURCE_AND_UNMODIFIED_MODEL_PASS
      - name: Exact public-action, cold state, privacy and first-use negative tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11E -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11E/diagnose.py --primary >/dev/null 2>&1; then
            echo AAI11E_FIRST_USE_DISARM_FAIL >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11E_PUBLIC_CALIBRATION_AND_SUPPRESSION_TESTS_PASS
      - name: Frozen read-only 3-fixture action-suppression + calibration diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11E/diagnose.py --mechanical-diagnostic
          test -z "$(git status --porcelain)"
          echo AAI11E_FROZEN_RISK_AND_POSTERIOR_DIAG_RECORDED_NO_SCIENCE
  atlas:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate only three preexisting G29 source-pinned atlas artifacts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'e10de704956a975d194cab04b61078ca2ea78388'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11E generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11e-risk-suppression-diagnostic-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11e-risk-suppression-diagnostic-20261114
          echo AAI11E_G29_ATLAS_GENERATED_ONLY_PASS
