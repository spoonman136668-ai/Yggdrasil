name: WSP80 frozen unregistered 8-world developmental science screen
on:
  push:
    branches: [research/wsp80-paid-novelty-structural-weight-repair-20261113]
permissions:
  contents: read
jobs:
  eight-unregistered-development-worlds:
    if: "${{ github.event.head_commit.message == 'ci(wsp80): run frozen unregistered eight-world developer screen' }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin registered source + frozen developing protocol and admission
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python research/contrib/chatgpt/WSP-80/scientific_admission.py --readonly
      - name: Run 8 new UNREGISTERED developer worlds with genuine models
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python research/contrib/chatgpt/WSP-80/multidev_experiment.py --unregistered-developer-multiworld
      - name: Verify exact-head atlas and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
