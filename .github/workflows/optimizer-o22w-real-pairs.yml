name: Optimizer O22-W real matched original-source pair action value
on:
  push:
    branches:
      - research/optimizer-o22w-real-pair-value-20261025
  pull_request:
    paths:
      - research/optimizer_o22w/**
      - .github/workflows/optimizer-o22w-real-pairs.yml
permissions:
  contents: read
  actions: read
jobs:
  original-r1-pair-units:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate source-first contract and unchanged original R1/R3
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d54829596f11dd4e66583e846732e20cd1e9a0d3 HEAD
          git merge-base --is-ancestor 58bc8a854046c052253daae7e67c37540e6f12b7 HEAD
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = '3aa22b1e418a7f8cd9619c476f02b8c614917b16'
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = '5348238f4ec2183bea29262659883391b5f429fd'
          python -B -c "import json; p=json.load(open('research/optimizer_o22w/PREREG.json')); assert p['governance']['FORGE_FSA_83_open_protected_first_use'] is False and p['source_C35']['original_run']==40203502643"
          echo O22W_SOURCE_FIRST_NO_ORIGINAL_OWNER_DRIFT=PASS
      - name: Original Ygg R1 public pair local plasticity and fresh Python cold
        run: python -B -m unittest -v research.optimizer_o22w.test_pair_models
  authentic-previous-C35-fit-only:
    needs: original-r1-pair-units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact ALREADY EXECUTED 9-way original C35 FIT/FIT_CHECK pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/optimizer-o22w"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12603145885/zip" \
            --output "$RUNNER_TEMP/optimizer-o22w/original-C35-source.zip"
          python -B -c "import hashlib,json,pathlib,os;p=json.load(open('research/optimizer_o22w/PREREG.json'));f=pathlib.Path(os.environ['RUNNER_TEMP'])/'optimizer-o22w/original-C35-source.zip';assert hashlib.sha256(f.read_bytes()).hexdigest()==p['source_C35']['zip_sha256']"
          echo O22W_REAL_ORIGINAL_C35_ARCHIVE_IDENTITY=PASS
      - name: Train source FIT R1 local pair cells vs full9 ridge and evaluate actually executed alternate outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.optimizer_o22w.evaluate \
            --source-zip "$RUNNER_TEMP/optimizer-o22w/original-C35-source.zip" \
            --out "$RUNNER_TEMP/optimizer-o22w/actual-pair-comparison.json"
          python -B -m json.tool "$RUNNER_TEMP/optimizer-o22w/actual-pair-comparison.json"
      - name: Preserve honest source action counterfactual FIT-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22w-authentic-original-pair-learner-comparison
          path: ${{ runner.temp }}/optimizer-o22w/actual-pair-comparison.json
          if-no-files-found: warn
          retention-days: 80
