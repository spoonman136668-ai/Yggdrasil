name: ITD-02 V17 neighbor-carried additive toy qualification
on:
  push:
    branches:
      - research/itd02-v17-neighbor-carried-learning-20261028
permissions:
  contents: read
jobs:
  neighbor-carried-source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Cross-host source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact pushed head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original source identity and chronological preregistration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a63ccae27cb5f88e6e3851b0e5acc0d39aef8c7e "$GITHUB_SHA"
          git merge-base --is-ancestor 92531456e6052d3b2d76cc95dd982fb6ff020781 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v15_three_phase_readout_dev.py)" = fd719f7de63e42247b7eafad75272930e779d1e4
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Focused V17 development integrity regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v17"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v17_neighbor_carried_learner_dev.py' -v > "$RUNNER_TEMP/v17/focused.log" 2>&1
          cat "$RUNNER_TEMP/v17/focused.log"
      - name: Preregistered 36-fold heldout and neighbor ablation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v17_neighbor_learning_audit.py > "$RUNNER_TEMP/v17/audit.json"
          python - "$RUNNER_TEMP/v17/audit.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["source_only"] and not x["scientific_first_use"]
          assert not x["original_world_training"]
          assert x["original_native_model_unchanged"] and x["original_memory_model_unchanged"]
          assert x["public_histories"]==36 and x["leave_one_out_folds"]==36
          assert x["synthetic_training_epochs"]==16 and x["synthetic_training_updates_per_fold"]==560
          assert x["learned_action_head_scalars"]==24 and x["fixed_public_tag_channels"]==7
          assert x["neighbor_hops"]==4 and x["four_hops_effectively_global"]
          assert not x["intermediate_cell_plasticity_demonstrated"]
          assert not x["fixed_message_routing_learned"]
          assert x["heldout_neighbor_total_absolute_error"]<2.0
          assert x["heldout_no_message_total_absolute_error"]>10.0
          assert x["heldout_neighbor_total_absolute_error"]<x["heldout_zero_lookup_total_absolute_error"]
          assert x["classification"]=="V17_NEIGHBOR_CARRIED_ADDITIVE_TOY_TRANSFER__NO_SCIENCE"
          print("ITD02_V17_NEIGHBOR_CARRIED_PUBLIC_TOY_PASS_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v17/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Required final inherited V16 V15 original native integration regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v17/inherited-v16.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ITD02_V17_FINAL_ORIGINAL_NATIVE_INTEGRATION_PASS_NO_SCIENCE"
      - name: Preserve source-only qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v17-neighbor-carried-${{ matrix.os }}
          path: ${{ runner.temp }}/v17/*
          if-no-files-found: warn
          retention-days: 7
