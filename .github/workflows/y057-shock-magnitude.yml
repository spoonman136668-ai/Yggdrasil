name: Yggdrasil Y057 frozen shifted shock magnitude transfer
on:
  push:
    branches: [research/y057-shock-magnitude-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact immutable source and preregistration gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 65dd5180dae2c63b765f5b78b7b86e42e61ec253 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y056-mixture-regret/execute.py)" = 3687cc8b31912effee46ac234c7f8841b87b8bd1
          test "$(git hash-object research/contrib/chatgpt/20261013-y057-magnitude-transfer/prereg.json)" = 76bacb797f79c02daac5d0eb9007c557ba445465
          test "$(git hash-object research/contrib/chatgpt/20261013-y057-magnitude-transfer/execute.py)" = 1929d2fefe274fb0e04df843f01beaf9e89e1809
          python3 -m json.tool research/contrib/chatgpt/20261013-y057-magnitude-transfer/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y057-magnitude-transfer/execute.py
      - name: Original frozen first-use shared-cohort two-magnitude science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y057-magnitude-transfer/execute.py > /tmp/Y057-original.json
          python3 -m json.tool /tmp/Y057-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y057-original.json'))
          assert x["development_seeds"]==list(range(2496,2504))
          assert x["sealed_heldout_seeds"]==list(range(2504,2520))
          assert x["shock_magnitudes"]==[3,7]
          assert len(x["magnitude_studies"])==2
          assert all(len(row["heldout_records"])==5*4*16*3
                     for row in x["magnitude_studies"].values())
          print('CLASSIFICATION',x['classification'])
          for magnitude,row in x["magnitude_studies"].items():
              print('MAGNITUDE',magnitude,row["robust_transfer_gate"])
              print('RISK',magnitude,row["risk_by_arm"])
              print('GAINS',magnitude,row["worst_error_reduction_fraction"],row["pooled_loss_penalty_fraction"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y057-original-shock-magnitude-transfer
          path: /tmp/Y057-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One complete Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
