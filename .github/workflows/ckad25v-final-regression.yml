name: CKAD25-V exact-final native regression and G29
on:
  push:
    branches: [research/ckad25v-native-relation-compilation-20261118]
    paths:
      - ".github/workflows/ckad25v-final-regression.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source-pinned-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
      source_sha: ${{ steps.seal.outputs.source_sha }}
    steps:
      - name: Keep Git source bytes exact
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Freeze source tree, audit original result, generate exactly G29 derived index
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/ckad25v-native-relation-compilation-20261118
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_causal_relation_posterior.py)" = "ac738c0fe03e5532f9e422dfe972c378728741c7"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "5a8315f7451ded843adeab9f0b22f7454a87ad0a"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-V/run.py)" = "959b5dccb64408016277a9add461d91997fba25a"
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD25-V")
          raw=(root/"result.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="467b6f139551fa672f09e86af3fcd5a2a0a1f2d1657bbace9ba33973f34a04f7"
          x=json.loads(raw)
          assert x["disposition"]=="DEVELOPMENT_SIGNAL"
          assert x["scientific_pass"] is False
          assert x["native_promotion"] is False and x["forge_dispatch"] is False
          print("CKAD25V_ORIGINAL_SCIENCE_RESULT_NOT_RERUN_PASS")
          PY
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert changed=={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"},changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(ckad25v): pin G29 exact source-only derived atlas"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CKAD25V_ATLAS_SOURCE_SHA=$GITHUB_SHA"
          echo "CKAD25V_ATLAS_FINAL_SHA=$(git rev-parse HEAD)"

  full-native-regression:
    needs: [source-pinned-atlas]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Prevent cross-OS line-ending changes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-pinned-atlas.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install full original native regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full inherited tests, new negative controls, sealed science and exact G29
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-pinned-atlas.outputs.final_sha }}"
          test "$(git rev-parse 'HEAD^')" = "${{ needs.source-pinned-atlas.outputs.source_sha }}"
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object yggdrasil/native_causal_relation_posterior.py)" = "ac738c0fe03e5532f9e422dfe972c378728741c7"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "5a8315f7451ded843adeab9f0b22f7454a87ad0a"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p test_ckad23.py -v
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD25-V")
          result=(root/"result.json").read_bytes()
          prov=json.loads((root/"provenance.json").read_bytes())
          assert hashlib.sha256(result).hexdigest()=="467b6f139551fa672f09e86af3fcd5a2a0a1f2d1657bbace9ba33973f34a04f7"
          data=json.loads(result)
          assert prov["original_result_sha256"]==hashlib.sha256(result).hexdigest()
          assert prov["linux_windows_identical_bytes"] is True
          assert data["source_script_sha256"]==hashlib.sha256((root/"run.py").read_bytes()).hexdigest()
          assert data["disposition"]=="DEVELOPMENT_SIGNAL" and all(data["gates"].values())
          assert data["mean_brier"]["native_compiled"]==data["mean_brier"]["exact_sparse3"]==0.050250772
          assert data["compiled_fully_confident_answered"]==61
          assert data["compiled_confident_wrong"]==1
          assert data["scientific_pass"] is False and data["owner_acceptance"] is False
          assert data["forge_dispatch"] is False and data["native_promotion"] is False
          assert data["deployment"] is False and data["accepted_main_changed"] is False
          print("CKAD25V_SEALED_NATIVE_EXACT_BAYES_PARITY_AUDIT_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo "CKAD25V_FINAL_NATIVE_REGRESSION_PASS_SHA=$(git rev-parse HEAD)"
