name: CKAD25-T exact-head G29 and full native regression
on:
  push:
    branches: [research/ckad25t-evidence-certified-repair-20261118]
    paths:
      - ".github/workflows/ckad25t-final-regression.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.derive.outputs.final_sha }}
      source_sha: ${{ steps.derive.outputs.source_sha }}
    steps:
      - name: Preserve exact checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Source-lock and generate only derived G29 sidecars
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/ckad25t-evidence-certified-repair-20261118
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-T/run.py)" = "650a84097ba06aa0373f988ef8acb5d11619929c"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("research/contrib/chatgpt/CKAD25-T/result.json")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="3c6400127b2c95fdd8e375b08eba755c0681e2f8df67b808c60d61c0991e43e9"
          print("CKAD25T_ORIGINAL_SCIENCE_BYTES_UNCHANGED")
          PY
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B - <<'PY'
          import subprocess
          names=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert names=={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"},names
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(ckad25t): seal exact source G29 atlas sidecars"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CKAD25T_ATLAS_SOURCE_SHA=$GITHUB_SHA"
          echo "CKAD25T_ATLAS_FINAL_SHA=$(git rev-parse HEAD)"

  full-regression:
    needs: [atlas]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve checkout file bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exactly qualified native test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full root tests, source-negative controls, exact-head atlas and sealed result audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.final_sha }}"
          test "$(git rev-parse 'HEAD^')" = "${{ needs.atlas.outputs.source_sha }}"
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object research/contrib/chatgpt/CKAD25-T/run.py)" = "650a84097ba06aa0373f988ef8acb5d11619929c"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p test_ckad23.py -v
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("research/contrib/chatgpt/CKAD25-T")
          raw=(p/"result.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="3c6400127b2c95fdd8e375b08eba755c0681e2f8df67b808c60d61c0991e43e9"
          x=json.loads(raw)
          assert x["disposition"]=="DEVELOPMENT_MIXED_NO_GO"
          assert x["candidate_answered"]==20
          assert x["candidate_correct_answered"]==20
          assert x["candidate_confident_wrong"]==0
          assert x["brier_means"]["certified_repair"]==x["brier_means"]["unconditional_repair"]==0.145833333
          assert x["gates"]["brier_improved_0_02_vs_unconditional_native_repair"] is False
          assert x["scientific_pass"] is False and x["native_promotion_authorized"] is False
          assert x["source_script_sha256"]==hashlib.sha256((p/"run.py").read_bytes()).hexdigest()
          assert x["reused_scoring_helpers_sha256"]==hashlib.sha256(
              Path("research/contrib/chatgpt/CKAD25-S/run.py").read_bytes()).hexdigest()
          print("CKAD25T_SEALED_NEGATIVE_EVIDENCE_AUDIT_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo "CKAD25T_FINAL_REGRESSION_PASS_SHA=$(git rev-parse HEAD)"
