name: CKAD32 frozen causal-hypothesis tournaments and final cross-OS qualification
on:
  push:
    branches: [research/ckad32-causal-tournaments-20261118]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: "github.event.head_commit.message == 'ci(ckad32): lock source and execute pilots'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Source identity, no-hidden-label tests, and unscored preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor fe11284f07f13ad218e014536075b73f2042e7c0 HEAD
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-32 -p 'test_ckad32.py' -v
          python -B research/contrib/chatgpt/CKAD-32/campaign.py --mode preflight
          test ! -f research/contrib/chatgpt/CKAD-32/pilot_screen_report.json
          test -z "$(git status --porcelain)"
  pilot:
    needs: [preflight]
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        seed: [9451, 9452]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Matched pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exactly one first-use public intervention pilot per seed
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f research/contrib/chatgpt/CKAD-32/pilot_screen_report.json
          SOURCE="$(python -c 'import json; print(json.load(open("research/contrib/chatgpt/CKAD-32/source_lock.json"))["campaign_blob_sha1"])')"
          test "$(git hash-object research/contrib/chatgpt/CKAD-32/campaign.py)" = "$SOURCE"
          mkdir -p "$RUNNER_TEMP/ckad32"
          python -B research/contrib/chatgpt/CKAD-32/campaign.py --mode pilot --seed ${{ matrix.seed }} > "$RUNNER_TEMP/ckad32/result.json"
          test -s "$RUNNER_TEMP/ckad32/result.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ckad32-pilot-${{ matrix.seed }}
          path: ${{ runner.temp }}/ckad32/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [pilot]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.final.outputs.candidate }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ckad32-pilot-*
          path: ${{ runner.temp }}/ckad32-all
          merge-multiple: false
      - name: Preserve exact original pilot JSON and independent negative decision
        id: final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-32/seal_pilot.py --root "$RUNNER_TEMP/ckad32-all"
          python -B research/contrib/chatgpt/CKAD-32/seal_pilot.py
          git add -- research/contrib/chatgpt/CKAD-32/pilot-9451.json research/contrib/chatgpt/CKAD-32/pilot-9452.json research/contrib/chatgpt/CKAD-32/pilot_screen_report.json
          if test -f research/contrib/chatgpt/CKAD-32/pilot_certificate.json; then
            git add -- research/contrib/chatgpt/CKAD-32/pilot_certificate.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ckad32): seal original intervention evidence and frozen screen'
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git commit -m 'docs(ckad32): pin post-pilot source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          python -B research/contrib/chatgpt/CKAD-32/seal_pilot.py
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad32-causal-tournaments-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full pinned regression CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory exact-SHA full native regression and independent pilot audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-31 -p 'test_ckad31.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-32 -p 'test_ckad32.py' -v
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-30/audit_primary.py
          python -B research/contrib/chatgpt/CKAD-31/seal_pilot.py
          python -B research/contrib/chatgpt/CKAD-32/seal_pilot.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
