name: AAI-11H frozen structural causal run-length DEV source and G29 atlas
on:
  push:
    branches: [research/aai11h-changepoint-causal-posterior-20261114]
    paths: [.github/workflows/aai11h-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11h-source-one-shot-20261114
  cancel-in-progress: false
jobs:
  dev:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11H original run-length causal posterior DEV qualification one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prereg before candidate code, inherited G benchmark and current source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'baf438a84f808e5bc47a23dec1a8273f258f6e27'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11h-source-atlas-once.yml'
          test "$(git rev-parse b174bae590f451426b9b4f513ac995989e6f09c0^)" = '2f1a0d8e73465081d24c8d7364883d9836ba69d1'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11H/prereg.json)" = '487d2b90a723575eac1ba117d45baeb1dafee248'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11H/prereg.json)" = "$(git rev-parse b174bae590f451426b9b4f513ac995989e6f09c0:research/contrib/chatgpt/AAI-11H/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11H/causal.py)" = 'fec1d2bfee4215095128120e450bf41d07aaa1a9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11H/dev.py)" = 'f5d60f12e55df205c23b4d3b533386505283e46a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11H/test_causal.py)" = 'e9d74fc8296a0a7c643e30daa91807f5f3f1eb26'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/prereg.json)" = '260c815900cc7f12aeab9a41a2caa6627482b6e9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/admit.py)" = '7fbeaf898d65cded838f74f1963da3b88af9604d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/audit.py)" = '299a79cf8101a6a7a8231c693d52b022fab22e07'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/fixture.py)" = '191575e68f64858acf036cd1e10c1e266cf16692'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test -z "$(git status --porcelain)"
          echo AAI11H_PREREG_SOURCE_PROVENANCE_AND_UNMODIFIED_G_BENCHMARK_PASS
      - name: New structural causal model and identical-information sixteen-row ablation tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11H -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11H/dev.py --primary >/dev/null 2>&1; then
            echo AAI11H_SCIENCE_FIRST_USE_DISARM_FAILURE >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11H_FOCUSED_CAUSAL_RUNLENGTH_AND_SCIENCE_DISARM_PASS
      - name: Single preregistered 288-episode true-intervention DEV screen (early stop)
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11H/dev.py --fixture-admission
          test -z "$(git status --porcelain)"
          echo AAI11H_FROZEN_MECHANICAL_ADMISSION_RECORDED_NO_SCIENCE
  atlas:
    needs: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate only pre-existing G29 source-pinned atlas files
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'baf438a84f808e5bc47a23dec1a8273f258f6e27'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11H source-pinned generated-only G29 atlas'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11h-changepoint-causal-posterior-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11h-changepoint-causal-posterior-20261114
          echo AAI11H_SOURCE_PINNED_G29_ATLAS_ONLY_PASS
