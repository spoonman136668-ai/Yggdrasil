name: Mass DTR02 prospective fitted public original-source controls
on:
  push:
    branches:
      - research/mass-dtr02-fitted-public-comparators-20261023
permissions:
  contents: read
concurrency:
  group: mass-dtr02-qualify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-fitted-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout committed first-prereg source and bounded implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Prove frozen FIRST prereg and no predecessor edits
        shell: bash
        run: |
          set -euo pipefail
          first=af6f18730af20fb6a5821f69fde14bbe6757fffa
          parent=aaa35082eefa6c5410d780a1cc456b85c8609b09
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/DTR02_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; got=set(sys.stdin.read().splitlines()); want={"research/native/itd01/mass_r10/DTR02_PREREG.md","research/native/itd01/mass_r10/run_dtr02_fitted_public.py","research/native/itd01/mass_r10/test_dtr02_fitted_public.py",".github/workflows/mass-dtr02-public-fit.yml"}; assert got==want,(got,want)'
      - name: Checkout exact original externally authored source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: external/Causal-Gymnasium
          persist-credentials: false
      - name: Python 3.11 for unchanged original upstream
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original untouched upstream dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p dtr02-evidence
          set +e
          timeout 330s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/Causal-Gymnasium >dtr02-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >dtr02-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Focused no-source-use fitting controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_dtr02_fitted_public.py | tee dtr02-evidence/focused-tests.log
      - name: Exact upstream Git and isolated source import preflight
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/preflight_original_dtr.py \
            --upstream external/Causal-Gymnasium \
            --pip-exit "$(cat dtr02-evidence/pip-exit.txt)" \
            --receipt dtr02-evidence/source-preflight.json
      - name: Execute frozen public FIT and trained-control VALID DEV once
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_dtr02_fitted_public.py \
            --upstream external/Causal-Gymnasium \
            --out dtr02-evidence/
      - name: Preserve full source, fitting and negative receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-dtr02-original-public-fitted-comparators
          path: dtr02-evidence/
          retention-days: 30
