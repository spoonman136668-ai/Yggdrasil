name: WSP121 isolated engineering operator transfer preflight
on:
  push:
    branches: [research/wsp121-unlisted-operator-transfer-20261116]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU conventional MLP dependency
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Require frozen prereg ancestry, no primary consumption
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor cb7d848dfb7e0cb47fe924b8ce012c40ae7e7282 HEAD
          git merge-base --is-ancestor d2df53db5f5709086bf03a5b50ed401af7e2cb00 HEAD
          test ! -e research/contrib/chatgpt/WSP-121/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-121/result.json
          test ! -e research/contrib/chatgpt/WSP-121/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Only WSP121 disjoint source-safe fixtures
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-121 -p 'test_*.py' -v
      - name: Verify source checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp121): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp121-source-only-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate ONLY three code-atlas files on isolated research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d2df53db5f5709086bf03a5b50ed401af7e2cb00 HEAD
          test -z "$(git status --porcelain)"
          S="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$S"
          git add -- .ice/code-atlas.json .ice/code-atlas.ice .ice/code-atlas.html
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp121): pin G29 source atlas at $S"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp121-unlisted-operator-transfer-20261116
          echo "WSP121_G29_SOURCE=$S"
          echo "WSP121_G29_ARCHIVE=$(git rev-parse HEAD)"

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp121): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned inherited WSP117 source-safe fixture dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Install pinned inherited WSP120 conventional control dependency
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Check exact G29 source and no primary first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d2df53db5f5709086bf03a5b50ed401af7e2cb00 HEAD
          python -B scripts/build_code_atlas.py --check-if-present
          test ! -e research/contrib/chatgpt/WSP-121/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-121/result.json
      - name: All inherited WSP117–121 focused source-safe tests
        shell: bash
        run: |
          set -euo pipefail
          for n in 117 118 119 120 121; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory inherited whole-root regression and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: WSP121 engineering-only matched full-path cost feasibility (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/WSP-121/engineering_cost_probe.py --repeats 7
          test -z "$(git status --porcelain)"
