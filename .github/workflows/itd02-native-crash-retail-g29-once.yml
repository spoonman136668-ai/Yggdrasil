name: ITD-02 native crash and resource G29 one-time source index
on:
  push:
    branches:
      - research/itd02-native-crash-retail-meter-20261027
    paths:
      - '.github/workflows/itd02-native-crash-retail-g29-once.yml'
permissions:
  contents: write
concurrency:
  group: itd02-crash-retail-g29-once
  cancel-in-progress: false
jobs:
  exact-source-only:
    if: ${{ github.actor == 'spoonman136668-ai' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact frozen learner and pure index workflow delta
        shell: bash
        run: |
          set -euo pipefail
          frozen='0a616b96ddd43ed7094a7a2c00c23486a8419635'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$frozen" HEAD
          test "$(git rev-list --count "$frozen"..HEAD)" = 1
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$frozen" HEAD)" = '.github/workflows/itd02-native-crash-retail-g29-once.yml'
          echo 'YGG_ITD02_CRASH_RETAIL_INDEX_SOURCE_BOUND=PASS'
      - name: Generate existing G29 locator only and verify no original world use
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python -B -m unittest discover -s tests -p test_itd02_public_source_journal_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_local_resource_probe_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
      - name: Commit exactly the three source-index artifacts and read-only qualify
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/itd02-native-crash-retail-meter-20261027
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(itd02): source-pin native crash and resource diagnostics to G29'
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/research/itd02-native-crash-retail-meter-20261027
          echo 'YGG_ITD02_CRASH_RETAIL_G29_REANCHOR_PASS'
