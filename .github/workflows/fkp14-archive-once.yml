name: FKP14 freeze original public action-source evidence and final exact-SHA regression
on:
  push:
    branches: [ci/fkp14-archive-original-20261115]
    paths: [.github/workflows/fkp14-archive-once.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: fkp14-original-evidence-archive-only-20261115
  cancel-in-progress: false

jobs:
  archive-original-evidence-once:
    if: >-
      github.event.head_commit.message == 'ci(FKP-14): archive authentic consumed public results without re-execution' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      head: ${{ steps.seal.outputs.head }}
    env:
      SOURCE: e5cbc82494fc01b75fbe84dc446d2f8f8a7bef9f
      SOURCE_TREE: 9f1242509dfa89930dbf32dca6a856f73d7aecac
      TARGET: research/fkp14-real-branch-action-identifiability-20261115
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent Git checkout byte drift
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e5cbc82494fc01b75fbe84dc446d2f8f8a7bef9f
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original research source, prereg and original one-shot status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 104d3543ddf88403242782114ac0e16b8e95ccd8 "$SOURCE"
          git merge-base --is-ancestor 1a0de58d9586b7ae7b26d69932fa9b30db2e7cb3 "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-14/prereg.json)" = 2bae7e958ace0c412dcb0c7ea84af6b72688c2d3
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-14/evaluate.py)" = a12da444edfed850e1fb12fba21061c3313e4339
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-14/test_fkp14.py)" = 6fcb6d3298054220179468599bf339e70872d967
          test "$(gh run view 43743529383 --repo spoonman136668-ai/Yggdrasil --json conclusion --jq .conclusion)" = success
          echo "FKP14_ORIGINAL_EXACT_SOURCE_AND_CROSS_OS_WORKFLOW=PASS"
      - name: Recover archived first-use JSON directly from successful ORIGINAL workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fkp14-artifact"
          gh run download 43743529383 --repo spoonman136668-ai/Yggdrasil \
            -n fkp14-original-public-source-branching-result \
            -D "$RUNNER_TEMP/fkp14-artifact"
          test -f "$RUNNER_TEMP/fkp14-artifact/fkp14-first-public-dev.json"
          echo "df6fbaabae584e3a2f6b4b54e90fcbf9206e47acfdb67c0614ea3a0d608ffe6a  $RUNNER_TEMP/fkp14-artifact/fkp14-first-public-dev.json" | sha256sum -c -
      - name: Archive unchanged original public DEV (not new first-use) with custody
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/fkp14-artifact/fkp14-first-public-dev.json" <<'PY'
          import json,hashlib,sys,pathlib
          original=pathlib.Path(sys.argv[1]).read_bytes()
          assert hashlib.sha256(original).hexdigest()=="df6fbaabae584e3a2f6b4b54e90fcbf9206e47acfdb67c0614ea3a0d608ffe6a"
          x=json.loads(original)
          assert x["schema"]=="yggdrasil.fkp14.actual-intervention-identifiability.v1"
          assert x["status"]=="SOURCE_ACTION_LOCAL_HEADROOM_PASS"
          assert not x["scientific_pass"] and not x["native_model_modified"]
          assert x["new_public_dev_cohort_consumed"] and not x["protected_firstuse"] and not x["model_trained"]
          assert x["upstream"]["source_sha"]=="a94f2b60d1769ea44df3226561488768e1dff9f4"
          assert x["registered_worlds"]==32 and x["reference_anchors"]==x["valid_anchors"]==128
          assert x["actual_env_step_actions"]==95738 and x["physical_env_resets"]==2432
          assert x["macro_horizons"]==[8,16] and x["macro_choices_per_anchor"]==9
          assert len(x["per_anchor"])==256 and len(x["skipped_anchors"])==0
          assert x["horizon8_contrast_fraction"]==x["horizon16_contrast_fraction"]==1.0
          assert x["horizon16_positive_return_fraction"]==0.8046875
          assert abs(x["horizon16_oracle_minus_random_mean"]-.23125)<1e-10
          assert x["horizon16_any_terminal_goal_anchors"]==1
          assert all(x["prespecified_requirements"].values())
          assert x["source_receipt_sha256"]=="95db3845c88d4fd9c361a8d7c6d124cfd42b600d4bf3f19d6875942d4f588109"
          assert all(row["source_replay_same_prefix"] and row["distinct_branches"]==9 for row in x["per_anchor"])
          target=pathlib.Path("research/contrib/chatgpt/FKP-14")
          (target/"primary-original.json").write_bytes(original)
          curated={
             "schema":"yggdrasil.fkp14.original-action-branch-source-result-summary.v1",
             "experiment":"FKP-14",
             "classification":"SOURCE_ACTION_HEADROOM_PASS_ENGINEERING_ONLY",
             "original_public_dev_status":x["status"],
             "engineering":"PASS: original Ubuntu first-use and Windows consumed-source replay, G29/focused/full inherited 54 tests on both; run #43743529383 success",
             "scientific_pass":False,
             "native_model_changed":False,
             "independent_science_firstuse":False,
             "source_replay_used_original_seeds":True,
             "original_public_dev_consumed":True,
             "parent_research_fkp10":"942181ce7bda76386226d203db62d9f46c9dd406",
             "original_prereg_only_commit":"104d3543ddf88403242782114ac0e16b8e95ccd8",
             "exact_original_source_commit":"1a0de58d9586b7ae7b26d69932fa9b30db2e7cb3",
             "source_generated_only_qualified_commit":"e5cbc82494fc01b75fbe84dc446d2f8f8a7bef9f",
             "upstream_original_git_sha":"a94f2b60d1769ea44df3226561488768e1dff9f4",
             "reward_modified_source_public_only":"reward_fall_off=-0.05,max_steps=512; not original default benchmark",
             "source_actions":x["actual_env_step_actions"],
             "physical_resets":x["physical_env_resets"],
             "worlds":x["registered_worlds"],
             "anchors":x["valid_anchors"],
             "branch_actions_per_anchor":x["macro_choices_per_anchor"],
             "horizons":x["macro_horizons"],
             "horizon8_return_contrast_fraction":x["horizon8_contrast_fraction"],
             "horizon16_return_contrast_fraction":x["horizon16_contrast_fraction"],
             "horizon16_positive_return_fraction":x["horizon16_positive_return_fraction"],
             "horizon16_privileged_oracle_vs_fixed_random_return_gain":x["horizon16_oracle_minus_random_mean"],
             "horizon16_any_goal_anchors":x["horizon16_any_terminal_goal_anchors"],
             "preset_requirements":x["prespecified_requirements"],
             "source_receipt_sha256":x["source_receipt_sha256"],
             "original_full_json_sha256":hashlib.sha256(original).hexdigest(),
             "original_artifact_id":14172509473,
             "original_workflow_id":43743529383,
             "limits":[
                "Privileged evaluator physically tried all nine alternatives from each real source reset; no learned agent has access to unchosen consequences.",
                "This is an information/action headroom and source-engineering test, not model learning, policy superiority or independent scientific acceptance.",
                "Original chosen paths and ordinary agent returns differ from best-of-nine future oracle; do not compare the oracle as a matched conventional controller.",
                "Only the public-source configured negative failure feedback was tested; no original default benchmark score or autonomous general intelligence claim.",
                "32 source DEV world seeds 974000..974031 now consumed. Future 974500..974563 and owner-protected first-use untouched.",
                "Next genuinely learned policy requires separate prereg and strongest trained recurrent/model-based controls, matched actions/info/compute, cold interference, retention and unfamiliar transfer."
             ]
          }
          provenance={
            "schema":"yggdrasil.fkp14.original-evidence-provenance.v1",
            "source":"GitHub workflow original first-use and exactly identical cross-OS source receipt",
            "original_run_url":"https://github.com/spoonman136668-ai/Yggdrasil/actions/runs/43743529383",
            "run_id":43743529383,
            "run_attempt":1,
            "run_conclusion":"success",
            "original_artifact_id":14172509473,
            "original_artifact_name":"fkp14-original-public-source-branching-result",
            "original_raw_json_sha256":hashlib.sha256(original).hexdigest(),
            "frozen_prereg_commit":"104d3543ddf88403242782114ac0e16b8e95ccd8",
            "frozen_source_commit":"1a0de58d9586b7ae7b26d69932fa9b30db2e7cb3",
            "source_derived_G29_commit":"e5cbc82494fc01b75fbe84dc446d2f8f8a7bef9f",
            "original_upstream_sha":"a94f2b60d1769ea44df3226561488768e1dff9f4",
            "original_receipt_sha256":x["source_receipt_sha256"],
            "original_public_cohorts_consumed":True,
            "owner_protected_firstuse_consumed":False,
            "unchanged_evaluation_source_after_firstuse":True,
            "archived_without_rerunning_source":True,
            "accepted_main_sha":"5e74f8db85b2f5839c42148c0dfba69a88b1a2c9"
          }
          for name,value in (("result.json",curated),("provenance.json",provenance)):
            (target/name).write_text(json.dumps(value,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("FKP14_RAW_ORIGINAL_PUBLIC_RESULT_ARCHIVED_BYTE_EXACT_SHA256="+hashlib.sha256(original).hexdigest())
          PY
          git add research/contrib/chatgpt/FKP-14/primary-original.json research/contrib/chatgpt/FKP-14/result.json research/contrib/chatgpt/FKP-14/provenance.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "research(FKP-14): archive first public source observations without rerunning DEV"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
      - name: Generate G29 exact archive-only research index
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$EVIDENCE_SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
      - name: Seal generated-only archive and push exact research HEAD, not main
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-14): index frozen original source evidence G29"
          NEW="$(git rev-parse HEAD)"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          git diff "$SOURCE" --name-only | LC_ALL=C sort > "$RUNNER_TEMP/change-list.txt"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json research/contrib/chatgpt/FKP-14/primary-original.json research/contrib/chatgpt/FKP-14/provenance.json research/contrib/chatgpt/FKP-14/result.json > "$RUNNER_TEMP/allowed-changes.txt"
          diff -u "$RUNNER_TEMP/allowed-changes.txt" "$RUNNER_TEMP/change-list.txt"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "head=$NEW" >> "$GITHUB_OUTPUT"
          echo "FKP14_ARCHIVE_ORIGINAL_FINAL_HEAD=$NEW"

  final-full-regression:
    needs: archive-original-evidence-once
    if: needs.archive-original-evidence-once.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Disable CRLF byte rewriting
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.archive-original-evidence-once.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only original fixture package, no new source episodes
        shell: bash
        run: |
          python -m pip install "numpy==1.26.4"
      - name: Mandatory full final exact-SHA regression and frozen original evidence verification
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-14 -p test_fkp14.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path("research/contrib/chatgpt/FKP-14")
          raw=(root/"primary-original.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="df6fbaabae584e3a2f6b4b54e90fcbf9206e47acfdb67c0614ea3a0d608ffe6a"
          x=json.loads(raw)
          summary=json.loads((root/"result.json").read_text(encoding="utf-8"))
          custody=json.loads((root/"provenance.json").read_text(encoding="utf-8"))
          assert summary["original_full_json_sha256"]==custody["original_raw_json_sha256"]==hashlib.sha256(raw).hexdigest()
          assert summary["classification"]=="SOURCE_ACTION_HEADROOM_PASS_ENGINEERING_ONLY"
          assert summary["scientific_pass"] is False
          assert summary["source_receipt_sha256"]==x["source_receipt_sha256"]=="95db3845c88d4fd9c361a8d7c6d124cfd42b600d4bf3f19d6875942d4f588109"
          assert summary["source_actions"]==95738
          assert custody["original_public_cohorts_consumed"]
          assert not custody["owner_protected_firstuse_consumed"]
          assert custody["archived_without_rerunning_source"]
          print("FKP14_FINAL_ORIGINAL_EVIDENCE_UNCHANGED_SCIENCE_DISARMED=PASS")
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FKP14_FINAL_BOTH_OS_FROZEN_SOURCE_FULL_REGRESSION=PASS"
