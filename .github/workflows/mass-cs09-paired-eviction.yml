name: Mass CS09 prospectively paired original K4 eviction replication
on:
  push:
    branches:
      - research/mass-cs09-paired-eviction-replication-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs09-public-sealed-splits-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-source-paired-mem:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout original source-first experiment candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 9
      - name: Verify single-file frozen FIRST-only parent and additive source
        shell: bash
        run: |
          set -euo pipefail
          first=effc828b9fba5e2b5015f5e933ae9713d4b2dac6
          parent=c822b8e80757895ab44e64c19111685eb9a68f46
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS09_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;actual=set(sys.stdin.read().splitlines());expected={"research/native/itd01/mass_r10/CS09_PREREG.md","research/native/itd01/mass_r10/run_cs09_paired_original_eviction.py","research/native/itd01/mass_r10/test_cs09_paired_original_eviction.py",".github/workflows/mass-cs09-paired-eviction.yml"};assert actual==expected,(actual,expected)'
      - name: Checkout exact unchanged original independent POPGym source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym
          persist-credentials: false
      - name: Configure Python for original upstream
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unchanged original source dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs09-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/popgym >cs09-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          echo "$rc" >cs09-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Source-free pinned cache and confidence interval tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs09_paired_original_eviction.py 2>&1 | tee cs09-evidence/focused-tests.log
      - name: Run exactly frozen public FIT VALID and paired original DEV
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs09_paired_original_eviction.py --upstream external/popgym --out cs09-evidence/
      - name: Preserve real original source per-seed reward and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs09-original-paired-eviction
          path: cs09-evidence/
          retention-days: 30
