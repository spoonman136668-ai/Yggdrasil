name: Yggdrasil Y018 frozen order experiment
on:
  push:
    branches: [research/y018-order-stability-r1]
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen parent and source identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 58a077575e114eb21e4bbd3aa55458c5d8aa9871 HEAD
          test "$(git hash-object --no-filters research/applications/plane/exp-dgr-real-utf8-minimax-matched-consolidation-016.py)" = c4247f69295b25105a91cc402b123493ae63aa68
      - name: Install pinned-project dependencies
        run: python -m pip install -e ".[test]"
      - name: Execute Y018 once from frozen preregistration
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/20261012-y018-order-stability/execute.py --output "$RUNNER_TEMP/y018-result.json"
          python -m json.tool "$RUNNER_TEMP/y018-result.json"
      - name: Retain original scientific result
        uses: actions/upload-artifact@v4
        with:
          name: y018-original-frozen-order-result
          path: ${{ runner.temp }}/y018-result.json
          retention-days: 90
          if-no-files-found: error
      - name: Full project regression
        run: python -m pytest -q tests
