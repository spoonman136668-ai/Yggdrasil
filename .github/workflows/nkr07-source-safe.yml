name: NKR07 owner-explicit full knowledge installer source-safe qualification
on:
  push:
    branches: [research/nkr07-owner-persistent-knowledge-install-20261116]
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source, prereg first and no original owner execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3510870b9cde9870f055a49c9eb72ccb1a9ef671 HEAD
          git merge-base --is-ancestor 7e82dea6e53d430c4fb878853f192a20ac792914 HEAD
          test ! -e research/contrib/chatgpt/NKR-07/result.json
          test -z "$(git status --porcelain)"
      - name: Offline simulated gh owner installer source-safe tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_owned_historical_knowledge_install.py -v
          python -B -m unittest discover -s tests -p test_native_knowledge_activation.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(nkr07): pin owner installer G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: nkr07-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact G29 derived source-index files only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7e82dea6e53d430c4fb878853f192a20ac792914 HEAD
          test -z "$(git status --porcelain)"
          SOURCE="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(nkr07): pinned G29 source at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/nkr07-owner-persistent-knowledge-install-20261116

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(nkr07): pinned G29 source at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory NKR05 and all-native full root regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7e82dea6e53d430c4fb878853f192a20ac792914 HEAD
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"

  independent-g29:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(nkr07): pinned G29 source at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent code atlas source and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
