name: Yggdrasil Y035 frozen quorum conflict interaction
on:
  push:
    branches: [research/y035-quorum-conflict-interaction-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen identity and preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bd5fafd596f2227a42376d55ff6be8ee3a8ea6e3 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-quorum-transfer/execute.py)" = afebb515e33803f071fbcbdfdd7b19be77ae9abe
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/prereg.json)" = 32cf011ce0860bc9a5ac7166b4760ead5f427a08
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/execute.py)" = 692e92cf931a2d63b39a618c0044af390984f099
          python3 -m json.tool research/contrib/chatgpt/20261013-y035-interaction/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y035-interaction/execute.py
      - name: Original frozen quorum and conflict experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y035-interaction/execute.py > /tmp/Y035-original.json
          python3 -m json.tool /tmp/Y035-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y035-original.json'))
          assert x['sealed_heldout_seeds']==list(range(184,200))
          assert len(x['regimes'])==4
          print('CLASSIFICATION',x['classification'])
          for r in x['regimes']:
              print('REGIME',r['regime'],r['heldout_churn'],r['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y035-original-quorum-conflict
          path: /tmp/Y035-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
