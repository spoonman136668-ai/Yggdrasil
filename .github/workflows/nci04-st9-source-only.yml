name: NCI04 ST9 frozen genuine budgeted intervention source
on:
  push:
    branches:
      - research/nci04-st9-budgeted-active-causal-repair-20261115
permissions:
  contents: read
jobs:
  source:
    name: ST9 eight intervention source-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Preserve original source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse source/prereg Git blob or historical negative-result drift
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7184ad02c6236300a5847e5e620b6eb18cde0b56 HEAD
          git merge-base --is-ancestor 5159a65cd403bc3cbd507ab713742ebae330e28a HEAD
          test "$(git rev-parse HEAD:research/nci04_st9/frozen_protocol.json)" = 9ad8bc15e8dd8b0757c8db13772de23c57d2f3cf
          test "$(git rev-parse HEAD:research/nci04_st9/private_world.py)" = d1bdf67503bd797d79386406820679b70403e8bb
          test "$(git rev-parse HEAD:research/nci04_st9/source_audit.py)" = e1083ce61f0c96b53a3771b08efcc4f9af87e34d
          python -B - <<'PY'
          from research.nci04_st9.source_audit import verify_freeze
          p=verify_freeze()
          assert p['authority']['merge'] is False
          assert p['authority']['protected_first_use'] is False
          print('ST9_FROZEN_PRE_SOURCE_GIT_CUSTODY=PASS')
          PY
      - name: Source-level real-action and inherited failure control tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st9_source.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04_st8_source.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04d2_task.py' -v
          python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
          echo ST9_FOCUSED_SOURCE_UNIT=PASS
      - name: Qualify ONLY training actor original eight intervention actions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from research.nci04_st9.source_audit import audit
          record=audit(Path(os.environ['RUNNER_TEMP'])/'st9-stage0.json')
          assert record['held_source_unopened'] is True
          assert record['alternative_rule_unopened'] is True
          assert record['interference_unopened'] is True
          assert record['models_not_instantiated'] is True
          assert record['protected_scientific_first_use_unopened'] is True
          print('ST9_SOURCE_ONLY_RECEIPT_VERIFIED=PASS')
          PY
      - name: Clean source checkout
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st9-original-source-${{ matrix.os }}
          path: ${{ runner.temp }}/st9-stage0.json
          if-no-files-found: error
          retention-days: 14
  parity:
    needs: source
    name: ST9 three authentic actor histories and identifiability cross OS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st9-original-source-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st9-original-source-windows-2022
          path: windows
      - name: Exact source action histories, ranks and frozen source disposition
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('linux/st9-stage0.json').read_text('utf-8'))
          b=json.loads(Path('windows/st9-stage0.json').read_text('utf-8'))
          for name in a:
              if a[name]!=b[name]:
                  raise SystemExit('ST9_REAL_PUBLIC_SOURCE_CROSS_OS_'+name)
          print('ST9_ORIGINAL_TRAIN_ACTOR_SOURCE_PARITY=PASS')
          print('ST9_ACTIVE_RANK='+str(a['public_active_feature_rank']))
          print('ST9_LINEAR_CONTRADICTIONS='+str(a['observed_linear_contradictions_active']))
          print('ST9_SOURCE_DISPOSITION='+a['source_gate']['disposition'])
          print('ST9_PROTECTED_FIRST_USE=NOT_RUN')
          PY
