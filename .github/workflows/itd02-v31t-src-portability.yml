name: ITD-02 V31T-SRC Windows compatibility custody
on:
  push:
    branches: [repair/itd02-v31t-src-windows-custody-20261028]
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source custody and unmodified original test execution
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a5b3ac632fe4c3d12c03beb84c750b3245b2b7f6 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
          mkdir -p "$RUNNER_TEMP/v31t"
          for name in test_free_fanout_sidecar test_nci04g6_native_credit test_nci04g7_source_producer test_nci04g7d_native_lesion test_nci04g7e_functional_custody; do
            set +e
            PYTHONPATH=. python -B -m unittest discover -s tests -p "$name.py" -v > "$RUNNER_TEMP/v31t/$name.log" 2>&1
            status=$?
            set -e
            echo "$status" > "$RUNNER_TEMP/v31t/$name.exit"
            echo "$name: $status"
            if [ "$status" -ne 0 ]; then tail -n 45 "$RUNNER_TEMP/v31t/$name.log"; fi
          done
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          python - "$RUNNER_TEMP/v31t" <<'PY'
          import json,pathlib,re,sys
          p=pathlib.Path(sys.argv[1]);rows=[]
          for name in ('test_free_fanout_sidecar','test_nci04g6_native_credit','test_nci04g7_source_producer','test_nci04g7d_native_lesion','test_nci04g7e_functional_custody'):
            s=(p/(name+'.log')).read_text(errors='replace')
            rows.append({'module':name,'exit':int((p/(name+'.exit')).read_text()),'failed':re.findall(r'^(?:FAIL|ERROR): ([^\n]+)',s,re.M),
                         'summary':re.findall(r'^(?:Ran \d+ tests.*|FAILED \(.*|OK)$',s,re.M)[-2:]})
          d={'schema':'v31t.src.portability.v1','results':rows,'holdout_evaluated':False,'scientific_first_use':False,
             'classification':'V31T_SRC_PORTABILITY_FOCUSED_PASS__G29_AND_INHERITED_BLOCKED__NO_SCIENCE' if all(x['exit']==0 for x in rows) else 'V31T_SRC_PORTABILITY_PARTIAL__G29_AND_INHERITED_BLOCKED__NO_SCIENCE'}
          (p/'report.json').write_text(json.dumps(d,indent=2,sort_keys=True))
          print(json.dumps(d,sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: itd02-v31t-src-${{ matrix.os }}
          path: ${{ runner.temp }}/v31t/*
          retention-days: 7
