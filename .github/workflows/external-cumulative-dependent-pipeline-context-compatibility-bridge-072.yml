name: Yggdrasil context compatibility bridge 072
on:
  push:
    branches:
      - research/external-hosted-yggdrasil-dependent-pipeline-context-compatibility-bridge-r1
    paths:
      - 'research/experiments/yggdrasil-rsi-corrective-tranche-2026-10-04.json'
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.ice'
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-context-compatibility-bridge-072.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen corrective package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '2b1ed36c4858d837b395bb97bd2d0b770eaabb31' HEAD
          git merge-base --is-ancestor 'fa9dca2ca247a0bb73e475182b89d93e60a6fa14' HEAD
          changed="$(git diff --name-only '2b1ed36c4858d837b395bb97bd2d0b770eaabb31..HEAD' | sort)"
          expected="$(printf '%s\n'             '.github/workflows/external-cumulative-dependent-pipeline-context-compatibility-bridge-072.yml'             'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.py'             'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.ice'             'research/experiments/yggdrasil-rsi-corrective-tranche-2026-10-04.json' | sort)"
          test "$changed" = "$expected"
          grep -F '"exact_parent_sha": "9aa8dd8af112890c0ef209b7c980141970483a6a"' research/experiments/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.ice
          grep -F '"classification": "negative"' <(git show 2b1ed36c4858d837b395bb97bd2d0b770eaabb31^0:research/experiments/exp-dgr-external-cumulative-dependent-pipeline-context-local-key-induction-factorial-071.ice) >/dev/null || true
          python -m py_compile research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.py
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-CONTEXT-COMPATIBILITY-BRIDGE-072","preregistration_sha":"fa9dca2ca247a0bb73e475182b89d93e60a6fa14","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001900","manifest_sha256":"e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"42177636846fadadfa86d894f9a6f69073cae5b4"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="eb3a30b8e893fc94ddbf2ac101432d3d4279d2f3bd2bcaa09925f8f6c6932f8c"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="fa9dca2ca247a0bb73e475182b89d93e60a6fa14"
          assert r["manifest_sha256"]=="e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7"
          assert r["ckb_plane_main_sha"]=="42177636846fadadfa86d894f9a6f69073cae5b4"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact third-manifest sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-072"
          mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c",303863,"9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
            ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json",118601,"d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
            ("technical-prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md",11025,"61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for name,url,full_n,full_h,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"ygg-072"}),timeout=60).read(full_n+1)
              assert len(b)==full_n,(name,len(b),full_n)
              assert hashlib.sha256(b).hexdigest()==full_h,(name,hashlib.sha256(b).hexdigest())
              p=b[:prefix_n]
              assert hashlib.sha256(p).hexdigest()==prefix_h,(name,hashlib.sha256(p).hexdigest())
              (root/(name+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen compatibility bridge twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          app=research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-compatibility-bridge-072.py
          python "$app" --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python "$app" --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"];decision=r["compatibility_decision"]
          valid=(
            decision in ("DIRECT","BRIDGE","REJECT") and
            m["compatibility_decision_count"]==1 and
            m["heldout_compatibility_access_count"]==0 and
            m["post_result_decision_change_count"]==0 and
            m["source_state_rewrite_count"]==0 and
            m["row_synthesis_count"]==0 and
            m["capacity_growth_event_count"]==0 and
            m["source_identity_mismatch_count"]==0 and
            m["transfer_manifest_identity_mismatch_count"]==0 and
            m["transported_state_identity_mismatch_count"]==0 and
            m["candidate_state_capacity_failure_count"]==0 and
            m["invalid_evaluation_rows"]==0 and
            all(math.isfinite(float(v)) for v in m.values())
          )
          improvement=m["policy_positive_prose_collateral_schedule_count"]>m["original_positive_prose_collateral_schedule_count"]
          collateral_ok=m["policy_partner_collateral_failure_count"]==0 and m["policy_nonprose_regression_schedule_count"]==0
          timing_changed=m["active_mean_first_success_packet"]!=m["original_mean_first_success_packet"]
          if not valid: cls="invalid"
          elif decision in ("DIRECT","BRIDGE") and improvement and collateral_ok: cls="supported"
          elif decision=="REJECT" or (not improvement and collateral_ok and timing_changed): cls="mixed"
          else: cls="negative"
          out={
            "schema":"yggdrasil.research-classification.v1",
            "experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-CONTEXT-COMPATIBILITY-BRIDGE-072",
            "classification":cls,"validity_pass":valid,"compatibility_decision":decision,
            "authority_receipt_sha256":"eb3a30b8e893fc94ddbf2ac101432d3d4279d2f3bd2bcaa09925f8f6c6932f8c","rsi_success":False,
            "rsi_success_reason":"one context transfer is insufficient; retain/revert plus another disjoint-context replication required" if cls=="supported" else "context-transfer RSI success condition not met",
            "metrics":m,"selected_bridge_rows":r.get("selected_bridge_rows",[])
          }
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-072"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-context-compatibility-bridge-072
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
