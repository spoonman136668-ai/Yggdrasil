name: AAI-10C immutable final full cross-platform regression — NO scientific first use
on:
  push:
    branches: [research/aai10c-final-regression-once-20261114]
    paths: [.github/workflows/aai10c-exact-final-regression-once.yml]
permissions:
  contents: read
concurrency:
  group: aai10c-final-full-regression-once-20261114
  cancel-in-progress: false
jobs:
  qualified:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10C immutable source full final cross-platform one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout isolated read-only qualification harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated one-shot harness cannot edit candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10c-exact-final-regression-once.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI10C_ISOLATED_READ_ONLY_HARNESS_PASS
      - name: Checkout original frozen final candidate from draft PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 58c0a3744e08e7547a85acdf88190decb6797584
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check current main/base and frozen candidate/prereg/code-atlas blobs
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '58c0a3744e08e7547a85acdf88190decb6797584'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai10a-operator-association-learner-20261114 | cut -f1)" = '64a585010e13519c6290cc8c406154e1f23b9e78'
          test "$(git ls-remote origin refs/heads/research/aai10c-bounded-causal-statistics-20261114 | cut -f1)" = '58c0a3744e08e7547a85acdf88190decb6797584'
          test "$(git rev-parse b12bbc49ee695bf9a47e8bb59ec348694e72bf2f^)" = '64a585010e13519c6290cc8c406154e1f23b9e78'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/prereg.json)" = 'e6a59aa8070028094790ee58ca4c17a373fe642a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/prereg.json)" = "$(git rev-parse b12bbc49ee695bf9a47e8bb59ec348694e72bf2f:research/contrib/chatgpt/AAI-10C/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/compact.py)" = 'b8eb196fd923743f22d372135561f5c1a4f28982'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/test_compact.py)" = 'cc20fb6cedddf47398d5e0dde9baf497ac5878cc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/profile_dev.py)" = '693aa61685dca3ff644f3ed27e264d30c23206eb'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/models.py)" = '9233ffaafe2f227de687116b0ed4204ee4e2b3a2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI10C_EXACT_SOURCE_AND_G29_ATLAS_PASS
      - name: FULL original repository + AAI10P + AAI10A + AAI10C source regression
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10P -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10A -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10C -p 'test_*.py' -v
          python -B research/contrib/chatgpt/AAI-10P/benchmark.py --mechanical
          if python -B research/contrib/chatgpt/AAI-10C/profile_dev.py --primary >/dev/null 2>&1; then
            echo AAI10C_FIRST_USE_DISARM_FAILURE >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo AAI10C_MANDATORY_FULL_FINAL_REGRESSION_PASS_NO_SCIENCE
