name: Mass MR34I3 exact original native gradient coordinate diagnosis
on:
  pull_request:
    branches: [research/mass-mr34i2-first-update-numeric-source-20261023]
    paths:
      - 'research/mr34i3/**'
      - '.github/workflows/mass-mr34i3-coordinate-original.yml'
permissions:
  contents: read
concurrency:
  group: mass-mr34i3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
jobs:
  source-training-only-coordinates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve original Git source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: original_s4c1
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unchanged original public-source numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Install original Windows Pycolab curses
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify original protocol FIRST, source, and exact branch scope
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          parent=6dd16be4566503b2d027c55d717f8e2e63147798
          first=25fe9f6d3ec9fa44b79c814b69efb3e563b8229b
          test "$(git rev-parse "${first}^")" = "$parent"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git show --format= --name-only "$first")" = "research/mr34i3/FROZEN_PROTOCOL.md"
          test "$(git hash-object research/mr34i2/trace_first_update.py)" = "$(git rev-parse "$parent:research/mr34i2/trace_first_update.py")"
          actual="$(git diff --name-only "$parent" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
             '.github/workflows/mass-mr34i3-coordinate-original.yml' \
             'research/mr34i3/FROZEN_PROTOCOL.md' \
             'research/mr34i3/coordinate_probe.py' \
             'research/mr34i3/test_probe.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo MR34I3_FIRST_ONLY_AND_SOURCE_PIN_PASS
      - name: Run source-free focused coordinate tests
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m unittest -v research.mr34i3.test_probe 2>&1 | tee ../mr34i3-focused.log
      - name: Collect genuine original TRAIN-only native gradient coordinates
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m research.mr34i3.coordinate_probe ../original_s4c1 ../external/minigrid ../external/pycolab ../mr34i3-coordinates.json | tee ../mr34i3-original.log
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("../mr34i3-coordinates.json").read_text())
          assert d["no_original_held_test_or_protected_first_use"] is True
          assert d["native_model_weights_or_original_source_modified"] is False
          assert len(d["source_results"])==2
          for f,z in d["source_results"].items():
              assert len(z["original_first_11_updates_and_coordinates"])==11
              assert z["exact_original_training_events_sha256"] in (
                  "566f5e271e01421248bfabeb4326d01408d992276b877a978d96f14daf93797b",
                  "9ea175b912b734c7470f93d0b2584eea6c2ce01962aae285a66b4d4834b5346e")
          print("MR34I3_ONE_ORIGINAL_TRAIN_ONLY_DIAGNOSTIC_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-mr34i3-${{ matrix.os }}-${{ matrix.repeat }}
          path: |
            mr34i3-focused.log
            mr34i3-original.log
            mr34i3-coordinates.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm no changes to any source or native learning code
        shell: bash
        run: |
          set -euo pipefail
          for path in audit original_s4c1 external/minigrid external/pycolab; do
            git -C "$path" diff --exit-code
            test -z "$(git -C "$path" status --porcelain)"
          done
          echo MR34I3_ORIGINAL_SOURCE_AND_NATIVE_CODE_CLEAN

  original-coordinate-reconcile:
    needs: source-training-only-coordinates
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mass-mr34i3-*
          path: evidence
      - name: Locate first native arithmetic difference with strict original evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          original={}
          for os in ("ubuntu-24.04","windows-2025"):
              for repeat in (1,2):
                  p=pathlib.Path("evidence")/f"mass-mr34i3-{os}-{repeat}"/"mr34i3-coordinates.json"
                  original[os,repeat]=json.loads(p.read_text())
          out={}
          forward=("public_source_features","previous_episode_state",
                   "original_forward_projected_read",
                   "read_only_fsum_reference_read","read_only_fsum_reference_u",
                   "original_preaction_probability","original_next_recurrent_state")
          backward=("original_true_afteraction_public_target","original_backprop_dz",
                    "original_backprop_du","original_backprop_dg0_increment",
                    "original_backprop_dg1_increment","original_backprop_dg2_increment",
                    "original_backprop_shared_accumulation",
                    "original_backprop_local_accumulation","original_backprop_future")
          def first_diff(a,b,fields,order):
              for i in order:
                  x,y=a[i],b[i]
                  for field in fields:
                      a1,b1=x[field],y[field]
                      if a1["sha256"]!=b1["sha256"]:
                          j=next((j for j,(z,w) in enumerate(zip(a1["hex"],b1["hex"]))
                                  if z!=w),None)
                          return {"source_time_index":i,
                                  "stage":field,"coordinate_flat_index":j,
                                  "linux_float_hex":a1["hex"][j] if j is not None else None,
                                  "windows_float_hex":b1["hex"][j] if j is not None else None}
              return None
          for family in ("FaramaMiniGridDoorKey8","DeepMindPycolabApprehend"):
              a,b,c,d=[original[o,r]["source_results"][family]
                       for o,r in (("ubuntu-24.04",1),("ubuntu-24.04",2),
                                   ("windows-2025",1),("windows-2025",2))]
              for x in (b,c,d):
                  assert a["exact_original_training_events_sha256"]==x["exact_original_training_events_sha256"],("ORIGINAL_SOURCE_DRIFT",family)
                  assert a["original_public_source_training_tensors"]==x["original_public_source_training_tensors"],("PUBLIC_TARGET_INPUT_DRIFT",family)
                  assert a["original_initial_45_parameter_snapshot_sha256"]==x["original_initial_45_parameter_snapshot_sha256"],("INITIAL_NATIVE_WEIGHTS_DRIFT",family)
              aa,bb,cc,dd=[x["original_first_11_updates_and_coordinates"] for x in (a,b,c,d)]
              same_os={"linux":aa==bb,"windows":cc==dd}
              first_gradient=None
              for k in range(11):
                  left,right=aa[k],cc[k]
                  if left["original_45_pregradient_weight_sha256"]!=right["original_45_pregradient_weight_sha256"]:
                      first_gradient={"classification":"PREVIOUS_WEIGHT_DIVERGENCE","original_update":k+1}
                      break
                  if (left["original_analytic_gradient_shared_sha256"]!=right["original_analytic_gradient_shared_sha256"]
                      or left["original_analytic_gradient_local_sha256"]!=right["original_analytic_gradient_local_sha256"]):
                      l=left["chronological_original_forward_reverse_gradient_stages"]
                      w=right["chronological_original_forward_reverse_gradient_stages"]
                      assert len(l)==len(w),("SOURCE_STEPS_DRIFT",family,k)
                      first_gradient={
                          "classification":"GRADIENT_DIFF_FROM_IDENTICAL_PREWEIGHTS",
                          "original_update":k+1,
                          "first_forward_coordinate":first_diff(l,w,forward,range(len(l))),
                          "first_backward_coordinate":first_diff(l,w,backward,range(len(l)-1,-1,-1)),
                          "candidate_cpu_kernel_unproven":True
                      }
                      break
              out[family]={
                  "same_OS_original_coordinate_repeats_identical":same_os,
                  "first_original_crossOS_difference":first_gradient,
                  "source_public_identity_exact":True,
                  "scientific_admission":"NO_GO"
              }
          print("MR34I3_ORIGINAL_TRAIN_ONLY_COORDINATE_COMPARISON="+json.dumps(out,sort_keys=True))
          print("MR34I3_ORIGINAL_SCIENTIFIC_FIRST_USE=ZERO")
          assert all(x["same_OS_original_coordinate_repeats_identical"]["linux"]
                     for x in out.values()),"SAME_OS_LINUX_NATIVE_GRADIENT_DRIFT"
          # Same-OS Windows variability is preserved as a negative, never concealed.
          PY
