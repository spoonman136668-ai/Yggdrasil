name: ITD-02 V31E public observation sufficiency
on:
  push:
    branches: [research/itd02-v31e-observation-sufficiency-20261028]
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify prereg and immutable native source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f64ba4ca924d1da2262e568258df94428f1e6507 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Compare legal selected reward versus privileged full outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31e"
          PYTHONPATH=. python -B research/itd02_v31e_observation_sufficiency_audit.py > "$RUNNER_TEMP/v31e/report.json"
          python - "$RUNNER_TEMP/v31e/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["streams"]==7 and not d["heldout_evaluated"]
          assert not d["scientific_first_use"]
          assert d["privileged_unselected_reward_values_withheld"]==2*d["actual_selected_reward_observations"]
          assert len(d["canonical_public_history_sha256"])==64
          print("V31E_SOURCE_ONLY_INFORMATION_DIAGNOSTIC_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v31e/report.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain bounded witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31e-${{ matrix.os }}
          path: ${{ runner.temp }}/v31e/*
          retention-days: 7
          if-no-files-found: warn
