name: DG1-MD26 learned intervention site toy prefirstuse qualification
on:
  push:
    branches: [research/dg1-md26-paid-action-identifiability-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md26-20261114/**'
      - '.github/workflows/dg1-md26-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  toy-only:
    name: MD26 toy-only and exact-source inherited regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact MD26 parent, prereg ancestry, and unchanged MD24 negative
        shell: bash
        run: |
          test "$(git rev-parse 4c4d34f305278fde8132a7be35ecba1ba9baee0d^)" = "563c805f8841e39a8363d76019e86996b611ae14"
          git merge-base --is-ancestor 4c4d34f305278fde8132a7be35ecba1ba9baee0d HEAD
          git diff --exit-code 563c805f8841e39a8363d76019e86996b611ae14 HEAD -- \
            research/contrib/chatgpt/dg1-md25-20261114/ \
            research/contrib/chatgpt/dg1-md24-20261114/ \
            research/contrib/chatgpt/dg1-md23-20261114/ \
            .github/workflows/dg1-md24-qualification.yml
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("research/contrib/chatgpt/dg1-md26-20261114/prereg.json").read_text())
          assert p["experiment_id"]=="DG1-MD26-20261114"
          assert p["status"]=="PREREGISTRATION_ONLY_NO_PRIMARY_SEEDS_CONSUMED"
          assert p["parent_SHA"]=="563c805f8841e39a8363d76019e86996b611ae14"
          print("MD26_PRE_FIRSTUSE_FROZEN_CUSTODY_PASS")
          PY
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install pinned public CPU dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
          python -m pip freeze > md26-packages.txt
          python - <<'PY'
          from importlib.metadata import version
          for name,v in (("minigrid","3.2.0"),("gymnasium","1.4.0"),("numpy","2.3.4")):
              assert version(name)==v
          print("MD26_PINNED_CPU_DEPENDENCIES_PASS")
          PY
      - name: MD26 only registered-seed-forbidden physical toy and negative controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md26-20261114/md26.py research/contrib/chatgpt/dg1-md26-20261114/test_md26.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md26-20261114 -p 'test_md26.py' -v
      - name: Independent source-indexed G29 generation or check
        id: atlas
        shell: bash
        run: |
          python - <<'PY'
          import base64,os,subprocess
          from pathlib import Path
          names=(".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice")
          def git(*args):
              return subprocess.check_output(("git",)+args,text=True).strip()
          head=git("rev-parse","HEAD")
          changed=set(git("diff","--name-only","HEAD^","HEAD").splitlines())
          derived=changed==set(names)
          source=git("rev-parse","HEAD^") if derived else head
          subprocess.run(("python","scripts/build_code_atlas.py",
                          "--source-commit",source,"--write"),check=True)
          committed=derived and all(subprocess.check_output(
              ("git","show","HEAD:"+p))==Path(p).read_bytes() for p in names)
          if not committed and os.environ.get("RUNNER_OS")=="Linux":
              for p in names:
                  value=base64.b64encode(Path(p).read_bytes()).decode("ascii")
                  chunks=[value[i:i+1200] for i in range(0,len(value),1200)]
                  for i,c in enumerate(chunks):
                      print("MD26_ATLAS_B64|"+p+"|"+str(i)+"|"+
                            str(len(chunks))+"|"+c,flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("committed="+str(committed).lower()+"\n")
              f.write("source="+source+"\n")
          print("MD26_G29_SOURCE:"+source)
          print("MD26_G29_COMMITTED:"+str(committed))
          PY
      - name: Mandatory complete inherited regression on committed candidate source
        if: steps.atlas.outputs.committed == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check
          git diff --exit-code -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
      - name: Source-only preflight must generate atlas and nothing else
        if: steps.atlas.outputs.committed != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          modified=set(subprocess.check_output(("git","diff","--name-only"),text=True).splitlines())
          allowed={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"}
          assert modified==allowed,sorted(modified)
          print("MD26_PREFIRSTUSE_TOY_ONLY_PASS_PENDING_PINNED_G29_ATLAS")
          PY
      - name: Preserve only toy software environment receipt in GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-md26-toy-${{ matrix.os }}
          path: md26-packages.txt
          if-no-files-found: ignore
