name: ITD02 R7 authentic-authored historical action learning comparator
on:
  push:
    branches: [research/itd02-r7-independent-causal-parity-20261025]
    paths:
      - "research/native/itd02/r7/independent_parity/**"
      - ".github/workflows/itd02-r7-parity-study.yml"
permissions:
  contents: read
jobs:
  frozen-independent-learning:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 17
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify protocol predates code, run real R7 fit and independent trained controls
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 77cd8d7854ff12dad95cfee8b3bdddc074ad271d "$GITHUB_SHA"
          python -B research/native/itd02/r7/independent_parity/run.py --out "$RUNNER_TEMP/r7-parity.json"
          python -B -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["FIT_public_observations"]==1152 and r["never_seen_multi_action_queries"]==256 and r["native_vs_equal_information_exhaustive_conventional_multi_action_disagreements"]==0 and r["FORGE_FSA_first_use"]=="DENIED"' "$RUNNER_TEMP/r7-parity.json"
          git diff --exit-code
          echo R7_INDEPENDENT_DEV_FIT_AND_NATIVE_PARITY_EVIDENCE=PASS
      - name: Preserve complete scientific development record in provider
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r7-matched-dev-parity-${{ matrix.os }}
          path: ${{ runner.temp }}/r7-parity.json
          retention-days: 30
