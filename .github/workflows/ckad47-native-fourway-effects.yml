name: CKAD47 native four-way causal composition DEV only
on:
  push:
    branches:
      - research/ckad47-native-fourway-compositional-effects-20261119
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  fourway:
    if: "github.event.head_commit.message == 'ci(ckad47): frozen fourway source qualification'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable cross-platform checkout rewriting
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source/prereg, no held first-use, syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b0d71e48848a92d10ed78019d40dffb7af0f505c HEAD
          git merge-base --is-ancestor 754e7fd1daf4e99f4949fa649eccd26863622a7b HEAD
          test ! -e research/contrib/chatgpt/CKAD-47/pilot_report.json
          test ! -e research/contrib/chatgpt/CKAD-47/primary_report.json
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-47'); [ast.parse(f.read_text()) for f in p.glob('*.py')]"
          python -B research/contrib/chatgpt/CKAD-47/campaign.py --mode preflight
      - name: Eight source-only fixtures, including non-XOR negative
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-47 -p test_ckad47.py -v
      - name: One frozen two-seed DEV qualification; no pilot/primary
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-47/screen_dev.py
          test -z "$(git status --porcelain)"
