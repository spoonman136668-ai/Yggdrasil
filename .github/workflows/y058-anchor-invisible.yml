name: Yggdrasil Y058 anchor-invisible nonaffine shocks
on:
  push:
    branches: [research/y058-anchor-invisible-permutation-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed exact scientific source identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0cf8678669c6b1bcd3ae80c1c7ccf623b8835d18 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y053-schedule-hedge/execute.py)" = b0f6559626c88aaa1e8f7e2298ee27b12ccafe22
          test "$(git hash-object research/contrib/chatgpt/20261013-y057-magnitude-transfer/execute.py)" = 1929d2fefe274fb0e04df843f01beaf9e89e1809
          test "$(git hash-object research/contrib/chatgpt/20261013-y058-anchor-blind/prereg.json)" = 49b049ac6fc23832c46de2ce8bc4d66aad2b377d
          test "$(git hash-object research/contrib/chatgpt/20261013-y058-anchor-blind/execute.py)" = 7b125f7df582eb965cf017ec3552bdf91c587954
          python3 -m json.tool research/contrib/chatgpt/20261013-y058-anchor-blind/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y058-anchor-blind/execute.py
      - name: Original first-use anchor-invisible nonaffine evidence
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y058-anchor-blind/execute.py > /tmp/Y058-original.json
          python3 -m json.tool /tmp/Y058-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y058-original.json'))
          assert x['development_seeds']==list(range(2800,2808))
          assert x['sealed_heldout_seeds']==list(range(2808,2824))
          assert len(x['anchor_invisible_conditions'])==2
          assert all(len(row['by_family_seed_policy'])==3*4*16*3
                     for row in x['anchor_invisible_conditions'].values())
          print('CLASSIFICATION',x['classification'])
          for arm,row in x['anchor_invisible_conditions'].items():
              print('SWAP',arm,'ANCHOR_READ_CHECKS',row['public_anchor_reads_checked'])
              print('SHOCK_ERRORS',arm,row['postshock_mismatches'])
              print('RESET_COUNTS',arm,row['reset_counts_by_regime'])
              print('ORIGINAL_Y053_RUBRIC',arm,row['original_y053_rubric_label_for_this_condition'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y058-original-anchor-invisible-nonaffine
          path: /tmp/Y058-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One required full Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
