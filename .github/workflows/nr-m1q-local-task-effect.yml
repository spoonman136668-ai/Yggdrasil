name: NR-M1Q Native Local-Cell Selected Task-Effect Qualification
on:
  pull_request:
    paths:
      - 'research/native/itd02/mg40/**'
      - '.github/workflows/nr-m1q-local-task-effect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-task:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test source-only native task cells
        run: python -m unittest discover -s research/native/itd02/mg40 -p 'test_*.py' -v
      - name: Compile local-cell task implementation
        run: python -m compileall -q research/native/itd02/mg40
      - name: Verify no tracked source mutations
        run: git diff --exit-code
