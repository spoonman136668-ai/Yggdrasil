name: Yggdrasil Y-F23 sparse corrupted known-anchor sensor calibration
on:
  push:
    branches: [research/y-f23-sparse-contaminated-calibration-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install project scientific dependencies
        run: python3 -m pip install -e '.[test]'
      - name: Check frozen Y-F22 source and prospective Y-F23 protocol
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 13a7bb1c0491ee2a8124cd2dee162670515dd11e HEAD
          test "$(git hash-object research/foundational/20261015-y-f22/execute.py)" = "$(git rev-parse 13a7bb1c0491ee2a8124cd2dee162670515dd11e:research/foundational/20261015-y-f22/execute.py)"
          python3 -m py_compile research/foundational/20261015-y-f23/execute.py
          python3 -m json.tool research/foundational/20261015-y-f23/prereg.json >/dev/null
      - name: Run one original sparse poisoned calibration development cohort
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -B research/foundational/20261015-y-f23/execute.py > /tmp/y-f23-original.json
          python3 -m json.tool /tmp/y-f23-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F23-original-sparse-poisoned-known-anchors
          path: /tmp/y-f23-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Independently audit evidence and all test outcomes
        run: |
          python3 - <<'PY'
          import collections,json
          d=json.load(open('/tmp/y-f23-original.json'))
          assert d["stage"]=="DEVELOPMENT_ONLY"
          assert d["new_trainable_parameters"]==9
          assert d["train_only_examples"]==2400
          assert d["known_anchor_labels_supervised"] and d["anchor_mean_and_median_programmed"]
          assert not d["test_role_truth_given_to_candidate"] and not d["test_sensor_shift_label_given_to_candidate"]
          assert d["resident_state_bytes"]==576 and d["base_graphs"]==48
          assert d["condition_groups"]==576 and d["questions"]==1728
          assert not d["source_independently_born"] and not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert collections.Counter(r["sensor_shift"] for r in d["rows"])==dict.fromkeys(d["new_test_shifts"],288)
          assert collections.Counter(r["anchor_count"] for r in d["rows"])=={2:192,6:192,12:192}
          assert d["scores"]["descriptor_oracle"]["correct"]==1728
          for key in ("learned","fixed_robust","prior_y22","descriptor_oracle"):
            s=d["scores"][key]
            assert s["correct"]==sum(sum(p==t for p,t in zip(r["answers"][key],r["truth"])) for r in d["rows"])
            assert s["false_positive"]==sum(r["answers"][key][i] for r in d["rows"] for i in (1,2))
            assert s["false_negative"]==sum(not r["answers"][key][0] for r in d["rows"])
          assert d["registered_verdict"] in ("INVALID_SPARSE_ANCHOR_REFERENCE",
            "DEVELOPMENT_LEARNED_SPARSE_POISONED_ANCHOR_TRANSFER",
            "DEVELOPMENT_SPARSE_POISONED_ANCHOR_ROBUSTNESS_NEGATIVE")
          print("Y_F23_VERDICT",d["registered_verdict"])
          print("Y_F23_SCORES",d["scores"])
          PY
      - name: One complete repository regression
        run: python3 -m pytest -q tests
