name: ITD-02 V18 nonlinear relay-plasticity source-only qualification
on:
  push:
    branches:
      - research/itd02-v18-intermediate-plasticity-nonlinear-control-20261028
permissions:
  contents: read
jobs:
  v18-source-only-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Freeze cross-platform source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout immutable commit, no stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source, chronology, no original model mutation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ac0ca844ebb9b2b65a3a0a67e9e6f6a7bd227919 "$GITHUB_SHA"
          git merge-base --is-ancestor 46d815d78cf6f70cc85a9b1bb19ba3ce20164eeb "$GITHUB_SHA"
          git merge-base --is-ancestor b149f86f21ed76c6b47bbee36fa6ea98f7c92577 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v17_neighbor_carried_learner_dev.py)" = 4e3c77797e66df3a26742d23d18f038644891e55
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Focused V18 local plasticity safety and checkpoint tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v18"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v18_intermediate_plasticity_dev.py' -v > "$RUNNER_TEMP/v18/focused.log" 2>&1
          cat "$RUNNER_TEMP/v18/focused.log"
          echo "ITD02_V18_FOCUSED_INTEGRITY_PASS_NO_SCIENCE"
      - name: Frozen non-additive / additive 36-fold control experiment
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v18_intermediate_plasticity_audit.py > "$RUNNER_TEMP/v18/audit.json"
          python - "$RUNNER_TEMP/v18/audit.json" <<'PY'
          import json, math, sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["schema"]=="ygg.itd02.v18.nonlinear_plasticity_falsification.source_only.v1"
          assert x["source_only"] and not x["scientific_first_use"] and not x["original_world_training"]
          assert not x["native_model_modified"] and not x["original_memory_modified"]
          assert x["public_histories"]==36 and x["heldout_folds_per_family"]==36
          assert x["matched_training_samples_per_fold"]==560
          assert x["source_native_ring_cells"]==8 and x["local_tag_channels"]==7
          assert x["candidate_total_learned_scalars"]==116
          assert x["candidate_plastic_intermediate_gains"]==56
          assert x["candidate_learned_reward_head_scalars"]==60
          assert x["intermediate_cells_changed_nonlinear"]>0
          assert x["nonlinear_gain_ablation_prediction_changes"]>0
          assert x["max_checkpoint_bytes"]<=8192
          assert x["total_forward_edge_messages"]>0 and x["total_reverse_credit_messages"]>0
          for family in ("additive_errors","nonlinear_errors"):
              assert set(x[family])=={"candidate","frozen_intermediate","v17_additive","conventional_interaction","same_weights_initial_gain_ablation"}
              assert all(math.isfinite(v) and v>=0 for v in x[family].values())
          allowed={
              "V18_NO_INTERMEDIATE_PLASTICITY_BENEFIT__NO_SCIENCE",
              "V18_INTERMEDIATE_PLASTICITY_BENEFIT_BUT_CONTROL_NOT_BEATEN__NO_SCIENCE",
              "V18_SYNTHETIC_LOCAL_PLASTICITY_CANDIDATE__NO_SCIENCE"
          }
          assert x["classification"] in allowed
          print("ITD02_V18_NONLINEAR_MATCHED_CONTROLS_COMPLETED_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v18/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: One inherited V17 V16 V15 original-native regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v17_neighbor_carried_learner_dev.py' -v
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v18/inherited-v16.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ITD02_V18_FINAL_V17_V16_V15_V12_REGRESSION_PASS_NO_SCIENCE"
      - name: Preserve exact-host V18 read-only audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v18-nonlinear-plasticity-${{ matrix.os }}
          path: ${{ runner.temp }}/v18/*
          if-no-files-found: warn
          retention-days: 7
