name: Yggdrasil F68 context-action source preflight
on:
  push:
    branches:
      - research/y-f68-context-action-junction-precode-20261016-r1
permissions:
  contents: read
jobs:
  frozen-synthetic-source:
    if: "${{ github.event.head_commit.message == 'ci(y-f68): qualify causal action-conditioned source and single full regression' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin prereg source and original independent auditor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2341399bf9bcf28ef40f05172ffe2baf78e71fae HEAD
          test "$(git hash-object research/foundational/20261016-y-f68/prereg.json)" = d6bb9395bce54562bb89bfb07dcb445a9996123a
          test "$(git hash-object research/foundational/20261016-y-f68/action_conditioned.py)" = 3ed920a1caa2ab547bf4c15dfe653987829cf862
          test "$(git hash-object research/foundational/20261015-y-f62/audit_public.py)" = 383fff0bdd8c8b48fde9538d4e4d768db1c1896f
      - name: Verify causal and genuinely action-conditioned public junctions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f68-source/"
          python3 -B research/foundational/20261016-y-f68/action_conditioned.py --synthetic-only > "$RUNNER_TEMP/f68-source/synthetic.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f68-source/synthetic.json" >/dev/null
          python3 -B -c 'import os,json;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f68-source/synthetic.json")));print("F68_SOURCE_ACTION_INTERACTIONS",d["totals"]);assert d["totals"]["feature_interaction_choice_points"]>0 and d["causal_prefix_audit_pass"] and not d["registered_fit_used"]'
          sha256sum "$RUNNER_TEMP/f68-source/synthetic.json" > "$RUNNER_TEMP/f68-source/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f68-source/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f68-causal-interaction-synthetic-source
          path: ${{ runner.temp }}/f68-source/
          retention-days: 90
          if-no-files-found: warn
  full-regression:
    needs: frozen-synthetic-source
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted dependencies
        run: |
          python -m pip install pytest pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: One full repository regression
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f68-regression/"
          test "$(git hash-object research/foundational/20261016-y-f68/action_conditioned.py)" = 3ed920a1caa2ab547bf4c15dfe653987829cf862
          python -B -m pytest -q > "$RUNNER_TEMP/f68-regression/regression.txt" 2>&1
          cat "$RUNNER_TEMP/f68-regression/regression.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f68-regression/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f68-once-full-regression
          path: ${{ runner.temp }}/f68-regression/
          retention-days: 90
          if-no-files-found: warn
