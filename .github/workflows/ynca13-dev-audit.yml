name: YNCA-13 source-free bounded development
on:
  pull_request:
    paths:
      - "research/contrib/chatgpt/YNCA-13/**"
      - ".github/workflows/ynca13-dev-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Preserve Git blob checkout bytes on all platforms
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Git blob and frozen source bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess
          p=Path("research/contrib/chatgpt/YNCA-13/experiment.py")
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          blob=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          assert sha=="9d69a736171cb15a6d7fc6f86b9ff094c463b27275efe1cccc80c1988f661cd8",sha
          assert blob=="b17d9bd190c84fbcbfa67c10f876f0c757aa6f55",blob
          print("YNCA13_FROZEN_SOURCE_PASS sha256="+sha)
      - name: Exact frozen source compile
        run: python -B -m py_compile research/contrib/chatgpt/YNCA-13/experiment.py
      - name: Bounded synthetic development evaluation
        run: python -B research/contrib/chatgpt/YNCA-13/experiment.py --output research/contrib/chatgpt/YNCA-13/run-result.json
      - name: Repeat score, compare frozen committed evidence, canonicalize output bytes
        shell: python
        run: |
          import hashlib,json
          from pathlib import Path
          import subprocess,sys
          p=Path("research/contrib/chatgpt/YNCA-13/run-result.json")
          frozen=Path("research/contrib/chatgpt/YNCA-13/result.json").read_bytes()
          first=p.read_bytes()
          subprocess.run([sys.executable, "-B", "research/contrib/chatgpt/YNCA-13/experiment.py", "--output",str(p)],check=True, capture_output=True)
          assert p.read_bytes()==first, "non-deterministic source-local outcome"
          assert first.replace(b"\r\n",b"\n")==frozen, "output differs from frozen primary after newline normalization"
          assert hashlib.sha256(frozen).hexdigest()=="67f52eaa37b8ea123f0cbafe6e781d44dfaacc9bbe909f42a3a6fde8ecd7a823"
          data=json.loads(frozen)
          assert data["source_sha256"]=="9d69a736171cb15a6d7fc6f86b9ff094c463b27275efe1cccc80c1988f661cd8"
          assert data["native_yggdrasil_trained"] is False
          assert data["scientific_pass"] is False
          assert data["protected_first_use"] is False
          assert data["training_worlds"]==32
          assert data["evaluation_worlds_per_seed"]==200
          p.write_bytes(frozen)
          print("YNCA13_DEV_AUDIT_PASS source_sha256="+data["source_sha256"])
          print("YNCA13_FROZEN_RESULT_PASS sha256="+hashlib.sha256(p.read_bytes()).hexdigest())
          print("YNCA13_DEV_DISPOSITION="+data["verdict"])
      - uses: actions/upload-artifact@v4
        with:
          name: ynca13-dev-${{ matrix.os }}
          path: research/contrib/chatgpt/YNCA-13/run-result.json
          if-no-files-found: error
          retention-days: 30
