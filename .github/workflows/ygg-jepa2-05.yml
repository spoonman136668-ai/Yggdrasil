name: YGG-JEPA2-05 source-only dual-OS preflight
'on':
  push:
    branches:
      - research/ygg-jepa2-05-memory-rehearsal-20261119
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Disable checkout line-ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630cee73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numeric dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Verify frozen original source and focused tests without training
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code d0fa25aad2c6dc270eb0f863b6e93cbb89092f23 HEAD -- research/contrib/chatgpt/YGG-JEPA2-05/prereg.json
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-05/source.py)" = ee809ef04859d94f7e96f50d757635b6827d1f7c
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/YGG-JEPA2-05/campaign.py --help
          python -B research/contrib/chatgpt/YGG-JEPA2-05/audit.py --help
          test -z "$(git status --porcelain)"
