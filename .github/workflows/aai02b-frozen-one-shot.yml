name: AAI-02B isolated frozen one-shot science (no promotion)
on:
  push:
    branches:
      - research/aai02b-learned-association-values-20261114
    paths:
      - .github/workflows/aai02b-frozen-one-shot.yml
permissions:
  contents: read
jobs:
  frozen-evaluation:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-02B one-shot source evaluation workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen prereg, source, scope and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '6dc2ae482c83f29c0a9269496fa5191142ef0350'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-02B/prereg.json)" = "$(git rev-parse 32f4b7f3c05bf29533b1e571270c8df4f820de08:research/contrib/chatgpt/AAI-02B/prereg.json)"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai02b-frozen-one-shot.yml'
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-02B/run.py)" = "$(git rev-parse '6dc2ae482c83f29c0a9269496fa5191142ef0350:research/contrib/chatgpt/AAI-02B/run.py')"
          echo AAI02B_FROZEN_SOURCE_CUSTODY=PASS
      - name: Primary frozen science execution once
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-02B/run.py > "$RUNNER_TEMP/aai02b.result.json"
          python - "$RUNNER_TEMP/aai02b.result.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['prereg_commit']=='32f4b7f3c05bf29533b1e571270c8df4f820de08'
          assert x['integration']=='NONE'
          print('AAI02B_RESULT_JSON_COMPACT='+json.dumps(x,sort_keys=True,separators=(',',':')))
          PY
          echo AAI02B_PRIMARY_RESULT_CAPTURED=PASS
      - name: Frozen focused engineering tests after primary result
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-02B -p 'test_aai02b.py' -v
          git diff --exit-code
          echo AAI02B_ENGINEERING_FOCUSED=PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aai02b-frozen-primary-result
          path: ${{ runner.temp }}/aai02b.result.json
          if-no-files-found: warn
          retention-days: 7

  pinned-atlas-refresh:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-02B generated atlas one-shot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-source guarded generated-only atlas companion
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai02b-frozen-one-shot.yml'
          git merge-base --is-ancestor 32f4b7f3c05bf29533b1e571270c8df4f820de08 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-02B/run.py)" = "$(git rev-parse 6dc2ae482c83f29c0a9269496fa5191142ef0350:research/contrib/chatgpt/AAI-02B/run.py)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-02B/prereg.json)" = "$(git rev-parse 32f4b7f3c05bf29533b1e571270c8df4f820de08:research/contrib/chatgpt/AAI-02B/prereg.json)"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          mapfile -t allowed < <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          test "${changed[*]}" = "${allowed[*]}"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-02B generated G29 source atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch origin research/aai02b-learned-association-values-20261114
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai02b-learned-association-values-20261114
          echo AAI02B_G29_GENERATED_ARTIFACT_ONLY=PASS
