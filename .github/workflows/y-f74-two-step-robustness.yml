name: Yggdrasil F74 capped two-step arrival robustness
on:
  push:
    branches:
      - research/y-f74-two-step-arrival-reachability-20261016-r1
permissions:
  contents: read
jobs:
  independent-bounded-oracle:
    if: "${{ github.event.head_commit.message == 'ci(y-f74): execute capped two-action causal rescue without protected data' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin immutable original source and all diagnostic limits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1e5fe2c348076717b19380871088e1a95946681a HEAD
          test "$(git hash-object research/foundational/20261016-y-f74/prereg.json)" = d96ad126e109a1eab7dfbf1dda522ae1ee08014a
          test "$(git hash-object research/foundational/20261016-y-f74/two_step_oracle.py)" = d09ccec22ce80e5512771fd0e9b77c945397cf62
          test "$(git hash-object research/foundational/20261016-y-f73/arrival_oracle.py)" = f7bac62e00b52273ef7fa89889d5f018f591d307
          test "$(git hash-object research/foundational/20261015-y-f62/audit_public.py)" = 383fff0bdd8c8b48fde9538d4e4d768db1c1896f
      - name: Execute frozen synthetic one- and capped two-action reachability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f74-bounded-reachability"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f74-bounded-reachability/exact-head.txt"
          python3 -B research/foundational/20261016-y-f74/two_step_oracle.py --synthetic-only > "$RUNNER_TEMP/y-f74-bounded-reachability/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f74-bounded-reachability/result.json" >/dev/null
          python3 -B -c 'import os,json;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f74-bounded-reachability/result.json")));print("F74_TWO_STEP_BY_ORDER",d["grouped"]);assert d["no_unsupported_infeasibility_claims"] and d["pair_cap_per_case"]==2048 and not d["registered_train_used"] and not d["validation_used"]'
          sha256sum "$RUNNER_TEMP/y-f74-bounded-reachability/result.json" > "$RUNNER_TEMP/y-f74-bounded-reachability/sha256.txt"
          echo 'F74_UNFAIR_ORACLE_IS_NONCOMPETITIVE=TRUE'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f74-capped-two-step-arrival-reachability
          path: ${{ runner.temp }}/y-f74-bounded-reachability/
          retention-days: 90
          if-no-files-found: warn
