name: WSP98 development fixtures only (no original first use)
on:
  push:
    branches: [research/wsp98-unknown-causal-program-20261114]
permissions:
  contents: read
jobs:
  fixture-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact ref and frozen prereg
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor eee67aee99ae074b45cdf56b94ce1a133151d808 HEAD
          test -f research/contrib/chatgpt/WSP-98/prereg.json
          test -f research/contrib/chatgpt/WSP-98/PUBLIC_PASS.json
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          test -z "$(git status --porcelain)"
      - name: Source-blind synthetic fixture tests (no public or reserved worlds)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-98 -p 'test_*.py' -v
      - name: Preserve clean exact checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  public-first-use:
    needs: [fixture-qualification]
    if: "github.event.head_commit.message == 'ci(wsp98): original public first-use' && github.run_attempt == 1 && needs.fixture-qualification.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    concurrency:
      group: wsp98-first-use-public-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck exact original prereg, isolated source and one-shot public boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor eee67aee99ae074b45cdf56b94ce1a133151d808 HEAD
          test ! -f research/contrib/chatgpt/WSP-98/PUBLIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Original PUBLIC 20 worlds only - preserve scientific negatives
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python research/contrib/chatgpt/WSP-98/experiment.py --public-only
      - name: Source remains unchanged after first-use
        shell: bash
        run: test -z "$(git status --porcelain)"

  g29-source-reanchor:
    needs: [fixture-qualification]
    if: "github.event.head_commit.message == 'ci(wsp98): source-pin G29 atlas' && github.run_attempt == 1 && needs.fixture-qualification.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp98-one-shot-source-pinned-g29
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-pinned G29 only after independently verified original public admission
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor eee67aee99ae074b45cdf56b94ce1a133151d808 "$A"
          git merge-base --is-ancestor 22da8ab85e4a4c5ee05ef03c2e56d704b4e5e4d0 "$A"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          git diff --exit-code 22da8ab85e4a4c5ee05ef03c2e56d704b4e5e4d0 "$A" -- research/contrib/chatgpt/WSP-98/core.py research/contrib/chatgpt/WSP-98/controls.py research/contrib/chatgpt/WSP-98/experiment.py
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp98): pin G29 source atlas at $A"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "3"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp98-unknown-causal-program-20261114
          echo "WSP98_G29_SOURCE=$A"
          echo "WSP98_G29_COMPANION=$B"

  final-regression:
    needs: [fixture-qualification]
    if: "github.event.head_commit.message == 'ci(wsp98): exact-tree final dual-platform qualification' && github.run_attempt == 1 && needs.fixture-qualification.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze exact public source, preserved first-use and current atlas
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor eee67aee99ae074b45cdf56b94ce1a133151d808 HEAD
          git merge-base --is-ancestor 22da8ab85e4a4c5ee05ef03c2e56d704b4e5e4d0 HEAD
          git diff --exit-code 22da8ab85e4a4c5ee05ef03c2e56d704b4e5e4d0 HEAD -- research/contrib/chatgpt/WSP-98/core.py research/contrib/chatgpt/WSP-98/controls.py research/contrib/chatgpt/WSP-98/experiment.py
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: Original PUBLIC receipts, independent controls and fixture-only focused tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-98 -p 'test_*.py' -v
      - name: Mandatory inherited WSP80-WSP97 complete focused regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          for n in 80 81 82 83 84 85 86 87 88 89 90 91 92 93 94 95 96 97; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory complete Yggdrasil root regression on exact source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pinned G29 atlas, exact source and clean worktree post-regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
