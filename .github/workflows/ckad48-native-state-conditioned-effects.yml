name: CKAD48 native state-dependent effects DEV only
on:
  push:
    branches:
      - research/ckad48-native-state-conditioned-effects-20261119
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  qualify:
    if: "github.event.head_commit.message == 'ci(ckad48): frozen two-OS state-dependent source DEV qualification'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Prevent checkout line-ending rewrite
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source SHA and frozen pre-code protocol
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor dba16e4e3a1c7f51ea18b45b15da84761de9e5ba HEAD
          git merge-base --is-ancestor a29b6e668fe1435bd9345664d5b9d2db87b46b7a HEAD
          test ! -e research/contrib/chatgpt/CKAD-48/pilot_report.json
          test ! -e research/contrib/chatgpt/CKAD-48/primary_report.json
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-48'); [ast.parse(f.read_text()) for f in p.glob('*.py')]"
          python -B research/contrib/chatgpt/CKAD-48/campaign.py --mode preflight
      - name: Fixture-only source/cold/negative tests; no DEV scoring
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-48 -p test_ckad48.py -v
      - name: One frozen new DEV cohort, never held pilot or primary
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-48/screen_dev.py
          test -z "$(git status --porcelain)"
