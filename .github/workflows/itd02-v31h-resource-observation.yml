name: ITD-02 V31H frozen resource observation
on:
  push:
    branches: [research/itd02-v31h-resource-regression-20261028]
permissions:
  contents: read
jobs:
  resource:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg and native exact sources
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f5f251698ac5a6c0db190a1edc76cac0634bddc0 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Host-local resource records and focused regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31h"
          PYTHONPATH=. python -B research/itd02_v31h_resource_observation.py > "$RUNNER_TEMP/v31h/resources.json"
          python - "$RUNNER_TEMP/v31h/resources.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d["records"])==12
          assert d["edge_message_count"]=="not_measured"
          assert d["opt_in_selector_checkpoint_cold_restore"]=="not_implemented"
          assert not d["holdout_evaluated"] and not d["scientific_first_use"]
          assert all(x["python_peak_traced_bytes"]>0 and x["elapsed_ns"]>0 for x in d["records"])
          print("V31H_RESOURCES_OBSERVED_NOT_SCIENCE")
          PY
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain per-host measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31h-resources-${{ matrix.os }}
          path: ${{ runner.temp }}/v31h/*
          retention-days: 7
          if-no-files-found: warn
