name: Yggdrasil Y036 frozen hidden-group research
on:
  push:
    branches: [research/chatgpt-y036-hidden-group-20261013]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact immutable parent/prereg/source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6afdac319b0b1f2dfddcea2baa84c2ca7472234c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-hidden-subgroup/prereg.json)" = 5b8a0455993a139685abd93d34e90bcf9d912286
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-hidden-subgroup/execute.py)" = bf307ce41e5124951a52dc18a1a619e986492ddb
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-hidden-subgroup/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-hidden-subgroup/execute.py
      - name: Original frozen Y036 hidden-group science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-hidden-subgroup/execute.py > /tmp/Y036-original.json
          python3 -m json.tool /tmp/Y036-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original-hidden-group
          path: /tmp/Y036-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
