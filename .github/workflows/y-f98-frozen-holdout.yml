name: Yggdrasil F98 frozen paired microchain holdout
on:
  push:
    branches:
      - research/y-f98-selfsupervised-microchain-20261016-r1
    paths:
      - 'research/foundational/20261016-y-f98/holdout.py'
      - '.github/workflows/y-f98-frozen-holdout.yml'
permissions:
  contents: read
jobs:
  frozen-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pre-data source code and grammar weights frozen separately before first use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 582ab0b9493f9dccecdb4dc3aed50705b7182716 HEAD
          test "$(git hash-object research/foundational/20261016-y-f98/prereg.json)" = 7288b566b6c5d80690ef2c1bb5021d7d78d4530a
          test "$(git hash-object research/foundational/20261016-y-f98/microchain.py)" = 4a03573c31d24decd9a058c4930a8e9a6fbc1f3f
          test "$(git hash-object research/foundational/20261016-y-f98/frozen-grammar.json)" = 67ae62a79cbba0d7287bc324e6df32a5277faccb
          test "$(git hash-object research/foundational/20261016-y-f97/paired_join_risk.py)" = d100ee3c329e648752647872e16473e9fe281963
          test "$(git hash-object research/foundational/20261016-y-f76/source.py)" = 5b8928b0399ce9f869854beadeab04b29c8703a5
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
          test "$(git hash-object research/foundational/20261016-y-f85/global_solver.py)" = e4eb4bfbd6a01212f8c1eebc38af09b15c6d9cc3
      - name: No-cohort policy source tests and frozen prior regressions
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s research/foundational/20261016-y-f98 -p test_microchain.py
          python3 -B -m unittest discover -v -s research/foundational/20261016-y-f97 -p test_paired_join_risk.py
      - name: Immutable first-time validation, no training allowed
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261016-y-f98/holdout.py --frozen-validation > "$RUNNER_TEMP/f98-validation.json"
          python3 -B -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f98-validation.json"))); assert r["stage"]=="FROZEN_VALIDATION_ONLY" and r["order_episodes"]==32 and r["paired_graphs"]==16 and r["six_step_episodes"]==8; assert r["exact_native_72_prefix_audit_passed"] and r["F85_solver_no_resource_caps"] and r["retained_memory_max_bytes"]<=144 and r["extra_frozen_model_bytes"]==32 and r["extra_latch_bits"]==2 and r["no_model_selection_or_refit"]; print(json.dumps({k:r[k] for k in ("stage","classification","order_episodes","scores","native_deviations","gross_microchain_bigram_gain","six_step_rescues","four_step_regressions","by_arrival_and_question_type")},sort_keys=True))'
      - name: First-use reserved disjoint matched-graph guard; preserve all outcomes
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261016-y-f98/holdout.py --frozen-guard > "$RUNNER_TEMP/f98-guard.json"
          python3 -B -c 'import json,os; r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f98-guard.json"))); assert r["stage"]=="FIRST_USE_SEALED_SYNTHETIC_GUARD" and r["order_episodes"]==64 and r["paired_graphs"]==32 and r["six_step_episodes"]==16; assert r["exact_native_72_prefix_audit_passed"] and r["paired_graph_same_edges_and_answer"] and r["F85_solver_no_resource_caps"] and r["retained_memory_max_bytes"]<=144 and r["extra_frozen_model_bytes"]==32 and r["extra_latch_bits"]==2 and r["no_model_selection_or_refit"] and r["no_future_question_leakage_into_online"]; assert not r["FIT_used"] and not r["DIAG_used"] and not r["ORIGINAL_used"] and not r["F3_used"] and not r["independent_science_accepted"] and not r["optimizer_promotion"] and not r["controller_mutation"]; print(json.dumps({k:r[k] for k in ("stage","classification","order_episodes","scores","native_deviations","gross_microchain_bigram_gain","six_step_rescues","four_step_regressions","by_arrival_and_question_type")},sort_keys=True))'
      - name: No changed source after computation
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
