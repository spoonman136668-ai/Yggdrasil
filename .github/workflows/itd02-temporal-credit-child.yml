name: ITD-02 temporal-credit child source-only qualification
on:
  pull_request:
    paths:
      - 'yggdrasil/itd02_temporal_credit_dev.py'
      - 'tests/test_itd02_temporal_credit_dev.py'
      - '.github/workflows/itd02-temporal-credit-child.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporal-credit:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable Windows checkout line-ending rewrites
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Focused temporal-credit contract
        run: python -B -m unittest discover -s tests -p "test_itd02_temporal_credit_dev.py" -v
      - name: One final full repository regression
        run: python -B -m unittest discover -s tests -v
      - name: Source-only diff remains clean after tests
        run: git diff --exit-code
