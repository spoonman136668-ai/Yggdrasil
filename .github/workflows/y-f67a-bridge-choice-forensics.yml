name: Yggdrasil F67A immutable public bridge-choice forensics
on:
  push:
    branches:
      - research/y-f67-hierarchical-bridge-memory-precode-20261016-r1
permissions:
  contents: read
jobs:
  synthetic-only-forensics:
    if: "${{ github.event.head_commit.message == 'ci(y-f67a): independently classify bridge choice availability and eviction' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact frozen teacher and audited online policy
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 29c00b83d88d9c167d24d52c2278fd8281735797 HEAD
          test "$(git hash-object research/foundational/20261016-y-f67a/prereg.json)" = 5ecade3402c33120a1eabfd34bbc66e91200dcb8
          test "$(git hash-object research/foundational/20261016-y-f67a/causal_memory.py)" = b370396b3c3571be2c01ab2b33effef14f248eef
          test "$(git hash-object research/foundational/20261016-y-f67a/train_structural_junction.py)" = edbd46327fa9368e2f02346d48ede5a01207eb65
          test "$(git hash-object research/foundational/20261016-y-f67a/forensic_bridge_choices.py)" = 88773f4ceb9d44ebce818553fd4852250bb4989b
      - name: Measure each true junction's causal eligibility and retention
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f67a-junction-forensics/"
          python3 -B research/foundational/20261016-y-f67a/forensic_bridge_choices.py > "$RUNNER_TEMP/f67a-junction-forensics/bridge_choices.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f67a-junction-forensics/bridge_choices.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f67a-junction-forensics/bridge_choices.json")));print("F67A_CAUSAL_BRIDGE_FORENSICS",d["evidence"]);assert d["evidence"]["bridge_observation_count"]==16 and not d["FIT_consumed"] and not d["heldout_consumed"]'
          sha256sum "$RUNNER_TEMP/f67a-junction-forensics/bridge_choices.json" > "$RUNNER_TEMP/f67a-junction-forensics/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f67a-junction-forensics/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f67a-frozen-junction-choice-forensics
          path: ${{ runner.temp }}/f67a-junction-forensics/
          retention-days: 90
          if-no-files-found: warn
