name: AAI-10D disarmed causal-evaluation protocol and source atlas
on:
  push:
    branches: [research/aai10d-causal-transfer-evaluator-20261114]
    paths: [.github/workflows/aai10d-source-atlas.yml]
permissions:
  contents: write
concurrency:
  group: aai10d-source-qualification-20261114
  cancel-in-progress: false
jobs:
  source-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10D one-shot frozen disarmed evaluator source and atlas' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact prereg first, original model and benchmark SHA custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'a9a3034afabee200cde69a695531003ba638bbfb'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10d-source-atlas.yml'
          test "$(git rev-parse 1f30ba538c3a363ba8ea3ac679d440bb6e70938b^)" = '58c0a3744e08e7547a85acdf88190decb6797584'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10D/prereg.json)" = '2a4c079396665c2737eb4208c4190a946100d496'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10D/prereg.json)" = "$(git rev-parse 1f30ba538c3a363ba8ea3ac679d440bb6e70938b:research/contrib/chatgpt/AAI-10D/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10D/protocol.py)" = '5acdddf375f0d4c6dd055362c36db61a4734f357'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10D/test_protocol.py)" = '8bd47d79a8564d1c9375ff4fb661667f9d177513'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10D/fixture_only.py)" = 'e32c0ec3233fe24993eb603c0b9638ee4a655514'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/compact.py)" = 'b8eb196fd923743f22d372135561f5c1a4f28982'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/models.py)" = '9233ffaafe2f227de687116b0ed4204ee4e2b3a2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          test -z "$(git status --porcelain)"
          echo AAI10D_PRECODE_PREREG_AND_FROZEN_LEARNER_BLOBS_PASS
      - name: Fair matched learners, standalone full-budget ablation and first-use disarm
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10D -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-10D/fixture_only.py --primary > /dev/null 2>&1; then
            echo AAI10D_FIRST_USE_DISARM_FAILED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI10D_FIXTURE_FENCE_AND_INDEPENDENT_FORKS_PASS
      - name: Additional independent fixture report with deterministic trace
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-10D/fixture_only.py --fixture handcrafted:one
          test -z "$(git status --porcelain)"
          echo AAI10D_FIXTURE_RUN_ONLY_NOT_SCIENCE_PASS
  atlas:
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create exactly G29 three generated atlas artifacts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'a9a3034afabee200cde69a695531003ba638bbfb'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-10D source-pinned G29 generated-only atlas'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai10d-causal-transfer-evaluator-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai10d-causal-transfer-evaluator-20261114
          echo AAI10D_PINNED_G29_GENERATED_ONLY_PASS
