name: AAI-06A frozen graph-growth contributor experiment (one-shot)
on:
  push:
    branches: [research/aai06-novel-causal-graph-growth-20261114]
    paths: [.github/workflows/aai06a-one-shot.yml]
permissions:
  contents: read
jobs:
  one-shot:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-06A first-use frozen experiment' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm immutable prereg/source/first-use custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '43c09fdd087bf8f79ae4c072c351e5b5b084612e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-06A/prereg.json)" = "$(git rev-parse 71941d3d825050977ab5fb8a4d8dd6489d5bd546:research/contrib/chatgpt/AAI-06A/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-06A/run.py)" = "$(git rev-parse 43c09fdd087bf8f79ae4c072c351e5b5b084612e:research/contrib/chatgpt/AAI-06A/run.py)"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai06a-one-shot.yml'
          test -z "$(git status --porcelain)"
          echo AAI06A_EXACT_FIRST_USE_SOURCE_PASS
      - name: Mechanical-only focused checks on reserved seeds
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-06A -p 'test_aai06a.py' -v
          git diff --exit-code
          echo AAI06A_MECHANICAL_PREFLIGHT_PASS
      - name: Execute first-use frozen primary once
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-06A/run.py > "$RUNNER_TEMP/aai06a-result.json"
          python - "$RUNNER_TEMP/aai06a-result.json" <<'PY'
          import hashlib,json,sys
          raw=open(sys.argv[1],"rb").read()
          obj=json.loads(raw)
          assert obj["prereg_commit"]=="71941d3d825050977ab5fb8a4d8dd6489d5bd546"
          assert obj["integration"]=="NONE"
          print("AAI06A_RESULT_COMPACT="+json.dumps(obj,sort_keys=True,separators=(',',':')))
          print("AAI06A_RESULT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("AAI06A_RESULT_CLASS="+obj["classification"])
          PY
          git diff --exit-code
          echo AAI06A_FIRST_USE_PRIMARY_CAPTURE_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aai06a-frozen-primary
          path: ${{ runner.temp }}/aai06a-result.json
          if-no-files-found: warn
          retention-days: 14

  generated-atlas-companion:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.ref == 'refs/heads/research/aai06-novel-causal-graph-growth-20261114' &&
      github.event.head_commit.message == 'AAI-06A generate pinned atlas one-shot' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate only source-locked G29 atlas
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai06a-one-shot.yml'
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 71941d3d825050977ab5fb8a4d8dd6489d5bd546 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-06A/run.py)" = "$(git rev-parse 43c09fdd087bf8f79ae4c072c351e5b5b084612e:research/contrib/chatgpt/AAI-06A/run.py)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-06A/prereg.json)" = "$(git rev-parse 71941d3d825050977ab5fb8a4d8dd6489d5bd546:research/contrib/chatgpt/AAI-06A/prereg.json)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-06A pinned G29 generated-atlas companion only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch origin research/aai06-novel-causal-graph-growth-20261114
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai06-novel-causal-graph-growth-20261114
          echo AAI06A_PINNED_GENERATED_ATLAS_PASS
