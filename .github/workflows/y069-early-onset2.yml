name: Y069 early onset2 frozen original scientific study
on:
  push:
    branches: [research/y069-early-sentinel-boundary-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze parent and original scientific source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b7ff26ffb487405a831a005b85a0ff18423de6f1 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y069-onset2/prereg.json)" = 4ca594dbdba5c78a3a54f6e4b1135f4b2f009439
          test "$(git hash-object research/contrib/chatgpt/20261013-y069-onset2/execute.py)" = 0c0799294300127c77de85435d629ed1c1248e24
          test "$(git hash-object research/contrib/chatgpt/20261013-y068-early/execute.py)" = 7c6f1ad179dcf9b0c023d8d8b334fd8ef109d770
          python3 -m json.tool research/contrib/chatgpt/20261013-y069-onset2/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y069-onset2/execute.py
      - name: First original sealed onset2 experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y069-onset2/execute.py >/tmp/Y069-original.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y069-original.json'))
          assert a['development_seeds']==list(range(7024,7032))
          assert a['sealed_heldout_seeds']==list(range(7056,7072))
          assert len(a['new_onset2_comparisons'])==2
          print('CLASSIFICATION',a['classification'])
          print('EARLY_ONSET2',a['new_onset2_comparisons'])
          print('SAFETY',a['matching_and_sensing_safe'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y069-original-onset2-early-boundary
          path: /tmp/Y069-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
