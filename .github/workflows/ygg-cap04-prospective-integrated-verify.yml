name: YGG CAP04 prospective integrated exact-source engineering qualification
on:
  push:
    branches:
      - research/ygg-cap04-prospective-integration-20261119
    paths:
      - '.github/workflows/ygg-cap04-prospective-integrated-verify.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  atlas_seal:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.actor == 'spoonman136668-ai' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.seal.outputs.source_sha }}
      candidate_sha: ${{ steps.seal.outputs.candidate_sha }}
      candidate_tree: ${{ steps.seal.outputs.candidate_tree }}
    steps:
      - name: Disable platform line-ending transformations before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source provenance, no registered first-use, and source-only interface fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 8d48a1e33ec174519a0ed4afc6b0b807699e2cb0
          test "$(git diff --name-only 8d48a1e33ec174519a0ed4afc6b0b807699e2cb0 HEAD)" = '.github/workflows/ygg-cap04-prospective-integrated-verify.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = 28240be43e7981e1d47100a3a886d04da3c09304
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = 56a883f7203afccc37a81ddcff46ae1e1da04491
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
          python -B -m unittest discover -s tests -p 'test_cap04_prospective_source_contract.py' -v
          python -B -m unittest discover -s tests -p 'test_native_predictive_state_*.py' -v
          test -z "$(git status --porcelain)"
      - name: Reanchor only G29 source-locator artifacts; preserve exact candidate custody
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' '|')" = ".ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json|"
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(cap04): source-pin integrated prospective fixture G29 at $SOURCE"
          CANDIDATE="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/ygg-cap04-prospective-integration-20261119"
          echo "source_sha=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "CAP04_INTEGRATED_ENGINEERING_SOURCE=$SOURCE"
          echo "CAP04_INTEGRATED_ENGINEERING_CANDIDATE=$CANDIDATE"
          echo "CAP04_INTEGRATED_ENGINEERING_TREE=$TREE"
  full_final_regression:
    needs: atlas_seal
    if: needs.atlas_seal.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Preserve exact source bytes before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas_seal.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned complete native numeric environment
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exact SHA and tree full final two-OS regression, never registered-science first use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas_seal.outputs.candidate_sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.atlas_seal.outputs.candidate_tree }}"
          test "$(git rev-parse HEAD^)" = "${{ needs.atlas_seal.outputs.source_sha }}"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort | tr '\n' '|')" = ".ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json|"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = 28240be43e7981e1d47100a3a886d04da3c09304
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = 56a883f7203afccc37a81ddcff46ae1e1da04491
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
