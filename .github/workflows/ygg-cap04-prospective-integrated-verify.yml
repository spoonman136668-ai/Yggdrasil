name: YGG CAP04 integrated prospective source and native fixture qualification
on:
  push:
    branches:
      - research/ygg-cap04-prospective-integration-20261119
permissions:
  contents: read
jobs:
  source-contract-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Preserve exact source bytes on Windows and Linux
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Engineering-only source gate; registered seeds forbidden
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          export PYTHONDONTWRITEBYTECODE=1
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
          python -B -m unittest discover -s tests -p test_cap04_prospective_source_contract.py -v
          python -B -m unittest discover -s tests -p 'test_native_predictive_state_*.py' -v
          git merge-base --is-ancestor abb6d8b33997c58726b74f77ba424c64a0413a28 HEAD
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "research/contrib/chatgpt/YGG-CAP04/prospective_source.py": "315cc97b1a868baa6f247956c9ef23258fb5c88861ae3cf781df515dc653745a",
              "tests/test_cap04_prospective_source_contract.py": "2263e23f5952fc94689406d0c10945edf812a89473368cfc98d31f94048b8351",
          }
          for name, pinned in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              print("CAP04_STAGING_FILE_SHA256", name, actual)
              if actual != pinned:
                  raise SystemExit("CAP04_STAGING_SOURCE_BYTE_MISMATCH " + name)
          print("CAP04_STAGING_ENGINEERING_ONLY_PASS")
          PY
          test -z "$(git status --porcelain)"
