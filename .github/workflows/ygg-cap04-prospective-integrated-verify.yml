name: YGG CAP04 integrated prospective source and native fixture qualification
on:
  push:
    branches:
      - research/ygg-cap04-prospective-integration-20261119
    paths:
      - '.github/workflows/ygg-cap04-prospective-integrated-verify.yml'
permissions:
  contents: read
jobs:
  source-contract-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Preserve exact source bytes on Windows and Linux
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Engineering-only source gate; registered seeds forbidden
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          export PYTHONDONTWRITEBYTECODE=1
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
          python -B -m unittest discover -s tests -p test_cap04_prospective_source_contract.py -v
          python -B -m unittest discover -s tests -p 'test_native_predictive_state_*.py' -v
          git merge-base --is-ancestor abb6d8b33997c58726b74f77ba424c64a0413a28 HEAD
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "research/contrib/chatgpt/YGG-CAP04/prospective_source.py": "315cc97b1a868baa6f247956c9ef23258fb5c88861ae3cf781df515dc653745a",
              "tests/test_cap04_prospective_source_contract.py": "2263e23f5952fc94689406d0c10945edf812a89473368cfc98d31f94048b8351",
          }
          for name, pinned in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              print("CAP04_STAGING_FILE_SHA256", name, actual)
              if actual != pinned:
                  raise SystemExit("CAP04_STAGING_SOURCE_BYTE_MISMATCH " + name)
          print("CAP04_STAGING_ENGINEERING_ONLY_PASS")
          PY
          test -z "$(git status --porcelain)"

  atlas_reanchor:
    needs: source-contract-fixture
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.actor == 'spoonman136668-ai' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Source-controlled line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source and update only the generated atlas on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 4f257643b15e7198998e440579235bbf0bf48b23
          test "$(git diff --name-only 4f257643b15e7198998e440579235bbf0bf48b23 HEAD)" = ".github/workflows/ygg-cap04-prospective-integrated-verify.yml"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source.py)" = 28240be43e7981e1d47100a3a886d04da3c09304
          test "$(git rev-parse HEAD:tests/test_cap04_prospective_source_contract.py)" = 56a883f7203afccc37a81ddcff46ae1e1da04491
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = cef1378fd3c47ebc74675bd9dde19a183775ceeb
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          test -z "$(git status --porcelain)"
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' '|')" = ".ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json|"
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(cap04): reanchor G29 to integrated prospective source $SOURCE"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/ygg-cap04-prospective-integration-20261119"
          echo "CAP04_INTEGRATED_SOURCE_COMMIT=$SOURCE"
          echo "CAP04_INTEGRATED_G29_COMMIT=$(git rev-parse HEAD)"
          echo "CAP04_INTEGRATED_G29_TREE=$(git rev-parse HEAD^{tree})"
