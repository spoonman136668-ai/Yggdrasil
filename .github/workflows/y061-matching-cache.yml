name: Yggdrasil Y061 frozen sentinel-corrected matching cache evaluation
on:
  push:
    branches: [research/y061-bounded-matching-recovery-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-closed exact pinned design and source-birth
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5aee4b1e1461679baf1e297a0c5cc23514ac6aa7 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y060-decoder-recovery/execute.py)" = 80014bea14b9b2adf1d38f7197b809895bb3c575
          test "$(git hash-object research/contrib/chatgpt/20261013-y061-matching-cache/prereg.json)" = 6156dbc45e70a331431fc13c0fc40bd7015aafa6
          test "$(git hash-object research/contrib/chatgpt/20261013-y061-matching-cache/execute.py)" = b9baf4f177ede0b21825ff391488a74b0a63b786
          python3 -m json.tool research/contrib/chatgpt/20261013-y061-matching-cache/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y061-matching-cache/execute.py
      - name: Original first-use sealed real matching and nine-cache science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y061-matching-cache/execute.py > /tmp/Y061-original.json
          python3 -m json.tool /tmp/Y061-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y061-original.json'))
          assert x['development_seeds']==list(range(3360,3368))
          assert x['sealed_heldout_seeds']==list(range(3376,3392))
          assert len(x['heldout_records'])==2*3*4*16*3
          assert x['per_trial_public_scalar_reads']==10
          assert x['active']==7 and x['cache_limit']==9
          assert all(all(a['illegal_physical_assignments']==0
                  for a in v['total'].values()) for v in x['aggregate_by_case'].values())
          print('CLASSIFICATION',x['classification'])
          print('STEADY_ZERO',x['steady_zero_mismatches'])
          print('BLIND_SPOT',x['undetected_case_no_correction'])
          print('DETECTABLE_RECOVERY_GATES',x['precommitted_detectable_case_gates'])
          for k,v in x['aggregate_by_case'].items():
              print('CASE',k,v['detected_controller_trials'],
                    {arm:row['post_detection_mismatch_episodes'] for arm,row in v['total'].items()},
                    {arm:row['mismatch_episodes'] for arm,row in v['total'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y061-original-matching-cache-recovery
          path: /tmp/Y061-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One final complete Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
