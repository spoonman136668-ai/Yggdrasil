name: DG1-SL05 three-context cold-memory falsification DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-sl05-20261113/**'
      - '.github/workflows/dg1-sl05-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source syntax checks
        run: python -m py_compile research/contrib/chatgpt/dg1-sl05-20261113/sl05.py research/contrib/chatgpt/dg1-sl05-20261113/test_sl05.py
      - name: Frozen custody and focused negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-sl05-20261113 -p "test_*.py" -v
      - name: Run full preregistered 32-world prospective synthetic study
        run: python research/contrib/chatgpt/dg1-sl05-20261113/sl05.py > sl05-result.json
      - name: Emit frozen classification, metrics and full per-world receipts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('sl05-result.json').read_text())
          assert r['prereg_sha']=='10fa5ec7c983b871482b772ec54d7522ec3e3ac5'
          assert len(r['worlds'])==32 and r['physical_actions_total']==2560
          assert all(all(w['cold_restore_at_60'].values()) for w in r['worlds'])
          print('SL05_CLASSIFICATION:'+r['classification'])
          print('SL05_PRIMARY:'+str(r['primary_pass']))
          print('SL05_RESULT_JSON:'+json.dumps(r,sort_keys=True,separators=(',',':')))
          PY
      - name: Mandatory full inherited source regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify G29 source atlas
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Clean generated result before source-integrity check
        if: always()
        shell: bash
        run: rm -f sl05-result.json
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
      - name: Print bounded exact-source G29 atlas chunks for standalone repair
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
          python - <<'PY'
          import base64
          from pathlib import Path
          for ext in ('json','html','ice'):
              raw=Path('.ice/code-atlas.'+ext).read_bytes()
              b64=base64.b64encode(raw).decode('ascii')
              print('SL05_ATLAS_START:'+ext+':'+str(len(raw)))
              for i in range(0,len(b64),4096):
                  print('SL05_ATLAS_CHUNK:'+ext+':'+b64[i:i+4096])
              print('SL05_ATLAS_END:'+ext)
          PY
