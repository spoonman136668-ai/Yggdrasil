name: QTR-01 F48 counterfactual witness vs exact Bayesian IG DEV
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  focused:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F48 focused counterfactual witness versus Bayesian IG DEV'
    name: F48 intervention DEV (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Normalize Windows Git bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen F48 prereg and original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3d2748da05ffd6a9354bc58619c736b32373b0cf'
          test "$(git log -1 --format=%s)" = 'ci(qtr): F48 focused counterfactual witness versus Bayesian IG DEV'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f48-counterfactual-witness.yml'
          git merge-base --is-ancestor c5f831ea4e5615c8d35d472ac24c40b78674786a HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f48_prereg.json)" = '3ed03d9b6a65e48b4e7c85dcb7ed044503487e14'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f48_counterfactual_witness_dev.py)" = '51882ab7126f66a8197762716b77bf40ee97d77b'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py)" = 'a10c28d4534d22ce43d3c003835b29b757ff0d84'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f46_active_intervention_dev.py)" = '56da60c2fca7e7a62349af5d521a6ccacab6b302'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f45_context_causal_induction_dev.py)" = '0167e3d3118dd0e949ab6c94a57c34647b8879f9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f48_counterfactual_witness_dev.py)" = '8c679ea08c268364f32d9d26de231a224a8613ed'
          test "$(git rev-parse HEAD:yggdrasil/public_causal_cells.py)" = '5c9a9904e31688bebc2e53723569e1fb988a981f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f42_exact_index_dev.py)" = '997d2d13c4725d5b33d993d252aac7108304b529'
          echo F48_SOURCE_AND_PRECODE_PROTOCOL_PIN=PASS
      - name: F48 focused learning, negative, cold and scope tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f48_*.py' -v
      - name: Frozen maximum-first three-seed world comparison
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f48_counterfactual_witness_dev.py | tee "$RUNNER_TEMP/f48-raw.log"
          F48_LOG="$RUNNER_TEMP/f48-raw.log" F48_JSON="$RUNNER_TEMP/f48-stable.json" python - <<'PY'
          import json,os,pathlib,hashlib
          lines=pathlib.Path(os.environ["F48_LOG"]).read_text(encoding="utf-8").splitlines()
          found=[line.split("=",1)[1] for line in lines if line.startswith("F48_COUNTERFACTUAL_WITNESS_DEV_RESULT=")]
          assert len(found)==1
          d=json.loads(found[0])
          assert d["classification"] in ("DEV_COUNTERFACTUAL_WITNESS_GO","DEV_COUNTERFACTUAL_WITNESS_NO_GO")
          assert len(d["world_results"])==27
          assert d["hypothesis_counts_high_first"]==[256,128,64] and d["seeds"]==[149,151,157]
          assert d["budgets_high_first"]==[32,16,8]
          assert d["scientific_pass"] is False
          assert d["protected_first_use"] is False
          assert d["accepted_native_Yggdrasil_model_edited"] is False
          assert d["deployed"] is False
          assert d["action_budgets_equal"] is True
          assert d["cold_and_tamper_all"] is True
          assert d["action_budgets_equal"] is True
          for x in d["world_results"]:
              assert len(x["arms"])==4
              for arm in x["arms"].values():
                  assert arm["cold_restore_prediction_exact"] is True
                  assert arm["tamper_rejected"] is True
                  assert arm["isolated_clone_public_update_unchanged_original"] is True
                  assert arm["isolated_control_extra_public_actions"] == 1
                  arm.pop("selection_seconds_DEV_only",None)
                  arm.pop("total_arm_seconds_DEV_only",None)
          raw=(json.dumps(d,sort_keys=True,separators=(",",":"))+"\n").encode("utf-8")
          pathlib.Path(os.environ["F48_JSON"]).write_bytes(raw)
          print("F48_DEV_CLASSIFICATION="+d["classification"])
          print("F48_MACRO_DIRECT_F1="+str(d["native_b16_unseen_accuracy"]))
          print("F48_CROSS_OS_RECORD_SHA256="+hashlib.sha256(raw).hexdigest())
          print("F48_NO_PROTECTED_FIRST_USE=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qtr01-f48-dev-${{ matrix.os }}
          path: ${{ runner.temp }}/f48-stable.json
          retention-days: 3
          if-no-files-found: error
      - name: Verify no source mutation
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F48_SOURCE_FREE_CLEAN=PASS
  compare:
    needs: focused
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F48 focused counterfactual witness versus Bayesian IG DEV'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qtr01-f48-dev-*
          path: ${{ runner.temp }}/f48-compare
          merge-multiple: false
      - name: Cross-platform exact DEV science/null receipt comparison
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/f48-compare/qtr01-f48-dev-ubuntu-24.04/f48-stable.json"
          B="$RUNNER_TEMP/f48-compare/qtr01-f48-dev-windows-2022/f48-stable.json"
          test -s "$A" && test -s "$B"
          cmp "$A" "$B"
          sha256sum "$A" "$B"
          echo F48_CROSS_OS_STABLE_RESULT_PARITY=PASS
  atlas-once:
    needs: compare
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F48 focused counterfactual witness versus Bayesian IG DEV'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin prereg and candidate exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F48 focused counterfactual witness versus Bayesian IG DEV'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f48_prereg.json)" = '3ed03d9b6a65e48b4e7c85dcb7ed044503487e14'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f48_counterfactual_witness_dev.py)" = '51882ab7126f66a8197762716b77bf40ee97d77b'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py)" = 'a10c28d4534d22ce43d3c003835b29b757ff0d84'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f46_active_intervention_dev.py)" = '56da60c2fca7e7a62349af5d521a6ccacab6b302'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f45_context_causal_induction_dev.py)" = '0167e3d3118dd0e949ab6c94a57c34647b8879f9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f48_counterfactual_witness_dev.py)" = '8c679ea08c268364f32d9d26de231a224a8613ed'
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = 'cef1378fd3c47ebc74675bd9dde19a183775ceeb'
          test -z "$(git status --porcelain)"
      - name: Regenerate three exact ICE code atlas companion files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          EXPECTED="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          ACTUAL="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F48 source-exact ICE code atlas'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo F48_DERIVED_ICE_EXACT=PASS
  full-final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F48 final full source-exact regression'
    name: F48 full final regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows Git bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify F48 frozen prereg, source and derived ICE
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F48 final full source-exact regression'
          test -z "$(git diff --name-only HEAD^ HEAD)"
          git merge-base --is-ancestor c5f831ea4e5615c8d35d472ac24c40b78674786a HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f48_prereg.json)" = '3ed03d9b6a65e48b4e7c85dcb7ed044503487e14'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f48_counterfactual_witness_dev.py)" = '51882ab7126f66a8197762716b77bf40ee97d77b'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f47_hypothesis_tournament_dev.py)" = 'a10c28d4534d22ce43d3c003835b29b757ff0d84'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f46_active_intervention_dev.py)" = '56da60c2fca7e7a62349af5d521a6ccacab6b302'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f45_context_causal_induction_dev.py)" = '0167e3d3118dd0e949ab6c94a57c34647b8879f9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f48_counterfactual_witness_dev.py)" = '8c679ea08c268364f32d9d26de231a224a8613ed'
          test "$(git rev-parse HEAD:yggdrasil/public_causal_cells.py)" = '5c9a9904e31688bebc2e53723569e1fb988a981f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f32_source_snapshot.json)" = '453dad0363689cff785c26db5441555c6841f95d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f35_source_depth2_snapshot.json)" = '3fc50ddf7453958c458db697eacf2e27d3d52f57'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f39_fit_breadth_source_snapshot.json)" = 'f0972e2d2987a0ee3205a7e3b7e3c0c2b60c6108'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          echo F48_FINAL_SOURCE_AND_ICE=PASS
      - name: Install inherited regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: Entire original repository regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Entire QTR contributor regression including F48
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Verify final source worktree clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F48_FULL_FINAL_SOURCE_EXACT_PASS
