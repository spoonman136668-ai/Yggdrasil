name: DG1-SL04 unseen-context transfer falsification DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-sl04-20261113/**'
      - '.github/workflows/dg1-sl04-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile exact SL04 source
        run: python -m py_compile research/contrib/chatgpt/dg1-sl04-20261113/sl04.py research/contrib/chatgpt/dg1-sl04-20261113/test_sl04.py
      - name: Focused negative, input isolation and checkpoint tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-sl04-20261113 -p "test_*.py" -v
      - name: Evaluate preregistered unseen interventions, retention and controls
        run: python research/contrib/chatgpt/dg1-sl04-20261113/sl04.py > sl04-result.json
      - name: Read out frozen classification and entire deterministic evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('sl04-result.json').read_text())
          assert r['prereg_sha']=='7ca7da2595727ebf719d77c51c1c97be7c9d892c'
          assert len(r['worlds'])==24 and r['charged_physical_actions']==1536
          assert all(x['cold_restore_identical'] for x in r['worlds'])
          print('SL04_CLASSIFICATION:'+r['classification'])
          print('SL04_PRIMARY:'+str(r['primary_pass']))
          print('SL04_RESULT_JSON:'+json.dumps(r,sort_keys=True,separators=(',',':')))
          PY
      - name: Mandatory inherited complete final regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: G29 exact-source atlas qualification
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Remove generated results before custody verification
        if: always()
        shell: bash
        run: rm -f sl04-result.json
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
      - name: Rebuild bounded source-pinned atlas for exact-SHA repair
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
          python - <<'PY'
          import base64
          from pathlib import Path
          for ext in ('json','html','ice'):
              raw=Path('.ice/code-atlas.'+ext).read_bytes()
              encoded=base64.b64encode(raw).decode('ascii')
              print('SL04_ATLAS_START:'+ext+':'+str(len(raw)))
              for i in range(0,len(encoded),4096):
                  print('SL04_ATLAS_CHUNK:'+ext+':'+encoded[i:i+4096])
              print('SL04_ATLAS_END:'+ext)
          PY
