name: ITD-02 PR588 exact-head full integration qualification
on:
  push:
    branches:
      - qualify/itd02-pr588-g29-atlas-render-20261027
permissions:
  contents: read
jobs:
  exact-source-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve byte-exact Git source
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c92d0ff4f1cda4ba2714f1066d37b3cc48e46626
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable candidate and source-only no-drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c92d0ff4f1cda4ba2714f1066d37b3cc48e46626"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: One full Python system regression (all discovered tests)
        shell: bash
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm pinned G29 Atlas without regeneration or bypass
        shell: bash
        run: python -B scripts/build_code_atlas.py --check-if-present
      - name: Confirm source remains clean after tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c92d0ff4f1cda4ba2714f1066d37b3cc48e46626"
          test -z "$(git status --porcelain --untracked-files=all)"
