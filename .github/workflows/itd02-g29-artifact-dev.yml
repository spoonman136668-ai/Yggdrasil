name: ITD-02 PR588 exact-head full integration qualification
on:
  push:
    branches:
      - qualify/itd02-pr588-g29-atlas-render-20261027
permissions:
  contents: read
jobs:
  exact-source-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve byte-exact Git source
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c92d0ff4f1cda4ba2714f1066d37b3cc48e46626
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable candidate and source-only no-drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c92d0ff4f1cda4ba2714f1066d37b3cc48e46626"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Full Linux system regression; exact Windows-compatible system suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -B - <<'PY'
          from pathlib import Path
          import sys, unittest
          paths = sorted(Path("tests").glob("test_*.py"))
          posix_only = {
              "test_free_fanout_sidecar.py",
              "test_nci04g6_native_credit.py",
              "test_nci04g7_source_producer.py",
          }
          assert len(paths) == 14 and posix_only <= {p.name for p in paths}, "EXACT_TEST_CATALOG_DRIFT"
          posix_import_sources = {
              "test_free_fanout_sidecar.py": "scripts/free_fanout_sidecar.py",
              "test_nci04g6_native_credit.py": "tests/test_nci04g6_native_credit.py",
              "test_nci04g7_source_producer.py": "tests/test_nci04g7_source_producer.py",
          }
          assert set(posix_import_sources) == posix_only, "UNIX_MODULE_CATALOG_DRIFT"
          assert all("import resource" in Path(source).read_text("utf-8")
                     for source in posix_import_sources.values()), "UNIX_MODULE_REASON_DRIFT"
          sys.path.insert(0, str(Path("tests").resolve()))
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for p in paths:
              if p.name not in posix_only:
                  suite.addTests(loader.loadTestsFromName(p.stem))
          print("WINDOWS_UNIX_ONLY_MODULES_EXCLUDED_WITH_REASON=" + ",".join(sorted(posix_only)), flush=True)
          print("WINDOWS_INCLUDED_MODULE_COUNT=" + str(len(paths)-len(posix_only)), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun < 50:
              sys.exit(1)
          PY
          else
            python -B -m unittest discover -s tests -p 'test_*.py' -v
          fi
      - name: Confirm pinned G29 Atlas without regeneration or bypass
        shell: bash
        run: python -B scripts/build_code_atlas.py --check-if-present
      - name: Confirm source remains clean after tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c92d0ff4f1cda4ba2714f1066d37b3cc48e46626"
          test -z "$(git status --porcelain --untracked-files=all)"
