name: Mass CS08 real K4 original source binding eviction test
on:
  push:
    branches:
      - research/mass-cs08-binding-eviction-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs08-original-k4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-binding-eviction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact frozen first-prereg source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Enforce prereg-FIRST ancestry and unchanged prior source paths
        shell: bash
        run: |
          set -euo pipefail
          first=faac43a908fcf7836fddc5b4d6cf73aa556abad5
          parent=8d268254666b5b05ef7318322da34529e074cbdd
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS08_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS08_PREREG.md","research/native/itd01/mass_r10/run_cs08_original_binding_eviction.py","research/native/itd01/mass_r10/test_cs08_original_binding_eviction.py",".github/workflows/mass-cs08-binding-eviction.yml"};assert got==want,(got,want)'
      - name: Checkout exact unchanged original POPGym source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original unchanged source dependency set
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs08-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/popgym >cs08-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >cs08-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Source-free K4 bounded actual eviction tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs08_original_binding_eviction.py 2>&1 | tee cs08-evidence/focused-tests.log
      - name: Execute exactly frozen original public FIT VALID DEV
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs08_original_binding_eviction.py --upstream external/popgym --out cs08-evidence/
      - name: Preserve true source evidence and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs08-original-binding-eviction
          path: cs08-evidence/
          retention-days: 30
