# Public isolated research contribution. Pull-request CI only, no schedule,
# dispatch, self-hosted executor, write credential, owner or accepted-ref change.
name: WSP-10 direct crossbar weight programming DEV regression
on:
  pull_request:
    branches:
      - research/wsp09-synaptic-associative-slot-allocation-20261110
    paths:
      - 'research/contrib/chatgpt/WSP-10/**'
      - '.github/workflows/wsp10-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate G29 source snapshot generation (NOT committed atlas acceptance)
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }}
      - name: Original Yggdrasil full regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: All prior WSP-01 through WSP-09 full regressions
        shell: bash
        run: |
          for n in 01 02 03 04 05 06 07 08 09; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p "test_*.py" -v
          done
      - name: WSP-10 frozen tests
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-10 -p "test_*.py" -v
      - name: WSP-10 frozen 272-spec exhaustive evaluator
        run: python research/contrib/chatgpt/WSP-10/run_dev.py
      - name: Reject source mutation
        run: git diff --exit-code
