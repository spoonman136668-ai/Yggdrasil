name: Yggdrasil Y030 fresh bounded age-gate science
on:
  push:
    branches: [research/y030-age-gated-retention-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable first-use identity, parent and prereg check
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0fa63655436e4f6da528fcd5a82a23383b5ee66f HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y029-frontier/execute.py)" = 9e099688869c8557f46c8b7120aaa35ee7407785
          test "$(git hash-object research/contrib/chatgpt/20261013-y030-age-gate/prereg.json)" = ce233ee79b15b295aba65ce3cd423eb0f750bab4
          test "$(git hash-object research/contrib/chatgpt/20261013-y030-age-gate/execute.py)" = 6cbdd2b16c6bd09baad12661486582b95df752d3
          python3 -m json.tool research/contrib/chatgpt/20261013-y030-age-gate/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y030-age-gate/execute.py
      - name: Original frozen observed-age ablation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y030-age-gate/execute.py > /tmp/Y030-original.json
          python3 -m json.tool /tmp/Y030-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y030-original.json'))
          assert len(a['regimes'])==4
          print('CLASSIFICATION',a['classification'])
          for x in a['regimes']:
              print(x['regime'],x['total_heldout_churn'],x['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y030-original-age-gate
          path: /tmp/Y030-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Final full Yggdrasil integration
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
