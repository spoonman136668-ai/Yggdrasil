name: YGG-A Developmental Lane

on:
  push:
    branches:
      - research/ygg-a-developmental
    paths:
      - research/control/ygg-a-run.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ygg-a-research-lane
  cancel-in-progress: false

jobs:
  lane-run:
    runs-on: [self-hosted, Windows, X64, yggdrasil, ygg-a, research-only]
    timeout-minutes: 35

    steps:
      - name: Checkout exact lane commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Assert lane isolation and read mode
        id: ctl
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Yggdrasil') { throw "REPOSITORY_MISMATCH actual=$env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF_NAME -cne 'research/ygg-a-developmental') { throw "BRANCH_MISMATCH actual=$env:GITHUB_REF_NAME" }

          $ControlPath = 'research/control/ygg-a-run.json'
          $Raw = Get-Content -LiteralPath $ControlPath -Raw
          $Control = $Raw | ConvertFrom-Json
          if ($Control.schema -ne 1) { throw 'CONTROL_SCHEMA_MISMATCH' }
          if ($Control.lane -cne 'YGG-A') { throw "CONTROL_LANE_MISMATCH actual=$($Control.lane)" }
          if ($Control.mode -notin @('bootstrap','a1_mechanical')) { throw "CONTROL_MODE_UNSUPPORTED actual=$($Control.mode)" }
          if ($Raw -match '(?i)ckb-plane|ktrade|wingless|coinbase|broker|ygg-b|ygg-c') { throw 'LANE_ISOLATION_TOKEN_VIOLATION' }
          "mode=$($Control.mode)" >> $env:GITHUB_OUTPUT

      - name: Probe runner environment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a-bootstrap'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          $Python = Get-Command python -ErrorAction SilentlyContinue
          $Nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          $Probe = [ordered]@{
              schema=1
              lane='YGG-A'
              mode='${{ steps.ctl.outputs.mode }}'
              github_sha=$env:GITHUB_SHA
              runner_name=$env:RUNNER_NAME
              identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
              powershell=$PSVersionTable.PSVersion.ToString()
              python=if ($Python) { (& python --version 2>&1 | Out-String).Trim() } else { $null }
              gpu=if ($Nvidia) { @(& nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>&1) } else { @() }
              git=(& git --version | Out-String).Trim()
              isolation='Yggdrasil YGG-A lane only'
          }
          $Probe | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $OutDir 'bootstrap.json') -Encoding UTF8

      - name: Setup Python for scientific run
        if: steps.ctl.outputs.mode == 'a1_mechanical'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install frozen A1 runtime
        if: steps.ctl.outputs.mode == 'a1_mechanical'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -c "import numpy,torch; print('numpy',numpy.__version__); print('torch',torch.__version__)"

      - name: Run YGG-A1 mechanical gate
        if: steps.ctl.outputs.mode == 'a1_mechanical'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a1'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/applications/track-a/lu2t_task4_exact_parent_feasibility_v1.py mechanical (Join-Path $OutDir 'parent-mechanical.json')
          python research/experiments/ygg-a/ygg_a1_fork_join_v1.py mechanical (Join-Path $OutDir 'a1-mechanical.json')
          $A1 = Get-Content -LiteralPath (Join-Path $OutDir 'a1-mechanical.json') -Raw | ConvertFrom-Json
          if (-not $A1.all_pass) { throw 'YGG_A1_MECHANICAL_GATE_FAILED' }
          Get-Content -LiteralPath (Join-Path $OutDir 'a1-mechanical.json')

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ygg-a-${{ steps.ctl.outputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ygg-a-bootstrap\**
            ${{ runner.temp }}\ygg-a1\**
          if-no-files-found: warn
          retention-days: 14
