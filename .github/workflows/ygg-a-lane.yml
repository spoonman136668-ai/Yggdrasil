name: YGG-A Developmental Lane

on:
  push:
    branches:
      - research/ygg-a-developmental
    paths:
      - research/control/ygg-a-run.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ygg-a-research-lane
  cancel-in-progress: false

jobs:
  lane-run:
    runs-on: [self-hosted, Windows, X64, yggdrasil, ygg-a, research-only]
    timeout-minutes: 90

    steps:
      - name: Checkout exact lane commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Restore bound LU2G loader bytes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $Bound = 'research/applications/track-a/lu2g_second_task_compositional_service_transfer_v1.candidate.py'
          $Expected = '21d19cfe4aece4a067264c2ae80c4325ec77e964684ab3663fa285f0545880c8'
          git config core.autocrlf false
          if (Test-Path -LiteralPath $Bound) { Remove-Item -LiteralPath $Bound -Force }
          git checkout -- $Bound
          if ($LASTEXITCODE -ne 0) { throw 'BOUND_LOADER_RESTORE_FAILED' }
          $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Bound).Hash.ToLowerInvariant()
          if ($Actual -cne $Expected) { throw "BOUND_LOADER_HASH_MISMATCH expected=$Expected actual=$Actual" }

      - name: Assert lane isolation and read mode
        id: ctl
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Yggdrasil') { throw "REPOSITORY_MISMATCH actual=$env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF_NAME -cne 'research/ygg-a-developmental') { throw "BRANCH_MISMATCH actual=$env:GITHUB_REF_NAME" }

          $ControlPath = 'research/control/ygg-a-run.json'
          $Raw = Get-Content -LiteralPath $ControlPath -Raw
          $Control = $Raw | ConvertFrom-Json
          if ($Control.schema -ne 1) { throw 'CONTROL_SCHEMA_MISMATCH' }
          if ($Control.lane -cne 'YGG-A') { throw "CONTROL_LANE_MISMATCH actual=$($Control.lane)" }
          if ($Control.mode -notin @('bootstrap','a1_mechanical','a1_primary','a2_dev','a2_mechanical','a2_primary','a3_mechanical','a3_primary','a29_probe','a30_probe','a31_probe','a32_probe','a33_probe','a34_probe','a35_probe','a36_probe','a37_probe','a38_probe','a39_probe','a40_probe','a41_probe','a42_probe','a43_probe','a44_probe','a45_probe','a46_probe','a47_probe','a48_probe','a49_probe','a50_probe','a51_probe','a52_probe','a53_probe','a54_probe','a55_probe','a56_probe','a57_probe','a58_probe')) { throw "CONTROL_MODE_UNSUPPORTED actual=$($Control.mode)" }
          if ($Raw -match '(?i)ckb-plane|ktrade|wingless|coinbase|broker|ygg-b|ygg-c') { throw 'LANE_ISOLATION_TOKEN_VIOLATION' }
          "mode=$($Control.mode)" >> $env:GITHUB_OUTPUT

      - name: Probe runner environment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a-bootstrap'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          $Python = Get-Command python -ErrorAction SilentlyContinue
          $Nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          $Probe = [ordered]@{
              schema=1
              lane='YGG-A'
              mode='${{ steps.ctl.outputs.mode }}'
              github_sha=$env:GITHUB_SHA
              runner_name=$env:RUNNER_NAME
              identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
              powershell=$PSVersionTable.PSVersion.ToString()
              python=if ($Python) { (& python --version 2>&1 | Out-String).Trim() } else { $null }
              gpu=if ($Nvidia) { @(& nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>&1) } else { @() }
              git=(& git --version | Out-String).Trim()
              isolation='Yggdrasil YGG-A lane only'
          }
          $Probe | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $OutDir 'bootstrap.json') -Encoding UTF8

      - name: Provision portable Python runtime
        if: steps.ctl.outputs.mode == 'a1_mechanical' || steps.ctl.outputs.mode == 'a1_primary' || steps.ctl.outputs.mode == 'a2_dev' || steps.ctl.outputs.mode == 'a2_mechanical' || steps.ctl.outputs.mode == 'a2_primary' || steps.ctl.outputs.mode == 'a3_mechanical' || steps.ctl.outputs.mode == 'a3_primary' || steps.ctl.outputs.mode == 'a29_probe' || steps.ctl.outputs.mode == 'a30_probe' || steps.ctl.outputs.mode == 'a31_probe' || steps.ctl.outputs.mode == 'a32_probe' || steps.ctl.outputs.mode == 'a33_probe' || steps.ctl.outputs.mode == 'a34_probe' || steps.ctl.outputs.mode == 'a35_probe' || steps.ctl.outputs.mode == 'a36_probe' || steps.ctl.outputs.mode == 'a37_probe' || steps.ctl.outputs.mode == 'a38_probe' || steps.ctl.outputs.mode == 'a39_probe' || steps.ctl.outputs.mode == 'a40_probe' || steps.ctl.outputs.mode == 'a41_probe' || steps.ctl.outputs.mode == 'a42_probe' || steps.ctl.outputs.mode == 'a43_probe' || steps.ctl.outputs.mode == 'a44_probe' || steps.ctl.outputs.mode == 'a45_probe' || steps.ctl.outputs.mode == 'a46_probe' || steps.ctl.outputs.mode == 'a47_probe' || steps.ctl.outputs.mode == 'a48_probe' || steps.ctl.outputs.mode == 'a49_probe' || steps.ctl.outputs.mode == 'a50_probe' || steps.ctl.outputs.mode == 'a51_probe' || steps.ctl.outputs.mode == 'a52_probe' || steps.ctl.outputs.mode == 'a53_probe' || steps.ctl.outputs.mode == 'a54_probe' || steps.ctl.outputs.mode == 'a55_probe' || steps.ctl.outputs.mode == 'a56_probe' || steps.ctl.outputs.mode == 'a57_probe' || steps.ctl.outputs.mode == 'a58_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $PyRoot = Join-Path $env:RUNNER_TEMP 'python312-ygg-a'
          $PyExe = Join-Path $PyRoot 'python.exe'
          if (-not (Test-Path -LiteralPath $PyExe)) {
              if (Test-Path -LiteralPath $PyRoot) { Remove-Item -LiteralPath $PyRoot -Recurse -Force }
              New-Item -ItemType Directory -Path $PyRoot -Force | Out-Null
              $Zip = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
              Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $Zip
              Expand-Archive -LiteralPath $Zip -DestinationPath $PyRoot -Force
              $Pth = Join-Path $PyRoot 'python312._pth'
              @('python312.zip','.','Lib\\site-packages','import site') | Set-Content -LiteralPath $Pth -Encoding ASCII
              New-Item -ItemType Directory -Path (Join-Path $PyRoot 'Lib\\site-packages') -Force | Out-Null
              $GetPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
              Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $GetPip
              & $PyExe $GetPip --disable-pip-version-check --no-warn-script-location
              if ($LASTEXITCODE -ne 0) { throw "GET_PIP_FAILED exit=$LASTEXITCODE" }
          }
          if (-not (Test-Path -LiteralPath $PyExe)) { throw "PYTHON_MISSING path=$PyExe" }
          $TrackA = Join-Path $env:GITHUB_WORKSPACE 'research\applications\track-a'
          $Pth = Join-Path $PyRoot 'python312._pth'
          $YggA = Join-Path $env:GITHUB_WORKSPACE 'research\experiments\ygg-a'
          @('python312.zip','.','Lib\site-packages',$TrackA,$YggA,'import site') | Set-Content -LiteralPath $Pth -Encoding ASCII
          $PyRoot >> $env:GITHUB_PATH
          (Join-Path $PyRoot 'Scripts') >> $env:GITHUB_PATH
          & $PyExe --version
          & $PyExe -m pip --version

      - name: Install frozen A1 runtime
        if: steps.ctl.outputs.mode == 'a1_mechanical' || steps.ctl.outputs.mode == 'a1_primary' || steps.ctl.outputs.mode == 'a2_dev' || steps.ctl.outputs.mode == 'a2_mechanical' || steps.ctl.outputs.mode == 'a2_primary' || steps.ctl.outputs.mode == 'a3_mechanical' || steps.ctl.outputs.mode == 'a3_primary' || steps.ctl.outputs.mode == 'a29_probe' || steps.ctl.outputs.mode == 'a30_probe' || steps.ctl.outputs.mode == 'a31_probe' || steps.ctl.outputs.mode == 'a32_probe' || steps.ctl.outputs.mode == 'a33_probe' || steps.ctl.outputs.mode == 'a34_probe' || steps.ctl.outputs.mode == 'a35_probe' || steps.ctl.outputs.mode == 'a36_probe' || steps.ctl.outputs.mode == 'a37_probe' || steps.ctl.outputs.mode == 'a38_probe' || steps.ctl.outputs.mode == 'a39_probe' || steps.ctl.outputs.mode == 'a40_probe' || steps.ctl.outputs.mode == 'a41_probe' || steps.ctl.outputs.mode == 'a42_probe' || steps.ctl.outputs.mode == 'a43_probe' || steps.ctl.outputs.mode == 'a44_probe' || steps.ctl.outputs.mode == 'a45_probe' || steps.ctl.outputs.mode == 'a46_probe' || steps.ctl.outputs.mode == 'a47_probe' || steps.ctl.outputs.mode == 'a48_probe' || steps.ctl.outputs.mode == 'a49_probe' || steps.ctl.outputs.mode == 'a50_probe' || steps.ctl.outputs.mode == 'a51_probe' || steps.ctl.outputs.mode == 'a52_probe' || steps.ctl.outputs.mode == 'a53_probe' || steps.ctl.outputs.mode == 'a54_probe' || steps.ctl.outputs.mode == 'a55_probe' || steps.ctl.outputs.mode == 'a56_probe' || steps.ctl.outputs.mode == 'a57_probe' || steps.ctl.outputs.mode == 'a58_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -c "import numpy,torch; print('numpy',numpy.__version__); print('torch',torch.__version__)"

      - name: Run YGG-A1 mechanical gate
        if: steps.ctl.outputs.mode == 'a1_mechanical' || steps.ctl.outputs.mode == 'a1_primary' || steps.ctl.outputs.mode == 'a2_dev' || steps.ctl.outputs.mode == 'a2_mechanical' || steps.ctl.outputs.mode == 'a2_primary' || steps.ctl.outputs.mode == 'a3_mechanical' || steps.ctl.outputs.mode == 'a3_primary' || steps.ctl.outputs.mode == 'a29_probe' || steps.ctl.outputs.mode == 'a30_probe' || steps.ctl.outputs.mode == 'a31_probe' || steps.ctl.outputs.mode == 'a32_probe' || steps.ctl.outputs.mode == 'a33_probe' || steps.ctl.outputs.mode == 'a34_probe' || steps.ctl.outputs.mode == 'a35_probe' || steps.ctl.outputs.mode == 'a36_probe' || steps.ctl.outputs.mode == 'a37_probe' || steps.ctl.outputs.mode == 'a38_probe' || steps.ctl.outputs.mode == 'a39_probe' || steps.ctl.outputs.mode == 'a40_probe' || steps.ctl.outputs.mode == 'a41_probe' || steps.ctl.outputs.mode == 'a42_probe' || steps.ctl.outputs.mode == 'a43_probe' || steps.ctl.outputs.mode == 'a44_probe' || steps.ctl.outputs.mode == 'a45_probe' || steps.ctl.outputs.mode == 'a46_probe' || steps.ctl.outputs.mode == 'a47_probe' || steps.ctl.outputs.mode == 'a48_probe' || steps.ctl.outputs.mode == 'a49_probe' || steps.ctl.outputs.mode == 'a50_probe' || steps.ctl.outputs.mode == 'a51_probe' || steps.ctl.outputs.mode == 'a52_probe' || steps.ctl.outputs.mode == 'a53_probe' || steps.ctl.outputs.mode == 'a54_probe' || steps.ctl.outputs.mode == 'a55_probe' || steps.ctl.outputs.mode == 'a56_probe' || steps.ctl.outputs.mode == 'a57_probe' || steps.ctl.outputs.mode == 'a58_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a1'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/applications/track-a/lu2t_task4_exact_parent_feasibility_v1.py mechanical (Join-Path $OutDir 'parent-mechanical.json')
          python research/experiments/ygg-a/ygg_a1_fork_join_v1.py mechanical (Join-Path $OutDir 'a1-mechanical.json')
          $A1 = Get-Content -LiteralPath (Join-Path $OutDir 'a1-mechanical.json') -Raw | ConvertFrom-Json
          if (-not $A1.all_pass) { throw 'YGG_A1_MECHANICAL_GATE_FAILED' }
          Get-Content -LiteralPath (Join-Path $OutDir 'a1-mechanical.json')

      - name: Run YGG-A1 primary sweep
        if: steps.ctl.outputs.mode == 'a1_primary'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a1'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a1_fork_join_v1.py primary (Join-Path $OutDir 'a1-primary.json')
          $A1 = Get-Content -LiteralPath (Join-Path $OutDir 'a1-primary.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a1-primary.json')
          if (-not $A1.qualification.YGG_A1_FORK_JOIN_EXACT_PARENT_FEASIBLE) { throw 'YGG_A1_PRIMARY_SCIENTIFIC_NEGATIVE' }

      - name: Inspect frozen scheduler for A2 implementation
        if: steps.ctl.outputs.mode == 'a2_dev'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a2-inspector'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a2_scheduler_inspector_v1.py $OutDir
          if ($LASTEXITCODE -ne 0) { throw "YGG_A2_INSPECTOR_FAILED exit=$LASTEXITCODE" }

      - name: Run YGG-A2 mechanical gate
        if: steps.ctl.outputs.mode == 'a2_mechanical' || steps.ctl.outputs.mode == 'a2_primary'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a2'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a2_terminal_integrity_priority_v1.py mechanical (Join-Path $OutDir 'a2-mechanical.json')
          $A2 = Get-Content -LiteralPath (Join-Path $OutDir 'a2-mechanical.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a2-mechanical.json')
          if (-not $A2.all_pass) { throw 'YGG_A2_MECHANICAL_GATE_FAILED' }

      - name: Run YGG-A2 primary sweep
        if: steps.ctl.outputs.mode == 'a2_primary'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a2'
          python research/experiments/ygg-a/ygg_a2_terminal_integrity_priority_v1.py primary (Join-Path $OutDir 'a2-primary.json')
          $A2 = Get-Content -LiteralPath (Join-Path $OutDir 'a2-primary.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a2-primary.json')
          if (-not $A2.qualification.YGG_A2_TERMINAL_INTEGRITY_PRIORITY) { throw 'YGG_A2_PRIMARY_SCIENTIFIC_NEGATIVE' }

      - name: Run YGG-A3 mechanical gate
        if: steps.ctl.outputs.mode == 'a3_mechanical' || steps.ctl.outputs.mode == 'a3_primary'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a3'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a3_terminal_transit_priority_v1.py mechanical (Join-Path $OutDir 'a3-mechanical.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a3-mechanical.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a3-mechanical.json')
          if (-not $R.all_pass) { throw 'YGG_A3_MECHANICAL_GATE_FAILED' }

      - name: Run YGG-A3 primary sweep
        if: steps.ctl.outputs.mode == 'a3_primary'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a3'
          python research/experiments/ygg-a/ygg_a3_terminal_transit_priority_v1.py primary (Join-Path $OutDir 'a3-primary.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a3-primary.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a3-primary.json')
          if (-not $R.qualification.YGG_A3_TERMINAL_TRANSIT_PRIORITY) { throw 'YGG_A3_PRIMARY_SCIENTIFIC_NEGATIVE' }


      - name: Run YGG-A29 frozen replicate6 cell2 pair-removal probe
        if: steps.ctl.outputs.mode == 'a29_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a29'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a29_replicate6_cell2_pair_removal_v1.py (Join-Path $OutDir 'a29-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a29-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a29-result.json')
          if (-not $R.valid) { throw 'YGG_A29_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A29_REPLICATE6_CELL2_PAIR_REMOVAL) { throw 'YGG_A29_QUALIFICATION_FAILED' }


      - name: Run YGG-A30 frozen replicate6 cell2 triple-removal necessity
        if: steps.ctl.outputs.mode == 'a30_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a30'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a30_replicate6_cell2_triple_removal_v1.py (Join-Path $OutDir 'a30-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a30-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a30-result.json')
          if (-not $R.valid) { throw 'YGG_A30_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A30_REPLICATE6_CELL2_TRIPLE_REMOVAL) { throw 'YGG_A30_QUALIFICATION_FAILED' }

      - name: Run YGG-A31 frozen replicate6 cell2 four-removal necessity
        if: steps.ctl.outputs.mode == 'a31_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a31'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a31_replicate6_cell2_four_removal_v1.py (Join-Path $OutDir 'a31-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a31-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a31-result.json')
          if (-not $R.valid) { throw 'YGG_A31_REPLICATE6_CELL2_FOUR_REMOVAL_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A31_REPLICATE6_CELL2_FOUR_REMOVAL) { throw 'YGG_A31_REPLICATE6_CELL2_FOUR_REMOVAL_QUALIFICATION_FAILED' }

      - name: Run YGG-A32 frozen replicate6 cell2 five-removal necessity
        if: steps.ctl.outputs.mode == 'a32_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a32'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a32_replicate6_cell2_five_removal_v1.py (Join-Path $OutDir 'a32-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a32-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a32-result.json')
          if (-not $R.valid) { throw 'YGG_A32_REPLICATE6_CELL2_FIVE_REMOVAL_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A32_REPLICATE6_CELL2_FIVE_REMOVAL) { throw 'YGG_A32_REPLICATE6_CELL2_FIVE_REMOVAL_QUALIFICATION_FAILED' }

      - name: Run YGG-A33 frozen replicate6 cell2 six-removal necessity
        if: steps.ctl.outputs.mode == 'a33_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a33'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a33_replicate6_cell2_six_removal_v1.py (Join-Path $OutDir 'a33-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a33-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a33-result.json')
          if (-not $R.valid) { throw 'YGG_A33_REPLICATE6_CELL2_SIX_REMOVAL_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A33_REPLICATE6_CELL2_SIX_REMOVAL) { throw 'YGG_A33_REPLICATE6_CELL2_SIX_REMOVAL_QUALIFICATION_FAILED' }

      - name: Run YGG-A34 frozen replicate6 cell2 seven-removal necessity
        if: steps.ctl.outputs.mode == 'a34_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a34'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a34_replicate6_cell2_seven_removal_v1.py (Join-Path $OutDir 'a34-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a34-result.json') -Raw | ConvertFrom-Json
