        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a57'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a57_insensitive_pair_flip_v1.py (Join-Path $OutDir 'a57-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a57-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a57-result.json')
          if (-not $R.valid) { throw 'YGG_A57_INSENSITIVE_PAIR_FLIPS_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A57_INSENSITIVE_PAIR_FLIPS) { throw 'YGG_A57_INSENSITIVE_PAIR_FLIPS_QUALIFICATION_FAILED' }

      - name: Run YGG-A58 frozen pairwise-robust triples
        if: steps.ctl.outputs.mode == 'a58_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-a58'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-a/ygg_a58_pairwise_robust_triples_v1.py (Join-Path $OutDir 'a58-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'a58-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'a58-result.json')
          if (-not $R.valid) { throw 'YGG_A58_PAIRWISE_ROBUST_TRIPLES_EVIDENCE_INVALID' }
          if (-not $R.qualification.YGG_A58_PAIRWISE_ROBUST_TRIPLES) { throw 'YGG_A58_PAIRWISE_ROBUST_TRIPLES_QUALIFICATION_FAILED' }

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ygg-a-${{ steps.ctl.outputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ygg-a-bootstrap\**
            ${{ runner.temp }}\ygg-a1\**
            ${{ runner.temp }}\ygg-a2-inspector\**
            ${{ runner.temp }}\ygg-a2\**
            ${{ runner.temp }}\ygg-a3\**
            ${{ runner.temp }}\ygg-a32\**
            ${{ runner.temp }}\ygg-a33\**
            ${{ runner.temp }}\ygg-a34\**
            ${{ runner.temp }}\ygg-a35\**
            ${{ runner.temp }}\ygg-a36\**
            ${{ runner.temp }}\ygg-a37\**
            ${{ runner.temp }}\ygg-a38\**
            ${{ runner.temp }}\ygg-a39\**
            ${{ runner.temp }}\ygg-a40\**
            ${{ runner.temp }}\ygg-a41\**
            ${{ runner.temp }}\ygg-a42\**
            ${{ runner.temp }}\ygg-a43\**
            ${{ runner.temp }}\ygg-a44\**
            ${{ runner.temp }}\ygg-a45\**
            ${{ runner.temp }}\ygg-a46\**
            ${{ runner.temp }}\ygg-a47\**
            ${{ runner.temp }}\ygg-a48\**
            ${{ runner.temp }}\ygg-a49\**
            ${{ runner.temp }}\ygg-a50\**
