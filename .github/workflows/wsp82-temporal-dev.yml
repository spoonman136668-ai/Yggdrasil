name: WSP82 frozen UNREGISTERED temporal-feature induction comparison
on:
  push:
    branches: [research/wsp80-paid-novelty-structural-weight-repair-20261113]
permissions:
  contents: read
jobs:
  four-temporal-developer-worlds:
    if: "${{ github.event.head_commit.message == 'ci(wsp82): execute frozen unregistered temporal feature comparison' }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source, prereg and G29 atlas exact SHA
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: Train paid-history numerical, symbolic and history-aware real Adam; freeze before private developer labels
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python research/contrib/chatgpt/WSP-82/experiment.py --frozen-unregistered-dev-only
      - name: Verify repository unchanged
        shell: bash
        run: git diff --exit-code
