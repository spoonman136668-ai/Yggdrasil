name: ITD-02 native task ring bridge source-only qualification
on:
  pull_request:
    paths:
      - 'yggdrasil/itd02_local_ring_memory_dev.py'
      - 'yggdrasil/itd02_native_task_bridge_dev.py'
      - 'tests/test_itd02_local_ring_memory_dev.py'
      - 'tests/test_itd02_native_task_bridge_dev.py'
      - '.github/workflows/itd02-native-task-ring-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Source-only memory and real native runtime focused checks
        run: python -B -m unittest discover -s tests -p "test_itd02*dev.py" -v
      - name: Existing native functional-abstention regression
        run: python -B -m unittest discover -s tests -p "test_nci04g7e_functional_custody.py" -v
      - name: No generated changes
        run: git diff --exit-code
