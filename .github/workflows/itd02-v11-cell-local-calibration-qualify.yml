name: ITD-02 v11 eight-cell residual calibration preregistered qualification
on:
  push:
    branches:
      - research/itd02-v11-cell-local-calibration-20261027
permissions:
  contents: read
jobs:
  eight-cell-native-vs-all-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable Git checkout newline mutation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout preregistration, source-free evaluator and tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout unchanged original native all-eight-cell source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 658b855d1b217d20ed9d431fe99b2e866469b7e9
          path: native-v8
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout exact v11 native local-calibration candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c99145851681de375854cb89c1d4af185abf043b
          path: native-v11
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source SHA and prereg chronological custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          git -C harness merge-base --is-ancestor 490c5bd543bf5a3989a4f1f7ebd2fe95c9120773 "$GITHUB_SHA"
          test "$(git -C native-v8 rev-parse HEAD)" = 658b855d1b217d20ed9d431fe99b2e866469b7e9
          test "$(git -C native-v11 rev-parse HEAD)" = c99145851681de375854cb89c1d4af185abf043b
          test -z "$(git -C harness status --porcelain --untracked-files=all)"
          test -z "$(git -C native-v8 status --porcelain --untracked-files=all)"
          test -z "$(git -C native-v11 status --porcelain --untracked-files=all)"
          python - <<'PY'
          from pathlib import Path
          x=Path("native-v8/yggdrasil/task_runtime.py").read_bytes()
          y=Path("native-v11/yggdrasil/task_runtime.py").read_bytes()
          assert x==y, "ORIGINAL_FULL8_LEARNER_SOURCE_MUTATED"
          assert b"for i,target in enumerate(outcomes)" in x
          assert b"self.core.genome" in x
          print("ITD02_V11_ORIGINAL_FULL8_GENOME_SUPERVISION_BYTE_EQUAL_PASS")
          PY
      - name: Source-only local-learning covariance and safety regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/native-v11" python -B harness/tests/test_itd02_v11_cell_local_residual.py -v
          cd native-v11
          python -B -m unittest discover -s tests -p test_itd02_native_task_bridge_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_local_ring_memory_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
      - name: Run five actually acting independent source-free learner arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/itd02-v11-evidence"
          for arm in v8 v11; do
            python -B harness/research/itd02_v11_cell_local_calibration_eval.py \
              --variant "$arm" --root "$GITHUB_WORKSPACE/native-$arm" \
              --output "$RUNNER_TEMP/itd02-v11-evidence/$arm.json"
          done
          for arm in count_mean ema_half rolling_six; do
            python -B harness/research/itd02_v11_cell_local_calibration_eval.py \
              --variant "$arm" --output "$RUNNER_TEMP/itd02-v11-evidence/$arm.json"
          done
          python -B harness/research/itd02_v11_cell_local_calibration_eval.py \
            --aggregate "$RUNNER_TEMP/itd02-v11-evidence" \
            --output "$RUNNER_TEMP/itd02-v11-evidence/aggregate.json"
      - name: Fail-closed feedback/accounting and candidate source custody
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"itd02-v11-evidence"
          a=json.loads((p/"aggregate.json").read_text("utf8"))
          assert a["events_all_arms"]==8640 and a["events_per_arm"]==1728
          assert set(a["means"])=={"v8","v11","count_mean","ema_half","rolling_six"}
          assert a["scientific_first_use_authorized"] is False
          assert a["promotion_authorized"] is False
          assert a["retail_pc_evidence"] is False
          v=json.loads((p/"v11.json").read_text("utf8"))
          assert len(v["trials"])==12
          assert all(set(trial["site_residual_state"])=={"initial","unfamiliar","shift"} for trial in v["trials"])
          assert all(all(-2<=x<=2 for x in trial["site_residual_state"][phase])
                 for trial in v["trials"] for phase in ("initial","unfamiliar","shift"))
          assert all(all(trial["cold_restore_verified"].values()) for trial in v["trials"])
          print("ITD02_V11_ALL_ACTED_SOURCEFREE_ACCOUNTING_PASS_NO_SCIENCE")
          PY
          test -z "$(git -C harness status --porcelain --untracked-files=all)"
          test -z "$(git -C native-v8 status --porcelain --untracked-files=all)"
          test -z "$(git -C native-v11 status --porcelain --untracked-files=all)"
      - name: Preserve genuine positive/negative per-trial feedback and resource metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v11-cell-residual-${{ matrix.os }}
          path: ${{ runner.temp }}/itd02-v11-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
