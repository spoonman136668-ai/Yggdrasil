name: ITD-02 R11 Selected-Public-Action Affordance Learning
on:
  push:
    branches: [research/itd02-r11-public-affordance-learning-20261025]
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin frozen protocol, new source and originals
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 77e3e5da623ac183b7491b3ce1dcfa67b1af8040 HEAD
          test "$(git rev-parse HEAD:research/native/itd02/r11/PREREG.json)" = "0bb989459762456f462467ffacca9507c0e6ae5e"
          test "$(git rev-parse HEAD:research/native/itd02/r11/affordance_cells.py)" = "614c7dfb1b43f485009b70cb85e9b7b5119cafc2"
          test "$(git rev-parse HEAD:research/native/itd02/r11/test_affordance_cells.py)" = "67c51fe0ef8ab2e47973284dbd696d8bc169c5b4"
          test "$(git rev-parse HEAD:research/native/itd02/r10/public_adapter.py)" = "3917d36ce9f86a2c1b998a0a2f93fb27674a9205"
          test "$(git rev-parse HEAD:research/native/itd02/r9/evidence_cells.py)" = "66ec3befe92e2d2c2b7116217354a40f59e659d7"
          test "$(git rev-parse HEAD:research/native/itd02/r8/revision.py)" = "346fb9eb7462208a6cbd28cfb51716c22e5ec857"
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = "204ecd993b954b23e66d6d1e8b3568e7c93183c5"
          echo "R11_PREREG_AND_ORIGINAL_SOURCE_PINNING=PASS"
      - name: Selected public feedback, conventional parity, and cold process tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r11 -p 'test_affordance_cells.py' -v
          test -z "$(git status --porcelain)"
          echo "R11_SOURCE_ONLY_CONVENTIONAL_PARITY=PASS"
          echo "R11_ORIGINAL_DOORKEY_ENV_STEPS=ZERO"
          echo "R11_FSA_PROTECTED_FIRST_USE=ZERO"

  once-atlas:
    if: github.event.head_commit.message == 'Arm R11 source-only G29 atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate three G29 artifact files only from frozen R11 source
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 77e3e5da623ac183b7491b3ce1dcfa67b1af8040 "$A"
          test "$(git rev-parse HEAD:research/native/itd02/r11/affordance_cells.py)" = "614c7dfb1b43f485009b70cb85e9b7b5119cafc2"
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-anchor G29 to frozen R11 source $A"
          B="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$A" "$B"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "3"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/itd02-r11-public-affordance-learning-20261025"
          echo "R11_SOURCE_A=$A"
          echo "R11_GENERATED_ARTIFACT_ONLY_B=$B"
