name: T9 yggdrasil causal learning focused source-neutral
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t9-yggdrasil.yml']
permissions:
  contents: read
concurrency:
  group: t9-yggdrasil-source-neutral-no-protected-firstuse
  cancel-in-progress: false
jobs:
  exact-source-new-causal-mechanism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 55
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen source and unchanged original scientific control verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T9_EXACT_SOURCE_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t9-source-freeze.json').Trim() -cne '7fcd16490fcf8bf6797d1d6f1d76d4af4804482e'){throw 'T9_PREREG_BLOB_DRIFT'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t9-source-freeze.json').Trim() -cne '916b39177419ce6d67b62da6382f6ae7d5b94602'){throw 'T9_FREEZE_NOT_BEFORE_IMPLEMENTATION'}
          git merge-base --is-ancestor 916b39177419ce6d67b62da6382f6ae7d5b94602 HEAD
          if($LASTEXITCODE -ne 0){throw 'T9_FREEZE_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t9-public-query.py').Trim() -cne '879a935877ea99bfc188c646184df8b11ab3a9be'){throw 'T9_NEW_MECHANISM_SOURCE_DRIFT'}
          if((git hash-object 'research/foundational/20261015-y-f62/source_pilot.py').Trim() -cne '7ed72deca5584d7c0b6562d74456fa7d4bee6712'){throw 'T9_FROZEN_ORIGINAL_CONTROL_DRIFT'}
          Write-Output 'T9_YGGDRASIL_SOURCE_IDENTITY_AND_FREEZE=PASS'
      - name: Execute causal sufficiency and full public control diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261019-yggdrasil-t9-public-query.py' | Tee-Object 't9-yggdrasil-original.json'
          if($LASTEXITCODE -ne 0){throw 'T9_YGGDRASIL_NONCONSUMING_MECHANISM_FAILED'}
          $d=Get-Content 't9-yggdrasil-original.json' -Raw | ConvertFrom-Json
          if($d.'original_YNS_protected_used' -ne $false -and $d.'original_YNS_protected_used' -ne 0){throw 'T9_PROTECTED_SOURCE_USED'}
          if($d.'scientific_acceptance' -ne $false){throw 'T9_SCIENCE_ACCEPTANCE_UNAUTHORIZED'}
          Write-Output 'T9_YGGDRASIL_EVIDENCE_OR_NEGATIVE=PASS'
          Write-Output 'T9_YGGDRASIL_PROTECTED_FIRST_USE=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t9-yggdrasil-nonconsuming-${{ matrix.os }}-${{ github.sha }}
          path: t9-yggdrasil-original.json
          retention-days: 90
          if-no-files-found: warn
