name: YGG-CAP02 sealed cold model replay diagnostic only
'on':
  push:
    branches:
      - research/ygg-cap02-evidence-causal-memory-20261119
    paths:
      - '.github/workflows/ygg-cap02-diagnose.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing qualified environment
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Read-only original training replay and unittest-import drift comparison
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code d07b9ac4448b4c23288f4f9a76aec7f2c69faa55 HEAD -- research/contrib/chatgpt/YGG-CAP02/prereg.json
          python -B research/contrib/chatgpt/YGG-CAP02/diagnose.py
          test -z "$(git status --porcelain)"
