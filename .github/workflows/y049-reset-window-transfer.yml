name: Yggdrasil Y049 fixed reset timing transfer
on:
  push:
    branches: [research/y049-reset-window-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen precursor and exact first-use identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c7f2fb3162e65ca90fb03f8fca80b9d9df5611d0 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y048-cache-reset/execute.py)" = 39f73f5afe9a3bc0a0c87869c164fea4a93e801b
          test "$(git hash-object research/contrib/chatgpt/20261013-y049-reset-timing/prereg.json)" = 9166e1928c38c34b07f49f6ab9c2dd378155c5a8
          test "$(git hash-object research/contrib/chatgpt/20261013-y049-reset-timing/execute.py)" = 402dde9f1ef94458ba36d9f236b88784e023a9f9
          python3 -m json.tool research/contrib/chatgpt/20261013-y049-reset-timing/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y049-reset-timing/execute.py
      - name: One original sealed timing-window experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y049-reset-timing/execute.py > /tmp/Y049-first.json
          python3 -m json.tool /tmp/Y049-first.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y049-first.json'))
          assert x['sealed_heldout_seeds']==list(range(1592,1608))
          assert len(x['records'])==4*4*24*3
          print('CLASSIFICATION',x['classification'])
          print('SHOCK_MISMATCHES',x['mismatches_by_onset_and_intervention'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y049-original-shock-onset-window
          path: /tmp/Y049-first.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
