name: NCI-04 S3 Native Cross-Cell Information Necessity
on:
  push:
    branches:
      - research/nci04-s3-crosscell-information-20261021
  pull_request:
    branches:
      - research/nci04-s2-learned-topology-necessity-20261021
permissions:
  contents: read
concurrency:
  group: nci04-s3-original-public-crosscell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-public-donor-information:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve original source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact NCI-04 S3 source and frozen protocol
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Independently authored original Farama source exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 original source execution
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reverify exact original third-party native source and metadata
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install original fixed source runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Run source-native frozen training then prospective own-vs-donor information audit
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.nci04_s3.native_crosscell_information ../external/minigrid | tee ../nci04-s3-native-information-receipt.log
          grep -q '^NCI04_S3_NATIVE_PUBLIC_CROSSCELL_INFO=' ../nci04-s3-native-information-receipt.log
      - name: Original public-only source and original research project remain unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
