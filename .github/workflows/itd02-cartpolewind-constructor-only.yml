name: ITD02 CartPoleWind original constructor readiness
on:
  push:
    branches: [research/itd02-cartpolewind-constructor-readiness-20261025]
    paths:
      - 'research/native/itd02/cartpolewind_constructor/**'
      - '.github/workflows/itd02-cartpolewind-constructor-only.yml'
permissions:
  contents: read
jobs:
  constructor-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ygg
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: upstream
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          test "$(git -C upstream rev-parse HEAD:causal_gym/envs/cartpole_wind.py)" = d65a6a31941709dc9201259d80dd4ebbcf48b4fa
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/cartpolewind_constructor/PREREG.json)" = 00ce53d89b93b6eed5a07e85472ead1bdc5bc744
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/cartpolewind_constructor/owner_constructor.py)" = 5173773261ab11b79648d1a0db809ba3a50859ac
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/cartpolewind_constructor/client_constructor.py)" = 4a84033e9e81f774328743c103dd47596b14c1df
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/cartpolewind_constructor/owner_constructor.Dockerfile)" = 6e006ee144aaf73571baa4b1006aa53dafba708e
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/cartpolewind_constructor/client_constructor.Dockerfile)" = f76545f7b1bc76fb31574b1354fcff7d09fc8e43
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/r7/learner.py)" = 204ecd993b954b23e66d6d1e8b3568e7c93183c5
          git -C ygg merge-base --is-ancestor dcff696a391977feed09a2893400fc6beda62e7e HEAD
          python3 - <<'PY'
          import pathlib,json
          d=json.loads(pathlib.Path("ygg/research/native/itd02/cartpolewind_constructor/PREREG.json").read_text())
          assert d["status"]=="FROZEN_BEFORE_IMPLEMENTATION_AND_EXECUTION"
          assert d["expected_owner_counts"]["original_environment_objects_constructed"]==1
          assert d["expected_owner_counts"]["original_environment_resets"]==0
          assert d["expected_owner_counts"]["original_environment_steps"]==0
          assert d["scientific_go"] is False
          PY
      - name: Build and run two locked containers without any original episodes
        shell: bash
        run: |
          set -euo pipefail
          OWNER_CTX="$RUNNER_TEMP/source-only-constructor"
          CLIENT_CTX="$RUNNER_TEMP/learner-only-client"
          mkdir -p "$OWNER_CTX" "$CLIENT_CTX"
          cp ygg/research/native/itd02/cartpolewind_constructor/owner_constructor.py "$OWNER_CTX/owner_constructor.py"
          cp ygg/research/native/itd02/cartpolewind_constructor/owner_constructor.Dockerfile "$OWNER_CTX/Dockerfile"
          cp upstream/causal_gym/envs/cartpole_wind.py "$OWNER_CTX/source_original.py"
          cp -a upstream/causal_gym "$OWNER_CTX/causal_gym"
          printf 'PRIVATE_CARTPOLEWIND_CANARY_DO_NOT_EXPOSE\n' > "$OWNER_CTX/private_canary.txt"
          cp ygg/research/native/itd02/cartpolewind_constructor/client_constructor.py "$CLIENT_CTX/client_constructor.py"
          cp ygg/research/native/itd02/cartpolewind_constructor/client_constructor.Dockerfile "$CLIENT_CTX/Dockerfile"
          test ! -e "$CLIENT_CTX/causal_gym"
          test ! -e "$CLIENT_CTX/source_original.py"
          docker pull python:3.12-slim-bookworm
          docker build --quiet -t ygg-cartpole-owner "$OWNER_CTX"
          docker build --quiet --network=none -t ygg-cartpole-client "$CLIENT_CTX"
          NET="ygg-source-isolation"
          cleanup() {
            docker logs ygg-cartpole-owner 2>&1 || true
            docker logs ygg-cartpole-client 2>&1 || true
            docker rm -f ygg-cartpole-client ygg-cartpole-owner >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$NET" >/dev/null
          docker run -d --name ygg-cartpole-owner --network "$NET" --network-alias source-owner --read-only --user 65534:65534 --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=64 --memory=256m --cpus=1 ygg-cartpole-owner >/dev/null
          docker run -d --name ygg-cartpole-client --network "$NET" --read-only --user 65534:65534 --cap-drop=ALL --security-opt=no-new-privileges:true --pids-limit=64 --memory=256m --cpus=1 ygg-cartpole-client >/dev/null
          test "$(timeout 55s docker wait ygg-cartpole-client)" = 0
          test "$(timeout 55s docker wait ygg-cartpole-owner)" = 0
          docker logs ygg-cartpole-owner 2>&1 | grep -F 'CARTPOLEWIND_ORIGINAL_ENV_CONSTRUCTOR_ONLY=PASS'
          docker logs ygg-cartpole-owner 2>&1 | grep -F 'CARTPOLEWIND_ORIGINAL_RESET_STEP_CALLS=0'
          docker logs ygg-cartpole-owner 2>&1 | grep -F 'CARTPOLEWIND_ORIGINAL_ENV_EPISODES=0'
          docker logs ygg-cartpole-client 2>&1 | grep -F 'CARTPOLEWIND_PRIVATE_FILES_INACCESSIBLE=PASS'
          docker logs ygg-cartpole-client 2>&1 | grep -F 'CARTPOLEWIND_PROTOCOL_PRIVILEGED_REQUESTS_DENIED=20'
          test -z "$(git -C upstream status --porcelain --untracked-files=all)"
          test -z "$(git -C ygg status --porcelain --untracked-files=all)"
          echo CARTPOLEWIND_CONSTRUCTOR_ONLY_SOURCE_CUSTODY_PASS
          echo CARTPOLEWIND_ORIGINAL_EPISODES_ZERO
          echo CARTPOLEWIND_SCIENTIFIC_GO_FALSE
