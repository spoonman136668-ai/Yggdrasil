name: Yggdrasil F67B frozen method exact-head regression
on:
  push:
    branches: [research/y-f67b-prefix-admission-precode-20261016-r1]
permissions:
  contents: read
jobs:
  complete-repository-source-qualification:
    if: "${{ github.event.head_commit.message == 'ci(y-f67b): run one exact-head regression after synthetic learning acceptance' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GitHub-hosted test dependencies
        shell: bash
        run: |
          python -m pip install pytest pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen prereg and public-only training identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 10abf669a59d61f26d7e4999083e862177d14294 HEAD
          test "$(git hash-object research/foundational/20261016-y-f67/prereg-positive-admission.json)" = e923b32001eb22236c9d55e9d6ab00abe5cc7214
          test "$(git hash-object research/foundational/20261016-y-f67/durable_policy.py)" = 21f2f3fc90a3d00d09029f39e4958e09a33908cc
          test "$(git hash-object research/foundational/20261016-y-f67/fit_admission_synthetic.py)" = a6b4251354e8e79b744449ad6e08b7179bb9e6ab
      - name: Exactly one full regression with no FIT access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f67b-regression/"
          python -B -m pytest -q > "$RUNNER_TEMP/y-f67b-regression/regression.txt" 2>&1
          cat "$RUNNER_TEMP/y-f67b-regression/regression.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f67b-regression/exact_head.txt"
          echo "FIT_TRAIN=UNCONSUMED VALIDATION=UNCONSUMED F3=FALSE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f67b-exact-method-qualification
          path: ${{ runner.temp }}/y-f67b-regression/
          retention-days: 90
          if-no-files-found: warn
