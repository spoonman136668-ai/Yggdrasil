name: ITD02 MG51 Focused Local-Cell Engineering
on:
  pull_request:
    paths:
      - 'research/native/itd02/mg37/**'
      - '.github/workflows/itd02-mg51-focused-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-only local-cell regression
        run: python -m unittest discover -s research/native/itd02/mg37 -p 'test_*.py' -v
      - name: Compile local-cell source
        run: python -m compileall -q research/native/itd02/mg37
      - name: Preserve read-only worktree
        run: git diff --exit-code
