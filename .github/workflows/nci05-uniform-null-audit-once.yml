name: NCI-05 uniform-null sourcefree exact-SHA qualification (one shot)
'on':
  push:
    branches: [research/nci05-uniform-null-qualifier-20261119]
    paths: ['.github/workflows/nci05-uniform-null-audit-once.yml']
permissions:
  contents: read
jobs:
  exact-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable automatic Git line-ending translation
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 996fe2b5177c9752b51bebf6e07ed683d9e34bed
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact Git source and frozen chronological protocol custody
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          test "$(git rev-parse HEAD)" = "996fe2b5177c9752b51bebf6e07ed683d9e34bed"
          test "$(git hash-object "$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git hash-object "$root/challenge_prereg.json.txt")" = 5ba9503358d634c729c2220f9ce5c3e4b9cb6149
          test "$(git hash-object "$root/role_probe.py.txt")" = 86a3e461dbd3bf0adc0e172321f087ceed4c0e51
          test "$(git hash-object "$root/challenge_guard.py.txt")" = d8e6f690a0e3c9acd46b23904b207e9d6a72f187
          test "$(git hash-object "$root/strong_fixed_control_audit.py.txt")" = 8ba5fa10874ad261fc392ef378184a6dd5c50e09
          test "$(git hash-object "$root/uniform_null_prereg.json.txt")" = 193d55a46f340cc34f8ad6eefc5e3c6a0bbfd738
          test "$(git rev-parse 'bc0e7150844e38c18d87efa98fe0cbbd997978ef':"$root/uniform_null_prereg.json.txt")" = 193d55a46f340cc34f8ad6eefc5e3c6a0bbfd738
          test "$(git hash-object "$root/uniform_null_audit.py.txt")" = 50f48f05fa7131ea5195f514ec1440fe0da3655c
          test "$(git hash-object "$root/test_uniform_null_audit.py.txt")" = ca59f01a437d70ebe4a131a659197823131cfa09
          echo NCI05_UNIFORM_NULL_IMMUTABLE_SOURCE_FIRST_PASS
      - name: Mandatory full original native regression on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo NCI05_UNIFORM_NULL_FULL_NATIVE_REGRESSION_PASS
      - name: All old and new scoped tests and source-free analytical receipt
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          d="$RUNNER_TEMP/nci05-uniform-null"
          mkdir -p "$d"
          for n in prereg challenge_prereg uniform_null_prereg; do
            cp "$root/$n.json.txt" "$d/$n.json.txt"
          done
          for n in role_probe test_role_probe challenge_guard test_challenge_guard strong_fixed_control_audit test_strong_fixed_control_audit uniform_null_audit test_uniform_null_audit; do
            cp "$root/$n.py.txt" "$d/$n.py"
            test "$(git hash-object "$d/$n.py")" = "$(git hash-object "$root/$n.py.txt")"
          done
          (cd "$d" && python -B -m unittest -v test_role_probe test_challenge_guard test_strong_fixed_control_audit test_uniform_null_audit)
          (cd "$d" && python -B uniform_null_audit.py)
          echo NCI05_UNIFORM_NULL_128_PATTERNS_GLOBAL_UNCERTAINTY_PASS
      - name: Confirm original git checkout unchanged and no protected first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "996fe2b5177c9752b51bebf6e07ed683d9e34bed"
          test -z "$(git status --porcelain)"
          echo NCI05_UNIFORM_NULL_NO_OWNER_AND_CLEAN_SOURCE_PASS
