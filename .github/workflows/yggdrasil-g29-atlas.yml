name: Yggdrasil G29 Atlas Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - run: git diff --exit-code
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - if: always()
        name: Emit bounded diagnostic for the committed atlas (no giant Base64 log line)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          names = (".ice/code-atlas.json", ".ice/code-atlas.html", ".ice/code-atlas.ice")
          paths = [Path(name) for name in names]
          if not all(p.is_file() for p in paths):
              print("YGG_G29_BUNDLE_MISSING")
          else:
              parts = [p.read_bytes() for p in paths]
              digest = hashlib.sha256(b"".join(parts)).hexdigest()
              print("YGG_G29_BUNDLE_SHA256=" + digest)
              print("YGG_G29_BUNDLE_BYTES=" + str(sum(map(len, parts))))
          PY
      - run: git diff --exit-code

  lr92ax-native-exact-development:
    # Bounded source-free experiment on existing hosted CI; no owner state or protected first-use.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1323
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout frozen contributor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: contributor
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout pinned native Amalgam research code (not owner checkpoint)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 86264b41a08d49f558418c0fba367f3a2636befa
          path: native
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify native source and execute frozen four-arm development experiment
        shell: bash
        timeout-minutes: 36
        run: |
          set -euo pipefail
          test "$(git -C contributor rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C native rev-parse HEAD)" = "86264b41a08d49f558418c0fba367f3a2636befa"
          test "$(git -C native rev-parse 'HEAD^{tree}')" = "ac2a2596555b490fc3ebdf16c1b5039ebb13d8b5"
          test -z "$(git -C native status --porcelain)"
          P=contributor/research/contrib/spoonman136668-ai/lr92ax-native-exact-preflight
          H="$RUNNER_TEMP/lr92ax-frozen"
          mkdir -p "$H"
          for n in worlds native_exact_probe test_native_exact_probe audit_lr92ax_controls; do
            cp "$P/$n.py.txt" "$H/$n.py"
          done
          cp "$P/per_world_controls.csv" "$H/"
          cp "$P/frozen_dev_protocol.json.txt" "$H/frozen_dev_protocol.json"
          cp "$P/dev_manifest.json.txt" "$H/dev_manifest.json"
          cd "$H"
          python -B -m unittest -v test_native_exact_probe.py
          python -B audit_lr92ax_controls.py per_world_controls.csv
          python -B native_exact_probe.py --native-checkout "$GITHUB_WORKSPACE/native" \
            --out "$RUNNER_TEMP/lr92ax-native-results.json"
          python -B - "$RUNNER_TEMP/lr92ax-native-results.json" <<'PY'
          import csv,json,math,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['source_sha']=='86264b41a08d49f558418c0fba367f3a2636befa'
          assert r['worlds']==24 and r['events_per_arm']==2158
          assert r['primary_worlds_consumed']==0 and r['canonical_training_changed'] is False
          with open('per_world_controls.csv',newline='') as f:
              controls={(int(a['seed']),a['family'],int(a['rep'])):a for a in csv.DictReader(f)}
          assert len(controls)==len(r['rows'])==24
          for x in r['rows']:
              key=(x['seed'],x['family'],x['rep'])
              c=controls.pop(key)
              assert x['public_sha256']==c['public_sha256'] and sum(x['lengths'])==int(c['events'])
              assert set(x['models'])=={'native_exact_base','native_exact_stream','beta_full','beta_window32'}
              for arm,t in (('beta_full','full'),('beta_window32','window32')):
                  m=x['models'][arm]
                  for phase,metric,field in (('B','terminal','B'),('return_first16','terminal','return16'),('B','transition','transitionB')):
                      assert abs(m['scores'][phase][metric]-float(c[f'{field}_{t}']))<5e-12
              for m in x['models'].values():
                  assert m['updates']==int(c['events']) and m['checkpoint_bytes']>0
                  assert len(m['checkpoint_sha256'])==len(m['pre_return_sha256'])==64
          assert not controls
          go=True
          for seed in (89051001,89051002):
              x=r['seed_summary'][str(seed)]
              bestb=min(x[c]['B'] for c in ('beta_full','beta_window32'))
              bestr=min(x[c]['return_first16'] for c in ('beta_full','beta_window32'))
              native=x['native_exact_stream']
              won=native['B']<=bestb+0.01 and native['return_first16']<=bestr-0.01
              go &= won
              print('LR92AX_SEED',seed,'native_B',native['B'],'best_B',bestb,
                    'native_return16',native['return_first16'],'best_return16',bestr,'GO',won)
          status='DEVELOPMENT_GO' if go else 'DEVELOPMENT_NO_GO'
          assert status==r['status']
          receipt={'audit':'PASS','decision':status,'worlds':24,'events_per_arm':2158,
                   'native_executed':True,'source_sha':r['source_sha'],
                   'owner_checkpoint_changed':False,'protected_first_use':False}
          Path(sys.argv[1]).with_name('lr92ax-native-audit.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print('LR92AX_NATIVE_EXACT_SOURCEFREE='+status)
          PY
      - name: Preserve frozen results in GitHub Actions only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LR92AX-native-development-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/lr92ax-native-results.json
            ${{ runner.temp }}/lr92ax-native-audit.json
          if-no-files-found: warn
          retention-days: 7
