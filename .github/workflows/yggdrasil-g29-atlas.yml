name: Yggdrasil G29 Atlas Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - name: GKD-01 mandatory full Yggdrasil Python regression
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: GKD-01 exact Node on isolated contributor PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: GKD-01 frozen response-donor numerical checks (no teacher/runtime APIs)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: node research/contrib/chatgpt/GKD-01/run.mjs
      - name: GKD-02 donor-reliability contradiction, retention and independent controls
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          node --check research/contrib/chatgpt/GKD-02/run.mjs
          node research/contrib/chatgpt/GKD-02/run.mjs
      - name: GKD-03 signed witness replay and unknown-law identifiability tests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          node --check research/contrib/chatgpt/GKD-03/run.mjs
          node research/contrib/chatgpt/GKD-03/run.mjs
      - name: GKD-04 generic GPT claim AST-to-numeric program and source boundaries
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          node --check research/contrib/chatgpt/GKD-04/run.mjs
          node research/contrib/chatgpt/GKD-04/run.mjs
      - name: GKD-05 source-free published-source admission and fitted-control preflight
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          python -B research/contrib/chatgpt/GKD-05/admit.py --selftest
          python -B research/contrib/chatgpt/GKD-05/score.py --selftest
      - run: git diff --exit-code
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - name: GKD-01 mandatory full Yggdrasil Python regression
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - if: always()
        name: Emit bounded diagnostic for the committed atlas (no giant Base64 log line)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          names = (".ice/code-atlas.json", ".ice/code-atlas.html", ".ice/code-atlas.ice")
          paths = [Path(name) for name in names]
          if not all(p.is_file() for p in paths):
              print("YGG_G29_BUNDLE_MISSING")
          else:
              parts = [p.read_bytes() for p in paths]
              digest = hashlib.sha256(b"".join(parts)).hexdigest()
              print("YGG_G29_BUNDLE_SHA256=" + digest)
              print("YGG_G29_BUNDLE_BYTES=" + str(sum(map(len, parts))))
          PY
      - name: GKD-01 exact Node on isolated contributor PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: GKD-01 frozen response-donor numerical checks (no teacher/runtime APIs)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: node research/contrib/chatgpt/GKD-01/run.mjs
      - name: GKD-02 donor-reliability contradiction, retention and independent controls
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          node --check research/contrib/chatgpt/GKD-02/run.mjs
          node research/contrib/chatgpt/GKD-02/run.mjs
      - name: GKD-03 signed witness replay and unknown-law identifiability tests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          node --check research/contrib/chatgpt/GKD-03/run.mjs
          node research/contrib/chatgpt/GKD-03/run.mjs
      - name: GKD-04 generic GPT claim AST-to-numeric program and source boundaries
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          node --check research/contrib/chatgpt/GKD-04/run.mjs
          node research/contrib/chatgpt/GKD-04/run.mjs
      - name: GKD-05 source-free published-source admission and fitted-control preflight
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        run: |
          python -B research/contrib/chatgpt/GKD-05/admit.py --selftest
          python -B research/contrib/chatgpt/GKD-05/score.py --selftest
      - name: GKD-05 exactly one historical public Sachs measurement DEV score (Linux only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1348 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "research(GKD-05): SINGLE_PUBLIC_DEV_SCORE" ]; then
            echo "GKD05_PUBLIC_SCORE_NOT_TRIGGERED; source labels not read"
            exit 0
          fi
          echo "GKD05_PUBLIC_SCORE_SINGLE_COMMIT_GATE_ACCEPTED"
          python -B research/contrib/chatgpt/GKD-05/score.py --score-public
      - run: git diff --exit-code
