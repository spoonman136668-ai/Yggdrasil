        run: python -B research/contrib/chatgpt/self-assembling-topologies/gate26/run.py --verify research/contrib/chatgpt/self-assembling-topologies/gate26/result.json
      - name: Gate26 native-process independent receipt and negative audit (research only)
        run: python -B research/contrib/chatgpt/self-assembling-topologies/gate26/audit.py
      - run: git diff --exit-code
