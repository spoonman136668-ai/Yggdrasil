name: Yggdrasil G29 Atlas Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Read-only bounded source-atlas diagnostic (no mutation or waiver)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_code_atlas as g29
          root = Path(".").resolve()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          actual = json.loads((root / ".ice/code-atlas.json").read_text())
          expected = g29.snapshot(root, head)
          print("H39_DIAG_CURRENT_SOURCE=" + head)
          print("H39_DIAG_COMMITTED_SOURCE=" + actual["source_commit"])
          print("H39_DIAG_COUNTS=" + str((actual["counts"], expected["counts"])))
          for path in ("tests/test_native_cells.py", ".github/workflows/yggdrasil-g29-atlas.yml"):
              old = next(x for x in actual["files"] if x["path"] == path)
              new = next(x for x in expected["files"] if x["path"] == path)
              print("H39_DIAG_FILE=" + path + " " + str((old["sha256"], new["sha256"],
                    old["bytes"], new["bytes"])))
          path = "tests/test_native_cells.py"
          def group(snap):
              return {x["id"]: (x["start_line"], x["end_line"], x["name"])
                      for x in snap["symbols"] if x["file"] == path}
          old, new = group(actual), group(expected)
          print("H39_DIAG_TEST_SYMBOL_COUNTS=" + str((len(old), len(new))))
          changes = [(key, old.get(key), new.get(key)) for key in sorted(set(old) | set(new))
                     if old.get(key) != new.get(key)]
          print("H39_DIAG_TEST_SYMBOL_CHANGES=" + str(changes[:18]))
          old_imports = [(x["line"], x["literal"]) for x in actual["imports"]
                         if x["file"] == path]
          new_imports = [(x["line"], x["literal"]) for x in expected["imports"]
                         if x["file"] == path]
          print("H39_DIAG_TEST_IMPORT_CHANGES=" + str((old_imports, new_imports)))
          PY
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - run: python -B -m unittest discover -s tests -p 'test_native_cells*.py' -v
      - run: git diff --exit-code
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - run: python -B -m unittest discover -s tests -p 'test_native_cells*.py' -v
      - if: always()
        name: Emit bounded diagnostic for the committed atlas (no giant Base64 log line)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          names = (".ice/code-atlas.json", ".ice/code-atlas.html", ".ice/code-atlas.ice")
          paths = [Path(name) for name in names]
          if not all(p.is_file() for p in paths):
              print("YGG_G29_BUNDLE_MISSING")
          else:
              parts = [p.read_bytes() for p in paths]
              digest = hashlib.sha256(b"".join(parts)).hexdigest()
              print("YGG_G29_BUNDLE_SHA256=" + digest)
              print("YGG_G29_BUNDLE_BYTES=" + str(sum(map(len, parts))))
          PY
      - run: git diff --exit-code
