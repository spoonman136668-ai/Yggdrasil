name: Yggdrasil G29 Atlas Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - name: Run full repository unittest regression (including G29)
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Gate10 frozen synthetic result reproducibility (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate10/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate10/result.json
      - name: Gate11 frozen calibrated causal result reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate11/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate11/result.json
      - name: Gate11 independent structural logic and receipt audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate11/audit.cjs
      - name: Gate12 frozen hierarchical model-order exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate12/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate12/result.json
      - name: Gate12 independent model-order logic and receipt audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate12/audit.cjs
      - name: Gate13 synthetic intervention choice exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate13/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate13/result.json
      - name: Gate13 independent posterior and result audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate13/audit.cjs
      - name: Gate14 defensive policy exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate14/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate14/result.json
      - name: Gate14 independent guard math and receipt audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate14/audit.cjs
      - name: Gate15 prequential residual exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate15/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate15/result.json
      - name: Gate15 independent arithmetic and model-information audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate15/audit.cjs
      - name: Gate16 higher-order interaction frozen exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate16/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate16/result.json
      - name: Gate16 independent Walsh basis and negative-result audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate16/audit.cjs
      - run: git diff --exit-code
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - name: Run full repository unittest regression (including G29)
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - if: always()
        name: Emit bounded diagnostic for the committed atlas (no giant Base64 log line)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          names = (".ice/code-atlas.json", ".ice/code-atlas.html", ".ice/code-atlas.ice")
          paths = [Path(name) for name in names]
          if not all(p.is_file() for p in paths):
              print("YGG_G29_BUNDLE_MISSING")
          else:
              parts = [p.read_bytes() for p in paths]
              digest = hashlib.sha256(b"".join(parts)).hexdigest()
              print("YGG_G29_BUNDLE_SHA256=" + digest)
              print("YGG_G29_BUNDLE_BYTES=" + str(sum(map(len, parts))))
          PY
      - name: Gate10 frozen synthetic result reproducibility (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate10/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate10/result.json
      - name: Gate11 frozen calibrated causal result reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate11/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate11/result.json
      - name: Gate11 independent structural logic and receipt audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate11/audit.cjs
      - name: Gate12 frozen hierarchical model-order exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate12/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate12/result.json
      - name: Gate12 independent model-order logic and receipt audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate12/audit.cjs
      - name: Gate13 synthetic intervention choice exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate13/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate13/result.json
      - name: Gate13 independent posterior and result audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate13/audit.cjs
      - name: Gate14 defensive policy exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate14/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate14/result.json
      - name: Gate14 independent guard math and receipt audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate14/audit.cjs
      - name: Gate15 prequential residual exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate15/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate15/result.json
      - name: Gate15 independent arithmetic and model-information audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate15/audit.cjs
      - name: Gate16 higher-order interaction frozen exact reproduction (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate16/run.cjs --verify research/contrib/chatgpt/self-assembling-topologies/gate16/result.json
      - name: Gate16 independent Walsh basis and negative-result audit (research only)
        run: node research/contrib/chatgpt/self-assembling-topologies/gate16/audit.cjs
      - run: git diff --exit-code
