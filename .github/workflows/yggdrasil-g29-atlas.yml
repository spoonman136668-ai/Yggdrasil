name: Yggdrasil G29 Atlas Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      - run: git diff --exit-code
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -m unittest discover -s tests -p test_code_atlas.py -v
      # Only on a failed validation, emit bounded debug metadata.
      # Do not print the entire atlas as Base64 into GitHub Actions logs.
      - if: failure()
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in (".ice/code-atlas.json", ".ice/code-atlas.html", ".ice/code-atlas.ice"):
              path = Path(name)
              if not path.is_file():
                  print("G29_ATLAS_DEBUG_MISSING=" + name)
                  continue
              raw = path.read_bytes()
              print("G29_ATLAS_DEBUG=" + name +
                    " BYTES=" + str(len(raw)) +
                    " SHA256=" + hashlib.sha256(raw).hexdigest())
          PY
      - run: git diff --exit-code
