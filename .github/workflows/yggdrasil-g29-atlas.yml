name: Yggdrasil G29 Atlas Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Disable checkout line-ending conversion for exact Git blob custody
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: DWSA-27 original pinned learned-predictor identity readback (no donor inference)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1347 }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Donor='612b2afa28bc1e05c95ec078f7a4f30fb5fad303'
          $Root=Join-Path $env:RUNNER_TEMP 'dwsa27-original-predictor-donor'
          if(Test-Path -LiteralPath $Root){throw 'DWSA27_TEMP_SOURCE_ALREADY_EXISTS'}
          git init -q $Root
          if($LASTEXITCODE -ne 0){throw 'DWSA27_GIT_INIT_FAILED'}
          git -C $Root remote add origin https://github.com/OpenSourceRulesz/tiny-jepa.git
          if($LASTEXITCODE -ne 0){throw 'DWSA27_REMOTE_ADD_FAILED'}
          git -C $Root -c core.autocrlf=false -c core.eol=lf fetch --quiet --depth=1 origin $Donor
          if($LASTEXITCODE -ne 0){throw 'DWSA27_SOURCE_FETCH_FAILED'}
          git -C $Root -c core.autocrlf=false -c core.eol=lf checkout --quiet --force --detach FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw 'DWSA27_SOURCE_CHECKOUT_FAILED'}
          $Actual=(git -C $Root rev-parse HEAD | Out-String).Trim()
          if($Actual -cne $Donor){throw 'DWSA27_PINNED_COMMIT_DRIFT'}
          $Roster=@(
            @{Name='maze_v1.npz'; Sha='88def290b67b29087aaed60c79189472c7b472d3'},
            @{Name='maze_temporal.npz'; Sha='2031e8ae2eabf944fada94fe1f1d7738e23cb9d2'},
            @{Name='maze_sigreg.npz'; Sha='08d26d3bb18dcb4e1ea0bb5975917ccf219fe5d9'}
          )
          $Pins=@()
          $Paths=@()
          foreach($Source in $Roster){
            $File=Join-Path $Root ('tiny_jepa/checkpoints/'+$Source.Name)
            if(-not (Test-Path -LiteralPath $File)){throw 'DWSA27_SOURCE_FILE_MISSING'}
            $Blob=(git -C $Root hash-object --no-filters -- $File | Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $Blob -cne $Source.Sha){throw 'DWSA27_PINNED_BLOB_DRIFT'}
            $Pins+=@('--expected-blob', "$File=$($Source.Sha)")
            $Paths+=$File
          }
          $Guard='research/contrib/chatgpt/DWSA-27/predictor_identity.py'
          $Json=(& python $Guard @Pins @Paths | Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'DWSA27_ORIGINAL_PREDICTOR_PARSE_FAILED'}
          $Report=ConvertFrom-Json -InputObject $Json
          if($Report.schema -cne 'yggdrasil.dwsa27.predictor-identity.v1' -or
             $Report.status -cne 'DUPLICATE_PREDICTOR_FOUND' -or
             $Report.source_count -ne 3 -or $Report.unique_predictor_count -ne 2 -or
             @($Report.duplicates).Count -ne 1){throw 'DWSA27_ORIGINAL_DUPLICATION_NOT_REPRODUCED'}
          $Pair=@($Report.duplicates[0] | ForEach-Object {[IO.Path]::GetFileName($_)} | Sort-Object)
          if(($Pair -join ',') -cne 'maze_temporal.npz,maze_v1.npz'){
            throw 'DWSA27_UNEXPECTED_DUPLICATE_PAIR'
          }
          $ByName=@{}
          foreach($Item in $Report.sources){
            $ByName[[IO.Path]::GetFileName($Item.path)]=$Item.predictor_sha256
          }
          if($ByName.Count -ne 3 -or
             $ByName['maze_v1.npz'] -cne $ByName['maze_temporal.npz'] -or
             $ByName['maze_v1.npz'] -ceq $ByName['maze_sigreg.npz']){
            throw 'DWSA27_PREDICTOR_FINGERPRINT_PARITY_FAILED'
          }
          Write-Output "DWSA27_PINNED_REAL_SOURCE=PASS source=$Donor unique=2/3 duplicate=maze_v1.npz,maze_temporal.npz"
      - name: DWSA-31 original pretrained TD-MPC2 checkpoint byte-custody (no pickle execution)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1347 }}
        shell: pwsh
        env:
          DWSA31_URL: https://huggingface.co/nicklashansen/tdmpc2/resolve/0d1dfdda7e529f6d3f942787ce2825eccad38935/multitask/mt30-1M.pt
        run: |
          $ErrorActionPreference='Stop'
          $Path=Join-Path $env:RUNNER_TEMP 'dwsa31-original-untrusted-mt30-1M.pt'
          if(Test-Path -LiteralPath $Path){throw 'DWSA31_REUSED_SOURCE_TEMP_PATH'}
          $env:DWSA31_PATH=$Path
          @'
          import os
          import urllib.request
          from pathlib import Path
          url = os.environ["DWSA31_URL"]
          path = Path(os.environ["DWSA31_PATH"])
          req = urllib.request.Request(url, headers={"User-Agent":"dwsa31-public-readonly-audit/1.0"})
          with urllib.request.urlopen(req, timeout=60) as response, path.open("xb") as f:
              written = 0
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  written += len(chunk)
                  if written > 16 * 1024 * 1024:
                      raise RuntimeError("DWSA31_NETWORK_BYTE_CAP")
                  f.write(chunk)
          if not 0 < path.stat().st_size <= 16 * 1024 * 1024:
              raise RuntimeError("DWSA31_EMPTY_OR_OVERSIZE")
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'DWSA31_ORIGINAL_NETWORK_FETCH_FAILED'}
          python research/contrib/chatgpt/DWSA-31/checkpoint_scan.py $Path
          if($LASTEXITCODE -ne 0){throw 'DWSA31_STATIC_SOURCE_AUDIT_FAILED'}
          Write-Output 'DWSA31_ORIGINAL_PINNED_STATIC_SCAN=PASS'
      - name: DWSA-06 exact Node version on hosted PR runner (no model or external APIs)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1347 }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: DWSA-06 native 84-byte codec and fail-closed source tests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1347 }}
        run: node --test research/contrib/chatgpt/DWSA-06/test_codec.mjs research/contrib/chatgpt/DWSA-06/test_qualify_source_cli.mjs
      - name: DWSA-06 frozen pretrained checkpoint Node replay
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1347 }}
        run: node research/contrib/chatgpt/DWSA-06/test_real_checkpoint.mjs
      - name: DWSA-06 stage Git-pinned public source and execute original Node scripts
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1347 }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $Donor='149a2838309efe6ee5ec9e8c9689e4a321158b7d'
          $Root=Join-Path $env:RUNNER_TEMP 'dwsa06-pinned-public-donor'
          if(Test-Path -LiteralPath $Root){throw 'DWSA06_TEMP_SOURCE_ALREADY_EXISTS'}
          git init -q $Root
          if($LASTEXITCODE -ne 0){throw 'DWSA06_GIT_INIT_FAILED'}
          git -C $Root remote add origin https://github.com/MasanneckLab/neural-networks-explained.git
          if($LASTEXITCODE -ne 0){throw 'DWSA06_REMOTE_ADD_FAILED'}
          git -C $Root -c core.autocrlf=false -c core.eol=lf fetch --quiet --depth=1 origin $Donor
          if($LASTEXITCODE -ne 0){throw 'DWSA06_PINNED_FETCH_FAILED'}
          git -C $Root -c core.autocrlf=false -c core.eol=lf checkout --quiet --force --detach FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw 'DWSA06_PINNED_CHECKOUT_FAILED'}
          $Actual=(git -C $Root rev-parse HEAD | Out-String).Trim()
          if($Actual -cne $Donor){throw 'DWSA06_SOURCE_COMMIT_DRIFT'}
          $Model=Join-Path $Root 'public/assets/digit-model.json'
          $Source=Join-Path $Root 'src/models.js'
          $Train=Join-Path $Root 'scripts/train.mjs'
          node research/contrib/chatgpt/DWSA-06/qualify_source_cli.mjs $Model $Source $Train
          if($LASTEXITCODE -ne 0){throw 'DWSA06_ORIGINAL_NODE_CLI_FAILED'}
          Write-Output 'DWSA06_ORIGINAL_NODE_DUALOS=PASS'
      - run: git diff --exit-code
  linux:
    runs-on: ubuntu-latest
    steps:
