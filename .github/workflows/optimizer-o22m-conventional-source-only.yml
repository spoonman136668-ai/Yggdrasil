name: Optimizer O22-M independent temporal control (source-only)

on:
  push:
    branches:
      - research/optimizer-o22m-temporal-control-20261025
  pull_request:
    paths:
      - research/optimizer_o22m/**
      - .github/workflows/optimizer-o22m-conventional-source-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equal-information-source-only:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze owner branch and prereg first
        shell: bash
        run: |
          git merge-base --is-ancestor 17bbd9c8a576bc8575176d2f0b4b973d3009200e HEAD
          git merge-base --is-ancestor d3610930e7f684a141716e029f8102fa7b45d6cf HEAD
          python -B -c "import json; p=json.load(open('research/optimizer_o22m/PREREG.json')); assert p['original_environment_resets_allowed']==0 and p['original_environment_steps_allowed']==0 and p['protected_source_first_use_allowed'] is False"
      - name: Independent original-Python source-only conventional parity tests
        run: python -B -m unittest -v research.optimizer_o22m.test_independent_temporal
