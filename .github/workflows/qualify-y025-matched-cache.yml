name: Yggdrasil Y025 frozen matched-cache ablation
on:
  push:
    branches: [research/y025-matched-cache-ablation-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable predecessor and preregistered source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 71cc6c66c2623577090e4a71fb4ebb52669e06ab HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y024-retained-placement/execute.py)" = ac285c0a2fa193eb45ea46ec38b767f4a6a74dc3
          test "$(git hash-object research/contrib/chatgpt/20261012-y025-matched-memory/prereg.json)" = bdf67a512c885db769042796fce1fad18424fa41
          test "$(git hash-object research/contrib/chatgpt/20261012-y025-matched-memory/execute.py)" = 2df847ee41aad6e9b257fa7c5c29a9b7039fd2ff
          python3 -m json.tool research/contrib/chatgpt/20261012-y025-matched-memory/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-y025-matched-memory/execute.py
      - name: Original frozen independent science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-y025-matched-memory/execute.py > /tmp/Y025-original.json
          python3 -m json.tool /tmp/Y025-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y025-original-frozen-cache-ablation
          path: /tmp/Y025-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
