name: AAI-07B external learned-memory mechanical and primary (separate one-shots)
on:
  push:
    branches: [research/aai07b-learned-memory-associations-20261114]
    paths: [.github/workflows/aai07b-frozen.yml]
permissions:
  contents: read

jobs:
  mechanical-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-07B mechanical preflight only' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze registered protocol and mechanical-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '87aaf5cd3bb26ee60a6525978e34e546e8b9bc34'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai07b-frozen.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07B/prereg.json)" = "$(git rev-parse 10e0ad453454a0f85eafbda1c8618657979810bd:research/contrib/chatgpt/AAI-07B/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07B/evaluate.py)" = "$(git rev-parse 87aaf5cd3bb26ee60a6525978e34e546e8b9bc34:research/contrib/chatgpt/AAI-07B/evaluate.py)"
          echo AAI07B_SCIENTIFIC_FIRST_USE_NOT_CONSUMED=PASS
      - name: Install unchanged pinned external MiniGrid without paid APIs
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/aai07b-upstream"
          git -C "$RUNNER_TEMP/aai07b-upstream" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/aai07b-upstream" fetch -q --no-tags --depth 1 origin 64e1eaec904bc35e7de041167274e2c0dfe541d2
          git -C "$RUNNER_TEMP/aai07b-upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aai07b-upstream" rev-parse HEAD)" = '64e1eaec904bc35e7de041167274e2c0dfe541d2'
          test "$(git -C "$RUNNER_TEMP/aai07b-upstream" rev-parse HEAD:minigrid/envs/memory.py)" = '660b0a1b769948034c87bb421759c2b9a4f24548'
          python -m pip install --disable-pip-version-check --no-input numpy==1.26.4 gymnasium==1.2.2 pygame-ce==2.5.8 networkx==3.4.2
          python -m pip install --disable-pip-version-check --no-input --no-deps -e "$RUNNER_TEMP/aai07b-upstream"
          python -m pip check
      - name: Run synthetic-ledger unit tests only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-07B -p test_aai07b.py -v
          test -z "$(git status --porcelain)"
          echo AAI07B_MECHANICAL_PREFLIGHT_PASS
  frozen-primary:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-07B frozen first-use evaluation' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original prereg/evaluator and one-shot source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai07b-frozen.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07B/prereg.json)" = "$(git rev-parse 10e0ad453454a0f85eafbda1c8618657979810bd:research/contrib/chatgpt/AAI-07B/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07B/evaluate.py)" = "$(git rev-parse 87aaf5cd3bb26ee60a6525978e34e546e8b9bc34:research/contrib/chatgpt/AAI-07B/evaluate.py)"
          test -z "$(git status --porcelain)"
          echo AAI07B_FROZEN_EXACT_FIRST_USE=PASS
      - name: Fetch official exact source, pin wheels, verify original blob
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/aai07b-upstream"
          git -C "$RUNNER_TEMP/aai07b-upstream" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/aai07b-upstream" fetch -q --no-tags --depth 1 origin 64e1eaec904bc35e7de041167274e2c0dfe541d2
          git -C "$RUNNER_TEMP/aai07b-upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aai07b-upstream" rev-parse HEAD)" = '64e1eaec904bc35e7de041167274e2c0dfe541d2'
          test "$(git -C "$RUNNER_TEMP/aai07b-upstream" rev-parse HEAD:minigrid/envs/memory.py)" = '660b0a1b769948034c87bb421759c2b9a4f24548'
          test "$(git -C "$RUNNER_TEMP/aai07b-upstream" show HEAD:minigrid/envs/memory.py | sha256sum | awk '{print $1}')" = 'd208b6b0cfb20a8ed00d55a0ea6012697f2a0da0e54e4da7d8378eb1da52df8c'
          python -m pip install --disable-pip-version-check --no-input numpy==1.26.4 gymnasium==1.2.2 pygame-ce==2.5.8 networkx==3.4.2
          python -m pip install --disable-pip-version-check --no-input --no-deps -e "$RUNNER_TEMP/aai07b-upstream"
          python -m pip check
          echo AAI07B_UPSTREAM_CUSTODY_PASS
      - name: Consume originally frozen training and evaluation worlds exactly once
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-07B/evaluate.py > "$RUNNER_TEMP/aai07b-primary.json"
          python - "$RUNNER_TEMP/aai07b-primary.json" <<'PY'
          import hashlib,json,sys
          raw=open(sys.argv[1],'rb').read()
          data=json.loads(raw)
          assert data['prereg_commit']=='10e0ad453454a0f85eafbda1c8618657979810bd'
          assert data['integration']=='NONE'
          print('AAI07B_PRIMARY_COMPACT='+json.dumps({k:v for k,v in data.items() if k!='world_rows'},sort_keys=True,separators=(',',':')))
          print('AAI07B_PRIMARY_RAW_SHA256='+hashlib.sha256(raw).hexdigest())
          print('AAI07B_CLASSIFICATION='+data['classification'])
          PY
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$RUNNER_TEMP/aai07b-upstream" status --porcelain)"
          echo AAI07B_FROZEN_PRIMARY_COMPLETE=PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aai07b-original-primary
          path: ${{ runner.temp }}/aai07b-primary.json
          if-no-files-found: warn
          retention-days: 14
