name: Y-F55 bounded online memory versus offline FIT-only headroom
on:
  push:
    branches: [research/y-f55-online-fit-validation-20261015-r1]
permissions:
  contents: read
jobs:
  train-validation:
    if: "${{ github.event.head_commit.message == 'science(y-f55): one FIT-only online memory comparison without DIAG use' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind qualified source and new FIT split identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 347c1dc2300745c49000102be91c1eae39090e07 HEAD
          test "$(git hash-object research/foundational/20261015-y-f55/prereg-candidate.json)" = eb815347e331ec34dc8247ff28d99bbcd13e621a
          test "$(git hash-object research/foundational/20261015-y-f55/source_feasibility.py)" = 9b1ec7a6088e49d7310c9a8f856a1508f9586d0a
          test "$(git hash-object research/foundational/20261015-y-f55/online_fit_validation.py)" = d92e43aa1ded7f191f758375b5f4164fed70e322
          test "$(git hash-object research/foundational/20261015-y-f55/test_fit_validation.py)" = 04282e224674959cd8e20c15d280edc9dfabf06d
          python3 -B -m unittest discover -s research/foundational/20261015-y-f55 -p test_fit_validation.py -v
      - name: One FIT-only independent online headroom training validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y55validation"
          python3 -B research/foundational/20261015-y-f55/online_fit_validation.py --fit-validation             > "$RUNNER_TEMP/y55validation/result.json"
          python3 -B - "$RUNNER_TEMP/y55validation/result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["stage"]=="DISJOINT_WITHIN_FIT_TRAIN_AND_VALIDATION_NOT_DIAGNOSTIC"
          assert d["heldout_DIAG_untouched"] and d["originals_untouched"]
          assert d["fitting_seeds"]==[611000,611008]
          assert d["fit_validation_seeds"]==[611008,611016]
          assert d["fit_validation_cases"]==32
          assert d["correct"]["public_full_graph_offline"]==32
          assert all(len(r["online"])==9 for r in d["rows"])
          assert all(max(r["payload_bytes"].values())<=144 for r in d["rows"])
          from collections import Counter
          totals=Counter()
          for row in d["rows"]:
              totals.update(row["online"])
          assert dict(totals)==d["correct"]
          print("Y_F55_FIT_ONLY_ONLINE_HEADROOM",json.dumps(d["correct"],sort_keys=True))
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/y55validation/SOURCE_SHA"
          (cd "$RUNNER_TEMP/y55validation" && sha256sum result.json > manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F55-within-FIT-online-vs-public-offline-headroom
          path: ${{ runner.temp }}/y55validation/
          retention-days: 90
          if-no-files-found: error
      - name: Exclusion
        run: echo "NO_DIAG_NO_ORIGINAL_NO_ACCEPTED_REFS_NO_NATIVE_576B_CLAIM"
