name: Read-only Yggdrasil external mechanistic qualification 20261012
on:
  push:
    branches:
      - 'contrib/chatgpt-20261012-y017-matching-causality'
    paths:
      - 'research/contrib/chatgpt/20261012-y017-matching-causality/**'
      - '.github/workflows/qualify-chatgpt-yggdrasil-20261012.yml'
permissions:
  contents: read
concurrency:
  group: read-only-20261012-yggdrasil-external
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused mechanical tests (not primary science)
        run: python -m unittest discover -s 'research/contrib/chatgpt/20261012-y017-matching-causality' -p 'test_probe.py' -v
      - name: Install frozen-project test dependencies
        run: python -m pip install -e ".[test]"
      - name: Complete Yggdrasil pytest regression
        run: python -m pytest -q tests
      - name: Execute sealed R016-baseline paired Y017 reused-data ablation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/contrib/chatgpt/20261012-y017-matching-causality/probe.py --paired-ablation-output "$RUNNER_TEMP/y017-paired-result.json"
          python -m json.tool "$RUNNER_TEMP/y017-paired-result.json"
      - name: Archive unaccepted independent Y017 experiment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: y017-paired-ablation-${{ github.run_id }}
          path: ${{ runner.temp }}/y017-paired-result.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve governance boundary
        run: echo 'REUSED_DATA_ABLATION_ONLY; NO_CKB_FIRST_USE; NO_ACCEPTED_REF_MUTATION; NO_PRODUCTION_AUTHORITY'
