name: Read-only Yggdrasil external mechanistic qualification 20261012
on:
  push:
    branches:
      - 'contrib/chatgpt-20261012-y017-matching-causality'
    paths:
      - 'research/contrib/chatgpt/20261012-y017-matching-causality/**'
      - '.github/workflows/qualify-chatgpt-yggdrasil-20261012.yml'
permissions:
  contents: read
concurrency:
  group: read-only-20261012-yggdrasil-external
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused mechanical tests (not primary science)
        run: python -m unittest discover -s 'research/contrib/chatgpt/20261012-y017-matching-causality' -p 'test_probe.py' -v
      - name: Install frozen-project test dependencies
        run: python -m pip install -e ".[test]"
      - name: Complete Yggdrasil pytest regression
        run: python -m pytest -q tests
      - name: Validate sealed Y017 experiment record without rerunning science
        run: |
          python -m json.tool 'research/contrib/chatgpt/20261012-y017-matching-causality/result.json' > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('research/contrib/chatgpt/20261012-y017-matching-causality/result.json').read_text())
          assert j['native_run_id']==38312196721
          assert j['frozen_R016_result_sha256']=='138d21335abc10e0eb7bddbbe5dd2a4e4b2ba5ea902d2319dc80eff637df2b29'
          assert j['greedy_failure_stage_count']==6 and j['matched_valid_stage_count']==6
          assert not j['independent_scientific_acceptance']
          print('Y017_SEALED_NONREPLAY_RECORD=PASS')
          PY
      - name: Preserve governance boundary
        run: echo 'REUSED_DATA_ABLATION_ONLY; NO_CKB_FIRST_USE; NO_ACCEPTED_REF_MUTATION; NO_PRODUCTION_AUTHORITY'
