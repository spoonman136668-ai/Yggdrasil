name: Yggdrasil Y078 novel affine transfer
on:
  push:
    branches: [research/y078-unseen-affine-transfer-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact parent, frozen executor and preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1069457f6a5b301686ec0e0edf674d7970818e7c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-y077-address-aware-decoder/execute.py)" = 57371b1dfd49045ea0ef258d841a98115738c297
          test "$(git hash-object research/contrib/chatgpt/20261014-y078-affine-transfer/execute.py)" = bfe8ae2e7ae26f5e3bb3fcf57e3c79e64d7c1a96
          test "$(git hash-object research/contrib/chatgpt/20261014-y078-affine-transfer/prereg.json)" = 49502c6fdb15289328498aca179ae1bcc22e31ff
          python3 -m py_compile research/contrib/chatgpt/20261014-y078-affine-transfer/execute.py
          python3 -m json.tool research/contrib/chatgpt/20261014-y078-affine-transfer/prereg.json >/dev/null
      - name: One prospective first-use on fresh sealed cohort
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-y078-affine-transfer/execute.py > /tmp/Y078-original.json
          python3 -m json.tool /tmp/Y078-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y078-original.json"))
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          assert a["sealed_heldout_seeds"]==list(range(9680,9696))
          assert len(a["paired_trials"])==1152 and len(a["breakdown"])==16
          assert a["classification"] in ("STEADY_SAFETY_FAILURE","ALL_NEW_AFFINE_FAMILIES_SAFE","AGGREGATE_ONLY_AFFINE_TRANSFER","PARTIAL_OR_FAILED_NEW_AFFINE_TRANSFER")
          print("CLASSIFICATION",a["classification"])
          print("BREAKDOWN",a["breakdown"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y078-original-affine-transfer
          path: /tmp/Y078-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
