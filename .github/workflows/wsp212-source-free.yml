name: WSP-212 Frozen Source-Free Refit and Cross-OS Qualification
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-212/**'
      - '.github/workflows/wsp212-source-free.yml'
permissions:
  contents: read

jobs:
  source_exact_os:
    name: WSP212 Python3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source receipt
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python --version
      - name: Mandatory original root full regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: WSP200 inherited full regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-200 -p 'test_*.py' -v
      - name: WSP209 inherited regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-209 -p 'test_*.py' -v
      - name: WSP210 smoke only; NEVER rerun invalid primary seeds
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-210 -p 'test_00_smoke.py' -v
      - name: WSP211 source-only allowlist test; do not reconsume old calibration
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-211 -p test_calibration.py -k strict_world_allowlist -v
      - name: WSP212 prereg, source fences and negative controls (no cohort labels)
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-212 -p 'test_*.py' -v
      - name: Source atlas check
        run: python scripts/build_code_atlas.py --check-if-present
      - name: ONE frozen WSP212 comparator calibration per OS
        run: python research/contrib/chatgpt/WSP-212/qualification.py --output "${{ runner.temp }}/wsp212-receipt.json"
      - name: Upload minimal source-free metrics, no model bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsp212-${{ matrix.os }}
          path: ${{ runner.temp }}/wsp212-receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean checkout
        run: git diff --exit-code

  frozen_cross_os_parity:
    needs: source_exact_os
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wsp212-ubuntu-24.04
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        with:
          name: wsp212-windows-2022
          path: artifacts/windows
      - name: Verify frozen metric parity and full convergence
        run: python research/contrib/chatgpt/WSP-212/verify_parity.py artifacts/linux/wsp212-receipt.json artifacts/windows/wsp212-receipt.json
      - name: Verify no checkout drift
        run: git diff --exit-code
