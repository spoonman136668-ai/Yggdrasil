name: WSP101 original-free paired causal DEV fixtures
on:
  push:
    branches: [research/wsp101-paired-transfer-causal-probes-20261114]
permissions:
  contents: read
jobs:
  dev-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove exact source, immutable plan, no original data
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 2e7c31d8579efca478b883de5a4c60aa9af729f5 HEAD
          git merge-base --is-ancestor 385b3a9b3dcbcf8509e7bc6609b3d3f4e74481a2 HEAD
          git diff --exit-code a24c6ec7d23e56b6462dcf43cbd4a72256a35ff3 HEAD -- research/contrib/chatgpt/WSP-98
          test ! -f research/contrib/chatgpt/WSP-101/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-101/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
      - name: Run only DEV paired-world validation
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-101 -p 'test_*.py' -v
      - name: Confirm no original first use and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f research/contrib/chatgpt/WSP-101/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-101/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
