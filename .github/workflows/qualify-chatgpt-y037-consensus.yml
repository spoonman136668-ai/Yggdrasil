name: Yggdrasil Y037 frozen mixed-feedback consensus
on:
  push:
    branches: [research/chatgpt-y037-consensus-gate-20261013]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate preregistration and source blob identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 09079bfed6628dc06f70018bf40453d97c20c24a HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-consensus/prereg.json)" = c8e2587760fa67eabd8697ec091ac9bb95707a5b
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-consensus/execute.py)" = 5592d094f5745895b0670776062900f4e771f568
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-consensus/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-consensus/execute.py
      - name: Original frozen Y037 science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-consensus/execute.py > /tmp/Y037-original.json
          python3 -m json.tool /tmp/Y037-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original-mixed-feedback-consensus
          path: /tmp/Y037-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
