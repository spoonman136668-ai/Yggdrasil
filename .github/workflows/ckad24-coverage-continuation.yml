name: CKAD24 cumulative coverage acquisition
'on':
  push:
    branches:
    - research/ckad13-integrated-cumulative-20261117
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  focused:
    if: 'github.event.head_commit.message == ''ci(ckad24): run frozen coverage continuation'''
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Frozen source imports, native interfaces and negative checks
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 02c595156ce9c9ef18d55c588fe7bdc99bf86a16 -- research/contrib/chatgpt/CKAD-24/prereg.json

        python -B research/contrib/chatgpt/CKAD-24/campaign.py --help
        python -B research/contrib/chatgpt/CKAD-24/independent_audit.py --help
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-24 -p 'test_*.py' -v
        python -B -m unittest discover -s tests -p test_native_cumulative_learner.py -v
        python -B -m unittest discover -s tests -p test_native_dtr_history.py -v
        python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
        test -z "$(git status --porcelain)"
  primary:
    needs:
    - focused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stable: ${{ steps.training.outputs.stable }}
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Run frozen cumulative training and all-control audit
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 02c595156ce9c9ef18d55c588fe7bdc99bf86a16 -- research/contrib/chatgpt/CKAD-24/prereg.json

        python -B research/contrib/chatgpt/CKAD-24/campaign.py --output-directory "$RUNNER_TEMP/ckad24-primary"
        python -B research/contrib/chatgpt/CKAD-24/independent_audit.py "$RUNNER_TEMP/ckad24-primary"
        python -B research/contrib/chatgpt/CKAD-24/audit_negative_controls.py "$RUNNER_TEMP/ckad24-primary"
        test -z "$(git status --porcelain)"
      id: training
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: CKAD24-coverage-primary
        path: ${{ runner.temp }}/ckad24-primary/
        if-no-files-found: warn
        retention-days: 30
  replication:
    needs:
    - primary
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CKAD24_EXPECTED_HASH: ${{ needs.primary.outputs.stable }}
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Windows semantic reproduction and raw control audit
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 02c595156ce9c9ef18d55c588fe7bdc99bf86a16 -- research/contrib/chatgpt/CKAD-24/prereg.json

        python -B research/contrib/chatgpt/CKAD-24/campaign.py --output-directory "$RUNNER_TEMP/ckad24-windows" --verify-env
        python -B research/contrib/chatgpt/CKAD-24/independent_audit.py "$RUNNER_TEMP/ckad24-windows"
        python -B research/contrib/chatgpt/CKAD-24/audit_negative_controls.py "$RUNNER_TEMP/ckad24-windows"
        test -z "$(git status --porcelain)"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: CKAD24-coverage-windows
        path: ${{ runner.temp }}/ckad24-windows/
        if-no-files-found: warn
        retention-days: 30
  seal:
    needs:
    - replication
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: true
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: CKAD24-coverage-primary
        path: ${{ runner.temp }}/ckad24-primary
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: CKAD24-coverage-windows
        path: ${{ runner.temp }}/ckad24-windows
    - name: Seal unchanged primary evidence and regenerate source atlas
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 02c595156ce9c9ef18d55c588fe7bdc99bf86a16 -- research/contrib/chatgpt/CKAD-24/prereg.json

        python -B research/contrib/chatgpt/CKAD-24/seal.py
        git add -- research/contrib/chatgpt/CKAD-24/
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'research(ckad24): preserve frozen coverage continuation outcomes'
        RESULT_SOURCE="$(git rev-parse HEAD)"
        python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
        git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
        git commit -m "docs(ckad24): exact cumulative source atlas at $RESULT_SOURCE"
        python -B scripts/build_code_atlas.py --check-if-present
        test -z "$(git status --porcelain)"
        git push origin HEAD:refs/heads/research/ckad13-integrated-cumulative-20261117
        echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      id: seal
      env:
        CKAD24_LINUX_DIRECTORY: ${{ runner.temp }}/ckad24-primary
        CKAD24_WINDOWS_DIRECTORY: ${{ runner.temp }}/ckad24-windows
        CKAD24_SOURCE_COMMIT: ${{ github.sha }}
        CKAD24_EVIDENCE_RUN: ${{ github.run_id }}
  final-qualified:
    needs:
    - seal
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.seal.outputs.candidate }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Exact-candidate complete regression
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
        git rev-parse HEAD HEAD^{tree}
        python -B -m unittest discover -s tests -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-24 -p 'test_*.py' -v
        python -B scripts/build_code_atlas.py --check-if-present
        test -z "$(git status --porcelain)"
      env:
        EXPECTED_CANDIDATE: ${{ needs.seal.outputs.candidate }}
  final-independent-g29:
    needs:
    - seal
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.seal.outputs.candidate }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Independent all-era evidence and source qualification
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
        git rev-parse HEAD HEAD^{tree}
        python -B scripts/build_code_atlas.py --check-if-present
        python -B -m unittest discover -s tests -p test_code_atlas.py -v
        for n in $(seq 13 24); do
          python -B "research/contrib/chatgpt/CKAD-$n/independent_audit.py"
        done
        python -B research/contrib/chatgpt/CKAD-24/audit_negative_controls.py
        test -z "$(git status --porcelain)"
      env:
        EXPECTED_CANDIDATE: ${{ needs.seal.outputs.candidate }}
