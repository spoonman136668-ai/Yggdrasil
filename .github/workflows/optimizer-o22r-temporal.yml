name: Optimizer O22-R temporal source-FIT revision audit
on:
  push:
    branches:
      - research/optimizer-o22r-temporal-revision-20261025
  pull_request:
    paths:
      - research/optimizer_o22r/**
      - .github/workflows/optimizer-o22r-temporal.yml
permissions:
  contents: read
  actions: read
jobs:
  bounded-units:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate source-first and original training corpus
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3ef8b83211747cb13e31f26870a4c658a14f2eae HEAD
          git merge-base --is-ancestor d4b36176a3f6534c4399a631712d3acc3760e0ba HEAD
          python -B -c "import json;p=json.load(open('research/optimizer_o22r/PREREG.json'));assert p['evaluation']['original_environment_resets_or_steps_added']==0"
      - name: Native temporal and independent conventional public source grammar
        run: python -B -m unittest -v research.optimizer_o22r.test_temporal

  real-old-FIT-only:
    needs: bounded-units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download immutable prior original selected action FIT only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o22r-frozen" "$RUNNER_TEMP/o22r-results"
          gh run download 40186158097 --repo "$GITHUB_REPOSITORY" --name optimizer-o22o-authentic-original-turn-action-FIT-receipts --dir "$RUNNER_TEMP/o22r-frozen"
          python -B -c "import json,os,pathlib,hashlib;d=json.load(open('research/optimizer_o22p/PREREG.json'))['source_artifact'];p=pathlib.Path(os.environ['RUNNER_TEMP'])/'o22r-frozen';assert hashlib.sha256((p/'fit-1.json').read_bytes()).hexdigest()==d['fit1_file_sha256'] and hashlib.sha256((p/'fit-2.json').read_bytes()).hexdigest()==d['fit2_file_sha256']"
          echo 'O22R_ONLY_ORIGINAL_PREEXISTING_FIT=PASS'
      - name: Independent conditional temporal vs native memory audit
        shell: bash
        run: |
          set -euo pipefail
          python -B research/optimizer_o22r/evaluate.py --source-dir "$RUNNER_TEMP/o22r-frozen" --out "$RUNNER_TEMP/o22r-results/comparison.json"
          python -B -m json.tool "$RUNNER_TEMP/o22r-results/comparison.json"
      - name: Archive complete internal source FIT temporal certificate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22r-temporal-original-FIT-controls
          path: ${{ runner.temp }}/o22r-results/
          if-no-files-found: warn
          retention-days: 80
