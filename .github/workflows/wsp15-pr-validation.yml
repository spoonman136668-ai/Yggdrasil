name: WSP-15 numerical structural plasticity full public DEV regression
on:
  pull_request:
    branches:
      - research/wsp14-nand-operation-synthesis-20261110
    paths:
      - 'research/contrib/chatgpt/WSP-15/**'
      - '.github/workflows/wsp15-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full original WSP01-15 regression and all predecessor DEV evaluators
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/contrib/chatgpt/WSP-15/qualify.py
