name: AAI-07 observation-only navigator mechanical probe
on:
  push:
    branches: [research/aai07-independent-minigrid-memory-20261114]
    paths: [.github/workflows/aai07-navigator-mechanical.yml]
permissions:
  contents: read
jobs:
  reserved-seed-navigator:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-07 observation-only navigator mechanical probe' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-only and no scientific seed custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'edcac052aa4e587a5faf9cdf49293e86d4f23b18'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai07-navigator-mechanical.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07/navigator_probe.py)" = "$(git rev-parse edcac052aa4e587a5faf9cdf49293e86d4f23b18:research/contrib/chatgpt/AAI-07/navigator_probe.py)"
          echo AAI07_NAVIGATOR_RESERVED_SEED_ONLY=PASS
      - name: Install immutable official benchmark with pinned wheels
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/upstream" fetch -q --no-tags --depth 1 origin 64e1eaec904bc35e7de041167274e2c0dfe541d2
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD:minigrid/envs/memory.py)" = '660b0a1b769948034c87bb421759c2b9a4f24548'
          python -m pip install --disable-pip-version-check --no-input numpy==1.26.4 gymnasium==1.2.2 pygame-ce==2.5.8 networkx==3.4.2
          python -m pip install --disable-pip-version-check --no-input --no-deps -e "$RUNNER_TEMP/upstream"
      - name: Probe observation-only control on reserved seeds (no scientific conclusions)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-07/navigator_probe.py
          test -z "$(git status --porcelain)"
          echo AAI07_NAVIGATOR_MECHANICAL_COMPLETE=PASS
