name: AAI-10B frozen semantic parity + synthetic cost (NO science first use)
on:
  push:
    branches: [research/aai10b-exact-association-cache-20261114]
    paths: [.github/workflows/aai10b-source-atlas.yml]
permissions:
  contents: write
concurrency:
  group: aai10b-source-only-20261114
  cancel-in-progress: false
jobs:
  synthetic:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10B frozen exact source-only parity and efficiency one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact frozen original and preregistered independent source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '03f3e2057322049f713bb747260c2d07082c455d'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10b-source-atlas.yml'
          test "$(git rev-parse 373800d13bdb8ba1d149c8b0bd3f2f4c98db824e^)" = '64a585010e13519c6290cc8c406154e1f23b9e78'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10B/prereg.json)" = '3dddd98d14d9c3941d542d06848e82c59c0a1dfd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10B/prereg.json)" = "$(git rev-parse 373800d13bdb8ba1d149c8b0bd3f2f4c98db824e:research/contrib/chatgpt/AAI-10B/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10B/cached.py)" = 'b651931e7fdc5bcea1ce88954368e66655dda188'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10B/test_cached.py)" = '72a6ba32c0df9a394f0272cb7dfb9ef7825767ba'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10B/profile_dev.py)" = 'd4b4291fc5a554b44d83693302e83660cb8455ae'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/models.py)" = '9233ffaafe2f227de687116b0ed4204ee4e2b3a2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          test -z "$(git status --porcelain)"
          echo AAI10B_ORIGINAL_BLOBS_AND_PREREG_BEFORE_CODE_PASS
      - name: Exact frozen learner equivalence, cache reset and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10B -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-10B/profile_dev.py --primary >/dev/null 2>&1; then
            echo AAI10B_SCIENCE_FIRST_USE_NOT_DISARMED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI10B_SOURCE_PARITY_NO_SCIENCE_PASS
      - name: THREE mechanical-only matched resource profiles, NOT science
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-10B/profile_dev.py --dev
          test -z "$(git status --porcelain)"
          echo AAI10B_SYNTHETIC_COST_COLLECTED_NO_COHORT_CONSUMPTION
  atlas:
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly the existing three G29 atlas files only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '03f3e2057322049f713bb747260c2d07082c455d'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-10B generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai10b-exact-association-cache-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai10b-exact-association-cache-20261114
          echo AAI10B_PINNED_GENERATED_ONLY_ATLAS_PASS
