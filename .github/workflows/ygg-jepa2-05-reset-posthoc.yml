name: YGG-JEPA2-05 archival posthoc reset diagnostic only
'on':
  push:
    branches:
      - research/jepa2-05-context-reset-readonly-20261119
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  archived-reset-only:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Byte-stable checkout of exact standalone research branch
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original exact JEPA2 numeric dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Verify frozen code, immutable original data and prereg parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD 7b0d9fd8c16b8e0433a632666cec88d8d008c19f)" = 7b0d9fd8c16b8e0433a632666cec88d8d008c19f
          git diff --exit-code 7b0d9fd8c16b8e0433a632666cec88d8d008c19f HEAD -- yggdrasil research/contrib/chatgpt/YGG-JEPA2-05 research/contrib/chatgpt/YGG-RET01
          test "$(git rev-parse HEAD^:research/contrib/chatgpt/YGG-JEPA2-05-RESET-POSTHOC/prereg.json)" = "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-05-RESET-POSTHOC/prereg.json)"
          python -B -m py_compile research/contrib/chatgpt/YGG-JEPA2-05-RESET-POSTHOC/diagnose.py
      - name: Cold restore, historical same-witness reset ablation, no fresh source
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/YGG-JEPA2-05-RESET-POSTHOC/diagnose.py --platform ${{ matrix.platform }} --output "$RUNNER_TEMP/jepa-reset/result.json"
          test -s "$RUNNER_TEMP/jepa-reset/result.json"
      - name: Mandatory inherited full native regression on this exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jepa2-reset-readonly-${{ matrix.platform }}
          path: ${{ runner.temp }}/jepa-reset/
          if-no-files-found: warn
          retention-days: 30
