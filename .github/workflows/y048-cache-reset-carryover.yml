name: Yggdrasil Y048 matched cache reset carryover falsification
on:
  push:
    branches: [research/y048-cache-reset-carryover-causality-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on frozen predecessor and experiment hashes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c835fbfc7608dba59d68993228a4a567c0844645 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y047-periodic-probes/execute.py)" = ae402e946c2d4ea71696c89089d088d6846b74cc
          test "$(git hash-object research/contrib/chatgpt/20261013-y048-cache-reset/prereg.json)" = b5cabafef91c38eaec02d1d3f33a75e28078d3e2
          test "$(git hash-object research/contrib/chatgpt/20261013-y048-cache-reset/execute.py)" = 39f73f5afe9a3bc0a0c87869c164fea4a93e801b
          python3 -m json.tool research/contrib/chatgpt/20261013-y048-cache-reset/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y048-cache-reset/execute.py
      - name: First frozen heldout cache-reset science, no repeat use
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y048-cache-reset/execute.py >/tmp/Y048-first.json
          python3 -m json.tool /tmp/Y048-first.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y048-first.json'))
          assert x['sealed_heldout_seeds']==list(range(1528,1544))
          assert len(x['by_family'])==4
          print('CLASSIFICATION',x['classification'])
          print('MATCHED_MISMATCHES',x['aggregate_paired_mismatches'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y048-original-matched-cache-reset
          path: /tmp/Y048-first.json
          retention-days: 90
          if-no-files-found: error
      - name: One full repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
