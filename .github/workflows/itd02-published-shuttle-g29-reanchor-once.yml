name: ITD-02 published Shuttle source G29 exact-index refresh
on:
  push:
    branches:
      - research/itd02-published-shuttle-public-source-20261027
    paths:
      - .github/workflows/itd02-published-shuttle-g29-reanchor-once.yml
permissions:
  contents: write
concurrency:
  group: itd02-published-shuttle-original-source-g29-once
  cancel-in-progress: false
jobs:
  source-index:
    if: ${{ github.actor == 'spoonman136668-ai' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify unchanged learner and one-time index scope
        shell: bash
        run: |
          set -euo pipefail
          source='22b8ad4f4c12e7efa00b1832bd57233be908a16b'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$source" HEAD
          test "$(git rev-list --count "$source"..HEAD)" = 1
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff --name-only "$source" HEAD)"
          test "$changed" = '.github/workflows/itd02-published-shuttle-g29-reanchor-once.yml'
          echo 'PUBLISHED_SHUTTLE_INTEGRATION_EXACT_SOURCE=PASS'
      - name: Rebuild only existing G29 source locators and run source-free tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python -m unittest discover -s tests -p test_itd02_published_shuttle_source_dev.py -v
          python -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
          python -m unittest discover -s tests -p test_itd02_native_task_bridge_dev.py -v
      - name: Commit and verify only generated atlas outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/itd02-published-shuttle-public-source-20261027
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          actual="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(itd02): source-pin published Shuttle adapter and native session'
          python scripts/build_code_atlas.py --check-if-present
          python -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/research/itd02-published-shuttle-public-source-20261027
          echo 'PUBLISHED_SHUTTLE_G29_SOURCE_QUALIFIED=PASS'
