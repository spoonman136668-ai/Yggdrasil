name: QTR-01 F50 corrected unknown-target graph and bounded source training
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 target-unknown parity derive G29'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source training entry and frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '8a23b7e5ff1401af36a7c6070dbf41685ff9c402'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f50-source-fit-bounded.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_fit.py)" = 'cb4fbf8ebf26cb2feded2bc0c9ee2ae6b9de877c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_conventional_controls.py)" = '01c3b1d0540af5911518850cf30b5b7522425a98'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_target_public_controls.py)" = '05f54f3b7f517d0eb23ccdb133b3a81988ec29f7'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_conventional_controls.py)" = '3c04fa3bc68293897f6158cded97728fd9b3786e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_target_public_controls.py)" = '8862b6784ab96a75a143791efc9fdaaaa0a35ae1'
          test -z "$(git status --porcelain)"
          echo F50_HIGH_FIRST_SOURCE_FIT_FROZEN=PASS
      - name: Derive exact G29 source atlas only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F50 target-unknown G29 atlas'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "F50_SOURCE_FIT_G29_COMPANION_SHA=$(git rev-parse HEAD)"
  qualify:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 target-unknown parity and source fit exact'
    name: F50 source-fit exact-SHA regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Windows byte stable checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact SHA/source/atlas qualification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test "$(git log -1 --format=%s)" = 'ci(qtr): F50 target-unknown parity and source fit exact'
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): derive F50 target-unknown G29 atlas'
          git merge-base --is-ancestor 8a23b7e5ff1401af36a7c6070dbf41685ff9c402 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_fit.py)" = 'cb4fbf8ebf26cb2feded2bc0c9ee2ae6b9de877c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_conventional_controls.py)" = '01c3b1d0540af5911518850cf30b5b7522425a98'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_target_public_controls.py)" = '05f54f3b7f517d0eb23ccdb133b3a81988ec29f7'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_conventional_controls.py)" = '3c04fa3bc68293897f6158cded97728fd9b3786e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_target_public_controls.py)" = '8862b6784ab96a75a143791efc9fdaaaa0a35ae1'
          python scripts/build_code_atlas.py --check
          echo F50_HIGH_FIRST_SOURCE_EXACT_SHA=PASS
      - name: Install pinned CPU tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Focused F50 source/no-target tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f50_*.py' -v
      - name: Mandatory original regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory full contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Final source only no first-use fence
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_SOURCE_AND_MODEL_UNMODIFIED=PASS
  source-fit:
    needs: qualify
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 target-unknown parity and source fit exact'
    name: F50 4096-source-law bounded first-fit (no target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-only pinned CPU toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
      - name: High-first 4096 source FIT only with 600 CPU second stop
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f50_source_fit.py --source-only --source-commit "$GITHUB_SHA" --bank 4096 --cpu-budget-seconds 600 --output "$RUNNER_TEMP/f50-source-fit"
          F50_RECEIPT="$RUNNER_TEMP/f50-source-fit/f50-source-fit-receipt.json" python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['F50_RECEIPT'])
          r=json.loads(p.read_text())
          assert r['size']==4096 and r['target_outcomes']==0 and r['scientific_pass'] is False
          assert r['source']['fit_laws']==3276 and r['source']['validation_laws']==820
          assert r['status'] in ('RESOURCE_STOP','ALL_THREE_SOURCE_ONLY_TRAINED')
          print('F50_HIGH_FIRST_4096_STATUS='+r['status'],flush=True)
          print('F50_FITTED_MODEL_COUNT='+str(len(r['models'])),flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f50-4096-source-only-target-unknown-parity-v2
          path: ${{ runner.temp }}/f50-source-fit/
          retention-days: 30
          if-no-files-found: warn
      - name: Confirm clean source and no development target
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo F50_NO_DEVELOPMENT_TARGET_FIRST_USE=PASS
