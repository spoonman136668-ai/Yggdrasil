name: Yggdrasil NCI05 frozen native StatePool multiedge first-use
on:
  push:
    branches: [research/y-nci05-multiedge-statepool-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install native Yggdrasil runtime
        run: python3 -m pip install -e '.[test]'
      - name: Exact original source and frozen NCI05 preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e403542948fcaae1353c1292079e336f5347c72f HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-y-nci02-learned-join/execute.py)" = 358227bfc7b331e00fe6fe39c9d76346754ef678
          test "$(git hash-object src/yggdrasil/pool.py)" = 0580da8f1a111c8c0b7b4ebfa51c2128865e7a8a
          test "$(git hash-object research/contrib/chatgpt/20261014-y-nci05/execute.py)" = 204e71635907f0f9cc589a53fe8f075c1d92765a
          test "$(git hash-object research/contrib/chatgpt/20261014-y-nci05/prereg.json)" = 1b0760c9025787487c6de249e1c68ec5cd901e3f
          python3 -m py_compile research/contrib/chatgpt/20261014-y-nci05/execute.py
          python3 -m json.tool research/contrib/chatgpt/20261014-y-nci05/prereg.json >/dev/null
      - name: Development-only learned join and admission qualification
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -B research/contrib/chatgpt/20261014-y-nci05/execute.py --phase development > /tmp/y05-dev.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/y05-dev.json"))
          assert d["phase"]=="development" and d["sealed_seed_range"]==[24640,24664]
          assert d["join_params"]==6 and d["admission_params"]==4
          assert d["native_state_bytes"]==576 and d["active_edge_cap"]==7
          assert not d["nci01_full_acceptance"] and not d["accepted_ref_mutation"]
          print("Y05_DEV_QUALIFIED",d["join_dev_accuracy"])
          PY
      - name: Execute exactly one original prospective sealed native StatePool study
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          PYTHONPATH=src python3 -B research/contrib/chatgpt/20261014-y-nci05/execute.py --phase sealed > /tmp/y05-original.json
          end=$(date +%s%N)
          printf '{"elapsed_wall_ms":%s,"runner":"ubuntu-latest","cost_usd":"unverified"}\n' "$(((end-start)/1000000))" > /tmp/y05-resource.json
          python3 -m json.tool /tmp/y05-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-NCI05-original-frozen-multiedge
          path: |
            /tmp/y05-original.json
            /tmp/y05-resource.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify frozen scientific result only after evidence archive
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open("/tmp/y05-original.json"))
          assert d["phase"]=="sealed" and d["sealed_seed_range"]==[24640,24664]
          assert len(d["records"])==96
          assert collections.Counter(x["motif"] for x in d["records"])=={m:24 for m in d["motifs"]}
          assert d["checkpoint_restores"]==96 and d["peak_multiedge_entries"]<=7
          assert d["verdict"] in ("BOUNDED_MULTIEDGE_STORAGE_RESTORES_CODED_COMPOSITION",
              "MULTIEDGE_COMPONENT_TRANSFER_WITHOUT_BASELINE_CONTRAST",
              "BOUNDED_MULTIEDGE_STORAGE_DID_NOT_RESTORE_COMPOSITION")
          assert d["external_llm_calls"]==0 and not d["accepted_ref_mutation"]
          assert not d["nci01_full_acceptance"]
          print("Y05_CLASSIFICATION",d["verdict"])
          print("Y05_MOTIF_RESULTS",d["accuracy_by_motif"])
          print("Y05_JOIN_EVALUATIONS",d["multiedge_join_candidate_evaluations"],d["baseline_join_candidate_evaluations"])
          PY
      - name: Final full native Yggdrasil repository pytest regression
        run: python3 -m pytest -q tests
