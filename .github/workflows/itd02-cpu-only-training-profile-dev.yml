name: ITD-02 CPU-only native training cost and crash-durable custody development
on:
  push:
    branches:
      - research/itd02-public-custody-crash-retail-profile-20261027
  pull_request:
    paths:
      - scripts/itd02_native_retail_resource_profile_dev.py
      - tests/test_itd02_public_source_journal_dev.py
      - .github/workflows/itd02-cpu-only-training-profile-dev.yml
permissions:
  contents: read
jobs:
  source-free-metrics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Process-kill / real cold recovery regression on exact native source
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_itd02_public_source_journal_dev.py -v
          if ($LASTEXITCODE -ne 0) { throw "PUBLIC_CUSTODY_POWER_INTENT_TESTS_FAILED" }
      - name: Measure only SOURCE-FREE whole-process CPU learning and checkpoint costs
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'native-sourcefree-resource-profile.json'
          python -B -m scripts.itd02_native_retail_resource_profile_dev --episodes 8 --steps 16 --output "$out"
          if ($LASTEXITCODE -ne 0) { throw "SOURCEFREE_RESOURCE_PROFILE_FAILED" }
          $m = Get-Content -Raw "$out" | ConvertFrom-Json
          if ($m.classification -ne 'SOURCE_FREE_ENGINEERING_ONLY' -or $m.source_is_original_published_shuttle -ne $false -or $m.not_retail_hardware_acceptance -ne $true -or $m.public_action_interactions -ne 128 -or $m.native_cold_restores -ne 8 -or $m.process_cpu_seconds -lt 0 -or $m.wall_seconds -le 0 -or $m.total_on_disk_checkpoints_bytes -le 0 -or $m.total_on_disk_public_event_journal_bytes -le 0) {
            throw "SOURCEFREE_RESOURCE_PROFILE_INVALID"
          }
          if ($m.peak_process_resident_bytes -eq $null -or $m.peak_process_resident_bytes -le 0 -or $m.resident_memory_final_bytes -eq $null -or $m.resident_memory_final_bytes -le 0) {
            throw "PROCESS_RSS_MEASUREMENT_UNAVAILABLE"
          }
          "SOURCEFREE_CPU_PROFILE_OS=$($m.environment.os)" >> $env:GITHUB_STEP_SUMMARY
          "SOURCEFREE_PUBLIC_INTERACTIONS=$($m.public_action_interactions)" >> $env:GITHUB_STEP_SUMMARY
          "SOURCEFREE_CPU_SECONDS=$($m.process_cpu_seconds)" >> $env:GITHUB_STEP_SUMMARY
          "SOURCEFREE_WALL_SECONDS=$($m.wall_seconds)" >> $env:GITHUB_STEP_SUMMARY
          "SOURCEFREE_PEAK_PROCESS_RSS_BYTES=$($m.peak_process_resident_bytes)" >> $env:GITHUB_STEP_SUMMARY
          "HOSTED_RUNNER_NOT_RETAIL_ACCEPTANCE=TRUE" >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve pristine checkout
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -ne 0) { throw "DEVELOPMENT_PROFILE_CHECKOUT_DIRTY: $($dirty -join ', ')" }
