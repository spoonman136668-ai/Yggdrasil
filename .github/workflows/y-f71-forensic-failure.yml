name: Yggdrasil F71 frozen synthetic failure forensics
on:
  push:
    branches: [research/y-f71-learned-early-intervention-precode-20261016-r1]
permissions:
  contents: read
jobs:
  original-source-forensic:
    if: "${{ github.event.head_commit.message == 'ci(y-f71): audit failed frozen scheduler with no protected source access' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce original source, method, prereg and forensic identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/foundational/20261016-y-f71/prereg.json)" = b3e0f8c32ad639079fcf6ab85fd8b17f6285acdc
          test "$(git hash-object research/foundational/20261016-y-f71/early_scheduler.py)" = edddfedb04af27dac7332ca85cc742aef5772a4b
          test "$(git hash-object research/foundational/20261016-y-f71/forensic_exposed_synthetic.py)" = f429ee0569c29b4b9620311125eeeafa8236a21a
      - name: Replay read-only exposed synthetic cohort and quantify harmful actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f71-forensics/"
          python3 -B research/foundational/20261016-y-f71/forensic_exposed_synthetic.py > "$RUNNER_TEMP/y-f71-forensics/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f71-forensics/result.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f71-forensics/result.json")));print("F71_FROZEN_SCORES",d["trained_correct"],d["frozen_F60_correct"]);print("F71_FROZEN_INTERVENTIONS",d["early_interventions"],d["total_selected_counterfactual_decisions"]);print("F71_BENEFICIAL_HARMFUL_NEUTRAL",d["beneficial_decisions"],d["harmful_decisions"],d["neutral_decisions"]);print("F71_SCIENTIFIC_PREQUAL",d["prereg_prequalification_pass"]);assert not d["protected_FIT_train_used"] and not d["prereg_prequalification_pass"]'
          sha256sum "$RUNNER_TEMP/y-f71-forensics/result.json" > "$RUNNER_TEMP/y-f71-forensics/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f71-forensics/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f71-frozen-scheduler-failure-forensics
          path: ${{ runner.temp }}/y-f71-forensics/
          retention-days: 90
