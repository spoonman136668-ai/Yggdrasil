name: YGG CAP04 v2 fixture-only entropy custody negative controls and G29
'on':
  push:
    branches:
      - research/ygg-cap04-v2-fixture-custody-contract-20261119
    paths:
      - '.github/workflows/ygg-cap04-v2-fixture-custody.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Disable checkout line-ending transforms
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualified v2 source provenance and toy-key negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 21018408152a849024518a37b79540f2c253379a
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/ygg-cap04-v2-fixture-custody.yml"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/custody_fixture_contract.py)" = 8ba898531b9bfa0b9066ce2fe1ff9befab3922d1
          test "$(git rev-parse HEAD:tests/test_cap04_v2_fixture_custody.py)" = 5826ae5c319b6d105223e3d8006d93650b7bdcfb
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source_v2.py)" = fd42459ba94210c97c94b6cf816ac38d7587c26f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prereg.json)" = 1d79e222685ea1a6889bff49e5bf405a9aed9580
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          python -B -m unittest discover -s tests -p 'test_cap04_keyed_source_v2.py' -v
          python -B -m unittest discover -s tests -p 'test_cap04_v2_fixture_custody.py' -v
          test -z "$(git status --porcelain)"
          echo "CAP04_V2_ENGINEERING_MOCK_CUSTODY_FIXTURE_PASS"
  atlas:
    needs: fixture
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.actor == 'spoonman136668-ai' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Preserve line ending custody
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reanchor only G29 artifacts after successful two-platform fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 21018408152a849024518a37b79540f2c253379a
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/ygg-cap04-v2-fixture-custody.yml"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/custody_fixture_contract.py)" = 8ba898531b9bfa0b9066ce2fe1ff9befab3922d1
          test "$(git rev-parse HEAD:tests/test_cap04_v2_fixture_custody.py)" = 5826ae5c319b6d105223e3d8006d93650b7bdcfb
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prospective_source_v2.py)" = fd42459ba94210c97c94b6cf816ac38d7587c26f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP04/prereg.json)" = 1d79e222685ea1a6889bff49e5bf405a9aed9580
          test -z "$(git status --porcelain)"
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' '|')" = ".ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json|"
          test -z "$(git diff --name-only)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(cap04): source-pin v2 mock custody fixture $SOURCE"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/ygg-cap04-v2-fixture-custody-contract-20261119"
          echo "CAP04_V2_MOCK_CUSTODY_ATLAS_SOURCE=$SOURCE"
          echo "CAP04_V2_MOCK_CUSTODY_ATLAS_CANDIDATE=$(git rev-parse HEAD)"
