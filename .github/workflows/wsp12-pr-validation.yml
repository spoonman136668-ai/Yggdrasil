name: WSP-12 numeric pair-rule selection public DEV regression
on:
  pull_request:
    branches:
      - research/wsp11-affine-partial-evidence-20261110
    paths:
      - 'research/contrib/chatgpt/WSP-12/**'
      - '.github/workflows/wsp12-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate candidate G29 snapshot without source mutation
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }}
      - name: Emit bounded candidate G29 atlas chunks for independent pinning
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import subprocess
          from pathlib import Path
          from scripts import build_code_atlas as atlas
          root = Path(".").resolve()
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          artifacts = atlas.render(atlas.snapshot(root, sha))
          for path, content in artifacts.items():
              encoded = base64.b64encode(content.encode("utf-8")).decode("ascii")
              for offset in range(0, len(encoded), 1800):
                  print("WSP12_ATLAS_PART|" + path + "|" +
                        str(offset // 1800) + "|" + encoded[offset:offset + 1800])
          PY
      - name: Original full Yggdrasil suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: All previous WSP-01 through WSP-11 suites
        shell: bash
        run: |
          for n in 01 02 03 04 05 06 07 08 09 10 11; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: WSP-12 focused numeric-rule tests
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-12 -p 'test_*.py' -v
      - name: WSP-12 exhaustive frozen evaluator
        run: python research/contrib/chatgpt/WSP-12/run_dev.py
      - name: Reject source mutations
        run: git diff --exit-code
