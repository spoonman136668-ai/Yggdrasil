name: MR27A Original Natural Current-Input Sufficiency
on:
  push:
    branches:
      - research/mr27a-original-input-sufficiency-20261021
  pull_request:
    branches:
      - research/mr25b-natural-public-twin-audit-20261021
permissions:
  contents: read
concurrency:
  group: mr27a-native-input-sufficiency-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-native-strict-history-input-falsifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve Windows Git checkout bytes before sources
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact MR27A natural source ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original independent Farama upstream exact native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 original source native
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check independent original Farama blobs and license discrepancy
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install fixed original source dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Reproduce authentic MR25B source receipt and audit entire current input
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr27a.probe_original_input_sufficiency ../external/minigrid | tee ../mr27a-qualified-receipt.log
          grep -q '^MR27A_NATURAL_ORIGINAL_CURRENT_INPUT_SUFFICIENCY=' ../mr27a-qualified-receipt.log
      - name: Both original Git source checkouts unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C external/minigrid status --porcelain)"
