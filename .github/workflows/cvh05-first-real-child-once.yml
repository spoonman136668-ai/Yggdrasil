name: CVH-05 frozen original causal MDP in child OS process, constructor-only
on:
  push:
    branches: [qualification/cvh05-real-child-first-20261116]
    paths: [.github/workflows/cvh05-first-real-child-once.yml]
permissions:
  contents: read
concurrency:
  group: cvh05-pinned-real-child-constructor-only-20261116
  cancel-in-progress: false
jobs:
  source-custody-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'CVH-05 frozen test launcher correction and authentic source constructor'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: bf7aad5f6c2eb0b14bad7c5e32f8f95cb3cd825e
      UPSTREAM_PIN: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent checkout CRLF/source mutation
        run: git config --global core.autocrlf false
      - name: Verify frozen source with read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf7aad5f6c2eb0b14bad7c5e32f8f95cb3cd825e
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check prereg before first score plus all code/test source hashes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-05/prereg.json)" = 3464c291eb725adcc2233598305aa0f25379705d
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-05/source_child.py)" = 194b96985307390b4c09b68fc0a9767ff294d2f5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-05/constructor_ipc.py)" = dc5fcce0acfa5cc8f64c5a9dc6caf8c5fe87d11f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-05/probe_original_child.py)" = 6c3ac735a10150c4d932594262c016ab93f64ae6
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-05/test_constructor_ipc.py)" = a9c953ca6d81c7b4b65b4270de6d0159cd7a6a10
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-03/source_binding.py)" = 7d38d861044d844f4bd8f59c1e234c4d7f01ee76
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-04/public_ipc.py)" = 75f85dc2b6305a5089052a473fae113d6254ad9c
          test -z "$(git status --porcelain)"
          echo CVH05_SOURCE_PREREG_AND_ALL_CODE_PIN_PASS
      - name: Frozen 20 source-free parent/child protocol tests, no third-party imports
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CVH-05 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
          echo CVH05_SOURCEFREE_STRICT_PROTOCOL_20_TESTS_PASS
      - name: Exact FKP25 prior dependency versions, not new APIs
        run: |
          set -euo pipefail
          python -m pip install --no-input --disable-pip-version-check numpy==1.26.4 gymnasium==0.29.1 networkx==3.2.1 toposort==1.10 pydash==8.0.5
          python -B - <<'PY'
          from importlib import metadata as md
          pins={'numpy':'1.26.4','gymnasium':'0.29.1','networkx':'3.2.1','toposort':'1.10','pydash':'8.0.5'}
          assert {k:md.version(k) for k in pins}==pins
          print('CVH05_EXACT_INHERITED_PYTHON_DEPENDENCIES_PASS')
          PY
      - name: Fetch exact unchanged original upstream source only
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --filter=blob:none https://github.com/CausalAILab/Causal-Gymnasium.git "$RUNNER_TEMP/causal-original"
          git -C "$RUNNER_TEMP/causal-original" fetch --quiet --no-tags --depth=1 origin "$UPSTREAM_PIN"
          git -C "$RUNNER_TEMP/causal-original" checkout --quiet --detach "$UPSTREAM_PIN"
          test "$(git -C "$RUNNER_TEMP/causal-original" rev-parse HEAD)" = "$UPSTREAM_PIN"
          test -z "$(git -C "$RUNNER_TEMP/causal-original" status --porcelain)"
          echo CVH05_ORIGINAL_UPSTREAM_EXACT_PIN_PASS
      - name: Genuine unchanged original causal MDPPCH inside two source processes
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CVH-05/probe_original_child.py --checkout "$RUNNER_TEMP/causal-original" --out "$RUNNER_TEMP/cvh05-real.json" > "$RUNNER_TEMP/cvh05-real.stdout"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'cvh05-real.json').read_text())
          assert r['source_sha']=='c94e9a4cd3641588b6b8507e71ccee5c27032bdf'
          assert r['original_objects_constructed']==2
          assert r['two_separately_reaped_source_processes'] is True
          assert r['original_source_actions']==r['original_source_resets']==r['source_seed_first_uses']==0
          assert r['accepted_model_changed'] is False
          assert r['scientific_pass'] is False and r['source_first_use'] is False
          assert r['native_learned_return_not_executed'] is True
          print('CVH05_ORIGINAL_IN_CHILD_REAL_CONSTRUCTOR_TWO_PROCESSES_PASS')
          print('CVH05_ORIGINAL_CHILD_PUBLIC_CUSTODY_SHA256='+r['public_custody_sha256'])
          PY
          test -z "$(git -C "$RUNNER_TEMP/causal-original" status --porcelain)"
          test -z "$(git status --porcelain)"
      - name: Hard deny real environment actions and keep all protected cohorts unopened
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if python -I -B research/contrib/chatgpt/CVH-05/source_child.py --checkout "$RUNNER_TEMP/causal-original" >/dev/null 2>&1; then exit 1; fi
          if python -B research/contrib/chatgpt/CVH-05/probe_original_child.py --checkout "$RUNNER_TEMP/causal-original" --out "$RUNNER_TEMP/forbidden.json" --source-action >/dev/null 2>&1; then exit 1; fi
          if test -d "$RUNNER_TEMP/causal-original/.git"; then
            test "$(git -C "$RUNNER_TEMP/causal-original" rev-parse HEAD)" = "$UPSTREAM_PIN"
            test -z "$(git -C "$RUNNER_TEMP/causal-original" status --porcelain)"
          fi
          test -z "$(git status --porcelain)"
          echo CVH05_FIRSTUSE_REAL_ORIGINAL_ACTIONS_ZERO_AND_CLEAN_PASS
