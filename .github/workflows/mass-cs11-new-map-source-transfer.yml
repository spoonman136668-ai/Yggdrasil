name: Mass CS11 genuine original POBAX few-shot new-map rewarded transfer
on:
  push:
    branches:
      - research/mass-cs11-source-original-new-map-transfer-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs11-new-map-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-new-map-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout FIRST frozen-prereg research implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Fail-closed first-only prereg ancestry and additive file scope
        shell: bash
        run: |
          set -euo pipefail
          first=443139b861888816cf26156cef8a26a4a41b546c
          parent=416b0e92c345994d48885a583dd89e74790d62a7
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS11_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS11_PREREG.md","research/native/itd01/mass_r10/run_cs11_original_new_map_transfer.py","research/native/itd01/mass_r10/test_cs11_original_new_map_transfer.py",".github/workflows/mass-cs11-new-map-source-transfer.yml"};assert got==want,(got,want)'
      - name: Checkout unchanged original external POBAX source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taodav/pobax
          ref: a5e1d62d14e4efe783885b9d4f19cffa2a568eec
          path: external/pobax-original
          persist-credentials: false
      - name: Set original source Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded original POBAX CPU JAX dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs11-evidence
          set +e
          timeout 480s python -m pip install --no-cache-dir --timeout 35 --retries 1 'jax==0.6.2' 'jaxlib==0.6.2' chex gymnax flax brax >cs11-evidence/pip-install.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 60s python -m pip install --no-deps -e external/pobax-original >>cs11-evidence/pip-install.log 2>&1
            rc=$?
          fi
          set -e
          printf '%s\n' "$rc" >cs11-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Test first source-free transfer prior and equal-FIT learned controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs11_original_new_map_transfer.py 2>&1 | tee cs11-evidence/focused-tests.log
      - name: Run source-native 84 FIT and 3024 fresh-map real rewarded DEV episodes
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs11_original_new_map_transfer.py \
            --upstream external/pobax-original --out cs11-evidence/
      - name: Preserve positive, negative and failure evidence without rerunning original source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs11-original-new-map-rewarded-transfer
          path: cs11-evidence/
          retention-days: 30
