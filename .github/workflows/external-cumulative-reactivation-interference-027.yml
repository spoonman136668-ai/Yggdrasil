name: Yggdrasil reactivation interference 027

on:
  push:
    branches:
      - research/external-hosted-yggdrasil-reactivation-interference-r1
    paths:
      - 'research/applications/plane/exp-dgr-external-cumulative-reactivation-interference-027.py'
      - '.github/workflows/external-cumulative-reactivation-interference-027.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c70ec604d160b8b5a35955713f0c9f75adada784"
          test "$(git rev-parse HEAD^^)" = "8ac20bd73227d7cb5268e6815516d196ceb7ff92"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-REACTIVATION-INTERFERENCE-027","preregistration_sha":"c70ec604d160b8b5a35955713f0c9f75adada784","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001391","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="411a8ff5bfb4a67bf8d74e910494721695204aad00c69b9951ba79b8491f6580"
          r=json.loads(raw); assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-027"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,h,n in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"ygg-027"}),timeout=30).read(n+1)
              assert len(b)==n and hashlib.sha256(b).hexdigest()==h
              (root/(d+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen interference reactivation twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-cumulative-reactivation-interference-027.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-cumulative-reactivation-interference-027.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and m["base_training_identity_mismatch_count"]==0 and m["schedule_count"]==6 and m["interference_case_count"]==18 and m["interference_changed_case_count"]==18 and m["target_interference_leakage_count"]==0 and m["active_structure_count_min"]==7 and m["active_structure_count_max"]==7 and m["retained_structure_count_min"]==9 and m["retained_structure_count_max"]==9 and m["retained_record_integrity_mismatch_count"]==0 and m["state_partition_mismatch_count"]==0 and m["capacity_growth_event_count"]==0 and m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and m["invalid_evaluation_rows"]==0 and all(math.isfinite(float(v)) for v in m.values()))
          positive=m["positive_reactivation_case_count"]==18
          ratio=m["minimum_reactivation_to_preinterference_fraction"]>=0.5
          minimum=m["minimum_reactivation_incremental_correct_count"]>=1
          cls="invalid" if not valid else ("negative" if not positive else ("supported" if ratio and minimum else "mixed"))
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-REACTIVATION-INTERFERENCE-027","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"411a8ff5bfb4a67bf8d74e910494721695204aad00c69b9951ba79b8491f6580","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-027"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-external-cumulative-reactivation-interference-027
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
