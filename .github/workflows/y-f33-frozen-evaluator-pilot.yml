name: Y-F33 once-only dual-evaluator source feasibility (NO primary original)
on:
  push:
    branches:
      - science/y-f33-frozen-evaluator-source-pilot-20261015-r1
permissions:
  contents: read
jobs:
  train_only_evaluator_pilot:
    if: "${{ github.event.head_commit.message == 'science(y-f33): one frozen TRAIN-only evaluator pilot' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and frozen source admission
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f80af6ae79576d5e14a2a5bbd0c735e17d79cb7d HEAD
          git merge-base --is-ancestor 355d3ad5d84e4f344f9f2fd89b253daa71708154 HEAD
          test "$(git hash-object research/foundational/20261015-y-f33/source_pilot.py)" = 39519e04e5371747fa3c02b7b2eba62979996372
          test "$(git hash-object research/foundational/20261015-y-f33/evaluator_only.py)" = 04485bc24d0ab730853bffdbc93103ec205f542e
          test "$(git hash-object research/foundational/20261015-y-f33/prereg-frozen.json)" = "$(git rev-parse 355d3ad5d84e4f344f9f2fd89b253daa71708154:research/foundational/20261015-y-f33/prereg-frozen.json)"
          python3 -m unittest discover -s research/foundational/20261015-y-f33 -p test_preflight.py -v
      - name: Exactly one new TRAIN-only evaluator-source feasibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261015-y-f33/source_pilot.py > /tmp/y-f33-source-feasibility.json
          python3 -m json.tool /tmp/y-f33-source-feasibility.json > /dev/null
          sha256sum /tmp/y-f33-source-feasibility.json > /tmp/y-f33-source-feasibility.sha256
          git rev-parse HEAD > /tmp/y-f33-source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F33-frozen-TRAIN-only-evaluator-evidence
          path: |
            /tmp/y-f33-source-feasibility.json
            /tmp/y-f33-source-feasibility.sha256
            /tmp/y-f33-source-commit.txt
          if-no-files-found: error
          retention-days: 90
      - name: Independent row-level and evaluator cross-check
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,collections
          d=json.load(open('/tmp/y-f33-source-feasibility.json'))
          p=json.load(open('research/foundational/20261015-y-f33/prereg-frozen.json'))
          assert d['status']=='TRAIN_ONLY_QUALIFICATION_NO_SCIENCE_ORIGINAL'
          assert d['questions']==p['train']['expected_queries']==576
          assert d['source_train_seeds']==p['train']['seeds'] and d['source_families']==p['train']['families']
          assert d['reserved_original_seeds']==p['reserved_primary_original']['seeds']
          assert d['reserved_original_families']==p['reserved_primary_original']['families']
          assert not d['independent_source_custody_F3'] and d['primary_original_not_executed']
          assert d['source_private_mode_evaluator_only'] and d['independent_evaluator_algorithm_crosscheck']
          assert d['acquired_target_channels_per_role']==2 and not d['accepted_ref_mutation']
          assert len(d['rows'])==576 and len({(r['seed'],r['family'],r['condition'],r['mechanism']) for r in d['rows']})==576
          assert collections.Counter(r['mechanism'] for r in d['rows'])==dict.fromkeys(p['train']['mechanisms'],288)
          for row in d['rows']:
            assert 201800<=row['seed']<201824 and row['public_anchor_count']==12
            for arm,traces in row['acquisition_receipts'].items():
              assert len(traces)==3 and all(len(pair)==2 and pair[0]!=pair[1] and pair[0]==0 for pair in traces)
          for arm,s in d['scores'].items():
            correct=sum(r['predictions'][arm]==r['truth'] for r in d['rows'])
            assert s['correct']==correct and s['total']==576
            assert math.isclose(s['accuracy'],correct/576,abs_tol=1.e-12)
          assert d['scores']['privileged_oracle']['correct']==576
          metrics=d['evaluator_metrics']
          assert metrics['evaluator_private_records']==576*3
          assert not metrics['source_custody_independent_of_repository']
          assert d['verdict'] in ('TRAIN_ONLY_SOURCE_INFORMATION_GATE_ELIGIBLE','TRAIN_ONLY_SOURCE_INFORMATION_GATE_BLOCKED')
          print("Y_F33_TRAIN_ONLY_SOURCE_GATE",d['verdict'],d['scores'],metrics,
                'switches',d['empirical_action_switch_rate'],'headroom',d['headroom_fraction'])
          PY
      - name: Explicit authority limits
        run: echo "Y-F33 TRAIN-only source qualification, NOT a learned-policy original; F3 custody still blocked"
