name: ITD-02 R13 opt-in local public uncertainty qualification
on:
  push:
    branches:
      - research/itd02-r13-native-uncertainty-sourceonly-20261028
permissions:
  contents: read
jobs:
  native-local-public-source:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Original git source eol
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact native source without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Frozen Python native source environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original cells and prospective prereg before R13 executable
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6e2d4a219b1fb62e0124ba053b65b7e3fdd46546 "$GITHUB_SHA"
          git merge-base --is-ancestor 3157aab474c0387a7b5cf19f574cd3c274a70ba2 "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r10/public_adapter.py)" = 3917d36ce9f86a2c1b998a0a2f93fb27674a9205
          test "$(git hash-object research/native/itd02/r11/affordance_cells.py)" = 614c7dfb1b43f485009b70cb85e9b7b5119cafc2
          test "$(git hash-object research/native/itd02/r12/outcome_choice.py)" = 2d19b28d6d4db1988ae908fe91be1a27ce4c1907
          test "$(git hash-object research/native/itd02/r13/PREREG.json)" = c764242dc112843fd19c0d60e6547c7ad9cef170
          test "$(git hash-object research/native/itd02/r13/explore_choice.py)" = 51c421fbd34b5e88e02bf89acab0de7b11eee1c9
          test "$(git hash-object research/native/itd02/r13/test_explore_choice.py)" = daef46c1d573f82ba8a0a65444e3f7f9422cc05f
          echo R13_PROSPECTIVE_SOURCE_EXACT
      - name: Source-only four-version selected-public native interface regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            research.native.itd02.r10.test_public_adapter \
            research.native.itd02.r11.test_affordance_cells \
            research.native.itd02.r12.test_outcome_choice \
            research.native.itd02.r13.test_explore_choice
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R13_NATIVE_LOCAL_UNCERTAINTY_SOURCE_ONLY_NO_SCIENCE
