name: Mass CS17 genuine DeepMind bsuite partial observability and native rewarded memory
on:
  push:
    branches:
      - research/mass-cs17-real-bsuite-partial-memory-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs17-original-bsuite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-bsuite-source-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout frozen FIRST source-native test only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Fail-closed first prereg ancestry and exactly additive file scope
        shell: bash
        run: |
          set -euo pipefail
          first=618364d18ee36ee24c50c80161530248527ddf79
          parent=a226752c4b34cd9d8115e57ec84796b12084325a
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS17_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git hash-object research/native/itd01/r7/native_cells.py)" = "4c492a494ac5b25d5e9c49b98185be6a2c966b2f"
          test "$(git hash-object research/native/itd01/mass_r10/cs14_action_owned_native_cells.py)" = "33bdae91b5aa9697f01c3b41a62ce824c9a9e61b"
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS17_PREREG.md","research/native/itd01/mass_r10/run_cs17_original_bsuit_memory.py","research/native/itd01/mass_r10/test_cs17_original_bsuit_memory.py",".github/workflows/mass-cs17-original-bsuite-memory.yml"};assert got==want,(got,want)'
      - name: Checkout untouched external original DeepMind bsuite
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/bsuite
          ref: 8109eb23291b1b8d9f55b3753ccb9f222f18eff2
          path: external/bsuite-original
          persist-credentials: false
      - name: Setup Python original source 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only original memory-chain numpy and dm_env runtime
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs17-evidence
          set +e
          timeout 180s python -m pip install --no-cache-dir --timeout 35 --retries 1 'numpy==1.26.4' 'dm-env==1.6' >cs17-evidence/original-source-install.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >cs17-evidence/install-exit.txt
          test "$rc" = "0"
      - name: Archive frozen original R7 historical integration failure
        shell: bash
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH=research/native/itd01/r7 python -B -m unittest discover -s research/native/itd01/r7 -p test_native_cells.py -v >cs17-evidence/original-frozen-R7-suite.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >cs17-evidence/original-frozen-R7-exit.txt
          test "$rc" = "1"
          grep -q "FAIL: test_frozen_three_init_cohorts_keep_original_negatives" cs17-evidence/original-frozen-R7-suite.log
          echo "Original frozen R7 scientific integration REMAINS blocked; no waiver."
      - name: Run independently source-free native cue/act and controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs17_original_bsuit_memory.py 2>&1 | tee cs17-evidence/focused-tests.log
      - name: Run real original DeepMind MemoryChain 6528 episodes and 117504 native steps
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs17_original_bsuit_memory.py \
            --upstream external/bsuite-original --out cs17-evidence/
      - name: Always retain true external source FIT, original rewards, negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs17-original-DeepMind-source-native-memory
          path: cs17-evidence/
          retention-days: 30
