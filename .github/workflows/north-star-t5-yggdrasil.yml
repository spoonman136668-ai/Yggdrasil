name: T5 yggdrasil actual learning-mechanism qualification
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t5-yggdrasil.yml']
permissions:
  contents: read
concurrency:
  group: t5-yggdrasil-nonprotected-original-source
  cancel-in-progress: false
jobs:
  prospective-open-source-mechanism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze-before-code and unaltered original baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T5_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t5-frozen.json').Trim() -cne '7a1c6e3033272bc49d95ba48220986a007923816'){throw 'T5_FROZEN_SOURCE_CHANGED'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261018-yggdrasil-t5-frozen.json').Trim() -cne 'a269de41e367ee7ddf3548521009ee9eae7a2575'){throw 'T5_SOURCE_NOT_FROZEN_FIRST'}
          git merge-base --is-ancestor a269de41e367ee7ddf3548521009ee9eae7a2575 HEAD
          if($LASTEXITCODE -ne 0){throw 'T5_PREIMPLEMENTATION_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t5-learning.py').Trim() -cne '154973be35fb396c8dadc55fad40330357ff27e0'){throw 'T5_LEARNER_SOURCE_IDENTITY_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-t3-fast-native.py').Trim() -cne 'c486e9a93b02304ce11964056b06a4115160f9f0'){throw 'T5_PREVIOUS_BASELINE_CHANGED'}
          Write-Output 'T5_YGGDRASIL_SOURCE_FROZEN_AND_CONTROLS=PASS'
      - name: One first-use on fresh nonprotected TRAIN and OPEN source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $python=if($IsWindows){'python'}else{'python3'}
          & $python -B 'research/north-star-transfer/20261018-yggdrasil-t5-learning.py' | Tee-Object 't5-yggdrasil-original.json'
          if($LASTEXITCODE -ne 0){throw 'T5_YGGDRASIL_PUBLIC_LEARNING_FAIL'}
          $r=Get-Content 't5-yggdrasil-original.json' -Raw | ConvertFrom-Json
          if($r.'strict_transfer_admission' -ne $false -or $r.'protected_original_first_use' -ne $false){throw 'T5_SCIENTIFIC_ADMISSION_NOT_AUTHORIZED'}
          Write-Output 'T5_YGGDRASIL_ACTUAL_PUBLIC_LEARNING_RECORDED=PASS'
          Write-Output 'T5_YGGDRASIL_PROTECTED_ORIGINAL_COHORTS_CONSUMED=0'
      - uses: actions/upload-artifact@v4
        with:
          name: t5-yggdrasil-unprotected-original-${{ matrix.os }}-${{ github.sha }}
          path: t5-yggdrasil-original.json
          retention-days: 90
          if-no-files-found: error
