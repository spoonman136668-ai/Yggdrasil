name: YNCA04 isolated cost-aware causal probe qualification
on:
  push:
    branches:
      - research/ynca04-information-cost-probing-20261118
    paths:
      - .github/workflows/ynca04-isolated-research.yml
permissions:
  contents: read
jobs:
  source-and-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve byte-stable checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pre-run locked source and preregistration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('research/contrib/chatgpt/YNCA-04')
          prereg=json.loads((root/'prereg.json').read_bytes())
          raw=(root/'experiment.py').read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest == '3b10a149828a5d4c060bce05806bd0e0cf3e0e4527d93347a821ff571abc39ea',digest
          assert digest == prereg['frozen_design']['source_sha256']
          assert digest == prereg['inputs'][0]['sha256']
          assert prereg['frozen_design']['source_commit_sha']=='812a71fa788f9f003071bd82a693bbddf8c99d41'
          print('YNCA04_FROZEN_SOURCE_PRE_PRIMARY_PASS', digest)
          PY
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-04 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
  frozen-synthetic-heldout:
    needs: [source-and-focused]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent Windows source newline rewrite
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run source-frozen independent synthetic heldout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/YNCA-04/experiment.py --heldout > "$RUNNER_TEMP/ynca04-heldout.json"
          python - "$RUNNER_TEMP/ynca04-heldout.json" <<'PY'
          import json,hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          data=json.loads(p.read_bytes())
          assert data['split']=='heldout'
          assert data['source_sha256']=='3b10a149828a5d4c060bce05806bd0e0cf3e0e4527d93347a821ff571abc39ea'
          assert data['outcome']['world_count']==1024
          assert set(data['outcome']['families'])=={'MAJ3','MUX3'}
          assert not any(data['claims'].values())
          assert all(data['audit'].values())
          print('YNCA04_HOLDOUT_RESULT_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('YNCA04_METRICS',json.dumps(data['outcome'],sort_keys=True,separators=(',',':')))
          PY
          test -z "$(git status --porcelain)"
      - name: Preserve exact heldout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynca04-heldout-${{ matrix.os }}
          path: ${{ runner.temp }}/ynca04-heldout.json
          if-no-files-found: warn
          retention-days: 30
  inherited-root-regression:
    needs: [source-and-focused]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen scientific control test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Source-frozen inherited regression before G29 sidecar companion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if test -d research/contrib/chatgpt/NKR-05; then
            python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          fi
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-04 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
