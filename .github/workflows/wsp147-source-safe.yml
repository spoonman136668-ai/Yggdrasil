name: WSP147 prospective unseen causal grammar direct weights
on:
  push:
    branches: [research/wsp147-unseen-grammar-direct-weights-20261117]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify sole source-first prereg, pinned independent controls, and first-use fences
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r 0ac72dea78f4b91e1aabd350b3d07d20c288aa39)" = "research/contrib/chatgpt/WSP-147/prereg.json"
          git merge-base --is-ancestor 0ac72dea78f4b91e1aabd350b3d07d20c288aa39 HEAD
          git diff --exit-code 0ac72dea78f4b91e1aabd350b3d07d20c288aa39 HEAD -- research/contrib/chatgpt/WSP-147/prereg.json
          git merge-base --is-ancestor c80c7f5ddb9470e3d8cc66064bbbd50a4a91615b HEAD
          git diff --exit-code c80c7f5ddb9470e3d8cc66064bbbd50a4a91615b HEAD -- research/contrib/chatgpt/WSP-146 research/contrib/chatgpt/WSP-145
          git merge-base --is-ancestor 3bdc6a948eda96d0a96c390f93fc458e7a2a8d73 HEAD
          git diff --exit-code 3bdc6a948eda96d0a96c390f93fc458e7a2a8d73 HEAD -- research/contrib/chatgpt/WSP-147/direct.py research/contrib/chatgpt/WSP-147/poly_control.py research/contrib/chatgpt/WSP-147/test_direct.py
          test -f research/contrib/chatgpt/WSP-147/source.py
          test -f research/contrib/chatgpt/WSP-147/experiment.py
          git diff --exit-code c80c7f5ddb9470e3d8cc66064bbbd50a4a91615b HEAD -- research/contrib/chatgpt/WSP-135/learner.py research/contrib/chatgpt/WSP-135/controls.py research/contrib/chatgpt/WSP-142/direct_weights.py research/contrib/chatgpt/WSP-143/result.json research/contrib/chatgpt/WSP-143/concepts.py research/contrib/chatgpt/WSP-144/source.py research/contrib/chatgpt/WSP-144/result.json
          test ! -e research/contrib/chatgpt/WSP-147/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-147/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-147/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Source-safe new causal grammar direct numerical weight trial with postseal questions
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-147 -p 'test_*.py' -v
      - name: Prevent source mutation from scoring
        shell: bash
        run: test -z "$(git status --porcelain)"
  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp147): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp147-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-pin G29 derived-only three atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 0ac72dea78f4b91e1aabd350b3d07d20c288aa39 HEAD
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp147): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp147-unseen-grammar-direct-weights-20261117
  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp147): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source prior and pinned derived G29 atlas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 0ac72dea78f4b91e1aabd350b3d07d20c288aa39 HEAD -- research/contrib/chatgpt/WSP-147/prereg.json
          git diff --exit-code c80c7f5ddb9470e3d8cc66064bbbd50a4a91615b HEAD -- research/contrib/chatgpt/WSP-135/learner.py research/contrib/chatgpt/WSP-135/controls.py research/contrib/chatgpt/WSP-142/direct_weights.py research/contrib/chatgpt/WSP-143/result.json research/contrib/chatgpt/WSP-143/concepts.py research/contrib/chatgpt/WSP-144/source.py research/contrib/chatgpt/WSP-144/result.json
          test ! -e research/contrib/chatgpt/WSP-147/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Mandatory inherited WSP135-147 and complete root regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 139 141 142 143 144 145 146 147; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
