name: ITD-02 V32 public source surprise and native return witness
on:
  push:
    branches:
      - research/itd02-v32-source-surprise-probation-20261028
permissions:
  contents: read
jobs:
  v32-probation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact cross-platform Git newline policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Source-locked checkout without persisted GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm immutable preregistration and parent source pins
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fccbe73ad48f40ea5ac0b45482a9ace025b62573 "$GITHUB_SHA"
          git merge-base --is-ancestor 889c618a6a1c087d3e5be32b58c61d2933ffc818 "$GITHUB_SHA"
          git merge-base --is-ancestor 2ab8949c2f503998b2514298737b742c49d21cb9 "$GITHUB_SHA"
          git merge-base --is-ancestor 644043f1559b80f66a6d88dc5951ad91becba09e "$GITHUB_SHA"
          git merge-base --is-ancestor b1aa3bb1ef064373edbc7ffefa1434daaadbf292 "$GITHUB_SHA"
          git merge-base --is-ancestor ac3eed376dc078f02e49d341f484625b50cf3d28 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object yggdrasil/itd02_v26_calibrated_return_dev.py)" = 8a0417d34c6ba94a4eaef33d767da14a4a5c9709
          test "$(git hash-object yggdrasil/itd02_v30_public_probe_policy_dev.py)" = bcc1f0b4e2ec0fcd8b2af69dfb0e6d4d2ca27a4a
          test "$(git hash-object research/itd02_v29_observational_equivalence_audit.py)" = 86e30048b336b20d15a7a2c76d87d48d205c023f
          test "$(git hash-object research/itd02_v30_budgeted_action_exploration_audit.py)" = 2991bdcf8e2c6878691548a0d3e9d5521b9eb85c
          test "$(git hash-object research/itd02_v31_credit_readout_attribution_audit.py)" = 52423d71d499f1de8e1fc11d072b363bd588ff4c
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Public reward selector and original native cold restore tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v32_source_surprise_probation.py' -v
          echo V32_FOCUSED_PUBLIC_ISOLATION_PASS_NOT_SCIENCE
      - name: Frozen three-world return and matched 80 feature RLS regret
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v32"
          if ! PYTHONPATH=. python -B research/itd02_v32_source_surprise_probation_audit.py > "$RUNNER_TEMP/v32/audit.json" 2> "$RUNNER_TEMP/v32/errors.log"; then
            cat "$RUNNER_TEMP/v32/errors.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v32/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="ygg.itd02.v32.public_probation_return.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["original_native_modified"] and not d["independent_unfamiliar_transfer"]
          assert d["preregistration_locked"] and not d["new_learned_native_parameters"]
          assert d["worlds"]==["A","B","B0"]
          assert d["extra_probe_budget"]==3 and d["return_public_feedback"]==12
          assert d["candidate_public_reward_updates"]==27
          assert d["original_source_training_updates"]==576
          assert d["stored_native_learned_scalars"]==326 and d["native_fast_trainable_scalars"]==163
          assert d["conventional_full_matrix_rls"] and d["original_v26_baseline_unchanged"]
          assert len(d["canonical_cases_and_policy_sha256"])==64
          assert d["classification"] in {
            "V32_SOURCE_SURPRISE_DID_NOT_UNLOCK_LEARNING__NO_SCIENCE",
            "V32_SOURCE_RETENTION_OR_RETURN_FAILED__NO_SCIENCE",
            "V32_SELECTIVITY_WITHOUT_STRONG_DECISION_GAIN__NO_SCIENCE",
            "V32_BOUNDED_SYNTHETIC_PROBATION_ENGINEERING_POSITIVE__NO_SCIENCE"}
          assert all(x["native_fast_updates"]==27 and x["source_training_updates"]==576
                     and x["learned_scalars"]==326 and x["original_source_unchanged"]
                     and x["final_checkpoint_bytes"]<=12288 for x in d["results"])
          print("V32_CLASSIFICATION",d["classification"])
          print("V32_CANONICAL_CASE_POLICY_SHA",d["canonical_cases_and_policy_sha256"])
          print("V32_PREDECLARED_GATES",json.dumps(d["gates"],sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Bounded inherited V31 to V22 native safety regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_credit_readout_attribution.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v30_public_probe_policy.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v29_observational_equivalence.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V32_ORIGINAL_NATIVE_SAFETY_PASS_NOT_SCIENCE
      - name: Retain per-host immutable evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v32-probation-return-${{ matrix.os }}
          path: ${{ runner.temp }}/v32/*
          retention-days: 7
          if-no-files-found: warn
