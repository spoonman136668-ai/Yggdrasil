name: NCI-04 S4A Independent Public History Identifiability
on:
  push:
    branches:
      - research/nci04-s4-pycolab-public-alias-20261021
  pull_request:
    branches:
      - research/mr34d-pycolab-original-source-20261021
permissions:
  contents: read
concurrency:
  group: nci04-s4a-native-independent-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-reproducible-public-history:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Exact source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout source and frozen original-public history protocol
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Independent original DeepMind Pycolab native game
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Python 3.11 original native game
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original source runtime pinned dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 six==1.17.0 psutil==6.1.1
      - name: Original source curses compatibility on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Qualify genuine original independent native public-history replay and aliases
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.nci04_s4a.public_history_alias ../external/pycolab | tee ../nci04-s4a-public-history-receipt.log
          grep -q '^NCI04_S4A_ORIGINAL_INDEPENDENT_PUBLIC_ALIAS=' ../nci04-s4a-public-history-receipt.log
      - name: Original source trees remain unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/pycolab diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/pycolab status --porcelain)"
