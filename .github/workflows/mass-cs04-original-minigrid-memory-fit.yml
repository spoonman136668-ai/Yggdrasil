name: Mass CS04 source-original public observation memory learning
on:
  push:
    branches:
      - research/mass-cs04-public-only-memory-fit-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs04-real-memory-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-public-memory-learner:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout immutable source-first candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
          persist-credentials: false
      - name: Verify original prereg first parent and pure additive paths
        shell: bash
        run: |
          set -euo pipefail
          first=c5da78ae952babe03cbdd062118ab3a928317ec7
          parent=e0ce8883d306227a14ee75a5e74c816add2860f1
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS04_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; got=set(sys.stdin.read().splitlines()); want={"research/native/itd01/mass_r10/CS04_PREREG.md","research/native/itd01/mass_r10/run_cs04_public_minigrid_memory.py","research/native/itd01/mass_r10/test_cs04_public_minigrid_memory.py",".github/workflows/mass-cs04-original-minigrid-memory-fit.yml"}; assert got==want,(got,want)'
      - name: Checkout untouched original independent upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/Minigrid
          persist-credentials: false
      - name: Python original-source version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original untouched dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs04-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/Minigrid >cs04-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          echo "$rc" >cs04-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: No-source focused model-fitting and role tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs04_public_minigrid_memory.py 2>&1 | tee cs04-evidence/focused-tests.log
      - name: Run exactly preregistered public-source FIT VALID and DEV
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs04_public_minigrid_memory.py \
            --upstream external/Minigrid --out cs04-evidence/
      - name: Retain public source evidence and all negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs04-original-public-memory-learning
          path: cs04-evidence/
          retention-days: 30
