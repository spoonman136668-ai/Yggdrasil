name: Yggdrasil F67B positive-prefix teacher synthetic qualification
on:
  push:
    branches: [research/y-f67b-prefix-admission-precode-20261016-r1]
permissions:
  contents: read
jobs:
  synthetic-learning-gate:
    if: "${{ github.event.head_commit.message == 'ci(y-f67b): qualify positive admission learning on unregistered synthetics' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scientific freeze and unchanged causal runtime
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 10abf669a59d61f26d7e4999083e862177d14294 HEAD
          test "$(git hash-object research/foundational/20261016-y-f67/prereg-positive-admission.json)" = e923b32001eb22236c9d55e9d6ab00abe5cc7214
          test "$(git hash-object research/foundational/20261016-y-f67/durable_policy.py)" = 21f2f3fc90a3d00d09029f39e4958e09a33908cc
          test "$(git hash-object research/foundational/20261016-y-f67/fit_admission_synthetic.py)" = a6b4251354e8e79b744449ad6e08b7179bb9e6ab
      - name: Public-only learned admission and independent 72-prefix audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f67b-synthetic/"
          python3 -B research/foundational/20261016-y-f67/fit_admission_synthetic.py --synthetic-only > "$RUNNER_TEMP/f67b-synthetic/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f67b-synthetic/result.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f67b-synthetic/result.json")));print("F67B_TEACHER",d["training"]);print("F67B_FITTED_MERGES",d["model_merges"],"DURABLE",d["durable_final_paths"]);print("F67B_METHOD_QUALIFIED",d["genuine_learned_policy_preflight_qualified"]);assert d["genuine_learned_policy_preflight_qualified"] and not d["FIT_train_executed"]'
          sha256sum "$RUNNER_TEMP/f67b-synthetic/result.json" > "$RUNNER_TEMP/f67b-synthetic/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f67b-synthetic/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f67b-acceptance-synthetic-learning
          path: ${{ runner.temp }}/f67b-synthetic/
          retention-days: 90
          if-no-files-found: warn
