# WSP-05 read-only public DEV qualification. No schedule or worker authority.
name: WSP-05 causal signature weight programming DEV regression
on:
  pull_request:
    branches:
      - research/wsp04-bounded-rule-grammar-extension-20261110
      - main
    paths:
      - 'research/contrib/chatgpt/WSP-05/**'
      - '.ice/code-atlas.*'
      - '.github/workflows/wsp05-pr-validation.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact G29 source atlas
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Full existing Yggdrasil regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preserve WSP-01
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-01 -p "test_*.py" -v
      - name: Preserve WSP-02 negative
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-02 -p "test_*.py" -v
      - name: Preserve WSP-03
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-03 -p "test_*.py" -v
      - name: Preserve WSP-04
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-04 -p "test_*.py" -v
      - name: Qualify WSP-05 opaque state learning and negatives
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-05 -p "test_*.py" -v
      - name: Run frozen 32-world public DEV comparison and trained baseline
        run: python research/contrib/chatgpt/WSP-05/run_dev.py
      - name: Reject source mutations
        run: git diff --exit-code
