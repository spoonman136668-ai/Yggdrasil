name: Yggdrasil Y037 frozen churn/search Pareto
on:
  push:
    branches: [research/y037-quorum-cost-frontier-r1]
permissions:
  contents: read
jobs:
  scientific-first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source/prereg/parent identity freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0f18249168254a83ca05c987abb01c55d86c0db7 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-novel-shifts/execute.py)" = 731b21616691af2f726fb8017ce69b58b08c91a6
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-cost-frontier/prereg.json)" = 24ced9edfd4417474b54b8f6b3065cc42ab47c5f
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-cost-frontier/execute.py)" = b4649922587c4f4860606a412916cbb0429ce88d
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-cost-frontier/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-cost-frontier/execute.py
      - name: First and only sealed churn and search-cost evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-cost-frontier/execute.py > /tmp/Y037-original.json
          python3 -m json.tool /tmp/Y037-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y037-original.json'))
          assert len(x['regimes'])==4
          assert x['sealed_heldout_seeds']==list(range(232,248))
          print('CLASSIFICATION',x['classification'])
          for r in x['regimes']:
              print(r['regime'],'CHURN',r['churn'],
                    'SEARCH',r['matching_search_calls'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original-quorum-cost-frontier
          path: /tmp/Y037-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Complete Yggdrasil full regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
