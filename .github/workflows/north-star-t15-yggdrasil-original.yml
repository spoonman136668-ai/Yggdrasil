name: T15 yggdrasil original source-only developmental comparison
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t15-yggdrasil-original.yml']
permissions:
  contents: read
concurrency:
  group: t15-yggdrasil-single-original-source
  cancel-in-progress: false
jobs:
  cross-platform-nonconsuming:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Immutable scientific preimplementation controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T15_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t15-source.py').Trim() -cne 'dd9616e662bcedf1d15bc2318eb7cfdae9d93ad9'){throw 'T15_SOURCE_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t15-preimplementation-freeze.json').Trim() -cne '853ae9bc7a328d78d3f1b04d167c64d67fa17155'){throw 'T15_ASSAY_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t15-mechanism.py').Trim() -cne '9b9bcbb0ce5f42feaae86a52520141700e65f0a5'){throw 'T15_MODEL_CHANGED'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t15-source.py').Trim() -cne 'd5c8d126e65af7309b11641dfa54c01e62cfe48d'){throw 'T15_SOURCE_FIRST_USE_NOT_FROZEN'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t15-preimplementation-freeze.json').Trim() -cne '055a6c6b9cbd6bac09f5be409670e5dc9adecbcd'){throw 'T15_FREEZE_NOT_PREIMPLEMENTATION'}
          git merge-base --is-ancestor 055a6c6b9cbd6bac09f5be409670e5dc9adecbcd HEAD
          if($LASTEXITCODE -ne 0){throw 'T15_ASSAY_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t14-mechanism.py').Trim() -cne '9b22f32e0fcdef862d37878428d640dcce09c76f'){throw 'T15_FROZEN_CONTROL_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t12-mechanism.py').Trim() -cne '18a42a9b79d99c751a436d72803fd9cd6d28cd88'){throw 'T15_FROZEN_CONTROL_CHANGED'}
          Write-Output 'T15_YGGDRASIL_EXACT_HEAD_AND_CONTROLS=PASS'
      - name: Nonconsuming syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile 'research/north-star-transfer/20261019-yggdrasil-t15-source.py' 'research/north-star-transfer/20261019-yggdrasil-t15-mechanism.py'
          if($LASTEXITCODE -ne 0){throw 'T15_SYNTAX_FAILED_BEFORE_SOURCE_BIRTH'}
          Write-Output 'T15_NO_NEW_SOURCE_BORN_IN_PREFLIGHT=PASS'
  original:
    needs: [cross-platform-nonconsuming]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original execution identity and frozen controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T15_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t15-source.py').Trim() -cne 'dd9616e662bcedf1d15bc2318eb7cfdae9d93ad9'){throw 'T15_SOURCE_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t15-preimplementation-freeze.json').Trim() -cne '853ae9bc7a328d78d3f1b04d167c64d67fa17155'){throw 'T15_ASSAY_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t15-mechanism.py').Trim() -cne '9b9bcbb0ce5f42feaae86a52520141700e65f0a5'){throw 'T15_MODEL_CHANGED'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t15-source.py').Trim() -cne 'd5c8d126e65af7309b11641dfa54c01e62cfe48d'){throw 'T15_SOURCE_FIRST_USE_NOT_FROZEN'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t15-preimplementation-freeze.json').Trim() -cne '055a6c6b9cbd6bac09f5be409670e5dc9adecbcd'){throw 'T15_FREEZE_NOT_PREIMPLEMENTATION'}
          git merge-base --is-ancestor 055a6c6b9cbd6bac09f5be409670e5dc9adecbcd HEAD
          if($LASTEXITCODE -ne 0){throw 'T15_ASSAY_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t14-mechanism.py').Trim() -cne '9b22f32e0fcdef862d37878428d640dcce09c76f'){throw 'T15_FROZEN_CONTROL_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t12-mechanism.py').Trim() -cne '18a42a9b79d99c751a436d72803fd9cd6d28cd88'){throw 'T15_FROZEN_CONTROL_CHANGED'}
          Write-Output 'T15_YGGDRASIL_EXACT_HEAD_AND_CONTROLS=PASS'
      - name: One original nonprotected TRAIN and OPEN, no replay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python 'research/north-star-transfer/20261019-yggdrasil-t15-mechanism.py' > t15-yggdrasil-original.json
          if($LASTEXITCODE -ne 0){throw 'T15_ORIGINAL_FAILED_SOURCE_IDS_CONSUMED_NO_REPLAY'}
          python -c "import json; z=json.load(open('t15-yggdrasil-original.json',encoding='utf-8-sig')); assert z['schema']=='yggdrasil.t15.sourceonly-braided-graph.v1'; assert z['signed_scientific_acceptance'] is False and z['optimizer_admission'] is False; print('T15_ORIGINAL_SOURCE_VERIFIED_NOT_ADMITTED=PASS')"
          if($LASTEXITCODE -ne 0){throw 'T15_ORIGINAL_RECEIPT_INVALID_SOURCE_IDS_CONSUMED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t15-yggdrasil-original-nonadmitted
          path: t15-yggdrasil-original.json
          if-no-files-found: ignore
          retention-days: 90
