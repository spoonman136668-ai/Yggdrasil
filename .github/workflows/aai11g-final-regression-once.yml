name: AAI-11G immutable final 134-test original and prospective benchmark regression
on:
  push:
    branches: [research/aai11g-final-full-regression-once-20261114]
    paths: [.github/workflows/aai11g-final-regression-once.yml]
permissions:
  contents: read
concurrency:
  group: aai11g-final-full-once-20261114
  cancel-in-progress: false
jobs:
  exact-final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11G immutable final 134-test per OS regression one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Immutable isolated independent main-based one-shot test harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11g-final-regression-once.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI11G_FINAL_READONLY_HARNESS_FROM_IMMUTABLE_MAIN_PASS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: 2f1a0d8e73465081d24c8d7364883d9836ba69d1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact PR HEAD, original main and parent, prereg-before-code and pinned G29
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2f1a0d8e73465081d24c8d7364883d9836ba69d1'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai11f-oracle-goal-ceiling-audit-20261114 | cut -f1)" = '36cc12381a4153048e5971899fa388a0aafd7480'
          test "$(git ls-remote origin refs/heads/research/aai11g-oracle-relative-benchmark-20261114 | cut -f1)" = '2f1a0d8e73465081d24c8d7364883d9836ba69d1'
          test "$(git rev-parse a233c79b81f5a20ec7da6cff697526a91f5e14b5^)" = '36cc12381a4153048e5971899fa388a0aafd7480'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/prereg.json)" = '260c815900cc7f12aeab9a41a2caa6627482b6e9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/prereg.json)" = "$(git rev-parse a233c79b81f5a20ec7da6cff697526a91f5e14b5:research/contrib/chatgpt/AAI-11G/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/admit.py)" = '7fbeaf898d65cded838f74f1963da3b88af9604d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11G/test_admit.py)" = '3b1f1e12312c774a28f92ccd716f86482c0f17bf'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/audit.py)" = '299a79cf8101a6a7a8231c693d52b022fab22e07'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11E/diagnose.py)" = '07447fba4ebc4a3fa175f1a479a48424b793e11d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/dev.py)" = 'ce807c4fa3b7742b4299580087dc41b68359533e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/diagnose.py)" = '499662a5939796f502ccd47c97950a4d1fbd6b2f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11B/contrast.py)" = '69ff21daf627feeaaca6661f8f3c8096efbe4de8'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/fixture.py)" = '191575e68f64858acf036cd1e10c1e266cf16692'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/admission.py)" = '0f921dfeebda9ad3a0e217747e4b0365ba9c655e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI11G_FINAL_EXACT_PARENT_WORLD_MODELS_PREREG_G29_PASS
      - name: Original native and all eight AAI11 benchmark suites mandatory regression
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11P -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11A -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11B -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11C -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11D -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11E -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11F -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11G -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11G/admit.py --primary >/dev/null 2>&1; then
            echo AAI11G_UNAUTHORIZED_PRIMARY_SCIENCE_FIRST_USE >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo AAI11G_MANDATORY_EXACT_FINAL_134_TESTS_PER_OS_PASS_NO_SCIENCE
