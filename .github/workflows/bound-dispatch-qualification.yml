name: Temporary fanout dispatch-binding qualification
on:
  push:
    branches: ['infra/fanout-bound-at-dispatch-r1']
    paths: ['research/fanout/.bound-dispatch-qualification-trigger']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and sentinel smoke
        env:
          PACKAGE_SHA: b99d67e37fc37bdea21c94f99cef7fbe4953948f
        run: |
          set -euo pipefail
          python -m py_compile scripts/free_fanout_sidecar.py tests/test_free_fanout_sidecar.py
          python -m unittest -v tests.test_free_fanout_sidecar
          python -c 'import json; p="research/fanout/smoke.manifest.json"; m=json.load(open(p)); m["package_sha"]="BOUND_AT_DISPATCH"; json.dump(m,open("research/fanout/controller.bound.json","w"))'
          python scripts/free_fanout_sidecar.py prepare --manifest research/fanout/controller.bound.json --program Yggdrasil --package-sha "$PACKAGE_SHA" > /tmp/matrix.json
      - name: Full test surface
        run: python -m unittest discover -s tests -v
