name: Yggdrasil F68 frozen counterfactual-junction synthetic qualification
on:
  push:
    branches: [research/y-f68-shielded-junction-override-precode-20261016-r1]
permissions:
  contents: read
jobs:
  counterfactual-method-preflight:
    if: "${{ github.event.head_commit.message == 'ci(y-f68): qualify frozen counterfactual junction credit on disjoint synthetic cases' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin F60-shielded source, prereg and frozen teacher
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d9e15aa6490b1fc1fc509631930ef1b6c7fb3f19 HEAD
          test "$(git hash-object research/foundational/20261016-y-f68/prereg.json)" = f447f69142644e5af7832bf0d2079bc060a3a058
          test "$(git hash-object research/foundational/20261016-y-f68/guarded_junction.py)" = f74c5acdc28ea91c0e5615483c644fcae040db93
          test "$(git hash-object research/foundational/20261016-y-f68/method_prereg.json)" = 704a4e8ea30f7523505daebff14d716c59b07f69
          test "$(git hash-object research/foundational/20261016-y-f68/train_override.py)" = 94d53f8d976cbfaa49cf3d48ee4db26c32778797
      - name: Independently fit and replay on disjoint synthetic identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f68-synthetic-method"
          python3 -B research/foundational/20261016-y-f68/train_override.py --synthetic-only > "$RUNNER_TEMP/f68-synthetic-method/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f68-synthetic-method/result.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f68-synthetic-method/result.json")));print("F68_TRAIN_SIGNAL",d["offline_labels"]);print("F68_GUARD",d["learned_synthetic_correct"],d["frozen_F60_correct"]);print("F68_OVERRIDES",d["learned_override_steps"]);assert d["source_prequalification_pass"] and not d["FIT_train_used"] and not d["FIT_validation_used"]'
          sha256sum "$RUNNER_TEMP/f68-synthetic-method/result.json" > "$RUNNER_TEMP/f68-synthetic-method/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f68-synthetic-method/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f68-synthetic-counterfactual-override
          path: ${{ runner.temp }}/f68-synthetic-method/
          retention-days: 90
          if-no-files-found: warn
