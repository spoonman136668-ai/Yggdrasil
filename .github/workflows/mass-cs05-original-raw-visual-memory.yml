name: Mass CS05 original MiniGrid FIT-learned raw encoded cue memory
on:
  push:
    branches:
      - research/mass-cs05-raw-observation-memory-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs05-original-public-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-visual-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout frozen first-only protocol and implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Enforce source-first immutable ancestry and additive diff
        shell: bash
        run: |
          set -euo pipefail
          first=bedf61501057c2bb0f3e6ab367704039352362a9
          parent=7e490f2818769b3378cadb061ec6cfb935b8439a
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS05_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS05_PREREG.md","research/native/itd01/mass_r10/run_cs05_original_raw_visual_memory.py","research/native/itd01/mass_r10/test_cs05_original_raw_visual_memory.py",".github/workflows/mass-cs05-original-raw-visual-memory.yml"};assert got==want,(got,want)'
      - name: Checkout unchanged original Farama MiniGrid source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/Minigrid
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original upstream package dependencies unmodified
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs05-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/Minigrid >cs05-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          echo "$rc" >cs05-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Source-free focused PCA and policy unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs05_original_raw_visual_memory.py 2>&1 | tee cs05-evidence/focused-tests.log
      - name: Execute preregistered FIT VALID DEV on original public source
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs05_original_raw_visual_memory.py --upstream external/Minigrid --out cs05-evidence/
      - name: Retain full original source/public negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs05-original-raw-visual-memory
          path: cs05-evidence/
          retention-days: 30
