name: WSP58 early-budget active-probe SELFTEST
on:
  pull_request:
    branches:
      - research/wsp57-sparse-active-causal-probes-20261112
    paths:
      - 'research/contrib/chatgpt/WSP-58/**'
      - '.github/workflows/wsp58-selftest.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: WSP58 prospective SELFTEST, no DEV or PRIMARY
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-58 -p 'test_*.py' -v
