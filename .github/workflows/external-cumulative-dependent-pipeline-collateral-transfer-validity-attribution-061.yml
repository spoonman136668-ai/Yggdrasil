name: Yggdrasil transfer validity attribution 061

on:
  push:
    branches:
      - research/external-hosted-yggdrasil-dependent-pipeline-collateral-transfer-validity-attribution-r1
    paths:
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.ice'
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen instrumentation package
        shell: bash
        run: |
          set -euo pipefail
          prereg="e3dcadc6d4b050017101a2e525ac224ffe1f6ce5"
          parent="6365ce14268382a2ff757f69d52435ffdaf96302"
          git merge-base --is-ancestor "$prereg" HEAD
          test "$(git rev-parse "$prereg^")" = "$parent"
          changed="$(git diff --name-only "$parent..HEAD" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.yml' \
            'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.py' \
            'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.ice' | sort)"
          test "$changed" = "$expected"
          python -m py_compile research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.py
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-COLLATERAL-TRANSFER-VALIDITY-ATTRIBUTION-061","preregistration_sha":"e3dcadc6d4b050017101a2e525ac224ffe1f6ce5","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001836","manifest_sha256":"c79f09eb3841309b38827ceffee6a14eb87973c8aa2cf817908ed05f10e5c250","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"06c3cb723820407bc2db1bd3ec9e46f462059e41"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="d9eb9a687add1a6889ce2604c59f421963979e59d6588eec1a4cf3c8a10086fe"
          r=json.loads(raw)
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          assert r["preregistration_sha"]=="e3dcadc6d4b050017101a2e525ac224ffe1f6ce5"
          assert r["ckb_plane_main_sha"]=="06c3cb723820407bc2db1bd3ec9e46f462059e41"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact disjoint external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-061"
          mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py",61896,"3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json",14490,"ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md",3124,"c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for name,url,full_n,full_h,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"yggdrasil-061"}),timeout=30).read()
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h
              p=b[:prefix_n];assert hashlib.sha256(p).hexdigest()==prefix_h
              (root/(name+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen attribution twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-collateral-transfer-validity-attribution-061.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          m=json.loads(pathlib.Path("/tmp/result1.json").read_text())["metrics"]
          cats=["candidate_stats_overflow","candidate_stats_invalid","develop_radius_violation","state_shape","selection_or_rebuild","derived_or_guard","final_coverage"]
          identity_valid=(
            m["source_identity_mismatch_count"]==0 and m["transfer_manifest_identity_mismatch_count"]==0 and
            m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["base_training_identity_mismatch_count"]==0 and m["affected_schedule_count"]==4 and
            m["packet_budget_per_schedule"]==12 and m["candidate_k"]==7 and
            m["preserved_state_structure_count_min"]==16 and m["preserved_state_structure_count_max"]==16 and
            m["active_structure_count_min"]==7 and m["active_structure_count_max"]==7 and
            m["retained_structure_count_min"]==9 and m["retained_structure_count_max"]==9 and
            m["matched_assignment_failure_count"]==0 and m["capacity_growth_event_count"]==0 and
            m["row_mutation_event_count"]==0 and m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and
            m["baseline_mean_first_success_packet"]==3 and m["candidate_mean_first_success_packet"]==3 and
            m["candidate_mean_packet_reduction"]==0 and m["candidate_positive_reduction_schedule_count"]==0 and
            m["candidate_positive_prose_collateral_schedule_count"]==4 and m["candidate_partner_collateral_failure_count"]==0 and
            all(math.isfinite(float(v)) for v in m.values())
          )
          aggregate=m["invalid_evaluation_rows"];attr=m["attribution_total_count"]
          vals={c:m["attribution_"+c+"_count"] for c in cats}
          top=max(vals.values());topcats=sorted([c for c,v in vals.items() if v==top])
          validity=identity_valid and aggregate==26 and attr==26
          if not identity_valid or (aggregate==26 and attr!=26): cls="invalid"
          elif aggregate!=26: cls="negative"
          elif top>=14: cls="supported"
          else: cls="mixed"
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-COLLATERAL-TRANSFER-VALIDITY-ATTRIBUTION-061","classification":cls,"validity_pass":validity,"authority_receipt_sha256":"d9eb9a687add1a6889ce2604c59f421963979e59d6588eec1a4cf3c8a10086fe","dominant_categories":topcats,"dominant_count":top,"metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if cls=="invalid": raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-061"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-transfer-validity-attribution-061
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
