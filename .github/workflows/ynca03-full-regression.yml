name: YNCA03 exact-candidate full Linux/Windows regression
on:
  push:
    branches:
      - qualification/ynca03-full-regression-20261118
    paths:
      - .github/workflows/ynca03-full-regression.yml
permissions:
  contents: read
jobs:
  full-candidate-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve source bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cecdce9d5e3408f97f756007267e6108b700eef6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned scientific test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full exact candidate SHA regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cecdce9d5e3408f97f756007267e6108b700eef6"
          git rev-parse HEAD HEAD^{tree}
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-03 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
