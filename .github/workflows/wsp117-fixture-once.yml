name: WSP117 new-relation identifiability source-safe fixture dual-OS qualification
on:
  push:
    branches: [ci/wsp117-unknown-relations-fixture-once-20261115]
    paths: [.github/workflows/wsp117-fixture-once.yml]
permissions:
  contents: write
concurrency:
  group: wsp117-source-safe-fixture-20261115
  cancel-in-progress: false
jobs:
  derived-atlas:
    if: >-
      github.event.head_commit.message == 'ci(WSP-117): rerun exact fixed bytes-negative fixture and dual-OS QA' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      qualified: ${{ steps.seal.outputs.qualified }}
    env:
      SRC: 1009d0a2d357de05ef9fc04b314112287d02533b
      TREE: 17b946d3e0e8783ec3fa441c5966ff1ebb8da18d
      TARGET: research/wsp117-novel-relation-discovery-fixture-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Stable checkout byte config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1009d0a2d357de05ef9fc04b314112287d02533b
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen prereg first and exact source/test/README bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SRC"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SRC"
          git merge-base --is-ancestor 9e2c12eda65e0d1e62ae1bf659af376e59fc16d1 "$SRC"
          git merge-base --is-ancestor c252175e0d1bd308c24d01c5bf42a214edc1075b "$SRC"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSP-117/prereg.json)" = 0f8febcf7c5c7094ad8edb0d275d64decc3a0473
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSP-117/fixture.py)" = 894034d1d2f2731440d16e9f18e4e9978054c74b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSP-117/test_wsp117.py)" = f30280a73037d66a7e4838bde1dcfc2ffbf80d0a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/WSP-117/README.md)" = 3e869e78c55801938b7d68479243d90f2b074d29
          python - <<'PY'
          import ast,json,pathlib
          p=pathlib.Path("research/contrib/chatgpt/WSP-117")
          for f in p.glob("*.py"):ast.parse(f.read_text(encoding="utf-8"))
          j=json.loads((p/"prereg.json").read_text(encoding="utf-8"))
          assert j["experiment_id"]=="WSP-117"
          assert not j["authority"]["scientific_first_use"]
          print("WSP117_PREREG_FIRST_SOURCE_FENCE=PASS")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Generate exactly three permitted G29 derived files
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SRC" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
      - name: Source-only atlas child on isolated research branch
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(WSP-117): generate exact source G29 atlas"
          NEW="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SRC"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "qualified=$NEW" >> "$GITHUB_OUTPUT"
          echo "WSP117_SOURCE_ATLAS_ONLY_QUALIFIED=$NEW"

  full-source-safe-regression:
    needs: derived-atlas
    if: needs.derived-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve LF sources
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.derived-atlas.outputs.qualified }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-safe numerical fixture dependencies only, NO historical archive/data
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "numpy==1.26.4"
          python - <<'PY'
          import numpy
          assert numpy.__version__=="1.26.4"
          print("WSP117_NO_REAL_OR_PROTECTED_SOURCE_CONSUMED=PASS")
          PY
      - name: Run exact-source G29, WSP117 fixture, complete inherited root regression
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-117 -p test_wsp117.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo WSP117_BOTH_OS_FULL_SOURCE_SAFE_QUALIFICATION=PASS
