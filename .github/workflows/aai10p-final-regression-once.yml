name: AAI-10P final complete regression at immutable PR head (NO science)
on:
  push:
    branches: [research/aai10p-final-regression-once-20261114]
    paths: [.github/workflows/aai10p-final-regression-once.yml]
permissions:
  contents: read
concurrency:
  group: aai10p-final-regression-once-20261114
  cancel-in-progress: false
jobs:
  exact-final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10P exact-SHA final full regression one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout one-shot read-only qualification harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen harness-only branch and no source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10p-final-regression-once.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI10P_HARNESS_ISOLATION_PASS
      - name: Checkout independently frozen final candidate PR SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1deeb328abc478949b6d528e5cd2775c72021150
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact candidate, source, original prereg and branch custody
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1deeb328abc478949b6d528e5cd2775c72021150'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai10p-compositional-causal-intervention-20261114 | cut -f1)" = '1deeb328abc478949b6d528e5cd2775c72021150'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/prereg.json)" = 'f915033fce1b35aa816bf2b8cc6e79bf0689e35a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/prereg.json)" = "$(git rev-parse c8c91565b7b08dbfa913fbbda0dc859a8b2bcd73:research/contrib/chatgpt/AAI-10P/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/test_benchmark.py)" = 'aa61bd69bceedf4a4a297df6ead5e587758db81d'
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI10P_CANDIDATE_AND_PINNED_ATLAS_PASS
      - name: MANDATORY full standard regression + focused intervention mechanics on exact SHA
        shell: bash
        working-directory: candidate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10P -p 'test_*.py' -v
          python -B research/contrib/chatgpt/AAI-10P/benchmark.py --mechanical
          if python -B research/contrib/chatgpt/AAI-10P/benchmark.py --primary >/dev/null 2>&1; then
            echo AAI10P_SCIENCE_FIRST_USE_FENCE_FAIL >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo AAI10P_FINAL_FULL_REGRESSION_AND_NO_SCIENCE_PASS
