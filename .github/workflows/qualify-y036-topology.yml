name: Yggdrasil Y036 frozen unseen topology transfer
on:
  push:
    branches: [research/y036-topology-quorum-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed immutable parent/prereg/source identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 35eace118e16ab8195a6810f2bc6ec569dfd0106 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/execute.py)" = 692e92cf931a2d63b39a618c0044af390984f099
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-topology/prereg.json)" = b4f97e15746e29d1ed1f7174992d7cb93f5131bc
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-topology/execute.py)" = 1ded906998dd2db7af1e3ce61a865db4a2d21b26
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-topology/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-topology/execute.py
      - name: Original first-use topology generalization scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-topology/execute.py > /tmp/Y036-original.json
          python3 -m json.tool /tmp/Y036-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y036-original.json'))
          assert x['sealed_heldout_seeds']==list(range(208,224))
          assert len(x['topologies'])==4
          print('CLASSIFICATION',x['classification'])
          for t in x['topologies']:
              print('TOPOLOGY',t['topology'],t['heldout_churn'],t['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original-unseen-topology
          path: /tmp/Y036-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil qualification regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
