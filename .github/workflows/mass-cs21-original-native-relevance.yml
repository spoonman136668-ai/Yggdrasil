name: Mass CS21 original-source R7 native local reward relevance vs CS20 depletion
on:
  push:
    branches:
      - research/mass-cs21-native-local-relevance-20261023
permissions:
  contents: read
jobs:
  original-source-native-rank-relevance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Verify FIRST, exact source scope and original R7 never edited
        shell: bash
        run: |
          set -euo pipefail
          first=27e944e683007635cfcd9d87764d3b6995666505
          parent=e457029e1e12a23eab48718fa2fd2c4b1ef5c238
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS21_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git hash-object research/native/itd01/r7/native_cells.py)" = "4c492a494ac5b25d5e9c49b98185be6a2c966b2f"
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;g=set(sys.stdin.read().splitlines());w={"research/native/itd01/mass_r10/CS21_PREREG.md","research/native/itd01/mass_r10/run_cs21_original_native_rank_relevance.py","research/native/itd01/mass_r10/test_cs21_original_native_rank_relevance.py",".github/workflows/mass-cs21-original-native-relevance.yml"};assert g==w,(g,w)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym-original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only original external source legal requirements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cs21-evidence
          timeout 180s python -m pip install --no-cache-dir --timeout 35 --retries 1 'numpy==1.26.4' 'gymnasium==0.29.1' 2>&1 | tee cs21-evidence/source-install.log
      - name: Execute source-free original R7 local-cell cold restore and seed tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs21_original_native_rank_relevance.py 2>&1 | tee cs21-evidence/pre-source-tests.log
      - name: Execute genuine original POPGym native source action reward trial
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs21_original_native_rank_relevance.py --upstream external/popgym-original --out cs21-evidence
      - name: Preserve real source FIT, action-owning native outcome and negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs21-original-native-relevance-receipts
          path: cs21-evidence/
          retention-days: 30
