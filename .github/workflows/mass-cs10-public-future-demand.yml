name: Mass CS10 original source FIT-learned future-demand retention
on:
  push:
    branches:
      - research/mass-cs10-learned-future-demand-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs10-public-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-public-future-demand:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout frozen candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Enforce FIRST-only frozen source protocol and strict additive scope
        shell: bash
        run: |
          set -euo pipefail
          first=a0a7839ba3ab29bdfee1ae16bb8c04265582e075
          parent=ea94ab7663b36e2385920d53ce44cdb1de28315d
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS10_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;actual=set(sys.stdin.read().splitlines());expected={"research/native/itd01/mass_r10/CS10_PREREG.md","research/native/itd01/mass_r10/run_cs10_future_demand_retention.py","research/native/itd01/mass_r10/test_cs10_future_demand_retention.py",".github/workflows/mass-cs10-public-future-demand.yml"};assert actual==expected,(actual,expected)'
      - name: Checkout exact original unchanged POPGym source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym
          persist-credentials: false
      - name: Set up original-compatible Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unmodified original source package
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs10-evidence
          set +e
          timeout 250s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/popgym >cs10-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          echo "$rc" >cs10-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Run public source-free focused model tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs10_future_demand_retention.py 2>&1 | tee cs10-evidence/focused-tests.log
      - name: Execute prospective unchanged-original shared FIT VALID DEV
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs10_future_demand_retention.py --upstream external/popgym --out cs10-evidence/
      - name: Always preserve original experiment and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs10-original-public-future-demand
          path: cs10-evidence/
          retention-days: 30
