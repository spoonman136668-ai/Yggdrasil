name: Y-SYN03 frozen mechanical qualification (no primary)
on:
  push:
    branches: [qualification/y-syn03-crash-safe]
permissions:
  contents: read
concurrency:
  group: yggdrasil-syn03-mechanical
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0ac188e5519a7e15758edf0ea56ceeadfc1088c
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact freeze/code identity and no primary
        shell: bash
        run: |
          set -euo pipefail
          set -x
          test "$(git rev-parse HEAD)" = c0ac188e5519a7e15758edf0ea56ceeadfc1088c
          BASE=aff3f505455ef950c4f650af5b9876fce6cf7526
          PRE=c4b637ac8a60b248483ce967ae18b6ffb48772b1
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$PRE^")" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r "$PRE")" = research/contrib/ckb-synthetic/y-syn03/prereg.json
          test "$(git rev-parse "$PRE":research/contrib/ckb-synthetic/y-syn03/prereg.json)" = "$(git rev-parse HEAD:research/contrib/ckb-synthetic/y-syn03/prereg.json)"
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD)
          test "${#FILES[@]}" -eq 4
          for file in "${FILES[@]}"; do
            case "$file" in
              research/contrib/ckb-synthetic/y-syn03/prereg.json|research/contrib/ckb-synthetic/y-syn03/synthetic_replication.py|research/contrib/ckb-synthetic/y-syn03/test_replication_mechanics.py|research/contrib/ckb-synthetic/y-syn03/README.md) ;;
              *) echo "SYN_Y03_UNEXPECTED_SCOPE:$file"; exit 1 ;;
            esac
          done
          python3 - <<'PY'
          import json
          d=json.load(open('research/contrib/ckb-synthetic/y-syn03/prereg.json',encoding='utf8'))
          assert d['evidence_class']=='SYNTHETIC_ONLY_NOT_EXTERNAL_VALIDATION'
          assert d['exact_parent_sha']=='aff3f505455ef950c4f650af5b9876fce6cf7526'
          assert d['frozen_design']['total_arm_projections']==9216
          assert d['frozen_design']['total_heldout_cases']==3072
          assert d['frozen_design']['capacity']=={'total':16,'active':7,'retained':9}
          assert d['frozen_design']['heldout_seeds']==[809,811,821,823]
          assert not d['authority']['scheduler_or_queue_authority']
          assert d['authority']['ckb_science_admission_required']
          PY
          test -z "${CKB_SYN_Y03_QUALIFIED_RUN:-}"
          echo Y_SYN03_SOURCE_PREREG_PIN=PASS
      - name: Synthetic pilot mechanical tests only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/contrib/ckb-synthetic/y-syn03/synthetic_replication.py
          python -m unittest discover -s research/contrib/ckb-synthetic/y-syn03 -p test_replication_mechanics.py -v
          HISTORIC=d5e3715c7124e1fd0fc91da5efbef850ec1d9254
          HISTORIC_PATH=research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-consolidation-consumer-coupling-diagnosis-094.py
          HISTORIC_BLOB=cd471813ba6e50e7db1cf658ebf3dd1bd8fdd540
          git fetch --no-tags origin "$HISTORIC"
          test "$(git rev-parse "$HISTORIC:$HISTORIC_PATH")" = "$HISTORIC_BLOB"
          git show "$HISTORIC:$HISTORIC_PATH" > "$RUNNER_TEMP/y094-frozen.py"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/y094-frozen.py")" = "$HISTORIC_BLOB"
          export Y095_R094_SOURCE="$RUNNER_TEMP/y094-frozen.py"
          python -m unittest discover -s research/applications/plane -p test_retained_majority_decision_gate_095.py -v
          test -z "${CKB_SYN_Y03_QUALIFIED_RUN:-}"
          echo Y_SYN03_MECHANISM_AND_MECHANICS=PASS PRIMARY_NOT_RUN
