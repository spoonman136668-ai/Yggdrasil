name: YNCA03 isolated intervention research reproducibility
on:
  push:
    branches:
      - research/ynca03-active-fault-probes-20261118
    paths:
      - research/contrib/chatgpt/YNCA-03/experiment.py
      - .github/workflows/ynca03-isolated-research.yml
      - .ice/code-atlas.json
permissions:
  contents: read
jobs:
  focused-frozen-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve Git source bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout pinned candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate exact SHA and focused tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-03 -p 'test_*.py' -v
      - name: Execute source-frozen synthetic heldout
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/YNCA-03/experiment.py --heldout > "$RUNNER_TEMP/ynca03-result.json"
          python - "$RUNNER_TEMP/ynca03-result.json" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          python - "$RUNNER_TEMP/ynca03-result.json" <<'PY'
          import hashlib,json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          result=json.loads(path.read_text())
          assert result['split']=='heldout'
          assert result['outcome']['world_count']==512
          assert result['audit']['disjoint_seeds']
          assert result['source_sha256']=='b80e0e7108a37f832671b7839e045029c7e1df7d3ec456cbff43762712ac895a'
          print('YNCA03_SOURCE_SHA256='+result['source_sha256'])
          print('YNCA03_RESULT_SHA256='+hashlib.sha256(path.read_bytes()).hexdigest())
          print('YNCA03_RESULT_JSON='+json.dumps(result,sort_keys=True,separators=(',',':')))
          PY
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynca03-${{ matrix.os }}
          path: ${{ runner.temp }}/ynca03-result.json
          if-no-files-found: warn
          retention-days: 30
  atlas-generated-only-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate only source-indexed G29 companions without pushing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python - <<'PY'
          import json,subprocess,os
          d=json.load(open('.ice/code-atlas.json',encoding='utf-8'))
          assert d['source_commit']==os.environ['GITHUB_SHA']
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(paths)==['.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'],paths
          print('YNCA03_ATLAS_GENERATED_ONLY=PASS',d['source_commit'],d['counts'])
          PY
      - name: Export only the three generated sidecars
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynca03-g29-exact-source-sidecars
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: error
          retention-days: 30
  full-native-final-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scientific comparison dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full exact final candidate regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-03 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
