name: CKAD25-Z source-frozen native falsifying witnesses
on:
  push:
    branches: [research/ckad25z-outofclass-witness-20261118]
    paths:
      - ".github/workflows/ckad25z-frozen.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  disjoint-dev-and-native-negative:
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve original tracked exact bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned independently trained controls
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exact native scorer source hashes, negative tests, and disjoint engineering preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ckad25z-outofclass-witness-20261118"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "bb83fd2e3a0f175edd07c23fca6b359a8dfbfbd0"
          test "$(git hash-object tests/test_native_causal_witness.py)" = "c3a19a825e4d596d12803456c968e5074299daa8"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-Z/run.py)" = "6ff323e2876f09a35c58ced3bc25763e0a38dc55"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          test "$(git hash-object yggdrasil/native_causal_relation_posterior.py)" = "ac738c0fe03e5532f9e422dfe972c378728741c7"
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD-25/qualified-development-runs/44331408493")
          linux=(root/"linux/stage-02.native.json").read_bytes()
          windows=(root/"windows/stage-02.native.json").read_bytes()
          assert linux==windows and hashlib.sha256(linux).hexdigest()=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          for path in ("yggdrasil/native_cumulative_learner.py",
                       "tests/test_native_causal_witness.py",
                       "research/contrib/chatgpt/CKAD25-Z/run.py"):
              compile(Path(path).read_text(encoding="utf-8"),path,"exec")
          print("CKAD25Z_FROZEN_SOURCE_AND_NATIVE_OLD_CHECKPOINT_PASS")
          PY
          python -B -m unittest discover -s tests -p 'test_native_causal_witness.py' -v
          python -B -m unittest discover -s tests -p 'test_native_causal_state_acquisition.py' -v
          python -B -m unittest discover -s tests -p 'test_native_causal_regime_recall.py' -v
          python -B -m unittest discover -s tests -p 'test_native_causal_discriminator.py' -v
          python -B research/contrib/chatgpt/CKAD25-Z/run.py --preflight
          test -z "$(git status --porcelain)"
          echo "CKAD25Z_DEV_DISJOINT_SOURCE_WIRING_PASS"

  original-one-shot:
    needs: [disjoint-dev-and-native-negative]
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Keep code/held exact across OS
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install same exact conventional controls
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Lock native and original source bytes before first score
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "bb83fd2e3a0f175edd07c23fca6b359a8dfbfbd0"
          test "$(git hash-object tests/test_native_causal_witness.py)" = "c3a19a825e4d596d12803456c968e5074299daa8"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-Z/run.py)" = "6ff323e2876f09a35c58ced3bc25763e0a38dc55"
          test ! -e research/contrib/chatgpt/CKAD25-Z/result.json
          test -z "$(git status --porcelain)"
          echo "CKAD25Z_FIRST_USE_PROSPECTIVE_LOCK_PASS"
      - name: Exactly one frozen four-seed first source science run
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-Z/run.py --output "$RUNNER_TEMP/ckad25z-result.json"
          cp "$RUNNER_TEMP/ckad25z-result.json" "$RUNNER_TEMP/ckad25z-original.json"
      - name: Same-cohort deterministic evidence replay and stop-boundary checks
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-Z/run.py --output "$RUNNER_TEMP/ckad25z-result.json"
          cmp "$RUNNER_TEMP/ckad25z-result.json" "$RUNNER_TEMP/ckad25z-original.json"
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"ckad25z-result.json").read_bytes()
          d=json.loads(raw)
          assert d["schema"]=="yggdrasil.ckad25z.native-falsifying-witness.v1"
          assert d["science_seeds"]==[72011,72029,72047,72061]
          assert d["scored_original_primary"] is True
          assert d["genuine_source_free_action_consequences"]==312
          assert d["held_phase_predictions"]==24 and d["alias_worlds_not_independent_families"] is True
          assert len(d["per_seed_world"])==12 and len(d["frozen_seeds_source_history"])==4
          assert d["one_native_tokenless_learner_per_seed"] is True
          assert d["native_source_weights_learned_from_real_actions"] is True
          assert d["source_family_labels_not_passed_to_native"] is True
          assert d["scientific_pass"] is False and d["universal_OOD_safety"] is False
          assert d["conventional_superiority"] is False
          assert d["original_owner_science_first_use"] is False
          assert d["accepted_main_changed"] is False and d["forge_dispatch"] is False
          assert d["native_promotion"] is False and d["merge"] is False
          assert d["deployment"] is False
          assert d["executed_source_sha256"]==hashlib.sha256(
              Path("research/contrib/chatgpt/CKAD25-Z/run.py").read_bytes()).hexdigest()
          assert d["independent_conventional_helper_sha256"]==hashlib.sha256(
              Path("research/contrib/chatgpt/CKAD25-S/run.py").read_bytes()).hexdigest()
          assert d["gates"]["original_and_A_B_C_persist_with_cold_witnesses"] is True
          assert d["gates"]["exact_697_conventional_native_output_parity"] is True
          print("CKAD25Z_SOURCE_SCIENCE_BOUNDARY_AUDIT_PASS")
          print("CKAD25Z_RESULT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("CKAD25Z_FROZEN_DISPOSITION="+d["development_disposition"])
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25z-original-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25z-result.json
          if-no-files-found: error
          retention-days: 60
