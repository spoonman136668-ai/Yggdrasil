name: ITD-02 R16 source-selected nonrotational local-cell qualification
on:
  push:
    branches: [research/itd02-r16-public-motion-evidence-20261029]
permissions:
  contents: read
jobs:
  independent-original-public-motion:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Exact source LF policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Original source Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact prospective prereg and unchanged native local cell foundation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 630dde83f45d845488d59a36136d6c026e10880b "$GITHUB_SHA"
          git merge-base --is-ancestor dcebba8a4f196f10ed10c5adddcaad0d1e93fe51 "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r16/PREREG.md)" = eb81bffa1249ecf3a31166c9e70a646687f29efd
          test "$(git hash-object research/native/itd02/r16/motion_cells.py)" = 708d5d48c8aee5d1650d7fbb3983976197bc9f9a
          test "$(git hash-object research/native/itd02/r16/test_motion_cells.py)" = a09f943cfadeb8dd05bf0786e8d8caeff204fad4
          test "$(git hash-object research/native/itd02/r15/continuity_cells.py)" = 6b31f4b0c301564b2793bef8a296a4e722825f01
          test "$(git hash-object research/native/itd02/r14/temporal_cells.py)" = 8cacaad50e8d484f72da5067ff1f03c187877f27
          echo R16_PREREG_AND_UNCHANGED_ORIGINAL_NATIVE_CELLS_PASS
      - name: Inherited R10-R15 plus new R16 original-selected public tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            research.native.itd02.r10.test_public_adapter \
            research.native.itd02.r11.test_affordance_cells \
            research.native.itd02.r12.test_outcome_choice \
            research.native.itd02.r13.test_explore_choice \
            research.native.itd02.r14.test_temporal_cells \
            research.native.itd02.r15.test_continuity_cells \
            research.native.itd02.r16.test_motion_cells
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R16_ORIGINAL_SOURCE_NATIVE_NONROTATIONAL_ENGINEERING_ONLY
