name: Yggdrasil Y034 frozen sticky recovery
on:
  push:
    branches: [research/y034-sticky-memory-recovery-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact immutable lineage and science identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4051a585bd41ff9d88aceee57f548ff5fce5dcd6 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-shock-recovery/execute.py)" = ed0b2da9a83310348a4ccd3f9580a3536ecd42d8
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-sticky-cache/prereg.json)" = 37ff178d4e1ab1c5dd7d4cb55d89fe5e668c669f
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-sticky-cache/execute.py)" = a5c567f76bc019350989bf89d85099dc4c9624f5
          python3 -m json.tool research/contrib/chatgpt/20261013-y034-sticky-cache/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y034-sticky-cache/execute.py
      - name: Original frozen first-use science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y034-sticky-cache/execute.py > /tmp/y034-original.json
          python3 -m json.tool /tmp/y034-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y034-original
          path: /tmp/y034-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One final complete repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
