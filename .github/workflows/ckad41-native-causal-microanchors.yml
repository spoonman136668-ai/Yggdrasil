name: CKAD41 source-trained native microanchors DEV-only 2-OS
on:
  push:
    branches:
      - research/ckad41-native-causal-microanchors-20261118
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  dev:
    if: "github.event.head_commit.message == 'ci(ckad41): frozen DEV engineering qualification'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Avoid platform-dependent line rewrite
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen preregistration and source-only eligibility
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3464c859e79b101894c9682042d460ced5068291 HEAD
          git merge-base --is-ancestor d95674f3edae01268353f47c2d8dddd85ab8f21b HEAD
          test ! -e research/contrib/chatgpt/CKAD-41/pilot_screen_report.json
          test ! -e research/contrib/chatgpt/CKAD-41/primary_report.json
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-41'); [ast.parse(x.read_text()) for x in p.glob('*.py')]"
          python -B research/contrib/chatgpt/CKAD-41/campaign.py --mode preflight
      - name: Native anchor and negative-control tests without scoring DEV/held seeds
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-41 -p test_ckad41.py -v
      - name: Two new authentic-source DEV seeds; record negative science as evidence
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-41/screen_dev.py
          test -z "$(git status --porcelain)"
