name: PR504 immutable final atlas plus focused regression
on:
  push:
    branches: [qualification/ygg-g29-e6ab-artifact-only-20261025]
    paths:
      - '.github/workflows/qualification-pr504-immutable-final.yml'
permissions:
  contents: read
concurrency:
  group: ygg-pr504-exact-source-final-20261025
  cancel-in-progress: false
jobs:
  exact-unchanged-source:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1f747a0929a458d5b1985650c394616f021c7b47
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original source and three G29 generated blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1f747a0929a458d5b1985650c394616f021c7b47'
          test "$(git rev-parse HEAD:scripts/free_fanout_sidecar.py)" = 'f05187381cf3bfbe17415c6d9bfeb586ea949b87'
          test "$(git rev-parse HEAD:tests/test_free_fanout_sidecar.py)" = 'b9fa5313a6b3dfcbb3911a6d5154ec5f50d89421'
          test "$(git rev-parse HEAD:.ice/code-atlas.json)" = 'dbc19e5833a92ed3fa09cf2c0ecb449684e6ccde'
          test "$(git rev-parse HEAD:.ice/code-atlas.html)" = 'd84e670cfea9aedda9e89dc1b9c52986b020efcf'
          test "$(git rev-parse HEAD:.ice/code-atlas.ice)" = '12a4f18ad78a38da6d17491321f34b502ca06375'
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = '204ecd993b954b23e66d6d1e8b3568e7c93183c5'
          test "$(git rev-parse HEAD:research/native/itd01/r7/native_cells.py)" = '4c492a494ac5b25d5e9c49b98185be6a2c966b2f'
          echo PR504_EXACT_ORIGINAL_SOURCE_PINS=PASS
      - name: Verify actual G29 integrity and affected original test suites
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s tests -p test_free_fanout_sidecar.py -v
          python -B -m unittest discover -s tests -p test_portable_checkpoint.py -v
          python -B -m unittest discover -s research/native/itd02/r7 -p test_learner.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo PR504_G29_AND_AFFECTED_REGRESSION=PASS
          echo PR504_ORIGINAL_SOURCE_IMMUTABLE=TRUE
          echo PR504_PROTECTED_SCIENTIFIC_FIRST_USE=NO_GO
