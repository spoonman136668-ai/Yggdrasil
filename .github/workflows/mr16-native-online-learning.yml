name: MR16 Source-Native Online Local Learning
on:
  push:
    branches:
      - research/mr16-native-prequential-local-learning-20261021
  pull_request:
    branches:
      - research/mr15-minigrid-public-local-observation-20261021
permissions:
  contents: read
concurrency:
  group: mr16-native-online-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-prequential-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Fix Git byte policy before source checkout on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout original Yggdrasil source with no stored tokens
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original Farama source without modification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Original source compatible Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original independent source SHA and all pinned Git blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install fixed public native runtime packages
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Execute real MiniGrid native actions then original 45-weight Ygg learning with equal-data controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -B yggdrasil/research/mr16/run_native.py external/minigrid
      - name: Preserve original public sensor acceptance
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -B yggdrasil/research/mr15/probe_original_view.py external/minigrid
      - name: Original Git trees remain exact after development execution
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
