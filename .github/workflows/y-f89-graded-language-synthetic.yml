name: Yggdrasil F89 frozen graded-language synthetic gate
on:
  push:
    branches:
      - research/y-f89-graded-language-exchange-20261016-r1
    paths:
      - 'research/foundational/20261016-y-f89/prereg.json'
      - 'research/foundational/20261016-y-f89/*.py'
      - '.github/workflows/y-f89-graded-language-synthetic.yml'

permissions:
  contents: read

jobs:
  f89:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact frozen sources and preregistration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a24abab5f778c753f2e8e3f21adf077ceb1cb6b8 HEAD
          test "$(git hash-object research/foundational/20261016-y-f89/prereg.json)" = 4fd1967d6b6e225471f49a0d10b8c17534bd05ce
          test "$(git hash-object research/foundational/20261016-y-f88/frontier.py)" = 1e613ee872e545d0ec874ec81c2d4d3ba4742d8d
          test "$(git hash-object research/foundational/20261016-y-f87b/bridge_reserve.py)" = 0026a7f4a9827d960c5ed06f4ce206404e3d739a
          test "$(git hash-object research/foundational/20261016-y-f85/global_solver.py)" = e4eb4bfbd6a01212f8c1eebc38af09b15c6d9cc3
          test "$(git hash-object research/foundational/20261016-y-f83/pairwise_learner.py)" = 68138887c8bc42a17f8866df96cbede8e2594325
      - name: Focused F89 and frozen F88 F85 regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s research/foundational/20261016-y-f89 -p 'test_graded_exchange.py'
          python3 -B -m unittest discover -v -s research/foundational/20261016-y-f88 -p 'test_frontier.py'
          python3 -B -m unittest discover -v -s research/foundational/20261016-y-f85 -p 'test_global_solver.py'
      - name: One immutable F89 disjoint negative synthetic guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261016-y-f89/graded_exchange.py --once-disjoint-synthetic-only > "$RUNNER_TEMP/f89-guard-first-use.json"
          python3 -B -c 'import json,os; d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f89-guard-first-use.json"))); assert d["stage"]=="NEW_NEGATIVE_SYNTHETIC_ONLY" and d["cases"]==32 and d["six_step_cases"]==8; assert d["all_72_causal_prefixes_audited"] and d["max_persistent_memory_bytes"]<=144; assert d["no_query_or_future_in_online"] and d["no_policy_fitting"]; assert d["no_protected_original"] and d["no_FIT"] and d["no_DIAG"] and d["no_F3"] and d["no_controller_or_optimizer_mutation"] and not d["science_accepted"]; print(json.dumps({k:d[k] for k in ("classification","cases","scores","six_step_rescues_from_F60","F60_correct_case_regressions","native_override_events","eligible_native_action_opportunities","resource_cap_events","total_allowed_short_tuple_losses","per_regime_and_kind")},sort_keys=True))'
      - name: Verify read-only research source checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
