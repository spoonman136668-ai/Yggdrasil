name: CKAD02-04 native context basis qualification
on:
  push:
    branches: [research/ckad02-04-native-context-basis-20261116]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ckad02): run frozen native context basis campaign'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Focused native representation and source-negative qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a0b3089024446325565a6ffd092a10546f9ca99b HEAD
          python -B -m unittest discover -s tests -p test_native_context_basis.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
  primary:
    needs: [development]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.audit.outputs.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen fully trained conventional control dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Reuse previously compiled historical image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14220169461/zip \
            -o "$RUNNER_TEMP/ckad-image.zip"
      - name: Consecutive widest-first representation, retention and bounded repair
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-02/campaign.py \
            --compiled-image-zip "$RUNNER_TEMP/ckad-image.zip" \
            --output-directory "$RUNNER_TEMP/ckad02-linux"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CKAD02-linux-proof
          path: ${{ runner.temp }}/ckad02-linux/
          if-no-files-found: error
          retention-days: 30
  replication:
    needs: [primary]
    if: github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install same frozen conventional control dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Reuse previously compiled historical image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 240 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14220169461/zip \
            -o "$RUNNER_TEMP/ckad-image.zip"
      - name: Independent Windows stable reproduction
        env:
          CKAD02_EXPECTED_RESULT: ${{ needs.primary.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-02/campaign.py \
            --compiled-image-zip "$RUNNER_TEMP/ckad-image.zip" \
            --output-directory "$RUNNER_TEMP/ckad02-windows" --verify-env
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CKAD02-windows-proof
          path: ${{ runner.temp }}/ckad02-windows/campaign-result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [primary, replication]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CKAD02-linux-proof
          path: ${{ runner.temp }}/ckad-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CKAD02-windows-proof
          path: ${{ runner.temp }}/ckad-windows
      - name: Seal outcomes and distinct native checkpoints, then derive source atlas
        id: seal
        env:
          CKAD02_LINUX_DIRECTORY: ${{ runner.temp }}/ckad-linux
          CKAD02_WINDOWS_DIRECTORY: ${{ runner.temp }}/ckad-windows
          CKAD02_PREREG_SHA: a0b3089024446325565a6ffd092a10546f9ca99b
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-02/seal.py
          git add -- research/contrib/chatgpt/CKAD-02/result.json \
            research/contrib/chatgpt/CKAD-02/replication-windows.json \
            research/contrib/chatgpt/CKAD-02/provenance.json \
            research/contrib/chatgpt/CKAD-02/SESSION_REPORT.md \
            research/contrib/chatgpt/CKAD-03 research/contrib/chatgpt/CKAD-04
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ckad02): preserve native representation, retention and repair evidence'
          RESULT_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git commit -m "docs(ckad02): native context source atlas at $RESULT_SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad02-04-native-context-basis-20261116
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory complete final candidate regression
        env:
          EXPECTED_CANDIDATE: ${{ needs.seal.outputs.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          git rev-parse HEAD HEAD^{tree}
          git merge-base --is-ancestor a0b3089024446325565a6ffd092a10546f9ca99b HEAD
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-g29:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent exact-final atlas qualification
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
