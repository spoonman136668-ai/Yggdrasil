name: ITD-02 pinned DTR public-event contract
on:
  pull_request:
    paths:
      - 'research/native/itd02/dtr_public_event_contract.py'
      - 'tests/test_itd02_dtr_public_event_contract.py'
      - '.github/workflows/itd02-dtr-public-event-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-event-contract:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: DTR public-event boundary focused tests
        run: python -B -m unittest discover -s tests -p test_itd02_dtr_public_event_contract.py -v
