name: ITD-02 V31U consolidated original qualification
on:
  push:
    branches: [research/itd02-v31u-consolidated-qualification-20261028]
permissions:
  contents: read
jobs:
  full-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run original full inherited suite and record all blockers unmodified
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1dd00870aa4a9dcb4c3e90574e7c57904c139a05 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
          mkdir -p "$RUNNER_TEMP/v31u"
          set +e
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_*.py' -v > "$RUNNER_TEMP/v31u/inherited.log" 2>&1
          echo $? > "$RUNNER_TEMP/v31u/inherited.exit"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v > "$RUNNER_TEMP/v31u/native.log" 2>&1
          echo $? > "$RUNNER_TEMP/v31u/native.exit"
          python scripts/build_code_atlas.py --check > "$RUNNER_TEMP/v31u/g29.log" 2>&1
          echo $? > "$RUNNER_TEMP/v31u/g29.exit"
          set -e
          python - "$RUNNER_TEMP/v31u" <<'PY'
          import pathlib,json,re,sys
          p=pathlib.Path(sys.argv[1]);s=(p/'inherited.log').read_text(errors='replace')
          d={'schema':'itd02.v31u.consolidated.v1','classification':'V31U_CONSOLIDATION_BASELINE__INHERITED_NOT_YET_ACCEPTED__NO_SCIENCE',
             'inherited_exit':int((p/'inherited.exit').read_text()),
             'native_focused_exit':int((p/'native.exit').read_text()),
             'g29_strict_exit':int((p/'g29.exit').read_text()),
             'summary':re.findall(r'^(?:Ran \d+ tests.*|FAILED \(.*|OK)$',s,re.M)[-3:],
             'failures':sorted(set(re.findall(r'^(?:FAIL|ERROR): ([^\n]+)',s,re.M))),
             'model_changed':False,'reserved_holdout_evaluated':False,'science_first_use':False}
          assert d['native_focused_exit']==0
          (p/'report.json').write_text(json.dumps(d,sort_keys=True,indent=2))
          print(json.dumps(d,sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31u-consolidated-${{ matrix.os }}
          path: ${{ runner.temp }}/v31u/*
          retention-days: 7
