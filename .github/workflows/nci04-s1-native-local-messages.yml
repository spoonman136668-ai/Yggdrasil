name: NCI-04 S1 Native Self-Organizing Local Messages
on:
  push:
    branches:
      - research/nci04-s1-local-predictive-messaging-20261021
  pull_request:
    branches:
      - research/mr33-public-intervention-signal-audit-20261021
permissions:
  contents: read
concurrency:
  group: nci04-s1-original-predictive-messages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-neighbor-message-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve original Git checkout bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact NCI-04 S1 native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original independent Farama MiniGrid source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 original native source
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify independently authored original source blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Original source pinned Python dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Train local delayed-credit messages and evaluate genuine native controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.nci04_s1.original_native_messages ../external/minigrid | tee ../nci04-s1-original-receipt.log
          grep -q '^NCI04_S1_ORIGINAL_NATIVE_LOCAL_PREDICTIVE_COMMUNICATION=' ../nci04-s1-original-receipt.log
      - name: Original and project Git checkouts unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
