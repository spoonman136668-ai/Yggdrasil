name: ITD-02 V31R-SRC Windows regression differential
on:
  push:
    branches: [research/itd02-v31r-src-windows-differential-20261028]
permissions:
  contents: read
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned original source check
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor aa83c4ff37506c3349283a30ae81890d1fccc901 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Run actual Windows-only failure candidates unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31r"
          for name in test_free_fanout_sidecar test_nci04g6_native_credit test_nci04g7_source_producer test_nci04g7d_native_lesion test_nci04g7e_functional_custody; do
            set +e
            PYTHONPATH=. python -B -m unittest discover -s tests -p "$name.py" -v > "$RUNNER_TEMP/v31r/$name.log" 2>&1
            status=$?
            set -e
            echo "$status" > "$RUNNER_TEMP/v31r/$name.exit"
          done
          python - "$RUNNER_TEMP/v31r" <<'PY'
          import json,pathlib,re,sys,platform,subprocess
          p=pathlib.Path(sys.argv[1]);names=('test_free_fanout_sidecar','test_nci04g6_native_credit','test_nci04g7_source_producer','test_nci04g7d_native_lesion','test_nci04g7e_functional_custody')
          rows=[]
          for n in names:
              s=(p/(n+'.log')).read_text(errors='replace')
              rows.append({'module':n,'exit':int((p/(n+'.exit')).read_text()),'failed':re.findall(r'^(?:FAIL|ERROR): ([^\n]+)',s,re.M),
               'summary':re.findall(r'^(?:Ran \d+ tests.*|FAILED \(.*|OK)$',s,re.M)[-2:],
               'trace_tail':s[-2200:]})
          d={'schema':'itd02.v31r.src.host_differential.v1','head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'host':platform.platform(),'python':platform.python_version(),'results':rows,
             'classification':'V31R_SRC_HOST_DIFFERENTIAL_CAPTURED__INHERITED_BLOCKED__NO_SCIENCE',
             'reserved_holdout_evaluated':False,'scientific_first_use':False}
          (p/'report.json').write_text(json.dumps(d,sort_keys=True,indent=2))
          print(json.dumps({k:v for k,v in d.items() if k!='results'}|{'results':[{k:v for k,v in row.items() if k!='trace_tail'} for row in rows]},sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve raw failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31r-src-${{ matrix.os }}
          path: ${{ runner.temp }}/v31r/*
          retention-days: 7
