name: AAI-10C frozen compact causal learner and source-only measured gate
on:
  push:
    branches: [research/aai10c-bounded-causal-statistics-20261114]
    paths: [.github/workflows/aai10c-source-and-atlas.yml]
permissions:
  contents: write
concurrency:
  group: aai10c-source-only-20261114
  cancel-in-progress: false
jobs:
  mechanical:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10C frozen source qualification and synthetic efficiency one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original prereg, source/benchmark blobs and branch lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'e41254ff2c74b99a4aac355ead8a2137b53832b2'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10c-source-and-atlas.yml'
          test "$(git rev-parse b12bbc49ee695bf9a47e8bb59ec348694e72bf2f^)" = '64a585010e13519c6290cc8c406154e1f23b9e78'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/prereg.json)" = 'e6a59aa8070028094790ee58ca4c17a373fe642a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/prereg.json)" = "$(git rev-parse b12bbc49ee695bf9a47e8bb59ec348694e72bf2f:research/contrib/chatgpt/AAI-10C/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/compact.py)" = 'b8eb196fd923743f22d372135561f5c1a4f28982'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/test_compact.py)" = 'cc20fb6cedddf47398d5e0dde9baf497ac5878cc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10C/profile_dev.py)" = '693aa61685dca3ff644f3ed27e264d30c23206eb'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/models.py)" = '9233ffaafe2f227de687116b0ed4204ee4e2b3a2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          test -z "$(git status --porcelain)"
          echo AAI10C_PREREG_PRECODE_AND_SOURCE_CUSTODY_PASS
      - name: Synthetic public-causality, bounded memory, cold and science disarm tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10C -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-10C/profile_dev.py --primary > /dev/null 2>&1; then
            echo AAI10C_FIRST_USE_DISARM_FAILED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI10C_SOURCE_ONLY_NO_SCIENCE_TESTS_PASS
      - name: One original fixed synthetic dev benchmark, three cost medians per method
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-10C/profile_dev.py --dev
          test -z "$(git status --porcelain)"
          echo AAI10C_PREDECLARED_RESOURCE_RESULT_PRESERVED
  atlas:
    needs: mechanical
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly existing three G29 atlas artifacts from source SHA
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'e41254ff2c74b99a4aac355ead8a2137b53832b2'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-10C generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai10c-bounded-causal-statistics-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai10c-bounded-causal-statistics-20261114
          echo AAI10C_SOURCE_PINNED_ATLAS_GENERATED_ONLY_PASS
