name: MR34F Independent Source Prospective Trained History Controls
on:
  push:
    branches:
      - research/mr34f-prospective-history-controls-20261021
permissions:
  contents: read
concurrency:
  group: mr34f-prospective-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independently-authored-native-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve exact source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout Yggdrasil proposed research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original Farama MiniGrid exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original DeepMind Pycolab exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Python for original engine
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Pycolab's pinned numerical/runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 six==1.17.0 psutil==6.1.1 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Supply platform curses binding for unmodified original Pycolab example
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify Farama original source blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Train frozen conventional memoryless recurrent Bayesian symbolic controls on authentic source actions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr34f.prospective_controls ../external/minigrid ../external/pycolab | tee ../mr34f-prospective-history-history-receipt.log
          grep -q '^MR34F_ORIGINAL_PROSPECTIVE_PUBLIC_HISTORY_CONTROLS=' ../mr34f-prospective-history-history-receipt.log
      - name: Confirm both original source worktrees remain unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/pycolab diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/pycolab status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
