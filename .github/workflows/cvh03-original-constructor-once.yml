name: CVH-03 original unchanged CausalGym factory constructor-only qualification
on:
  push:
    branches: [qualification/cvh03-original-mdp-constructor-once-20261116]
    paths: [.github/workflows/cvh03-original-constructor-once.yml]
permissions:
  contents: read
concurrency:
  group: cvh03-original-constructor-only-20261116
  cancel-in-progress: false
jobs:
  source-verified-constructor-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'CVH-03 original source constructor only qualification'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: e0b1ffb7b50f5bda7fba437a522b6077e6fee8d5
      UPSTREAM_PIN: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent Windows checkout CRLF conversion
        run: git config --global core.autocrlf false
      - name: Frozen CVH-03 code checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e0b1ffb7b50f5bda7fba437a522b6077e6fee8d5
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original source code and independently qualified predecessor custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-03/prereg.json)" = d332023a09f2c1e7f33ac1a9a40b9f2528aa0068
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-03/source_binding.py)" = 7d38d861044d844f4bd8f59c1e234c4d7f01ee76
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CVH-03/probe_constructor.py)" = ca5c9f6f07e78acd3ec1be00807298fad3296012
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-25/runtime_probe.py)" = 1cfe7fe6cc7b2273cc7232cb38e4d648b25b0236
          test -z "$(git status --porcelain)"
          echo CVH03_SOURCE_SHA_PIN_PASS
      - name: Resolve FKP25 exact existing lightweight dependency versions
        run: |
          set -euo pipefail
          python -m pip install --no-input --disable-pip-version-check numpy==1.26.4 gymnasium==0.29.1 networkx==3.2.1 toposort==1.10 pydash==8.0.5
          python -B - <<'PY'
          import importlib.metadata as md
          expected={'numpy':'1.26.4','gymnasium':'0.29.1','networkx':'3.2.1','toposort':'1.10','pydash':'8.0.5'}
          assert {k:md.version(k) for k in expected}==expected
          print("CVH03_PINNED_DEPENDENCIES_PASS")
          PY
      - name: Fetch only clean unchanged upstream exact Git source
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --filter=blob:none https://github.com/CausalAILab/Causal-Gymnasium.git "$RUNNER_TEMP/causal-original"
          git -C "$RUNNER_TEMP/causal-original" fetch --quiet --no-tags --depth=1 origin "$UPSTREAM_PIN"
          git -C "$RUNNER_TEMP/causal-original" checkout --quiet --detach "$UPSTREAM_PIN"
          test "$(git -C "$RUNNER_TEMP/causal-original" rev-parse HEAD)" = "$UPSTREAM_PIN"
          test -z "$(git -C "$RUNNER_TEMP/causal-original" status --porcelain)"
          echo CVH03_UPSTREAM_ORIGINAL_SOURCE_PIN_PASS
      - name: Construct two original source objects without physical actions
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CVH-03/probe_constructor.py --checkout "$RUNNER_TEMP/causal-original" --out "$RUNNER_TEMP/cvh03-ctor.json" > "$RUNNER_TEMP/cvh03-ctor.stdout"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'cvh03-ctor.json').read_text())
          assert r['source_sha']=='c94e9a4cd3641588b6b8507e71ccee5c27032bdf'
          assert r['source_blobs_verified']==16
          assert r['native_objects_constructed']==2
          assert r['targeted_original_class']=='causal_gym.envs.mdp.MDPPCH'
          assert r['original_class_identity_equal'] is True
          assert r['closed_factory_reuse_denied'] is True
          assert r['source_action_calls']==r['source_reset_calls']==r['native_model_transitions']==0
          assert r['external_world_seed_consumed'] is False
          assert r['actual_source_run'] is False
          assert r['scientific_pass'] is False and r['native_accepted'] is False
          print('CVH03_ORIGINAL_TWO_OBJECTS_SOURCE_ACTIONS_ZERO_PASS')
          print('CVH03_CONSTRUCTOR_RECEIPT_SHA256='+r['source_receipt_sha256'])
          PY
          test -z "$(git status --porcelain)"
      - name: Protected source actions remain disabled and original checkout clean
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if test -d "$RUNNER_TEMP/causal-original/.git"; then
            test "$(git -C "$RUNNER_TEMP/causal-original" rev-parse HEAD)" = "$UPSTREAM_PIN"
            test -z "$(git -C "$RUNNER_TEMP/causal-original" status --porcelain)"
          fi
          if python -B research/contrib/chatgpt/CVH-03/probe_constructor.py --checkout "$RUNNER_TEMP/causal-original" --out "$RUNNER_TEMP/never.json" --source-action >/dev/null 2>&1; then exit 1; fi
          test -z "$(git status --porcelain)"
          echo CVH03_SOURCE_WORLD_FIRST_USE_ZERO_AND_EXACT_SOURCE_CLEAN_PASS
