name: Yggdrasil Y040 frozen hibernation-reactivation science
on:
  push:
    branches: [research/chatgpt-y040-hibernation-reactivation-20261013]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen original identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 63a0c708d63ba52556a2096cbf95cda247f42980 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-hibernation/prereg.json)" = 2f5a7a47aee04e6b3d5cbccd063ffdd9f4572648
          test "$(git hash-object research/contrib/chatgpt/20261013-y040-hibernation/execute.py)" = 6c6ba3ebf39456056fca0e60a8210d941cf69e43
          python3 -m json.tool research/contrib/chatgpt/20261013-y040-hibernation/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y040-hibernation/execute.py
      - name: Original Y040 hibernation memory science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y040-hibernation/execute.py > /tmp/Y040-original.json
          python3 -m json.tool /tmp/Y040-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y040-original-hibernation-reactivation
          path: /tmp/Y040-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
