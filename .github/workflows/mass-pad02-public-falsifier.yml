name: "Mass PAD02 prospective structural and lagged-credit falsifier"
on:
  pull_request:
    branches: [research/mass-itd-predictive-action-credit-dev-20261023]
    paths:
      - 'research/native/itd01/mass_pad02/**'
      - '.github/workflows/mass-pad02-public-falsifier.yml'
permissions:
  contents: read
concurrency:
  group: mass-pad02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  one-original-public-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact untouched candidate blob and FIRST-only source
        shell: bash
        run: |
          set -euo pipefail
          base=02e040f77b1b824dfe6a388b5df03fe33c6b8b09
          first=5cb09132674a85b5f2ae8ee0e16ca8ac7b5017da
          test "$(git rev-parse "${first}^")" = "$base"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_pad02/PAD02_FIRST_PROTOCOL.md"
          test "$(git hash-object research/native/itd01/mass_pad01/run.py)" = "c6dc75ea14996d862fcbaa384156f1efd625effd"
          actual="$(git diff --name-only "$base" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mass-pad02-public-falsifier.yml' \
            'research/native/itd01/mass_pad02/PAD02_FIRST_PROTOCOL.md' \
            'research/native/itd01/mass_pad02/source.py' \
            'research/native/itd01/mass_pad02/compare.py' \
            'research/native/itd01/mass_pad02/test_pad02.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo PAD02_PINNED_CANDIDATE_AND_FIRST_PROTOCOL_PASS
      - name: Source-free focused test before source-role evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research.native.itd01.mass_pad02.test_pad02 2>&1 | tee pad02-focused.log
      - name: Consume exactly one internal public T and L development cohort
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.native.itd01.mass_pad02.compare --outdir pad02-evidence 2>&1 | tee pad02-original-console.log
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("pad02-evidence/receipt.json").read_text())
          assert x["source_fit_action_count"]==1152
          assert x["source_dev_action_count"]==4608
          assert x["protected_first_use_count"]==0
          assert len(x["tasks"])==6
          assert all(t["actions_frozen_vs_matched_pair_identical"] for t in x["tasks"])
          assert not x["scientific_promotion_authorized"]
          assert x["disposition"] in ("PAD02_CONVENTIONAL_EXPLAINS_PRIOR_GAIN","PAD02_FALSIFICATION_INCONCLUSIVE")
          print("PAD02_ONE_ORIGINAL_PUBLIC_COHORT_AND_NO_SCIENCE_PROMOTION_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pad02-prospective-original-public-development
          path: |
            pad02-focused.log
            pad02-original-console.log
            pad02-evidence/receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve clean source tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo PAD02_TRACKED_WORKTREE_CLEAN_PASS
