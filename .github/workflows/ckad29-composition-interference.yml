name: CKAD29 native composition preflight
on:
  push:
    branches:
      - research/ckad29-composition-interference-20261118
permissions:
  contents: read
jobs:
  frozen-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned source and native smoke without B outcomes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 022d7477de56bb2793b52d2ae3a02e86bbf73bdd HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode preflight
  frozen-b-primary:
    needs: [frozen-source-preflight]
    if: "github.event.head_commit.message == 'ci(ckad29): execute frozen B' && github.run_attempt == 1"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Single prospective public B scored result
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode score > "$RUNNER_TEMP/ckad29-primary.json"
          python -m json.tool "$RUNNER_TEMP/ckad29-primary.json" > /dev/null
          cat "$RUNNER_TEMP/ckad29-primary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad29-primary-linux
          path: ${{ runner.temp }}/ckad29-primary.json
          if-no-files-found: error
          retention-days: 30
  independent-windows-replay:
    needs: [frozen-b-primary]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad29-primary-linux
          path: ${{ runner.temp }}/ckad29-linux
      - name: Disjoint platform deterministic replay
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode score > "$RUNNER_TEMP/ckad29-replay.json"
          python -c 'import json,sys; a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));a.pop("wall_seconds");b.pop("wall_seconds");assert a==b, "CKAD29_WINDOWS_SCORE_DRIFT"' "$RUNNER_TEMP/ckad29-linux/ckad29-primary.json" "$RUNNER_TEMP/ckad29-replay.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad29-replay-windows
          path: ${{ runner.temp }}/ckad29-replay.json
          if-no-files-found: error
          retention-days: 30

  finalize-atlas:
    if: "github.event.head_commit.message == 'docs(ckad29): seal source atlas' && github.run_attempt == 1"
    needs: [frozen-source-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.atlas.outputs.candidate }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify sealed original result and generate G29 source-only sidecars
        id: atlas
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e4244ee3fa4a4f3d4670f2248cedab07c530fac7 HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/result.json)" = ff22bccc9fa80ed69d37db9c425617e770577ee9
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          test -z "$(git status --porcelain)"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE_COMMIT" --write
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(ckad29): materialize exact-source G29 atlas"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad29-composition-interference-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-final-regression:
    needs: [finalize-atlas]
    if: needs.finalize-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.finalize-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned conventional-native CPU regression dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory inherited full tests plus independent source audit on exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.finalize-atlas.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-g29:
    needs: [finalize-atlas]
    if: needs.finalize-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.finalize-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently check pinned atlas and frozen result accounting
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.finalize-atlas.outputs.candidate }}"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          test -z "$(git status --porcelain)"
