name: CKAD29 native composition preflight
on:
  push:
    branches:
      - research/ckad29-composition-interference-20261118
permissions:
  contents: read
jobs:
  frozen-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned source and native smoke without B outcomes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 022d7477de56bb2793b52d2ae3a02e86bbf73bdd HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode preflight
  frozen-b-primary:
    needs: [frozen-source-preflight]
    if: "github.event.head_commit.message == 'ci(ckad29): execute frozen B' && github.run_attempt == 1"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Single prospective public B scored result
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode score > "$RUNNER_TEMP/ckad29-primary.json"
          python -m json.tool "$RUNNER_TEMP/ckad29-primary.json" > /dev/null
          cat "$RUNNER_TEMP/ckad29-primary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad29-primary-linux
          path: ${{ runner.temp }}/ckad29-primary.json
          if-no-files-found: error
          retention-days: 30
  independent-windows-replay:
    needs: [frozen-b-primary]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad29-primary-linux
          path: ${{ runner.temp }}/ckad29-linux
      - name: Disjoint platform deterministic replay
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode score > "$RUNNER_TEMP/ckad29-replay.json"
          python -c 'import json,sys; a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));a.pop("wall_seconds");b.pop("wall_seconds");assert a==b, "CKAD29_WINDOWS_SCORE_DRIFT"' "$RUNNER_TEMP/ckad29-linux/ckad29-primary.json" "$RUNNER_TEMP/ckad29-replay.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad29-replay-windows
          path: ${{ runner.temp }}/ckad29-replay.json
          if-no-files-found: error
          retention-days: 30
