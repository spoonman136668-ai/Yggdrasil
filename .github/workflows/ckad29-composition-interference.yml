name: CKAD29 native composition and retention (frozen external research)
on:
  push:
    branches: [research/ckad29-composition-interference-20261118]
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  focused:
    if: "github.event.head_commit.message == 'ci(ckad29): preflight frozen source' || github.event.head_commit.message == 'ci(ckad29): execute frozen B'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source and prereg, non-B native smoke
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 022d7477de56bb2793b52d2ae3a02e86bbf73bdd HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          python -B -m py_compile research/contrib/chatgpt/CKAD-29/campaign.py
          python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode preflight
          python -B -m unittest discover -s tests -p test_native_cumulative_learner.py -v
          test -z "$(git status --porcelain)"
  score-linux:
    needs: [focused]
    if: "github.event.head_commit.message == 'ci(ckad29): execute frozen B' && github.run_attempt == 1"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exactly one frozen B first use
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode score > "$RUNNER_TEMP/ckad29-result.json"
          python -m json.tool "$RUNNER_TEMP/ckad29-result.json" > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad29-linux-first-use
          path: ${{ runner.temp }}/ckad29-result.json
          if-no-files-found: error
          retention-days: 30
  replay-windows:
    needs: [score-linux]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad29-linux-first-use
          path: ${{ runner.temp }}/ckad29-linux
      - name: Independent Windows replay and exact score parity
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode score > "$RUNNER_TEMP/ckad29-windows.json"
          python -c 'import json,sys; a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2])); a.pop("wall_seconds");b.pop("wall_seconds");assert a==b, "CKAD29_WINDOWS_REPLAY_DRIFT"' "$RUNNER_TEMP/ckad29-linux/ckad29-result.json" "$RUNNER_TEMP/ckad29-windows.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad29-windows-replay
          path: ${{ runner.temp }}/ckad29-windows.json
          if-no-files-found: error
          retention-days: 30
  full-regression:
    needs: [replay-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned native CPU regression dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory exact-head inherited native regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
