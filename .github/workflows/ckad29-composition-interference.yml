name: CKAD29 final evidence and cross-platform qualification
on:
  push:
    branches:
      - research/ckad29-composition-interference-20261118
    paths-ignore:
      - '.ice/code-atlas.json'
      - '.ice/code-atlas.html'
      - '.ice/code-atlas.ice'
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.build.outputs.candidate }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check sealed B before materializing exact G29 source sidecars
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e4244ee3fa4a4f3d4670f2248cedab07c530fac7 HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/result.json)" = ff22bccc9fa80ed69d37db9c425617e770577ee9
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())=={'.ice/code-atlas.json','.ice/code-atlas.html','.ice/code-atlas.ice'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ckad29): pinned G29 source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad29-composition-interference-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regression:
    needs: atlas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full inherited native regression, original score audit and G29
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
