name: CKAD29 native composition preflight
on:
  push:
    branches:
      - research/ckad29-composition-interference-20261118
permissions:
  contents: read
jobs:
  frozen-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned source and native smoke without B outcomes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 022d7477de56bb2793b52d2ae3a02e86bbf73bdd HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-29/campaign.py)" = f32f523766368f1c7ea6cc387c5bb663e6a17282
          python -B research/contrib/chatgpt/CKAD-29/campaign.py --mode preflight
