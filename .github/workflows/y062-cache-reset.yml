name: Yggdrasil Y062 frozen public event-driven retained-cache reset
on:
  push:
    branches: [research/y062-detection-cache-invalidation-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen scientific prereg and source identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f9559aeef0cb9daa33cae31bc620af2c796dac4c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y061-matching-cache/execute.py)" = b9baf4f177ede0b21825ff391488a74b0a63b786
          test "$(git hash-object research/contrib/chatgpt/20261013-y062-cache-flush/prereg.json)" = f33e42be0ad68dc5434b8c0c0aa1d49a602ac79a
          test "$(git hash-object research/contrib/chatgpt/20261013-y062-cache-flush/execute.py)" = 7e820563fe92613d0f0459fbdfe459d788faefd1
          python3 -m json.tool research/contrib/chatgpt/20261013-y062-cache-flush/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y062-cache-flush/execute.py
      - name: Original first-use sealed four-arm cache reset and sham control
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y062-cache-flush/execute.py > /tmp/Y062-original.json
          python3 -m json.tool /tmp/Y062-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y062-original.json'))
          assert x['development_seeds']==list(range(3632,3640))
          assert x['sealed_heldout_seeds']==list(range(3648,3664))
          assert len(x['heldout_records'])==2*3*4*16*3
          assert x['per_trial_public_scalar_reads']==10
          assert x['retained_limit']==9 and x['active']==7
          assert all(v['public_reads']==4*16*3*10
                     for g in x['source_groups'].values() for v in g['arms'].values())
          print('CLASSIFICATION',x['classification'])
          print('STEADY_NO_MISMATCH',x['steady_no_mismatches'])
          print('BLIND_NO_FLUSH',x['blind_no_oracle_flush'])
          print('CACHE_EFFECTS',x['precommitted_cache_intervention_comparisons'])
          for key,g in x['source_groups'].items():
              print('GROUP',key,{
                  arm:{"post":v['post_detection_mismatch_episodes'],
                       "total":v['mismatch_episodes'],
                       "flushes":v['cache_flushes']}
                  for arm,v in g['arms'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y062-original-cache-invalidation
          path: /tmp/Y062-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One required complete Yggdrasil pytest regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
