name: DG1-MD35 source-only custody and inherited qualification
on:
  push:
    branches: [research/dg1-md35-strong-control-headroom-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md35-20261114/**'
      - '.github/workflows/dg1-md35-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  source:
    if: "${{ github.event.head_commit.message != 'ci(md35): arm one-shot derived G29 atlas' }}"
    name: MD35 no-first-use source gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen prereg and inherited source, no protected first use
        shell: bash
        run: |
          git merge-base --is-ancestor 6b79f778a01372982d3ca3cf209a7a83508cc993 HEAD
          git merge-base --is-ancestor cd031504130732617e9ce55ee0da5476f559f59e HEAD
          git diff --exit-code 6b79f778a01372982d3ca3cf209a7a83508cc993 HEAD -- research/contrib/chatgpt/dg1-md35-20261114/prereg.json
          git diff --exit-code cd031504130732617e9ce55ee0da5476f559f59e HEAD -- research/contrib/chatgpt/dg1-md30-20261114 research/contrib/chatgpt/dg1-md31-20261114 research/contrib/chatgpt/dg1-md32-20261114 research/contrib/chatgpt/dg1-md33-20261114 research/contrib/chatgpt/dg1-md34-20261114
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('research/contrib/chatgpt/dg1-md35-20261114/prereg.json').read_text('utf-8'))
          assert lock['status']=='PREREGISTRATION_ONLY_BEFORE_MD35_MODEL_SOURCE_DATA_OR_SCORES'
          assert lock['parent']['exact_parent_sha']=='cd031504130732617e9ce55ee0da5476f559f59e'
          assert lock['qualification']['merge'] is False and lock['qualification']['deployment'] is False
          print('MD35_ORIGINAL_PREREG_FROZEN_PASS')
          print('MD35_MD30_MD34_INHERITED_SOURCE_UNMODIFIED_PASS')
          PY
      - name: Install pinned CPU inherited dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
      - name: MD35 allocation and adversarial no-first-use tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md35-20261114/custody.py research/contrib/chatgpt/dg1-md35-20261114/public_actions.py research/contrib/chatgpt/dg1-md35-20261114/public_policy.py research/contrib/chatgpt/dg1-md35-20261114/bayesian_control.py research/contrib/chatgpt/dg1-md35-20261114/model_based_rl.py research/contrib/chatgpt/dg1-md35-20261114/gated_recurrent.py research/contrib/chatgpt/dg1-md35-20261114/test_custody.py research/contrib/chatgpt/dg1-md35-20261114/test_models.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md35-20261114 -p 'test_*.py' -v
          python - <<'PY'
          import runpy
          from pathlib import Path
          functions = runpy.run_path(
              'research/contrib/chatgpt/dg1-md35-20261114/custody.py',
              run_name='md35_source_only_report')
          payload = functions['canonical'](functions['split_preflight']())
          Path('md35-allocation.json').write_bytes((payload + '\n').encode('ascii'))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('md35-allocation.json').read_text('utf-8'))
          assert r['status']=='ALLOCATION_ONLY_NOT_FIRST_USE'
          assert r['worlds_instantiated']==0 and r['physical_actions']==0
          assert r['training_executed'] is False
          assert r['transfer_opened'] is False and r['cold_opened'] is False
          assert {k: v['episodes'] for k,v in r['splits'].items()}=={
             'train':1536,'validation':384,
             'unfamiliar_transfer':384,'independent_cold':192}
          print('MD35_FROZEN_SPLIT_SOURCE_GATE_PASS')
          print('MD35_NO_TRAINING_NO_HOLDOUT_FIRST_USE')
          PY
      - name: Full existing Yggdrasil and frozen MD30-MD34 regressions
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          for md in 30 31 32 33 34; do
            python -m unittest discover -s "research/contrib/chatgpt/dg1-md${md}-20261114" -p 'test_*.py' -v
          done
          echo MD35_SOURCE_ONLY_FULL_INHERITED_REGRESSION_PASS
      - name: Retain deterministic read-only source receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: md35-allocation-${{ matrix.os }}
          path: md35-allocation.json
          if-no-files-found: error
  parity:
    name: MD35 exact allocation receipt parity, no science
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md35-allocation-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md35-allocation-windows-2022
          path: windows
      - name: Compare exact cross-platform unopened allocations
        shell: bash
        run: |
          cmp linux/md35-allocation.json windows/md35-allocation.json
          echo MD35_CROSS_OS_UNOPENED_SPLIT_PARITY_PASS
          echo MD35_SCIENCE_NOT_RUN
  derived_g29:
    if: "${{ github.event.head_commit.message == 'ci(md35): arm one-shot derived G29 atlas' }}"
    name: MD35 one-shot G29 derived companion (artifact-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild exactly the three G29 files against unchanged source
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          BRANCH="research/dg1-md35-strong-control-headroom-20261114"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 6b79f778a01372982d3ca3cf209a7a83508cc993 "$A"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          git diff --exit-code 6b79f778a01372982d3ca3cf209a7a83508cc993 HEAD -- research/contrib/chatgpt/dg1-md35-20261114/prereg.json
          git diff --exit-code cd031504130732617e9ce55ee0da5476f559f59e HEAD -- research/contrib/chatgpt/dg1-md34-20261114
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          EXPECT="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          FOUND="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$FOUND" = "$EXPECT"
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(md35): pin G29 source atlas to $A (three generated files)"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "3"
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "MD35_SOURCE_SHA=$A"
          echo "MD35_G29_ATLAS_COMMIT=$B"
