name: DG1-MD35 source-only custody and inherited qualification
on:
  push:
    branches: [research/dg1-md35-strong-control-headroom-20261114]
    paths:
      - 'research/contrib/chatgpt/dg1-md35-20261114/**'
      - '.github/workflows/dg1-md35-qualification.yml'
      - '.ice/code-atlas.*'
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-md35-20261114/**'
      - '.github/workflows/dg1-md35-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  source:
    name: MD35 no-first-use source gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen prereg and inherited source, no protected first use
        shell: bash
        run: |
          git merge-base --is-ancestor 6b79f778a01372982d3ca3cf209a7a83508cc993 HEAD
          git merge-base --is-ancestor cd031504130732617e9ce55ee0da5476f559f59e HEAD
          git diff --exit-code 6b79f778a01372982d3ca3cf209a7a83508cc993 HEAD -- research/contrib/chatgpt/dg1-md35-20261114/prereg.json
          git diff --exit-code cd031504130732617e9ce55ee0da5476f559f59e HEAD -- research/contrib/chatgpt/dg1-md30-20261114 research/contrib/chatgpt/dg1-md31-20261114 research/contrib/chatgpt/dg1-md32-20261114 research/contrib/chatgpt/dg1-md33-20261114 research/contrib/chatgpt/dg1-md34-20261114
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('research/contrib/chatgpt/dg1-md35-20261114/prereg.json').read_text('utf-8'))
          assert lock['status']=='PREREGISTRATION_ONLY_BEFORE_MD35_MODEL_SOURCE_DATA_OR_SCORES'
          assert lock['parent']['exact_parent_sha']=='cd031504130732617e9ce55ee0da5476f559f59e'
          assert lock['scope']['merge'] is False and lock['scope']['deployment'] is False
          print('MD35_ORIGINAL_PREREG_FROZEN_PASS')
          print('MD35_MD30_MD34_INHERITED_SOURCE_UNMODIFIED_PASS')
          PY
      - name: Install pinned CPU inherited dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "minigrid==3.2.0" "gymnasium==1.4.0" "numpy==2.3.4"
      - name: Full existing Yggdrasil and frozen MD30-MD34 regressions
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          for md in 30 31 32 33 34; do
            python -m unittest discover -s "research/contrib/chatgpt/dg1-md${md}-20261114" -p 'test_*.py' -v
          done
          echo MD35_SOURCE_ONLY_FULL_INHERITED_REGRESSION_PASS
      - name: MD35 allocation and adversarial no-first-use tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-md35-20261114/custody.py research/contrib/chatgpt/dg1-md35-20261114/test_custody.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-md35-20261114 -p 'test_*.py' -v
          python research/contrib/chatgpt/dg1-md35-20261114/custody.py > md35-allocation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('md35-allocation.json').read_text('utf-8'))
          assert r['status']=='ALLOCATION_ONLY_NOT_FIRST_USE'
          assert r['worlds_instantiated']==0 and r['physical_actions']==0
          assert r['training_executed'] is False
          assert r['transfer_opened'] is False and r['cold_opened'] is False
          assert {k: v['episodes'] for k,v in r['splits'].items()}=={
             'train':1536,'validation':384,
             'unfamiliar_transfer':384,'independent_cold':192}
          print('MD35_FROZEN_SPLIT_SOURCE_GATE_PASS')
          print('MD35_NO_TRAINING_NO_HOLDOUT_FIRST_USE')
          PY
      - name: Retain deterministic read-only source receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: md35-allocation-${{ matrix.os }}
          path: md35-allocation.json
          if-no-files-found: error
  parity:
    name: MD35 exact allocation receipt parity, no science
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md35-allocation-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: md35-allocation-windows-2022
          path: windows
      - name: Compare exact cross-platform unopened allocations
        shell: bash
        run: |
          cmp linux/md35-allocation.json windows/md35-allocation.json
          echo MD35_CROSS_OS_UNOPENED_SPLIT_PARITY_PASS
          echo MD35_SCIENCE_NOT_RUN
