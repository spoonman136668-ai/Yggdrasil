name: LR-92AQ one-shot protocol-only negative qualification
'on':
  push:
    branches: [research/lr92aq-variable-switch-prereg-20261119]
    paths:
      - 'research/contrib/spoonman136668-ai/lr92aq-variable-switch/**'
      - '.github/workflows/lr92aq-protocol-one-shot.yml'
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Byte-stable exact-source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify prereg-first immutable original Git blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          file='research/contrib/spoonman136668-ai/lr92aq-variable-switch/prereg.json.txt'
          expected='f7b324b8bbe14dfe418892faa20709f8edf79963'
          test "$(git hash-object "$file")" = "$expected"
          test "$(git rev-parse '8c34698c6e277998d9eb2cba496eff0a89249763':"$file")" = "$expected"
          echo LR92AQ_PREREG_FIRST_SOURCE_IMMUTABLE_PASS
      - name: Run protocol guard + failure injections without generating primary worlds
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lr92aq-protocol"
          mkdir -p "$d"
          root='research/contrib/spoonman136668-ai/lr92aq-variable-switch'
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          cp "$root/protocol_guard.py.txt" "$d/protocol_guard.py"
          cp "$root/test_protocol_guard.py.txt" "$d/test_protocol_guard.py"
          (cd "$d" && python -B -m unittest -v test_protocol_guard)
          (cd "$d" && python -B protocol_guard.py prereg.json.txt)
          echo LR92AQ_PROTOCOL_TESTS_QUALIFIED_PASS
      - name: Require repository unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo LR92AQ_READ_ONLY_NO_WORLD_BIRTH_PASS
