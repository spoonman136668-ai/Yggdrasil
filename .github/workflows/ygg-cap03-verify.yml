name: YGG-CAP04 exact sealed candidate regression (NO source rescoring)
'on':
  push:
    branches:
      - research/ygg-cap04-source-exact-verify-20261119
    paths:
      - '.github/workflows/ygg-cap03-verify.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  full-final-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve exact source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 73c7d3de5d9b54fe34ccfdded44cebeeeef3b108
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned source-native numeric environment
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Verify exact sealed candidate SHA/tree and complete source-bound native regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 73c7d3de5d9b54fe34ccfdded44cebeeeef3b108
          test "$(git rev-parse HEAD^{tree})" = c49dfe95b6b09fcf947ca22b8c15b7a4bf0d8a70
          git diff --exit-code f9c5e6d69827e76df27239c421aed01d4229d51b HEAD -- research/contrib/chatgpt/YGG-CAP03/prereg.json
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-CAP03/source.py)" = d5a3fc30846ebbb97eeb8817fc72d9cd5be8c181
          test "$(git rev-parse HEAD^)" = 6d4ebd8652352ae6c9299b6976f65d597e2cd566
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort | tr '\n' '|')" = ".ice/code-atlas.html|.ice/code-atlas.ice|.ice/code-atlas.json|"
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
          test -f research/contrib/chatgpt/YGG-CAP04/prereg.json
          test -f tests/test_native_predictive_state_split.py
          test ! -f research/contrib/chatgpt/YGG-CAP04/source.py
          test -f research/contrib/chatgpt/YGG-CAP03/original/linux/seed-14071-state.json
          test -f research/contrib/chatgpt/YGG-CAP03/original/windows/seed-14072-trace.json
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-CAP01 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
