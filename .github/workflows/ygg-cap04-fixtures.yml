name: YGG CAP04 history-identifiability fixture qualification
'on':
  push:
    branches:
      - research/ygg-cap04-predictive-state-splitting-20261119
permissions:
  contents: read
jobs:
  atlas:
    if: "github.event.head_commit.message == 'ci(cap04): seal history-source atlas'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
          PYTHONPATH=. PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -p 'test_native_predictive_state_*.py'
          test -z "$(git status --porcelain)"
          git diff --exit-code 1faf84d4a62f16da2ee4ef5f1c7464eb76bab39c HEAD -- research/contrib/chatgpt/YGG-CAP04/prereg.json
      - shell: bash
        id: seal
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/research/ygg-cap04-predictive-state-splitting-20261119 | cut -f 1)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(cap04): atlas for $GITHUB_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          git push origin HEAD:refs/heads/research/ygg-cap04-predictive-state-splitting-20261119
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regression:
    needs: atlas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
          python -B -m unittest discover -s tests -p 'test_*.py'
          for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
            python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
          done
          python -B research/contrib/chatgpt/YGG-CAP04/fixture_audit.py
          python -B research/contrib/chatgpt/YGG-CAP04/rd02_engineering.py
          python -B research/contrib/chatgpt/YGG-CAP04/rd03_diagnostic.py
          python -B research/contrib/chatgpt/YGG-CAP04/rd04_engineering.py
          python -B research/contrib/chatgpt/YGG-CAP04/rd05_source_support.py
          python -B research/contrib/chatgpt/YGG-CAP04/rd06_identifiability.py
          python -B research/contrib/chatgpt/YGG-CAP04/rd07_old_query_context.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
