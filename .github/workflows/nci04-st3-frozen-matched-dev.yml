name: NCI04 ST3 frozen matched in-house causal development
on:
  push:
    branches:
      - research/nci04-st3-intervention-causal-law-20261114
permissions:
  contents: read
  actions: read
jobs:
  train_once:
    if: "github.event.head_commit.message == 'science(st3): run frozen matched DEV comparison'"
    name: ST3 exact one-time in-house training on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exact isolated source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned process-accounting package
        shell: bash
        run: python -m pip install --disable-pip-version-check psutil==6.1.1
      - name: Verify preregistration, no protected first-use and already-qualified source-only headroom
        shell: bash
        run: |
          git merge-base --is-ancestor 63133626dbd914c2d525dbd7358c87fdcfcabdc7 HEAD
          git merge-base --is-ancestor def4e3a9d803c80631c00b7e138a5c54cda349e9 HEAD
          test "$(git rev-parse HEAD:research/nci04_st3/frozen_protocol.json)" = ce51862f6b5af6a130b6ad93c30f019131bfeb16
          python -B - <<'PY'
          from research.nci04_st3.source_audit import verify_prereg
          p=verify_prereg()
          assert p['bounds']['scientific_first_use'] is False
          print('ST3_TRAIN_FROZEN_PROTOCOL=PASS')
          PY
      - name: Train all six models only on original predeclared training-law source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from research.nci04_st3.dev_compare import (
              build_train_once, load_checkpoint
          )
          out=Path(os.environ['RUNNER_TEMP'])/'st3-trained.json'
          receipt=build_train_once(out)
          confirmed,sha=load_checkpoint(out)
          assert confirmed==receipt
          print('ST3_TRAIN_SINGLE_BLOB_SHA256='+sha)
          print('ST3_TRAIN_SOURCE_CUSTODY=PASS')
          PY
      - name: Preserve clean repo and single common checkpoint
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Upload exact source-trained checkpoint for BOTH operating systems
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st3-single-preheld-training-checkpoint
          path: ${{ runner.temp }}/st3-trained.json
          if-no-files-found: error
          retention-days: 7
  held_development:
    if: "github.event.head_commit.message == 'science(st3): run frozen matched DEV comparison'"
    needs: train_once
    name: ST3 matched preaction development only (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Byte stable Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned process accounting
        shell: bash
        run: python -m pip install --disable-pip-version-check psutil==6.1.1
      - name: Download SAME exact once-trained model, no independent retraining
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st3-single-preheld-training-checkpoint
          path: ${{ runner.temp }}
      - name: Source-only gate then frozen real held-development preaction outcomes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from research.nci04_st3.dev_compare import compare,load_checkpoint
          temp=Path(os.environ['RUNNER_TEMP'])
          c,sha=load_checkpoint(temp/'st3-trained.json')
          print('ST3_EXACT_SHARED_TRAIN_BLOB='+sha)
          doc=compare(temp/'st3-trained.json',temp/'st3-held-dev.json')
          assert doc['protected_scientific_first_use'] is False
          assert doc['scientific_pass'] is False
          assert doc['metrics']['preaction_eval_source_steps']==2048
          print('ST3_HELD_DEV_RECORDED=PASS')
          PY
      - name: Read-only clean source / no owner or main edits
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve frozen authentic in-house held-development result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st3-frozen-matched-inhouse-${{ matrix.os }}
          path: ${{ runner.temp }}/st3-held-dev.json
          if-no-files-found: error
          retention-days: 14
  parity:
    if: "github.event.head_commit.message == 'science(st3): run frozen matched DEV comparison'"
    needs: held_development
    name: ST3 original-source and cost-aware scientific parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st3-frozen-matched-inhouse-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st3-frozen-matched-inhouse-windows-2022
          path: windows
      - name: Evaluate exact source and immutable cost divergence separately
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m research.nci04_st3.receipts_parity --linux linux/st3-held-dev.json --windows windows/st3-held-dev.json --output ../st3-parity-final.json
          test -s ../st3-parity-final.json
  readonly_parity:
    if: "github.event.head_commit.message == 'verify(st3): existing inhouse receipts only'"
    name: ST3 read-only parity using PREVIOUS run 43662290316 artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exact source checkout without credentials or model execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen protocol and original research parent unchanged
        shell: bash
        run: |
          git merge-base --is-ancestor 63133626dbd914c2d525dbd7358c87fdcfcabdc7 HEAD
          test "$(git rev-parse HEAD:research/nci04_st3/frozen_protocol.json)" = ce51862f6b5af6a130b6ad93c30f019131bfeb16
      - name: Download existing Linux developmental evidence without rerunning source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st3-frozen-matched-inhouse-ubuntu-latest
          path: ${{ runner.temp }}/st3-linux
          run-id: 43662290316
          github-token: ${{ github.token }}
          repository: spoonman136668-ai/Yggdrasil
      - name: Download existing Windows developmental evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st3-frozen-matched-inhouse-windows-2022
          path: ${{ runner.temp }}/st3-windows
          run-id: 43662290316
          github-token: ${{ github.token }}
          repository: spoonman136668-ai/Yggdrasil
      - name: Run source-free negative parity fixtures then verify BOTH existing receipts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st3_receipts_parity.py' -v
          python -B - <<'PY'
          import os
          from pathlib import Path
          from research.nci04_st3.receipts_parity import main
          temp=Path(os.environ['RUNNER_TEMP'])
          doc=main(
              temp/'st3-linux/st3-held-dev.json',
              temp/'st3-windows/st3-held-dev.json',
              temp/'st3-final-parity.json'
          )
          assert doc['original_event_and_single_training_blob_exact']
          assert doc['external_protected_science_first_use'] is False
          print('ST3_PREVIOUS_FROZEN_RESULT_CLASSIFIED=PASS')
          PY
      - name: Preserve all code and source untouched
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Archive new comparison metadata only, never regenerate source/models
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st3-readonly-parity-of-run-43662290316
          path: ${{ runner.temp }}/st3-final-parity.json
          if-no-files-found: error
          retention-days: 14
# Read existing frozen evidence only; no source, model, checkpoint or held-development rerun.
# Read only existing run 43662290316 scientific development receipts; no replay of source or models.
