name: FKP02 reused exact-source G29 one-shot repair and full qualification
on:
  push:
    branches:
      - ci/fkp01-g29-one-shot-20261115
    paths:
      - .github/workflows/fkp01-g29-once.yml

permissions:
  contents: write

concurrency:
  group: fkp01-g29-one-shot-20261115
  cancel-in-progress: false

jobs:
  atlas-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-02): one-shot atlas-only repair on isolated branch' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      atlas_sha: ${{ steps.commit.outputs.atlas_sha }}
    env:
      SOURCE_SHA: e9c5a3ca9824f2b9e365ec5491bb399c4c70ba02
      SOURCE_TREE: 5c645307ce570891c51f45a5a5d998ab7d34d56b
      TARGET: research/fkp02-unseen-operator-headroom-20261115
    steps:
      - name: Set byte-stable checkout
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e9c5a3ca9824f2b9e365ec5491bb399c4c70ba02
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail closed on source, branch and blob drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-02/source.py)" = b1ece8f6e2b628483dadfda092359b1443058b53
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-02/test_source.py)" = cbe84213c115b8af78057106944fb090ee8937a5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-02/prereg.json)" = 8a651392a18d5485eb2aa08355f840f712db8cef
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-02/README.md)" = beefafb3a49a8795a42e562a1dd677ba7e31f763
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-02/audit_headroom.py)" = 858803ffb0b95bb86875236ba11617b071808363
          echo "FKP02_G29_FROZEN_SOURCE=PASS"
      - name: Run existing G29 builder (generated artifacts ONLY)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE_SHA" --write
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected.txt"
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test -z "$(git diff --name-only)"
          echo "FKP02_G29_GENERATED_THREE_FILES=PASS"
      - name: Commit generated-only to existing research draft
        id: commit
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-02): refresh exact-source G29 generated atlas"
          ATLAS_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "atlas_sha=$ATLAS_SHA" >> "$GITHUB_OUTPUT"
          echo "FKP02_G29_ATLAS_ONLY_COMMIT=$ATLAS_SHA"
          echo "FKP02_G29_ATLAS_ONLY_PUSH=PASS"

  full-qualification:
    needs: atlas-only
    if: needs.atlas-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set byte-stable checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-only.outputs.atlas_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source-indexed G29 and full code atlas tests
        shell: bash
        run: |
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
      - name: FKP-02 source-only public DEV fixtures and protection tests
        shell: bash
        run: |
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-02 -p test_source.py -v
          python -B research/contrib/chatgpt/FKP-02/source.py
          python -B research/contrib/chatgpt/FKP-02/audit_headroom.py > "$RUNNER_TEMP/fkp02-dev-headroom.json"
          python - "$RUNNER_TEMP/fkp02-dev-headroom.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8'))
          assert a['schema']=='fkp02.source-dev-identifiability.v1'
          assert a['protected_primary_opened'] is False
          print('FKP02_DEV_HEADROOM_SUMMARY='+json.dumps({k:a[k] for k in ('strong_reference_16_vector_accuracy','strong_reference_64_vector_accuracy','accuracy_headroom_gap','worlds_with_ambiguous_16_action_laws','stage0_dev_headroom_pass')},sort_keys=True))
          PY
      - name: Complete inherited Yggdrasil regression
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FKP02_FULL_EXACT_SHA_REGRESSION=PASS"
