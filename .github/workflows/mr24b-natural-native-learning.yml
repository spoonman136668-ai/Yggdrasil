name: MR24B Original Native Natural Prequential Learning
on:
  push:
    branches:
      - research/mr24b-natural-prequential-20261021
  pull_request:
    branches:
      - research/mr24-natural-native-history-custody-20261021
permissions:
  contents: read
concurrency:
  group: mr24b-original-natural-prequential-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authentic-original-source-natural-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve exact original Git bytes before Windows source checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact project-native MR24B source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Exact independent original Farama source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 original source native environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reauthenticate independent original source bytes
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install original native runtime dependency versions
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Train on original MR24A exact public source receipts and prospectively score new development
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr24b.probe_native_history ../external/minigrid
      - name: Both exact original project and external source checkouts unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C external/minigrid status --porcelain)"
