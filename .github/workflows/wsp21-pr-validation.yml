      - 'research/contrib/chatgpt/WSP-63/**'
      - 'research/contrib/chatgpt/WSP-64/**'
      - 'research/contrib/chatgpt/WSP-65/**'
      - '.github/workflows/wsp21-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Emit exact G29 snapshot for permanent source pinning
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          from scripts import build_code_atlas as atlas
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          current=atlas.snapshot(Path(".").resolve(),sha)
          previous=json.loads(Path(".ice/code-atlas.json").read_text("utf-8"))
          old_files={x["path"]:x for x in previous["files"]}
          new_files={x["path"]:x for x in current["files"]}
          changed=sorted(p for p,v in new_files.items() if p not in old_files or
                         old_files[p]["sha256"]!=v["sha256"])
          removed=sorted(set(old_files)-set(new_files))
          delta={"old_source":previous["source_commit"],
                 "source":sha,"counts":current["counts"],"changed":changed,
                 "removed":removed,
                 "files":[v for v in current["files"] if v["path"] in changed],
                 "symbols":[v for v in current["symbols"] if v["file"] in changed],
                 "imports":[v for v in current["imports"] if v["file"] in changed]}
          encoded=base64.b64encode(json.dumps(delta,sort_keys=True,
                               separators=(",",":"),ensure_ascii=True).encode("ascii")).decode("ascii")
          print("WSP53_ATLAS_DELTA_SOURCE|"+sha)
          for offset in range(0,len(encoded),4096):
              print("WSP53_ATLAS_DELTA|"+str(offset//4096)+"|"+encoded[offset:offset+4096])
          PY
      - name: WSP65 history-conditioned latent memory SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-65 -p 'test_*.py' -v
      - name: WSP64 variable-state hidden-mode SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-64 -p 'test_*.py' -v
      - name: WSP63 sparse physical-rule extrapolation SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-63 -p 'test_*.py' -v
      - name: WSP62 expandable Boolean representation SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-62 -p 'test_*.py' -v
      - name: WSP61 no-reset causal learning SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-61 -p 'test_*.py' -v
      - name: WSP60 counterexample causal identification SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-60 -p 'test_*.py' -v
      - name: WSP59 cold-start grounded planning SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-59 -p 'test_*.py' -v
      - name: WSP58 early-budget active-probe SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-58 -p 'test_*.py' -v
      - name: WSP57 sparse causal intervention SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-57 -p 'test_*.py' -v
      - name: WSP56 nonlinear out-of-family SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-56 -p 'test_*.py' -v
      - name: WSP55 noncommuting SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-55 -p 'test_*.py' -v
      - name: WSP54 gradientless SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-54 -p 'test_*.py' -v
      - name: WSP53 source-only SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-53 -p 'test_*.py' -v
      - name: WSP52 source-only SELFTEST (no DEV or PRIMARY exposure)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-52 -p 'test_*.py' -v
      - name: Full WSP01-46 regression plus WSP47 integrated DEV
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/contrib/chatgpt/WSP-47/qualify.py
      - name: Frozen WSP47 public PRIMARY (numerical trajectory equations)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/contrib/chatgpt/WSP-47/battery.py --cohort PRIMARY
