name: WSP capacity certificate regression (reused WSP21-32)
on:
  pull_request:
    branches:
      - research/wsp20-protected-joint-structural-credit-20261110
      - research/wsp21-six-site-capacity-certificates-20261110
      - research/wsp22-six-site-dag-capacity-20261111
      - research/wsp23-checked-capacity-ceiling-20261111
      - research/wsp24-active-causal-knowledge-20261111
      - research/wsp25-local-causal-rule-repair-20261111
      - research/wsp26-protected-two-row-credit-20261111
      - research/wsp27-error-directed-structural-credit-20261111
      - research/wsp28-disjoint-credit-replication-20261111
      - research/wsp29-acquired-module-composition-20261111
      - research/wsp30-composition-limit-diagnostic-20261111
      - research/wsp31-one-query-fact-acquisition-20261111
    paths:
      - 'research/contrib/chatgpt/WSP-21/**'
      - 'research/contrib/chatgpt/WSP-22/**'
      - 'research/contrib/chatgpt/WSP-23/**'
      - 'research/contrib/chatgpt/WSP-24/**'
      - 'research/contrib/chatgpt/WSP-25/**'
      - 'research/contrib/chatgpt/WSP-26/**'
      - 'research/contrib/chatgpt/WSP-27/**'
      - 'research/contrib/chatgpt/WSP-28/**'
      - 'research/contrib/chatgpt/WSP-29/**'
      - 'research/contrib/chatgpt/WSP-30/**'
      - 'research/contrib/chatgpt/WSP-31/**'
      - 'research/contrib/chatgpt/WSP-32/**'
      - '.github/workflows/wsp21-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Emit exact G29 snapshot for permanent source pinning
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          import base64,subprocess
          from pathlib import Path
          from scripts import build_code_atlas as atlas
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          artifacts=atlas.render(atlas.snapshot(Path(".").resolve(),sha))
          print("WSP21_ATLAS_SOURCE|"+sha)
          for path,content in artifacts.items():
              encoded=base64.b64encode(content.encode("utf-8")).decode("ascii")
              for offset in range(0,len(encoded),4096):
                  print("WSP21_ATLAS|"+path+"|"+str(offset//4096)+"|"+encoded[offset:offset+4096])
          PY
      - name: Full original WSP01-17 WSP19-32 regression and cumulative fact acquisition
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/contrib/chatgpt/WSP-32/qualify.py
