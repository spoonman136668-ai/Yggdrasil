name: MR32-P Frozen Synthetic Development
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed 40-hex MR32-P branch source SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mr32-p-development-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Exact-source full regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Admit exact requested source
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF_NAME" = "research/mr32-counterfactual-episodic-credit-20261102"
          test "$REQUESTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact checkout
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Focused tests
        shell: bash
        run: |
          cd research/native/itd02/mr32
          python -B -m unittest -v test_counterfactual_shapley test_mr32p_process_boundary test_mr32p_trial_adapter
      - name: Install test runner
        shell: bash
        run: python -m pip install --disable-pip-version-check pytest
      - name: Mandatory full regression
        shell: bash
        run: python -m pytest -q
      - name: Verify clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  develop:
    name: Frozen FIT and TRANSFER (${{ matrix.os }})
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable source before frozen first use
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          test "$GITHUB_SHA" = "$REQUESTED_SHA"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Execute frozen six-method experiment once
        shell: bash
        run: |
          cd research/native/itd02/mr32
          python -B mr32p_trial.py > "$GITHUB_WORKSPACE/mr32p-result.json"
      - name: Validate immutable trial counts and invariants
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path("mr32p-result.json").read_text())
          assert r["schema"] == "yggdrasil.mr32p.counterfactual-trial.v1"
          assert r["source_commit"] == "${{ inputs.source_sha }}"
          p, f, t = r["protocol"], r["fit"], r["transfer"]
          assert p["fit_episode_count"] == 128
          assert p["transfer_episode_count"] == 256
          assert p["coalitions_per_policy_episode"] == 128
          assert p["total_coalition_replays"] == (128 + 256) * 6 * 128
          assert f["episode_receipt_count"] == 128 * 6
          assert t["episode_receipt_count"] == 256 * 6
          assert len(t["cluster_receipts"]) == 32
          assert set(p["fit_seeds"]).isdisjoint(p["transfer_seeds"])
          assert all(x == 0 for x in t["learner_update_calls"].values())
          assert all(x == 0 for x in t["feedback_events_applied"].values())
          assert all(x == 32 for x in t["cold_restore_cluster_count_by_method"].values())
          assert all(len(row["coalition_values"]) == 128 for row in
                     f["episode_receipts"] + t["episode_receipts"])
          assert all(row["coalition_values"][0] == row["no_memory_return"] and
                     row["coalition_values"][127] == row["terminal_return"] for row in
                     f["episode_receipts"] + t["episode_receipts"])
          PY
          sha256sum mr32p-result.json > mr32p-result.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mr32p-${{ matrix.os }}-${{ inputs.source_sha }}
          path: |
            mr32p-result.json
            mr32p-result.sha256
          if-no-files-found: error
          retention-days: 90

  reconcile:
    name: Cross-platform deterministic receipt parity
    needs: develop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a4
        with:
          pattern: mr32p-*-${{ inputs.source_sha }}
          path: receipts
      - name: Verify deterministic cross-OS equality
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, pathlib
          paths = sorted(glob.glob("receipts/*/mr32p-result.json"))
          assert len(paths) == 2, paths
          a,b = [json.loads(pathlib.Path(p).read_text()) for p in paths]
          # Timings, peak RSS and process platform details are reported, not
          # required to match byte-for-byte between Windows and Ubuntu.
          for r in (a,b):
              assert r["source_commit"] == "${{ inputs.source_sha }}"
          a.pop("resources")
          b.pop("resources")
          # Resource ceilings are platform-dependent and must pass independently
          # before a positive development claim; deterministic outcomes remain strict.
          cpu_gate = "shapley_policy_plus_credit_cpu_within_1_25x_loo"
          a["falsifiers"].pop(cpu_gate)
          b["falsifiers"].pop(cpu_gate)
          a.pop("development_signal")
          b.pop("development_signal")
          assert a == b, "MR32P_CROSS_OS_DETERMINISTIC_RECEIPT_MISMATCH"
          PY
