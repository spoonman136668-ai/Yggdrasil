name: Yggdrasil F65 frozen model causal prevalidation
on:
  push:
    branches:
      - research/y-f65-frozen-model-prevalidation-20261016-r1
permissions:
  contents: read
jobs:
  independently-frozen-replay:
    if: "${{ github.event.head_commit.message == 'ci(y-f65): qualify frozen learned role-paths and ablation before heldout' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify qualified ancestor and immutability of learned model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e754fa58c42dbdee6dd0cb4374c82904633e1de0 HEAD
          test "$(git hash-object research/foundational/20261016-y-f65/prereg.json)" = 9bbfd50b740be2c9d4ec891b3b360cd9650b7e23
          test "$(git hash-object research/foundational/20261016-y-f65/path_assembly.py)" = 10c2ba041c1d3e3063e1e98ba5726fa458db5f3a
          test "$(git hash-object research/foundational/20261016-y-f65/frozen_model_receipt.json)" = 53ab10e95fae49228ef77befbc303ee5681cf878
          test "$(git hash-object research/foundational/20261016-y-f65/prevalidate_frozen.py)" = 13c6d81c39426fc4d57714cb8e2f0095c8e60c83
      - name: Independently check all synthetic public prefixes and ablation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f65-frozen-prevalidation/"
          python3 -B research/foundational/20261016-y-f65/prevalidate_frozen.py > "$RUNNER_TEMP/y-f65-frozen-prevalidation/synthetic_replay.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f65-frozen-prevalidation/synthetic_replay.json" >/dev/null
          python3 -B -c 'import os,json;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f65-frozen-prevalidation/synthetic_replay.json")));print("F65_FROZEN_SCORES",d["scores"]);print("F65_MERGE_ACTIONS",d["merges_selected"]);print("F65_PREVALIDATION",d["model_prevalidation_positive"]);assert d["fit_validation_used"] is False and d["independent_prefix_causal_audit"]'
          sha256sum "$RUNNER_TEMP/y-f65-frozen-prevalidation/synthetic_replay.json" > "$RUNNER_TEMP/y-f65-frozen-prevalidation/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f65-frozen-prevalidation/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f65-frozen-independent-synthetic-replay
          path: ${{ runner.temp }}/y-f65-frozen-prevalidation/
          retention-days: 90
          if-no-files-found: warn
