name: ITD-01 EXT01 original Alchemy source-native interface qualification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: itd01-ext01-source-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  pinned-alchemy-source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/dm_alchemy
          ref: 68a26254b5c0f15e84fa0c15d66bf0c626ede8e0
          path: upstream
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert prereg first and exact seven-file integrated EXT01 + Atlas scope
        shell: bash
        run: |
          set -euo pipefail
          parent=9b069040feeddd9f509ab2c8ac9656d0a2c07d77
          pre=9f5350e44b41b4a1da0a0bfea2691b5f71ca8b51
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git rev-parse "$pre^")" = "$parent"
          test "$(git show --format= --name-only "$pre")" = "research/native/itd01/ext01/PREREG.md"
          git merge-base --is-ancestor bb92770132718b9a5de771729e4fcef790356f94 HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; actual=set(sys.stdin.read().splitlines()); expected={"research/native/itd01/ext01/PREREG.md","research/native/itd01/ext01/check_symbolic_contract.py","research/native/itd01/ext01/test_symbolic_contract.py",".github/workflows/itd01-ext01-source-contract.yml","scripts/free_fanout_sidecar.py","tests/test_free_fanout_sidecar.py",".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"}; assert actual==expected,(actual,expected)'
          test "$(git rev-parse "$pre:research/native/itd01/ext01/PREREG.md")" = "$(git rev-parse HEAD:research/native/itd01/ext01/PREREG.md)"
          test "$(git -C upstream rev-parse HEAD)" = 68a26254b5c0f15e84fa0c15d66bf0c626ede8e0
          echo EXT01_FIRST_PROTOCOL_AND_BOTH_SOURCE_PINS=PASS
      - name: Original upstream contract, G29 source pin and one full repository regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd01/ext01 -p test_symbolic_contract.py -v
          python -B research/native/itd01/ext01/check_symbolic_contract.py --upstream upstream --audit > ext01_contract_receipt.json
          python -B -c 'import json; x=json.load(open("ext01_contract_receipt.json")); assert x["exact_upstream_commit"]=="68a26254b5c0f15e84fa0c15d66bf0c626ede8e0" and x["contract"]["integer_action_count_default_no_end_trial"]==40 and x["graph_family_static_contract"]["distinct_declared_constraint_counts"]==[0,1,2,3] and not x["graph_family_static_contract"]["nonisomorphic_graph_families_proven"] and x["generated_episodes"]==0 and not x["external_scientific_first_use"] and not x["benchmark_installed_or_imported"] and x["ckb_controller_admission"]=="NOT_OBSERVED"; print("EXT01_NATIVE_ALCHEMY_SOURCE_CONTRACT=PASS")'
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git status --porcelain --untracked-files=all | python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); assert a=={"?? ext01_contract_receipt.json","?? upstream/"},a'
          sha256sum ext01_contract_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ext01-native-alchemy-source-contract-${{ matrix.os }}
          path: ext01_contract_receipt.json
          if-no-files-found: ignore
