name: MR34J3T generate exact-head G29 atlas artifacts (no admission)
on:
  push:
    branches:
      - proposal/mr34j3p-source-intake-20261024
    paths:
      - .github/workflows/mr34j3t-fast-atlas-bundle.yml
permissions:
  contents: read
jobs:
  source-locators-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without persistent credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate original atlas algorithm with batched verified Git blob reads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,re,subprocess,sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          import build_code_atlas as atlas
          source=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[a-f0-9]{40}',source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert os.environ['GITHUB_REF_NAME']=='proposal/mr34j3p-source-intake-20261024'
          assert os.environ['GITHUB_REPOSITORY']=='spoonman136668-ai/Yggdrasil'
          root=pathlib.Path('.').resolve()
          listing=subprocess.check_output(['git','ls-tree','-rz','--full-tree',source])
          paths_to_sha={}
          for item in listing.split(b'\0'):
              if not item: continue
              metadata,path=item.split(b'\t',1)
              mode,kind,sha=metadata.split(b' ')
              if kind==b'blob': paths_to_sha[path.decode('utf-8')]=sha.decode('ascii')
          paths=atlas.files_at(root,source)
          assert len(paths)>=200 and len(paths)==len(set(paths))
          request_shas=[paths_to_sha[path] for path in paths]
          p=subprocess.Popen(['git','cat-file','--batch'],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          raw,err=p.communicate((''.join(x+'\n' for x in request_shas)).encode('ascii'))
          assert p.returncode==0,err[-200:]
          cache={}
          pos=0
          for path,sha in zip(paths,request_shas):
              e=raw.index(b'\n',pos)
              header=raw[pos:e].split(b' ')
              assert header[0]==sha.encode() and header[1]==b'blob'
              size=int(header[2])
              data=raw[e+1:e+1+size]
              assert raw[e+1+size:e+2+size]==b'\n'
              pos=e+size+2
              assert hashlib.sha1(b'blob '+str(size).encode()+b'\0'+data).hexdigest()==sha
              cache[path]=data
          assert pos==len(raw), 'UNCONSUMED_BATCH_OBJECT_BYTES'
          native=atlas.git
          def cached_git(home,*args):
              if len(args)==2 and args[0]=='show' and args[1].startswith(source+':'):
                  path=args[1][41:]
                  if path in cache:return cache[path]
              return native(home,*args)
          atlas.git=cached_git
          result=atlas.snapshot(root,source)
          assert result['source_commit']==source
          assert result['counts']['files']==len(paths)
          art=atlas.render(result)
          assert set(art)==set(atlas.OUT)
          for name,body in art.items():assert len(body)>100
          print('MR34J3T_CANONICAL_BUILDER_BLOB_VALIDATION=PASS',len(paths),result['counts']['symbols'])
          raw=json.dumps(art,sort_keys=True,ensure_ascii=True).encode('ascii')
          compressed=gzip.compress(raw,compresslevel=9,mtime=0)
          encoded=base64.b64encode(compressed).decode('ascii')
          print('MR34J3T_GZIP_BYTES='+str(len(compressed)))
          for idx in range(0,len(encoded),3000):
              print('MR34J3T_EXACT_G29_GZ64_%05d:'%(idx//3000)+encoded[idx:idx+3000])
          print('MR34J3T_ARTIFACT_GENERATED_NOT_ADMITTED='+source)
          PY
          git diff --exit-code
