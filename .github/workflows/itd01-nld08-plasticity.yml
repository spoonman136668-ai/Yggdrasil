name: ITD01 NLD08 source-free selective plasticity versus rollback
on:
  pull_request:
    branches: [research/itd01-nld07-retroactive-plasticity-20261023]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Frozen source ancestry, prereg first and exact four additive paths
        shell: bash
        run: |
          set -euo pipefail
          base=0afbccffba01606766b0ed28fbb6f2dcd6707da6
          prereg=6c54b17669c7a1a4b4a13355be0c95231249d28d
          test "$(git rev-parse "$prereg^")" = "$base"
          test "$(git show --format= --name-only "$prereg")" = "research/native/itd01/nld08/PREREG.md"
          test "$(git rev-parse "$prereg:research/native/itd01/nld08/PREREG.md")" = "$(git rev-parse HEAD:research/native/itd01/nld08/PREREG.md)"
          git diff --name-only "$base" HEAD | python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); b={"research/native/itd01/nld08/PREREG.md","research/native/itd01/nld08/selective_plasticity.py","research/native/itd01/nld08/test_selective_plasticity.py",".github/workflows/itd01-nld08-plasticity.yml"}; assert a==b,(a,b)'
          test "$(git rev-parse HEAD:research/native/itd01/nld07/rollback.py)" = 751d10f23e435851459af7b0182c04ad6ca3d9a5
          test "$(git rev-parse HEAD:research/native/itd01/nld06/continuous_surprise.py)" = 7f1b99f7c6937d2c847bb287e1cef23d16792cf9
          test "$(git rev-parse HEAD:research/native/itd01/r9/action_cells.py)" = 882bfca8172e7e2d25fc617cd34dbc811383cede
          echo NLD08_FROZEN_SOURCE_AND_ORIGINAL_NEGATIVES=PASS
      - name: Bounded old public source only, same-feedback trained baselines
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd01/nld08 -p test_selective_plasticity.py -v
          python -B research/native/itd01/nld08/selective_plasticity.py --smoke > nld08_sourcefree.json
          python -B -c 'import json; x=json.load(open("nld08_sourcefree.json")); assert x["previously_exposed_public_dev_seed"]==3 and not x["protected_first_use"] and x["source_actions_received"]==256 and not x["source_reset_visible_to_learners"] and x["original_detector_alarm_threshold"]==6 and x["selective_gate_frozen_prior_error_threshold"]==3; print("NLD08_ACTUAL_RETAINED_A=",x["a_retained_after_b"]["routed_correct_of_56"])'
          git status --porcelain --untracked-files=all | python -B -c 'import sys; assert sys.stdin.read().splitlines()==["?? nld08_sourcefree.json"]'
          sha256sum nld08_sourcefree.json
      - uses: actions/upload-artifact@v4
        with:
          name: nld08-sourcefree-${{ matrix.os }}
          path: nld08_sourcefree.json
          if-no-files-found: error
  compare:
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nld08-sourcefree-*
          path: original-artifacts
          merge-multiple: false
      - name: Compare original entire numeric science reports cross-OS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib
          def record(os):
              p=pathlib.Path("original-artifacts")/("nld08-sourcefree-"+os)/"nld08_sourcefree.json"
              raw=p.read_bytes()
              return json.loads(raw),hashlib.sha256(raw).hexdigest()
          linux,lh=record("ubuntu-24.04")
          windows,wh=record("windows-2022")
          assert linux==windows,"NLD08_ORIGINAL_CROSS_OS_REPORT_DRIFT"
          assert not linux["protected_first_use"]
          assert linux["native_gate_extra_parameter_snapshot_buffer_bytes"]==0
          assert linux["original_nld07_rollback_peak_extra_native_snapshot_bytes_reference"]==18702
          print("NLD08_CROSS_OS_SEMANTIC_REPRODUCIBILITY=PASS")
          print("NLD08_UBUNTU_JSON_SHA256="+lh)
          print("NLD08_WINDOWS_JSON_SHA256="+wh)
          print("NLD08_RESULT="+str(linux["a_retained_after_b"]["routed_correct_of_56"]))
          print("NLD08_SCIENTIFIC_ORIGINAL_FIRST_USE=NONE")
          PY
