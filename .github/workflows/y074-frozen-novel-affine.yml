name: Yggdrasil Y074 frozen novel affine transfer
on:
  push:
    branches: [research/y074-novel-affine-transfer-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact parent and frozen science sources
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 073f44b4a8f2ae61fd73c8f13f04ea280fde6121 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-y073-novel-topology/execute.py)" = 99c25979ab2b741271570dda210821b93bf03a79
          test "$(git hash-object research/contrib/chatgpt/20261014-y074-novel-affine-transfer/prereg.json)" = 9c81535e64dc1f3e1620a0382f3356ec91cc6160
          test "$(git hash-object research/contrib/chatgpt/20261014-y074-novel-affine-transfer/execute.py)" = 9c653efea5783ac8f312d450176e9e50e6e6f525
          python3 -m json.tool research/contrib/chatgpt/20261014-y074-novel-affine-transfer/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261014-y074-novel-affine-transfer/execute.py
      - name: Original first-use fresh-affine heldout
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-y074-novel-affine-transfer/execute.py > /tmp/Y074-original.json
          python3 -m json.tool /tmp/Y074-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/Y074-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(9248,9264))
          assert a["pairs"]==[[4,11],[5,12]]
          assert len(a["original_y070_unchanged_trial_evidence"]["complete_heldout_records"])==768
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          assert a["classification"] in ("BOTH_PAIRS_NEW_FAMILY_RECOVERY","PAIR411_RECOVERY_PAIR512_NO_OPPORTUNITY","PAIR411_ONLY_NEW_FAMILY_RECOVERY","PAIR512_ONLY_NEW_FAMILY_RECOVERY","BOTH_NO_POSTDETECTION_OPPORTUNITY","NO_DEMONSTRATED_NEW_FAMILY_RECOVERY")
          print("CLASSIFICATION",a["classification"])
          print("PAIR_COMPARISONS",a["comparisons"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y074-original-new-affine-transfer
          path: /tmp/Y074-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
