name: Yggdrasil Y056 frozen skewed shock-mixture regret
on:
  push:
    branches: [research/y056-onset-mixture-regret-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact predecessor, preregistration and executor gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e1f3a596a1ffc7b2f8f929475e4f81b1f7d6b31e HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y055-allocation-keys/execute.py)" = effdf1ce55436a22e1f45fb0516735cf25c3e679
          test "$(git hash-object research/contrib/chatgpt/20261013-y056-mixture-regret/prereg.json)" = 4fa51652cc2a683e530b4a531b11b5ce68e90b5b
          test "$(git hash-object research/contrib/chatgpt/20261013-y056-mixture-regret/execute.py)" = 3687cc8b31912effee46ac234c7f8841b87b8bd1
          python3 -m json.tool research/contrib/chatgpt/20261013-y056-mixture-regret/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y056-mixture-regret/execute.py
      - name: One original first-use shock-mixture regret experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y056-mixture-regret/execute.py >/tmp/Y056-original.json
          python3 -m json.tool /tmp/Y056-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y056-original.json'))
          assert x['development_seeds']==list(range(2256,2264))
          assert x['sealed_heldout_seeds']==list(range(2264,2280))
          assert len(x['heldout_records'])==5*4*16*3
          assert len(x['distribution_weights'])==4
          print('CLASSIFICATION',x['classification'])
          print('WORST_MIXTURE_REGRET',x['worst_mixture_regret_by_arm'])
          print('HEDGE_REGRET_RATIO',x['hedge_worst_regret_ratio'])
          print('UNIFORM_LOSS_RATIO',x['hedge_uniform_loss_ratio'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y056-original-shock-mixture-regret
          path: /tmp/Y056-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full required Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
