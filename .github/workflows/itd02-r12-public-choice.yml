name: ITD-02 R12 Public-Outcome Action Choice (source-only)
on:
  push:
    branches: [research/itd02-r12-public-outcome-choice-20261025]
permissions:
  contents: read
jobs:
  r12-source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate FIRST prereg and immutable original source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2087de340a428c072535fb1817024c94930c13d3 HEAD
          test "$(git rev-parse HEAD:research/native/itd02/r12/PREREG.json)" = "97eaf083d3402067d47ae47abbab91d6a9bf031d"
          test "$(git rev-parse HEAD:research/native/itd02/r12/outcome_choice.py)" = "2d19b28d6d4db1988ae908fe91be1a27ce4c1907"
          test "$(git rev-parse HEAD:research/native/itd02/r12/test_outcome_choice.py)" = "e04ed32722b8ddbebaf524f26d191ecb01bfe2d9"
          test "$(git rev-parse HEAD:research/native/itd02/r11/affordance_cells.py)" = "614c7dfb1b43f485009b70cb85e9b7b5119cafc2"
          test "$(git rev-parse HEAD:research/native/itd02/r10/public_adapter.py)" = "3917d36ce9f86a2c1b998a0a2f93fb27674a9205"
          test "$(git rev-parse HEAD:research/native/itd02/r9/evidence_cells.py)" = "66ec3befe92e2d2c2b7116217354a40f59e659d7"
          test "$(git rev-parse HEAD:research/native/itd02/r8/revision.py)" = "346fb9eb7462208a6cbd28cfb51716c22e5ec857"
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = "204ecd993b954b23e66d6d1e8b3568e7c93183c5"
          echo "R12_SOURCEFIRST_VERIFIED=PASS"
      - name: Execute all R12 original-native focused source-only decisions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r12 -p 'test_outcome_choice.py' -v
          test -z "$(git status --porcelain)"
          echo "R12_NATIVE_CHOICE_AND_CONVENTIONAL_PARITY=PASS"
          echo "R12_INDEPENDENT_ORIGINAL_WORLD_FIRST_USE=0"
          echo "R12_GENUINE_GOAL_DIRECTED_NAVIGATION=NOT_TESTED"
  once-atlas:
    if: github.event.head_commit.message == 'Arm R12 frozen-source G29 atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reanchor only generated three-path G29 source atlas
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 2087de340a428c072535fb1817024c94930c13d3 "$A"
          test "$(git rev-parse HEAD:research/native/itd02/r12/outcome_choice.py)" = "2d19b28d6d4db1988ae908fe91be1a27ce4c1907"
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-anchor G29 to frozen R12 source $A"
          B="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$A" "$B"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "3"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin "HEAD:refs/heads/research/itd02-r12-public-outcome-choice-20261025"
          echo "R12_SOURCE_A=$A"
          echo "R12_ATLAS_ARTIFACT_ONLY_B=$B"
