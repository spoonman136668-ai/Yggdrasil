name: FKP12 consumed-source replay and final full Windows/Linux qualification
on:
  push:
    branches: [ci/fkp12-consumed-replay-final-20261115]
    paths: [.github/workflows/fkp12-posthoc-once.yml]
permissions:
  contents: write
concurrency:
  group: fkp12-final-replay-once-20261115
  cancel-in-progress: false

jobs:
  atlas-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-12): source-custody post-consumption regression, no new science' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
    env:
      FROZEN: a33bac5cc848818437a1d32032d7ef88def88931
      FROZEN_TREE: 3be6643f91b79b1f819529789b98be42f09604ef
      TARGET: research/fkp12-mysterypath-direct-causal-memory-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Explicit byte-stable Git checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a33bac5cc848818437a1d32032d7ef88def88931
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original code and prereg frozen, negative preserved, no drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN"
          test "$(git rev-parse HEAD^{tree})" = "$FROZEN_TREE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$FROZEN"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor eb2ab3758c090f653c0245f6d546c842fc670669 "$FROZEN"
          git merge-base --is-ancestor 9273ece0571d8a6e91837ee77504c46f6534f1ae "$FROZEN"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/prereg.json)" = fca546f8b7a98f676f529df46563cb02dd4a8f53
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/source.py)" = d6b7d526d2562379b1a5f2d59928df9743387596
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/model.py)" = b8b99ac62a6c938f8b796a000b987c16b5b50ec5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/baselines.py)" = 584becf44a1f18fc19c4cf122afb647c39d25e0f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/run_dev.py)" = f08ca09c91e3082ea4b0a49db56114bb05a8d43f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/test_fkp12.py)" = bb25c1641df69c26ec2eb3cb2b55845b5b5808fa
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/result.json)" = 7683d7bb57c47cfa81ce69c6668211068f59b9d9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-12/provenance.json)" = fa602b00cd7193d8ccd7e0530ebbadfb508eb099
          python - <<'PY'
          import json
          x=json.load(open("research/contrib/chatgpt/FKP-12/result.json"))
          assert x["original_dev_execution"]["classification"]=="DEV_NO_GO_STRONG_CONVENTIONAL_NOT_BEATEN"
          assert not x["original_dev_execution"]["scientific_pass"]
          assert x["original_dev_execution"]["post_run_full_regression"]=="FAIL_G29_SHALLOW_GIT_HISTORY_MISSING_COMMIT"
          print("FKP12_FROZEN_NEGATIVE_AND_CUSTODY=PASS")
          PY
      - name: Generate only three source-index G29 files for post-result archive
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$FROZEN" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
      - name: Seal atlas-only evidence archive child on same PR
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-12): index original public negative and provenance"
          NEW="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$FROZEN"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "candidate=$NEW" >> "$GITHUB_OUTPUT"
          echo "FKP12_QUALIFIED_FINAL_ARCHIVE_SOURCE_SHA=$NEW"

  post-consumed-cross-platform:
    needs: atlas-only
    if: needs.atlas-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent CRLF source corruption
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-only.outputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned source and PyTorch strong-control fixture preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "gymnasium==0.29.0" "pygame==2.4.0" "numpy==1.26.4"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          git clone -q https://github.com/MarcoMeter/endless-memory-gym.git "$RUNNER_TEMP/fkp12-original-upstream"
          git -C "$RUNNER_TEMP/fkp12-original-upstream" checkout -q a94f2b60d1769ea44df3226561488768e1dff9f4
          test "$(git -C "$RUNNER_TEMP/fkp12-original-upstream" rev-parse HEAD)" = a94f2b60d1769ea44df3226561488768e1dff9f4
          test -z "$(git -C "$RUNNER_TEMP/fkp12-original-upstream" status --porcelain --untracked-files=all)"
      - name: Mandatory exact-tree atlas, focused and complete regression with FULL Git ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -t 9273ece0571d8a6e91837ee77504c46f6534f1ae
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-12 -p test_fkp12.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FKP12_POST_CONSUMPTION_EXACT_SOURCE_FULL_REGRESSION=PASS"
      - name: Replay only already-consumed public source and direct memory, NEVER new learner science
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-12/run_dev.py --replay-consumed-public-source --upstream-root "$RUNNER_TEMP/fkp12-original-upstream" > "$RUNNER_TEMP/fkp12-consumed-replay.json"
          python - "$RUNNER_TEMP/fkp12-consumed-replay.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["schema"]=="fkp12.public-source-replay.v1"
          assert x["classification"]=="CONSUMED_PUBLIC_DEV_REPLAY_ONLY"
          assert x["train_counts"]=={"negative":726,"zero":7385,"positive":81,"steps":8192,"episodes":32},x["train_counts"]
          assert x["validation_counts"]=={"negative":162,"zero":1866,"positive":20,"steps":2048,"episodes":8},x["validation_counts"]
          assert x["development_counts"]=={"negative":361,"zero":3697,"positive":38,"steps":4096,"episodes":16},x["development_counts"]
          assert not x["protected_first_use"] and not x["transfer_first_use"] and not x["scientific_pass"]
          print("FKP12_CONSUMED_SOURCE_ONLY_REPLAY="+json.dumps({
              "classification":x["classification"],
              "receipts":x["split_receipts"],
              "direct_numeric_snapshot":x["direct_programmed_snapshot_sha256"],
              "train_counts":x["train_counts"],
              "dev_counts":x["development_counts"],
              "transfer_used":x["transfer_first_use"],
              "protected_used":x["protected_first_use"]
          },sort_keys=True))
          PY
          test -z "$(git -C "$RUNNER_TEMP/fkp12-original-upstream" status --porcelain --untracked-files=all)"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP12_FULL_SOURCE_REPLAY_COMPLETE_NO_NEW_SCIENCE=PASS
