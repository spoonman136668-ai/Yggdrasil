name: AAI-09P source-pinned G29 atlas generated companion only
on:
  push:
    branches: [research/aai09p-identifiable-return-bridge-20261114]
    paths: [.github/workflows/aai09p-atlas.yml]
permissions:
  contents: write
jobs:
  generated-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-09P source-pinned atlas and full G29 qualification' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce original source and generated-only output
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '477daa2e00a35aa6765d08db94083fbd15223704'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai09p-atlas.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-09P/prereg.json)" = "$(git rev-parse f19dd32f20bf05ae5e72fc913303843050a9217d:research/contrib/chatgpt/AAI-09P/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-09P/headroom.py)" = "$(git rev-parse b67969487c9de7f1ebd6b188cebf5b274e0b2fc4:research/contrib/chatgpt/AAI-09P/headroom.py)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-09P/official_probe.py)" = "$(git rev-parse b67969487c9de7f1ebd6b188cebf5b274e0b2fc4:research/contrib/chatgpt/AAI-09P/official_probe.py)"
          test -z "$(git status --porcelain)"
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-09P -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-09P generated source-pinned atlas companion only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch origin research/aai09p-identifiable-return-bridge-20261114
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai09p-identifiable-return-bridge-20261114
          echo AAI09P_G29_ATLAS_GENERATED_ONLY_PASS
