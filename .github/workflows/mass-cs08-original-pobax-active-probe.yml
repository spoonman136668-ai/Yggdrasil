name: Mass CS08 original POBAX adaptive source-native probing
on:
  push:
    branches:
      - research/mass-cs08-pobax-adaptive-probing-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs08-pobax-adaptive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-active-information:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout frozen-first original-source prospective protocol
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Verify FIRST prereg ancestry and purely additive changes
        shell: bash
        run: |
          set -euo pipefail
          first=1a8593e10ed41b8dff6df1ea0eb2d81f789b0913
          parent=82e43e3624e8c2ed41afe7f886d1f84460190c23
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS08_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS08_PREREG.md","research/native/itd01/mass_r10/run_cs08_original_active_rock_probe.py","research/native/itd01/mass_r10/test_cs08_original_active_rock_probe.py",".github/workflows/mass-cs08-original-pobax-active-probe.yml"};assert got==want,(got,want)'
      - name: Checkout exact unchanged independently authored POBAX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taodav/pobax
          ref: a5e1d62d14e4efe783885b9d4f19cffa2a568eec
          path: external/pobax-original
          persist-credentials: false
      - name: Setup Python 3.11 original source contract
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded source-required CPU JAX packages, no paid API
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs08-evidence
          set +e
          timeout 480s python -m pip install --no-cache-dir --timeout 35 --retries 1 'jax==0.6.2' 'jaxlib==0.6.2' chex gymnax flax brax >cs08-evidence/pip-install.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 60s python -m pip install --no-deps -e external/pobax-original >>cs08-evidence/pip-install.log 2>&1
            rc=$?
          fi
          set -e
          printf '%s\n' "$rc" >cs08-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Original-source-free Bayesian/protocol focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs08_original_active_rock_probe.py 2>&1 | tee cs08-evidence/focused-tests.log
      - name: Execute frozen real source-native 160 checks per original public arm
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs08_original_active_rock_probe.py \
            --upstream external/pobax-original --out cs08-evidence/
      - name: Preserve original observed gains and negative/blocked receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs08-original-source-adaptive-probing
          path: cs08-evidence/
          retention-days: 30
