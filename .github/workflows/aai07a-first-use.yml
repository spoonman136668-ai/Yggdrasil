name: AAI-07A pinned upstream MiniGrid memory primary (one-shot)
on:
  push:
    branches: [research/aai07-independent-minigrid-memory-20261114]
    paths: [.github/workflows/aai07a-first-use.yml]
permissions:
  contents: read
jobs:
  frozen-primary:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-07A frozen external memory scientific one-shot' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify prereg and evaluator source custody before any primary evaluation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'b8dd3ad5c95c5804725b72dd3edc6241e9819f5e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai07a-first-use.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07/prereg.json)" = "$(git rev-parse e27dc3eb66171a96f55fa4cb0acc2cfff2695ea1:research/contrib/chatgpt/AAI-07/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07/evaluate.py)" = "$(git rev-parse b8dd3ad5c95c5804725b72dd3edc6241e9819f5e:research/contrib/chatgpt/AAI-07/evaluate.py)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07/navigator_probe.py)" = "$(git rev-parse edcac052aa4e587a5faf9cdf49293e86d4f23b18:research/contrib/chatgpt/AAI-07/navigator_probe.py)"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import ast,pathlib
          root=pathlib.Path('research/contrib/chatgpt/AAI-07')
          for name in ('evaluate.py','navigator_probe.py'):
              ast.parse((root/name).read_bytes(), filename=name)
          PY
          echo AAI07A_FROZEN_FIRST_USE_SOURCE=PASS
      - name: Pin external source and install independently bounded packages
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/upstream" fetch -q --no-tags --depth 1 origin 64e1eaec904bc35e7de041167274e2c0dfe541d2
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = '64e1eaec904bc35e7de041167274e2c0dfe541d2'
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD:minigrid/envs/memory.py)" = '660b0a1b769948034c87bb421759c2b9a4f24548'
          test "$(git -C "$RUNNER_TEMP/upstream" show HEAD:minigrid/envs/memory.py | sha256sum | awk '{print $1}')" = 'd208b6b0cfb20a8ed00d55a0ea6012697f2a0da0e54e4da7d8378eb1da52df8c'
          python -m pip install --disable-pip-version-check --no-input numpy==1.26.4 gymnasium==1.2.2 pygame-ce==2.5.8 networkx==3.4.2
          python -m pip install --disable-pip-version-check --no-input --no-deps -e "$RUNNER_TEMP/upstream"
          python -m pip check
          echo AAI07A_OFFICIAL_ENV_SOURCE_CUSTODY=PASS
      - name: Consume disjoint preregistered primary exactly once
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-07/evaluate.py > "$RUNNER_TEMP/aai07a-primary.json"
          python - "$RUNNER_TEMP/aai07a-primary.json" <<'PY'
          import hashlib,json,sys
          raw=open(sys.argv[1],'rb').read()
          x=json.loads(raw)
          assert x['prereg_commit']=='e27dc3eb66171a96f55fa4cb0acc2cfff2695ea1'
          assert x['native_integration']=='NONE'
          print('AAI07A_PRIMARY_SUMMARY='+json.dumps({k:v for k,v in x.items() if k!='world_rows'},sort_keys=True,separators=(',',':')))
          print('AAI07A_PRIMARY_RAW_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$RUNNER_TEMP/upstream" status --porcelain)"
          echo AAI07A_PRIMARY_CAPTURE_PASS=PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aai07a-frozen-memory-primary
          path: ${{ runner.temp }}/aai07a-primary.json
          if-no-files-found: warn
          retention-days: 14
