name: CKAD25-AC exact-final native no-go regression and G29
on:
  push:
    branches: [research/ckad25ac-identity-reassignment-20261118]
    paths:
      - ".github/workflows/ckad25ac-final-regression.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  source-only-pinned-G29:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.g29.outputs.source_sha }}
      final_sha: ${{ steps.g29.outputs.final_sha }}
    steps:
      - name: Preserve exact source bytes on every host
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify original science source and negative receipt before generating three code-index files
        id: g29
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/ckad25ac-identity-reassignment-20261118
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "3f33f32c7919bba5297fbf79ff561ef9e85c7255"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AC/run.py)" = "e14d2513b11fecc8598cf8a5174c40535fa5e91c"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AC/result.json)" = "c21b9db3e0328279d383ee9d2a2beda301baef17"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AC/provenance.json)" = "ba7ae22f67f7d35226d6752c635f87ceafc31564"
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("research/contrib/chatgpt/CKAD25-AC")
          raw=(base/"result.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="c96c0ff59c34a1f6a0090e776efd4d4a357aa72ba624bc8f5cb9fc2c775e7e2b"
          d=json.loads(raw)
          assert d["development_disposition"]=="DEVELOPMENT_NO_GO"
          assert d["frozen_gates"]["reassigned_transfer_advantage"] is False
          assert d["frozen_gates"]["stable_learned_intervention_advantage"] is False
          assert d["scientific_pass"] is False
          print("CKAD25AC_ORIGINAL_FROZEN_IDENTITY_TRANSFER_NO_GO_PASS")
          PY
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert changed=={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"},changed
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(ckad25ac): pin G29 source index to original identity-transfer negative"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CKAD25AC_G29_SOURCE_SHA=$GITHUB_SHA"
          echo "CKAD25AC_G29_DERIVED_SHA=$(git rev-parse HEAD)"

  mandatory-whole-native-regression:
    needs: [source-only-pinned-G29]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve immutable source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-pinned-G29.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Pinned dependencies for complete inherited native regression
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exact-source complete native regression plus independent original negative science audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.source-only-pinned-G29.outputs.final_sha }}"
          test "$(git rev-parse 'HEAD^')" = "${{ needs.source-only-pinned-G29.outputs.source_sha }}"
          git rev-parse 'HEAD^{tree}'
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "3f33f32c7919bba5297fbf79ff561ef9e85c7255"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AB/run.py)" = "3c3d88a66e8fe343bc9fd7fa47c8992343cc4bbb"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AC/run.py)" = "e14d2513b11fecc8598cf8a5174c40535fa5e91c"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AC/result.json)" = "c21b9db3e0328279d383ee9d2a2beda301baef17"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-AC/provenance.json)" = "ba7ae22f67f7d35226d6752c635f87ceafc31564"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p test_ckad23.py -v
          python -B research/contrib/chatgpt/CKAD25-AC/audit_results.py research/contrib/chatgpt/CKAD25-AC/result.json
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("research/contrib/chatgpt/CKAD25-AC")
          raw=(root/"result.json").read_bytes()
          d=json.loads(raw)
          p=json.loads((root/"provenance.json").read_bytes())
          assert hashlib.sha256(raw).hexdigest()=="c96c0ff59c34a1f6a0090e776efd4d4a357aa72ba624bc8f5cb9fc2c775e7e2b"
          assert p["original_raw_canonical_result_sha256"]==hashlib.sha256(raw).hexdigest()
          assert p["identical_original_result_both_platforms"] is True
          assert d["source_sha256"]==hashlib.sha256((root/"run.py").read_bytes()).hexdigest()
          assert d["parent_scoring_source_sha256"]==hashlib.sha256(Path("research/contrib/chatgpt/CKAD25-AB/run.py").read_bytes()).hexdigest()
          assert d["genuine_source_actions"]==8352 and d["held_conditional_predictions"]==2560
          assert d["development_disposition"]=="DEVELOPMENT_NO_GO"
          assert d["condition_arms"]["STABLE"]["native_beta_memory"]["shifted_detected"]==59
          assert d["condition_arms"]["REASSIGNED"]["native_beta_memory"]["shifted_detected"]==48
          assert d["frozen_gates"]["stable_learned_intervention_advantage"] is False
          assert d["frozen_gates"]["reassigned_transfer_advantage"] is False
          assert d["frozen_gates"]["conventional_no_information_leak"] is True
          assert d["frozen_gates"]["all_native_committee_and_source_history_retain_exact_cold"] is True
          assert d["no_true_role_or_mapping_supplied_to_native"] is True
          assert d["full_action_semantics_remapped"] is False
          assert d["scientific_pass"] is False and d["conventional_superiority"] is False
          assert d["universal_OOD_safety"] is False
          assert d["protected_owner_first_use"] is False and d["accepted_main_changed"] is False
          assert d["forge_dispatch"] is False and d["merge"] is False and d["deployment"] is False
          print("CKAD25AC_EXACT_FINAL_FROZEN_NO_GO_SCIENCE_AUDIT_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo "CKAD25AC_FULL_FINAL_NATIVE_REGRESSION_PASS_SHA=$(git rev-parse HEAD)"
