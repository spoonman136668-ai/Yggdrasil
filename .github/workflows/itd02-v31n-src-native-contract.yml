name: ITD-02 V31N-SRC native contract read-only
on:
  push:
    branches: [research/itd02-v31n-native-contract-differential-20261028]
permissions:
  contents: read
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and no reserved holdout
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 143396ce0d9fa57fe6723e06744c7e744e9957d8 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Run v12 focused and G29 original unaltered
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31n"
          set +e
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v > "$RUNNER_TEMP/v31n/v12_native.log" 2>&1
          echo $? > "$RUNNER_TEMP/v31n/v12_native.exit"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v > "$RUNNER_TEMP/v31n/v12_eligibility.log" 2>&1
          echo $? > "$RUNNER_TEMP/v31n/v12_eligibility.exit"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v > "$RUNNER_TEMP/v31n/g29.log" 2>&1
          echo $? > "$RUNNER_TEMP/v31n/g29.exit"
          set -e
          python - "$RUNNER_TEMP/v31n" <<'PY'
          import json,pathlib,re,sys,hashlib
          p=pathlib.Path(sys.argv[1])
          result={"schema":"v31n.src.contract.v1","reserved_holdout_evaluated":False,
                  "scientific_first_use":False,"native_source_changed":False}
          for n in ("v12_native","v12_eligibility","g29"):
              log=(p/(n+".log")).read_text(errors="replace")
              result[n]={"exit":int((p/(n+".exit")).read_text()),
                          "failed_tests":sorted(set(re.findall(r"^(?:FAIL|ERROR): ([^\n]+)",log,re.M))),
                          "summary":re.findall(r"^(?:Ran \d+ tests.*|FAILED \(.*|OK)$",log,re.M)[-2:]}
          result["classification"]=("V31N_SRC_V12_FOCUSED_PASS_INHERITED_BLOCKED__NO_SCIENCE" if
             result["v12_native"]["exit"]==0 and result["v12_eligibility"]["exit"]==0 else
             "V31N_SRC_V12_FOCUSED_FAIL__NO_SCIENCE")
          (p/"report.json").write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve intact logs and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31n-src-${{ matrix.os }}
          path: ${{ runner.temp }}/v31n/*
          retention-days: 7
