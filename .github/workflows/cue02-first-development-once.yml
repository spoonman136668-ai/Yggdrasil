name: CUE-02 first frozen finite-action novelty source-only screen
on:
  push:
    branches: [qualification/cue02-first-high-to-low-development-20261116]
    paths: [.github/workflows/cue02-first-development-once.yml]
permissions:
  contents: read
concurrency:
  group: cue02-first-development-once-20261116
  cancel-in-progress: false
jobs:
  source-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'CUE-02 frozen first high-to-low source screen'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: d86c76b24f784cad69592be0e89c07858a64d35a
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out frozen code/read-only evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d86c76b24f784cad69592be0e89c07858a64d35a
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate source, prereg and existing native memory identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CUE-02/prereg.json)" = 34db1b055e2918955a0e281d370c62fd81dd90a9
          test "$(git rev-parse HEAD:yggdrasil/native_finite_cue_audit.py)" = 089fe536650404c645dc07cf2ec9ffb86758153e
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CUE-02/dev.py)" = 9919facd671cde30c6bdddd6c78920c8780ff0dc
          test "$(git rev-parse HEAD:tests/test_native_finite_cue_audit.py)" = 7da1c57d37a9ca3f81dfe79da6106142158c38f6
          test "$(git rev-parse HEAD:yggdrasil/native_cumulative_action_bank.py)" = d285a33af70e3348d2d2b284746a08ec07c6ba87
          test "$(git rev-parse HEAD:yggdrasil/native_action_cue_router.py)" = 0be7452fce87cace6a9348a39120053b5427ceb1
          test -z "$(git status --porcelain)"
          echo CUE02_PRE_FIRST_SCORE_SOURCE_SHA_PIN_PASS
      - name: Run exact frozen source and hostile public-evidence tests
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p test_native_finite_cue_audit.py -v
          test -z "$(git status --porcelain)"
      - name: High-first 32 to 8 intervention screen, all arms and witnesses
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CUE-02/dev.py --source-dev > "$RUNNER_TEMP/cue02-result.txt"
          python -B - <<'PY'
          from pathlib import Path
          import json,os
          s=(Path(os.environ["RUNNER_TEMP"])/"cue02-result.txt").read_text().strip()
          assert s.startswith("CUE02_DEV="), s[:200]
          r=json.loads(s.removeprefix("CUE02_DEV="))
          print("CUE02_CLASSIFICATION="+r["classification"])
          print("CUE02_BUDGET_SWEEP="+json.dumps(r["budget_sweep_high_first"]))
          print("CUE02_POLICY_RESULTS="+json.dumps(r["per_policy"],sort_keys=True))
          print("CUE02_31_OF_32_ADVERSARIAL_WITNESSES="+str(r["complete_31_of_32_indistinguishable_witnesses"]))
          print("CUE02_TRACE_SHA256="+r["trace_sha256"])
          print("CUE02_SOURCE_SHA256="+r["original_source_public_sha256"])
          print("CUE02_BANK_SHA256="+r["full_native_bank_checkpoint_sha256"])
          print("CUE02_GATES="+json.dumps(r["frozen_gates"],sort_keys=True))
          assert r["independent_scientific_first_use"]==0
          assert r["accepted_main_changed"] is False
          assert r["classification"]=="ENGINEERING_DEV_PASS_SCIENCE_UNVERIFIED_AND_UNBOUNDED_IDENTITY_UNPROVABLE"
          PY
      - name: Protected first-use denied and source immutable
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if python -B research/contrib/chatgpt/CUE-02/dev.py --primary >/dev/null 2>&1; then exit 1; fi
          echo CUE02_SOURCE_CLEAN_FIRST_USE_DENIED_PASS
