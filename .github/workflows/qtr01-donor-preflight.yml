name: QTR-01 Bounded Donor Input Preflight
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-donor-preflight.yml
permissions:
  contents: read
jobs:
  donor-inputs:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check bounded verifier and negative controls, no donor inference
        run: python -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_verify_donor.py' -v
      - name: Install pinned Parquet decoder only
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: pyarrow==20.0.0
      - name: Read three fixed public files (max 1.3 MB total), validate hashes and schema
        run: python research/contrib/chatgpt/QTR-01/verify_donor.py --fetch
      - name: Reject checkout modifications
        run: git diff --exit-code
