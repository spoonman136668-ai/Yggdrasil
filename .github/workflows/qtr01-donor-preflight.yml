name: QTR-01 F04 Semantic Metadata Admission
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-donor-preflight.yml
permissions:
  contents: read
jobs:
  metadata-admission:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Frozen fixture controls, no source labels consumed
        run: python -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_semantic_preflight.py' -v
      - name: Inspect only bounded pinned public SAE feature-list metadata
        run: python research/contrib/chatgpt/QTR-01/semantic_preflight.py --pinned-source-readonly
      - name: Confirm no checkout modifications
        run: git diff --exit-code
