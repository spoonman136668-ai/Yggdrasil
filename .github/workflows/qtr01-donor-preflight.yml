name: QTR-01 F10 Native Transfer DEV
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-donor-preflight.yml
      - research/contrib/chatgpt/QTR-01/f10_*.py
permissions:
  contents: read
jobs:
  native-fixture:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fixed F10 native adapter tests
        run: python -m unittest discover -s research/contrib/chatgpt/QTR-01 -p "test_f10_*.py" -v
      - name: Native memory backward compatibility
        run: python -m unittest discover -s tests -p "test_native_cells*.py" -v
      - name: Frozen fixture results
        run: python research/contrib/chatgpt/QTR-01/f10_experiment.py --fixed-dev-only
      - name: Checkout integrity
        run: git diff --exit-code
