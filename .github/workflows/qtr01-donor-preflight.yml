name: QTR-01 F09 Fitted Artifact Rights and Provenance
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-donor-preflight.yml
permissions:
  contents: read
jobs:
  rights-provenance:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Eight fixture-only negative controls
        run: python -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f09_provenance.py' -v
      - name: Two pinned public metadata GETs, no matrices or model inference
        run: python research/contrib/chatgpt/QTR-01/f09_provenance.py --fixed-readonly-metadata
      - name: Verify clean checkout
        run: git diff --exit-code
