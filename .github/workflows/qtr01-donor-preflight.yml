name: QTR-01 F07 Fitted Matrix Inventory
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-donor-preflight.yml
permissions:
  contents: read
jobs:
  matrix-inventory:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Eight offline negative controls
        run: python -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f07_matrix_inventory.py' -v
      - name: One exact public artifact metadata GET, no model or matrix bytes
        run: python research/contrib/chatgpt/QTR-01/f07_matrix_inventory.py --one-public-metadata-read
      - name: Verify no checkout changes
        run: git diff --exit-code
