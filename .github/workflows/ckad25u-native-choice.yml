name: CKAD25-U native intervention-choice prospective audit
on:
  pull_request:
    paths:
      - "research/contrib/chatgpt/CKAD25-U/**"
      - ".github/workflows/ckad25u-native-choice.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  frozen-acquisition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Keep Git-tracked bytes stable across platforms
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact existing development control dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Freeze science source and original parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD25-U/run.py)" = "661c9d73bf62a4b85c21a28c3a5c04fe30cccf58"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("research/contrib/chatgpt/CKAD-25/qualified-development-runs/44331408493")
          l=(p/"linux/stage-02.native.json").read_bytes()
          w=(p/"windows/stage-02.native.json").read_bytes()
          assert l==w
          assert hashlib.sha256(l).hexdigest()=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          print("CKAD25U_PINNED_ORIGINAL_NATIVE_SOURCE_PASS")
          PY
      - name: Before-score public input and negative source interface controls
        shell: bash
        run: |
          python -B research/contrib/chatgpt/CKAD25-U/run.py --selfcheck
      - name: Score exactly frozen new source-free intervention cohort
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-U/run.py --output "$RUNNER_TEMP/ckad25u-result.json"
          cp "$RUNNER_TEMP/ckad25u-result.json" "$RUNNER_TEMP/ckad25u-original.json"
      - name: Deterministic same-cohort replay and fail-closed source audit
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-U/run.py --output "$RUNNER_TEMP/ckad25u-result.json"
          cmp "$RUNNER_TEMP/ckad25u-result.json" "$RUNNER_TEMP/ckad25u-original.json"
          python -B - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          raw=(Path(os.environ["RUNNER_TEMP"])/"ckad25u-result.json").read_bytes()
          d=json.loads(raw)
          assert d["schema"]=="yggdrasil.ckad25u.prospective-native-acquisition.v1"
          assert d["new_synthetic_observations_all_arms"]==576
          assert d["same_held_test_actions_per_arm"]==72
          assert d["original_protected_actions"]==0
          assert d["original_held_outcome_reused"] is False
          assert d["native_source_changed"] is False
          assert d["candidate_policy_is_existing_native_propose"] is True
          assert d["scientific_pass"] is False
          assert d["accepted_model"] is False
          assert d["forge_dispatch_authorized"] is False
          assert d["native_promotion_authorized"] is False
          assert d["deployment_authorized"] is False
          assert d["gates"]["old_native_knowledge_retained"] is True
          assert len(d["per_seed_policy_law"])==72
          print("CKAD25U_FROZEN_DEVELOPMENT_CUSTODY_PASS")
          print("CKAD25U_ORIGINAL_RESULT_SHA256="+hashlib.sha256(raw).hexdigest())
          print("CKAD25U_FROZEN_DISPOSITION="+d["disposition"])
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25u-prospective-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25u-result.json
          if-no-files-found: error
          retention-days: 60
