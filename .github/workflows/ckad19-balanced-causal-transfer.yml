name: CKAD19 frequency-matched causal transfer (frozen development)
on:
  push:
    branches: [research/ckad19-balanced-causal-transfer-20261117]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ckad19): run frozen balanced causal transfer'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run frozen transfer and negative controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e10eade9f2d84f062993080f7ca215fece32cfe7 HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-19/campaign.py)" = c4465efc5edd142c9ad2cc48df2ab0b9f5150b76
          test "$(git hash-object research/contrib/chatgpt/CKAD-19/test_ckad19.py)" = 1d6d4d844e78edb620a35fc5f8d58be37a626f18
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-19 -p test_ckad19.py -v
          python -B research/contrib/chatgpt/CKAD-19/campaign.py --output-directory "$RUNNER_TEMP/ckad19"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ckad19/result.json'; d=json.loads(p.read_text()); assert d['stable_sha256']=='46b7f64a2c390c89f85452ec5fa9a74853593582a3450f23d823c60a1ca99685';assert d['cases']==120;assert d['classification']=='DEVELOPMENT_NO_GO' and d['scientific_pass'] is False and d['gates']['regret_active_vs_random_t2'] is False"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad19-${{ matrix.os }}-development
          path: ${{ runner.temp }}/ckad19/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: development
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Seal atlas, do not touch research source
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ckad19): qualify frozen transfer source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad19-balanced-causal-transfer-20261117
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact qualified full regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory full regression and frozen outcome
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          git merge-base --is-ancestor e10eade9f2d84f062993080f7ca215fece32cfe7 HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-19/campaign.py)" = c4465efc5edd142c9ad2cc48df2ab0b9f5150b76
          test "$(git hash-object research/contrib/chatgpt/CKAD-19/test_ckad19.py)" = 1d6d4d844e78edb620a35fc5f8d58be37a626f18
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-19 -p test_ckad19.py -v
          python -B research/contrib/chatgpt/CKAD-19/campaign.py --output-directory "$RUNNER_TEMP/ckad19-final"
          python -c "import json,os,pathlib; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ckad19-final/result.json').read_text());assert d['stable_sha256']=='46b7f64a2c390c89f85452ec5fa9a74853593582a3450f23d823c60a1ca99685'"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-atlas:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent read-only G29 and CKAD historical audits
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CKAD-13/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-14/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-15/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-16/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-17/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-18/independent_audit.py
          test -z "$(git status --porcelain)"
