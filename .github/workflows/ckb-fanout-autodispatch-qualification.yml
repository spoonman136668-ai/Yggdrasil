name: Temporary CKB fanout autodispatch qualification
on:
  push:
    branches: ['infra/ckb-fanout-autodispatch-r1']
    paths: ['research/fanout/.autodispatch-qualification-trigger']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: sidecar
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: b99d67e37fc37bdea21c94f99cef7fbe4953948f
          path: frozen-package
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: manifest-package
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static and unit qualification
        shell: bash
        run: |
          set -euo pipefail
          cd sidecar
          python -m py_compile scripts/free_fanout_sidecar.py tests/test_free_fanout_sidecar.py
          python -m unittest -v tests.test_free_fanout_sidecar
      - name: Exercise immutable manifest-ref screening
        shell: bash
        env:
          PACKAGE_SHA: b99d67e37fc37bdea21c94f99cef7fbe4953948f
          MANIFEST_REF: ${{ github.sha }}
          MANIFEST_PATH: research/fanout/smoke.manifest.json
        run: |
          set -euo pipefail
          test "$(git -C frozen-package rev-parse HEAD)" = "$PACKAGE_SHA"
          test "$(git -C manifest-package rev-parse HEAD)" = "$MANIFEST_REF"
          case "$MANIFEST_PATH" in
            research/fanout/*.json) ;;
            *) echo "FANOUT_MANIFEST_PATH_INVALID" >&2; exit 1 ;;
          esac
          [[ "$MANIFEST_PATH" != *".."* ]]
          src="manifest-package/$MANIFEST_PATH"
          test -f "$src"
          test ! -L "$src"
          root="$(realpath manifest-package)"
          resolved="$(realpath "$src")"
          [[ "$resolved" == "$root"/research/fanout/* ]]
          mkdir -p sidecar/research/fanout
          cp -- "$resolved" sidecar/research/fanout/controller.manifest.json
          cd sidecar
          python scripts/free_fanout_sidecar.py prepare --manifest research/fanout/controller.manifest.json --program Yggdrasil --package-sha "$PACKAGE_SHA" > /tmp/matrix.json
          for id in smoke-a smoke-b smoke-c; do
            python scripts/free_fanout_sidecar.py run --manifest research/fanout/controller.manifest.json --program Yggdrasil --package-sha "$PACKAGE_SHA" --package-root ../frozen-package --candidate-id "$id" --output "../fanout-output/$id"
            mkdir -p "../fanout-artifacts/$id"
            cp "../fanout-output/$id/candidate-envelope.json" "../fanout-artifacts/$id/"
          done
          python scripts/free_fanout_sidecar.py aggregate --manifest research/fanout/controller.manifest.json --program Yggdrasil --package-sha "$PACKAGE_SHA" --artifacts ../fanout-artifacts --output ../fanout-summary.json
          python -c 'import json; s=json.load(open("../fanout-summary.json")); assert s["candidate_count"]==3; assert s["scientific_classification"] is None; assert s["promotion_authority"] is False; assert s["successor_authority"] is False'
      - name: Full Yggdrasil test surface
        shell: bash
        working-directory: sidecar
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
