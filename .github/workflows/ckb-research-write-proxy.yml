name: CKB research write proxy
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - infra/ckb-research-write-proxy-r1
    paths:
      - '.github/workflows/ckb-research-write-proxy.yml'
      - 'research/transport/Invoke-CKBResearchWriteProxy.ps1'

permissions:
  contents: write
  actions: write

concurrency:
  group: ckb-research-write-proxy-yggdrasil
  cancel-in-progress: false

jobs:
  proxy:
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Static proxy self-test
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & .\research\transport\Invoke-CKBResearchWriteProxy.ps1 -Lane 'Yggdrasil' -Repository 'spoonman136668-ai/Yggdrasil' -RepositoryPath 'C:\ProgramData\CKBR\research\repos\Yggdrasil' -SelfTest
      - name: Process exact CKB write requests
        if: github.event_name != 'push' || github.ref_name == 'infra/ckb-research-write-proxy-r1'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          & gh.exe auth status --hostname github.com
          if($LASTEXITCODE -ne 0){throw 'PERSISTENT_GH_AUTH_UNAVAILABLE'}
          & .\research\transport\Invoke-CKBResearchWriteProxy.ps1 -Lane 'Yggdrasil' -Repository 'spoonman136668-ai/Yggdrasil' -RepositoryPath 'C:\ProgramData\CKBR\research\repos\Yggdrasil'
