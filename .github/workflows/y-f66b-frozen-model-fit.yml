name: Yggdrasil F66B frozen public-opportunity model fit
on:
  push:
    branches: [science/y-f66b-fit-frozen-opportunity-cost-20261016-r1]
permissions:
  contents: read
  actions: read
jobs:
  authentic-frozen-fit:
    if: "${{ github.event.head_commit.message == 'science(y-f66b): fit immutable public opportunity weights once from archived train receipt' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin prior scientific authority and method
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8a09b4765db49488853b2d9970225ad55b139ae4 HEAD
          test "$(git hash-object research/foundational/20261016-y-f66/dense_opportunity_teacher.py)" = 7b41ebeaf51f879e6426206923e8e0ad1cb9897c
          test "$(git hash-object research/foundational/20261016-y-f66/prereg-opportunity-cost-amendment.json)" = 3502d23f503cb0fdc798b2ac7db3f5cdb09c254d
          test "$(git hash-object research/foundational/20261016-y-f66/f66b_fit_from_archive.py)" = e03f88041af96fed6f84107996547d29323310ad
      - name: Acquire previously accepted once-only training rows
        uses: actions/download-artifact@v4
        with:
          name: y-f66b-once-only-fit-train-source
          run-id: 38890771643
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/f66b-exact-training/
      - name: Fit without rerunning registered source or future question
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f66b-frozen-fit/"
          test "$(sha256sum "$RUNNER_TEMP/f66b-exact-training/fit_train_rows.jsonl" | cut -d' ' -f1)" = 4bd1b7d87b6f63027daf34dbcf61aa028768b0c3a1cc745df4763b5d09df90bc
          python3 -B research/foundational/20261016-y-f66/f66b_fit_from_archive.py --archived-train-rows "$RUNNER_TEMP/f66b-exact-training/fit_train_rows.jsonl" > "$RUNNER_TEMP/f66b-frozen-fit/model_fit.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f66b-frozen-fit/model_fit.json" > /dev/null
          cat "$RUNNER_TEMP/f66b-frozen-fit/model_fit.json"
          sha256sum "$RUNNER_TEMP/f66b-frozen-fit/model_fit.json" > "$RUNNER_TEMP/f66b-frozen-fit/hashes.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f66b-frozen-fit/exact_head.txt"
          echo "FIT_VALIDATION=UNCONSUMED DIAG=UNCONSUMED ORIGINAL=UNCONSUMED F3=FALSE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f66b-authentic-frozen-model-training
          path: ${{ runner.temp }}/f66b-frozen-fit/
          retention-days: 90
          if-no-files-found: warn
