name: Yggdrasil external minimal-evidence fine pipeline 023

on:
  push:
    branches:
      - research/external-hosted-yggdrasil-fine-pipeline-r1
    paths:
      - 'research/applications/plane/exp-dgr-external-minimal-evidence-fine-pipeline-023.py'
      - '.github/workflows/external-minimal-evidence-fine-pipeline-023.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen two-commit package
        shell: bash
        run: |
          set -euo pipefail
          parent='9bdc26c52fe7a82d1dc816d261bcfb20ae103c60'
          prereg='e338c485c60ceb1b799faecd1e8efaea11ce34bc'
          test "$(git rev-parse HEAD^)" = "$prereg"
          test "$(git rev-parse HEAD^^)" = "$parent"
          mapfile -t first_files < <(git diff-tree --no-commit-id --name-only -r "$prereg")
          test "${#first_files[@]}" -eq 1
          test "${first_files[0]}" = 'research/experiments/exp-dgr-external-minimal-evidence-fine-pipeline-023.ice'
          mapfile -t final_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#final_files[@]}" -eq 2
          printf '%s\n' "${final_files[@]}" | grep -Fx 'research/applications/plane/exp-dgr-external-minimal-evidence-fine-pipeline-023.py'
          printf '%s\n' "${final_files[@]}" | grep -Fx '.github/workflows/external-minimal-evidence-fine-pipeline-023.yml'

      - name: Verify exact CKB-plane READY_RESEARCH receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-MINIMAL-EVIDENCE-FINE-PIPELINE-023","preregistration_sha":"e338c485c60ceb1b799faecd1e8efaea11ce34bc","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001372","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=='a4da2c05279ef5b68b78e8849d3b0ded0494e9f3ba672e857f25342369d6d802'
          r=json.loads(raw)
          assert r['research_decision']['disposition']=='READY_RESEARCH'
          assert r['research_decision']['scope']=='research-consume-once'
          pathlib.Path('/tmp/yggdrasil-023-authority.json').write_text(raw,encoding='utf-8')
          PY

      - name: Fetch exact external sources into ephemeral scratch
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-external-023"
          mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          sources=[
            ('code','https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py','7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6',41453),
            ('structured','https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json','4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192',14365),
            ('technical-prose','https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md','8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3',1454),
          ]
          root=pathlib.Path(os.environ['EXTERNAL_ROOT'])
          rows=[]
          for domain,url,want_sha,want_bytes in sources:
              u=urllib.parse.urlparse(url)
              assert u.scheme=='https' and u.hostname=='raw.githubusercontent.com'
              req=urllib.request.Request(url,headers={'User-Agent':'yggdrasil-external-023'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(want_bytes+1)
              assert len(data)==want_bytes
              got=hashlib.sha256(data).hexdigest()
              assert got==want_sha
              (root/(domain+'.bin')).write_bytes(data)
              rows.append({'domain':domain,'bytes':len(data),'sha256':got})
          assert sum(x['bytes'] for x in rows)==57272
          pathlib.Path('/tmp/yggdrasil-023-sources.json').write_text(json.dumps(rows,separators=(',',':')),encoding='utf-8')
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"

      - name: Run frozen fine-grained pipeline twice
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-minimal-evidence-fine-pipeline-023.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-minimal-evidence-fine-pipeline-023.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json

      - name: Classify from frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,pathlib
          result=json.loads(pathlib.Path('/tmp/result1.json').read_text(encoding='utf-8'))
          assert result['schema']=='yggdrasil.research-scientific-result.v1'
          assert result['experiment']=='EXP-DGR-EXTERNAL-MINIMAL-EVIDENCE-FINE-PIPELINE-023'
          m=result['metrics']
          assert all(math.isfinite(float(v)) for v in m.values())
          validity=(
            m['source_identity_mismatch_count']==0 and m['source_count']==3 and m['total_source_bytes']==57272 and
            m['base_training_identity_mismatch_count']==0 and m['packet_event_count']==36 and
            m['preadmission_evaluation_count']==0 and m['maturity_criterion_violation_count']==0 and
            m['matched_assignment_failure_count']==0 and
            m['minimum_selected_motif_count']==16 and m['maximum_selected_motif_count']==16 and
            m['minimum_active_structure_count']==7 and m['maximum_active_structure_count']==7 and
            m['minimum_retained_structure_count']==9 and m['maximum_retained_structure_count']==9 and
            m['retained_record_integrity_mismatch_count']==0 and m['state_partition_mismatch_count']==0 and
            m['capacity_growth_event_count']==0 and m['tokenizer_use_count']==0 and m['external_model_call_count']==0 and
            m['invalid_evaluation_rows']==0
          )
          mature_all=m['admitted_domain_count']==6
          finals=m['final_nonpositive_domain_count']==0
          retention=m['positive_then_nonpositive_transition_count']==0
          ratio=m['minimum_active_to_independent_fraction_when_independent_positive']>=0.5
          gate=m['minimum_positive_contribution_rows_at_admission']>=1
          if not validity: cls='invalid'
          elif not mature_all or not finals: cls='negative'
          elif retention and ratio and gate: cls='supported'
          else: cls='mixed'
          out={
            'schema':'yggdrasil.research-classification.v1',
            'experiment':'EXP-DGR-EXTERNAL-MINIMAL-EVIDENCE-FINE-PIPELINE-023',
            'classification':cls,'validity_pass':validity,
            'all_domains_matured':mature_all,'final_domains_positive':finals,
            'retention_threshold_pass':retention,'independent_fraction_threshold_pass':ratio,
            'maturity_gate_threshold_pass':gate,
            'authority_receipt_sha256':'a4da2c05279ef5b68b78e8849d3b0ded0494e9f3ba672e857f25342369d6d802',
            'metrics':m
          }
          pathlib.Path('/tmp/classification.json').write_text(json.dumps(out,separators=(',',':')),encoding='utf-8')
          print(json.dumps(out,separators=(',',':')))
          if not validity:
              raise SystemExit('FROZEN_FINE_PIPELINE_VALIDITY_FAILED')
          PY

      - name: Delete external bytes
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ygg-external-023"
          test ! -e "$RUNNER_TEMP/ygg-external-023"

      - name: Upload evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-external-minimal-evidence-fine-pipeline-023
          path: |
            /tmp/yggdrasil-023-authority.json
            /tmp/yggdrasil-023-sources.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
