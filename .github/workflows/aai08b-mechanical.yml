name: AAI-08B source-only sparse-recurrence mechanical qualification
on:
  push:
    branches: [research/aai08b-sparse-recurrence-falsification-20261114]
    paths: [.github/workflows/aai08b-mechanical.yml]
permissions:
  contents: read
jobs:
  frozen-protocol-and-model-tests:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-08B source-only mechanical audit' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact-source and user authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '92cff577ce34561764b712d41675104762ed6976'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai08b-mechanical.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-08B/prereg.json)" = "$(git rev-parse da868ed0438a2407a6523f5a8ac3040df892a350:research/contrib/chatgpt/AAI-08B/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-08B/models.py)" = "$(git rev-parse 92cff577ce34561764b712d41675104762ed6976:research/contrib/chatgpt/AAI-08B/models.py)"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/contrib/chatgpt/AAI-08B/prereg.json')
          j=json.loads(p.read_text(encoding='utf8'))
          assert j['authority']['first_use_authorized'] is False
          assert j['protocol']['budgets']==[0,1,2,4,8]
          assert j['parent_main_sha']=='5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          print('AAI08B_NO_SCIENTIFIC_FIRST_USE=PASS')
          PY
      - name: Exact original-cache plus conventional controls unit tests, synthetic only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-08B -p 'test_models.py' -v
          test -z "$(git status --porcelain)"
          echo AAI08B_MECHANICAL_MODEL_TESTS_PASS
