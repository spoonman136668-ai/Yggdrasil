name: ITD-02 V31F legal informative action comparison
on:
  push:
    branches: [research/itd02-v31f-informative-action-observation-20261028]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg chronology and exact original bridge
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f064c9fb21ed5f8986dea490833728ed692da68a "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test ! -f research/itd02_v31_heldout_evaluator.py
      - name: Policy comparisons use one legal public reward only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31f"
          PYTHONPATH=. python -B research/itd02_v31f_informative_action_dev_audit.py > "$RUNNER_TEMP/v31f/report.json"
          python - "$RUNNER_TEMP/v31f/report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["development_streams"]==4 and len(d["summary"])==12
          assert not d["holdout_evaluated"] and not d["scientific_first_use"]
          assert len(d["canonical_all_public_feedback_sha256"])==64
          assert all(x["source_sha_unchanged"] for x in d["summary"])
          print("V31F_DEVELOPMENT_POLICY_ONLY_NOT_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v31f/report.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve bounded public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31f-${{ matrix.os }}
          path: ${{ runner.temp }}/v31f/*
          retention-days: 7
          if-no-files-found: warn
