name: CKAD25-X seal cross-OS original negative without first-use replay
on:
  push:
    branches: [research/ckad25x-active-causal-discrimination-20261118]
    paths:
      - ".github/workflows/ckad25x-seal-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  original-receipt-seal-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Preserve source exact bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Refuse changed original evaluator or duplicate evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ckad25x-active-causal-discrimination-20261118"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/native_cumulative_learner.py)" = "914131d965425f9347bf48584b693ce3633ad4f9"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-X/run.py)" = "77423abd206c225778ad183ff0312c4a881298c9"
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          test ! -e research/contrib/chatgpt/CKAD25-X/result.json
          test ! -e research/contrib/chatgpt/CKAD25-X/provenance.json
          test -z "$(git status --porcelain)"
      - name: Fetch only previously scored, separate OS original science artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14473167252/zip" \
            -o "$RUNNER_TEMP/ckad25x-linux.zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14474771356/zip" \
            -o "$RUNNER_TEMP/ckad25x-windows.zip"
      - name: Independently audit all 80 original held-case scores and lossless source accounts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          temporary=Path(os.environ["RUNNER_TEMP"])
          originals={}
          artifacts={
              "linux":("1be2447364194767f17ca352f4459f4eb5d3baad6b20d1f066d924b75f3541f4",14473167252),
              "windows":("33e18c64fac77ca70e369efe8346698bd5be20c644d7681d6d6407a156eaed29",14474771356)
          }
          def sha(data): return hashlib.sha256(data).hexdigest()
          for system,(expected_zip,artifact_id) in artifacts.items():
              z=temporary/f"ckad25x-{system}.zip"
              assert sha(z.read_bytes())==expected_zip,system
              with zipfile.ZipFile(z) as f:
                  assert f.namelist()==["ckad25x-result.json"],f.namelist()
                  originals[system]=f.read("ckad25x-result.json")
          raw=originals["linux"]
          expected="e7839ce29f05a0d88fef58d0f6ad4d792bb6fc8a8f3fe597c91decdccd9e6350"
          assert sha(raw)==expected
          assert raw==originals["windows"],"CROSS_PLATFORM_SCIENCE_DRIFT"
          root=Path("research/contrib/chatgpt/CKAD25-X")
          d=json.loads(raw)
          assert d["source_sha256"]==sha((root/"run.py").read_bytes())
          assert d["control_helper_sha256"]==sha(Path("research/contrib/chatgpt/CKAD25-S/run.py").read_bytes())
          assert d["original_native_source_sha256"]=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          (root/"result.json").write_bytes(raw)
          provenance={
              "schema":"yggdrasil.ckad25x.original-negative-science-receipt.v1",
              "parent_ckad25w_native_exact_sha":"55b4f56f16721d37e652d7569a128fb6fc98c275",
              "accepted_main_observed_sha":"5e74f8db85b2f5839c42148c0dfba69a88b1a2c9",
              "original_ckad25_native_checkpoint_sha256":"c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f",
              "preregistered_first_commit":"fe64e55354023faae7fa8ded6147c49d706ba18e",
              "native_read_only_action_commit":"53a087353440223d80f3a60dbbee941bf93f05ef",
              "native_file_git_blob":"914131d965425f9347bf48584b693ce3633ad4f9",
              "frozen_executable_initial_commit":"fbac5b1baf3b2008c72516e6ddade90dac3125f7",
              "failed_pre_score_dev_preflight_run_id":44402372723,
              "preflight_only_comparator_order_fix_commit":"beb93933a55877b8917fdc693c09d33908d383ac",
              "re_pinned_before_primary_run_workflow_sha":"58a7df77aedf4b3d8261507aca7ba1f8a8691ddd",
              "actual_scored_native_source_git_blob":"77423abd206c225778ad183ff0312c4a881298c9",
              "actual_source_sha256":sha((root/"run.py").read_bytes()),
              "old_conventional_helper_git_blob":"31e06746dd2fa83cf4bfedf28da43cacbc68c99f",
              "original_primary_run_id":44402721229,
              "linux_preflight_job_id":135149744647,
              "windows_preflight_job_id":135149744104,
              "original_linux_first_score_job_id":135150336601,
              "original_windows_first_score_job_id":135150336585,
              "linux_artifact_id":14473167252,
              "windows_artifact_id":14474771356,
              "original_artifact_zip_sha256":{k:v[0] for k,v in artifacts.items()},
              "original_result_sha256":expected,
              "cross_platform_original_result_byte_parity":True,
              "independent_score_audit_source":"research/contrib/chatgpt/CKAD25-X/audit_results.py",
              "seal_did_not_import_model_or_rescore_held":True,
              "frozen_development_disposition":"DEVELOPMENT_NO_GO",
              "failed_single_gate":"native_beats_random_by_0_04",
              "original_protected_actions":0,
              "no_first_use_owner":True,
              "scientific_pass":False,
              "full_regression_separate":True,
              "merge":False,"production_promotion":False,"accepted_model_changed":False,
              "forge_dispatch":False,"deployment":False,
              "interpretation":"Native Gini action choice is source-conditioned conventional heuristic; A return recognized 4/4 and novel family safe in four synthetic seeds; 0.00625 absolute advantage over random fails prespecified 0.04 gate; mechanism-equivalent exact Gini tie means no scientific superiority."
          }
          (root/"provenance.json").write_text(json.dumps(provenance,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("CKAD25X_ORIGINAL_CROSS_OS_RECEIPT_SEALED="+expected)
          PY
          python3 research/contrib/chatgpt/CKAD25-X/audit_results.py research/contrib/chatgpt/CKAD25-X/result.json
          test -z "$(git diff --name-only)"
      - name: Commit original result bytes and provenance only to isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=research/ckad25x-active-causal-discrimination-20261118
          git fetch --quiet origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add -- research/contrib/chatgpt/CKAD25-X/result.json research/contrib/chatgpt/CKAD25-X/provenance.json
          python3 - <<'PY'
          import subprocess
          changes=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          assert changes=={"research/contrib/chatgpt/CKAD25-X/result.json",
                           "research/contrib/chatgpt/CKAD25-X/provenance.json"},changes
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research(ckad25x): seal original cross-platform no-go and all held metric receipts"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "CKAD25X_ORIGINAL_EVIDENCE_COMMIT=$(git rev-parse HEAD)"
