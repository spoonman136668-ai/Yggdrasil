name: Y-F43 learned reliability source preflight (NO TRAIN cohort or original)
on:
  push:
    branches:
      - research/y-f43-learned-reliability-20261015-r1
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up existing Python test environment
        run: python3 -m pip install -e '.[test]'
      - name: Verify predecessor, pre-code prereg and pinned bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4d557dcfd792d955c4abdf5157a748b90557d855 HEAD
          git merge-base --is-ancestor 92590a1eb318379bd647b5691f4aa9580d17da0c HEAD
          test "$(git hash-object research/foundational/20261015-y-f43/prereg-candidate.json)" = 787c29f30ae436e825675ddda2cdc241159966cd
          test "$(git hash-object research/foundational/20261015-y-f43/source_pilot.py)" = 5778091fb1e23d219e33f180013b4716589304d2
          python3 -m json.tool research/foundational/20261015-y-f43/prereg-candidate.json >/dev/null
          python3 -m py_compile research/foundational/20261015-y-f43/source_pilot.py
      - name: Frozen train/diagnostic separation, learned fit and purchased-port preflight
        run: python3 -m unittest discover -s research/foundational/20261015-y-f43 -p test_preflight.py -v
      - name: One full repository pytest regression
        run: python3 -m pytest -q tests
      - name: Explicit non-execution boundary
        run: echo "F43 source engineering ONLY. No F43 TRAIN cohort, original source, F3, native 576B acceptance, accepted ref or controller mutation."
