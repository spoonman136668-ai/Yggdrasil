name: WSP82 temporal features developer exact-source qualification
on:
  push:
    branches: [research/wsp80-paid-novelty-structural-weight-repair-20261113]
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-82/**'
      - '.github/workflows/wsp82-development-tests.yml'
permissions:
  contents: read
jobs:
  temporal-dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Zero-cohort WSP82 negative controls and numeric versus symbolic parity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
          WSP82_CHECKOUT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-82 -p 'test_*.py' -v
      - name: Exact checkout/source invariant
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
