name: MR34C Original Crafter World vs Renderer Read Only
on:
  push:
    branches:
      - research/mr34c-crafter-render-vs-world-20261021
  pull_request:
    branches:
      - research/mr34b-independent-source-admission-20261021
permissions:
  contents: read
concurrency:
  group: mr34c-original-crafter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independently-authored-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve original source checkout bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact Yggdrasil source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independently authored original Danijar Crafter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: danijar/crafter
          ref: e04542a2159f1aad3d4c5ad52e8185717380ee3a
          path: external/crafter
          fetch-depth: 0
          persist-credentials: false
      - name: Python original source runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned source-runtime libraries (no installed third-party source mutation)
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 imageio==2.36.1 pillow==11.1.0 opensimplex==0.4.5.1 ruamel.yaml==0.18.10
      - name: Record original Crafter world state and RNG before and after unchanged native renderer
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr34c.crafter_world_render ../external/crafter | tee ../mr34c-original-crafter-receipt.log
          grep -q '^MR34C_CRAFTER_ORIGINAL_WORLD_RENDER_AUDIT=' ../mr34c-original-crafter-receipt.log
      - name: Verify original source and project worktrees unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/crafter diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/crafter status --porcelain)"
