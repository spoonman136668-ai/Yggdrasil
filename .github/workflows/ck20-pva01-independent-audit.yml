name: CK20-PVA01 independent policy-value evidence audit
on:
  push:
    branches: [research/ck20-independent-policy-value-audit-20261117]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ck20-pva01): qualify independent policy value audit'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen scientific scope and evidence validator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 691d509e794c0f2419821a5a7981c42570c1d05a HEAD
          python -B research/contrib/chatgpt/CK20-PVA-01/audit.py --self-test --output "$RUNNER_TEMP/ck20-pva01-selftest.json"
          python -c "import json,os,pathlib; d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ck20-pva01-selftest.json').read_text());assert d['status']=='PASS' and d['unit_fixture_only'] is True and d['minimum_two_sided_seed_cluster_p']==.25 and d['CKAD20_scientific_claim_supported'] is False"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck20-pva01-${{ matrix.os }}-selftest
          path: ${{ runner.temp }}/ck20-pva01-selftest.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [development]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify atlas without reauthoring the frozen audit
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ck20-pva01): sealed independent science evidence source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ck20-independent-policy-value-audit-20261117
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned complete regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Exact-candidate full regression with policy-value audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/CK20-PVA-01/audit.py --self-test
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-atlas:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent G29 and predecessor read-only audits
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CKAD-13/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-14/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-15/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-16/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-17/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-18/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-19/independent_audit.py
          test -z "$(git status --porcelain)"
