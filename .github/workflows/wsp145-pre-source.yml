name: WSP145 preregistered source-free active selector
on:
  push:
    branches: [research/wsp145-queryblind-active-disambiguation-20261117]
permissions:
  contents: read
jobs:
  unit:
    # Original one-shot prerequisite already passed Ubuntu/Windows at 11267193.
    # The following no-source assertion must not rerun after WSP145 source opens.
    if: "github.event.head_commit.message == 'test(wsp145): source-free query-blind active selector and dual-OS checks'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify one-file pre-source registration, immutable original, no new source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse df3f3d5262f02b2e86f2198e9a46df36da9de563^)" = "2bd86348494877eb634615e52106a256474a3f1d"
          test "$(git diff-tree --no-commit-id --name-only -r df3f3d5262f02b2e86f2198e9a46df36da9de563)" = "research/contrib/chatgpt/WSP-145/prereg.json"
          git merge-base --is-ancestor df3f3d5262f02b2e86f2198e9a46df36da9de563 HEAD
          git diff --exit-code df3f3d5262f02b2e86f2198e9a46df36da9de563 HEAD -- research/contrib/chatgpt/WSP-145/prereg.json
          git diff --exit-code 2bd86348494877eb634615e52106a256474a3f1d HEAD -- research/contrib/chatgpt/WSP-144 research/contrib/chatgpt/WSP-143 research/contrib/chatgpt/WSP-142 research/contrib/chatgpt/WSP-135
          test ! -e research/contrib/chatgpt/WSP-145/source.py
          test ! -e research/contrib/chatgpt/WSP-145/experiment.py
          test ! -e research/contrib/chatgpt/WSP-145/result.json
      - name: No-source unit tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-145 -p 'test_*.py' -v
      - name: Confirm clean checkout
        shell: bash
        run: test -z "$(git status --porcelain)"
