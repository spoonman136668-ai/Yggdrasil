name: AAI-10A disarmed source-only qualification and pinned generated atlas
on:
  push:
    branches: [research/aai10a-operator-association-learner-20261114]
    paths: [.github/workflows/aai10a-source-and-atlas.yml]
permissions:
  contents: write
concurrency:
  group: aai10a-source-only-20261114
  cancel-in-progress: false
jobs:
  source-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-10A pinned source-only one-shot and code atlas' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Readback of exact prereg / source / parent commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f26701db8213a4f2523c2f8fdb4c45b6e6c75538'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai10a-source-and-atlas.yml'
          test "$(git rev-parse c7e5914d31f488660cbef326a4b04cdbf5adae5e^)" = '1deeb328abc478949b6d528e5cd2775c72021150'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/prereg.json)" = 'a3ab22f7bed1d7a3510ab32af8f661d0d0e92643'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/prereg.json)" = "$(git rev-parse c7e5914d31f488660cbef326a4b04cdbf5adae5e:research/contrib/chatgpt/AAI-10A/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/models.py)" = 'bdb10a793d1001a5676cafd43c878a819ae58ec3'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/test_models.py)" = '99d36fd8d6c08ffa0b08fd3396943df54ce0d3e2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10A/source_only.py)" = 'f0abb76d768aa84229ebba662676a929ad55ada2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-10P/benchmark.py)" = 'b2c58cb6c2f2d308cdd4da259db74547a27dfa3a'
          test -z "$(git status --porcelain)"
          echo AAI10A_FROZEN_PREREG_AND_CODE_BLOB_CUSTODY_PASS
      - name: Public evidence, trained controls, negative and cold restore source tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-10A -p 'test_*.py' -v
          python -B research/contrib/chatgpt/AAI-10A/source_only.py --source-only
          if python -B research/contrib/chatgpt/AAI-10A/source_only.py --primary >/dev/null 2>&1; then
            echo AAI10A_FIRST_USE_DISARM_FAIL >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI10A_SOURCE_ONLY_CROSS_PLATFORM_PASS
  atlas:
    needs: source-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-pinned generated-only existing code atlas
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f26701db8213a4f2523c2f8fdb4c45b6e6c75538'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-10A generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai10a-operator-association-learner-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai10a-operator-association-learner-20261114
          echo AAI10A_PINNED_ATLAS_GENERATED_ONLY_PASS
