name: CKAD26 exact Windows reproduction and final qualification
'on':
  push:
    branches:
    - research/ckad13-integrated-cumulative-20261117
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  replication:
    if: 'github.event.head_commit.message == ''ci(ckad26): reproduce frozen evidence exactly on Windows'''
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CKAD26_EXPECTED_HASH: 917fb68a53c06db143d934e2d5d8e4f74d090da2006cda1c48952ed7f7f60ba3
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Windows semantic reproduction and raw control audit
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 25e83a20c973bba98d170757771777c400cf6acb -- research/contrib/chatgpt/CKAD-26/prereg.json

        REPLICA="$PWD/research/contrib/chatgpt/CKAD-26/replicate_exact.py"
        SOURCE="$RUNNER_TEMP/ckad26-frozen"
        git worktree add --detach "$SOURCE" 5178110111fc8e3880170006b397ccce372e9a24
        cd "$SOURCE"
        python -B "$REPLICA" "$SOURCE/research/contrib/chatgpt/CKAD-26" --output-directory "$RUNNER_TEMP/ckad26-windows" --verify-env
        python -B research/contrib/chatgpt/CKAD-26/independent_audit.py "$RUNNER_TEMP/ckad26-windows"
        python -B research/contrib/chatgpt/CKAD-26/audit_negative_controls.py "$RUNNER_TEMP/ckad26-windows"
        test -z "$(git status --porcelain)"
        cd -
        git worktree remove "$SOURCE"
        test -z "$(git status --porcelain)"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: CKAD26-refresh-windows-exact
        path: ${{ runner.temp }}/ckad26-windows/
        if-no-files-found: warn
        retention-days: 30
  seal:
    needs:
    - replication
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: true
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: CKAD26-refresh-primary
        run-id: 44391641043
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/ckad26-primary
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: CKAD26-refresh-windows-exact
        path: ${{ runner.temp }}/ckad26-windows
    - name: Seal unchanged primary evidence and regenerate source atlas
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        git diff --exit-code 25e83a20c973bba98d170757771777c400cf6acb -- research/contrib/chatgpt/CKAD-26/prereg.json

        cd "$RUNNER_TEMP/ckad26-primary"
        sha256sum -c <<'SUMS'
        036e185811ede97adbd1c2f773888a774224f4620fdf3b980d3beafb8290685b  campaign-result.json
        a00119c73a6431172c19b39ec67a1d94b470897a32c55c1c946071793f37dcc4  seed-101-refresh-native.json
        5ef795930fa33a50084134cb85b3927058e89e99f1cf99dc97923462a0032437  seed-202-refresh-native.json
        a7d0a5a131205d14730e806cabaad85a5a4bb0372d556  seed-303-refresh-native.json
        SUMS
        cd -
        DEST="$PWD/research/contrib/chatgpt/CKAD-26"
        SOURCE="$RUNNER_TEMP/ckad26-frozen"
        git worktree add --detach "$SOURCE" 5178110111fc8e3880170006b397ccce372e9a24
        cd "$SOURCE"
        python -B research/contrib/chatgpt/CKAD-26/seal.py
        for file in campaign-result.json replication-windows.json provenance.json SESSION_REPORT.md seed-{101,202,303}-refresh-native.json; do
          cp "research/contrib/chatgpt/CKAD-26/$file" "$DEST/$file"
        done
        cd -
        git worktree remove --force "$SOURCE"
        python -c 'import json,os,pathlib; p=pathlib.Path("research/contrib/chatgpt/CKAD-26/provenance.json"); d=json.loads(p.read_text()); d.update(windows_exact_reproduction_run=int(os.environ["GITHUB_RUN_ID"]), windows_exact_reproduction_source=os.environ["GITHUB_SHA"], original_primary_artifact=14470790752); p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")'
        git add -- research/contrib/chatgpt/CKAD-26/
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m 'research(ckad26): preserve frozen matched context refresh outcomes'
        RESULT_SOURCE="$(git rev-parse HEAD)"
        python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
        git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
        git commit -m "docs(ckad26): exact cumulative source atlas at $RESULT_SOURCE"
        python -B scripts/build_code_atlas.py --check-if-present
        test -z "$(git status --porcelain)"
        git push origin HEAD:refs/heads/research/ckad13-integrated-cumulative-20261117
        echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      id: seal
      env:
        CKAD26_LINUX_DIRECTORY: ${{ runner.temp }}/ckad26-primary
        CKAD26_WINDOWS_DIRECTORY: ${{ runner.temp }}/ckad26-windows
        CKAD26_SOURCE_COMMIT: 5178110111fc8e3880170006b397ccce372e9a24
        CKAD26_EVIDENCE_RUN: 44391641043
  final-qualified:
    needs:
    - seal
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.seal.outputs.candidate }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Exact-candidate complete regression
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
        git rev-parse HEAD HEAD^{tree}
        python -B -m unittest discover -s tests -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-24 -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-25 -p 'test_*.py' -v
        python -B -m unittest discover -s research/contrib/chatgpt/CKAD-26 -p 'test_*.py' -v
        python -B scripts/build_code_atlas.py --check-if-present
        test -z "$(git status --porcelain)"
      env:
        EXPECTED_CANDIDATE: ${{ needs.seal.outputs.candidate }}
  final-independent-g29:
    needs:
    - seal
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.seal.outputs.candidate }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install existing pinned native solver dependencies
      shell: bash
      run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0
        joblib==1.5.2 threadpoolctl==3.6.0'
    - name: Independent all-era evidence and source qualification
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
        git rev-parse HEAD HEAD^{tree}
        python -B scripts/build_code_atlas.py --check-if-present
        python -B -m unittest discover -s tests -p test_code_atlas.py -v
        CURRENT_SOURCE="$PWD"
        HISTORY_SOURCE="$RUNNER_TEMP/ckad25-historical-source"
        git worktree add --detach "$HISTORY_SOURCE" 48a736933aa84f61d0a450acf322ef62d13fac5f
        cd "$HISTORY_SOURCE"
        for n in $(seq 13 25); do
          python -B "research/contrib/chatgpt/CKAD-$n/independent_audit.py"
        done
        test -z "$(git status --porcelain)"
        cd "$CURRENT_SOURCE"
        git worktree remove "$HISTORY_SOURCE"
        python -B research/contrib/chatgpt/CKAD-26/independent_audit.py
        python -B research/contrib/chatgpt/CKAD-26/audit_negative_controls.py
        test -z "$(git status --porcelain)"
      env:
        EXPECTED_CANDIDATE: ${{ needs.seal.outputs.candidate }}
