name: MH07 original archive — retrospective 256-mask bank census
on:
  push:
    branches: [research/mh07-mixed-bank-archive-20261120]
    paths-ignore:
      - .ice/code-atlas.html
      - .ice/code-atlas.ice
      - .ice/code-atlas.json
permissions:
  contents: read
concurrency:
  group: ygg-mh07-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.seal.outputs.source_sha }}
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify immutable originals, exact source boundary and derived-only index
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/mh07-mixed-bank-archive-20261120
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 08a4cdd5cb5f8a554913acd036d42665d7076a13
          git merge-base --is-ancestor b1aa2e681b0a0d8f9dc5f5dcaa4bc84881449d98 "$GITHUB_SHA"
          git merge-base --is-ancestor 778478247077b92611e099540ae320380832566f "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/itd02_v32e_pair_consensus.rs)" = 85237dcc82905e05a273b11023b5be5db722726e
          test "$(git rev-parse HEAD:research/mh03_checkpoint_bank_readback.py)" = "$(git rev-parse 778478247077b92611e099540ae320380832566f:research/mh03_checkpoint_bank_readback.py)"
          git diff --name-only 778478247077b92611e099540ae320380832566f "$GITHUB_SHA" |
            python -B -c 'import sys; x=set(sys.stdin.read().splitlines()); e={"research/mh07_mixed_bank_archive_protocol.md","research/mh07_mixed_bank_archive.py","research/test_mh07_mixed_bank_archive.py",".github/workflows/qualify-mh07-mixed-bank-archive.yml"}; assert x==e,(x,e)'
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git diff --cached --name-only |
            python -B -c 'import sys; x=set(sys.stdin.read().splitlines()); e={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert x==e,(x,e)'
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(MH07): pin only derived source Atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo MH07_SOURCE_AND_INDEX_CUSTODY_PASS

  retrospective-dual-platform:
    needs: source-atlas
    if: ${{ needs.source-atlas.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve cross-platform LF bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ needs.source-atlas.outputs.final_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact source/derived tree before offline archive analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.source-atlas.outputs.final_sha }}'
          test "$(git rev-parse HEAD^)" = '${{ needs.source-atlas.outputs.source_sha }}'
          test "$(git rev-parse HEAD:research/itd02_v32e_pair_consensus.rs)" = 85237dcc82905e05a273b11023b5be5db722726e
          git diff --name-only HEAD^ HEAD |
            python -B -c 'import sys; x=set(sys.stdin.read().splitlines()); e={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert x==e,(x,e)'
          python -B scripts/build_code_atlas.py --check-if-present
          echo MH07_EXACT_FINAL_SOURCE_CUSTODY_PASS
      - name: Download ONLY the two previously consumed immutable MH05 original artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh
          gh api repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14677697635/zip > "$RUNNER_TEMP/mh05-ubuntu.zip"
          gh api repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14676898689/zip > "$RUNNER_TEMP/mh05-windows.zip"
          echo '6a20b90954bdfac3e6154c9f58819f0a62d4c02b7c95de98bb29f5f44ddc5e32  '$RUNNER_TEMP'/mh05-ubuntu.zip' > "$RUNNER_TEMP/mh07-ubuntu.sha256"
          echo '31bc7889bc94edbf259bbf5385e2e1593ada84b07b602fe86b3c2716fb147a4a  '$RUNNER_TEMP'/mh05-windows.zip' > "$RUNNER_TEMP/mh07-windows.sha256"
          sha256sum -c "$RUNNER_TEMP/mh07-ubuntu.sha256"
          sha256sum -c "$RUNNER_TEMP/mh07-windows.sha256"
          echo "MH07_UBUNTU_ZIP=$RUNNER_TEMP/mh05-ubuntu.zip" >> "$GITHUB_ENV"
          echo "MH07_WINDOWS_ZIP=$RUNNER_TEMP/mh05-windows.zip" >> "$GITHUB_ENV"
          echo MH07_AUTHENTIC_ARCHIVE_ZIP_DIGESTS_PASS
      - name: Focused read-only original checkpoints and negative tamper tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s research -p 'test_mh07_*.py' -v
          echo MH07_ORIGINAL_MASK_PARITY_AND_NEGATIVES_PASS
      - name: Mandatory full inherited root regression on exact final SHA
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B - <<'PY'
          import sys, unittest
          suite=unittest.TestLoader().discover("tests", pattern="test_*.py")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), "MH07_FULL_ROOT_FAIL"
          assert result.testsRun == 139, ("MH07_ROOT_COUNT_DRIFT",result.testsRun)
          if sys.platform == "win32":
              expected={"test_missing_result_rejected","test_mismatched_candidate_id_rejected",
                        "test_existing_roles_learn_from_own_measured_residual_only",
                        "test_separate_native_model_output_and_equal_information_controls"}
              actual={x.id().rsplit(".",1)[-1] for x,why in result.skipped}
              assert actual==expected and all("POSIX" in why for x,why in result.skipped), (actual,expected)
          else:
              assert not result.skipped, ("MH07_LINUX_SKIP",result.skipped)
          print("MH07_FULL_ORIGINAL_ROOT_139_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MH07_EXACT_FINAL_ROOT_REGRESSION_PASS
      - name: Reproduce all 256×10 evaluator-only mask patterns without training
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/mh07_mixed_bank_archive.py             --ubuntu-zip "$MH07_UBUNTU_ZIP"             --windows-zip "$MH07_WINDOWS_ZIP"             --output mh07-retrospective.json
          python -B - <<'PY'
          import json
          r=json.load(open("mh07-retrospective.json"))
          assert r["counts"]=={"original_cohorts":10,"cross_os_original_checkpoints":20,"masks_evaluated_per_cohort":256}
          assert len(r["cohorts"])==10
          assert r["scope"]=="retrospective_evaluator_oracle_only"
          assert not r["scientific_gain_verified"]
          assert not r["native_retrieval_gain_verified"]
          assert not r["protected_original_first_use"]
          print("MH07_RETROSPECTIVE_ORIGINAL_ARCHIVE_RECEIPT_PASS")
          PY
      - name: Preserve bounded deterministic summary; NOT an original model
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mh07-retrospective-${{ matrix.os }}
          path: mh07-retrospective.json
          if-no-files-found: ignore

  cross-host-receipt:
    needs: [source-atlas, retrospective-dual-platform]
    if: ${{ needs.retrospective-dual-platform.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify original reproducible summary is exactly byte-equal between hosts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mh07-ubuntu" "$RUNNER_TEMP/mh07-windows"
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"             -n mh07-retrospective-ubuntu-24.04 -D "$RUNNER_TEMP/mh07-ubuntu"
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"             -n mh07-retrospective-windows-2022 -D "$RUNNER_TEMP/mh07-windows"
          cmp "$RUNNER_TEMP/mh07-ubuntu/mh07-retrospective.json"               "$RUNNER_TEMP/mh07-windows/mh07-retrospective.json"
          sha256sum "$RUNNER_TEMP/mh07-ubuntu/mh07-retrospective.json"                     "$RUNNER_TEMP/mh07-windows/mh07-retrospective.json"
          echo MH07_ORIGINAL_RETROSPECTIVE_DUAL_PLATFORM_BYTE_IDENTITY_PASS
