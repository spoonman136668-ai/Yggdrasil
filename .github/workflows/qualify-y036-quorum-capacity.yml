name: Yggdrasil Y036 frozen quorum-capacity factorial
on:
  push:
    branches: [research/y036-quorum-capacity-factorial-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source-birth and frozen preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 35eace118e16ab8195a6810f2bc6ec569dfd0106 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/execute.py)" = 692e92cf931a2d63b39a618c0044af390984f099
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-quorum-capacity/prereg.json)" = c7d8daf8c043098ec32a8674b7398c2a8afa07fd
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-quorum-capacity/execute.py)" = dce443d23765f314dfa2dda1e08aa3cef3a41bee
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-quorum-capacity/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-quorum-capacity/execute.py
      - name: Original first-use 12-cell quorum capacity science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-quorum-capacity/execute.py > /tmp/Y036-original.json
          python3 -m json.tool /tmp/Y036-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y036-original.json'))
          assert len(x['cells'])==12
          assert x['sealed_heldout_seeds']==list(range(208,224))
          print('CLASSIFICATION',x['classification'])
          for c in x['cells']:
              print('CELL',c['capacity'],c['regime'],c['heldout_churn'],
                    c['quorum_minus_full_churn'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original-quorum-capacity
          path: /tmp/Y036-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One complete Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
