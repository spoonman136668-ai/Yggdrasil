name: Yggdrasil F63C frozen source qualification
on:
  push:
    branches:
      - research/y-f63-public-path-reliability-precode-20261016-r1
permissions:
  contents: read
jobs:
  exact-source:
    if: "${{ github.event.head_commit.message == 'ci(y-f63c): qualify exact frozen source and full regression without FIT' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install pytest pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Pinned source, independent synthetic auditor, one full regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f63c-source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8b3e3001066e69222b77f25d9bd07d149c76dd7a HEAD
          test "$(git hash-object research/foundational/20261016-y-f63c/prereg.json)" = c0e69c1bc0a170646c8ad997efeb154b64ce9862
          test "$(git hash-object research/foundational/20261016-y-f63c/source.py)" = c04b73306861098eecf55db77b2db486aa918819
          test "$(git hash-object research/foundational/20261016-y-f63c/audit_graph.py)" = 24e9f6d89d346eb019e44a51c59349a252cc50e2
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
          test "$(git hash-object research/foundational/20261015-y-f60/source_feasibility.py)" = 123dd7e979485ae07664118f948cd651b0386526
          python -B research/foundational/20261016-y-f63c/qualify_synthetic.py > "$RUNNER_TEMP/y-f63c-source/independent-synthetic-audit.json"
          python -B -m pytest -q > "$RUNNER_TEMP/y-f63c-source/full-regression.txt" 2>&1
          cat "$RUNNER_TEMP/y-f63c-source/full-regression.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f63c-source/exact-head.txt"
          printf 'F63C_SOURCE_QUALIFIED=YES FIT_TRAIN=UNTOUCHED VALIDATE=UNTOUCHED F3=FALSE\n'
          sha256sum "$RUNNER_TEMP/y-f63c-source/"* > "$RUNNER_TEMP/y-f63c-source/hashes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f63c-exact-head-source-qualification
          path: ${{ runner.temp }}/y-f63c-source/
          retention-days: 90
          if-no-files-found: warn
