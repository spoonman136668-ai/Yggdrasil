name: NCI05 ONE-TIME source-free engineering profile
on:
  push:
    branches:
      - research/nci-novel05-adaptive-causal-birth-20261120
    paths:
      - .github/workflows/nci05-engineering-profile-once-20261120.yml

permissions:
  contents: read
concurrency:
  group: nci05-20261120-one-shot-engineering-profile
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  linux_source_checks:
    if: "${{ github.run_attempt == 1 && github.event.head_commit.message == 'research: pin NCI05 one-shot engineering profile G29 atlas' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s research/contrib/chatgpt/NCI-NOVEL-05 -p "test_*.py" -v
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: git diff --exit-code

  windows_source_checks:
    if: "${{ github.run_attempt == 1 && github.event.head_commit.message == 'research: pin NCI05 one-shot engineering profile G29 atlas' }}"
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s research/contrib/chatgpt/NCI-NOVEL-05 -p "test_*.py" -v
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: git diff --exit-code

  bounded_engineering_profile:
    needs: [linux_source_checks, windows_source_checks]
    if: "${{ github.run_attempt == 1 && github.event.head_commit.message == 'research: pin NCI05 one-shot engineering profile G29 atlas' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONPATH: research/contrib/chatgpt/NCI-NOVEL-05
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install frozen numeric environment (source-free synthetic only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Precommit all 21 engineering-only seeds as exposed, including on later timeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import prospective_producer as p
          from receipt_guard import read_verified
          root = Path(os.environ["RUNNER_TEMP"]) / "nci05"
          root.mkdir(parents=True, exist_ok=False)
          source = p.source_identity(p.ARCHIVE)
          worlds = [f"engineering:{s}:{f}" for s in p.ENGINEERING_SEEDS for f in p.FAMILIES]
          assert len(worlds) == len(set(worlds)) == 21
          assert set(p.CONSUMED).isdisjoint(set(p.ENGINEERING_SEEDS))
          assert read_verified(root / "engineering.jsonl", source) == []
          manifest = {
              "schema": "nci05.one-shot-engineering-exposure.v1",
              "source_identity_sha256": source,
              "source_commit": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "all_world_ids_considered_exposed_irrespective_of_outcome": worlds,
              "replay_permitted": False,
              "scientific_first_use": False,
              "native_checkpoint_changed": False
          }
          (root / "all-21-considered-consumed-before-execution.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("NCI05_PREEXECUTION_ALL_21_EXPOSED=TRUE")
          print("NCI05_SOURCE_IDENTITY_SHA256=" + source)
          PY
          python -m pip freeze > "${RUNNER_TEMP}/nci05/pip-freeze.txt"
      - name: Upload immutable pre-execution exposure manifest BEFORE first world
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nci05-preexecution-all-21-${{ github.run_id }}
          path: ${{ runner.temp }}/nci05/
          if-no-files-found: error
          retention-days: 30
      - name: Execute 21 distinct engineering worlds exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import prospective_producer as p
          root = Path(os.environ["RUNNER_TEMP"]) / "nci05"
          ledger = root / "engineering.jsonl"
          source = p.source_identity(p.ARCHIVE)
          exposure = json.loads((root / "all-21-considered-consumed-before-execution.json").read_text())
          assert exposure["source_identity_sha256"] == source
          assert exposure["source_commit"] == os.environ["GITHUB_SHA"]
          attempted = 0
          for seed in p.ENGINEERING_SEEDS:
              for family in p.FAMILIES:
                  attempted += 1
                  digest = p.run_engineering_world(
                      ledger=ledger, archive=p.ARCHIVE, seed=seed, family=family,
                      source_key=source, max_world_seconds=60.0)
                  print(f"NCI05_ENGINEERING_WORLD_COMMITTED {attempted}/21 {seed} {family} {digest}", flush=True)
          budget = p.qualify_budget(
              ledger=ledger, source_key=source, target_worlds=4, budget_seconds=180.0)
          assert budget["worlds_measured"] == 21 and budget["science_executed"] is False
          (root / "budget-180s.json").write_text(
              json.dumps(budget, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("NCI05_ENGINEERING_PROFILE=" + json.dumps(budget, sort_keys=True), flush=True)
          PY
      - name: Preserve receipts, orphan claims, and preflight on both success and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nci05-engineering-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/nci05/
          if-no-files-found: warn
          retention-days: 30
