name: CKAD41-49 archived evidence audit (no scientific first-use)
on:
  push:
    branches:
      - research/ckad41-49-qualification-audit-20261119
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  audit-only:
    if: "github.event.head_commit.message == 'ci(ckad41-49): verify read-only evidence audit'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable cross-platform source rewriting
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify archive parent and static-only audit scripts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e22ec67385cc376ad4e708b19fecf8cb673d5b6c HEAD
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-41-49-AUDIT'); [ast.parse(f.read_text()) for f in p.glob('*.py')]"
      - name: Eight original-source receipts integrity and negative evidence tests
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-41-49-AUDIT -p test_audit.py -v
      - name: Render full read-only machine-verifiable cross-mechanism qualification matrix
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-41-49-AUDIT/run_audit.py
          test -z "$(git status --porcelain)"
