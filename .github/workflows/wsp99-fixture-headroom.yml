name: WSP99 original-free strong-control headroom DEV pilot
on:
  push:
    branches: [research/wsp99-delayed-causal-task-20261114]
permissions:
  contents: read
jobs:
  one-shot-dev-headroom:
    if: "github.event.head_commit.message == 'ci(wsp99): original-free fixture headroom one-shot' && github.run_attempt == 1"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: wsp99-original-free-dev-headroom-one-shot
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned NumPy
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.1.3
      - name: Verify frozen source, original-world custody and fixture mechanics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7d7161b59169d44c32a317dbe028e5666170dd22 HEAD
          git merge-base --is-ancestor 44099f8778d3a2692ba2efa8d699194ae4c809f2 HEAD
          git diff --exit-code a24c6ec7d23e56b6462dcf43cbd4a72256a35ff3 HEAD -- research/contrib/chatgpt/WSP-98
          python research/contrib/chatgpt/WSP-98/admission.py --public-pass
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
          python -m unittest discover -s research/contrib/chatgpt/WSP-99 -p 'test_*.py' -v
          test -z "$(git status --porcelain)"
      - name: Full-budget independent strong-control fit on eight DEV fixture worlds ONLY
        run: python research/contrib/chatgpt/WSP-99/fixture_headroom.py --fixture-only
      - name: Verify no original cohort or source mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -f research/contrib/chatgpt/WSP-99/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-99/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
