name: YDR LU2Q Bound Artifact Open

on:
  push:
    branches: [dg1a-ar]
    paths:
      - research/control/lu2q-bound-open.json

permissions:
  contents: read
  actions: read

jobs:
  open-bound-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "spoonman136668-ai/Yggdrasil"
          test -f research/control/lu2q-bound-open.json

      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ydr-venv
          /tmp/ydr-venv/bin/python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
          /tmp/ydr-venv/bin/python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.10.0

      - name: Download accepted LU2Q duplicate
        uses: actions/download-artifact@v4
        with:
          name: ydr-isolated-36059942474-1
          path: /tmp/lu2q-accepted
          github-token: ${{ github.token }}
          run-id: 36059942474

      - name: Open exact accepted duplicate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lu2q-open
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
          ln -sfn "${GITHUB_WORKSPACE}/research/applications/track-a" /mnt/data/task1_loader_test
          test "$(wc -c < /tmp/lu2q-accepted/primary1.bin)" -eq 209715
          test "$(sha256sum /tmp/lu2q-accepted/primary1.bin | awk '{print $1}')" = "aa69c2f0612d468b355d6dde990ae5782c7e4594bbf795eee9d40589b9a8916f"
          cmp /tmp/lu2q-accepted/primary1.bin /tmp/lu2q-accepted/primary2.bin
          /tmp/ydr-venv/bin/python research/applications/track-a/lu2q_task3_exact_parent_feasibility_v1.py \
            open /tmp/lu2q-accepted/primary1.bin /tmp/lu2q-accepted/primary2.bin /tmp/lu2q-open/qualification.json
          cat /tmp/lu2q-open/qualification.json

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: lu2q-bound-open-${{ github.run_id }}
          path: /tmp/lu2q-open/**
          if-no-files-found: error
          retention-days: 14
