name: ITD-02 V13 source-public context capacity feasibility
on:
  push:
    branches:
      - research/itd02-v13-context-identity-feasibility-20261028
permissions:
  contents: read
jobs:
  frozen-public-context-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve repository source bytes on either OS
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact immutable pushed audit tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert original V12 model is unchanged and prereg predates audit
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 61786dc802e8a646ca623121ab02b33ebab05909 "$GITHUB_SHA"
          git merge-base --is-ancestor 427a5ec5c92f1f18667842ba7c7b7837c3ab914c "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run source-free frozen bridge context-capacity audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v13-context"
          PYTHONPATH=. python -B research/itd02_v13_context_identity_audit.py > "$RUNNER_TEMP/v13-context/audit.json"
          python - "$RUNNER_TEMP/v13-context/audit.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["source_only"] is True
          assert x["learner_parameters_modified"] is False
          assert x["original_world_training"] is False
          assert x["scientific_first_use"] is False
          assert x["legal_public_two_step_contexts"] == 36
          assert x["distinct_v12_full_context_codes"] == 15
          assert x["aliased_contexts"] == 21
          assert x["classification"] == "V12_CONTEXT_NONIDENTIFIABLE__NO_SCIENCE"
          assert x["example_collisions"]
          print("ITD02_V13_V12_CONTEXT_ALIAS_FROZEN_SOURCE_GATE_PASS_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v13-context/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve read-only per-host capacity audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v13-context-capacity-${{ matrix.os }}
          path: ${{ runner.temp }}/v13-context/audit.json
          if-no-files-found: warn
          retention-days: 7
