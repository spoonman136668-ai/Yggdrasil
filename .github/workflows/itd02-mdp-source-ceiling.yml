name: ITD02 original MDP source-only action ceiling
on:
  push:
    branches: [research/itd02-mdp-source-ceiling-screen-20261025]
    paths:
      - 'research/native/itd02/mdp_source_ceiling/**'
      - '.github/workflows/itd02-mdp-source-ceiling.yml'
permissions:
  contents: read
concurrency:
  group: ygg-itd02-mdp-exact-source-ceiling-20261025
  cancel-in-progress: false
jobs:
  upstream-source-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ygg
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: upstream
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original upstream source and prereg born first
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 'c94e9a4cd3641588b6b8507e71ccee5c27032bdf'
          test "$(git -C upstream rev-parse HEAD:causal_gym/envs/mdp.py)" = '6264ec5450754c009e98c3e85f6d5927ece0a9ab'
          test "$(git -C upstream rev-parse HEAD:causal_gym/core/pch.py)" = 'ff37780c6b791877c70583b8d5f699be7fcd8817'
          test "$(git -C upstream rev-parse HEAD:causal_gym/core/task.py)" = '668262f3f5c88fa2865b08ef10bbf96b09a3b73e'
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/mdp_source_ceiling/PREREG.json)" = '45b47e4a3d4c1d9994154943937e5ff8d7eabfa9'
          test "$(git -C ygg rev-parse HEAD:research/native/itd02/mdp_source_ceiling/source_ceiling.py)" = '3ef66bc47edf2a38b06156c8529fbc9c4922be5a'
          python -B - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('ygg/research/native/itd02/mdp_source_ceiling/PREREG.json').read_text())
          assert p["status"]=="FROZEN_PRIOR_TO_CODE_AND_HOSTED_EXECUTION"
          assert p["upstream_commit"]=="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          assert p["authorized_interactive_episodes"]==0 and p["source_import_executions"]==0
          assert p["scientific_go"] is False and p["protected_first_use"] is False
          PY
      - name: Derive exact upstream action-reward ceiling without source import
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B ygg/research/native/itd02/mdp_source_ceiling/source_ceiling.py upstream
          test -z "$(git -C upstream status --porcelain --untracked-files=all)"
          test -z "$(git -C ygg status --porcelain --untracked-files=all)"
          echo ITD02_EXTERNAL_SOURCE_RESET_STEP_EPISODES=0
          echo ITD02_MDP_SCENTIFIC_FIRST_USE=FALSE
