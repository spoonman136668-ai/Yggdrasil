name: ITD-02 V36 public information sufficiency versus native action-rank witness
on:
  push:
    branches:
      - research/itd02-v36-public-identifiability-rank-20261028
permissions:
  contents: read
jobs:
  v36-public-rank:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact-source cross-host newline mode
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact SHA checkout without saved Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen chronology and original V35/native source bytes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d207cdc06ae1db303392dacfc42e4b0ac4686931 "$GITHUB_SHA"
          git merge-base --is-ancestor 0360ed2f871afdacace182cfba8300ccfeacad85 "$GITHUB_SHA"
          git merge-base --is-ancestor a4c5c5436211273864af6a60c238680445430e85 "$GITHUB_SHA"
          git merge-base --is-ancestor 95e4a2b2eed79f2784896ba113a0c5868385fe02 "$GITHUB_SHA"
          git merge-base --is-ancestor 4e86f2f9b41beee0637db3b8103b1f3c44dfbe4f "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object yggdrasil/itd02_v26_calibrated_return_dev.py)" = 8a0417d34c6ba94a4eaef33d767da14a4a5c9709
          test "$(git hash-object yggdrasil/itd02_v30_public_probe_policy_dev.py)" = bcc1f0b4e2ec0fcd8b2af69dfb0e6d4d2ca27a4a
          test "$(git hash-object yggdrasil/itd02_v32_source_surprise_probation_dev.py)" = 9252b554c25bfdc5b6adb733f94b0c3d2b2ec92e
          test "$(git hash-object yggdrasil/itd02_v35_action_conditioned_ring_dev.py)" = 04c21dc35054e98bc1a366af7c962983e64ef02d
          test "$(git hash-object research/itd02_v35_action_conditioned_local_basis_audit.py)" = 2a2b6ae3d5482d2735ca9afd15fab7353b7f0134
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: V36 lawful completion and true selected-information focused tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v36_public_identifiability_rank.py' -v
          echo V36_FOCUSED_PUBLIC_ONLY_SAFETY_PASS_NOT_SCIENCE
      - name: Nine exact V35 legal feedback sequences and fully frozen rank diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v36"
          if ! PYTHONPATH=. python -B research/itd02_v36_public_identifiability_rank_audit.py > "$RUNNER_TEMP/v36/evidence.json" 2> "$RUNNER_TEMP/v36/stderr.log"; then
            cat "$RUNNER_TEMP/v36/stderr.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v36/evidence.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="ygg.itd02.v36.finite_identifiability_vs_native_rank.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["new_native_model"] and not d["original_source_modified"]
          assert not d["unknown_world_information_sufficiency_claim"]
          assert d["worlds"]==["D1","D2","D3"]
          assert d["modes"]==["v35_novelty","v22_shared_novelty","rls_novelty"]
          assert d["independent_arms"]==9 and len(d["arm_records"])==9
          assert d["original_source_training_feedback"]==576
          assert d["base_public_feedback"]==12 and d["extra_selected_feedback"]==3
          assert d["native_trainable_scalars"]==163
          assert d["original_v35_outcomes_unmodified"]
          assert len(d["canonical_selected_information_and_rank_sha256"])==64
          assert all(r["never_selected_cases"]>=21 and
                     r["low_high_optimal_disagreements"]>=0 and
                     r["score_coordinate_changes"]>=0 and r["score_coordinate_changes"]<=36 and
                     r["action_rank_changes"]>=0 and r["action_rank_changes"]<=12 and
                     (r["checkpoint_bytes"] is None or r["checkpoint_bytes"]<=12288)
                     for r in d["arm_records"])
          assert d["classification"] in {
             "V36_FIXED_TOY_FAMILY_NOT_IDENTIFIABLE__NO_SCIENCE",
             "V36_PUBLIC_INFORMATION_VS_NATIVE_RANK_MISMATCH__NO_SCIENCE",
             "V36_MIXED_PUBLIC_INFORMATION_RANK_DIAGNOSTIC__NO_SCIENCE",
             "V36_INFORMATION_BOUNDARY_NOT_CONCLUSIVE__NO_SCIENCE"}
          print("V36_CLASSIFICATION",d["classification"])
          print("V36_CANONICAL_PUBLIC_RANK_SHA",d["canonical_selected_information_and_rank_sha256"])
          print("V36_PREDECLARED_INFORMATION_GATES",json.dumps(d["predeclared_gates"],sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Original V35 through V22 inherited focused regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v35_action_conditioned_local_basis.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v34_local_credit_spillover.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v33_unseen_family_independent_controls.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v32_source_surprise_probation.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_credit_readout_attribution.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v30_public_probe_policy.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v29_observational_equivalence.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V36_ORIGINAL_NATIVE_INHERITED_SAFETY_PASS_NOT_SCIENCE
      - name: Retain V36 per-host evidence/error logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v36-public-rank-${{ matrix.os }}
          path: ${{ runner.temp }}/v36/*
          retention-days: 7
          if-no-files-found: warn
