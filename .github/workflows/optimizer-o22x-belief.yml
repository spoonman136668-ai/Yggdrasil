name: Optimizer O22-X original-source compositional belief preflight
on:
  push:
    branches:
      - research/optimizer-o22x-compositional-belief-20261025
  pull_request:
    paths:
      - research/optimizer_o22x/**
      - .github/workflows/optimizer-o22x-belief.yml
permissions:
  contents: read
  actions: read
jobs:
  native-public-source-belief-units:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Freeze source and original owner native identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 743a50b26035c14de3c97d9253db441850e85424 HEAD
          git merge-base --is-ancestor 4ac0f5b22857fdf78363955ae713597d7b6cfa87 HEAD
          git merge-base --is-ancestor e9ea7465446e46ed40ff0f5521a37de44a7cc0f6 HEAD
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = '3aa22b1e418a7f8cd9619c476f02b8c614917b16'
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = '5348238f4ec2183bea29262659883391b5f429fd'
          python -B -c "import json; p=json.load(open('research/optimizer_o22x/PREREG.json')); assert p['governance']['source_original_new_reset_or_step_count']==0 and p['governance']['FSA_83_protected_not_authorized'] is True"
          echo O22X_SOURCE_FIRST_ORIGINAL_OWNER_UNCHANGED=PASS
      - name: Seven original R1 public two-step belief/source grammar and fresh OS cold checks
        run: python -B -m unittest -v research.optimizer_o22x.test_transition_belief
  immutable-original-matched-pairs-only:
    needs: native-public-source-belief-units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch ONLY authenticated previous original C35 physical-action evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/optimizer-o22x"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12603145885/zip" \
            --output "$RUNNER_TEMP/optimizer-o22x/original-C35.zip"
          python -B -c "import hashlib,json,os,pathlib; p=json.load(open('research/optimizer_o22x/PREREG.json')); f=pathlib.Path(os.environ['RUNNER_TEMP'])/'optimizer-o22x/original-C35.zip'; assert hashlib.sha256(f.read_bytes()).hexdigest()==p['original_C35_actions']['zip_sha256']"
          echo O22X_IMMUTABLE_NINE_ACTUAL_ORIGINAL_PHYSICAL_FORKS=PASS
      - name: Genuine selected-action transition learning and self-composed two-step original-source predictions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.optimizer_o22x.evaluate \
            --source-zip "$RUNNER_TEMP/optimizer-o22x/original-C35.zip" \
            --out "$RUNNER_TEMP/optimizer-o22x/comparison.json"
          python -B -m json.tool "$RUNNER_TEMP/optimizer-o22x/comparison.json"
      - name: Archive full native/conventional source-only compositional audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22x-original-source-public-belief-composition
          path: ${{ runner.temp }}/optimizer-o22x/comparison.json
          if-no-files-found: warn
          retention-days: 80
