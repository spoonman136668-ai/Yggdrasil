name: CKAD28 reward-directed causal intervention acquisition
on:
  push:
    branches: [research/ckad28-decision-relevance-20261118]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  focused:
    if: "github.event.head_commit.message == 'ci(ckad28): execute frozen decision-relevance study'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned native CPU solver dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Verify frozen protocol, exact native algorithm, independent shadow monitors and negative controls
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6f6a50fbf53cbc1e6dd317d896c25caa081b24d6 HEAD
          git merge-base --is-ancestor 43a468dea22b19498329e386aa0af0abecc3100b HEAD
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/prereg.json)" = 86b55b600647f77f0408072219f14319b5b5ea56
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/campaign.py)" = eb43a23c6521b743ced219af04cd94c5f87d7895
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/policy.py)" = 017265f9ddf5115b7826b448ee395a6e417ed750
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/test_ckad28_audit.py)" = 0aebcd223c0f409e8d72d58eb24726ccc54b07bd
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/audit.py)" = d352dddf1fbb1ce8673262ea9e5a620cf9b5baa3
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/test_ckad28.py)" = 22bf26aa6c48653c1e7015d8fd017e1d0e2b3dca
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/seal.py)" = 6f4baa489c563fd00fbac5e89c3553456ebe8e8a
          test "$(git hash-object research/contrib/chatgpt/CKAD-28/independent_audit.py)" = 3e586defe73299e860ec61435c4e225430820a28
          test "$(git hash-object yggdrasil/native_episode_experience.py)" = 94b7e033aff18080e65d48b479a7ae4bb3aba1c8
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-23 -p test_ckad23.py -v
          python -B -m unittest discover -s tests -p test_native_cumulative_learner.py -v
          python -B research/contrib/chatgpt/CKAD-22/independent_audit.py
          test -z "$(git status --porcelain)"
  development:
    needs: [focused]
    if: github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        schedule: [reward_change, stationary_null]
        seed: [101, 202, 303]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 24
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute bounded matched public-action causal intervention acquisition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-28/campaign.py \
            --scenario ${{ matrix.schedule }} --seed ${{ matrix.seed }} \
            --output-directory "$RUNNER_TEMP/ckad28-case"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ckad28-${{ matrix.os }}-${{ matrix.schedule }}-${{ matrix.seed }}-proof
          path: ${{ runner.temp }}/ckad28-case/
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [development]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ckad28-*-proof
          path: ${{ runner.temp }}/ckad28-all
          merge-multiple: false
      - name: Independently seal all 12 cross-OS sources and 18 native checkpoints
        id: seal
        env:
          CKAD28_ARTIFACT_ROOT: ${{ runner.temp }}/ckad28-all
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-28/seal.py
          git add -- research/contrib/chatgpt/CKAD-28
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ckad28): seal decision-relevance and null results without promotion'
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE_COMMIT"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git commit -m "docs(ckad28): qualify frozen decision-relevance source atlas at $SOURCE_COMMIT"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad28-decision-relevance-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned complete native regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory full exact-candidate regression, all nine cold native checkpoint proofs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/CKAD-22/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-28/independent_audit.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-g29:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent G29 atlas, CKAD22 parent and reward evidence replay
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CKAD-22/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-28/independent_audit.py
          test -z "$(git status --porcelain)"
