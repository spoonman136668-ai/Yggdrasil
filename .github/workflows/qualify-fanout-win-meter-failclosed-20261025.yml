name: Fanout resource-meter portability fail-closed qualification
on:
  push:
    branches: [repair/free-fanout-win-meter-failclosed-20261025]
    paths:
      - '.github/workflows/qualify-fanout-win-meter-failclosed-20261025.yml'
      - 'scripts/free_fanout_sidecar.py'
      - 'tests/test_free_fanout_sidecar.py'
permissions:
  contents: read
concurrency:
  group: ygg-sourceonly-free-fanout-win-meter-20261025
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify untouched R7 frozen evidence and the isolated sidecar patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 'be0db27807d7f4ad5ccc19a81b183a26d4ae51e3' HEAD
          test "$(git rev-parse HEAD:scripts/free_fanout_sidecar.py)" = 'f05187381cf3bfbe17415c6d9bfeb586ea949b87'
          test "$(git rev-parse HEAD:tests/test_free_fanout_sidecar.py)" = '02420c11adc35645c68a52d4ef41f4a71af249c2'
          test "$(git rev-parse HEAD:research/native/itd01/r7/native_cells.py)" = '4c492a494ac5b25d5e9c49b98185be6a2c966b2f'
          test "$(git rev-parse HEAD:research/native/itd02/r7/PREREG.json)" = '90def4fb42537a214c8aaa6f3ac14b2858498de7'
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = '204ecd993b954b23e66d6d1e8b3568e7c93183c5'
          test "$(git diff --name-only 'be0db27807d7f4ad5ccc19a81b183a26d4ae51e3' HEAD | grep -v '^.github/workflows/qualify-fanout-win-meter-failclosed-20261025.yml$' | grep -v '^scripts/free_fanout_sidecar.py$' | grep -v '^tests/test_free_fanout_sidecar.py$' | wc -l)" -eq 0
      - name: Original manifest and runtime guards plus Windows no-meter negative
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/free_fanout_sidecar.py tests/test_free_fanout_sidecar.py
          python -B -m unittest discover -s tests -p 'test_free_fanout_sidecar.py' -v
          python -B -m unittest discover -s tests -p 'test_portable_checkpoint.py' -v
          echo FANOUT_SOURCEONLY_WINDOWS_IMPORT_SAFE=PASS
          echo FANOUT_UNMETERED_WINDOWS_CANDIDATE_EXECUTION=DENIED
          echo FANOUT_PROTECTED_FIT_CHECK_DEV_CONSUMED=0
          echo FANOUT_SCIENTIFIC_GO=FALSE
      - name: Source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
  frozen-source-atlas-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Emit original G29 outputs for current SOURCE commit only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --emit-base64 --source-commit "$(git rev-parse HEAD)"
          echo FANOUT_ATLAS_EMITTED_WITHOUT_WRITING_OR_MUTATING=TRUE
          test -z "$(git status --porcelain --untracked-files=all)"
