name: WSP-200 Source-Free Full Regression
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-200/**'
      - '.github/workflows/wsp200-source-free-regression.yml'
permissions:
  contents: read
jobs:
  source-free-regression:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python --version
      - name: Full repository regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: WSP-200 source-free behavioral regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-200 -p test_learner.py -v
      - name: Fabricated-only multistage controls diagnostic
        run: python research/contrib/chatgpt/WSP-200/source_free_diagnostic.py
      - name: Pinned source-atlas validation
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Confirm tracked source remains unchanged
        run: git diff --exit-code
