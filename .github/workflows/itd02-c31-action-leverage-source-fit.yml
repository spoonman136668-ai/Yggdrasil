name: ITD-02 C31 original native R3 selected-effect action-choice gate
on:
  push:
    branches:
      - research/itd02-c31-selected-effect-action-bridge-20261025
permissions:
  contents: read
  actions: read
concurrency:
  group: itd02-c31-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-r3-policy-preflight:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original source and prereg-first identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6661c86d448563dc03ea7bcf2c151ab3b321acef "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = "3aa22b1e418a7f8cd9619c476f02b8c614917b16"
          test "$(git hash-object research/mass_r7c28/PREREG.json)" = "$(git rev-parse 955465676893e18d673ccb804f27e7c04160bdc3:research/mass_r7c28/PREREG.json)"
          python -m py_compile research/mass_r7c31/action_bridge.py research/mass_r7c31/run.py research/mass_r7c31/test_action_bridge.py
          echo "C31_FROZEN_ORIGINAL_R3_AND_FIT_IDENTITY=PASS"
      - name: Focused legal source action decision gate
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest research.mass_r7c31.test_action_bridge -v
          echo "C31_SOURCE_ONLY_ACTION_BRIDGE_UNIT=PASS"
          echo "C31_ORIGINAL_ENV_IMPORT_RESET_STEP=0"
          echo "C31_PROTECTED_FIRST_USE=DENIED"
  source-fit-action-proposals:
    needs: [bounded-r3-policy-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_ARTIFACT_ID: '12596362847'
      GH_SOURCE_ZIP_SHA: '2e0492af74cd68f8fc9ee7d5cfffcc6a936614e23f9061457f70dcd49cf84810'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Retrieve only prior immutable physical source FIT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c31-original-fit"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/c31-immutable.zip" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/$GH_ARTIFACT_ID/zip"
          echo "$GH_SOURCE_ZIP_SHA  $RUNNER_TEMP/c31-immutable.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c31-immutable.zip" -d "$RUNNER_TEMP/c31-original-fit"
          python -B -m research.mass_r7c28.compare "$RUNNER_TEMP/c31-original-fit"
          echo "C31_REAL_ORIGINAL_FIT_805_ACTIONS_CUSTODY=PASS"
      - name: Replay genuine source FIT public histories without taking invented actions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.mass_r7c31.run --original-fit-dir "$RUNNER_TEMP/c31-original-fit" --out-dir "$RUNNER_TEMP/c31-results"
          echo "C31_NEW_SOURCE_WORLD_ACTIONS=ZERO"
          echo "C31_PROTECTED_FSA_FIRST_USE=DENIED"
      - name: Preserve complete source-state proposal and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-c31-real-fit-public-policy-choice-leverage
          path: ${{ runner.temp }}/c31-results/
          if-no-files-found: warn
          retention-days: 80
