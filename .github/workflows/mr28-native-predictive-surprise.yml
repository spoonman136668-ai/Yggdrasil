name: MR28 Original Native Predictive Surprise Compression
on:
  push:
    branches:
      - research/mr28-predictive-bottleneck-20261021
  pull_request:
    branches:
      - research/mr27-natural-causal-memory-20261021
permissions:
  contents: read
concurrency:
  group: mr28-native-surprise-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-compression-vs-conventional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Source byte identity on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Yggdrasil exact MR28 candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original independent Farama source exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact upstream native source and license discrepancy
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install existing pinned original native dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Train and prospectively evaluate native predictive surprise compression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr28.probe_native_surprise ../external/minigrid | tee ../mr28-actual-receipt.log
          grep -q '^MR28_ORIGINAL_NATIVE_SURPRISE_COMPRESSION=' ../mr28-actual-receipt.log
      - name: Original and project source both unchanged by native execution
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C external/minigrid status --porcelain)"
