name: Mass R7-C30 original DoorKey native R11 learned effect vs conventional FIT
on:
  push:
    branches:
      - research/mass-r7c30-authentic-learned-effects-20261025
permissions:
  contents: read
concurrency:
  group: mass-r7c30-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-fit-public-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OWNER_R11_ROOT: ${{ github.workspace }}/owner-r11
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: research
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/Yggdrasil
          ref: 56e0c14393b8a7ddee479dbee6779f092f33267d
          path: owner-r11
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify frozen original source and owner public action contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$GITHUB_SHA"
          git -C research merge-base --is-ancestor 57016113ed42a928150d609640f5e038653410c7 "$GITHUB_SHA"
          test "$(git -C external/minigrid rev-parse HEAD)" = "7f5853792ea7f04f75614661006d87fcf949f26d"
          test "$(git -C external/minigrid hash-object minigrid/envs/doorkey.py)" = "df5b29ef063be34e6d83b8b478e092c6e3e01512"
          test "$(git -C owner-r10 rev-parse HEAD)" = "56e0c14393b8a7ddee479dbee6779f092f33267d"
          test "$(git -C owner-r10 hash-object research/native/itd02/r10/public_adapter.py)" = "3917d36ce9f86a2c1b998a0a2f93fb27674a9205"
          python -m py_compile research/research/mass_r7c30/run.py research/research/mass_r7c30/control.py research/research/mass_r7c30/compare.py
          echo 'R7C30_ORIGINAL_SOURCE_OWNER_R11_IDENTITY=PASS'
      - name: Install exact original upstream MiniGrid
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./external/minigrid
      - name: Original R10/R11 source-only focused public learning checks
        shell: bash
        working-directory: owner-r10
        run: |
          set -euo pipefail
          python -B -m unittest research.native.itd02.r10.test_public_adapter -q
          python -B -m unittest research.native.itd02.r11.test_affordance_cells -q
          echo 'R7C30_OWNER_R10_R11_SOURCE_ONLY=PASS'
      - name: Two independent native selected-FIT training and sealed validation runs
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mass-r7c30-evidence"
          for rep in 1 2; do
            python -B research/mass_r7c30/run.py "$RUNNER_TEMP/mass-r7c30-evidence/run-$rep.json"
          done
          python -B research/mass_r7c30/compare.py "$RUNNER_TEMP/mass-r7c30-evidence"
      - name: Preserve complete verified FIT receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mass-r7c30-original-doorkey-public-seven-action-fit
          path: ${{ runner.temp }}/mass-r7c30-evidence/
          if-no-files-found: warn
          retention-days: 80
