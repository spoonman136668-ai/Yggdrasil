name: YNCA05 source-locked G29 atlas export
on:
  push:
    branches:
      - research/ynca05-identifiability-ceiling-20261118
    paths:
      - .github/workflows/ynca05-atlas-export.yml
permissions:
  contents: read
jobs:
  generated-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preserve byte-stable source checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate exactly three source-indexed companion files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python - <<'PY'
          import subprocess,json,os
          d=json.load(open('.ice/code-atlas.json',encoding='utf-8'))
          assert d['source_commit']==os.environ['GITHUB_SHA']
          paths=sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert paths==['.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'],paths
          print('YNCA05_ATLAS_ONLY_PASS',d['counts'])
          PY
      - name: Export deterministic sidecars as bounded log chunks
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,pathlib
          for name in ('.ice/code-atlas.json','.ice/code-atlas.html','.ice/code-atlas.ice'):
              blob=pathlib.Path(name).read_bytes()
              print('YNCA05_ATLAS_BEGIN',name,len(blob),hashlib.sha256(blob).hexdigest())
              encoded=base64.b64encode(blob).decode('ascii')
              for i in range(0,len(encoded),2048):
                  print('YNCA05_ATLAS_CHUNK',name,i//2048,encoded[i:i+2048])
              print('YNCA05_ATLAS_END',name,len(encoded))
          PY
      - name: Upload sidecars without source mutations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynca05-exact-source-generated-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: error
          retention-days: 30
