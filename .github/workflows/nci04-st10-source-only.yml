name: NCI04 ST10 source-only adaptive intervention contract
on:
  push:
    branches: [research/nci04-st10-evidence-gated-probes-20261118]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    timeout-minutes: 18
    steps:
      - name: Preserve source line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert frozen ST9 immutable source and parent lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a2e697cddd1c5a494880401c4e7beffe72158d0a HEAD
          test "$(git rev-parse HEAD:research/nci04_st9/native_repair.py)" = 8409f7e3352aabb6a5937a6a7443f2dc4a82f07a
          test "$(git rev-parse HEAD:research/nci04_st9/private_world.py)" = d1bdf67503bd797d79386406820679b70403e8bb
          test "$(git rev-parse HEAD:research/nci04_st9/frozen_protocol.json)" = 9ad8bc15e8dd8b0757c8db13772de23c57d2f3cf
      - name: Source-only ST10 and inherited ST9 native mechanical negatives
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st10_adaptive_actor.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04_st9_native_repair.py' -v
          echo NCI04_ST10_SOURCE_ONLY_FOCUSED=PASS
      - name: Assert no checkout modifications
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
