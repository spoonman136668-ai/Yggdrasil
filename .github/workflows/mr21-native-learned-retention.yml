name: MR21 Original Native Learned Retention
on:
  push:
    branches:
      - research/mr21-learned-retention-utility-20261021
  pull_request:
    branches:
      - research/mr20-native-state-necessity-20261021
permissions:
  contents: read
concurrency:
  group: mr21-native-selection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-learned-selection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve Git source bytes on Windows before all checkout steps
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Yggdrasil source pinned branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original independently authored Farama native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.11 original source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original external Git blob and upstream license verification
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install pinned third-party original native runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Real MiniGrid native learned-write/fixed-write/recurrent development comparison
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cd yggdrasil
          python -B -m research.mr21.probe_native_retention ../external/minigrid
      - name: Original independent and project source Git checkouts unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C external/minigrid status --porcelain)"
