name: CKAD10 native pair source-free qualification
on:
  push:
    branches: [research/ckad10-native-paired-edit-20261117]
permissions:
  contents: read
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Preserve source bytes (Windows LF integrity)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prerequisite and unchanged historical experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 7f3c603068f5bf397b79fae37c9c6518405bbcce^)" = "17919374b8d731fc7be7ea56117fecd14df879c1"
          test "$(git diff-tree --no-commit-id --name-only -r 7f3c603068f5bf397b79fae37c9c6518405bbcce)" = "research/contrib/chatgpt/CKAD-10/prereg.json"
          git merge-base --is-ancestor 7f3c603068f5bf397b79fae37c9c6518405bbcce HEAD
          git diff --exit-code 7f3c603068f5bf397b79fae37c9c6518405bbcce HEAD -- research/contrib/chatgpt/CKAD-10/prereg.json
          git diff --exit-code 17919374b8d731fc7be7ea56117fecd14df879c1 HEAD -- yggdrasil/native_prior_hypothesis.py research/contrib/chatgpt/CKAD-09
          test ! -e research/contrib/chatgpt/CKAD-10/source.py
          test ! -e research/contrib/chatgpt/CKAD-10/result.json
          test -z "$(git status --porcelain)"
      - name: Fabricated native pair fit, isolation, cold memory and negatives
        run: python -B -m unittest discover -s tests -p test_native_pair_hypothesis.py -v
      - name: Checkout clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(ckad10): source-pin G29 atlas' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: ckad10-source-atlas-once
      cancel-in-progress: false
    steps:
      - name: Preserve source bytes (Windows LF integrity)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin the three source-derived atlas outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(ckad10): pin G29 source atlas at $GITHUB_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad10-native-paired-edit-20261117

  final-regression:
    needs: [preflight]
    if: "startsWith(github.event.head_commit.message, 'docs(ckad10): pin G29 source atlas at ') && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Preserve source bytes (Windows LF integrity)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact original freeze and atlas identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 7f3c603068f5bf397b79fae37c9c6518405bbcce HEAD -- research/contrib/chatgpt/CKAD-10/prereg.json
          git diff --exit-code 17919374b8d731fc7be7ea56117fecd14df879c1 HEAD -- yggdrasil/native_prior_hypothesis.py research/contrib/chatgpt/CKAD-09
          test ! -e research/contrib/chatgpt/CKAD-10/result.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Full inherited root/NKR05 regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          if [ -d research/contrib/chatgpt/NKR-05 ]; then python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v; fi
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
