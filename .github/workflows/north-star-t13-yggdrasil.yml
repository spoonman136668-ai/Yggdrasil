name: T13 yggdrasil causal sufficiency source-only qualification
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t13-yggdrasil.yml']
permissions:
  contents: read
concurrency:
  group: northstar-t13-yggdrasil-single-frozen-source
  cancel-in-progress: false
jobs:
  focused-source-identity-and-causal-research:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact preimplementation freeze and baseline source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T13_GIT_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t13-freeze.json').Trim() -cne '537886bd1d4ad0302a5df7e5d0fa5940359e3dce'){throw 'T13_PREREG_BLOB_DRIFT'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-yggdrasil-t13-freeze.json').Trim() -cne 'c376cbff2881cc7d635232fed00dbab32b4c6738'){throw 'T13_FREEZE_NOT_FIRST'}
          git merge-base --is-ancestor c376cbff2881cc7d635232fed00dbab32b4c6738 HEAD
          if($LASTEXITCODE -ne 0){throw 'T13_PRECODE_FREEZE_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t13-mechanism.py').Trim() -cne '441057cf461a6c8a684b090cc5d495dc82aecabb'){throw 'T13_SOURCE_CODE_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-yggdrasil-t12-mechanism.py').Trim() -cne '18a42a9b79d99c751a436d72803fd9cd6d28cd88'){throw 'T13_T12_FROZEN_CONTROL_DRIFT'}
          Write-Output 'T13_YGGDRASIL_SOURCE_IDENTITY_AND_FIRST_FREEZE=PASS'
      - name: Run new source-only causal mechanism and resource comparison
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261019-yggdrasil-t13-mechanism.py' | Tee-Object 't13-yggdrasil-original.json'
          if($LASTEXITCODE -ne 0){throw 'T13_YGGDRASIL_SOURCE_OR_MECHANISM_FAILED'}
          $d=Get-Content 't13-yggdrasil-original.json' -Raw | ConvertFrom-Json
          if($d.'first_use_protected_or_consumed_source_used' -ne $false -and $d.'first_use_protected_or_consumed_source_used' -ne 0){throw 'T13_PROTECTED_SOURCE_OR_REPLAY'}
          if($d.'scientific_transfer_accepted' -ne $false){throw 'T13_SCIENCE_PROMOTION_UNAUTHORIZED'}
          Write-Output 'T13_YGGDRASIL_NONPROTECTED_ENGINEERING=PASS'
          Write-Output 'T13_YGGDRASIL_INDEPENDENT_SCIENCE_ADMISSION=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t13-yggdrasil-source-original-${{ matrix.os }}-${{ github.sha }}
          path: t13-yggdrasil-original.json
          retention-days: 90
          if-no-files-found: warn
