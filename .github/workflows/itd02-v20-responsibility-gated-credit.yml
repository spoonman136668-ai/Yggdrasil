name: ITD-02 V20 responsibility-gated causal credit source-only
on:
  push:
    branches:
      - research/itd02-v20-responsibility-gated-local-credit-20261028
permissions:
  contents: read
jobs:
  v20-local-credit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact source content across operating systems
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout immutable exact pushed tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg ancestry and original model and V18 source exact pins
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fb3dc5b2f563081a802267e8e7c39f52ccb6f3a3 "$GITHUB_SHA"
          git merge-base --is-ancestor d170d628e8ba6d97f236d9e8aeb9ccfbf6abf515 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v18_intermediate_plasticity_dev.py)" = 711391944be7bd94f1898005d1233bfe52a6f216
          test "$(git hash-object research/itd02_v18_intermediate_plasticity_audit.py)" = 7a8f361ff13cf75f716c544add192c2ff9c5aae9
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exact V20 local gradient, freeze, checkpoint and isolation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v20"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v20_responsibility_gated_credit.py' -v > "$RUNNER_TEMP/v20/focused.log" 2>&1
          cat "$RUNNER_TEMP/v20/focused.log"
          echo "ITD02_V20_SOURCE_ONLY_LOCAL_ELIGIBILITY_INTEGRITY_PASS"
      - name: Source-only 72-fold matched V20 against strong controls
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v20_responsibility_gated_audit.py > "$RUNNER_TEMP/v20/audit.json"
          python - "$RUNNER_TEMP/v20/audit.json" <<'PY'
          import json,math,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["schema"]=="ygg.itd02.v20.responsibility_gated_comparative.source_only.v1"
          assert x["source_only"] and not x["scientific_first_use"]
          assert not x["original_world_training"] and x["original_native_and_memory_unchanged"]
          assert x["original_native_ring_cells"]==8
          assert x["seven_fixed_public_tag_channels"]==7
          assert x["candidate_learned_scalars"]==x["original_v18_learned_scalars"]==116
          assert x["heldout_public_histories_per_family"]==36
          assert x["training_updates_per_fold_per_arm"]==560
          assert x["synthetic_families"]==2
          c=x["causal_derivative_witness"]
          assert c["first_event_no_gain_update_cases"]==72
          assert c["zero_initial_head_sensitivity_cases"]==72
          assert c["finite_difference_nonzero_matching_coordinates"]>=12
          assert c["finite_difference_matching_coordinates"]>=12
          assert x["max_checkpoint_bytes"]<=8192
          assert x["forward_edge_scalar_messages"]>0 and x["reverse_credit_scalar_messages"]>0
          for family in ("additive","nonadditive"):
              assert set(x["matched_heldout_absolute_error"][family])=={
                  "v20_responsibility","v18_plastic","v18_frozen",
                  "v17_additive","strong_public_interaction_ridge",
                  "v20_same_weights_initial_gain_ablation"}
              assert all(math.isfinite(v) and v>=0 for v in x["matched_heldout_absolute_error"][family].values())
          assert x["classification"] in {
              "V20_CAUSAL_CREDIT_STRUCTURAL_PASS_NO_TRANSFER_GAIN__NO_SCIENCE",
              "V20_LOCAL_CREDIT_TOY_GAIN_CONTROL_NOT_BEATEN__NO_SCIENCE",
              "V20_LOCAL_CREDIT_TOY_BENEFIT__NO_SCIENCE"}
          print("ITD02_V20_MATCHED_LOCAL_CAUSAL_CREDIT_GATE_COMPLETE_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v20/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: One final inherited V19 V18 V17 V16 V15 V12 original-native regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v19_local_credit_causality_audit.py > "$RUNNER_TEMP/v20/inherited-v19.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v19_local_credit_causality.py' -v
          PYTHONPATH=. python -B research/itd02_v18_intermediate_plasticity_audit.py > "$RUNNER_TEMP/v20/inherited-v18.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v18_intermediate_plasticity_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v17_neighbor_carried_learner_dev.py' -v
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v20/inherited-v16.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ITD02_V20_FINAL_V19_V18_V17_V16_V15_V12_REGRESSION_PASS_NO_SCIENCE"
      - name: Preserve exact-source audit and negative receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v20-local-causal-credit-${{ matrix.os }}
          path: ${{ runner.temp }}/v20/*
          if-no-files-found: warn
          retention-days: 7
