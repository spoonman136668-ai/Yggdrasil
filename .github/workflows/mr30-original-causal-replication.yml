name: MR30 Original Native Independent Causal Signal Replication
on:
  push:
    branches:
      - research/mr30-independent-causal-replication-20261021
  pull_request:
    branches:
      - research/mr29-natural-full-input-causal-contrast-20261021
permissions:
  contents: read
concurrency:
  group: mr30-original-natural-signal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-fresh-public-history-replication:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve exact original source Git file bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact native research source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independently authored original Farama native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Python original native source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reauthenticate exact independently authored original source blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Install existing pinned independent source dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1
      - name: Execute actual native public-only natural causal replication
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.mr30.replicate_original_causal_signal ../external/minigrid | tee ../mr30-source-receipt.log
          grep -q '^MR30_ORIGINAL_NATIVE_CAUSAL_SIGNAL_REPLICATION=' ../mr30-source-receipt.log
      - name: Confirm original independent source and research worktrees unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
