name: Yggdrasil F65 public role-path source qualification
on:
  push:
    branches:
      - research/y-f65-learned-path-assembly-precode-20261016-r1
permissions:
  contents: read
jobs:
  independent-precode:
    if: "${{ github.event.head_commit.message == 'ci(y-f65): run source-only causal assembly and regression qualification' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source and public-prefix causal assembler
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 13e55ce0af28a3330a51d23509acc1bf087b0c71 HEAD
          test "$(git hash-object research/foundational/20261016-y-f65/prereg.json)" = 9bbfd50b740be2c9d4ec891b3b360cd9650b7e23
          test "$(git hash-object research/foundational/20261016-y-f65/path_assembly.py)" = 10c2ba041c1d3e3063e1e98ba5726fa458db5f3a
          test "$(git hash-object research/foundational/20261016-y-f63c/source.py)" = c04b73306861098eecf55db77b2db486aa918819
          mkdir -p "$RUNNER_TEMP/f65-synthetic/"
          python3 -B research/foundational/20261016-y-f65/path_assembly.py --synthetic-only > "$RUNNER_TEMP/f65-synthetic/source_audit.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f65-synthetic/source_audit.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f65-synthetic/source_audit.json")));print("F65_SYNTHETIC_MERGE_COUNT",d["merges_selected"]);assert d["merges_selected"]>0 and not d["heldout_used"]'
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f65-synthetic/exact_head.txt"
          sha256sum "$RUNNER_TEMP/f65-synthetic/source_audit.json" > "$RUNNER_TEMP/f65-synthetic/sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f65-synthetic-source-audit
          path: ${{ runner.temp }}/f65-synthetic/
          retention-days: 90
          if-no-files-found: warn
  single-repository-regression:
    needs: independent-precode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free hosted dependencies
        shell: bash
        run: |
          python -m pip install pytest pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run one full regression against exact prereg source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f65-regression/"
          git merge-base --is-ancestor 13e55ce0af28a3330a51d23509acc1bf087b0c71 HEAD
          python -B -m pytest -q > "$RUNNER_TEMP/f65-regression/regression.txt" 2>&1
          cat "$RUNNER_TEMP/f65-regression/regression.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f65-regression/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f65-exact-head-regression
          path: ${{ runner.temp }}/f65-regression/
          retention-days: 90
          if-no-files-found: warn
