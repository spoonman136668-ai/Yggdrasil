name: Native integrated proof source qualification
on:
  push:
    branches: [research/integrated-proof-source-20261104]
    paths:
      - research/native/integrated_proof/**
      - .github/workflows/native-integrated-proof-source.yml
permissions:
  contents: read
jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Persistent multi-step decision checks without environment execution
        run: python -B -m unittest discover -s research/native/integrated_proof -v
      - name: Existing MG90 regression without original worlds
        run: python -B -m unittest discover -s research/native/itd02/mg90 -p test_*.py -v
      - name: Full public regression without exclusions
        run: python -B -m unittest discover -s tests -v
      - name: Source worktree integrity
        run: git diff --exit-code
