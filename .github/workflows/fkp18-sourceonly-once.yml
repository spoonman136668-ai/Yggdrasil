# FKP-20 source-only one-shot: source SHA and publish target are pinned below.
name: FKP22 active physical query choice versus exact Bayes and correlation shift
on:
  push:
    branches: [ci/fkp18-sourceonly-once-20261115]
    paths: [.github/workflows/fkp18-sourceonly-once.yml]
permissions:
  contents: write
concurrency:
  group: ci/fkp18-sourceonly-once-20261115
  cancel-in-progress: false
jobs:
  source-only-atlas:
    if: >-
      github.event.head_commit.message == 'ci(FKP-22): qualify physical active feedback and prior-shift source' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.atlas.outputs.candidate }}
    env:
      SOURCE: 4021c9258e30a167ff87a1a3530b9b271a4092d2
      TARGET: research/fkp22-active-physical-intervention-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep byte stable Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4021c9258e30a167ff87a1a3530b9b271a4092d2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact original first prereg and bounded source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor c05d9002ab63163e8b4e296c02dda1f2b8134cb0 "$SOURCE"
          test "$(git rev-parse c05d9002ab63163e8b4e296c02dda1f2b8134cb0^)" = 446e8c008bbab3ffbabeb755f3927a33bab90d0d
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/prereg.json)" = 0c5b3d12f99071d145e65eb85700782370397180
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/temporal_trace.py)" = 68d7eb21792ec2f26950a32018d82c914a659c0c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/source_safe_witness.py)" = 4fdfb3707af2ec82d11ea2dc32dcffdfaa2393f6
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_temporal_trace.py)" = 90807b258dda88ad98028a48f1edcf8143df66c9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/run_source_safe_capacity.py)" = c63175c53d0e73d34fd4dd475254314357d2c514
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_prereg.py)" = 03e27832e50a4589f53740a7cf1c3ec663827d39
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/README.md)" = bc2e9f31a30399df260419fc989feb079c8e0e07
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/prereg.json)" = c9c3dcd77068bc755bc0903c428505ba4c6e98fb
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/public_delayed_source.py)" = 3768ed6b072ac09721409201c5f627d41533d467
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/lag_credit.py)" = 24e428a53e7b592545b2e2ec2b119fbb939bdb5a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/run_known_train.py)" = d152ef94c3c259eaf00449232e8bc21f1cb6847f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_delayed_credit.py)" = e88bca947ab948b7bd570860fb955f097aec017c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_prereg.py)" = 866229fcb8a16dd2152d5cd718eef7df87111c18
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/README.md)" = 7b0b868af8bd4340f9d11c8656a2f025c4f9215b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/prereg.json)" = d5f52215acc358b12462900e9c3c91759f0cbc8b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/public_pair_source.py)" = 8b75c3f9aff2bd0505575b4fd8f10adca222044c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/pair_credit.py)" = 080442fe5e0004fc3cfaab7ec180bf400ace2877
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/run_known_train.py)" = b66b6c9d513c9cf3058f1a612d83136a36006650
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/test_pair_credit.py)" = 998952a3d6346896c23ff3a8d3627acb3bed98a1
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/test_prereg.py)" = d1085cd1e77d88bcef711d52d2567efdc183ddc4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/README.md)" = 024d7a6f28ea4a2b42de3bbf450ab1d7a0441e37
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/prereg.json)" = cc65cc2b0796e3ad177048d7a2c3a98ee8087310
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/public_rule_source.py)" = c759aed670cf25125fe5c382dcd8f7453d47bbbc
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/rule_learning.py)" = bbb0ae7bd3b40525c336888b7b495e05cbbb39d9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/run_public_feedback.py)" = aecabaedc04cc4c119d814a7185471f94f0ea164
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/test_rule_learning.py)" = 52f46d8084fe5fffa13b7b4777537e206762985c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/test_prereg.py)" = 43fdc868900711ac9c1ae7d88f49e628f01d104a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/README.md)" = fe25e28cd743173d488fd8ef941bface605ac8b4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/prereg.json)" = 9fc814f27d36bb5869e2c13d805937cddd1b68c2
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/public_active_source.py)" = 0e145211b962c625be6206ad67995e961072964a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/active_policy.py)" = 2f40cd13f277dcd4b1c8a70ea20c74205485a855
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/run_active_eval.py)" = 14163bc9637239dc8e6c32983e0b487a9e5aac59
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/test_active_policy.py)" = 0f0ca83921144dd132bfcc6e04f0f24f06f4d4c5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/test_prereg.py)" = 05e137595ee08d3c924001b7f17715b699ba84ba
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/README.md)" = fb1e7ae486306803a7809bbbe9f8b70985459e5c
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP22_PREREG_AND_EXACT_SOURCE_PIN=PASS
      - name: Complete source-safe tests before generated atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-22 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-21 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-20 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP22_PUBLIC_NEGATIVE_TESTS=PASS
      - name: Regenerate exactly three derived G29 files only
        id: atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/fkp18-actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/fkp18-expected"
          diff -u "$RUNNER_TEMP/fkp18-expected" "$RUNNER_TEMP/fkp18-actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-22): exact-source G29 atlas only'
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          diff -u "$RUNNER_TEMP/fkp18-expected" <(git diff --name-only "$SOURCE" "$NEXT" | LC_ALL=C sort)
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$TARGET"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo FKP22_GENERATED_G29_ONLY_CANDIDATE="$NEXT"
  full-two-os-fkp22:
    needs: source-only-atlas
    if: needs.source-only-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: '3.11'
          - os: windows-2022
            py: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP22_SOURCE_SHA: 4021c9258e30a167ff87a1a3530b9b271a4092d2
    steps:
      - name: Prevent source line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.py }}
      - name: Run FKP22, inherited FKP21/FKP20/FKP19/FKP18, G29 and complete root
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP22_SOURCE_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-22 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-21 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-20 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP22_FULL_REGRESSION_AND_G29=PASS




  first-physical-active-public-train:
    needs: [source-only-atlas, full-two-os-fkp22]
    if: needs.source-only-atlas.result == 'success' && needs.full-two-os-fkp22.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP22_SOURCE_SHA: 4021c9258e30a167ff87a1a3530b9b271a4092d2
    steps:
      - name: Preserve pinned source without Windows line conversion
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: First full physically selected support, known-family and prior-shift comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP22_SOURCE_SHA"
          python -B research/contrib/chatgpt/FKP-22/run_active_eval.py --output-json "$RUNNER_TEMP/fkp22-physical-active.json" | tee "$RUNNER_TEMP/fkp22-primary-summary.log"
          test -s "$RUNNER_TEMP/fkp22-physical-active.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Independently verify source-first physical actions, strongest control and shift negatives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'fkp22-physical-active.json'
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['schema']=='fkp22.active-physical-info-value.v1'
          assert r['classification']=='SOURCE_SAFE_TRAIN_ACTIVE_INFORMATION_EXPERIMENT_ONLY'
          assert r['source_sha']==os.environ['FKP22_SOURCE_SHA']
          assert r['prereg_first']=='c05d9002ab63163e8b4e296c02dda1f2b8134cb0'
          assert r['physical_actions']==8704
          assert r['same_support_signatures_for_all_methods'] is True
          assert len(r['support_source_evidence'])==16
          assert len(r['per_world'])==24
          assert [w['world_ordinal'] for w in r['per_world']]==list(range(24))
          assert all(set(w['arms'])=={
            'SPARSE_PARTITION_GAIN','INDEPENDENT_BAYES_ENTROPY',
            'FIXED_0_1','DETERMINISTIC_RANDOM_TWO','NO_SUPPORT_ABLATION'} for w in r['per_world'])
          assert all(len({v['public_training_sha256'] for v in w['arms'].values()})==1
                     for w in r['per_world'])
          assert all(len(v['chosen_physical_queries'])==2
                 and len(v['scored_preaction_physical_outcomes'])==2
                 and len({x[0] for x in v['chosen_physical_queries']})==2
                 and {x[0] for x in v['chosen_physical_queries']}.isdisjoint(
                     {x[0] for x in v['scored_preaction_physical_outcomes']})
                 and v['score_used_to_update_model'] is False
                  for w in r['per_world'] for v in w['arms'].values())
          v=r['scores_by_method']
          assert v['SPARSE_PARTITION_GAIN']['known_family']['correct_unqueried']==32
          assert v['INDEPENDENT_BAYES_ENTROPY']['known_family']['correct_unqueried']==32
          assert v['FIXED_0_1']['known_family']['correct_unqueried']==16
          assert v['NO_SUPPORT_ABLATION']['known_family']['correct_unqueried']==16
          assert v['SPARSE_PARTITION_GAIN']['prior_shift']['correct_unqueried']==8
          assert v['INDEPENDENT_BAYES_ENTROPY']['prior_shift']['correct_unqueried']==8
          assert v['SPARSE_PARTITION_GAIN']['known_family']['singleton_posterior_count']==16
          assert v['FIXED_0_1']['known_family']['singleton_posterior_count']==0
          assert all(record['max_logical_learned_bytes']<=65536
                for arm in v.values() for record in arm.values())
          assert r['paired_known_bootstrap']['draws']==10000
          assert r['paired_known_bootstrap']['bootstrap_seed']==2222
          assert r['paired_known_bootstrap']['candidate_minus_independent_strong_95_interval']==[0,0]
          assert r['held_dev_first_use'] is False and r['protected_transfer_opened'] is False
          assert r['unfamiliar_law_scientific_pass'] is False
          assert r['accepted_native_changed'] is False
          print('FKP22_SOURCE_PUBLIC_ACTIVE_PROBES_AND_SHIFT_PROOF=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkp22-first-physical-active-intervention-and-prior-shift
          path: ${{ runner.temp }}/fkp22-physical-active.json
          retention-days: 30
          if-no-files-found: error
