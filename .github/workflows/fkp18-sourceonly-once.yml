# FKP-20 source-only one-shot: source SHA and publish target are pinned below.
name: FKP25 original pinned CausalGym targeted constructor no source actions
on:
  push:
    branches: [ci/fkp18-sourceonly-once-20261115]
    paths: [.github/workflows/fkp18-sourceonly-once.yml]
permissions:
  contents: write
concurrency:
  group: ci/fkp18-sourceonly-once-20261115
  cancel-in-progress: false
jobs:
  source-only-atlas:
    if: >-
      github.event.head_commit.message == 'ci(FKP-25): qualify unchanged original causal MDP constructor on two OS' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.atlas.outputs.candidate }}
    env:
      SOURCE: e02683c18ecde246b4d91da049061e6ac361af71
      TARGET: research/fkp25-targeted-original-mdp-constructor-20261116
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep byte stable Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e02683c18ecde246b4d91da049061e6ac361af71
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact original first prereg and bounded source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 0caef39ec83600d1da942036ab5862e7753906cb "$SOURCE"
          test "$(git rev-parse 0caef39ec83600d1da942036ab5862e7753906cb^)" = a9f7a64f34275c62f507987b3d52657ec9c78f21
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/prereg.json)" = 0c5b3d12f99071d145e65eb85700782370397180
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/temporal_trace.py)" = 68d7eb21792ec2f26950a32018d82c914a659c0c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/source_safe_witness.py)" = 4fdfb3707af2ec82d11ea2dc32dcffdfaa2393f6
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_temporal_trace.py)" = 90807b258dda88ad98028a48f1edcf8143df66c9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/run_source_safe_capacity.py)" = c63175c53d0e73d34fd4dd475254314357d2c514
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_prereg.py)" = 03e27832e50a4589f53740a7cf1c3ec663827d39
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/README.md)" = bc2e9f31a30399df260419fc989feb079c8e0e07
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/prereg.json)" = c9c3dcd77068bc755bc0903c428505ba4c6e98fb
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/public_delayed_source.py)" = 3768ed6b072ac09721409201c5f627d41533d467
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/lag_credit.py)" = 24e428a53e7b592545b2e2ec2b119fbb939bdb5a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/run_known_train.py)" = d152ef94c3c259eaf00449232e8bc21f1cb6847f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_delayed_credit.py)" = e88bca947ab948b7bd570860fb955f097aec017c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_prereg.py)" = 866229fcb8a16dd2152d5cd718eef7df87111c18
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/README.md)" = 7b0b868af8bd4340f9d11c8656a2f025c4f9215b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/prereg.json)" = d5f52215acc358b12462900e9c3c91759f0cbc8b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/public_pair_source.py)" = 8b75c3f9aff2bd0505575b4fd8f10adca222044c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/pair_credit.py)" = 080442fe5e0004fc3cfaab7ec180bf400ace2877
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/run_known_train.py)" = b66b6c9d513c9cf3058f1a612d83136a36006650
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/test_pair_credit.py)" = 998952a3d6346896c23ff3a8d3627acb3bed98a1
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/test_prereg.py)" = d1085cd1e77d88bcef711d52d2567efdc183ddc4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/README.md)" = 024d7a6f28ea4a2b42de3bbf450ab1d7a0441e37
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/prereg.json)" = cc65cc2b0796e3ad177048d7a2c3a98ee8087310
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/public_rule_source.py)" = c759aed670cf25125fe5c382dcd8f7453d47bbbc
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/rule_learning.py)" = bbb0ae7bd3b40525c336888b7b495e05cbbb39d9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/run_public_feedback.py)" = aecabaedc04cc4c119d814a7185471f94f0ea164
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/test_rule_learning.py)" = 52f46d8084fe5fffa13b7b4777537e206762985c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/test_prereg.py)" = 43fdc868900711ac9c1ae7d88f49e628f01d104a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-21/README.md)" = fe25e28cd743173d488fd8ef941bface605ac8b4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/prereg.json)" = 9fc814f27d36bb5869e2c13d805937cddd1b68c2
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/public_active_source.py)" = 0e145211b962c625be6206ad67995e961072964a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/active_policy.py)" = 2f40cd13f277dcd4b1c8a70ea20c74205485a855
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/run_active_eval.py)" = 14163bc9637239dc8e6c32983e0b487a9e5aac59
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/test_active_policy.py)" = 0f0ca83921144dd132bfcc6e04f0f24f06f4d4c5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/test_prereg.py)" = 05e137595ee08d3c924001b7f17715b699ba84ba
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-22/README.md)" = fb1e7ae486306803a7809bbbe9f8b70985459e5c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/prereg.json)" = a6374bf9249818e13419ebe09b4ca843e85d8f67
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/public_repair_source.py)" = 4fc475fdbac69c94ce24060cd91d6cabf06026ee
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/prior_repair.py)" = 3abaa8c8f02acefb9275c82b1613aa941fe373c5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/run_repair.py)" = a5751128b84461e031b6dafb7a5ebd9a16a47d8f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/test_prior_repair.py)" = 9114d0f1f628531be9e831d69375f6cf410f5927
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/test_prereg.py)" = 422032e860757c9712195a8a9e0bb595370de3f5
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-23/README.md)" = 2806b2d060bc83ee6b26ea5a65cf732a92ae19b2
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-24/prereg.json)" = f990e1d502dad89519d1af9069f149a0555ab065
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-24/native_public_mdp.py)" = 4424eadef179996ff491911efadfbe4e07761062
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-24/verify_upstream.py)" = e208f09870bb4dbcab3956e865298196e6629b08
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-24/test_native_public_mdp.py)" = 718bc4fee411ce958062b4a3a6b299732e110aed
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-24/test_prereg.py)" = 29c31c726d54c4a9fced66548ce390e0ce100dcd
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-24/README.md)" = fc97007370f84f61ad8ab735e2cc20d47e3b8a8c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-25/prereg.json)" = 2175ae65da0e3e3c7fdb3b7557ca47dc8b36ea04
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-25/runtime_probe.py)" = 1cfe7fe6cc7b2273cc7232cb38e4d648b25b0236
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-25/test_runtime_probe.py)" = 5183de00acc393f57ac872da5579293638def0f1
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-25/test_prereg.py)" = fa29373818380445cd2b21ecaac23646010f6033
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-25/README.md)" = ae30d0ebc713daf5130a3af691b65324e7715c07
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP25_PREREG_AND_EXACT_SOURCE_PIN=PASS
      - name: Complete source-safe tests before generated atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-25 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-24 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-23 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-22 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-21 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-20 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP25_PUBLIC_NEGATIVE_TESTS=PASS
      - name: Regenerate exactly three derived G29 files only
        id: atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/fkp18-actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/fkp18-expected"
          diff -u "$RUNNER_TEMP/fkp18-expected" "$RUNNER_TEMP/fkp18-actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-25): exact-source G29 atlas only'
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          diff -u "$RUNNER_TEMP/fkp18-expected" <(git diff --name-only "$SOURCE" "$NEXT" | LC_ALL=C sort)
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$TARGET"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo FKP25_GENERATED_G29_ONLY_CANDIDATE="$NEXT"
  full-two-os-fkp25:
    needs: source-only-atlas
    if: needs.source-only-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: '3.11'
          - os: windows-2022
            py: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP25_SOURCE_SHA: e02683c18ecde246b4d91da049061e6ac361af71
    steps:
      - name: Prevent source line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.py }}
      - name: Run FKP25, inherited FKP24/FKP23/FKP22/FKP21/FKP20/FKP19/FKP18, G29 and full root
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP25_SOURCE_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-25 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-24 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-23 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-22 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-21 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-20 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP25_FULL_REGRESSION_AND_G29=PASS
      - name: Pin original MDP lightweight import prerequisites in ephemeral hosted Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            numpy==1.26.4 gymnasium==0.29.1 networkx==3.2.1 toposort==1.10 pydash==8.0.5
          python - <<'PY'
          import importlib.metadata
          expected={"numpy":"1.26.4","gymnasium":"0.29.1","networkx":"3.2.1",
                    "toposort":"1.10","pydash":"8.0.5"}
          assert all(importlib.metadata.version(k)==v for k,v in expected.items())
          print("FKP25_PINNED_DEPENDENCY_ENV=PASS")
          PY
      - name: Read-only original checkout then ORIGINAL targeted MDP constructor, ZERO real source actions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess,sys,tempfile
          pin="c94e9a4cd3641588b6b8507e71ccee5c27032bdf"
          url="https://github.com/CausalAILab/Causal-Gymnasium.git"
          sys.path.insert(0,str(pathlib.Path("research/contrib/chatgpt/FKP-25").resolve()))
          from runtime_probe import probe_exact_original_constructor
          with tempfile.TemporaryDirectory(prefix="fkp25-targeted-original-") as root:
              subprocess.run(["git","clone","--depth=1","--filter=blob:none",
                              "--no-checkout",url,root],check=True)
              subprocess.run(["git","-C",root,"fetch","--depth=1","origin",pin],check=True)
              subprocess.run(["git","-C",root,"checkout","--detach",pin],check=True)
              report=probe_exact_original_constructor(root)
              status=subprocess.run(["git","-C",root,"status","--porcelain",
                                     "--untracked-files=all"],check=True,
                                     capture_output=True,text=True).stdout.strip()
              assert not status, "ORIGINAL_EXTERNAL_SOURCE_DIRTY_AFTER_CONSTRUCTOR"
          assert report['source_sha']==pin
          assert report['original_source_git_sha_verified'] is True
          assert len(report['original_source_blobs'])==16
          assert report['constructor_created'] is True
          assert report['source_classes_unmodified'] is True
          assert report['package_import_mode']=='PINNED_TARGETED_NAMESPACE_NOT_STOCK_PACKAGE_INIT'
          assert report['reset_invocations']==0 and report['do_invocations']==0
          assert report['world_seeds_consumed']==0 and report['external_physical_actions']==0
          assert report['source_first_use'] is False and report['scientific_pass'] is False
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/"fkp25-native-constructor.json"
          dest.write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("FKP25_ORIGINAL_PINNED_TARGETED_CONSTRUCTOR_PASS")
          print("FKP25_ZERO_FIRST_USE_SOURCE_RECEIPT="+json.dumps({
            key:report[key] for key in ("source_sha","constructor_created","package_import_mode",
             "reset_invocations","do_invocations","external_physical_actions",
             "world_seeds_consumed","receipt_sha256","scientific_pass")},sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fkp25-original-targeted-constructor-${{ matrix.os }}
          path: ${{ runner.temp }}/fkp25-native-constructor.json
          retention-days: 30
          if-no-files-found: warn

