# FKP-20 source-only one-shot: source SHA and publish target are pinned below.
name: FKP20 sparse two-parent temporal credit - public source safe training
on:
  push:
    branches: [ci/fkp18-sourceonly-once-20261115]
    paths: [.github/workflows/fkp18-sourceonly-once.yml]
permissions:
  contents: write
concurrency:
  group: ci/fkp18-sourceonly-once-20261115
  cancel-in-progress: false
jobs:
  source-only-atlas:
    if: >-
      github.event.head_commit.message == 'ci(FKP-20): reuse exact source-safe CI for 2-parent delayed credit' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.atlas.outputs.candidate }}
    env:
      SOURCE: 4859ab019ea3efba582376e117fd1a6a98a18a84
      TARGET: research/fkp20-conditional-pair-credit-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep byte stable Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4859ab019ea3efba582376e117fd1a6a98a18a84
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact original first prereg and bounded source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 70f636b34a9ca86b6371068e04c7b0c1368dd62b "$SOURCE"
          test "$(git rev-parse 70f636b34a9ca86b6371068e04c7b0c1368dd62b^)" = b91aa2b2d9e5fb7c5d1e28ecd0dcccd20e57bfd9
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/prereg.json)" = 0c5b3d12f99071d145e65eb85700782370397180
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/temporal_trace.py)" = 68d7eb21792ec2f26950a32018d82c914a659c0c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/source_safe_witness.py)" = 4fdfb3707af2ec82d11ea2dc32dcffdfaa2393f6
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_temporal_trace.py)" = 90807b258dda88ad98028a48f1edcf8143df66c9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/run_source_safe_capacity.py)" = c63175c53d0e73d34fd4dd475254314357d2c514
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_prereg.py)" = 03e27832e50a4589f53740a7cf1c3ec663827d39
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/README.md)" = bc2e9f31a30399df260419fc989feb079c8e0e07
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/prereg.json)" = c9c3dcd77068bc755bc0903c428505ba4c6e98fb
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/public_delayed_source.py)" = 3768ed6b072ac09721409201c5f627d41533d467
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/lag_credit.py)" = 24e428a53e7b592545b2e2ec2b119fbb939bdb5a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/run_known_train.py)" = d152ef94c3c259eaf00449232e8bc21f1cb6847f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_delayed_credit.py)" = e88bca947ab948b7bd570860fb955f097aec017c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_prereg.py)" = 866229fcb8a16dd2152d5cd718eef7df87111c18
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/README.md)" = 7b0b868af8bd4340f9d11c8656a2f025c4f9215b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/prereg.json)" = d5f52215acc358b12462900e9c3c91759f0cbc8b
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/public_pair_source.py)" = 8b75c3f9aff2bd0505575b4fd8f10adca222044c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/pair_credit.py)" = 080442fe5e0004fc3cfaab7ec180bf400ace2877
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/run_known_train.py)" = b66b6c9d513c9cf3058f1a612d83136a36006650
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/test_pair_credit.py)" = 998952a3d6346896c23ff3a8d3627acb3bed98a1
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/test_prereg.py)" = d1085cd1e77d88bcef711d52d2567efdc183ddc4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-20/README.md)" = 024d7a6f28ea4a2b42de3bbf450ab1d7a0441e37
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP20_PREREG_AND_EXACT_SOURCE_PIN=PASS
      - name: Complete source-safe tests before generated atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-20 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP20_PUBLIC_NEGATIVE_TESTS=PASS
      - name: Regenerate exactly three derived G29 files only
        id: atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/fkp18-actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/fkp18-expected"
          diff -u "$RUNNER_TEMP/fkp18-expected" "$RUNNER_TEMP/fkp18-actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-20): exact-source G29 atlas only'
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          diff -u "$RUNNER_TEMP/fkp18-expected" <(git diff --name-only "$SOURCE" "$NEXT" | LC_ALL=C sort)
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$TARGET"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo FKP20_GENERATED_G29_ONLY_CANDIDATE="$NEXT"
  full-two-os-fkp20:
    needs: source-only-atlas
    if: needs.source-only-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: '3.11'
          - os: windows-2022
            py: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP20_SOURCE_SHA: 4859ab019ea3efba582376e117fd1a6a98a18a84
    steps:
      - name: Prevent source line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.py }}
      - name: Run FKP20, inherited FKP19/FKP18, G29 and complete mandatory root regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP20_SOURCE_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-20 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP20_FULL_REGRESSION_AND_G29=PASS


  public-known-train-eight-arm:
    needs: [source-only-atlas, full-two-os-fkp20]
    if: needs.source-only-atlas.result == 'success' && needs.full-two-os-fkp20.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP20_SOURCE_SHA: 4859ab019ea3efba582376e117fd1a6a98a18a84
    steps:
      - name: Preserve exact source without Windows line conversion
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: First full 16-TRAIN-world 8-arm physical four-action comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP20_SOURCE_SHA"
          python -B research/contrib/chatgpt/FKP-20/run_known_train.py --output-json "$RUNNER_TEMP/fkp20-public-16-train.json" | tee "$RUNNER_TEMP/fkp20-summary.log"
          test -s "$RUNNER_TEMP/fkp20-public-16-train.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Independently audit complete source-physical actions and strongest controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'fkp20-public-16-train.json'
          x=json.loads(p.read_text('utf-8'))
          assert x['schema']=='fkp20.public-multiparent-known-train.v1'
          assert x['classification']=='REAL_MULTI_PARENT_PUBLIC_TRAIN_ONLY'
          assert x['source_sha']==os.environ['FKP20_SOURCE_SHA']
          assert x['prereg_first_commit']=='70f636b34a9ca86b6371068e04c7b0c1368dd62b'
          assert x['world_count']==16 and x['train_seed_min']==992100 and x['train_seed_max']==992115
          assert x['full_factorial_explore_episodes_per_arm_world']==32 and x['score_episodes_per_arm_world']==16
          assert x['physical_public_actions']==24576
          names=set(x['methods'])
          assert len(names)==8 and len(x['per_world'])==16
          assert [z['seed'] for z in x['per_world']]==list(range(992100,992116))
          assert all(set(z['actual_public_reward'])==names and set(z['arms'])==names for z in x['per_world'])
          assert all(len({z['arms'][a]['explore_public_sha256'] for a in names})==1 for z in x['per_world'])
          assert all(isinstance(v,(float,int)) and math.isfinite(v) and -16<=v<=16 and v%2==0
               for z in x['per_world'] for v in z['actual_public_reward'].values())
          assert all(z['arms']['FULLY_FITTED_INTERACTION_LOGISTIC']['fully_fit_bce']<=0.05
                     and z['arms']['FULLY_FITTED_INTERACTION_LOGISTIC']['fully_fit_epochs']<=512
                     for z in x['per_world'])
          assert all(z['arms']['SPARSE_CONTRADICTION_PAIRS']['learned_interaction_slots']==3 for z in x['per_world'])
          assert all(z['arms']['EXACT_VERSION_SPACE']['version_space_one_hypothesis'] for z in x['per_world'])
          assert all(c['explore_public_actions']==2048 and c['score_public_actions']==1024
                for c in x['per_arm_cost'].values())
          assert all(c['max_logical_learned_bytes']<=65536 for c in x['per_arm_cost'].values())
          assert x['paired_bootstrap']['bootstrap_draws']==10000 and x['paired_bootstrap']['bootstrap_seed']==2020
          assert x['paired_bootstrap']['scientific_pass'] is False
          assert x['original_fkp17_held_opened'] is False and x['fkp19_held_opened'] is False
          assert x['new_held_first_use'] is False and x['native_accepted_changed'] is False and x['scientific_pass'] is False
          print('FKP20_ACTUAL_16_WORLD_MULTIPARENT_SOURCE_ONLY=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkp20-actual-variable-lag-multiparent-known-train
          path: ${{ runner.temp }}/fkp20-public-16-train.json
          retention-days: 30
          if-no-files-found: error
