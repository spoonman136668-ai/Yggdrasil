name: FKP19 actual delayed action credit - source safe qualification and known TRAIN
on:
  push:
    branches: [ci/fkp18-sourceonly-once-20261115]
    paths: [.github/workflows/fkp18-sourceonly-once.yml]
permissions:
  contents: write
concurrency:
  group: ci/fkp18-sourceonly-once-20261115
  cancel-in-progress: false
jobs:
  source-only-atlas:
    if: >-
      github.event.head_commit.message == 'ci(FKP-19): reuse single source-safe CI for matched delayed credit' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.atlas.outputs.candidate }}
    env:
      SOURCE: 6ef183638c8cb1897a7c6a87f7d8042b3abbbb94
      TARGET: research/fkp19-observed-delayed-causal-credit-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep byte stable Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6ef183638c8cb1897a7c6a87f7d8042b3abbbb94
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact original first prereg and bounded source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 42642b3834a804a7a866a3de8b79790dc669ef20 "$SOURCE"
          test "$(git rev-parse 42642b3834a804a7a866a3de8b79790dc669ef20^)" = 362b63ed081298284ac66470e06f9ff7653c4562
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/prereg.json)" = 0c5b3d12f99071d145e65eb85700782370397180
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/temporal_trace.py)" = 68d7eb21792ec2f26950a32018d82c914a659c0c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/source_safe_witness.py)" = 4fdfb3707af2ec82d11ea2dc32dcffdfaa2393f6
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_temporal_trace.py)" = 90807b258dda88ad98028a48f1edcf8143df66c9
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/run_source_safe_capacity.py)" = c63175c53d0e73d34fd4dd475254314357d2c514
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/test_prereg.py)" = 03e27832e50a4589f53740a7cf1c3ec663827d39
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-18/README.md)" = bc2e9f31a30399df260419fc989feb079c8e0e07
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/prereg.json)" = c9c3dcd77068bc755bc0903c428505ba4c6e98fb
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/public_delayed_source.py)" = 3768ed6b072ac09721409201c5f627d41533d467
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/lag_credit.py)" = 24e428a53e7b592545b2e2ec2b119fbb939bdb5a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/run_known_train.py)" = d152ef94c3c259eaf00449232e8bc21f1cb6847f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_delayed_credit.py)" = e88bca947ab948b7bd570860fb955f097aec017c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/test_prereg.py)" = 866229fcb8a16dd2152d5cd718eef7df87111c18
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-19/README.md)" = 7b0b868af8bd4340f9d11c8656a2f025c4f9215b
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP19_PREREG_AND_EXACT_SOURCE_PIN=PASS
      - name: Complete source-safe tests before generated atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP19_PUBLIC_NEGATIVE_TESTS=PASS
      - name: Regenerate exactly three derived G29 files only
        id: atlas
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/fkp18-actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/fkp18-expected"
          diff -u "$RUNNER_TEMP/fkp18-expected" "$RUNNER_TEMP/fkp18-actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-19): exact-source G29 atlas only'
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          diff -u "$RUNNER_TEMP/fkp18-expected" <(git diff --name-only "$SOURCE" "$NEXT" | LC_ALL=C sort)
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$TARGET"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo FKP19_GENERATED_G29_ONLY_CANDIDATE="$NEXT"
  full-two-os-fkp19:
    needs: source-only-atlas
    if: needs.source-only-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            py: '3.11'
          - os: windows-2022
            py: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP19_SOURCE_SHA: 6ef183638c8cb1897a7c6a87f7d8042b3abbbb94
    steps:
      - name: Prevent source line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.py }}
      - name: Run FKP19, inherited FKP18 interface, G29 and complete root regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP19_SOURCE_SHA"
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-19 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-18 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP19_FULL_REGRESSION_AND_G29=PASS

  public-known-train-seven-arm:
    needs: [source-only-atlas, full-two-os-fkp19]
    if: needs.source-only-atlas.result == 'success' && needs.full-two-os-fkp19.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP19_SOURCE_SHA: 6ef183638c8cb1897a7c6a87f7d8042b3abbbb94
    steps:
      - name: Ensure byte-stable exact candidate
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run frozen fully fitted seven-arm physical known-TRAIN comparison only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FKP19_SOURCE_SHA"
          python -B research/contrib/chatgpt/FKP-19/run_known_train.py --output-json "$RUNNER_TEMP/fkp19-known-train.json" | tee "$RUNNER_TEMP/fkp19-summary.log"
          test -s "$RUNNER_TEMP/fkp19-known-train.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Independently audit exact source/action/comparator and no held science
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'fkp19-known-train.json'
          r=json.loads(p.read_text('utf-8'))
          assert r['schema']=='fkp19.public-known-train-delayed-causal-credit.v1'
          assert r['classification']=='SOURCE_SAFE_KNOWN_TRAIN_DIAGNOSTIC_ONLY'
          assert r['source_sha']==os.environ['FKP19_SOURCE_SHA']
          assert r['prereg_first_commit']=='42642b3834a804a7a866a3de8b79790dc669ef20'
          assert r['world_count']==16 and len(r['per_world'])==16
          assert [w['seed'] for w in r['per_world']]==list(range(991100,991116))
          assert r['exploration_episodes_per_arm_per_world']==8 and r['scored_episodes_per_arm_per_world']==16
          assert r['source_physical_action_count']==5376
          expected=set(r['arms'])
          assert len(expected)==7 and expected==set(r['paired_bootstrap']['means'])
          assert all(set(w['earned_public_reward'])==expected and set(w['arms'])==expected for w in r['per_world'])
          assert all(-16<=score<=16 and score%2==0
               for w in r['per_world'] for score in w['earned_public_reward'].values())
          assert all(len({w['arms'][a]['exploration_sha256'] for a in expected})==1
                     for w in r['per_world'])
          assert all(w['arms']['FULLY_FITTED_INTERACTION_LOGISTIC']['full_training_bce']<=0.05
               and w['arms']['FULLY_FITTED_INTERACTION_LOGISTIC']['fully_fit_epochs']<=1024
               for w in r['per_world'])
          assert all(c['train_actions']==256 and c['scored_actions']==512
                for c in r['cost_by_arm'].values())
          assert all(c['learned_logical_bytes_max']<=65536 for c in r['cost_by_arm'].values())
          assert r['paired_bootstrap']['bootstrap_seed']==1919
          assert r['paired_bootstrap']['bootstrap_draws']==10000
          assert r['fkp17_held_opened'] is False and r['fkp19_dev_opened'] is False
          assert r['reserved_transfer_opened'] is False and r['scientific_pass'] is False
          assert r['accepted_native_changed'] is False
          print("FKP19_REAL_DELAYED_PUBLIC_TRAIN_ALL_SEVEN_ARMS=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkp19-public-real-delayed-credit-known-train
          path: ${{ runner.temp }}/fkp19-known-train.json
          retention-days: 30
          if-no-files-found: error
