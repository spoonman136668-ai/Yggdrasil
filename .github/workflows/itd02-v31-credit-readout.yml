name: ITD-02 V31 original-local-credit vs action-readout exact-source witness
on:
  push:
    branches:
      - research/itd02-v31-credit-readout-attribution-20261028
permissions:
  contents: read
jobs:
  v31-native-credit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Identical git source newline policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source custody and V31 prereg-before-code chronology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d3e75f7e9bb223bab5818ed1b741101b505827ec "$GITHUB_SHA"
          git merge-base --is-ancestor 823669ec0cd68934581dde9ea8c3e12adad0e2c7 "$GITHUB_SHA"
          git merge-base --is-ancestor b2438b2f6972accb3aa9095c0080be34ca4660dc "$GITHUB_SHA"
          git merge-base --is-ancestor d60d91f5b95cdbbbdc071c7b79ec17b16bb2caf1 "$GITHUB_SHA"
          git merge-base --is-ancestor d5ab2b325ba297fd452fada7d326cd4781c1199f "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object yggdrasil/itd02_v26_calibrated_return_dev.py)" = 8a0417d34c6ba94a4eaef33d767da14a4a5c9709
          test "$(git hash-object yggdrasil/itd02_v30_public_probe_policy_dev.py)" = bcc1f0b4e2ec0fcd8b2af69dfb0e6d4d2ca27a4a
          test "$(git hash-object research/itd02_v29_observational_equivalence_audit.py)" = 86e30048b336b20d15a7a2c76d87d48d205c023f
          test "$(git hash-object research/itd02_v30_budgeted_action_exploration_audit.py)" = 2991bdcf8e2c6878691548a0d3e9d5521b9eb85c
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: V31 source-only readout and legal selected reward tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_credit_readout_attribution.py' -v
          echo V31_FOCUSED_MECHANISM_SAFETY_PASS_NOT_SCIENCE
      - name: Nine pre-frozen matched public credit/readout arms and RLS control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v31"
          if ! PYTHONPATH=. python -B research/itd02_v31_credit_readout_attribution_audit.py > "$RUNNER_TEMP/v31/credit.json" 2> "$RUNNER_TEMP/v31/stderr.log"; then
            cat "$RUNNER_TEMP/v31/stderr.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v31/credit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="ygg.itd02.v31.native_credit_readout_attribution.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["original_world_training"] and not d["new_native_learning_architecture"]
          assert not d["source_memory_mutated"]
          assert d["independent_arms"]==9 and d["source_pretraining_selected_rewards"]==576
          assert d["common_public_selected_rewards"]==12
          assert d["native_learned_scalars"]==326 and d["target_adaptive_scalars"]==163
          assert d["matched_RLS_full_matrix_control"] and d["nonlearning_public_feedback_control"]
          assert d["source_checkpoint_cold_restore"]
          assert len(d["canonical_full_credit_and_policy_sha256"])==64
          assert d["classification"] in {
            "V31_NO_FAST_PARAMETER_RESPONSE__NO_SCIENCE",
            "V31_FAST_UPDATE_WITHOUT_DECISION_SHIFT__NO_SCIENCE",
            "V31_READOUT_MASKS_FAST_IMPROVEMENT__NO_SCIENCE",
            "V31_NATIVE_DECISION_GAIN_NOT_QUALIFIED__NO_SCIENCE",
            "V31_BOUNDED_SYNTHETIC_CREDIT_READOUT_ENGINEERING_POSITIVE__NO_SCIENCE"}
          assert all(r["source_frozen"] and r["checkpoint_cold_restore"]
                     and r["nonlearning_control_fast_unchanged"]
                     and r["checkpoint_bytes"]<=12288
                     and r["fast_updates"]==r["expected_fast_updates"]
                     for r in d["rows"])
          print("V31_CLASSIFICATION",d["classification"])
          print("V31_CREDIT_AND_READOUT_SHA",d["canonical_full_credit_and_policy_sha256"])
          print("V31_DECISION_ATTRIBUTION",json.dumps(d["summary"],sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exact inherited original native focused regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v30_public_probe_policy.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v29_observational_equivalence.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V31_INHERITED_NATIVE_SAFETY_PASS_NOT_SCIENCE
      - name: Retain per-host diagnostic evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v31-credit-readout-${{ matrix.os }}
          path: ${{ runner.temp }}/v31/*
          retention-days: 7
          if-no-files-found: warn
