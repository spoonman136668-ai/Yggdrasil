name: LR-92AR public-only posterior structural qualification (one shot)
'on':
  push:
    branches: [research/lr92ar-phase-blind-posterior-20261119]
    paths:
      - 'research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior/**'
      - '.github/workflows/lr92ar-structural-one-shot.yml'
permissions:
  contents: read
jobs:
  structural:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable byte-changing Git checkout transformations
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable source-first prereg, read-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          f='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior/prereg.json.txt'
          want='9aa65a206e805f4975741836cb9a5e02158c597e'
          test "$(git hash-object "$f")" = "$want"
          test "$(git rev-parse '2e0b0ecb0f4c9d7b3d6431480a81587410d7b3e6':"$f")" = "$want"
          echo LR92AR_SOURCE_FIRST_FROZEN_PREREG_PASS
      - name: Test full 928-byte model semantics, negative controls and replay
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior'
          dest="$RUNNER_TEMP/lr92ar"
          mkdir -p "$dest"
          for name in phase_blind_posterior test_phase_blind_posterior; do
            cp "$root/$name.py.txt" "$dest/$name.py"
            test "$(git hash-object "$root/$name.py.txt")" = "$(git hash-object "$dest/$name.py")"
          done
          cp "$root/prereg.json.txt" "$dest/prereg.json.txt"
          (cd "$dest" && python -B -m unittest -v test_phase_blind_posterior)
          echo LR92AR_RESEARCH_ENGINEERING_ONLY_12_TESTS_PASS
      - name: Clean checkout and first-use fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          echo LR92AR_NO_SCIENCE_OWNER_RESTART_OR_PRIMARY_CONSUMPTION_PASS
