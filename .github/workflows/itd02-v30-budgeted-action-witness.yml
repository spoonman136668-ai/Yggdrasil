name: ITD-02 V30 budgeted public action exploration and strong-control witness
on:
  push:
    branches:
      - research/itd02-v30-budgeted-public-action-probe-20261028
permissions:
  contents: read
jobs:
  v30-selected-public-probes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Pinned credential-free checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify V29 parent and V30 pre-executable prereg first
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1b91ec3c51fa81b82e1cca09d99a4558a21ab190 "$GITHUB_SHA"
          git merge-base --is-ancestor 99f9a79c907b9290b3e7eaee525cd11490742509 "$GITHUB_SHA"
          git merge-base --is-ancestor 332880b0299f68f540dcb28cbce6507caae9f231 "$GITHUB_SHA"
          git merge-base --is-ancestor 261a481d6a37f5bcd41ef5a001a1db18b737b7fe "$GITHUB_SHA"
          git merge-base --is-ancestor 91b993cf1b48e56b81b4687953136f7c0a55f95f "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object yggdrasil/itd02_v26_calibrated_return_dev.py)" = 8a0417d34c6ba94a4eaef33d767da14a4a5c9709
          test "$(git hash-object research/itd02_v29_observational_equivalence_audit.py)" = 86e30048b336b20d15a7a2c76d87d48d205c023f
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Public-only action choice focused unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v30_public_probe_policy.py' -v
          echo V30_EXTERNAL_ACTION_POLICY_TESTS_PASS_NOT_NATIVE_EXPLORATION
      - name: Evaluate 54 preregistered matched-budget selected-feedback arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v30"
          PYTHONPATH=. python -B research/itd02_v30_budgeted_action_exploration_audit.py > "$RUNNER_TEMP/v30/audit.json" 2> "$RUNNER_TEMP/v30/error.txt" || { cat "$RUNNER_TEMP/v30/error.txt"; exit 1; }
          python - "$RUNNER_TEMP/v30/audit.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="ygg.itd02.v30.budgeted_selected_action_information.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["native_autonomous_exploration"] and not d["original_world_training"]
          assert not d["original_native_source_modified"]
          assert d["new_learned_scalars"]==0 and d["native_stored_learned_scalars"]==326
          assert d["target_fast_trainable_scalars"]==163
          assert d["independent_arm_count"]==54
          assert d["common_source_training_selected_rewards"]==576
          assert d["common_target_selected_rewards"]==12
          assert d["worst_native_checkpoint_bytes"]<=12288
          assert d["all_source_frozen"] and d["all_native_cold_restore"]
          assert len(d["canonical_case_policy_sha256"])==64
          assert d["classification"] in {
            "V30_PUBLIC_PROBE_IDENTIFIABILITY_NOT_ESTABLISHED__NO_SCIENCE",
            "V30_EXPLORATION_WITHOUT_STRONG_DECISION_GAIN__NO_SCIENCE",
            "V30_BOUNDED_SYNTHETIC_BUDGETED_ACTION_EXPLORATION_ENGINEERING_POSITIVE__NO_SCIENCE"}
          print("V30_CLASSIFICATION",d["classification"])
          print("V30_CANONICAL_CASE_POLICY_SHA",d["canonical_case_policy_sha256"])
          print("V30_IDENTIFIABILITY",d["information_sufficiency_gates"]["first_novelty_probe_distinguishes_worlds"])
          print("V30_DECISION_GAINS",json.dumps(d["information_sufficiency_gates"]["decision_utility_gates"],sort_keys=True))
          print("V30_B_REGRET_BUDGET3",json.dumps(d["information_sufficiency_gates"]["B_regret_equal_budget3"],sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Bounded inherited V29 through original native focused safety
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v29_observational_equivalence.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V30_INHERITED_NATIVE_SAFETY_PASS_NOT_SCIENCE
      - name: Preserve per-host evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v30-selected-action-witness-${{ matrix.os }}
          path: ${{ runner.temp }}/v30/*
          retention-days: 7
          if-no-files-found: warn
