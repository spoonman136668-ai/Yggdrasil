name: MH04 frozen synthetic bank-storage and return DEV qualification
on:
  push:
    branches: [research/mh04-native-bank-retention-20261120]
    paths-ignore:
      - .ice/code-atlas.html
      - .ice/code-atlas.ice
      - .ice/code-atlas.json
permissions:
  contents: read
concurrency:
  group: ygg-mh04-firstuse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-atlas:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      final_sha: ${{ steps.publish.outputs.final_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authorize ONLY first child of frozen prereg + source baseline
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF_NAME" = research/mh04-native-bank-retention-20261120
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Only this workflow-creation commit may ever score the frozen cohort.
          test "$(git rev-parse HEAD^)" = 454aec6da895d0d722bb714c97f2d1d56a097be0
          git merge-base --is-ancestor baf32dd04e12d10036049216c45afac8d38b909b "$GITHUB_SHA"
          git merge-base --is-ancestor 907ad8d90b8a4bb6aa0b0473fd31890a4f88b909 "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/itd02_v32e_pair_consensus.rs)" = 85237dcc82905e05a273b11023b5be5db722726e
          test "$(git rev-parse HEAD:research/mh03_checkpoint_bank_readback.py)" = "$(git rev-parse 907ad8d90b8a4bb6aa0b0473fd31890a4f88b909:research/mh03_checkpoint_bank_readback.py)"
          git diff --name-only 907ad8d90b8a4bb6aa0b0473fd31890a4f88b909 "$GITHUB_SHA" |
            python -B -c 'import sys; actual=set(sys.stdin.read().splitlines()); expected={"research/mh04_native_bank_retention_prereg.md","research/mh04_native_bank_retention.py","research/test_mh04_native_bank_retention.py",".github/workflows/qualify-mh04-native-bank-retention.yml"}; assert actual==expected,(actual,expected)'
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git diff --cached --name-only |
            python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); e={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert a==e,(a,e)'
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(MH04): pin only derived source Atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo MH04_SOURCE_FIRST_FROZEN_ATLAS_PASS

  qualified-new-public-dev:
    needs: source-atlas
    if: ${{ needs.source-atlas.result == 'success' && github.run_attempt == 1 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Windows byte-exact source checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ needs.source-atlas.outputs.final_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Seal only original code and generated-index parentage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = '${{ needs.source-atlas.outputs.final_sha }}'
          test "$(git rev-parse HEAD^)" = '${{ needs.source-atlas.outputs.source_sha }}'
          test "$(git rev-parse HEAD:research/itd02_v32e_pair_consensus.rs)" = 85237dcc82905e05a273b11023b5be5db722726e
          git diff --name-only HEAD^ HEAD |
            python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); e={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert a==e,(a,e)'
          python -B scripts/build_code_atlas.py --check-if-present
          echo MH04_SOURCE_AND_DERIVED_ATLAS_CUSTODY_PASS
      - name: Compile original Rust libraries — no Cargo or network
        shell: bash
        run: |
          set -euo pipefail
          ext=so
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=dll; fi
          for stem in itd02_v32a_native_microcells itd02_v32d_context_memory itd02_v32e_pair_consensus; do
            rustc --edition=2021 -C opt-level=3 --crate-type cdylib "research/$stem.rs" -o "$RUNNER_TEMP/$stem.$ext"
          done
          echo "V32A_NATIVE_LIBRARY=$RUNNER_TEMP/itd02_v32a_native_microcells.$ext" >> "$GITHUB_ENV"
          echo "V32D_NATIVE_LIBRARY=$RUNNER_TEMP/itd02_v32d_context_memory.$ext" >> "$GITHUB_ENV"
          echo "V32E_NATIVE_LIBRARY=$RUNNER_TEMP/itd02_v32e_pair_consensus.$ext" >> "$GITHUB_ENV"
          echo MH04_NATIVE_ORIGINAL_COMPILED_PASS
      - name: Focused control tests BEFORE any first scoring
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s research -p 'test_mh04_*.py' -v
          echo MH04_SOURCE_ONLY_FOCUSED_PREPRIMARY_PASS
      - name: MANDATORY full inherited root regression BEFORE first scoring
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B - <<'PY'
          import sys, unittest
          suite=unittest.TestLoader().discover("tests", pattern="test_*.py")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), "MH04_FINAL_FULL_ROOT_FAIL"
          assert result.testsRun == 139, ("MH04_ROOT_COUNT_DRIFT",result.testsRun)
          if sys.platform == "win32":
              expected={"test_missing_result_rejected","test_mismatched_candidate_id_rejected",
                        "test_existing_roles_learn_from_own_measured_residual_only",
                        "test_separate_native_model_output_and_equal_information_controls"}
              actual={case.id().rsplit(".",1)[-1] for case,why in result.skipped}
              assert actual==expected and all("POSIX" in why for case,why in result.skipped), ("MH04_WINDOWS_UNEXPECTED_SKIP",actual)
          else:
              assert not result.skipped, ("MH04_LINUX_UNEXPECTED_SKIP",result.skipped)
          print("MH04_FULL_139_ROOT_TESTS_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MH04_MANDATORY_FINAL_REGRESSION_PASS
      - name: ONE frozen public synthetic DEV scoring invocation, NO rerun
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "$(git status --porcelain --untracked-files=all)"
          PYTHONPATH=. python -B research/mh04_native_bank_retention.py > mh04-report.json
          python -B - <<'PY'
          import json
          report=json.load(open("mh04-report.json"))
          assert report["trial_identity"]=="MH04-SYNTH-FG-401-409-419-421-431-20261120"
          assert report["cohort_count"]==10
          assert len(report["results"])==10 and len(report["shams"])==5
          assert not report["original_source_first_use"]
          assert not report["native_rust_modified"]
          assert not report["scientific_gain_verified"]
          for row in report["results"]:
              assert len(bytes.fromhex(row["original_stage_checkpoint_hex"]["a240"]))==2264
              assert len(bytes.fromhex(row["original_stage_checkpoint_hex"]["x240"]))==2264
              assert len(row["stages"])==8
          a=report["assessment"]
          print("MH04_STORAGE="+a["storage_classification"])
          print("MH04_RETRIEVAL="+a["classification"])
          print("MH04_SYNTHETIC_F="+str(a["grouped"]["F"]))
          print("MH04_SYNTHETIC_G="+str(a["grouped"]["G"]))
          print("MH04_ALL_COEQUAL_NO_GAIN_CLAIM=True")
          PY
      - name: Preserve original negative, checksums and raw full checkpoints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mh04-source-only-dev-${{ matrix.os }}
          path: mh04-report.json
          if-no-files-found: ignore
