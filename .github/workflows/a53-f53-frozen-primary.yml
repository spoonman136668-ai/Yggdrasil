name: A53 F53 Recovery Inspect

on:
  push:
    branches: [dg1a-ar]
    paths:
      - .github/workflows/a53-f53-frozen-primary.yml

jobs:
  inspect-parent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify F52 parent
        shell: bash
        run: |
          set -euo pipefail
          cd research/applications/track-a
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path

          stem="a52_t10d_committed_response_phase_offset_v1"
          parts=sorted(Path(".").glob(stem+".source.part*.b64"))
          assert len(parts)==7, len(parts)
          enc="".join("".join(p.read_text().split()) for p in parts)
          assert len(enc)==28468, len(enc)
          assert hashlib.sha256(enc.encode()).hexdigest()=="49dba6fdeed19093684c97a78e6690fdec2276229bcdd649f76e0554c16f2892"
          raw=base64.b64decode(enc,validate=True)
          assert len(raw)==21350, len(raw)
          assert hashlib.sha256(raw).hexdigest()=="cbb20b48b21e6a6f7d2b47c5347ce4431d65c3202df0a8daa230472b805f2699"
          src=gzip.decompress(raw)
          assert len(src)==92868, len(src)
          assert hashlib.sha256(src).hexdigest()=="f1c2cfbd707621b18db101ea9a41f2264841acee10abcc5b80e4239c50ae60e1"
          Path("/tmp/a52.py").write_bytes(src)
          print("F52_PARENT_OK",len(src),hashlib.sha256(src).hexdigest())
          PY

          echo "=== KEY LINE NUMBERS ==="
          grep -nE 'ARM|TAU|tau|pressure_decision|decision_pressure|pressure_history|PRESSURE|p_stay|def run_|def simulate|def summarize|def main|__main__|integrity|diagnostic' /tmp/a52.py | tail -n 220

          echo "=== SOURCE HEAD 1-220 ==="
          sed -n '1,220p' /tmp/a52.py

          echo "=== SOURCE TAIL ==="
          tail -n 260 /tmp/a52.py
