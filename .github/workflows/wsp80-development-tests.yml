name: WSP80 developer-only weight-repair unit qualification
on:
  pull_request:
    branches:
      - research/wsp79-sparse-causal-order-consensus-20261113
    paths:
      - 'research/contrib/chatgpt/WSP-80/**'
      - '.github/workflows/wsp80-development-tests.yml'
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Seven developer-only WSP80 unit and no-reset smoke tests (NOT scientific SELFTEST)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-80 -p 'test_*.py' -v
      - name: Full inherited Yggdrasil root regression suite (non-scientific)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

