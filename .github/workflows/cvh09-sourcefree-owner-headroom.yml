name: CVH09 original causal source headroom and owner virgin seed source-firstuse disarmed

on:
  push:
    branches: [research/cvh09-prospective-owner-cohort-admission-20261116]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  source-only-development:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Git exact bytes, avoid CRLF reinterpretation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze source-unopened prospective prereg and new original first-use DENIAL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8f815801295a57e2b65471ccf048108405316a40 HEAD
          git merge-base --is-ancestor c31a1d3dd07b9c565cd6f08e6764c4b429e909b9 HEAD
          test "$(git diff 8f815801295a57e2b65471ccf048108405316a40 c31a1d3dd07b9c565cd6f08e6764c4b429e909b9 --name-only)" = "research/contrib/chatgpt/CVH-09/prereg.json"
          test -z "$(git status --porcelain)"
          for n in 01 02 03 04 05 06 07 08 09; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CVH-$n" -p 'test_*.py' -v
          done
          python -B research/contrib/chatgpt/CVH-09/source_headroom_preflight.py --output-json "$RUNNER_TEMP/cvh09-source-only-result.json"
          test -s "$RUNNER_TEMP/cvh09-source-only-result.json"
          test -z "$(git status --porcelain)"
          echo CVH09_OWNER_HEADROOM_NO_FIRST_USE_DEV=PASS
      - name: Upload source-free analytic original reward and owner-denial proof; source do 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cvh09-sourcefree-headroom-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/cvh09-source-only-result.json
          if-no-files-found: error
          retention-days: 30

  source-atlas-once:
    needs: [source-only-development]
    if: "github.event.head_commit.message == 'ci(cvh09): pin owner source-family headroom G29' && github.run_attempt == 1 && needs.source-only-development.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: cvh09-original-consumed-source-g29-once
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate only three official derived code atlas files once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          SOURCE="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(cvh09): pinned original consumed-source G29 at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/cvh09-prospective-owner-cohort-admission-20261116

  final-exact-regression:
    needs: [source-only-development]
    if: "github.event.head_commit.message == 'ci(cvh09): exact sourcefree owner cohort headroom regression' && github.run_attempt == 1 && needs.source-only-development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-2022
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Configure byte-stable checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Full inherited native root + CVH01-CVH09 + G29 on same final SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 0
          git merge-base --is-ancestor c31a1d3dd07b9c565cd6f08e6764c4b429e909b9 HEAD
          python -B scripts/build_code_atlas.py --check-if-present
          for n in 01 02 03 04 05 06 07 08 09; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CVH-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          python -B research/contrib/chatgpt/CVH-09/source_headroom_preflight.py --output-json "$RUNNER_TEMP/cvh09-final-result.json"
          test -s "$RUNNER_TEMP/cvh09-final-result.json"
          test -z "$(git status --porcelain)"
          echo CVH09_FULL_EXACT_OWNER_HEADROOM_PASS=PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cvh09-final-sourcefree-headroom-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/cvh09-final-result.json
          if-no-files-found: error
          retention-days: 30

  independent-g29:
    needs: [source-only-development]
    if: "github.event.head_commit.message == 'ci(cvh09): exact sourcefree owner cohort headroom regression' && github.run_attempt == 1 && needs.source-only-development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Configure byte-stable checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent source atlas check never touches causal environment
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
