name: DG1-SL11 physical-witness context retrieval DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-sl11-20261113/**'
      - '.github/workflows/dg1-sl11-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact original prospective source syntax
        run: python -m py_compile research/contrib/chatgpt/dg1-sl11-20261113/sl11.py research/contrib/chatgpt/dg1-sl11-20261113/test_sl11.py
      - name: Focused frozen, charged-event and negative-control tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-sl11-20261113 -p 'test_*.py' -v
      - name: Run original preregistered 32-world eight-arm physical experiment
        run: python research/contrib/chatgpt/dg1-sl11-20261113/sl11.py > sl11-original-result.json
      - name: Verify matched paid traces and report frozen scientific outcome
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('sl11-original-result.json').read_text())
          assert d['freeze_sha']=='2717821accf3c22140b58859d7c8bc8c9fd5a2de'
          assert d['world_count']==32 and len(d['arms'])==8
          assert d['charged_steps']==20480 and d['paid_causal_observations']==17920
          assert d['charged_flips']==2560
          groups=(
            ('gated_active','original_on_gated','noepisodic_on_gated','bayes_on_gated'),
            ('original_active','gated_on_original'),
            ('gated_passive','original_on_passive'),
          )
          assert all(len({a['pre_cold_trace_sha256'] for a in w['arms'].values()})==1
                     for w in d['worlds'])
          assert all(len({w['arms'][a]['complete_trace_sha256'] for a in group})==1
                     for w in d['worlds'] for group in groups)
          assert all(a['charged_steps']==80 and a['flips']==10 and
                     a['paid_causal_observations']==70 and
                     a['cold_checkpoint_bytes']<=8192 and
                     a['final_checkpoint_bytes']<=8192
                     for w in d['worlds'] for a in w['arms'].values())
          assert all(sum(a['stage_audits'][str(t)][k] for k in ('correct','wrong_confident','abstained'))==64
                     for w in d['worlds'] for a in w['arms'].values() for t in (60,64,72,80))
          print('SL11_PRIMARY:'+str(d['primary_pass']))
          print('SL11_CLASSIFICATION:'+d['classification'])
          print('SL11_GATES:'+json.dumps(d['primary_gates'],sort_keys=True,separators=(',',':')))
          print('SL11_AGGREGATES:'+json.dumps(d['aggregates'],sort_keys=True,separators=(',',':')))
          print('SL11_CPU_RATIO:'+str(d['median_gated_cpu_ratio_vs_original_same_trace']))
          print('SL11_ACTIVE_OOD:'+str(d['ood_worlds_nonpassive']))
          PY
      - name: Mandatory inherited full repository regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: G29 exact-source generated atlas check
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Preserve original per-world prospectively generated results on GitHub
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-sl11-original-paid-worlds-${{ matrix.os }}
          path: sl11-original-result.json
          if-no-files-found: ignore
      - name: Remove transient results before clean tree check
        if: always()
        shell: bash
        run: rm -f sl11-original-result.json
      - name: Assert no tracked source modification
        if: always()
        run: git diff --exit-code
      - name: Emit generated source-atlas reanchor in bounded chunks
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
          python - <<'PY'
          from pathlib import Path
          import hashlib,base64
          for ext in ('json','html','ice'):
              raw=Path('.ice/code-atlas.'+ext).read_bytes()
              print('SL11_ATLAS_START:'+ext+':'+str(len(raw))+':'+hashlib.sha256(raw).hexdigest())
              b64=base64.b64encode(raw).decode('ascii')
              for offset in range(0,len(b64),4096):
                  print('SL11_ATLAS_CHUNK:'+ext+':'+b64[offset:offset+4096])
              print('SL11_ATLAS_END:'+ext)
          PY
