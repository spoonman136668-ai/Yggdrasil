name: Causal Amalgam exact integration preflight
'on':
  push:
    branches:
    - research/causal-intelligence-amalgam-20261118
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  atlas:
    if: "github.event.head_commit.message == 'ci(amalgam): qualify shared consequence updates'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.pin.outputs.candidate }}
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Regenerate source atlas for exact candidate
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
        git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m "docs(amalgam): atlas for $GITHUB_SHA"
        python -B scripts/build_code_atlas.py --check-if-present
        git push origin HEAD:refs/heads/research/causal-intelligence-amalgam-20261118
        echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: atlas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXPECTED_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
    steps:
    - name: Preserve source bytes
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.atlas.outputs.candidate }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install the pinned native solver dependencies
      run: >-
        python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
    - name: Original checkpoint compatibility, cold growth and exact final regression
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
        git rev-parse HEAD HEAD^{tree}
        AMALGAM=research/contrib/chatgpt/CAUSAL-AMALGAM
        DONORS="$RUNNER_TEMP/amalgam-specialists"
        NATIVE="$RUNNER_TEMP/amalgam-ckad26"
        mkdir -p "$DONORS" "$NATIVE"
        # These sealed checkpoint blobs match the original CI artifact byte for byte.
        for seed in 101 202 303; do
          git show "bd55239c5c7785b8fce7fd39a6a0321f597a3530:research/contrib/chatgpt/CKAD-26/seed-$seed-refresh-native.json" > "$NATIVE/seed-$seed-refresh-native.json"
        done
        for seed in 14071 14072; do
          git show "eee9ab7719f52c1c67ce30b142e8f07f36454dd1:research/contrib/chatgpt/YGG-JEPA2-03/seed-$seed-state.json" > "$DONORS/seed-$seed-state.json"
        done
        python -B "$AMALGAM/shadow_preflight.py" "$NATIVE" "$DONORS" > "$RUNNER_TEMP/amalgam-shadow.json"
        python -B "$AMALGAM/growth_preflight.py" "$NATIVE/seed-101-refresh-native.json" > "$RUNNER_TEMP/amalgam-growth.json"
        python -B "$AMALGAM/joint_update_preflight.py" "$NATIVE/seed-101-refresh-native.json" "$DONORS/seed-14071-state.json" --checkpoint-out "$RUNNER_TEMP/amalgam-joint-state.json" > "$RUNNER_TEMP/amalgam-joint.json"
        python -B "$AMALGAM/verify_preflight.py" "$RUNNER_TEMP/amalgam-shadow.json" "$RUNNER_TEMP/amalgam-growth.json" "$RUNNER_TEMP/amalgam-joint.json"
        python -B -m unittest discover -s tests -p 'test_*.py'
        for era in NKR-05 CKAD-23 CKAD-24 CKAD-25 CKAD-26; do
          python -B -m unittest discover -s "research/contrib/chatgpt/$era" -p 'test_*.py'
        done
        python -B scripts/build_code_atlas.py --check-if-present
        test -z "$(git status --porcelain)"
    - name: Verify sealed research receipts on the Linux producer platform
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        AMALGAM=research/contrib/chatgpt/CAUSAL-AMALGAM
        PARENTS="$RUNNER_TEMP/amalgam-replay-parents"
        mkdir -p "$PARENTS"
        cp "$RUNNER_TEMP/amalgam-ckad26/seed-101-refresh-native.json" "$PARENTS/"
        cp "$RUNNER_TEMP/amalgam-specialists/seed-14071-state.json" "$PARENTS/"
        cp "$RUNNER_TEMP/amalgam-joint-state.json" "$PARENTS/"
        python -B "$AMALGAM/staged_retention_audit.py" "$PARENTS" \
          "$AMALGAM/staged_retention_protocol.json" "$AMALGAM/staged-retention-dev-01"
        python -B "$AMALGAM/causal_templates_audit.py" "$PARENTS" \
          "$AMALGAM/causal_templates_protocol.json" "$AMALGAM/causal-templates-dev-01"
        python -B "$AMALGAM/open_set_audit.py" "$PARENTS" \
          "$AMALGAM/open_set_protocol.json" "$AMALGAM/open-set-dev-01"
        test -z "$(git status --porcelain)"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Amalgam-shared-consequence-${{ matrix.os }}
        path: |
          ${{ runner.temp }}/amalgam-joint.json
          ${{ runner.temp }}/amalgam-joint-state.json
        if-no-files-found: error
        retention-days: 30
