name: NCI-05F exact two-challenge sourcefree qualification (one-shot)
'on':
  push:
    branches: [research/nci05-twochallenge-qualifier-20261119]
    paths: ['.github/workflows/nci05-twochallenge-qualification-once.yml']
permissions:
  contents: read
jobs:
  sourcefree:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable automatic Git line-ending translation
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 973921f7af4f1a2c59252969c41d088faa153971
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable source-first contracts and exact implemented files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "973921f7af4f1a2c59252969c41d088faa153971"
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          test "$(git hash-object "$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git rev-parse '21553596e3da52e0f4f5afe335792c9d346aa0dd':"$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git hash-object "$root/role_probe.py.txt")" = 86a3e461dbd3bf0adc0e172321f087ceed4c0e51
          test "$(git hash-object "$root/test_role_probe.py.txt")" = 7da8d37355385ff5cae013e9005266a2031c75fa
          test "$(git hash-object "$root/challenge_prereg.json.txt")" = 5ba9503358d634c729c2220f9ce5c3e4b9cb6149
          test "$(git rev-parse '69f797974ad2fa41f10a214d32b59dc50ebbcbcd':"$root/challenge_prereg.json.txt")" = 5ba9503358d634c729c2220f9ce5c3e4b9cb6149
          test "$(git hash-object "$root/challenge_guard.py.txt")" = d8e6f690a0e3c9acd46b23904b207e9d6a72f187
          test "$(git hash-object "$root/test_challenge_guard.py.txt")" = 24af91968842c9e5af2981e911145eafda5674cd
          echo NCI05F_FROZEN_SOURCE_AND_SCOPE_PASS
      - name: Mandatory original root native regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo NCI05F_ORIGINAL_NATIVE_FULL_REGRESSION_PASS
      - name: Source-free role and two-challenge tests
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          d="$RUNNER_TEMP/nci05f"
          mkdir -p "$d"
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          cp "$root/challenge_prereg.json.txt" "$d/challenge_prereg.json.txt"
          for name in role_probe test_role_probe challenge_guard test_challenge_guard; do
            cp "$root/$name.py.txt" "$d/$name.py"
            test "$(git hash-object "$d/$name.py")" = "$(git hash-object "$root/$name.py.txt")"
          done
          (cd "$d" && python -B -m unittest -v test_role_probe test_challenge_guard)
          echo NCI05F_EXHAUSTIVE_60_POSITIVE_624_NEGATIVE_TWOPROBE_CONTROL_PASS
      - name: Verify untouched candidate checkout, no native trainer or owner mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "973921f7af4f1a2c59252969c41d088faa153971"
          test -z "$(git status --porcelain)"
          echo NCI05F_READONLY_EXACT_SHA_NO_OWNER_FIRST_USE_PASS
