name: Yggdrasil Y053 frozen equal-budget schedule diversification
on:
  push:
    branches: [research/y053-equal-cost-schedule-diversity-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact immutable prereg, executor and parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7338fee28e11ee2d2a5c3487ad9f21ccd94b3d21 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y052-learned-probe/execute.py)" = 303d3d852370323752740fd5f37b5a09e79d8704
          test "$(git hash-object research/contrib/chatgpt/20261013-y053-schedule-hedge/prereg.json)" = 3ef5a22f5044c38fa976a0327ae65842fff53e6e
          test "$(git hash-object research/contrib/chatgpt/20261013-y053-schedule-hedge/execute.py)" = b0f6559626c88aaa1e8f7e2298ee27b12ccafe22
          python3 -m json.tool research/contrib/chatgpt/20261013-y053-schedule-hedge/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y053-schedule-hedge/execute.py
      - name: Original first-use sealed schedule diversification study
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y053-schedule-hedge/execute.py > /tmp/Y053-original.json
          python3 -m json.tool /tmp/Y053-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y053-original.json'))
          assert a['development_seeds']==list(range(1984,1992))
          assert a['sealed_heldout_seeds']==list(range(1992,2008))
          assert len(a['heldout_records'])==5*4*16*3
          assert a['hedge_balanced_schedule_counts']=={'A':8,'B':8}
          print('CLASSIFICATION',a['classification'])
          print('RISK_BY_ARM',a['risk_by_arm'])
          print('RISK_BY_ONSET',a['aggregate_by_regime'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y053-original-schedule-hedge
          path: /tmp/Y053-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full required Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
