name: ITD-02 Door Navigation Source-Free Focused

on:
  pull_request:
    paths:
      - 'research/itd02/door_nav_568/**'
      - '.github/workflows/itd02-door-nav-568.yml'

permissions:
  contents: read

jobs:
  source-free-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Focused source-free tests
        run: python -m unittest discover -s research/itd02/door_nav_568 -p 'test_*.py' -v
      - name: Emit matched replay versus scratch metrics
        working-directory: research/itd02/door_nav_568
        run: python replay_efficiency_benchmark.py
      - name: Emit noisy replay false-restoration audit
        working-directory: research/itd02/door_nav_568
        run: python noisy_replay_audit.py
      - name: Emit exhaustive corruption-policy comparison
        working-directory: research/itd02/door_nav_568
        run: python replay_corruption_comparison.py
      - name: Emit weighted independent and correlated replay-noise results
        working-directory: research/itd02/door_nav_568
        run: python replay_noise_probabilities.py
      - name: Emit matched public successor-corroboration comparison
        working-directory: research/itd02/door_nav_568
        run: python successor_comparison_benchmark.py
      - name: Emit three-step online correction and retention outcome
        working-directory: research/itd02/door_nav_568
        run: python three_step_online_correction.py
      - name: Emit repeated-regime collision and memory-pressure audit
        working-directory: research/itd02/door_nav_568
        run: python context_regime_stress_audit.py
      - name: Emit public evidence-selected memory outcomes
        working-directory: research/itd02/door_nav_568
        run: python evidence_selection_audit.py

      - name: Audit memory switches
        working-directory: research/itd02/door_nav_568
        run: python memory_selection_switch_audit.py

      - name: Audit two-hop causal memory evidence
        working-directory: research/itd02/door_nav_568
        run: python two_hop_evidence_audit.py

      - name: Audit learned informative causal probe selection
        working-directory: research/itd02/door_nav_568
        run: python selected_causal_probe_audit.py

      - name: Audit adaptive probe retries and budgets
        working-directory: research/itd02/door_nav_568
        run: python adaptive_probe_audit.py

      - name: Audit retained public probe exceptions
        working-directory: research/itd02/door_nav_568
        run: python remembered_probe_audit.py

      - name: Audit retained public revalidation
        working-directory: research/itd02/door_nav_568
        run: python revalidation_audit.py

      - name: Audit online public transition learning
        working-directory: research/itd02/door_nav_568
        run: python online_public_learning_audit.py
