name: ITD-02 Door Navigation Source-Free Focused
on:
  pull_request:
    paths:
      - 'research/itd02/door_nav_568/**'
      - '.github/workflows/itd02-door-nav-568.yml'
permissions:
  contents: read
jobs:
  final-native-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve Git-native line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c9ed651c6d9ae2d0a551909c1fa60e2fb39185d8
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact qualified source tree and execute final integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c9ed651c6d9ae2d0a551909c1fa60e2fb39185d8"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import json, os, pathlib, platform, time, unittest
          started=time.perf_counter()
          paths=sorted(pathlib.Path('tests').glob('test_*.py'))
          if not paths: raise SystemExit('NO_REPOSITORY_TESTS')
          exclusions={}
          if os.name=='nt':
              exclusions={x:'UNIX_ONLY_RESOURCE_IMPORT' for x in (
                 'test_free_fanout_sidecar.py',
                 'test_nci04g6_native_credit.py',
                 'test_nci04g7_source_producer.py')}
              exclusions={x:reason for x,reason in exclusions.items() if (pathlib.Path('tests')/x).is_file()}
          suite=unittest.TestSuite()
          for p in paths:
              if p.name not in exclusions:
                  suite.addTests(unittest.defaultTestLoader.discover('tests',pattern=p.name))
          report=unittest.TextTestRunner(verbosity=1).run(suite)
          print('FINAL_NATIVE_REGRESSION='+json.dumps({
              'source_sha':'c9ed651c6d9ae2d0a551909c1fa60e2fb39185d8',
              'harness_event_sha':os.environ['GITHUB_SHA'],
              'os':platform.platform(),
              'executed_module_count':len(paths)-len(exclusions),
              'excluded':exclusions,
              'tests_run':report.testsRun,'failures':len(report.failures),
              'errors':len(report.errors),'success':report.wasSuccessful(),
              'seconds':round(time.perf_counter()-started,3),
              'scientific_first_use':False},sort_keys=True))
          if len(paths) != 3 or report.testsRun < (17 if os.name == 'nt' else 37) or not report.wasSuccessful():
              raise SystemExit('FINAL_NATIVE_REGRESSION_FAILED')
          tests=unittest.defaultTestLoader.discover('research/itd02/door_nav_568',pattern='test_*.py')
          focused=unittest.TextTestRunner(verbosity=1).run(tests)
          print('FINAL_ITD02_SOURCE_FREE='+json.dumps({
              'source_sha':'c9ed651c6d9ae2d0a551909c1fa60e2fb39185d8','tests_run':focused.testsRun,
              'errors':len(focused.errors),'failures':len(focused.failures),
              'success':focused.wasSuccessful()},sort_keys=True))
          if focused.testsRun<4 or not focused.wasSuccessful():
              raise SystemExit('FINAL_ITD02_SOURCE_FREE_FAILED')
          PY
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "c9ed651c6d9ae2d0a551909c1fa60e2fb39185d8"
  aba-development-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve native bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a39171a76d0d7817e3563682bb139a9d7ecf37c4
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-free A-B-A retention versus independent public-reward EMA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a39171a76d0d7817e3563682bb139a9d7ecf37c4"
          python - <<'PY'
          import hashlib, json, os, platform
          from yggdrasil.itd02_local_ring_memory_dev import NativeRingMemoryDev, ACTIONS
          histories=("LRV","docked_LRV")
          actions=("TurnAround","GoForward","Backup")
          native=NativeRingMemoryDev()
          # Acting comparator: per-public-history/action recency EMA, no privileged
          # state. Equal action opportunities, deterministic probe cadence.
          ema={(h,a):0.0 for h in histories for a in actions}
          seen={(h,a):0 for h in histories for a in actions}
          def public_reward(regime,history,action):
              good="GoForward" if (history=="LRV") == (regime=="A") else "Backup"
              return 1.0 if action==good else -1.0
          def select_ema(history):
              return max(actions,key=lambda a:ema[(history,a)])
          def public_native_episode(model,history,action, reward, training=True):
              model.reset_episode()
              model.advance(history)
              model.feedback("TurnAround",0.0,learning=training)
              model.advance("Nothing")
              proposed=model.choose()
              model.feedback(action,reward,learning=training,terminal=True)
              return proposed
          def evaluate(label):
              evaluation=NativeRingMemoryDev.restore(native.checkpoint())
              evaluation.start_frozen_evaluation(evaluation.parameter_sha256())
              native_correct=ema_correct=0
              choices={}
              for h in histories:
                  proposed=public_native_episode(evaluation,h,"TurnAround",0.0,training=False)
                  baseline=select_ema(h)
                  correct="GoForward" if (h=="LRV") == (label=="A") else "Backup"
                  native_correct+=int(proposed==correct)
                  ema_correct+=int(baseline==correct)
                  choices[h]={"native":proposed,"ema":baseline}
              return {"native_correct_of_2":native_correct,"ema_correct_of_2":ema_correct,
                      "choices":choices}
          receipt={"schema":"itd02.aba.sourcefree.probe.v1","source_sha":"a39171a76d0d7817e3563682bb139a9d7ecf37c4",
                   "os":platform.platform(),"scientific_first_use":False,
                   "source_original_world_episodes":0,"equal_public_interactions":True,
                   "regimes":[]}
          for regime in ("A","B","A"):
              result={"regime":regime,"before":evaluate(regime),
                      "train_rewards":{"native":0.0,"ema":0.0}}
              for episode in range(200):
                  h=histories[episode%2]
                  # Both receive 200 interactions per regime. On each 5th episode,
                  # use the same probe action; no future-reward or oracle action selection.
                  probe=episode%5==0
                  probe_action=actions[(episode//5)%len(actions)]
                  native.reset_episode()
                  native.advance(h)
                  native.feedback("TurnAround",0.0)
                  native.advance("Nothing")
                  proposed=native.choose()
                  chosen=probe_action if probe else proposed
                  reward=public_reward(regime,h,chosen)
                  native.feedback(chosen,reward,terminal=True)
                  result["train_rewards"]["native"]+=reward
                  chosen_ema=probe_action if probe else select_ema(h)
                  reward_ema=public_reward(regime,h,chosen_ema)
                  result["train_rewards"]["ema"]+=reward_ema
                  seen[(h,chosen_ema)]+=1
                  ema[(h,chosen_ema)]+=.5*(reward_ema-ema[(h,chosen_ema)])
              result["after"]=evaluate(regime)
              result["native_parameter_hash"]=native.parameter_sha256()
              result["native_checkpoint_bytes"]=len(native.checkpoint())
              receipt["regimes"].append(result)
          receipt["native_updates"]=native.updates
          receipt["comparator_observations"]=sum(seen.values())
          print("ITD02_ABA_SOURCEFREE_RECEIPT="+json.dumps(receipt,sort_keys=True))
          assert receipt["native_updates"]>0 and sum(seen.values())==600
          assert all(s["native_checkpoint_bytes"]<=8192 for s in receipt["regimes"])
          PY
          test -z "$(git status --porcelain)"
  aba-retention-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a39171a76d0d7817e3563682bb139a9d7ecf37c4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Diagnose return-A recovery with frozen checkpoints and no new reward
        shell: bash
        run: |
          python - <<'PY'
          import json,platform
          from yggdrasil.itd02_local_ring_memory_dev import NativeRingMemoryDev,ACTIONS
          histories=("LRV","docked_LRV")
          acts=("TurnAround","GoForward","Backup")
          def good(regime,h):
              return "GoForward" if (h=="LRV") == (regime=="A") else "Backup"
          def choice(m,h,training=True):
              m.reset_episode()
              m.advance(h)
              m.feedback("TurnAround",0.,learning=training)
              m.advance("Nothing")
              out=m.choose()
              return out
          m=NativeRingMemoryDev()
          summaries=[]
          frozen_A=None
          for stage,regime in enumerate(("A","B","A")):
              chosen_counts={a:0 for a in acts}
              rewards=0
              if stage==2:
                  # This uses an A-trained checkpoint saved BEFORE B.
                  old=NativeRingMemoryDev.restore(frozen_A)
                  old.start_frozen_evaluation(old.parameter_sha256())
                  old_votes={}
                  for h in histories:
                      a=choice(old,h,False)
                      old.feedback(a,0.,learning=False,terminal=True)
                      old_votes[h]=a
              else:
                  old_votes=None
              for episode in range(200):
                  h=histories[episode%2]
                  a=choice(m,h)
                  selected=acts[(episode//5)%3] if episode%5==0 else a
                  reward=1. if selected==good(regime,h) else -1.
                  m.feedback(selected,reward,terminal=True)
                  chosen_counts[selected]+=1
                  rewards+=reward
              if stage==0:
                  frozen_A=m.checkpoint()
              observer=NativeRingMemoryDev.restore(m.checkpoint())
              observer.start_frozen_evaluation(observer.parameter_sha256())
              votes={}
              for h in histories:
                  a=choice(observer,h,False)
                  observer.feedback(a,0.,learning=False,terminal=True)
                  votes[h]=a
              summaries.append({"phase":stage+1,"regime":regime,"train_reward":rewards,
                  "chosen_counts":chosen_counts,"frozen_choices":votes,
                  "return_A_old_frozen_choices":old_votes,
                  "parameter_sha":m.parameter_sha256(),
                  "checkpoint_bytes":len(m.checkpoint())})
          print("ABA_RETENTION_DIAGNOSTIC="+json.dumps({"source_sha":"a39171a76d0d7817e3563682bb139a9d7ecf37c4",
              "os":platform.platform(),"stages":summaries,"protected_world_steps":0,
              "claim":"synthetic_checkpoint_diagnostic_only"},sort_keys=True))
          assert len(summaries)==3 and all(s["checkpoint_bytes"]<8192 for s in summaries)
          PY
  aba-action-credit-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve native bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a39171a76d0d7817e3563682bb139a9d7ecf37c4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Log native local action scores before and after A B A
        shell: bash
        run: |
          python - <<'PY'
          import json,platform
          from yggdrasil.itd02_local_ring_memory_dev import NativeRingMemoryDev,ACTIONS
          m=NativeRingMemoryDev()
          histories=("LRV","docked_LRV")
          rows=[]
          for regime in ("A","B","A"):
              phase={"regime":regime,"snapshots":[],"reward":0}
              for episode in range(201):
                  if episode in (0,10,50,100,200):
                      for h in histories:
                          probe=NativeRingMemoryDev.restore(m.checkpoint())
                          probe.reset_episode()
                          probe.advance(h)
                          probe.feedback("TurnAround",0.0)
                          probe.advance("Nothing")
                          q=probe.q_values()
                          phase["snapshots"].append({"episode":episode,"history":h,
                            "q":dict(zip(ACTIONS,[round(x,5) for x in q])),
                            "chosen":ACTIONS[max(range(3),key=lambda i:q[i])]})
                  if episode==200: break
                  h=histories[episode%2]
                  m.reset_episode()
                  m.advance(h)
                  m.feedback("TurnAround",0.0)
                  m.advance("Nothing")
                  proposed=m.choose()
                  chosen=ACTIONS[(episode//5)%3] if episode%5==0 else proposed
                  good="GoForward" if (h=="LRV")== (regime=="A") else "Backup"
                  reward=1.0 if chosen==good else -1.0
                  m.feedback(chosen,reward,terminal=True)
                  phase["reward"]+=reward
              rows.append(phase)
          print("ABA_ACTION_CREDIT_DIAGNOSTIC="+json.dumps({"source_sha":"a39171a76d0d7817e3563682bb139a9d7ecf37c4",
            "os":platform.platform(),"synthetic_only":True,"protected_steps":0,"phases":rows},sort_keys=True))
          assert len(rows)==3 and all(len(row["snapshots"])==10 for row in rows)
          PY
  aba-exploration-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a39171a76d0d7817e3563682bb139a9d7ecf37c4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare exploration schedules with unchanged native update rule
        shell: bash
        run: |
          python - <<'PY'
          import json,platform
          from yggdrasil.itd02_local_ring_memory_dev import NativeRingMemoryDev,ACTIONS
          histories=("LRV","docked_LRV")
          def correct(r,h):
              return "GoForward" if ((h=="LRV")==(r=="A")) else "Backup"
          def eval_model(m,regime):
              e=NativeRingMemoryDev.restore(m.checkpoint())
              e.start_frozen_evaluation(e.parameter_sha256())
              out={}
              for h in histories:
                  e.reset_episode()
                  e.advance(h)
                  e.feedback("TurnAround",0.0,learning=False)
                  e.advance("Nothing")
                  choice=e.choose()
                  e.feedback(choice,0.0,learning=False,terminal=True)
                  out[h]=choice
              return sum(out[h]==correct(regime,h) for h in histories),out
          results=[]
          # Each arm receives exactly 600 public action/reward events,
          # identical training phase lengths and history order.
          for period in (0,5,3,1):
              m=NativeRingMemoryDev()
              phases=[]
              for regime in ("A","B","A"):
                  score=0
                  action_counts={a:0 for a in ACTIONS}
                  for n in range(200):
                      h=histories[n%2]
                      m.reset_episode()
                      m.advance(h)
                      m.feedback("TurnAround",0.0)
                      m.advance("Nothing")
                      greedy=m.choose()
                      # Probe override is an experimental actuator, not a model oracle.
                      probe=period>0 and n%period==0
                      chosen=ACTIONS[(n//max(period,1))%len(ACTIONS)] if probe else greedy
                      reward=1.0 if chosen==correct(regime,h) else -1.0
                      m.feedback(chosen,reward,terminal=True)
                      score+=reward
                      action_counts[chosen]+=1
                  ncorrect,choices=eval_model(m,regime)
                  phases.append({"regime":regime,"reward":score,
                      "correct_of_2":ncorrect,"choices":choices,
                      "action_counts":action_counts})
              results.append({"probe_period":period,"phases":phases,
                  "updates":m.updates,"checkpoint_bytes":len(m.checkpoint())})
          receipt={"schema":"itd02.aba.exploration-isolation.v1",
             "source_sha":"a39171a76d0d7817e3563682bb139a9d7ecf37c4",
             "os":platform.platform(),"source_free":True,
             "original_world_steps":0,"results":results}
          print("ABA_EXPLORATION_ISOLATION="+json.dumps(receipt,sort_keys=True))
          assert all(x["updates"]==1200 for x in results)
          assert all(x["checkpoint_bytes"]<8192 for x in results)
          PY
