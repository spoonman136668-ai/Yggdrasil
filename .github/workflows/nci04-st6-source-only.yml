name: NCI04 ST6 frozen original compositional source
on:
  push:
    branches:
      - research/nci04-st6-compositional-causal-transfer-20261115
permissions:
  contents: read
jobs:
  train_source_only:
    name: ST6 original source-only causality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Windows exact bytes on checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen protocol and original source custody (unmerged ST5 preserved)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5c1c8cebff688eb9042a68d72c96eec1d81e8c5d HEAD
          git merge-base --is-ancestor 14070d749cdd0ee16faa41a78000d20bb481a4e1 HEAD
          test "$(git rev-parse HEAD:research/nci04_st6/frozen_protocol.json)" = 86b2fa6bfce3333c68cffc44eea67e9904756b65
          test "$(git rev-parse HEAD:research/nci04_st6/original_world.py)" = 99cbda9f502920b64ac4f44521d8c6e262e0e463
          test "$(git rev-parse HEAD:research/nci04_st6/source_audit.py)" = b81334a0e62202b84bff2e9bc779321217a48140
          python -B - <<'PY'
          from research.nci04_st6.source_audit import verify_prereg
          a=verify_prereg()
          assert a['authority']['merge'] is False
          assert a['authority']['independent_scientific_first_use'] is False
          print('ST6_PRE_SOURCE_GIT_FREEZE=PASS')
          PY
      - name: Real-world-simulator negative and inherited regression fixtures
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B -m unittest discover -s tests -p 'test_nci04_st6_source.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04_st5_source.py' -v
          python -B -m unittest discover -s tests -p 'test_nci04d2_task.py' -v
          python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
          echo ST6_FOCUSED_SOURCE_TESTS=PASS
      - name: Execute original source ONLY on frozen train law, no hidden held laws
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          from research.nci04_st6.source_audit import audit
          report=audit(Path(os.environ['RUNNER_TEMP'])/'st6-stage0.json')
          assert report['training_real_action_steps']==7680
          assert report['held_dev_laws_unopened'] is True
          assert report['unseen_mechanism_negative_laws_unopened'] is True
          assert report['trained_models_unopened'] is True
          assert report['protected_scientific_first_use_unopened'] is True
          print('ST6_STAGE0_SOURCE_RECORDED=PASS')
          PY
      - name: No checkout mutation by source
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st6-frozen-original-source-${{ matrix.os }}
          path: ${{ runner.temp }}/st6-stage0.json
          if-no-files-found: error
          retention-days: 14
  exact_source_parity:
    needs: train_source_only
    name: ST6 original causal operator and actor trace parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st6-frozen-original-source-ubuntu-latest
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: st6-frozen-original-source-windows-2022
          path: windows
      - name: Verify SAME original actor action-consequence history across OS
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('linux/st6-stage0.json').read_text('utf-8'))
          y=json.loads(Path('windows/st6-stage0.json').read_text('utf-8'))
          for name in x:
              if x[name]!=y[name]:
                  raise SystemExit('ST6_ORIGINAL_SOURCE_CROSS_OS_DRIFT_'+name)
          print('ST6_SOURCE_CROSS_OS_EXACT=PASS')
          print('ST6_ORIGINAL_REAL_ACTION_STEPS='+str(x['training_real_action_steps']))
          print('ST6_SOURCE_DISPOSITION='+x['gate']['disposition'])
          print('ST6_NO_PROTECTED_SCIENTIFIC_FIRST_USE=PASS')
          PY
