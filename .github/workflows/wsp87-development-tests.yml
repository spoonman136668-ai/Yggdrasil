name: WSP87 isolated compositional knowledge exact-source qualification
on:
  pull_request:
    branches:
      - research/wsp80-paid-novelty-structural-weight-repair-20261113
    paths:
      - 'research/contrib/chatgpt/WSP-87/**'
      - '.github/workflows/wsp87-development-tests.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  final-regression:
    if: startsWith(github.event.pull_request.head.ref, 'research/wsp87-direct-relational-knowledge-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: WSP87 nonreserved structural tests — no DEV first-use
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-87 -p 'test_*.py' -v
      - name: All inherited WSP80-WSP86 source-visible focused regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          for n in 80 81 82 83 84 85 86; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Full inherited Yggdrasil root regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Exact source pin, generated G29 atlas and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
