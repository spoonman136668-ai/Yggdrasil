name: NCI-05 exact candidate sourcefree role-proof qualification (one-shot)
'on':
  push:
    branches: [research/nci05-qualification-exact-20261119]
    paths: ['.github/workflows/nci05-sourcefree-qualification-once.yml']
permissions:
  contents: read
jobs:
  sourcefree-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent checkout line-ending rewrite
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 36f95a85e8725df960c3b98df8b8a09cf88c9189
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm frozen protocol predates exact source and public-only test files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "36f95a85e8725df960c3b98df8b8a09cf88c9189"
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          test "$(git hash-object "$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git rev-parse '21553596e3da52e0f4f5afe335792c9d346aa0dd':"$root/prereg.json.txt")" = 4079bfa4ba2bd9394641dcc3bbd70726d5b204be
          test "$(git hash-object "$root/role_probe.py.txt")" = 86a3e461dbd3bf0adc0e172321f087ceed4c0e51
          test "$(git hash-object "$root/test_role_probe.py.txt")" = 7da8d37355385ff5cae013e9005266a2031c75fa
          echo NCI05_SOURCE_FIRST_CUSTODY_PASS
      - name: Full original native regression on exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo NCI05_NATIVE_ROOT_54_PASS
      - name: Proof-only factor-role unit and negative controls (no world scoring)
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/nci05-public-factor-role-proof'
          d="$RUNNER_TEMP/nci05"
          mkdir -p "$d"
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          for name in role_probe test_role_probe; do
            cp "$root/$name.py.txt" "$d/$name.py"
            test "$(git hash-object "$d/$name.py")" = "$(git hash-object "$root/$name.py.txt")"
          done
          (cd "$d" && python -B -m unittest -v test_role_probe)
          echo NCI05_SOURCEFREE_ROLE_PROOF_13_PASS
      - name: Ensure original checkout unchanged and no owner action
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "36f95a85e8725df960c3b98df8b8a09cf88c9189"
          test -z "$(git status --porcelain)"
          echo NCI05_CLEAN_CANDIDATE_NO_OWNER_OR_FIRST_USE_PASS
