name: R7 B exact-source full regression (read-only)
on:
  push:
    branches: [qualification/itd02-r7-original-b-full-20261025]
    paths:
      - '.github/workflows/qualify-itd02-r7-original-b-full-20261025.yml'
permissions:
  contents: read
concurrency:
  group: ygg-r7-b-original-source-full-20261025
  cancel-in-progress: false
jobs:
  full-python-original:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'be0db27807d7f4ad5ccc19a81b183a26d4ae51e3'
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm source identity, prereg and atlas are immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'be0db27807d7f4ad5ccc19a81b183a26d4ae51e3'
          test "$(git rev-parse HEAD:research/native/itd02/r7/PREREG.json)" = '90def4fb42537a214c8aaa6f3ac14b2858498de7'
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = '204ecd993b954b23e66d6d1e8b3568e7c93183c5'
          test "$(git rev-parse HEAD:.ice/code-atlas.json)" = 'abfc4d50b0f72ee879f6d09aff05fa65e43a6511'
          test "$(git rev-parse HEAD:.ice/code-atlas.html)" = 'cb440747d8b50ce285a45228b639442471d68977'
          test "$(git rev-parse HEAD:.ice/code-atlas.ice)" = '2f53e2fb2901e98e89b5d3a028c1625190d6ab22'
          python -B scripts/build_code_atlas.py --check-if-present
          echo YGG_R7_B_ATLAS_SOURCE_CUSTODY=PASS
      - name: One complete repository and existing native-line unit regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          for suite in research/native/itd02/r1 research/native/itd02/r2 research/native/itd02/r3 research/native/itd02/r4 research/native/itd02/r5 research/native/itd02/r6 research/native/itd02/r7 research/native/itd01/r7 research/native/itd01/r9; do
            if test -d "$suite"; then
              python -B -m unittest discover -s "$suite" -p 'test_*.py' -v
            fi
          done
          echo YGG_R7_B_EXISTING_FULL_PYTHON_REGRESSION=PASS
      - name: Strict clean source and no protected-source dispatch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo YGG_R7_B_ORIGINAL_CODE_UNCHANGED=TRUE
          echo YGG_R7_B_PROTECTED_R7_FIT_CHECK_DEV_CONSUMED=0
          echo YGG_R7_B_EXTERNAL_SOURCE_EPISODES=0
          echo YGG_R7_B_SCIENTIFIC_GO=FALSE
