name: Yggdrasil Y037 nonaliased environment qualification
on:
  push:
    branches: [research/y037-diverse-environment-quorum-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source and new-environment prereg
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 22e8c99ccca694d46c3cce07d9f11574eef43ee1 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-degree56/execute.py)" = 5eac5e0b18d3c009c7dd1d160c3a48b8b4c6f3ef
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-diversity/pre.json)" = 538f0e70a0be350f71b73ab9f5106679cf27fb5f
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-diversity/execute.py)" = ded965c0b3e854b9444f5fac4d174dc61cb6f374
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-diversity/pre.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-diversity/execute.py
      - name: Original fail-closed nonaliased science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-diversity/execute.py > /tmp/Y037-original.json
          python3 -m json.tool /tmp/Y037-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y037-original.json'))
          assert a['heldout_seeds']==list(range(328,344))
          assert len(a['regimes'])==4
          assert all(r['unique_environment_count']==24 for r in a['regimes'])
          print('CLASSIFICATION',a['classification'])
          for r in a['regimes']:
              print('REGIME',r['regime'],'UNIQUE',r['unique_environment_count'],
                    'CHURN',r['heldout_churn'],'SAVINGS',r['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original-nonaliased-quorum
          path: /tmp/Y037-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Final Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
