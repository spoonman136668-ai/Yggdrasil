name: WSP150 source-free identifiability and exact final regression
on:
  push:
    branches: [research/wsp150-certifiable-unknown-transfer-20261117]
permissions:
  contents: read
jobs:
  preflight:
    if: "github.event.head_commit.message == 'ci(wsp150): source-pin G29 atlas' || startsWith(github.event.head_commit.message, 'docs(wsp150): pin G29 source atlas at ')"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact parent, frozen source, and prereg
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 55dd1e9e9f79a8a944a841330bb0ddcd93143a22 HEAD
          git merge-base --is-ancestor ef4c931945a0fa431d8ae88d1239a109ad4879a0 HEAD
          test "$(git diff-tree --no-commit-id --name-only -r ef4c931945a0fa431d8ae88d1239a109ad4879a0)" = "research/contrib/chatgpt/WSP-150/prereg.json"
          git diff --exit-code ef4c931945a0fa431d8ae88d1239a109ad4879a0 HEAD -- research/contrib/chatgpt/WSP-150/prereg.json
          git diff --exit-code 55dd1e9e9f79a8a944a841330bb0ddcd93143a22 HEAD -- research/contrib/chatgpt/WSP-149
          test ! -e research/contrib/chatgpt/WSP-150/source.py
          test ! -e research/contrib/chatgpt/WSP-150/result.json
          test ! -e research/contrib/chatgpt/WSP-150/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-150/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Certified ambiguity tests without protected original source
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-150 -p 'test_*.py' -v
      - name: No source generation
        shell: bash
        run: test -z "$(git status --porcelain)"
  source-atlas-once:
    needs: [preflight]
    if: "github.event.head_commit.message == 'ci(wsp150): source-pin G29 atlas' && github.run_attempt == 1 && needs.preflight.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: wsp150-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate only three derived G29 atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git diff --exit-code 55dd1e9e9f79a8a944a841330bb0ddcd93143a22 HEAD -- research/contrib/chatgpt/WSP-149
          git diff --exit-code ef4c931945a0fa431d8ae88d1239a109ad4879a0 HEAD -- research/contrib/chatgpt/WSP-150/prereg.json
          test ! -e research/contrib/chatgpt/WSP-150/result.json
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp150): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp150-certifiable-unknown-transfer-20261117
  final-regression:
    needs: [preflight]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp150): pin G29 source atlas at ') && github.run_attempt == 1 && needs.preflight.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and no protected first-use replay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code ef4c931945a0fa431d8ae88d1239a109ad4879a0 HEAD -- research/contrib/chatgpt/WSP-150/prereg.json
          git diff --exit-code 55dd1e9e9f79a8a944a841330bb0ddcd93143a22 HEAD -- research/contrib/chatgpt/WSP-149
          test ! -e research/contrib/chatgpt/WSP-150/source.py
          test ! -e research/contrib/chatgpt/WSP-150/result.json
          test ! -e research/contrib/chatgpt/WSP-150/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-150/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Recheck inherited immutable WSP149 scientific NO-GO receipt, no source calls
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/contrib/chatgpt/WSP-149/result.json').read_text(encoding='utf8'))
          assert a['frozen_outcome']=='DEVELOPMENT_EXACT_WEIGHT_MEMORY_TRANSFER_NO_GO'
          assert a['cross_platform_all_nonresource_science_and_per_world_exact'] is True
          assert a['original_first_positive_study_sha']=='f0f3069dd36c10127214b677f02d66b7a22f7661'
          for os in ('linux','windows'):
              r=a['platform_raw_results'][os]
              assert r['source_safe_charged_public_effects']==6144
              assert r['protected_original_effects']==0
              assert r['all_exact_fits_32_effects']==192
              assert r['scientific_pass'] is False
          print('WSP149_NEGATIVE_SCIENCE_ARCHIVE_UNCHANGED')
          PY
      - name: Complete inherited WSP135-149 and WSP150 source-free, root regression
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 138 139 140 141 142 143 144 145 146 147 148; do
            if [ -d "research/contrib/chatgpt/WSP-$n" ]; then
              python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
            fi
          done
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_exact_weights.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-149 -p 'test_source_custody.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-150 -p 'test_*.py' -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
