name: Yggdrasil F64 frozen bridge-credit fitting
on:
  push:
    branches:
      - science/y-f64-frozen-bridge-credit-fit-20261016-r1
permissions:
  contents: read
  actions: read
jobs:
  synthetic-method-qualification:
    if: "${{ github.event.head_commit.message == 'science(y-f64): fit preregistered bridge credit from archived FIT TRAIN only' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm identities and audit synthetic learner
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98692c30d5352256a1131dcfd6e11fc6a6bba129 HEAD
          test "$(git hash-object research/foundational/20261016-y-f64/prereg.json)" = aa12b1785b92eec5eb5096d6ef0cd600e97904ad
          test "$(git hash-object research/foundational/20261016-y-f64/bridge_features.py)" = 75d952228c53cf9d41d1cb557fee27e421a96972
          test "$(git hash-object research/foundational/20261016-y-f64/train_bridge_credit.py)" = 7bb10d9125cc8b971d8483fe9f78ee40509e3cb2
          python3 -B research/foundational/20261016-y-f64/train_bridge_credit.py --synthetic-only
          echo 'F64_HELDOUT_UNCONSUMED=TRUE'
  single-frozen-fit:
    needs: synthetic-method-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: y-f64-once-registered-fit-train-source
          run-id: 38886882471
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/f64-exact-source-input/
      - name: Train only on immutable preregistered FIT TRAIN receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f64-frozen-weights/"
          sha256sum "$RUNNER_TEMP/f64-exact-source-input/fit_train_rows.jsonl" | tee "$RUNNER_TEMP/f64-frozen-weights/input-sha.txt"
          python3 -B research/foundational/20261016-y-f64/train_bridge_credit.py --fit-evidence "$RUNNER_TEMP/f64-exact-source-input/fit_train_rows.jsonl" > "$RUNNER_TEMP/f64-frozen-weights/model_fit.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f64-frozen-weights/model_fit.json" >/dev/null
          cat "$RUNNER_TEMP/f64-frozen-weights/model_fit.json"
          sha256sum "$RUNNER_TEMP/f64-frozen-weights/model_fit.json" > "$RUNNER_TEMP/f64-frozen-weights/model-sha.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f64-frozen-weights/exact-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f64-frozen-trained-bridge-credit-weights
          path: ${{ runner.temp }}/f64-frozen-weights/
          retention-days: 90
          if-no-files-found: warn
