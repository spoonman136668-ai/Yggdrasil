name: Mass CS09 original POBAX coverage-constrained location probing
on:
  push:
    branches:
      - research/mass-cs09-pobax-coverage-adaptive-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs09-original-Pobax-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-original-coverage-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout frozen source-first protocol and additive challenge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Qualify immutable prereg FIRST ancestry and additive-only source paths
        shell: bash
        run: |
          set -euo pipefail
          first=26ac88d753816180b22b5ecc8c8e1b3dc42838f7
          parent=3df672f192a8c6b51cb2ed33a893d3b7bcb8ed62
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS09_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; got=set(sys.stdin.read().splitlines()); want={"research/native/itd01/mass_r10/CS09_PREREG.md","research/native/itd01/mass_r10/run_cs09_original_coverage_probe.py","research/native/itd01/mass_r10/test_cs09_original_coverage_probe.py",".github/workflows/mass-cs09-original-pobax-coverage.yml"}; assert got==want,(got,want)'
      - name: Checkout exact original independent POBAX project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taodav/pobax
          ref: a5e1d62d14e4efe783885b9d4f19cffa2a568eec
          path: external/pobax-original
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded original source CPU JAX dependencies
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs09-evidence
          set +e
          timeout 480s python -m pip install --no-cache-dir --timeout 35 --retries 1 'jax==0.6.2' 'jaxlib==0.6.2' chex gymnax flax brax >cs09-evidence/pip-install.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 60s python -m pip install --no-deps -e external/pobax-original >>cs09-evidence/pip-install.log 2>&1
            rc=$?
          fi
          set -e
          printf '%s\n' "$rc" >cs09-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Test no-source frozen policy and Bayesian rules
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs09_original_coverage_probe.py 2>&1 | tee cs09-evidence/focused-tests.log
      - name: Run exactly 7680 original source-native PUBLIC check actions and controls
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs09_original_coverage_probe.py \
            --upstream external/pobax-original --out cs09-evidence/
      - name: Preserve all original source negative and positive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs09-original-pobax-coverage-evidence
          path: cs09-evidence/
          retention-days: 30
