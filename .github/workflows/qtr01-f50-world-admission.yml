name: QTR-01 F50 exact source-law world admission
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 source generator derive G29 atlas'
    name: F50 G29 derived atlas (once, Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze and exact source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'b945d20feee13090dd362cd6eeb90c434399315a'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f50-world-admission.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_worlds.py)" = '21bcecdd0c47d1e9b907ef59b8ce95f018d5983f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_worlds.py)" = '3a50f797f3b782901f92586bc1a47d42efe54df1'
          test -z "$(git status --porcelain)"
          echo F50_FROZEN_EXACT_SOURCE_CUSTODY=PASS
      - name: Build exact G29 source atlas companion only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F50 source exact-law G29 atlas companion'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "F50_SOURCE_ATLAS_COMPANION_SHA=$(git rev-parse HEAD)"
  qualify:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 exact source-world full qualification'
    name: F50 source-law full final regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Normalize Windows source bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source pin, frozen protocol, exact G29 companion
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD^ HEAD)"
          test "$(git log -1 --format=%s)" = 'ci(qtr): F50 exact source-world full qualification'
          test "$(git log -1 --format=%s HEAD^)" = 'ci(qtr): derive F50 source exact-law G29 atlas companion'
          git merge-base --is-ancestor b945d20feee13090dd362cd6eeb90c434399315a HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_worlds.py)" = '21bcecdd0c47d1e9b907ef59b8ce95f018d5983f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f50_worlds.py)" = '3a50f797f3b782901f92586bc1a47d42efe54df1'
          python scripts/build_code_atlas.py --check
          echo F50_FROZEN_SOURCE_WORLD_SHA=PASS
      - name: Install pinned existing regression dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: F50 symbolic full-law uniqueness, source split and leakage negatives
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f50_*.py' -v
      - name: Mandatory original repository regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory complete QTR regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Confirm no new DEV outcomes or accepted-source modifications
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f50_worlds.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_NO_DEV_FIRST_USE_NO_ACCEPTED_WEIGHT_CHANGES=PASS
