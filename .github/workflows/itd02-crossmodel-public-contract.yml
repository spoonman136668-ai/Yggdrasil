name: ITD-02 shared public-world Yggdrasil native custody
on:
  push:
    branches: [research/itd02-crossmodel-public-contract-20261028]
permissions:
  contents: read
jobs:
  yggdrasil-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify native source, common contract, independent learner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('research/itd02_crossmodel_public_contract.json').read_text())
          assert d['schema']=='itd02.crossmodel.public_environment_contract.v1'
          assert d['environment']['id']=='MiniGrid-Empty-5x5-v0'
          assert d['restrictions']['reserved_q1_q2_q3_sealed']
          assert d['restrictions']['do_not_copy_architectures']
          print('SHARED_CONTRACT_SCHEMA_PASS')
          PY
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
