name: WSP100 fixture structural validity only (no original first use)
on:
  push:
    branches: [research/wsp100-transferable-causal-weights-20261114]
permissions:
  contents: read
jobs:
  fixture-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze exact SHA, source lineage and original cohort custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor ac55988cbef6daafa5afd79c50bbf4ce6d5b243f HEAD
          git merge-base --is-ancestor 3c0db5b16255d8e9ddf6a0c23a278e9a2c84a691 HEAD
          test ! -f research/contrib/chatgpt/WSP-100/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-100/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
      - name: Run original-free causal fixture and independent audit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-100 -p 'test_*.py' -v
      - name: Final custody
        shell: bash
        run: |
          test ! -f research/contrib/chatgpt/WSP-100/PUBLIC_PASS.json
          test ! -f research/contrib/chatgpt/WSP-100/RESERVED_PASS.json
          test -z "$(git status --porcelain)"
