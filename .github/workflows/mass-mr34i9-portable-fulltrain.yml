name: Mass MR34I9 opt-in full native 40-epoch portable checkpoint qualification
on:
  pull_request:
    branches: [research/mr34i7b-highres-benchmark-20261022]
    paths:
      - 'research/mr34i9/**'
      - '.github/workflows/mass-mr34i9-portable-fulltrain.yml'
permissions:
  contents: read
concurrency:
  group: mass-mr34i9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
jobs:
  original-train-only-native-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Prevent original Git file transformations on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: original_s4c1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned original source/numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Original Pycolab Windows curses
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify frozen FIRST, original kernel blob, exact four-path engineering scope
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          parent=608675a3343ff9ff34a96e2057a8091f738aaf5f
          first=edd80b67d0d9b45a8098a3f676393db3788a4e5c
          test "$(git rev-parse "${first}^")" = "$parent"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git show --format= --name-only "$first")" = "research/mr34i9/FROZEN_PROTOCOL.md"
          for f in research/mr34i7/portable_kernel.py research/mr34i7b/frozen_protocol.json; do
            test "$(git hash-object "$f")" = "$(git rev-parse "$parent:$f")"
          done
          actual="$(git diff --name-only "$parent" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mass-mr34i9-portable-fulltrain.yml' \
            'research/mr34i9/FROZEN_PROTOCOL.md' \
            'research/mr34i9/optin_train.py' \
            'research/mr34i9/test_optin_train.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo MR34I9_FIRST_PROTOCOL_AND_UNMODIFIED_NATIVE_NUMERIC_KERNEL_PASS
      - name: Original source-free opt-in native portable finite-gradient focused tests
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m unittest -v research.mr34i9.test_optin_train 2>&1 | tee ../mr34i9-focused.log
      - name: One exact original 20-reset TRAIN-only full 40-epoch numeric intervention
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m research.mr34i9.optin_train ../original_s4c1 ../external/minigrid ../external/pycolab ../mr34i9-receipt.json 2>&1 | tee ../mr34i9-original.log
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("../mr34i9-receipt.json").read_text())
          assert x["source_original_public_only"] is True
          assert x["original_source_protected_first_use"] is False
          assert x["original_source_held_DEV_actions_generated"]==0
          assert len(x["source_reports"])==2
          for k,r in x["source_reports"].items():
              assert r["source_TRAIN_only_reset_count"]==20
              assert r["native_original_S4C1_imported_trainer_unchanged"]
              assert r["same_45_native_weights_no_new_parameters"]
              assert r["source_original_held_DEV_or_protected_test_actions"]==0
              for arm in ("independent_original_training_trace","candidate_portable_training_trace"):
                  trace=r[arm]
                  assert trace["source_actual_training_updates"]==800
                  assert len(trace["original_train_only_epoch_Brier"])==40
                  assert len(trace["original_train_only_epoch_checkpoint_sha256"])==40
                  assert trace["source_native_gradient_finite_difference"]["passed"]
          print("MR34I9_ORIGINAL_SOURCE_TRAIN_ONLY40_FINISHED_NO_FIRST_USE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-mr34i9-${{ matrix.os }}-${{ matrix.repeat }}
          path: |
            mr34i9-focused.log
            mr34i9-original.log
            mr34i9-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm no changes to original native or authentic source
        shell: bash
        run: |
          set -euo pipefail
          for p in audit original_s4c1 external/minigrid external/pycolab; do
            git -C "$p" diff --exit-code
            test -z "$(git -C "$p" status --porcelain)"
          done
          echo MR34I9_ORIGINAL_NATIVE_AND_SOURCES_CLEAN
  four-way-original-checkpoint:
    needs: original-train-only-native-portability
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mass-mr34i9-*
          path: evidence
      - name: Strict independent source custody and portable trained checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,math
          a={}
          for os in ("ubuntu-24.04","windows-2025"):
              for repeat in (1,2):
                  path=pathlib.Path("evidence")/f"mass-mr34i9-{os}-{repeat}"/"mr34i9-receipt.json"
                  data=json.loads(path.read_text())
                  assert data["original_source_protected_first_use"] is False
                  assert data["original_source_held_DEV_actions_generated"]==0
                  a[os,repeat]=data
          results={}
          overall=True
          for name in ("FaramaMiniGridDoorKey8","DeepMindPycolabApprehend"):
              src=[a[o,r]["source_reports"][name] for o,r in
                   (("ubuntu-24.04",1),("ubuntu-24.04",2),
                    ("windows-2025",1),("windows-2025",2))]
              x=src[0]
              for y in src[1:]:
                  for field in ("original_independent_source_git_sha","original_source_event_SHA256",
                                "original_source_PUBLIC_training_tensor_custody",
                                "source_actual_TRAIN_only_actions",
                                "original_initial_45_weight_snapshot_sha256"):
                      assert x[field]==y[field],("ORIGINAL_SOURCE_IDENTITY_DRIFT",name,field)
              c=[r["candidate_portable_training_trace"] for r in src]
              candidate_identical=(
                  len({r["source_trained_45_native_checkpoint_sha256"] for r in c})==1
                  and len({r["source_train_only_selected_epoch"] for r in c})==1
                  and all(c[0]["original_train_only_epoch_Brier"]==b["original_train_only_epoch_Brier"] for b in c[1:])
                  and all(c[0]["original_train_only_epoch_checkpoint_sha256"]==b["original_train_only_epoch_checkpoint_sha256"] for b in c[1:]))
              original_identical=len({r["unchanged_original_trainer_selected_checkpoint_sha256"] for r in src})==1
              ratios=[r["portable_candidate_to_exact_original_40epoch_CPU_ratio"] for r in src]
              within_budget=all(0<r<=50 and math.isfinite(r) for r in ratios)
              cpu_nonregression=all(r<=1 for r in ratios)
              results[name]={
                  "four_cross_OS_original_source_event_SHA256":x["original_source_event_SHA256"],
                  "portable_exact_40_epoch_45weight_identity":candidate_identical,
                  "unchanged_original_numpy_40epoch_identity":original_identical,
                  "portable_training_CPU_ratios_four_workers":ratios,
                  "all_four_within_frozen_50x_CPU_screen":within_budget,
                  "all_four_actual_CPU_nonregression":cpu_nonregression,
                  "portable_checkpoint_four_originals":[r["source_trained_45_native_checkpoint_sha256"] for r in c],
                  "native_model_source_untouched":True
              }
              overall &= (candidate_identical and within_budget)
          disposition=("MR34I9_PORTABLE_FULL_TRAIN_ENGINEERING_FEASIBLE_NOT_SCIENCE"
                       if overall else "MR34I9_PORTABLE_FULL_TRAIN_NO_GO")
          print("MR34I9_INDEPENDENT_FOUR_ORIGINALS="+json.dumps(results,sort_keys=True))
          print("MR34I9_DISPOSITION="+disposition)
          print("MR34I9_PROTECTED_FIRST_USE_ZERO")
          # Preserves negative candidate as truthful successful diagnostic;
          # no gate can accidentally promote a scientific model.
          PY
