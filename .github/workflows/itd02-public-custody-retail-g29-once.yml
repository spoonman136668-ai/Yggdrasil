name: ITD-02 crash custody and resource meter G29 one-time exact reanchor
on:
  push:
    branches:
      - research/itd02-public-custody-crash-retail-profile-20261027
    paths:
      - .github/workflows/itd02-public-custody-retail-g29-once.yml
permissions:
  contents: write
concurrency:
  group: itd02-custody-retail-source-g29-once
  cancel-in-progress: false
jobs:
  exact-identity:
    if: ${{ github.actor == 'spoonman136668-ai' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original source identity and one additive workflow
        shell: bash
        run: |
          set -euo pipefail
          original=d7194728814d3fda7dce8c41e4c241b77dbf433b
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$original" HEAD
          test "$(git rev-list --count "$original"..HEAD)" = 1
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$original" HEAD)" = '.github/workflows/itd02-public-custody-retail-g29-once.yml'
          echo 'RETAIL_CRASH_CUSTODY_SOURCE_SCOPE=PASS'
      - name: Rebuild source-only G29 locators from exact native extension
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python -B -m unittest discover -s tests -p test_itd02_public_source_journal_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
      - name: Commit index only and verify source-bound artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/itd02-public-custody-crash-retail-profile-20261027
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          test "$(git diff --cached --name-only)" = "$expected"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(itd02): pin crash-custody and sourcefree retail meter G29'
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/research/itd02-public-custody-crash-retail-profile-20261027
          echo 'RETAIL_CRASH_CUSTODY_G29_SOURCE_QUALIFIED=PASS'
