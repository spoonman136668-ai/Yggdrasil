name: ITD-02 V16 V15-locality falsification source-only
on:
  push:
    branches:
      - research/itd02-v16-locality-transfer-falsification-20261028
permissions:
  contents: read
jobs:
  source-only-locality-transfer-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source byte identity
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout pinned V16 pushed tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify prereg chronology and exact unchanged model source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 332786ac0beca178dbe3f4da442c0512609ceb7c "$GITHUB_SHA"
          git merge-base --is-ancestor 792095ac93c40bef2a430db8891b1662ebba18cf "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object research/itd02_v14_three_phase_context_capacity.py)" = ac8f24466b5b3ed5977a0abb1116d259f5d28cdc
          test "$(git hash-object yggdrasil/itd02_v15_three_phase_readout_dev.py)" = fd719f7de63e42247b7eafad75272930e779d1e4
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Execute preregistered 36-fold V16 negative audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v16-local"
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v16-local/audit.json"
          python - "$RUNNER_TEMP/v16-local/audit.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["source_only"] and not x["scientific_first_use"]
          assert x["original_world_training"] is False
          assert x["model_parameters_modified"] is False
          assert x["leave_one_context_out_folds"]==36
          assert x["trained_other_histories_each_fold"]==35
          assert x["unseen_context_local_zero_predictions"]==36
          assert x["nonzero_unseen_rewards_not_predicted"]==24
          assert x["heldout_absolute_reward_error"]==156
          assert x["local_internal_state_ablation_invariant_count"]==36
          assert x["neighbor_vs_distant_bit_checks"]==36
          assert x["per_reward_site_distinct_context_words"]=={"0":36,"2":36,"5":36}
          assert x["learned_adapter_scalars"]==192
          assert x["classification"]=="V16_ASSOCIATIVE_LOOKUP_NO_HELDOUT_TRANSFER__NOT_NATIVE_DISTRIBUTED_PROOF"
          print("ITD02_V16_FALSIFICATION_GATE_PASS_ENGINEERING_NEGATIVE_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v16-local/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: One inherited final V15/V12 original-native integration regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ITD02_V16_FINAL_V15_V12_INTEGRATION_PASS_NO_SCIENCE"
      - name: Preserve read-only V16 source-only negative audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v16-locality-transfer-${{ matrix.os }}
          path: ${{ runner.temp }}/v16-local/audit.json
          if-no-files-found: warn
          retention-days: 7
