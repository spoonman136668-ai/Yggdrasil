name: QTR-01 F26 CC0 semantic association custody DEV

on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
    paths:
      - .github/workflows/qtr01-f26-semantic-dev.yml
      - research/contrib/chatgpt/QTR-01/f26_semantic_association.py
      - research/contrib/chatgpt/QTR-01/test_f26_semantic_association.py

permissions:
  contents: read

jobs:
  f26-source-free:
    if: github.repository == 'spoonman136668-ai/Yggdrasil'
    name: F26 semantic IR negative tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Byte-stable Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen F26 source scope and source identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d730681989445adf90ff1fb9c22f6e8085f94bd2 HEAD
          test "$(git show d730681989445adf90ff1fb9c22f6e8085f94bd2:research/contrib/chatgpt/QTR-01/f26_prereg.json | python -c 'import json,sys;print(json.load(sys.stdin)["status"])')" = "FROZEN_BEFORE_SOURCE_CAPTURE_OR_IMPLEMENTATION"
          echo F26_PREREG_SOURCE_CUSTODY=PASS
      - name: Source-free semantic association and negative regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f26_*.py' -v
      - name: Clean read-only checkout
        run: git diff --exit-code
