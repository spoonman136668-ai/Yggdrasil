name: F100R2 native self-replay source qualification (no cohorts)
on:
  push:
    branches:
      - research/y-f100-observational-equivalence-20261017-r1
    paths:
      - '.github/workflows/y-f100-native-selfreplay-source.yml'
      - 'research/foundational/20261017-y-f100/**'
permissions:
  contents: read
concurrency:
  group: y-f100-source-only
  cancel-in-progress: false
jobs:
  exact-f100-source:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check two separate precode freezes and unmodified native ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f9e0849dc4d77a7925bc5a9a86e7c21c38016163 HEAD
          git merge-base --is-ancestor 17e27350e295a47fb224d69c237c802c9997861c HEAD
          test "$(git hash-object research/foundational/20261017-y-f100/prereg.json)" = a09e20ea3d8c33b8b180a52c52a60c1376bfab30
          test "$(git hash-object research/foundational/20261017-y-f100/prereg_r2.json)" = 65065cadc268d5169dd3fe9fd2bb37987db92357
          test "$(git hash-object research/foundational/20261017-y-f100/presto.py)" = 14066ad4f36e09e77134e7d5e192fcacf94b5810
          test "$(git hash-object research/foundational/20261017-y-f100/test_presto.py)" = dc7824efdbe00600e61c39c84489e91df5260c32
          test "$(git hash-object research/foundational/20261016-y-f99/causal_closure.py)" = 5de08fe74eb74dd917a7559cc3a8755185aac823
          test "$(git hash-object research/foundational/20261016-y-f99/prereg.json)" = 9abcfbde16137d15248e8ce1229660a46b853dc1
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
          test "$(git hash-object research/foundational/20261016-y-f85/global_solver.py)" = e4eb4bfbd6a01212f8c1eebc38af09b15c6d9cc3
          test "$(git diff --name-only cd9304a4184692bc837a2bd36a2903d69ea366af HEAD)" = "$(printf '%s\n' '.github/workflows/y-f100-native-selfreplay-source.yml' 'research/foundational/20261017-y-f100/prereg.json' 'research/foundational/20261017-y-f100/prereg_r2.json' 'research/foundational/20261017-y-f100/presto.py' 'research/foundational/20261017-y-f100/test_presto.py')"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: F100 new policy pure contract tests (no cohort reads)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/foundational/20261017-y-f100 -p 'test_presto.py' -v
      - name: Exact frozen F99 and F85 controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/foundational/20261016-y-f99 -p 'test_*.py' -v
          python -B -m unittest discover -s research/foundational/20261016-y-f85 -p 'test_global_solver.py' -v
      - name: Native F62 source controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/foundational/20261015-y-f62 -p 'test_precode.py' -v
          python -B -m unittest discover -s research/foundational/20261015-y-f62 -p 'test_engineering.py' -v
      - name: Install test dependencies outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8.3' 'PyYAML>=6.0' 'torch>=2.4'
      - name: Exactly one full repository regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m pytest -q tests
      - name: Validate clean source and nonaccepting boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'F100_SOURCE_ONLY=PASS'
          echo 'F100_NEW_SOURCE_BIRTH=FALSE'
          echo 'F100_FIRST_USE=FALSE'
          echo 'F100_LEARNED_SELECTOR=FALSE'
          echo 'F100_SCIENTIFIC_ACCEPTANCE=FALSE'
          echo 'NO_CKB_CONTROLLER_OR_ACCEPTED_REF_MUTATION=TRUE'
