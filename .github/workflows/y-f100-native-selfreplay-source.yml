name: F100R2 native self-replay source qualification (no cohorts)
on:
  push:
    branches:
      - research/y-f100-observational-equivalence-20261017-r1
    paths:
      - '.github/workflows/y-f100-native-selfreplay-source.yml'
      - 'research/foundational/20261017-y-f100/**'
permissions:
  contents: read
concurrency:
  group: y-f100-source-only
  cancel-in-progress: false
jobs:
  exact-f100-source:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check two separate precode freezes and unmodified native ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f9e0849dc4d77a7925bc5a9a86e7c21c38016163 HEAD
          git merge-base --is-ancestor 17e27350e295a47fb224d69c237c802c9997861c HEAD
          test "$(git hash-object research/foundational/20261017-y-f100/prereg.json)" = a09e20ea3d8c33b8b180a52c52a60c1376bfab30
          test "$(git hash-object research/foundational/20261017-y-f100/prereg_r2.json)" = 65065cadc268d5169dd3fe9fd2bb37987db92357
          test "$(git hash-object research/foundational/20261017-y-f100/presto.py)" = 14066ad4f36e09e77134e7d5e192fcacf94b5810
          test "$(git hash-object research/foundational/20261017-y-f100/test_presto.py)" = dc7824efdbe00600e61c39c84489e91df5260c32
          test "$(git hash-object research/foundational/20261017-y-f100/source_custody_preflight.py)" = d316e6502514f92b91639288ff4cd97568c782f4
          test "$(git hash-object research/foundational/20261017-y-f100/test_source_custody_preflight.py)" = a4b0ca29d14d3b9284652427a39be5e28394c114
          test "$(git hash-object research/foundational/20261016-y-f99/causal_closure.py)" = 5de08fe74eb74dd917a7559cc3a8755185aac823
          test "$(git hash-object research/foundational/20261016-y-f99/prereg.json)" = 9abcfbde16137d15248e8ce1229660a46b853dc1
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
          test "$(git hash-object research/foundational/20261016-y-f85/global_solver.py)" = e4eb4bfbd6a01212f8c1eebc38af09b15c6d9cc3
          test "$(git diff --name-only cd9304a4184692bc837a2bd36a2903d69ea366af HEAD)" = "$(printf '%s\n' '.github/workflows/y-f100-native-selfreplay-source.yml' 'research/foundational/20261017-y-f100/prereg.json' 'research/foundational/20261017-y-f100/prereg_r2.json' 'research/foundational/20261017-y-f100/presto.py' 'research/foundational/20261017-y-f100/source_custody_preflight.py' 'research/foundational/20261017-y-f100/test_presto.py' 'research/foundational/20261017-y-f100/test_source_custody_preflight.py')"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: F100 new policy pure contract tests (no cohort reads)
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/foundational/20261017-y-f100 -p 'test_*.py' -v
      - name: Inspect CKB source custody without bypassing private GitHub permissions
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/f100-ckb-r187-policy.json"
          report="$RUNNER_TEMP/f100-ckb-custody-preflight.json"
          url='https://raw.githubusercontent.com/spoonman136668-ai/ckb-plane/fab36e7c488f930505fcbaeb5f5bf04806e50c5b/.github/research-audit/r187-source-pool.json'
          if curl --fail --location --retry 2 --max-time 45 --silent --show-error "$url" --output "$policy"; then
            test "$(git hash-object "$policy")" = 8a8afd6d7be7b8d5cd183519bb9e642b307ba168
            python -B research/foundational/20261017-y-f100/source_custody_preflight.py \
              --pinned-ckb-policy "$policy" --output "$report"
          else
            # No privileged cross-repo token, no copied private policy, no
            # assertion that a missing source is a valid witness.
            python - "$report" <<'PY'
          import json,sys
          doc=dict(schema="yggdrasil.f100.ckb-source-custody-preflight.v1",
                   classification="F100_CKB_POLICY_INACCESSIBLE_TO_HOSTED_RUNNER",
                   ckb_main_snapshot="fab36e7c488f930505fcbaeb5f5bf04806e50c5b",
                   ckb_policy_expected_git_blob="8a8afd6d7be7b8d5cd183519bb9e642b307ba168",
                   authenticated_ckb_policy_bytes_read=False,
                   scientific_source_admission=False,
                   source_first_use_allowed=False,
                   prospective_experiment_dispatched=False,
                   scientifically_accepted=False,
                   CKB_controller_mutated=False,
                   accepted_ref_mutated=False)
          with open(sys.argv[1],"w",encoding="utf-8") as f:
              json.dump(doc,f,sort_keys=True,indent=2)
              f.write("\n")
          print("F100_P2_CKB_PRIVATE_POLICY=INACCESSIBLE; FIRST_USE_BLOCKED")
          PY
          fi
          python - "$report" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="yggdrasil.f100.ckb-source-custody-preflight.v1"
          assert x["classification"] in (
             "F100_CKB_POLICY_INACCESSIBLE_TO_HOSTED_RUNNER",
             "F100_SOURCE_CUSTODY_NOT_QUALIFIED")
          assert x["source_first_use_allowed"] is False
          assert x["prospective_experiment_dispatched"] is False
          assert x["scientifically_accepted"] is False
          assert x["accepted_ref_mutated"] is False
          print("F100_P2_SOURCE_CUSTODY="+x["classification"])
          PY
          sha256sum "$report"
      - name: Exact frozen F99 and F85 controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/foundational/20261016-y-f99 -p 'test_*.py' -v
          python -B -m unittest discover -s research/foundational/20261016-y-f85 -p 'test_global_solver.py' -v
      - name: Native F62 source controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/foundational/20261015-y-f62 -p 'test_precode.py' -v
          python -B -m unittest discover -s research/foundational/20261015-y-f62 -p 'test_engineering.py' -v
      - name: Install test dependencies outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8.3' 'PyYAML>=6.0' 'torch>=2.4'
      - name: Exactly one full repository regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m pytest -q tests
      - name: Validate clean source and nonaccepting boundaries
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'F100_SOURCE_ONLY=PASS'
          echo 'F100_NEW_SOURCE_BIRTH=FALSE'
          echo 'F100_FIRST_USE=FALSE'
          echo 'F100_LEARNED_SELECTOR=FALSE'
          echo 'F100_SCIENTIFIC_ACCEPTANCE=FALSE'
          echo 'NO_CKB_CONTROLLER_OR_ACCEPTED_REF_MUTATION=TRUE'
          echo 'F100_P2_PROSPECTIVE_SOURCE_ADMISSION=FALSE'
      - name: Archive CKB source-custody preflight (not an admission receipt)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f100-ckb-custody-not-admitted
          path: ${{ runner.temp }}/f100-ckb-custody-preflight.json
          retention-days: 90
