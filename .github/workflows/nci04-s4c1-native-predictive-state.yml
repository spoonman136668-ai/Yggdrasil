name: NCI-04 S4C1 Original Dual Native Predictive-State Qualification
on:
  push:
    branches:
      - research/nci04-s4c1-local-predictive-state-20261022
  pull_request:
    branches:
      - research/nci04-s4c0-recurrent-adequacy-20261021
permissions:
  contents: read
concurrency:
  group: nci04-s4c1-native-predictive-state-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualified-original-source-local-state:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Preserve source-original Git bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact S4C1 frozen 45-slot native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original independently authored Farama MiniGrid
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Original independently authored DeepMind Pycolab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Python pinned native execution runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original source native dependencies and isolated OS process meter
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 six==1.17.0 psutil==6.1.1 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Original unmodified Pycolab curses dependency on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Confirm all original Farama independent native source blobs
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Train and evaluate native 45-slot local predicted-state vs fully trained controls
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          cd yggdrasil
          python -B -m research.nci04_s4c1.original_native_predictive_state ../external/minigrid ../external/pycolab | tee ../s4c1-original-state-receipt.log
          grep -q '^NCI04_S4C1_ORIGINAL_NATIVE_LEARNED_PREDICTIVE_QUOTIENT=' ../s4c1-original-state-receipt.log
      - name: All independent native source and project worktrees remain unchanged
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          git -C external/pycolab diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
          test -z "$(git -C external/pycolab status --porcelain)"
