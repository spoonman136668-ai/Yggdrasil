name: YGG-LINEAGE01 accepted source and official owner state audit
'on':
  push:
    branches:
      - research/ygg-lineage01-accepted-checkpoint-audit-20261119
    paths:
      - '.github/workflows/ygg-lineage01.yml'
      - 'research/contrib/chatgpt/YGG-LINEAGE01/**'
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  source-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Disable machine-specific text conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch pinned official owner and disjoint CAP03 draft; no write or experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin 92c421a5475a27015a390efb88c373eb5f15379d
          git fetch --no-tags origin a594a6c5273345687544ddc31e698498bda41d2c
          test "$(git rev-parse 5e74f8db85b2f5839c42148c0dfba69a88b1a2c9)" = 5e74f8db85b2f5839c42148c0dfba69a88b1a2c9
          test "$(git rev-parse 92c421a5475a27015a390efb88c373eb5f15379d)" = 92c421a5475a27015a390efb88c373eb5f15379d
          test "$(git rev-parse a594a6c5273345687544ddc31e698498bda41d2c)" = a594a6c5273345687544ddc31e698498bda41d2c
      - name: Validate accepted checkpoint inventory and denied promotion
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-LINEAGE01 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/YGG-LINEAGE01/audit.py --output "$RUNNER_TEMP/lineage01-result.json"
          python -B -c "from pathlib import Path; import json; p=Path('research/contrib/chatgpt/YGG-LINEAGE01/result.json'); q=Path(__import__('os').environ['RUNNER_TEMP'])/'lineage01-result.json'; assert json.loads(p.read_bytes())==json.loads(q.read_bytes()),'LINEAGE01_RESULT_DID_NOT_MATCH_PINNED_EVIDENCE'; print('YGG_LINEAGE01_GIT_REPORT_PARITY_PASS')"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: YGG-LINEAGE01-${{ matrix.os }}
          path: ${{ runner.temp }}/lineage01-result.json
          if-no-files-found: error
          retention-days: 30

  atlas:
    needs: source-custody
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - name: Stable Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate and seal source-exact G29 atlas
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          if ! git diff --cached --quiet; then
            git commit -m "docs(lineage01): exact G29 atlas for pinned owner executor audit"
          fi
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ygg-lineage01-accepted-checkpoint-audit-20261119
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final:
    needs: atlas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Stable Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full native regression and official source-only custody check
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.atlas.outputs.candidate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git fetch --no-tags origin 92c421a5475a27015a390efb88c373eb5f15379d
          git fetch --no-tags origin a594a6c5273345687544ddc31e698498bda41d2c
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-LINEAGE01 -p 'test_*.py' -v
          python -B research/contrib/chatgpt/YGG-LINEAGE01/audit.py --output "$RUNNER_TEMP/lineage01-final.json"
          python -B -c "from pathlib import Path; import json,os; a=Path('research/contrib/chatgpt/YGG-LINEAGE01/result.json'); b=Path(os.environ['RUNNER_TEMP'])/'lineage01-final.json'; assert json.loads(a.read_bytes())==json.loads(b.read_bytes()), 'LINEAGE01_RECEIPT_DRIFT'"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p 'test_code_atlas.py' -v
          test -z "$(git status --porcelain)"
