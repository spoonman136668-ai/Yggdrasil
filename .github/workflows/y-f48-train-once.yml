name: Y-F48 new shifted-mechanism TRAIN-only causal pairing test
on:
  push:
    branches: [research/y-f48-anchor-identifiability-20261015-r1]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing Yggdrasil test environment
        run: python3 -m pip install -e '.[test]'
      - name: Exact precode, source-negatives, one full pytest regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6a85c3066ad2cbd071f9e5fb7d2a2e63edfbc499 HEAD
          test "$(git hash-object research/foundational/20261015-y-f48/prereg-candidate.json)" = 52b56c769cc7303f3e3e795a63c9efde2f51a23c
          python3 -B -m unittest discover -s research/foundational/20261015-y-f48 -p test_preflight.py -v
          python3 -m pytest -q tests
  fresh-train:
    needs: source
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute one disjoint shifted sensing TRAIN study, zero originals
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/yf48";mkdir -p "$root"
          python3 -B research/foundational/20261015-y-f48/source_pilot.py > "$root/result.json"
          python3 - "$root/result.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["schema"]=="yggdrasil.f48.shifted-anchor-identifiability.trainonly.v1"
          assert x["questions"]==128 and x["diagnostic_seeds"]==[421100,421108]
          assert not x["accepted_ref_mutation"] and x["primary_original_not_executed"]
          assert x["paid_api_calls"]==0 and not x["independent_F3_custody"]
          assert x["verdict"] in ("TRAIN_ONLY_SUPPORTED_NOT_F3","TRAIN_ONLY_NEGATIVE")
          PY
          (cd "$root" && sha256sum result.json > result.sha256)
          printf '%s\n' "$GITHUB_SHA" > "$root/SOURCE_SHA"
          echo Y_F48_NEW_SHIFTED_PAIR_CAUSAL_TRAIN_DONE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Y-F48-shifted-pair-identifiability-train-NO-ORIGINAL
          path: ${{ runner.temp }}/yf48/
          retention-days: 30
          if-no-files-found: error
