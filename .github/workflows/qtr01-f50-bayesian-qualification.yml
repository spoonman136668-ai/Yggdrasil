name: QTR-01 F50 lower-bank source-only baseline FIT after 4096 custody
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  derive-atlas:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F50 lower-bank source FIT after 4096 proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.generate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source-only changed-file scope and freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected='.github/workflows/qtr01-f50-bayesian-qualification.yml'
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('research/contrib/chatgpt/QTR-01')
          for name in ('f50_source_artifact_audit.py', 'test_f50_source_artifact_audit.py'):
              ast.parse((root/name).read_text())
          print('F50_LOWER_BANK_SOURCE_FIT_SCOPE_AND_FROZEN_CUSTODY=PASS')
          PY
          test -z "$(git status --porcelain)"
      - name: Generate source-derived G29 atlas companion
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F50 lower-bank source FIT G29 atlas companion'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-final-regression:
    needs: derive-atlas
    if: needs.derive-atlas.result == 'success'
    name: F50 lower-bank source-fit exact-SHA regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Windows byte-stable checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.derive-atlas.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned derived tree, frozen protocol and no target first use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.derive-atlas.outputs.candidate_sha }}'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
      - name: Install pinned CPU-only regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: F50 source-only checkpoint byte-audit negative tests
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f50_*.py' -v
      - name: Mandatory native Yggdrasil full regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Final clean-source and no-target-outcome assertion
        shell: bash
        run: |
          set -euo pipefail
          python -B -c "import sys; sys.path.insert(0, 'research/contrib/chatgpt/QTR-01'); import f50_source_artifact_audit as a; assert a.ARTIFACT_ID == 14185250784; print('F50_4096_BYTE_AUDIT_SOURCE_ONLY=PASS')"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_SOURCE_MODEL_BYTE_AUDIT_NO_DEV_FIRST_USE=PASS

  audit-real-4096-models:
    name: F50 4096 actual-source checkpoint bytes + cold model reconstruction
    needs: [derive-atlas, full-final-regression]
    if: needs.full-final-regression.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.derive-atlas.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify retained artifact identity and exact-source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.derive-atlas.outputs.candidate_sha }}'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          python scripts/build_code_atlas.py --check
          GH_PAGER=cat gh api repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14185250784 --jq '[.id, .digest, .expired, .workflow_run.id, .workflow_run.head_sha] | @tsv' > "$RUNNER_TEMP/f50-artifact-identity.tsv"
          EXPECTED=$(printf '14185250784\tsha256:b62d6854ae47dd52db37e6523c7f68ee701df6202f2a471cd74f3fd603d199e0\tfalse\t43771961699\t4f02269f7a21d0207bfb335d1c435b9037a9d07a')
          test "$(cat "$RUNNER_TEMP/f50-artifact-identity.tsv")" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          echo F50_PINNED_ARTIFACT_IDENTITY_AND_FROZEN_CANDIDATE=PASS
      - name: Install pinned CPU tools for real checkpoint reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Fetch existing source-only role-key artifact (no fitting)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: f50-4096-complete-role-key-source-controls
          path: ${{ runner.temp }}/f50-rolekey-4096
          run-id: 43771961699
          github-token: ${{ github.token }}
      - name: Verify all 3 actual checkpoint bytes, source roles and cold models
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f50_source_artifact_audit.py --source-only --artifact-directory "$RUNNER_TEMP/f50-rolekey-4096" > "$RUNNER_TEMP/f50-4096-byte-audit.txt"
          cat "$RUNNER_TEMP/f50-4096-byte-audit.txt"
          grep -qx 'F50_REAL_4096_MODEL_BYTE_CUSTODY=PASS' "$RUNNER_TEMP/f50-4096-byte-audit.txt"
          grep -qx 'F50_2048_1024_SOURCE_MODELS=UNVERIFIED' "$RUNNER_TEMP/f50-4096-byte-audit.txt"
          grep -qx 'F50_DEV_TARGET_OUTCOMES=0' "$RUNNER_TEMP/f50-4096-byte-audit.txt"
          test -z "$(git status --porcelain)"
          echo F50_4096_REAL_WEIGHTS_ACTUAL_BYTE_AUDIT_AND_NO_FIRST_USE=PASS

  fit-lower-source-banks:
    name: F50 source-only 2048 then 1024, bounded budgets and complete receipts
    needs: [derive-atlas, full-final-regression, audit-real-4096-models]
    if: >-
      needs.derive-atlas.result == 'success' &&
      needs.full-final-regression.result == 'success' &&
      needs.audit-real-4096-models.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: research/contrib/chatgpt/QTR-01
      F50_SOURCE_CANDIDATE_SHA: ${{ needs.derive-atlas.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.derive-atlas.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce exact source role, frozen protocol and high-first 4096 qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$F50_SOURCE_CANDIDATE_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_source_fit.py)" = 'cb4fbf8ebf26cb2feded2bc0c9ee2ae6b9de877c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_conventional_controls.py)" = '01c3b1d0540af5911518850cf30b5b7522425a98'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          echo F50_4096_FULL_SOURCE_CUSTODY_REQUIRED_AND_VERIFIED_BY_NEEDS=PASS
      - name: Install pinned source-only CPU fitting libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Train source-only 2048 then 1024 without target outcomes or resampling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f50-lower-source"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          from hashlib import sha256
          import f50_source_fit as fit
          import f50_worlds as world
          world.freeze()
          assert world.BANK_SIZES == (4096,2048,1024)
          assert world.PREREG_BLOB == "4bd3c4e0d3de0e3910094e38c14a0141c97ad380"
          root=Path(os.environ["RUNNER_TEMP"])/"f50-lower-source"
          sha=os.environ["F50_SOURCE_CANDIDATE_SHA"]
          for size,budget in ((2048,1200),(1024,600)):
              folder=root/str(size)
              receipt=fit.run(size,folder,sha,budget_seconds=budget)
              assert receipt["schema"] == fit.SCHEMA
              assert receipt["source_commit"] == sha
              assert receipt["frozen_prereg_blob"] == world.PREREG_BLOB
              assert receipt["size"] == size
              assert receipt["source"]["fit_laws"] == size*4//5
              assert receipt["source"]["validation_laws"] == size-size*4//5
              assert receipt["source"]["size"] == size
              assert receipt["target_outcomes"] == 0 and receipt["scientific_pass"] is False
              assert [m["kind"] for m in receipt["models"]] == list(fit.KINDS[:len(receipt["models"])])
              assert receipt["status"] in ("ALL_THREE_SOURCE_ONLY_TRAINED","RESOURCE_STOP")
              for m in receipt["models"]:
                  path=folder/m["checkpoint"]
                  content=path.read_bytes()
                  assert sha256(content).hexdigest() == m["sha256"]
                  model,meta=fit.load_checkpoint(path,m["sha256"],sha,
                      expected_kind=m["kind"],expected_size=size)
                  assert model is not None and meta["no_target_first_use"] is True
                  assert meta["model_training"]["source_training_complete"] is True
                  assert meta["model_training"]["status"] == "TRAINED_SOURCE_ONLY"
                  assert meta["source_data_sha256"] == receipt["source"]["source_data_sha256"]
              print(f"F50_SOURCE_SIZE_{size}_STATUS={receipt['status']}",flush=True)
              print(f"F50_SOURCE_SIZE_{size}_MODELS={len(receipt['models'])}",flush=True)
              print(f"F50_SOURCE_SIZE_{size}_FIT_LAWS={receipt['source']['fit_laws']}",flush=True)
              print(f"F50_SOURCE_SIZE_{size}_VALIDATION_LAWS={receipt['source']['validation_laws']}",flush=True)
              print(f"F50_SOURCE_SIZE_{size}_TARGET_OUTCOMES=0",flush=True)
              if receipt["status"]=="RESOURCE_STOP":
                  print(f"F50_LOWER_SOURCE_RESOURCE_STOP_AT={size}",flush=True)
                  break
          else:
              print("F50_ALL_2048_AND_1024_SOURCE_CONTROLS_FITTED_AND_COLD_VERIFIED=PASS",flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: f50-2048-1024-source-only-after-4096-custody
          path: ${{ runner.temp }}/f50-lower-source/
          retention-days: 30
          if-no-files-found: warn
      - name: Confirm clean checkout and no F50 target first-use
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_LOWER_BANK_SOURCE_ONLY_NO_DEV_FIRST_USE=PASS
