name: QTR-01 F50 Bayesian public-control source-only qualification
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  derive-atlas:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'feat(qtr): F50 Bayesian source-only controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.generate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source-only changed-file scope and freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          expected="$(printf '%s\n' .github/workflows/qtr01-f50-bayesian-qualification.yml research/contrib/chatgpt/QTR-01/f50_bayesian_controls.py research/contrib/chatgpt/QTR-01/test_f50_bayesian_controls.py | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path('research/contrib/chatgpt/QTR-01')
          for name in ('f50_bayesian_controls.py', 'test_f50_bayesian_controls.py'):
              ast.parse((root/name).read_text())
          print('F50_BAYESIAN_SYNTAX_AND_FROZEN_CUSTODY=PASS')
          PY
          test -z "$(git status --porcelain)"
      - name: Generate source-derived G29 atlas companion
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --cached --quiet && exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(qtr): derive F50 Bayesian source G29 atlas companion'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-final-regression:
    needs: derive-atlas
    if: needs.derive-atlas.result == 'success'
    name: F50 Bayesian exact-SHA regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Windows byte-stable checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.derive-atlas.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pinned derived tree, frozen protocol and no target first use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.derive-atlas.outputs.candidate_sha }}'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f50_prereg.json)" = '4bd3c4e0d3de0e3910094e38c14a0141c97ad380'
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
      - name: Install pinned CPU-only regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: F50 Bayesian and all focused F50 tests with synthetic public labels only
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f50_*.py' -v
      - name: Mandatory native Yggdrasil full regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Mandatory full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Final clean-source and no-target-outcome assertion
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f50_bayesian_controls.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F50_BAYESIAN_ENGINEERING_NO_DEV_FIRST_USE=PASS
