name: Mass CS18 original POPGym public relevance signal qualification
on:
  push:
    branches:
      - research/mass-cs18-popgym-relevance-sufficiency-20261023
permissions:
  contents: read
jobs:
  original-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Freeze original prereg and prospective pre-source role correction; forbid old native edits
        shell: bash
        run: |
          set -euo pipefail
          first=cc4ddbba70b411b85f7b1e1d602a4a503c2dadf2
          parent=2ca6a0b1ab2b328fa8694ef851ba53cebf17f620
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS18_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git hash-object research/native/itd01/r7/native_cells.py)" = "4c492a494ac5b25d5e9c49b98185be6a2c966b2f"
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;g=set(sys.stdin.read().splitlines());w={"research/native/itd01/mass_r10/CS18_PREREG.md","research/native/itd01/mass_r10/CS18_SEED_CORRIGENDUM.md","research/native/itd01/mass_r10/run_cs18_popgym_relevance_screen.py","research/native/itd01/mass_r10/test_cs18_popgym_relevance_screen.py",".github/workflows/mass-cs18-popgym-relevance.yml"};assert g==w,(g,w)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/POPgym-original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only original CountRecall Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cs18-evidence
          timeout 180s python -m pip install --no-cache-dir --timeout 35 --retries 1 'numpy==1.26.4' 'gymnasium==0.29.1' 2>&1 | tee cs18-evidence/source-dependencies.log
      - name: Audit disjoint roles and original source-free scope before source episodes
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs18_popgym_relevance_screen.py 2>&1 | tee cs18-evidence/pre-source-tests.log
      - name: Call genuine original CountRecall original source 48960 legal times
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs18_popgym_relevance_screen.py --upstream external/POPgym-original --out cs18-evidence
      - name: Preserve original source evidence, including negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs18-original-POPgym-information-sufficiency
          path: cs18-evidence/
          retention-days: 30
