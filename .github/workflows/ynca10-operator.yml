name: YNCA10 frozen transfer-operator first-use B
on:
  push:
    branches:
      - research/ynca10-transfer-operator-memory-20261118
    paths:
      - .github/workflows/ynca10-operator.yml
permissions:
  contents: read
jobs:
  exact-source-B:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prevent line-ending mutation
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen source and run only A-focused controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json,hashlib,pathlib
          base=pathlib.Path('research/contrib/chatgpt/YNCA-10')
          d=json.loads((base/'prereg.json').read_bytes())
          source=hashlib.sha256((base/'experiment.py').read_bytes()).hexdigest()
          tests=hashlib.sha256((base/'test_experiment.py').read_bytes()).hexdigest()
          assert source=='6b2f04ebe91ceccd47f675d67a3ade649d5fd030384bcad0aeded0b2180ef305'
          assert tests=='c11d7e6d202bfac4e41850da67e9608ef0680a9331d419f53e982f44d8344387'
          assert d['frozen_design']['source_sha256']==source
          assert d['frozen_design']['test_sha256']==tests
          assert d['frozen_design']['source_commit_sha']=='50642f920d28560971449c76aa9ad6327b10f50d'
          print('YNCA10_SOURCE_LOCK_PASS',source,tests)
          PY
          python -B -m unittest discover -s research/contrib/chatgpt/YNCA-10 -p 'test_*.py' -v
      - name: One original independent B evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/YNCA-10/experiment.py --split B > "$RUNNER_TEMP/ynca10-primary.json"
          python - "$RUNNER_TEMP/ynca10-primary.json" <<'PY'
          import json,base64,hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          raw=p.read_bytes().replace(b'\r\n',b'\n')
          p.write_bytes(raw)
          d=json.loads(raw)
          assert d['split']=='B' and d['worlds_train']==48 and d['worlds_test']==128
          assert d['interventions_per_train_world']==5 and d['interventions_per_test_world']==3
          assert d['compressed_memory_entries']==8 and d['full_bayes_entries']==256
          assert d['operator_table_count']==256 and d['novel_table_count']==210
          assert set(d['metrics'])=={'UNTRAINED_EXACT','KNOWN_LIBRARY','FITTED_FREQUENCY','EXACT_HIERARCHICAL_BAYES','EXACT_GENERATOR_BAYES','COMPACT_LEARNED','PRIVILEGED_ORACLE'}
          assert not any(d['claims'].values())
          print('YNCA10_B_SHA256',hashlib.sha256(raw).hexdigest())
          print('YNCA10_B_METRICS',json.dumps(d,sort_keys=True,separators=(',',':')))
          print('YNCA10_B64',base64.b64encode(raw).decode('ascii'))
          PY
          test -z "$(git status --porcelain)"
      - name: Independent new-process cold restore of learned operator memory
        shell: bash
        env:
          PYTHONPATH: research/contrib/chatgpt/YNCA-10
        run: |
          set -euo pipefail
          python -B - "$RUNNER_TEMP/operator-memory.json" <<'PY'
          import experiment as m,json,sys,pathlib
          learned=m.compress(m.train_posterior('B'))
          w=next(m.generate_worlds('B',False))
          expected=m.predict(learned,w['observations'])
          pathlib.Path(sys.argv[1]).write_text(json.dumps({'weights':{str(k):v for k,v in learned.items()},'expected':expected},sort_keys=True),encoding='utf-8')
          PY
          python -B - "$RUNNER_TEMP/operator-memory.json" <<'PY'
          import experiment as m,json,sys,pathlib
          saved=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          memory={int(k):v for k,v in saved['weights'].items()}
          w=next(m.generate_worlds('B',False))
          assert len(memory)==8
          assert tuple(saved['expected'])==m.predict(memory,w['observations'])
          print('YNCA10_COLD_NEW_PROCESS_RESTORE_PASS',len(memory))
          PY
      - name: Preserve original output and exact compressed memory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ynca10-original-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ynca10-primary.json
            ${{ runner.temp }}/operator-memory.json
          if-no-files-found: warn
          retention-days: 30
