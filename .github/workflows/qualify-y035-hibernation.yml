name: Yggdrasil Y035 hibernation original qualification
on:
  push:
    branches: [research/y035-hibernation-reactivation-r1]
permissions:
  contents: read
jobs:
  original-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable parent, prereg, and original science source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bde98bd5406fd9b4ff3b37df039f501f71019f7b HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y034-capacity/execute.py)" = a8d7ae550a54918aca6c8c6a37918dec5367e926
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-hibernation/prereg.json)" = 8187e69a3d939556371eb4cd66ad073e0e816832
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-hibernation/execute.py)" = e52098ccdfdd4185fbe1dea7ed24ddc3ce4092c9
          python3 -m json.tool research/contrib/chatgpt/20261013-y035-hibernation/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y035-hibernation/execute.py
      - name: First-use frozen original experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y035-hibernation/execute.py > /tmp/Y035-original.json
          python3 -m json.tool /tmp/Y035-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y035-original-frozen
          path: /tmp/Y035-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
