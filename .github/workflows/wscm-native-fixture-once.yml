name: WSCM source-free native fixture qualification (one shot)
on:
  push:
    branches: [research/wscm-native-fixture-gate-20261122]
    paths:
      - '.github/workflows/wscm-native-fixture-once.yml'
permissions:
  contents: read
  actions: read
jobs:
  focused-windows:
    if: ${{ github.sha == '0e300ffad5cf248c822a0f45af48ac15b554a20c' }}
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
    steps:
      - name: Checkout exact source without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Enforce source custody and forbid original-source drift
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          if ('${{ github.ref_name }}' -cne 'research/wscm-native-fixture-gate-20261122') {throw 'WSCM_QUALIFICATION_WRONG_BRANCH'}
          $head=(& git.exe rev-parse HEAD).Trim()
          if ($head -cne '${{ github.sha }}') {throw 'WSCM_QUALIFICATION_SHA_DRIFT'}
          & git.exe merge-base --is-ancestor e6fcb51aa1d6a0005e2397cd70ff72ab6ab44d0f HEAD
          if ($LASTEXITCODE -ne 0) {throw 'WSCM_NATIVE_CANDIDATE_NOT_ANCESTOR'}
          $blobs=@{
            'yggdrasil/native_episode_experience.py'='7c3f35cbaf77ddd507070b719b9de957f4aa4802'
            'yggdrasil/native_cumulative_learner.py'='6dc5107530e1e38b5c412ead15bd5e1b5bad4a39'
            'yggdrasil/native_causal_amalgam.py'='8088274e464b4f20c2e2aa1d2c659629b8fc91b4'
            'tests/test_wscm_cumulative_fixture_replay.py'='03d0bdc1c261271404ebeacb1ffdbcc6cd324cd1'
            'tests/test_native_episode_external_fixture_envelope.py'='8ff834cc0d2dc482521ee7705c8799cebf299a28'
          }
          foreach($p in $blobs.Keys){
            $found=(& git.exe rev-parse ('HEAD:'+$p)).Trim()
            if($LASTEXITCODE -ne 0 -or $found -cne $blobs[$p]){throw ('WSCM_SOURCE_BLOB_DRIFT:'+ $p)}
          }
          Write-Host ('WSCM_SOURCE_SHA='+$head)
          Write-Host 'WSCM_SOURCE_PROVENANCE=PASS'
      - name: Execute bounded synthetic fixture native tests; never touch original worlds
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $candidates=@(
            'C:\ProgramData\CKBR\research-sidecar-yggdrasil\python312\python.exe',
            'C:\Program Files\Python312\python.exe',
            'C:\Python312\python.exe'
          )
          $python=$null
          foreach($p in $candidates){if(Test-Path -LiteralPath $p -PathType Leaf){$python=$p;break}}
          if(-not $python){$found=Get-Command python.exe -ErrorAction SilentlyContinue;if($found){$python=$found.Source}}
          if(-not $python){throw 'WSCM_RUNNER_PYTHON312_UNAVAILABLE'}
          & $python -B -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          if($LASTEXITCODE -ne 0){throw 'WSCM_RUNNER_PYTHON_VERSION_INVALID'}
          # This existing fourteen-test fixture gate is standard-library-only.
          # Execute it before provisioning any optional solver dependency.
          $sourceRoot=(Resolve-Path '.').Path
          $solverPath=$sourceRoot
          $testCode='import sys,unittest;sys.path.insert(0,sys.argv[1]);sys.path.insert(0,sys.argv[2]);result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover(sys.argv[3],pattern=sys.argv[4]));sys.exit(0 if result.wasSuccessful() else 1)'
          Write-Host 'WSCM_NATIVE_SUITE=test_native_episode_external_fixture_envelope.py'
          & $python -B -c $testCode $sourceRoot $solverPath (Join-Path $sourceRoot 'tests') test_native_episode_external_fixture_envelope.py
          if($LASTEXITCODE -ne 0){throw 'WSCM_CHILD_FIXTURE_TESTS_FAILED'}
          & $python -B -c 'import numpy'
          if($LASTEXITCODE -ne 0){throw 'WSCM_RUNNER_NUMPY_MISSING'}
          Write-Host 'WSCM_NUMPY_IMPORT=PASS'
          & $python -B -c 'import scipy'
          if($LASTEXITCODE -ne 0){
            # Installed into run-scoped temporary files only. Existing frozen
            # CI uses scipy 1.16.3; public PyPI binary wheel, no paid API.
            $deps=Join-Path $env:RUNNER_TEMP ('wscm-solver-'+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Path $deps -Force | Out-Null
            & $python -B -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps --target $deps scipy==1.16.3
            if($LASTEXITCODE -ne 0){throw 'WSCM_RUNNER_SCIPY_INSTALL_FAILED'}
            $solverPath=$deps
          }
          & $python -B -c 'import sys; sys.path.insert(0,sys.argv[1]); import numpy,scipy' $solverPath
          if($LASTEXITCODE -ne 0){throw 'WSCM_RUNNER_SOLVER_IMPORT_FAILED'}
          Write-Host 'WSCM_SOLVER_IMPORT=PASS'
          # The existing embedded CPython lacks venv, and its _pth isolation
          # causes subprocesses to lose test imports. Copy it into RUNNER_TEMP;
          # modify only that disposable copy, never the runner installation.
          $portableDir=Join-Path $env:RUNNER_TEMP ('wscm-native-interpreter-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item -Path (Join-Path (Split-Path -Parent $python) '*') -Destination $portableDir -Recurse -Force
          $portable=Join-Path $portableDir (Split-Path -Leaf $python)
          if(-not(Test-Path -LiteralPath $portable -PathType Leaf)){throw 'WSCM_PORTABLE_PYTHON_MISSING'}
          $pthFiles=@(Get-ChildItem -LiteralPath $portableDir -Filter '*._pth' -File)
          if($pthFiles.Count -gt 1){throw 'WSCM_PORTABLE_PTH_AMBIGUOUS'}
          if($pthFiles.Count -eq 1){
            $pth=$pthFiles[0].FullName
            $utf8=New-Object System.Text.UTF8Encoding($false)
            [IO.File]::AppendAllText($pth,([Environment]::NewLine+$sourceRoot+[Environment]::NewLine+$solverPath+[Environment]::NewLine),$utf8)
          }
          $env:PYTHONPATH=$sourceRoot+[IO.Path]::PathSeparator+$solverPath
          & $portable -B -c 'import yggdrasil.native_cumulative_learner, scipy, sys; print(''WSCM_PORTABLE_EXECUTABLE='' + sys.executable)'
          if($LASTEXITCODE -ne 0){throw 'WSCM_PORTABLE_PARENT_IMPORT_FAILED'}
          $probe='import subprocess,sys; p=subprocess.run([sys.executable,''-B'',''-c'',''import yggdrasil.native_cumulative_learner, scipy; print(1234)''],capture_output=True,text=True);print(p.stdout,p.stderr);sys.exit(p.returncode if p.returncode else (0 if p.stdout.strip()==''1234'' else 1))'
          & $portable -B -c $probe
          if($LASTEXITCODE -ne 0){throw 'WSCM_PORTABLE_CHILD_IMPORT_FAILED'}
          $python=$portable
          Write-Host 'WSCM_COLD_PYTHON_IMPORT=PASS'
          $suites=@(
            'test_wscm_cumulative_fixture_replay.py',
            'test_native_cumulative_learner.py',
            'test_native_jepa2_multilearner.py'
          )
          $failed=@()
          foreach($suite in $suites){
            Write-Host ('WSCM_NATIVE_SUITE='+$suite)
            & $python -B -c $testCode $sourceRoot $solverPath (Join-Path $sourceRoot 'tests') $suite
            if($LASTEXITCODE -ne 0){$failed+=($suite+':'+$LASTEXITCODE)}
          }
          if($failed.Count -gt 0){throw ('WSCM_NATIVE_FOCUSED_FAILURES='+($failed -join ','))}
          & git.exe diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'WSCM_TEST_WORKTREE_CHANGED'}
          $dirty=@(& git.exe status --porcelain)
          if($dirty.Count -ne 0){throw ('WSCM_TEST_WORKTREE_DIRTY='+($dirty -join ','))}
          Write-Host 'WSCM_SOURCE_FREE_FOCUSED_TESTS=PASS'
      - name: Windows-platform eligible regression (keep Unix tests separate)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'; Set-StrictMode -Version 3.0
          $root=(Resolve-Path '.').Path
          $dir=Join-Path $env:RUNNER_TEMP ('wscm-native-interpreter-'+$env:GITHUB_RUN_ID)
          $python=Join-Path $dir 'python.exe'
          if(-not(Test-Path -LiteralPath $python -PathType Leaf)){throw 'WSCM_PORTABLE_PYTHON_MISSING'}
          $deps=Join-Path $env:RUNNER_TEMP ('wscm-solver-'+$env:GITHUB_RUN_ID)
          $env:PYTHONPATH=$root+[IO.Path]::PathSeparator+$deps
          $env:OPENBLAS_NUM_THREADS='1'; $env:OMP_NUM_THREADS='1'; $env:MKL_NUM_THREADS='1'
          $sha=(& git.exe rev-parse HEAD).Trim()
          if($sha -cne '${{ github.sha }}'){throw 'WSCM_WINDOWS_SOURCE_SHA_DRIFT'}
          Write-Host ('WSCM_WINDOWS_ELIGIBLE_SHA='+$sha)
          # Keep Windows without POSIX resource. This preserves free fanout's
          # existing fail-closed resource guard; do not inject a fake getrusage.
          $windowsCode=@'
          import sys, unittest
          sys.path.insert(0, sys.argv[1])
          class PlatformLoader(unittest.TestLoader):
              def _match_path(self, path, full_path, pattern):
                  if path in {'test_wscm_epoch01.py','test_wscm_epoch02.py'}:
                      return False
                  return super()._match_path(path, full_path, pattern)
          def leaves(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from leaves(item)
                  else:
                      yield item
          cases=list(leaves(PlatformLoader().discover(sys.argv[2],pattern='test_*.py')))
          skipped='test_code_atlas.G29.test_source_and_pinned_artifact'
          assert sum(t.id()==skipped for t in cases)==1, ('WSCM_ATLAS_GUARD',len(cases))
          eligible=[t for t in cases if t.id()!=skipped]
          assert len(eligible)==505, ('WSCM_WINDOWS_COVERAGE_DRIFT',len(eligible))
          print('WSCM_WINDOWS_ATLAS_SNAPSHOT_EXCLUDED_ON_TEST_ONLY_BRANCH',flush=True)
          print('WSCM_WINDOWS_POSIX_IMPORT_TESTS_DEFERRED_TO_LINUX=19',flush=True)
          print('WSCM_WINDOWS_ELIGIBLE_TESTS='+str(len(eligible)),flush=True)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(eligible))
          print('WSCM_WINDOWS_ELIGIBLE='+('PASS' if result.wasSuccessful() else 'FAIL'),flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          '@
          & $python -B -c $windowsCode $root (Join-Path $root 'tests')
          if($LASTEXITCODE -ne 0){throw 'WSCM_WINDOWS_ELIGIBLE_TESTS_FAILED'}
          # Import-only EPOCH unit tests are safe on Windows when the missing
          # Unix module rejects *all calls*, not when fabricated RSS is supplied.
          $epochCode=@'
          import sys,types,unittest
          class UnsupportedUnixResource(types.ModuleType):
              def __getattr__(self,name):
                  raise RuntimeError('WSCM_POSIX_RESOURCE_OPERATION_FORBIDDEN:'+name)
          sys.modules['resource']=UnsupportedUnixResource('resource')
          sys.path.insert(0,sys.argv[1])
          def leaves(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite):
                      yield from leaves(item)
                  else:
                      yield item
          suite=unittest.defaultTestLoader.discover(sys.argv[2],pattern='test_wscm_epoch0?.py')
          cases=list(leaves(suite))
          assert len(cases)==19, ('WSCM_WINDOWS_EPOCH_TEST_COVERAGE_DRIFT',len(cases))
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cases))
          print('WSCM_WINDOWS_EPOCH_IMPORT_ONLY='+('PASS' if result.wasSuccessful() else 'FAIL'),flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          '@
          & $python -B -c $epochCode $root (Join-Path $root 'tests')
          if($LASTEXITCODE -ne 0){throw 'WSCM_WINDOWS_EPOCH_IMPORT_ONLY_TESTS_FAILED'}
          & git.exe diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'WSCM_WINDOWS_WORKTREE_CHANGED'}
          if(@(& git.exe status --porcelain).Count){throw 'WSCM_WINDOWS_WORKTREE_DIRTY'}
          Write-Host 'WSCM_WINDOWS_PLATFORM_TESTS=PASS'
          Write-Host 'WSCM_FULL_CROSS_PLATFORM_ACCEPTANCE=UNVERIFIED'
  linux-source-regression:
    if: ${{ github.sha == '0e300ffad5cf248c822a0f45af48ac15b554a20c' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Exact source custody on free public Linux runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify baseline and unchanged native source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e6fcb51aa1d6a0005e2397cd70ff72ab6ab44d0f HEAD
          test "$(git rev-parse HEAD:yggdrasil/native_episode_experience.py)" = 7c3f35cbaf77ddd507070b719b9de957f4aa4802
          test "$(git rev-parse HEAD:yggdrasil/native_cumulative_learner.py)" = 6dc5107530e1e38b5c412ead15bd5e1b5bad4a39
          test "$(git rev-parse HEAD:yggdrasil/native_causal_amalgam.py)" = 8088274e464b4f20c2e2aa1d2c659629b8fc91b4
          test "$(git rev-parse HEAD:tests/test_wscm_epoch02.py)" = 6fb699159609b893afe77de4c2b3b52d0a8cc35a
          echo "WSCM_LINUX_SOURCE_CUSTODY=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact native solver versions (public binaries)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: All Linux source-free tests except qualification-branch atlas snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import unittest,sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root))
          def leaves(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite):
                      yield from leaves(item)
                  else:
                      yield item
          cases=list(leaves(unittest.defaultTestLoader.discover(str(root/'tests'),pattern='test_*.py')))
          atlas='test_code_atlas.G29.test_source_and_pinned_artifact'
          assert sum(x.id()==atlas for x in cases)==1, ('WSCM_LINUX_ATLAS_GUARD',len(cases))
          eligible=[x for x in cases if x.id()!=atlas]
          assert len(eligible)==524, ('WSCM_LINUX_COVERAGE_DRIFT',len(eligible))
          print('WSCM_LINUX_ELIGIBLE_TESTS='+str(len(eligible)),flush=True)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(eligible))
          print('WSCM_LINUX_ELIGIBLE='+('PASS' if result.wasSuccessful() else 'FAIL'),flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo "WSCM_LINUX_SOURCE_FREE_REGRESSION=PASS"

  archived-linux:
    name: archived-native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout exact original WSCM source, no credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify original WSCM source ancestry and immutable blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e6fcb51aa1d6a0005e2397cd70ff72ab6ab44d0f HEAD
          test "$(git rev-parse HEAD:yggdrasil/native_episode_experience.py)" = 7c3f35cbaf77ddd507070b719b9de957f4aa4802
          test "$(git rev-parse HEAD:tests/test_wscm_archived_cold01.py)" = 3fa20913cc58f6b310ec4eba78b50ad200659891
          test "$(git rev-parse HEAD:tests/test_wscm_structural01.py)" = 93974f6c9eb7ea8bbcec8d14fa84df9320c85817
          test "$(git rev-parse HEAD:tests/test_wscm_versioned02.py)" = 711dc777953322248207b555d4cb19ccc5d49d8d
          echo WSCM_ARCHIVED_SOURCE_BLOBS=PASS
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve artifact parent workflow run, read-only
        id: archive-meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B - <<'PY'
          import os,json,urllib.request
          url="https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14492525071"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"Yggdrasil-WSCM-archive-readonly"})
          with urllib.request.urlopen(req,timeout=20) as res: a=json.load(res)
          assert a["id"]==14492525071 and not a["expired"] and a["workflow_run"]["id"]>0, "WSCM_ARCHIVED_ARTIFACT_METADATA_INVALID"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as fd: fd.write("run_id="+str(a["workflow_run"]["id"])+"\n")
          print("WSCM_ARCHIVED_ARTIFACT_META=PASS",a["id"],a["workflow_run"]["id"])
          PY

      - name: Download exact historical artifact by verified workflow-run custody
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14492525071'
          run-id: ${{ steps.archive-meta.outputs.run_id }}
          repository: spoonman136668-ai/Yggdrasil
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/wscm-archived-14492525071

      - name: Authentic 1025-witness archived cold and structural tests
        shell: bash
        env:
          WSCM_ARCHIVED_JOINT_PATH: ${{ runner.temp }}/wscm-archived-14492525071/amalgam-joint-state.json
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import os,sys,json,hashlib,unittest
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root))
          p=Path(os.environ["WSCM_ARCHIVED_JOINT_PATH"])
          assert p.is_file(),"WSCM_ARCHIVE_NOT_DOWNLOADED"
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="576370a1963158f7dc43099360f491eb6a1e49355448922943b6bde374d484c8","WSCM_ARCHIVE_JOINT_SHA_DRIFT"
          joint=json.loads(raw)
          native=joint["native_ascii"].encode("ascii")
          assert hashlib.sha256(native).hexdigest()=="5720151e18b52f7219763027c2ad9c7c37476e099b4334e42417615adb7f959d","WSCM_ARCHIVE_NATIVE_SHA_DRIFT"
          experience=json.loads(json.loads(native)["experience_ascii"])
          assert len(experience["episodes"])==1025 and experience["state_sha256"]=="3c6433c9e60a0f7e6b750327ae7b705984fb20b25e8bd04fe16a3e9a31c9dde8","WSCM_ARCHIVE_EPISODE_CUSTODY"
          receipt=json.loads(p.with_name("amalgam-joint.json").read_bytes())
          assert receipt["joint_checkpoint_sha256"]==hashlib.sha256(raw).hexdigest() and receipt["held_worlds_scored"]==0 and receipt["native_episodes"]==1025,"WSCM_ARCHIVE_RECEIPT_MISMATCH"
          print("WSCM_ARCHIVED_1025_SOURCE_CUSTODY=PASS",flush=True)
          patterns=("test_wscm_archived_cold01.py","test_wscm_structural01.py","test_wscm_versioned02.py")
          total=0
          for pat in patterns:
              suite=unittest.defaultTestLoader.discover(str(root/"tests"),pattern=pat)
              print("WSCM_ARCHIVED_SUITE="+pat,flush=True)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              total+=result.testsRun
              assert result.wasSuccessful() and not result.skipped and result.testsRun>=2,("WSCM_ARCHIVED_SOURCE_TEST_FAILURE",pat,result.testsRun,len(result.skipped))
          print("WSCM_ARCHIVED_NATIVE_TESTS_NO_SKIPS=PASS",total,flush=True)
          PY
      - name: Frozen EPOCH-02 source-only artifact preflight, no seed exposure
        shell: bash
        env:
          WSCM_ARCHIVED_JOINT_PATH: ${{ runner.temp }}/wscm-archived-14492525071/amalgam-joint-state.json
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import os,subprocess,shutil,sys
          from pathlib import Path
          root=Path.cwd(); original="86264b41a08d49f558418c0fba367f3a2636befa"
          dst=Path(os.environ["RUNNER_TEMP"])/("wscm-frozen-native-"+os.environ["GITHUB_RUN_ID"])
          assert not dst.exists(),"WSCM_FROZEN_SOURCE_DEST_OCCUPIED"
          subprocess.run(["git","worktree","add","--detach",str(dst),original],check=True,stdout=subprocess.DEVNULL)
          try:
              assert subprocess.check_output(["git","-C",str(dst),"rev-parse","HEAD:yggdrasil/native_episode_experience.py"],text=True).strip()=="5a18b00a4c4131526e71f51d63dfd9eb9471c81e","WSCM_FROZEN_NATIVE_BLOB_DRIFT"
              for rel in ("research/contrib/chatgpt/WSCM-EPOCH-01/experiment.py","research/contrib/chatgpt/WSCM-EPOCH-02/sealed_runner.py","research/contrib/chatgpt/WSCM-EPOCH-02/prereg.json"):
                  a=root/rel; b=dst/rel
                  assert a.is_file(),"WSCM_SOURCE_FIXTURE_MISSING"
                  b.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(a,b)
              code="""import sys
          from pathlib import Path
          from importlib.util import module_from_spec,spec_from_file_location
          root=Path.cwd(); s=root/"research/contrib/chatgpt/WSCM-EPOCH-02/sealed_runner.py"
          spec=spec_from_file_location("wscm_epoch02_frozen",s); mod=module_from_spec(spec);spec.loader.exec_module(mod)
          result=mod.source_preflight(Path(sys.argv[1]),mod.git_blob(s.read_bytes()))
          assert result["original_joint_sha256"]=="576370a1963158f7dc43099360f491eb6a1e49355448922943b6bde374d484c8"
