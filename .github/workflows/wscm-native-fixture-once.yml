  archived-windows:
    name: archived-native-windows
    runs-on: [self-hosted, Windows, X64, yggdrasil, research-only]
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Verify immutable source and select preexisting isolated Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $sha=(& git.exe rev-parse HEAD).Trim()
          if($sha -cne '${{ github.sha }}'){throw 'WSCM_ARCHIVED_SHA_DRIFT'}
          & git.exe merge-base --is-ancestor e6fcb51aa1d6a0005e2397cd70ff72ab6ab44d0f HEAD
          if($LASTEXITCODE -ne 0){throw 'WSCM_ARCHIVED_WRONG_SOURCE_ANCESTRY'}
          $blob=(& git.exe rev-parse HEAD:yggdrasil/native_episode_experience.py).Trim()
          if($blob -cne '7c3f35cbaf77ddd507070b719b9de957f4aa4802'){throw 'WSCM_ARCHIVED_NATIVE_BLOB_DRIFT'}
          $paths=@('C:\ProgramData\CKBR\research-sidecar-yggdrasil\python312\python.exe','C:\Program Files\Python312\python.exe','C:\Python312\python.exe')
          $python=$null
          foreach($path in $paths){if(Test-Path -LiteralPath $path -PathType Leaf){$python=$path;break}}
          if(-not $python){throw 'WSCM_ARCHIVED_WINDOWS_PYTHON_MISSING'}
          & $python -B -c 'import sys; assert sys.version_info >= (3,12)'
          if($LASTEXITCODE -ne 0){throw 'WSCM_ARCHIVED_WINDOWS_PYTHON_INVALID'}
          [IO.File]::AppendAllText($env:GITHUB_ENV,('WSCM_TEST_PYTHON='+$python+[Environment]::NewLine),(New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'WSCM_ARCHIVED_WINDOWS_SOURCE=PASS'
      - name: Resolve archived GitHub Actions artifact parent
        id: archive-meta
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization='Bearer '+$env:GITHUB_TOKEN;Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Yggdrasil-WSCM-archive-readonly'}
          $m=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/14492525071' -Headers $h -Method Get
          if($m.id -ne 14492525071 -or $m.expired -or -not $m.workflow_run.id){throw 'WSCM_ARCHIVE_METADATA_INVALID'}
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,('run_id='+$m.workflow_run.id+[Environment]::NewLine),(New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'WSCM_ARCHIVE_META=PASS'

      - name: Download exact historical artifact by verified workflow-run custody
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14492525071'
          run-id: ${{ steps.archive-meta.outputs.run_id }}
          repository: spoonman136668-ai/Yggdrasil
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/wscm-archived-14492525071

      - name: Authenticate archived 1025-witness evidence and run cold tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          WSCM_ARCHIVED_JOINT_PATH: ${{ runner.temp }}/wscm-archived-14492525071/amalgam-joint-state.json
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import os,sys,json,hashlib,unittest
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root))
          p=Path(os.environ["WSCM_ARCHIVED_JOINT_PATH"])
          assert p.is_file(),"WSCM_ARCHIVE_NOT_DOWNLOADED"
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="576370a1963158f7dc43099360f491eb6a1e49355448922943b6bde374d484c8","WSCM_ARCHIVE_JOINT_SHA_DRIFT"
          joint=json.loads(raw)
          native=joint["native_ascii"].encode("ascii")
          assert hashlib.sha256(native).hexdigest()=="5720151e18b52f7219763027c2ad9c7c37476e099b4334e42417615adb7f959d","WSCM_ARCHIVE_NATIVE_SHA_DRIFT"
          experience=json.loads(json.loads(native)["experience_ascii"])
          assert len(experience["episodes"])==1025 and experience["state_sha256"]=="3c6433c9e60a0f7e6b750327ae7b705984fb20b25e8bd04fe16a3e9a31c9dde8","WSCM_ARCHIVE_EPISODE_CUSTODY"
          receipt=json.loads(p.with_name("amalgam-joint.json").read_bytes())
          assert receipt["joint_checkpoint_sha256"]==hashlib.sha256(raw).hexdigest() and receipt["held_worlds_scored"]==0 and receipt["native_episodes"]==1025,"WSCM_ARCHIVE_RECEIPT_MISMATCH"
          print("WSCM_ARCHIVED_1025_SOURCE_CUSTODY=PASS",flush=True)
          patterns=("test_wscm_archived_cold01.py","test_wscm_structural01.py","test_wscm_versioned02.py")
          total=0
          for pat in patterns:
              suite=unittest.defaultTestLoader.discover(str(root/"tests"),pattern=pat)
              print("WSCM_ARCHIVED_SUITE="+pat,flush=True)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
              total+=result.testsRun
              assert result.wasSuccessful() and not result.skipped and result.testsRun>=2,("WSCM_ARCHIVED_SOURCE_TEST_FAILURE",pat,result.testsRun,len(result.skipped))
          print("WSCM_ARCHIVED_NATIVE_TESTS_NO_SKIPS=PASS",total,flush=True)
          '@
          & $env:WSCM_TEST_PYTHON -B -c $script
          if($LASTEXITCODE -ne 0){throw 'WSCM_WINDOWS_AUTHENTIC_ARCHIVE_TEST_FAILED'}
          & git.exe diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'WSCM_ARCHIVED_WINDOWS_WORKTREE_DRIFT'}
          if(@(& git.exe status --porcelain).Count){throw 'WSCM_ARCHIVED_WINDOWS_UNTRACKED'}
          Write-Host 'WSCM_WINDOWS_ARCHIVED_GATE=PASS'

