      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact native solver versions (public binaries)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Verify committed candidate G29 atlas from its pinned ancestor
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          echo WSCM_CELL02_LINUX_COMMITTED_G29=PASS
      - name: All Linux source-free tests with actual G29 atlas test
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import unittest,sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root))
          def leaves(suite):
              for item in suite:
                  if isinstance(item,unittest.TestSuite):
                      yield from leaves(item)
                  else:
                      yield item
          cases=list(leaves(unittest.defaultTestLoader.discover(str(root/'tests'),pattern='test_*.py')))
          atlas='test_code_atlas.G29.test_source_and_pinned_artifact'
          assert sum(x.id()==atlas for x in cases)==1, ('WSCM_LINUX_ATLAS_GUARD',len(cases))
          eligible=cases
          assert len(eligible)==530, ('WSCM_LINUX_COVERAGE_DRIFT',len(eligible))
          print('WSCM_FINAL_ATLAS_ASSERTION_INCLUDED=YES',flush=True)
          print('WSCM_LINUX_ELIGIBLE_TESTS='+str(len(eligible)),flush=True)
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(eligible))
          print('WSCM_LINUX_ELIGIBLE='+('PASS' if result.wasSuccessful() else 'FAIL'),flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo "WSCM_CELL02_LINUX_EXACT_SHA_FULL_REGRESSION=PASS"

