      - name: Emit independently pinned G29 Git blob bytes in bounded numbered segments
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,subprocess
          from pathlib import Path
          from scripts import build_code_atlas as atlas
          root=Path.cwd()
          sha="f79de6ecbd2a7999c148e1c4742f64435cc0ce94"
          blobs=atlas.render(atlas.snapshot(root,sha))
          assert set(blobs)==set(atlas.OUT)
          for path in atlas.OUT:
              raw=blobs[path].encode("utf-8")
              assert (root/path).read_bytes()==raw,("WSCM_G29_WORKTREE_DRIFT",path)
              digest=hashlib.sha256(raw).hexdigest()
              gitblob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              encoded=base64.b64encode(raw).decode("ascii")
              size=16000
              pieces=[encoded[i:i+size] for i in range(0,len(encoded),size)]
              print("WSCM_CELL02_G29_BEGIN|"+path+"|"+str(len(raw))+"|"+gitblob+"|"+digest+"|"+str(len(pieces)),flush=True)
              for number,piece in enumerate(pieces):
