name: Yggdrasil Y033 frozen dormant associative-memory experiment
on:
  push:
    branches: [research/y033-dormant-associative-recall-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify scientific identity and frozen preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f119338d8cd9376a103742dc894e211d71066954 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-associative-recall/prereg.json)" = 1a12f162415fbfcd130e8ac1c99c804db364dbff
          test "$(git hash-object research/contrib/chatgpt/20261013-y033-associative-recall/execute.py)" = e91bb843e43addf6b0cae77d7fe33874056c37a9
          python3 -m json.tool research/contrib/chatgpt/20261013-y033-associative-recall/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y033-associative-recall/execute.py
      - name: First-use original dormant recall experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y033-associative-recall/execute.py > /tmp/Y033-original.json
          python3 -m json.tool /tmp/Y033-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y033-original-dormant-recall
          path: /tmp/Y033-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
