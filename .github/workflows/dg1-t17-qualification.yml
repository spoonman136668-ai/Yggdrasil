name: DG1-T17 disjoint causal transfer and portable recurrent control
on:
  push:
    branches: [research/dg1-t17-causal-transfer-20261113]
    paths:
      - 'research/contrib/chatgpt/dg1-t17-20261113/**'
      - '.github/workflows/dg1-t17-qualification.yml'
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'research/contrib/chatgpt/dg1-t17-20261113/**'
      - '.github/workflows/dg1-t17-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    name: T17 preflight and full regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify separate immutable preregistration ancestor and exact frozen identities
        shell: bash
        run: |
          git merge-base --is-ancestor a4c0ee310f12f55535f8b5dea6ab2f0b190a6fe9 HEAD
          test "$(git rev-parse a4c0ee310f12f55535f8b5dea6ab2f0b190a6fe9^)" = "5e74f8db85b2f5839c42148c0dfba69a88b1a2c9"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/contrib/chatgpt/dg1-t17-20261113")
          d=json.loads((p/"prereg.json").read_text())
          assert d["experiment_id"]=="DG1-T17-20261113"
          assert d["exact_parent_sha"]=="5e74f8db85b2f5839c42148c0dfba69a88b1a2c9"
          assert d["inputs"][0]["sha256"]=="eb975980ff8fae294128cd651e1d04f3b373f2263cdecce21b4fdffc7c21a8c4"
          assert len(d["frozen_design"]["seeds"])==16
          print("T17_FROZEN_PREREG_PASS")
          PY
      - name: Pre-first-use syntax, integer-baseline training and negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-t17-20261113/t17.py research/contrib/chatgpt/dg1-t17-20261113/test_t17.py
          python -m unittest discover -s research/contrib/chatgpt/dg1-t17-20261113 -p 'test_*.py' -v
      - name: First-use registered 16-world study on PR opening only
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/contrib/chatgpt/dg1-t17-20261113/t17.py > t17-firstuse.json
      - name: Validate physical custody and publish science verdict without making negatives fail CI
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("t17-firstuse.json").read_text())
          assert d["schema"]=="yggdrasil.dg1-t17-original.v1"
          assert d["freeze_sha"]=="a4c0ee310f12f55535f8b5dea6ab2f0b190a6fe9"
          assert d["world_count"]==16
          assert d["paid_steps"]==17920 and d["paid_training_steps"]==12800
          assert d["paid_audit_steps"]==5120 and len(d["controls"])==5
          for w in d["worlds"]:
              arms=w["arms"]
              assert len(arms)==5
              assert len({v["train_trace_sha256"] for v in arms.values()})==1
              for v in arms.values():
                  assert v["paid_steps"]==224 and v["charged_observations"]==160
                  assert len(v["cold_bytes"])==3 and max(v["cold_bytes"])<=65536
                  for mark in (128,160):
                      a=v["audits"][str(mark)]
                      assert len(a["choices"])==16
          print("T17_PHYSICAL_CUSTODY_PASS")
          print("T17_CLASSIFICATION:"+d["classification"])
          print("T17_PRIMARY:"+str(d["primary_pass"]))
          print("T17_GATES:"+json.dumps(d["primary_gates"],sort_keys=True))
          print("T17_AGGREGATES:"+json.dumps(d["aggregate"],sort_keys=True))
          PY
      - name: Regenerate source-derived G29 atlas for full inherited regression
        shell: bash
        run: |
          python scripts/build_code_atlas.py --source-commit "$(git rev-parse HEAD)" --write
      - name: Mandatory full inherited regression on source-generated atlas
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_code_atlas.py --check-if-present
      - name: Prove only derived atlas worktree files differ
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only"],text=True).splitlines())
          allowed={".ice/code-atlas.json",".ice/code-atlas.html",".ice/code-atlas.ice"}
          assert changed.issubset(allowed), sorted(changed)
          print("T17_TRACKED_SCIENCE_SOURCE_UNMODIFIED_PASS")
          PY
      - name: Store original original-source physical JSON on GitHub Actions only
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-t17-original-${{ matrix.os }}
          path: t17-firstuse.json
          if-no-files-found: ignore
  original-cross-os-parity:
    name: Original T17 Linux Windows strict non-timing and checkpoint equality
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-t17-original-ubuntu-latest
          path: original-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dg1-t17-original-windows-2022
          path: original-windows
      - name: Independently fail on any non-timing mismatch
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("original-linux/t17-firstuse.json").read_text())
          b=json.loads(Path("original-windows/t17-firstuse.json").read_text())
          def strip_timing(x):
              if isinstance(x,dict):
                  return {k:strip_timing(v) for k,v in x.items()
                          if k not in ("cpu_ns","cpu_median_ratio")}
              if isinstance(x,list):
                  return [strip_timing(v) for v in x]
              return x
          if strip_timing(a)!=strip_timing(b):
              raise AssertionError("T17_INVALID_REPRO_OR_CHECKPOINT_DRIFT")
          print("T17_ORIGINAL_CROSS_OS_EXACT_NON_TIMING_PARITY_PASS")
          PY
