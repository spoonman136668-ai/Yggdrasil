name: CKAD43 native causal recurrence development-only
on:
  push:
    branches:
      - research/ckad43-source-driven-rule-recovery-20261119
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  dev:
    if: "github.event.head_commit.message == 'ci(ckad43): frozen source development-only qualification'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Avoid line-ending rewrite
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact prereg before source and reject held first-use
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8f94cffb5e61be109038ba6f3611ee209161ce1c HEAD
          git merge-base --is-ancestor d477f4f2c4eec401c66cb6b66fffc6d78edd8a39 HEAD
          test ! -e research/contrib/chatgpt/CKAD-43/pilot_report.json
          test ! -e research/contrib/chatgpt/CKAD-43/primary_report.json
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-43'); [ast.parse(f.read_text()) for f in p.glob('*.py')]"
          python -B research/contrib/chatgpt/CKAD-43/campaign.py --mode preflight
      - name: Fixture unit tests and registered seed controls, never DEV score
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-43 -p test_ckad43.py -v
      - name: Fresh two-seed DEV only; negative science is evidence
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-43/screen_dev.py
          test -z "$(git status --porcelain)"
