name: MR34I7 Same-Host AVX512F Frozen NumPy Qualification
on:
  push:
    branches:
      - research/mr34i7-paired-avx512f-20261022
permissions:
  contents: read
concurrency:
  group: mr34i7-frozen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-original-numeric-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Preserve original Git bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout exact MR34I7 audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original unmodified S4C1 learner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: s4c1
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Farama original MiniGrid
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independent original DeepMind Pycolab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Install original Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned read-only original numerical dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Original Pycolab Windows console dependency
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Enforce separate frozen pre-workflow research custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit log -1 --format=%H -- research/mr34i7/frozen_protocol.json)" = "2d76c7d783ca50c9c491f7612ca934a3e9a7249c"
          test "$(git hash-object audit/research/mr34i4/kernel_probe.py)" = "79df5303a4278d65363d8ab17a5d832c576b8722"
          test "$(git hash-object audit/research/mr34i4/frozen_protocol.json)" = "ea88e1f1110de08973d3868b00d1f2574a16f580"
          test "$(git -C s4c1 rev-parse HEAD)" = "8e1561eb1a542e21307bac669c42435cf48e59bd"
          test "$(git -C external/minigrid rev-parse HEAD)" = "7f5853792ea7f04f75614661006d87fcf949f26d"
          test "$(git -C external/pycolab rev-parse HEAD)" = "6504c8065dd5322438f23a2a9026649904f3322a"
      - name: Pair untouched default and AVX512F-disabled original source numerics on same physical runner
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          BLIS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          set -euo pipefail
          for mode in default disable_avx512f; do
            if [ "$mode" = default ]; then
              unset NPY_DISABLE_CPU_FEATURES
            else
              export NPY_DISABLE_CPU_FEATURES=AVX512F
            fi
            echo "MR34I7_MODE_START=$mode"
            python -B -c '
          import json, os, platform, sys
          import numpy as np
          from numpy.core import _multiarray_umath as um
          features = {key: bool(val) for key, val in um.__cpu_features__.items()}
          disable = os.environ.get("NPY_DISABLE_CPU_FEATURES")
          if disable == "AVX512F" and features.get("AVX512F", False):
              raise SystemExit("MR34I7_CPU_DISABLE_INEFFECTIVE")
          if disable not in (None,"AVX512F"):
              raise SystemExit("MR34I7_INVALID_CPU_MODE")
          print("MR34I7_CPU_MODE=" + json.dumps({
              "mode": "disable_avx512f" if disable else "default",
              "disabled_requested": disable,
              "cpu_features":features, "numpy":np.__version__,
              "machine":platform.machine(), "processor":platform.processor(),
              "system":platform.system(),"release":platform.release(),
              "python":sys.version.split()[0],
              "runner_name":os.environ.get("RUNNER_NAME"),
              "runner_image":os.environ.get("ImageOS"),
              "runner_image_version":os.environ.get("ImageVersion")
          },sort_keys=True,separators=(",",":")))
          '
            python -B audit/research/mr34i4/kernel_probe.py s4c1 external/minigrid external/pycolab | tee "mr34i7-$mode.log"
            test "$(grep -c '^MR34I4_BINARY64_ORIGINAL_KERNEL_SECTION=' "mr34i7-$mode.log")" -eq 4
            grep -q '^MR34I4_ORIGINAL_SIGMOID_NUMERICAL_REFERENCE=' "mr34i7-$mode.log"
            echo "MR34I7_MODE_FINISHED=$mode"
          done
      - name: Verify original source and frozen model checkouts still clean
        shell: bash
        run: |
          set -euo pipefail
          for dir in audit s4c1 external/minigrid external/pycolab; do
            git -C "$dir" diff --exit-code
            test -z "$(git -C "$dir" status --porcelain)"
          done
