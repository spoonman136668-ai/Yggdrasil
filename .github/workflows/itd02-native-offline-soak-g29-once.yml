name: ITD-02 native offline soak G29 exact-source refresh
on:
  push:
    branches:
      - research/itd02-native-offline-soak-retail-meter-20261027
    paths:
      - .github/workflows/itd02-native-offline-soak-g29-once.yml
permissions:
  contents: write
concurrency:
  group: itd02-native-offline-soak-index-once
  cancel-in-progress: false
jobs:
  frozen-source-index:
    if: ${{ github.actor == 'spoonman136668-ai' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original native training source only gained this workflow
        shell: bash
        run: |
          set -euo pipefail
          source='db9b4f29b9ec4419b9aecf275642338aaa6b04c0'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$source" HEAD
          test "$(git rev-list --count "$source"..HEAD)" = 1
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$source" HEAD)" = '.github/workflows/itd02-native-offline-soak-g29-once.yml'
          echo 'NATIVE_OFFLINE_SOAK_EXACT_SOURCE=PASS'
      - name: Rebuild original G29 source map and prove offline native sessions
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python -B -m unittest discover -s tests -p test_itd02_native_local_soak_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_public_source_journal_dev.py -v
          python -B -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
      - name: Commit generated G29 locators only and verify original checks
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/itd02-native-offline-soak-retail-meter-20261027
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          paths="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          test "$paths" = "$expected"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(itd02): refresh source-bound offline native learner Atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:refs/heads/research/itd02-native-offline-soak-retail-meter-20261027
          echo 'NATIVE_OFFLINE_SOAK_G29_QUALIFIED=PASS'
