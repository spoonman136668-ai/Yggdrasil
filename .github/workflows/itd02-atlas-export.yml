name: ITD-02 atlas canonical reconciliation
on:
  pull_request:
    paths:
      - 'research/native/itd02/minigrid_memory_event_contract.py'
      - 'tests/test_itd02_minigrid_memory_event_contract.py'
      - 'tests/test_itd02_minigrid_memory_source_preflight.py'
      - '.github/workflows/itd02-minigrid-memory-source-preflight.yml'
      - '.github/workflows/itd02-atlas-export.yml'
      - '.ice/code-atlas.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-canonical-atlas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Rebuild canonical atlas from exact checked-out HEAD
        run: python scripts/build_code_atlas.py --write --source-commit "$(git rev-parse HEAD)"
      - name: Commit canonical generated atlas if changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
            git commit -m "G29: reconcile canonical generated source atlas"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          fi
