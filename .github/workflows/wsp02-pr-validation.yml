# WSP-02 read-only DEV regression, no schedule, no dispatch, no research first-use.
name: WSP-02 causal weight programming DEV regression
on:
  pull_request:
    branches:
      - main
      - research/wsp01-direct-weight-written-causal-20261110
    paths:
      - 'research/contrib/chatgpt/WSP-02/**'
      - '.ice/code-atlas.*'
      - '.github/workflows/wsp02-pr-validation.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate exact-source derived atlas
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Full existing repository regression
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Preserve WSP-01 original focused regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-01 -p "test_*.py" -v
      - name: WSP-02 exhaustive public DEV and negative controls
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-02 -p "test_*.py" -v
      - name: WSP-02 measured public comparison
        run: python research/contrib/chatgpt/WSP-02/run_dev.py
      - name: Reject dirty working tree
        run: git diff --exit-code
