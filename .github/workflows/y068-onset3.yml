name: Y068 immutable prospective sealed scientific validation
on:
  push:
    branches: [research/y068-onset3-early-shock-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen preregistered source gate
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/20261013-y068-early/prereg.json)" = c418c2663b73ef144b6794eb7bbe0d3a88bd4a01
          test "$(git hash-object research/contrib/chatgpt/20261013-y068-early/execute.py)" = 7c6f1ad179dcf9b0c023d8d8b334fd8ef109d770
          python3 -m json.tool research/contrib/chatgpt/20261013-y068-early/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y068-early/execute.py
      - name: Single original sealed experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y068-early/execute.py > /tmp/Y068-original.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y068-original.json'))
          assert x['sealed_heldout_seeds']==list(range(6832,6848)); assert len(x['new_onset3_comparisons'])==2
          print('CLASSIFICATION',x['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y068-original-sealed
          path: /tmp/Y068-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One complete repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
