name: ITD-02 C32 authentic physically executed R3 learned-policy FIT gate
on:
  push:
    branches:
      - research/itd02-c32-executed-effect-choice-20261025
permissions:
  contents: read
  actions: read
concurrency:
  group: itd02-c32-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-source-only-preflight:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate frozen source and native C32 action boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse b0a5e8131cbe9dba10fd164124475c8824a55200^)" = f46fdd149af4f676a17941073fe3d61aaeebbcca
          git merge-base --is-ancestor b0a5e8131cbe9dba10fd164124475c8824a55200 "$GITHUB_SHA"
          test "$(git hash-object research/mass_r7c32/PREREG.json)" = 5400dd02667db518a3de7ac3732799b492102603
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = 5348238f4ec2183bea29262659883391b5f429fd
          test "$(git hash-object research/mass_r7c31/action_bridge.py)" = fbc37f22b3a820552540a28eb97f81f32034a08a
          python -B -m unittest research.mass_r7c32.test_real_policy -v
          echo C32_FROZEN_PRE_ORIGINAL_SOURCE_PUBLIC_FIT_UNIT=PASS
          echo C32_UNIT_EXECUTED_ORIGINAL_WORLD_ACTIONS=ZERO
  physical-selected-action-worlds:
    needs: [native-source-only-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      GH_ARTIFACT_ID: '12596362847'
      GH_SOURCE_ZIP_SHA: '2e0492af74cd68f8fc9ee7d5cfffcc6a936614e23f9061457f70dcd49cf84810'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          path: research
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          fetch-depth: 0
          persist-credentials: false
          path: external/minigrid
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate frozen owner, source and original external worlds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C research hash-object research/mass_r7c32/PREREG.json)" = 5400dd02667db518a3de7ac3732799b492102603
          test "$(git -C research hash-object research/native/itd02/r3/navigator.py)" = 5348238f4ec2183bea29262659883391b5f429fd
          test "$(git -C research hash-object research/mass_r7c31/action_bridge.py)" = fbc37f22b3a820552540a28eb97f81f32034a08a
          test "$(git -C external/minigrid rev-parse HEAD)" = 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C external/minigrid hash-object minigrid/envs/fourrooms.py)" = d79f007e00f95f48284da66d760872483c02fab2
          test "$(git -C external/minigrid hash-object minigrid/envs/dynamicobstacles.py)" = 68436cecc35116c23c2f196c22fa3a19c6410b95
          echo C32_ORIGINAL_SOURCE_SHA_FROZEN=PASS
      - name: Install authentic original source MiniGrid
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./external/minigrid
      - name: Verify original 805 selected-action FIT artifact and independent producer
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c32-c28-fit" "$RUNNER_TEMP/c32-results"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/c32-fit.zip" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/$GH_ARTIFACT_ID/zip"
          echo "$GH_SOURCE_ZIP_SHA  $RUNNER_TEMP/c32-fit.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c32-fit.zip" -d "$RUNNER_TEMP/c32-c28-fit"
          python -B -m research.mass_r7c28.compare "$RUNNER_TEMP/c32-c28-fit"
          echo C32_AUTHENTIC_805_ORIGINAL_FIT_ACTIONS=PASS
      - name: Execute each learned policy's actually selected physical actions twice
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          python -B -m research.mass_r7c32.run --original-fit-dir "$RUNNER_TEMP/c32-c28-fit" --output "$RUNNER_TEMP/c32-results/process-a.json" > "$RUNNER_TEMP/c32-results/process-a.log" 2>&1 || { cat "$RUNNER_TEMP/c32-results/process-a.log"; exit 1; }
          python -B -m research.mass_r7c32.run --original-fit-dir "$RUNNER_TEMP/c32-c28-fit" --output "$RUNNER_TEMP/c32-results/process-b.json" > "$RUNNER_TEMP/c32-results/process-b.log" 2>&1 || { cat "$RUNNER_TEMP/c32-results/process-b.log"; exit 1; }
          cat "$RUNNER_TEMP/c32-results/process-a.log"
          cat "$RUNNER_TEMP/c32-results/process-b.log"
          python -B -m research.mass_r7c32.compare --first "$RUNNER_TEMP/c32-results/process-a.json" --second "$RUNNER_TEMP/c32-results/process-b.json" --output "$RUNNER_TEMP/c32-results/comparison.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo C32_ORIGINAL_POLICY_EXECUTIONS_AND_EXACT_INDEPENDENT_REPLAY=PASS
          echo C32_PROTECTED_SCIENTIFIC_FIRST_USE=FALSE
      - name: Archive actual source actions goals and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-c32-true-original-source-physical-choice-FIT
          path: ${{ runner.temp }}/c32-results/
          if-no-files-found: warn
          retention-days: 80
