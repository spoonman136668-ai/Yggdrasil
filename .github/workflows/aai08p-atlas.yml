name: AAI-08P source-locked G29 generated atlas companion
on:
  push:
    branches: [research/aai08-nsgym-nonstationary-bridge-20261114]
    paths: [.github/workflows/aai08p-atlas.yml]
permissions:
  contents: write
jobs:
  generated-only:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-08P create source-pinned G29 companion once' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate three source-pinned atlas files only
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '243cfa89248922b6c4f8df597379a12831b90d9d'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai08p-atlas.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-08P/preflight.py)" = "$(git rev-parse 40e3ce1ba7cd80411c1545e5609706a3f268c51e:research/contrib/chatgpt/AAI-08P/preflight.py)"
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-08P pinned G29 generated files only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-08P -p test_contract.py -v
          test -z "$(git status --porcelain)"
          git fetch origin research/aai08-nsgym-nonstationary-bridge-20261114
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai08-nsgym-nonstationary-bridge-20261114
          echo AAI08P_G29_PINNED_ATLAS_COMPANION_PASS
