name: ITD02 native shared genome credit diagnostic
on:
  push:
    branches: [qualification/itd02-native-crosscell-credit-20261027]
permissions:
  contents: read
jobs:
  frozen:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_SHA: a39171a76d0d7817e3563682bb139a9d7ecf37c4
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          python -B research/diagnostics/itd02_shared_genome_credit_20261027.py
          git diff --exit-code "$SOURCE_SHA" -- yggdrasil/task_runtime.py yggdrasil/developmental.py yggdrasil/itd02_native_task_bridge_dev.py
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: itd02-crosscell-${{ matrix.os }}
          path: ${{ runner.temp }}/native_crosscell_credit.json
          retention-days: 14
