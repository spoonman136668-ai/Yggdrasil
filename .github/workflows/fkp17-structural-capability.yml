name: FKP17 frozen conditional and delayed representation counterexample
on:
  push:
    branches: [ci/fkp17-structural-capability-no-go-20261115]
    paths: [.github/workflows/fkp17-structural-capability.yml]
permissions:
  contents: write
concurrency:
  group: fkp17-structural-capability-no-go-20261115
  cancel-in-progress: false
jobs:
  source-only-atlas:
    if: >-
      github.event.head_commit.message == 'ci(FKP-17): one shot frozen relationship representation counterexample only' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    env:
      SOURCE: 77052eb949660f0452c1218f2dbdb5cea89c469c
      TARGET: research/fkp17-structured-prior-novel-causal-law-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep native Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 77052eb949660f0452c1218f2dbdb5cea89c469c
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned free CPU gradient reference for source-only tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
      - name: Assert exact frozen source and preregistration before tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor fe5e259d24100c03b5de8184090e3d6f56fcb7e3 "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/prereg.json)" = 17d676c9374060515c7ebee2e2fdc262a884343c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/source_fixture.py)" = 8da7aa4a0892f2277bccca610bd2ad0b5cf9fcb3
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_source_fixture.py)" = 1614a0880b6ae199e3a6efb8908571bb8a2c679d
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/public_policies.py)" = a8837bf7edfc0a229b43c4bd97faa9de4bfadcf0
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_public_policies.py)" = ca3413d2105add3403dd8156dee90aa2e7c8f684
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/README.md)" = e79144054315de68479f1b641f9a225f78fa4e01
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_prereg.py)" = 7f5b11339b4464459b7590a5fbd3b08cdae4aa53
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/structural_capability_probe.py)" = 6b1097110b5e27afec3d3110e0759efa02cfef7d
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_structural_capability_probe.py)" = f5e6fc9fde672cd523d31b2e655be5cd27ff6d19
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/run_structural_capability_probe.py)" = 8de6ea96f3ae2e61b8cdbf1ad175f10e128c541e
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/train_matrix_lock.json)" = a81e795089a46f103832df1b448883c4d21dc868
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/run_train_matrix.py)" = c8ced663cd2fb6e7645427fdf15e290c2bc07873
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_train_matrix.py)" = 0e67d956bb82c5d6be2ca53c088b9139181af860
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/portable_recurrent.py)" = 43d161bf438b2023c0cbf61b18559ec4447767d1
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_portable_recurrent.py)" = edd375c914165bf82ef7db4a122d3ef3b9d5e9e3
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/blind_public_harness.py)" = 8dd0e9a1dfc59c5607ce06216bfecbfee13b36aa
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_blind_public_harness.py)" = ddb0e9dd8260c342f204fe78a94e4628f514fda4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/run_public_onpolicy.py)" = f12a9b29228b3a148a4a732b320de5fd12ca5961
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_run_public_onpolicy.py)" = b6206797741e36b5e5200bf9ef3f0f1745c86e2a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/verify_public_checkpoint.py)" = 82b42f73ebf9f8f35ee1a9faa6e836fbdad22cde
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/strong_controls.py)" = f2d37ffcc628194eb443cc721524b2f625a7f148
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_strong_controls.py)" = 23db82cd95650a22cc2c68913c26ff3fbeb3201e
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/recurrent_control.py)" = 59a91fdf814e0c52c6172dbad681ef845be2a55e
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_recurrent_control.py)" = 6984fa0721e3e7d83540dace6a8810fc55223f54
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/qualify_public_recurrent.py)" = 8c9106b0d82c70a20047c82f798fac2f87304c6f
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_SOURCE_SAFE_FOCUSED_QUALIFIED=PASS
      - name: Require all current model and control tests before derived-index publication
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p 'test_*.py' -v
          echo FKP17_POLICY_PRE_ATLAS_FOCUSED=PASS
      - name: Generate and publish only 3 derived G29 files to existing draft branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf "%s\n" .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-17): exact-source G29 atlas only'
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          diff -u "$RUNNER_TEMP/expected" <(git diff --name-only "$SOURCE" "$NEXT" | LC_ALL=C sort)
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$TARGET"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo "FKP17_G29_GENERATED_ONLY_CANDIDATE=$NEXT"
  qualification-two-os:
    needs: source-only-atlas
    if: needs.source-only-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable checkout line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned free CPU gradient reference for source-only tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
      - name: Focused source-safe fixtures and negative held-seed controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p 'test_*.py' -v
      - name: G29 source atlas and mandatory inherited complete regression
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_TWO_OS_SOURCE_SAFE_FULL_REGRESSION=PASS




  public-constructive-representation-proof:
    needs: [source-only-atlas, qualification-two-os]
    if: needs.source-only-atlas.result == 'success' && needs.qualification-two-os.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FKP17_SOURCE_SHA: 77052eb949660f0452c1218f2dbdb5cea89c469c
    steps:
      - name: Preserve native Git source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Assert no model change and only source-safe facts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/prereg.json)" = 17d676c9374060515c7ebee2e2fdc262a884343c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/public_policies.py)" = a8837bf7edfc0a229b43c4bd97faa9de4bfadcf0
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/strong_controls.py)" = f2d37ffcc628194eb443cc721524b2f625a7f148
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/source_fixture.py)" = 8da7aa4a0892f2277bccca610bd2ad0b5cf9fcb3
      - name: Execute real-public-foundation constructive capacity counterexample
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-17/run_structural_capability_probe.py | tee "$RUNNER_TEMP/fkp17-representation-proof.log"
          python - <<'PY'
          import json,os,pathlib
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'fkp17-representation-proof.log').read_text('utf-8').splitlines()
          key='FKP17_FROZEN_STRUCTURAL_REPRESENTATION_PROOF='
          rec=[json.loads(x.split(key,1)[1]) for x in lines if key in x]
          assert len(rec)==1,'exactly one source-safe proof'
          x=rec[0]
          assert x['source_commit_original']==os.environ['FKP17_SOURCE_SHA']
          assert x['source_safe_foundation_records']==32768
          assert x['classification']=='STRUCTURED_REPRESENTATION_NOT_READY_FOR_DELAYED_CONTEXT_LAW'
          assert x['candidate_same_complete_state_after_distinct_conditional_laws'] is True
          assert x['candidate_same_complete_state_after_reordered_events'] is True
          assert x['independent_conditional_symbolic_control_distinguishes'] is True
          assert x['frozen_representation_readiness']=='NO_GO'
          assert x['proof_scope']=='CONSTRUCTIVE_PUBLIC_TOY_COUNTEREXAMPLE_NOT_PROTECTED_DATA'
          assert x['held_dev_opened'] is False and x['reserved_transfer_opened'] is False
          assert x['scientific_pass'] is False and x['native_model_promoted'] is False
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'fkp17-representation-proof.json'
          out.write_text(json.dumps(x,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('FKP17_CONSTRUCTIVE_REPRESENTATION_CAPABILITY_NO_GO_PROVED=PASS')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkp17-structural-capability-${{ matrix.os }}
          path: ${{ runner.temp }}/fkp17-representation-proof.json
          retention-days: 30
          if-no-files-found: error
