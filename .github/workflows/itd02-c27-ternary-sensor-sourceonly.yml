name: ITD-02 C27 strict unknown-sensor contract (source-only)
on:
  push:
    branches:
      - research/itd02-c27-ternary-source-observation-20261025
permissions:
  contents: read
concurrency:
  group: itd02-c27-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unknown-source-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Frozen-first original source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a958009f415c1a39d7653ebd2b048ff93fe43108 "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = "3aa22b1e418a7f8cd9619c476f02b8c614917b16"
          test "$(git hash-object research/mass_r7c20/run.py)" = "8de70742db29aa56ab928ba10b6fb1003fc82351"
          test "$(git hash-object research/mass_r7c25/PREREG.json)" = "2796e9f7faf94af4766016aac306ad1143e05e0e"
          python -m py_compile research/mass_r7c27/visibility.py research/mass_r7c27/test_visibility.py
          echo "C27_FROZEN_OWNER_AND_SOURCE_IDENTITIES=PASS"
      - name: Run exact original-R1-import source-only front presence and cold tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest research.mass_r7c27.test_visibility -v
          echo "C27_SOURCE_ONLY_UNKNOWN_VS_CLEAR_CONTRACT=PASS"
          echo "C27_ORIGINAL_ENV_IMPORT_RESET_STEP=0"
          echo "C27_PROTECTED_FIRST_USE=DENIED"
