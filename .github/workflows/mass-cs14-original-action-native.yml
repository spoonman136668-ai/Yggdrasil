name: Mass CS14 original MDP genuine action-owned Yggdrasil local-cell consequences
on:
  push:
    branches:
      - research/mass-cs14-action-owned-original-mdp-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs14-original-multi-action-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-action-owned-native-consequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout frozen FIRST source-public multi-action prospective trial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Qualify FIRST prereg ancestry, additive file scope and immutable R7 native
        shell: bash
        run: |
          set -euo pipefail
          first=8e6f13e1c2dc8b86017eda62e17ab727dd9baab5
          parent=ad0017a744064ff39b199a6bcfac823917d6c27e
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS14_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git hash-object research/native/itd01/r7/native_cells.py)" = "4c492a494ac5b25d5e9c49b98185be6a2c966b2f"
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; got=set(sys.stdin.read().splitlines()); want={"research/native/itd01/mass_r10/CS14_PREREG.md","research/native/itd01/mass_r10/cs14_action_owned_native_cells.py","research/native/itd01/mass_r10/run_cs14_original_action_owned_native.py","research/native/itd01/mass_r10/test_cs14_action_owned_native.py",".github/workflows/mass-cs14-original-action-native.yml"}; assert got==want,(got,want)'
      - name: Checkout unchanged original external Causal-Gymnasium
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CausalAILab/Causal-Gymnasium
          ref: c94e9a4cd3641588b6b8507e71ccee5c27032bdf
          path: external/Causal-Gymnasium
          persist-credentials: false
      - name: Setup Python 3.11 native and original-source runner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install untouched original source dependencies under bound
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs14-evidence
          set +e
          timeout 330s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/Causal-Gymnasium >cs14-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          echo "$rc" >cs14-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Record frozen original R7 suite without blocking separate PUBLIC development observation
        shell: bash
        run: |
          set -uo pipefail
          set +e
          PYTHONPATH=research/native/itd01/r7 python -B -m unittest discover -s research/native/itd01/r7 -p 'test_native_cells.py' -v >cs14-evidence/original-native-r7-regression.log 2>&1
          rc=$?
          set -e
          cat cs14-evidence/original-native-r7-regression.log
          printf '%s\n' "$rc" >cs14-evidence/original-native-r7-regression-exit.txt
          echo "ORIGINAL_FROZEN_R7_REGRESSION_EXIT=$rc"
          echo "The frozen R7 failure remains a STRICT final integration/promotion blocker."
      - name: Test original action isolation and cold native source-free invariants
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs14_action_owned_native.py 2>&1 | tee cs14-evidence/action-owned-focused-tests.log
      - name: Run real original source FIT VALID DEV action and next-state receipts
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs14_original_action_owned_native.py \
            --upstream external/Causal-Gymnasium --out cs14-evidence/
      - name: Preserve original public source rewards, successor states and negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs14-original-action-owned-native-evidence
          path: cs14-evidence/
          retention-days: 30
      - name: Enforce frozen original R7 regression as final integration blocker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f cs14-evidence/original-native-r7-regression-exit.txt
          test "$(cat cs14-evidence/original-native-r7-regression-exit.txt)" = "0"
