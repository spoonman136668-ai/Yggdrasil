name: CKAD18 fresh-world synthetic parallel qualification
on:
  push:
    branches: [research/ckad18-fresh-world-parallel-candidate-20261117]
    paths:
      - research/contrib/chatgpt/CKAD-18/experiment.py
      - .github/workflows/ckad18-fresh-world-active.yml
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  frozen-synthetic-development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Byte-stable checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run frozen synthetic development and verify independent control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CKAD-18/experiment.py > "$RUNNER_TEMP/ckad18-fresh-world.json"
          python - "$RUNNER_TEMP/ckad18-fresh-world.json" <<'PY'
          import hashlib, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          doc = json.loads(p.read_bytes())
          source = pathlib.Path("research/contrib/chatgpt/CKAD-18/experiment.py").read_bytes()
          assert hashlib.sha256(source).hexdigest() == "90b40b70e7b095f97aeb282a909b331aa69ba8be255ab7184413f3167edc7a51"
          assert doc["config"]["world_count"] == 60
          assert doc["scientific_pass"] is False and doc["native_accepted"] is False
          assert doc["independent_exact_bayes_parity_max"] < 1e-12
          assert doc["development_gates"]["pass"] is True
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual == "ccb94d08555b028e423a6dc688e6847348237776074a9c5fc3a82e9cc836b06e", actual
          print("CKAD18_FRESH_WORLD_FROZEN_REPRO=PASS", actual)
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ckad18-fresh-world-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad18-fresh-world.json
          if-no-files-found: warn
          retention-days: 30
  full-native-regression:
    needs: [frozen-synthetic-development]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Preserve checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned scientific comparator dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Full exact SHA regression and G29 atlas check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
