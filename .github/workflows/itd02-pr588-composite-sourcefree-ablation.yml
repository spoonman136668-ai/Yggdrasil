name: ITD-02 PR588 predeclared source-free composite ablation
on:
  push:
    branches:
      - research/itd02-pr588-composite-ablation-dev-20261027
permissions:
  contents: read
jobs:
  exact-native-and-conventional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 27
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve source bytes cross-platform
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Read-only predeclared harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout immutable baseline native learner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8c7dca8966a7d2721f49df2a9ac4c7419921097
          path: native-baseline
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout immutable exploration native learner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3723afc95cbe5d3355b54b479499036499c7183f
          path: native-exploration
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout immutable recency native learner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a39171a76d0d7817e3563682bb139a9d7ecf37c4
          path: native-recency
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Checkout immutable composite native learner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c92d0ff4f1cda4ba2714f1066d37b3cc48e46626
          path: native-composite
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Frozen source and preregistration custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness show HEAD:research/itd02_pr588_composite_ablation_preregister_20261027.md | grep -c '12096 across seven arms')" = 1
          test "$(git -C native-baseline rev-parse HEAD)" = "e8c7dca8966a7d2721f49df2a9ac4c7419921097"
          test -z "$(git -C native-baseline status --porcelain --untracked-files=all)"
          test "$(git -C native-exploration rev-parse HEAD)" = "3723afc95cbe5d3355b54b479499036499c7183f"
          test -z "$(git -C native-exploration status --porcelain --untracked-files=all)"
          test "$(git -C native-recency rev-parse HEAD)" = "a39171a76d0d7817e3563682bb139a9d7ecf37c4"
          test -z "$(git -C native-recency status --porcelain --untracked-files=all)"
          test "$(git -C native-composite rev-parse HEAD)" = "c92d0ff4f1cda4ba2714f1066d37b3cc48e46626"
          test -z "$(git -C native-composite status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-free matched actual learner actions and selected consequences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/itd02-pr588-results"
          for name in baseline exploration recency composite; do
            python -B harness/research/itd02_pr588_composite_ablation_dev.py \
              --variant "$name" --root "$GITHUB_WORKSPACE/native-$name" \
              --output "$RUNNER_TEMP/itd02-pr588-results/$name.json"
          done
          for name in count_mean ema_half rolling_six; do
            python -B harness/research/itd02_pr588_composite_ablation_dev.py \
              --variant "$name" --output "$RUNNER_TEMP/itd02-pr588-results/$name.json"
          done
          python -B harness/research/itd02_pr588_composite_ablation_dev.py \
            --aggregate "$RUNNER_TEMP/itd02-pr588-results" \
            --output "$RUNNER_TEMP/itd02-pr588-results/aggregate.json"
      - name: Audit source and result neutrality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'itd02-pr588-results'
          a=json.loads((r/'aggregate.json').read_text('utf-8'))
          assert a['events_all_arms']==12096 and a['events_per_arm']==1728
          assert a['protected_science']=='NOT_ACCEPTED'
          assert a['scientific_first_use_authorized'] is False
          assert a['promotion_authorized'] is False
          assert len(a['means'])==7 and len(a['all_families'])==6
          print('ITD02_PR588_MATCHED_SOURCEFREE_ACCOUNTING_PASS_NO_SCIENCE')
          PY
          test "$(git -C native-baseline rev-parse HEAD)" = "e8c7dca8966a7d2721f49df2a9ac4c7419921097"
          test -z "$(git -C native-baseline status --porcelain --untracked-files=all)"
          test "$(git -C native-exploration rev-parse HEAD)" = "3723afc95cbe5d3355b54b479499036499c7183f"
          test -z "$(git -C native-exploration status --porcelain --untracked-files=all)"
          test "$(git -C native-recency rev-parse HEAD)" = "a39171a76d0d7817e3563682bb139a9d7ecf37c4"
          test -z "$(git -C native-recency status --porcelain --untracked-files=all)"
          test "$(git -C native-composite rev-parse HEAD)" = "c92d0ff4f1cda4ba2714f1066d37b3cc48e46626"
          test -z "$(git -C native-composite status --porcelain --untracked-files=all)"
          test -z "$(git -C harness status --porcelain --untracked-files=all)"
      - name: Preserve per-trial development negatives and accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-pr588-ablation-${{ matrix.os }}
          path: ${{ runner.temp }}/itd02-pr588-results/*.json
          if-no-files-found: warn
          retention-days: 7
