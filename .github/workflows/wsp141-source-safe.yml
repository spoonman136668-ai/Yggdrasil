name: WSP141 three-policy independent future causal utility source-safe
on:
  push:
    branches: [research/wsp141-three-policy-independent-future-20261117]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source-first prereg and unchanged WSP137/WSP135 controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r 9e78edc463b248553783fb1be94aca79d4d2ad2c)" = "research/contrib/chatgpt/WSP-141/prereg.json"
          git merge-base --is-ancestor 9e78edc463b248553783fb1be94aca79d4d2ad2c HEAD
          git diff --exit-code 9e78edc463b248553783fb1be94aca79d4d2ad2c HEAD -- research/contrib/chatgpt/WSP-141/prereg.json
          git merge-base --is-ancestor 9ebb0718c7d9c4395336614599449e95d099e369 HEAD
          git diff --exit-code 9ebb0718c7d9c4395336614599449e95d099e369 HEAD -- research/contrib/chatgpt/WSP-137/policy.py research/contrib/chatgpt/WSP-137/controls.py research/contrib/chatgpt/WSP-135/learner.py research/contrib/chatgpt/WSP-136/oracle.py
          test ! -e research/contrib/chatgpt/WSP-141/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-141/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Original source-safe three-policy causal future task trial
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-141 -p 'test_*.py' -v
      - name: Ensure original source unmodified
        shell: bash
        run: test -z "$(git status --porcelain)"
  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp141): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp141-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate ONLY derived G29 source-pinned atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 9e78edc463b248553783fb1be94aca79d4d2ad2c HEAD
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp141): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp141-three-policy-independent-future-20261117
  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp141): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen research source, G29 pin and original first-use fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code 9e78edc463b248553783fb1be94aca79d4d2ad2c HEAD -- research/contrib/chatgpt/WSP-141/prereg.json
          git diff --exit-code 9ebb0718c7d9c4395336614599449e95d099e369 HEAD -- research/contrib/chatgpt/WSP-137/policy.py research/contrib/chatgpt/WSP-137/controls.py research/contrib/chatgpt/WSP-135/learner.py research/contrib/chatgpt/WSP-136/oracle.py
          test ! -e research/contrib/chatgpt/WSP-141/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Mandatory exact candidate WSP135-137 WSP139 WSP141 and full root regressions
        shell: bash
        run: |
          set -euo pipefail
          for n in 135 136 137 139 141; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
