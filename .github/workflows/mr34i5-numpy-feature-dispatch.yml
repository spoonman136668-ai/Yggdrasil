name: MR34I5 NumPy CPU Feature Dispatch Exact Source Sigmoid
on:
  push:
    branches:
      - research/mr34i5-cpu-dispatch-numeric-20261022
permissions:
  contents: read
concurrency:
  group: mr34i5-feature-dispatch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-numeric-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
        mode: [default, disable_avx2_fma3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Preserve source Git bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout MR34I5 read-only numerical CPU dispatch diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original S4C1 exact source with original trainer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: s4c1
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Farama original publicly authored source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout DeepMind independently authored original Pycolab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Original Python interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install unchanged runtime numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Supply original Pycolab Windows curses binding
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Evaluate frozen original sigmoid with NumPy default versus disabled AVX2 and FMA3
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          BLIS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          set -o pipefail
          export MR34I5_DISPATCH_MODE="${{ matrix.mode }}"
          unset NPY_ENABLE_CPU_FEATURES
          if [[ "${{ matrix.mode }}" == "disable_avx2_fma3" ]]; then
            export NPY_DISABLE_CPU_FEATURES="AVX2,FMA3"
          else
            unset NPY_DISABLE_CPU_FEATURES
          fi
          python -B audit/research/mr34i5/cpu_dispatch_probe.py s4c1 external/minigrid external/pycolab | tee mr34i5-feature-dispatch-source-receipt.log
          grep -q '^MR34I5_ORIGINAL_NUMPY_CPU_DISPATCH=' mr34i5-feature-dispatch-source-receipt.log
      - name: Confirm exact original project, source and audit worktrees intact
        shell: bash
        run: |
          for path in audit s4c1 external/minigrid external/pycolab; do
            git -C "$path" diff --exit-code
            test -z "$(git -C "$path" status --porcelain)"
          done
