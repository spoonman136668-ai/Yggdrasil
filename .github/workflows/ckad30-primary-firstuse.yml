name: CKAD30 frozen primary first-use and final two-OS qualification
on:
  push:
    branches:
      - research/ckad30-sparse-composition-20261118
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  guard:
    if: "github.event.head_commit.message == 'ci(ckad30): execute frozen primary after qualified pilot'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fully pinned native development dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Independent pre-first-use full regression and frozen source/seed custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD HEAD^{tree}
          git merge-base --is-ancestor d320fb29b5cd186a71f09a5bc01de2e2ce5ffa38 HEAD
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-30 -p 'test_ckad30.py' -v
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-30/audit_pilot.py
          python -B research/contrib/chatgpt/CKAD-30/campaign.py --mode preflight
          test -z "$(git status --porcelain)"
  score:
    needs: [guard]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact CPU solver dependency lock
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Original primary B three seeds, one bounded first-use only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/contrib/chatgpt/CKAD-30/campaign.py)" = 298bce2aa314374ce4dda7719f209b7d8ef11dea
          test ! -e research/contrib/chatgpt/CKAD-30/primary_result.json
          mkdir -p "$RUNNER_TEMP/ckad30-primary"
          python -B research/contrib/chatgpt/CKAD-30/campaign.py --mode primary > "$RUNNER_TEMP/ckad30-primary/result.json"
          test -s "$RUNNER_TEMP/ckad30-primary/result.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ckad30-primary-original-first-use
          path: ${{ runner.temp }}/ckad30-primary/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [score]
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.evidence.outputs.candidate }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad30-primary-original-first-use
          path: ${{ runner.temp }}/ckad30-primary-original
      - name: Seal original B artifact; audit gates without new held observations
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e research/contrib/chatgpt/CKAD-30/primary_result.json
          python -B research/contrib/chatgpt/CKAD-30/seal_primary.py --source-result "$RUNNER_TEMP/ckad30-primary-original/result.json"
          python -B research/contrib/chatgpt/CKAD-30/audit_primary.py
          git add -- research/contrib/chatgpt/CKAD-30/primary_result.json research/contrib/chatgpt/CKAD-30/primary_audit.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'research/contrib/chatgpt/CKAD-30/primary_result.json','research/contrib/chatgpt/CKAD-30/primary_audit.json'}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ckad30): seal frozen original B result with no promotion'
          SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git commit -m 'docs(ckad30): pin final B evidence source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          python -B research/contrib/chatgpt/CKAD-30/audit_primary.py
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad30-sparse-composition-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory final exact-tree root regression and read-only frozen B audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-30 -p 'test_ckad30.py' -v
          PYTHONPATH=. python -B research/contrib/chatgpt/CKAD-29/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-30/audit_pilot.py
          python -B research/contrib/chatgpt/CKAD-30/audit_primary.py
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
