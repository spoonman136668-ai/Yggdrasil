name: Mass MR34J3S source-free Windows/Linux qualification

on:
  push:
    branches:
      - proposal/mr34j3p-source-intake-20261024
    paths:
      - research/mr34j3/**
      - .github/workflows/mass-mr34j3s-source-free.yml

permissions:
  contents: read

concurrency:
  group: mr34j3s-source-free-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve byte-stable source on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout exact frozen candidate without write credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython 3.11 only
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify exact commit and fail-closed original-source guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, sys
          expect = os.environ["GITHUB_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == expect, "MR34J3S_GIT_HEAD_DRIFT"
          assert os.environ["GITHUB_REF_NAME"] == "proposal/mr34j3p-source-intake-20261024", "MR34J3S_BRANCH_DRIFT"
          assert os.environ["GITHUB_REPOSITORY"] == "spoonman136668-ai/Yggdrasil", "MR34J3S_REPOSITORY_DRIFT"
          assert sys.version_info[:2] == (3, 11), "MR34J3S_PYTHON_VERSION_DRIFT"
          root = pathlib.Path("research/mr34j3")
          source = (root/"source_preflight.py").read_text(encoding="utf-8")
          assert 'raise ProtocolBlocked("CKB_OWNER_LEASE_VERIFIER_NOT_INSTALLED_NO_SOURCE_EXECUTION")' in source, "MR34J3S_ORIGINAL_SOURCE_GUARD_REMOVED"
          assert (root/"MR34J3J_LOCAL_RECEIPT.json").is_file(), "MR34J3S_RECEIPT_MISSING"
          assert (root/"upstream_readonly_evidence.json").is_file(), "MR34J3S_PROVENANCE_MISSING"
          print("MR34J3S_EXACT_SOURCE_AND_NO_ORIGINAL_EXECUTION=PASS")
          PY
          python -B research/mr34j3/verify_admission_snapshot.py
          python -B research/mr34j3/source_preflight.py --inspect-spec-only

      - name: Install wheel-hash-verified candidate dependencies (no MiniGrid)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r research/mr34j3/requirements-py311-linux-windows-sha256.txt
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              "cloudpickle":"3.1.2", "farama-notifications":"0.0.6",
              "gymnasium":"1.1.1", "numpy":"1.26.4",
              "psutil":"6.1.1", "pygame-ce":"2.5.3",
              "six":"1.17.0", "typing-extensions":"4.16.0",
          }
          for name, pin in expected.items():
              assert version(name) == pin, f"MR34J3S_DEPENDENCY_DRIFT:{name}"
          print("MR34J3S_EIGHT_PINNED_WHEELS=PASS")
          PY

      - name: Run source-free focused tests; no original environment
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/mr34j3 -p 'test_*.py' -v
          python -B research/mr34j3/verify_admission_snapshot.py
          git diff --exit-code -- research/mr34j3
          git diff --cached --exit-code -- research/mr34j3
          echo MR34J3S_SOURCE_FREE_TESTS_PASSED_ORIGINAL_SOURCE_UNUSED
