name: Mass CS19 actual POPGym HigherLower changing-relevance source-qualified screen
on:
  push:
    branches:
      - research/mass-cs19-original-popgym-adaptive-rank-source-20261023
permissions:
  contents: read
jobs:
  original-source-dynamic-relevance:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 7
          persist-credentials: false
      - name: Enforce FIRST-only prospective source custody, original R7 unchanged, exact additive paths
        shell: bash
        run: |
          set -euo pipefail
          first=5e26fcde4cf91754a21228405f4e6f4521d39624
          parent=9112faa13405d221a46d9375eb4398fa73481c2f
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS19_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git hash-object research/native/itd01/r7/native_cells.py)" = "4c492a494ac5b25d5e9c49b98185be6a2c966b2f"
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS19_PREREG.md","research/native/itd01/mass_r10/run_cs19_original_popgym_rank_history.py","research/native/itd01/mass_r10/test_cs19_original_popgym_rank_history.py",".github/workflows/mass-cs19-original-popgym-rank.yml"};assert got==want,(got,want)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym-original
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only original source requirements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cs19-evidence
          timeout 180s python -m pip install --no-cache-dir --timeout 35 --retries 1 'numpy==1.26.4' 'gymnasium==0.29.1' 2>&1 | tee cs19-evidence/install.log
      - name: Source-free strict cohort and feature tests before external source execution
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs19_original_popgym_rank_history.py 2>&1 | tee cs19-evidence/focused-tests.log
      - name: Execute true original POPGym external rewards FIT and matched DEV
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs19_original_popgym_rank_history.py --upstream external/popgym-original --out cs19-evidence
      - name: Preserve complete source and scientific negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs19-original-POPGym-dynamic-relevance
          path: cs19-evidence/
          retention-days: 30
