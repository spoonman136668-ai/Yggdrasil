name: Yggdrasil Y031 frozen delayed reentry age-cache science
on:
  push:
    branches: [research/y031-aged-retention-r1]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact immutable science identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 72b64a2b9a5344ad3064978c9a4a823c26cac4c4 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y030-new-family/execute.py)" = c6396dd8fb125044618c5e4cfa99a89243a0c481
          test "$(git hash-object research/contrib/chatgpt/20261013-y031-aged-retention/prereg.json)" = 2fc6621a2f756bf1a91eec5c09da82b8f4a6d845
          test "$(git hash-object research/contrib/chatgpt/20261013-y031-aged-retention/execute.py)" = fb747a835dc346887d7c61cf7ac8384c70ec8c9b
          python3 -m json.tool research/contrib/chatgpt/20261013-y031-aged-retention/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y031-aged-retention/execute.py
      - name: First-use frozen synthetic experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y031-aged-retention/execute.py > /tmp/y031-original.json
          python3 -m json.tool /tmp/y031-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y031-first-use
          path: /tmp/y031-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Final full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
