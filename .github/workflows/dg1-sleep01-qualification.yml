name: DG1-SLEEP01 Wake/Sleep Consolidation DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-sleep01-20261113/**'
      - '.github/workflows/dg1-sleep01-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile sleep mechanism and evaluator
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-sleep01-20261113/sleep_model.py
          python -m py_compile research/contrib/chatgpt/dg1-sleep01-20261113/eval_dev.py
          python -m py_compile research/contrib/chatgpt/dg1-sleep01-20261113/test_sleep.py
      - name: Focused physical custody and negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-sleep01-20261113 -p "test_*.py" -v
      - name: Execute frozen prospective synthetic worlds
        run: python research/contrib/chatgpt/dg1-sleep01-20261113/eval_dev.py > sleep01-result.json
      - name: Explicitly classify science without changing frozen thresholds
        run: python -c "import json; r=json.load(open('sleep01-result.json')); print('SLEEP01_DEV', r['classification'], 'primary', r['primary_pass'], 'conventional_tie', r['conventional_tie_or_better']); print(r['aggregate'])"
      - name: Persist per-world prospective source and custody evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-sleep01-evidence-${{ matrix.os }}
          path: sleep01-result.json
          retention-days: 7
          if-no-files-found: warn
      - name: Mandatory inherited full regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: G29 source-atlas exact-source verification
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Verify no source edits during tests
        run: git diff --exit-code
      - name: Regenerate bounded G29 atlas for source-review artifact
        if: always() && matrix.os == 'ubuntu-latest'
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
      - name: Emit bounded exact G29 atlas chunks for commit review
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for ext in ('json', 'html', 'ice'):
              raw = Path('.ice/code-atlas.' + ext).read_bytes()
              encoded = base64.b64encode(raw).decode('ascii')
              print('SLEEP01_ATLAS_BEGIN:' + ext + ':' + str(len(raw)))
              for pos in range(0, len(encoded), 4096):
                  print('SLEEP01_ATLAS_CHUNK:' + ext + ':' + encoded[pos:pos+4096])
              print('SLEEP01_ATLAS_END:' + ext)
          PY
      - name: Preserve source atlas for exact-source review
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-sleep01-G29-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: warn
          retention-days: 7

