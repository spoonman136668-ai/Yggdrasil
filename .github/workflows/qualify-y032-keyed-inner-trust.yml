name: Yggdrasil Y032 independent keyed inner-cache trust
on:
  push:
    branches: [research/y032-keyed-inner-trust-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact frozen scientific identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 244604db6992e598b1c9057083d279d5a8869de4 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y031-keyed-drift/execute.py)" = aa5336ce09c5ade4477d34d8129ff2f97387f366
          test "$(git hash-object research/contrib/chatgpt/20261013-y032-inner-trust/prereg.json)" = 19b4d943965130c07bbb8ae850e820a422362fb6
          test "$(git hash-object research/contrib/chatgpt/20261013-y032-inner-trust/execute.py)" = 895646b3ff849a6cf18990ba216edc03eaccc75e
          python3 -m json.tool research/contrib/chatgpt/20261013-y032-inner-trust/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y032-inner-trust/execute.py
      - name: Original frozen keyed inner-trust experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y032-inner-trust/execute.py > /tmp/Y032-original.json
          python3 -m json.tool /tmp/Y032-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y032-original-keyed-inner-trust
          path: /tmp/Y032-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
