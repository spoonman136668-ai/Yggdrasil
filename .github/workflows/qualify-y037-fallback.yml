name: Yggdrasil Y037 frozen legal singleton fallback
on:
  push:
    branches: [research/y037-single-cache-legal-fallback-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable prior and prereg checks
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c9c8ae47af93b3d9819247ddb8ea2b822cd28ed HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-rank/execute.py)" = 7b28ead3ea638b6b2c695a03a908e6c4d7ea0bbd
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-fallback/prereg.json)" = 4dfda3dd6ad96f78940c4d715127a050a2a3e1a4
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-fallback/execute.py)" = a36eba3011a93cbb3014385ff6f0a1c98fc85679
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-fallback/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-fallback/execute.py
      - name: First original sealed fallback experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-fallback/execute.py > /tmp/Y037-original.json
          python3 -m json.tool /tmp/Y037-original.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/Y037-original.json'))
          assert len(j['regimes'])==4 and j['sealed_heldout_seeds']==list(range(232,248))
          print('CLASSIFICATION',j['classification'])
          for x in j['regimes']:
              print('REGIME',x['regime'],x['heldout_churn'],x['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original-fallback
          path: /tmp/Y037-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
