name: ITD-02 C29 original FIT-only native effect predictor versus temporal Bayes
on:
  push:
    branches:
      - research/itd02-c29-native-effect-fit-20261025
permissions:
  contents: read
  actions: read
concurrency:
  group: itd02-c29-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-free-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Freeze first and original Ygg R1 exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1ebfb712f247b1e924044bd101c31c390eb6129d "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r1/native_policy.py)" = "3aa22b1e418a7f8cd9619c476f02b8c614917b16"
          test "$(git hash-object research/mass_r7c28/PREREG.json)" = "$(git rev-parse 955465676893e18d673ccb804f27e7c04160bdc3:research/mass_r7c28/PREREG.json)"
          python -m py_compile research/mass_r7c29/effects.py research/mass_r7c29/analysis.py research/mass_r7c29/test_effects.py
          echo "C29_FROZEN_ORIGINAL_SOURCE_AND_FIT_ROLE=PASS"
      - name: Bounded original R1 local-cell and comparator focused tests only
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest research.mass_r7c29.test_effects -v
          echo "C29_FOCUSED_SOURCE_FREE_SELECTED_EFFECT_UNIT=PASS"
          echo "C29_ORIGINAL_ENV_EPISODES=0"
          echo "C29_PROTECTED_FIRST_USE=DENIED"

  original-immutable-fit-analysis:
    needs: [source-free-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_ARTIFACT_ID: '12596362847'
      GH_SOURCE_ZIP_SHA: '2e0492af74cd68f8fc9ee7d5cfffcc6a936614e23f9061457f70dcd49cf84810'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Materialize only exact authenticated C28 source FIT evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/c29-c28-original-fit"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/c28-pinned-original.zip" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/$GH_ARTIFACT_ID/zip"
          echo "$GH_SOURCE_ZIP_SHA  $RUNNER_TEMP/c28-pinned-original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c28-pinned-original.zip" -d "$RUNNER_TEMP/c29-c28-original-fit"
          echo "C29_PINNED_AUTHENTIC_C28_SOURCE_ARCHIVE=PASS"
      - name: Reverify old original C28 FIT duplicate scientific custody
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.mass_r7c28.compare "$RUNNER_TEMP/c29-c28-original-fit"
          echo "C29_805_ORIGINAL_FIT_RECONCILIATION=PASS"
      - name: Train only from C28 original source FIT; compare native and conventional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c29-results"
          python -B -m research.mass_r7c29.analysis --frozen-artifact-dir "$RUNNER_TEMP/c29-c28-original-fit" --out "$RUNNER_TEMP/c29-results/c29-original-fit-only-comparison.json"
          echo "C29_SOURCE_WORLD_RESETS=0"
          echo "C29_DEVELOPMENT_OR_PROTECTED_SOURCE_ACTIONS=0"
      - name: Archive resulting FIT-only negative or positive prediction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-c29-fit-cell-versus-bayesian-prediction
          path: ${{ runner.temp }}/c29-results/
          if-no-files-found: warn
          retention-days: 80
