name: AAI-11F exact two-action oracle success-ceiling feasibility audit
on:
  push:
    branches: [research/aai11f-oracle-goal-ceiling-audit-20261114]
    paths: [.github/workflows/aai11f-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11f-benchmark-source-audit-20261114
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11F original exact two-action goal gate audit one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original prereg, immutable benchmark, exact Git source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'eaff09b45c36645e2ac852b799dde2d3f4edb5cb'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11f-source-atlas-once.yml'
          test "$(git rev-parse a595a2ccb701f6e69c530c701906740ae01483f0^)" = 'f9429b90e35c6b98b85a328e8b5c6186519ea27d'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/prereg.json)" = '60b0015b9c39c043084b6c9bd8368e7ac85c3883'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/prereg.json)" = "$(git rev-parse a595a2ccb701f6e69c530c701906740ae01483f0:research/contrib/chatgpt/AAI-11F/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/audit.py)" = '299a79cf8101a6a7a8231c693d52b022fab22e07'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11F/test_audit.py)" = '3dc247a8ea35aa84133d889ce03bc2e33def91f7'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/admission.py)" = '0f921dfeebda9ad3a0e217747e4b0365ba9c655e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test -z "$(git status --porcelain)"
          echo AAI11F_ORIGINAL_GOAL_GATE_ORACLE_SOURCE_CUSTODY_PASS
      - name: Independent exact action-sequence and forward-closure oracle unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11F -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11F/audit.py --primary >/dev/null 2>&1; then
            echo AAI11F_FIRST_USE_DISARM_FAILURE >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11F_ORIGINAL_WORLD_GOAL_REACHABILITY_TESTS_PASS
      - name: Frozen exact 288-episode action attainability audit (no learner)
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11F/audit.py --mechanical-oracle-audit
          test -z "$(git status --porcelain)"
          echo AAI11F_ORACLE_GOAL_GATE_FEASIBILITY_CLASSIFICATION_RECORDED_NO_SCIENCE
  atlas:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate original three G29 source-pinned code atlas files ONLY
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'eaff09b45c36645e2ac852b799dde2d3f4edb5cb'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11F generated source-pinned G29 atlas only'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11f-oracle-goal-ceiling-audit-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11f-oracle-goal-ceiling-audit-20261114
          echo AAI11F_EXACT_G29_ATLAS_ONLY_PASS
