name: Optimizer O22-U original physical action-loop forensic
on:
  push:
    branches:
      - research/optimizer-o22u-cycle-veto-forensics-20261025
  pull_request:
    paths:
      - research/optimizer_o22u/**
      - .github/workflows/optimizer-o22u-cycle-forensics.yml
permissions:
  contents: read
  actions: read
jobs:
  source-free-unit:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Frozen source and all original native files
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e0c391bd2d1ceada25ba4b88d419a4dcdd41b543 HEAD
          git merge-base --is-ancestor 5c9fae6c7d96473d3688434bee9e37c533aa9080 HEAD
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = '5348238f4ec2183bea29262659883391b5f429fd'
          test "$(git hash-object research/mass_r7c31/action_bridge.py)" = 'fbc37f22b3a820552540a28eb97f81f32034a08a'
          python -B -c "import json; p=json.load(open('research/optimizer_o22u/PREREG.json')); assert p['new_source_resets_and_steps_allowed']==0 and p['FSA_protected_first_use_allowed'] is False"
          echo 'O22U_NATIVE_R3_AND_NEGATIVE_C32_IMMUTABLE=PASS'
      - name: Seven bounded source-public loop attribution and cold tests
        run: python -B -m unittest -v research.optimizer_o22u.test_cycle_veto

  archived-original-world-read-only:
    needs: source-free-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact original-world completed C32 FIT ZIP, never run MiniGrid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/optimizer-o22u"
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/12598538562/zip" \
            --output "$RUNNER_TEMP/optimizer-o22u/c32-source.zip"
          python -B -c "import hashlib,json,pathlib,os; p=json.load(open('research/optimizer_o22u/PREREG.json')); f=pathlib.Path(os.environ['RUNNER_TEMP'])/'optimizer-o22u/c32-source.zip'; assert hashlib.sha256(f.read_bytes()).hexdigest()==p['C32_archive_sha256']"
          echo 'O22U_ORIGINAL_C32_HOSTED_ZIP_SOURCE_PIN=PASS'
      - name: Exact two-original-process public action trace replay and descriptive gate
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.optimizer_o22u.audit \
            --source-zip "$RUNNER_TEMP/optimizer-o22u/c32-source.zip" \
            --out "$RUNNER_TEMP/optimizer-o22u/forensic-report.json"
          python -B -m json.tool "$RUNNER_TEMP/optimizer-o22u/forensic-report.json"
      - name: Archive read-only original-source forensic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22u-existing-source-action-loop-veto-forensics
          path: ${{ runner.temp }}/optimizer-o22u/forensic-report.json
          if-no-files-found: warn
          retention-days: 80
