name: WSP-13 evidence-built composite feature public DEV regression
on:
  pull_request:
    branches:
      - research/wsp12-numeric-rule-selection-20261110
    paths:
      - 'research/contrib/chatgpt/WSP-13/**'
      - '.github/workflows/wsp13-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate G29 candidate snapshot without repository mutation
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }}
      - name: Emit bounded G29 candidate chunks for later immutable pinning
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import subprocess
          from pathlib import Path
          from scripts import build_code_atlas as atlas
          root=Path(".").resolve()
          sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          artifacts=atlas.render(atlas.snapshot(root,sha))
          for path,content in artifacts.items():
              encoded=base64.b64encode(content.encode("utf-8")).decode("ascii")
              for offset in range(0,len(encoded),1800):
                  print("WSP13_ATLAS_PART|"+path+"|"+str(offset//1800)+"|"+
                        encoded[offset:offset+1800])
          PY
      - name: Original Yggdrasil full tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prior WSP-01 through WSP-12 full suites
        shell: bash
        run: |
          for n in 01 02 03 04 05 06 07 08 09 10 11 12; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: WSP-13 focused numerical composition tests
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-13 -p 'test_*.py' -v
      - name: WSP-13 frozen exhaustive 1024-world evaluator
        run: python research/contrib/chatgpt/WSP-13/run_dev.py
      - name: Clean source guard
        run: git diff --exit-code
