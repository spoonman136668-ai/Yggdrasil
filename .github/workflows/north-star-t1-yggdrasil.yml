name: T1 YGG transferable-cognition nonconsuming qualification
on:
  push:
    branches: [research/north-star-transfer-yggdrasil-20261018]
    paths: ['.github/workflows/north-star-t1-yggdrasil.yml','research/north-star-transfer/20261018-yggdrasil-precode.json','research/north-star-transfer/20261018-yggdrasil-learned-kernel.py']
permissions:
  contents: read
concurrency:
  group: t1-yggdrasil-public-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-source-synthetic-kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable source, execute pure learned kernel only, seal scientific cohorts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T1_YGG_EXACT_HEAD_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261018-yggdrasil-precode.json').Trim() -cne '14173c38978da3174ca1a1a8a35f2267ee271595'){throw 'T1_YGG_FROZEN_PROTOCOL_DRIFT'}
          if((git hash-object 'research/foundational/20261017-y-f105/relational_credit.py').Trim() -cne 'f78cae2150b48b4c7ffb1274f80392a563bd64ce'){throw 'T1_YGG_PREVIOUS_LEARNER_DRIFT'}
          if((git hash-object 'research/foundational/20261015-y-f62/source_pilot.py').Trim() -cne '7ed72deca5584d7c0b6562d74456fa7d4bee6712'){throw 'T1_YGG_INDEPENDENT_BASELINE_DRIFT'}
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261018-yggdrasil-learned-kernel.py'
          if($LASTEXITCODE -ne 0){throw 'T1_YGG_PUBLIC_KERNEL_FOCUSED_FAIL'}
          Write-Output 'T1_YGG_SOURCE_BOUND_FOCUSED=PASS'
          Write-Output 'T1_YGG_NEW_TRAIN_SCREEN_UNSEEN_REPLICA_CONSUMED=false'
          Write-Output 'T1_YGG_EQUAL_TOTAL_COST_NOT_YET_QUALIFIED=true'
          Write-Output 'T1_YGG_SCIENTIFIC_ACCEPTANCE=false'
          Write-Output 'T1_YGG_PRODUCTION_AND_OPTIMIZER_PROMOTION=false'
