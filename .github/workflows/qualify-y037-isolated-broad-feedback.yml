name: Yggdrasil Y037 isolated broad-feedback repair qualification
on:
  push:
    branches: [research/chatgpt-isolated-y037-broader-cue-repair-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen parent and first-use source blobs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 38bd18325c83f380f15258216ace790cf44cdb52 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-sparse-switch/execute.py)" = 8a88e4064941dae3e113802ccacc6bbcb8df21e0
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-broad-feedback/prereg.json)" = 59b08a9885925c248d64ff49d5db034626e20f74
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-broad-feedback/execute.py)" = 6e62a59317b52c02ece89b6a6a062494f65ed938
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-broad-feedback/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-broad-feedback/execute.py
      - name: First-use frozen broad-feedback cue repair science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-broad-feedback/execute.py > /tmp/Y037-original.json
          python3 -m json.tool /tmp/Y037-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original-broader-feedback
          path: /tmp/Y037-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Complete Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
