name: WSP151 source-free hierarchical Bayesian preflight
on:
  push:
    branches: [research/wsp151-hierarchical-causal-overhypothesis-20261117]
permissions:
  contents: read
jobs:
  no-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact immutable sole-file prereg and no source first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse e4134c85fa7905694fe74b9db8bbfa48725a0ff6^)" = "55dd1e9e9f79a8a944a841330bb0ddcd93143a22"
          test "$(git diff-tree --no-commit-id --name-only -r e4134c85fa7905694fe74b9db8bbfa48725a0ff6)" = "research/contrib/chatgpt/WSP-151/prereg.json"
          git merge-base --is-ancestor e4134c85fa7905694fe74b9db8bbfa48725a0ff6 HEAD
          git diff --exit-code e4134c85fa7905694fe74b9db8bbfa48725a0ff6 HEAD -- research/contrib/chatgpt/WSP-151/prereg.json
          git diff --exit-code 55dd1e9e9f79a8a944a841330bb0ddcd93143a22 HEAD -- research/contrib/chatgpt/WSP-149 research/contrib/chatgpt/WSP-148
          test ! -e research/contrib/chatgpt/WSP-151/source.py
          test ! -e research/contrib/chatgpt/WSP-151/experiment.py
          test ! -e research/contrib/chatgpt/WSP-151/result.json
          test ! -e research/contrib/chatgpt/WSP-151/SCIENTIFIC_PASS.json
          test -z "$(git status --porcelain)"
      - name: Fabricated-row Bayesian, action choice, negative and cold checks
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-151 -p 'test_*.py' -v
      - name: Source-free checkout remained unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"
