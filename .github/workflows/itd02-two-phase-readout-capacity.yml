name: ITD-02 original two-phase reward-readout capacity audit
on:
  push:
    branches:
      - qualification/itd02-two-phase-readout-alias-20261027
permissions:
  contents: read
jobs:
  source-frozen-two-phase-capacity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: 50f7326026f6bf857ab9c62a29fa1b57db4ad815
    steps:
      - name: Enforce original byte identities
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check frozen source and exact independent diagnostic diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          original=os.environ["SOURCE_SHA"]
          paths=[
            "yggdrasil/itd02_native_task_bridge_dev.py",
            "yggdrasil/itd02_local_ring_memory_dev.py",
            "yggdrasil/task_runtime.py",
            "yggdrasil/developmental.py"
          ]
          for p in paths:
              assert Path(p).read_bytes()==subprocess.check_output(
                  ["git","show",original+":"+p]),("SOURCE_DRIFT",p)
          allowed={
            "research/diagnostics/itd02_source_frozen_phase_average_capacity_20261027.py",
            ".github/workflows/itd02-two-phase-readout-capacity.yml"
          }
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",original,"HEAD"],text=True).splitlines())
          assert changed==allowed,("SOURCE_ISOLATION_FAILURE",changed)
          print("ORIGINAL_NATIVE_SOURCE_EXACT_PASS")
          PY
          test -z "$(git status --porcelain)"
      - name: Source-readout proof and retained native negative controls
        shell: bash
        run: |
          set -euo pipefail
          python -B research/diagnostics/itd02_source_frozen_phase_average_capacity_20261027.py
          test -z "$(git status --porcelain)"
      - name: Publish all aliases and trained frozen readout checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd02-two-phase-alias-${{ matrix.os }}
          path: ${{ runner.temp }}/itd02_phase_averaging_capacity.json
          if-no-files-found: warn
          retention-days: 14
