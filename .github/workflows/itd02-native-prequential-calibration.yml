name: ITD-02 original native prequential reward diagnostic
on:
  push:
    branches:
      - qualification/itd02-native-prequential-calibration-20261027
permissions:
  contents: read
jobs:
  native-prequential-calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SOURCE_SHA: a39171a76d0d7817e3563682bb139a9d7ecf37c4
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set platform-independent source byte checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original source identity and clean isolated diagnostic files
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "a39171a76d0d7817e3563682bb139a9d7ecf37c4"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import subprocess, os
          original=[
             "yggdrasil/itd02_native_task_bridge_dev.py",
             "yggdrasil/itd02_local_ring_memory_dev.py",
             "yggdrasil/itd02_native_training_session_dev.py",
             "yggdrasil/task_runtime.py",
             "tests/test_itd02_native_task_bridge_dev.py",
             "tests/test_itd02_local_ring_memory_dev.py"
          ]
          for p in original:
              expected=subprocess.check_output(["git","show",os.environ["SOURCE_SHA"]+":"+p])
              if Path(p).read_bytes()!=expected:
                  raise AssertionError("NATIVE_SOURCE_HAS_DRIFTED:"+p)
          current=subprocess.check_output(["git","diff","--name-only", "a39171a76d0d7817e3563682bb139a9d7ecf37c4", "HEAD"],text=True).splitlines()
          expected={
            "research/diagnostics/itd02_native_prequential_calibration_20261027.py",
            ".github/workflows/itd02-native-prequential-calibration.yml"
          }
          assert set(current)==expected, ("ISOLATION_DIFF_INVALID",current)
          print("FROZEN_NATIVE_SOURCE_UNCHANGED_AND_DIAGNOSTIC_ONLY")
          PY
          test -z "$(git status --porcelain)"
      - name: Evaluate actual pre-action native reward scores on 64 fresh families
        shell: bash
        run: |
          set -euo pipefail
          python -B research/diagnostics/itd02_native_prequential_calibration_20261027.py
          test -z "$(git status --porcelain)"
      - name: Preserve full per-trial and aggregate calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itd02-prequential-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/itd02_native_calibration_summary.json
            ${{ runner.temp }}/itd02_native_calibration_trials.json
          if-no-files-found: warn
          retention-days: 14
