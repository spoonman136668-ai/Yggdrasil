name: DG1-HC07 Causal Graph Discovery Falsification
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-hc07-20261113/**'
      - '.github/workflows/dg1-hc07-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile independent graph learners and frozen evaluator
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-hc07-20261113/affine_cells.py
          python -m py_compile research/contrib/chatgpt/dg1-hc07-20261113/bayesian_graph_control.py
          python -m py_compile research/contrib/chatgpt/dg1-hc07-20261113/eval_dev.py
      - name: New graph learning and negative engineering tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-hc07-20261113 -p "test_*.py" -v
      - name: Preregistered graph-shift, nonlinear and phase-reversal developer experiment
        run: python research/contrib/chatgpt/dg1-hc07-20261113/eval_dev.py > hc07-result.json
      - name: Record frozen unedited scientific verdict and confidence errors
        run: python -c "import json; r=json.load(open('hc07-result.json')); print('HC07_DEV',r['classification'],'rewired',r['frozen_primary_rewired_pass'],'old_ring',r['old_ring_pass'],'return_A',r['return_A_pass'],'non_affine_wrong_confident',r['non_affine_confident_wrong']); print(r['aggregate'])"
      - name: Preserve full physical action-ledger digests and four-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc07-dev-evidence-${{ matrix.os }}
          path: hc07-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Mandatory full inherited Python regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Exact pinned G29 source atlas
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Source remains unchanged after science test
        run: git diff --exit-code
      - name: Generate exact-source atlas for final artifact custody
        if: always() && matrix.os == 'ubuntu-latest'
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
      - name: Emit bounded atlas payload for exact-source final pin
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for ext in ('json', 'html', 'ice'):
              raw = Path('.ice/code-atlas.' + ext).read_bytes()
              print('DG1_HC07_ATLAS_START:' + ext + ':' + str(len(raw)))
              b64 = base64.b64encode(raw).decode('ascii')
              for idx in range(0,len(b64),4096):
                  print('DG1_HC07_ATLAS_CHUNK:' + ext + ':' + b64[idx:idx+4096])
              print('DG1_HC07_ATLAS_END:' + ext)
          PY
      - name: Preserve exact-source generated atlas
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc07-g29-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: warn
          retention-days: 7
