name: Yggdrasil read-only accepted-owner checkpoint custody audit
on:
  push:
    branches:
      - research/ygg-owner-native-custody-baseline-20261119
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  provenance-only:
    if: "github.event.head_commit.message == 'ci(owner-custody): one-shot read-only source verification'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable checkout line ending rewrite
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin exact parent audit before owner read-only verification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 59f274b7508eaaf84f30639b645a9dbb42e1eb87 HEAD
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/YGG-OWNER-CUSTODY'); [ast.parse(f.read_text()) for f in p.glob('*.py')]"
      - name: Ten owner-state science/authority negative controls
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-OWNER-CUSTODY -p test_verify_readonly.py -v
          python -B research/contrib/chatgpt/YGG-OWNER-CUSTODY/verify_readonly.py
      - name: Verify original GitHub main, owner, CAP03, NKR07 and CI metadata only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/YGG-OWNER-CUSTODY/verify_readonly.py --online
          test -z "$(git status --porcelain)"
