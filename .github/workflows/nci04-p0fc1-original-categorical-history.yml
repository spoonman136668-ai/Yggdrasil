name: NCI-04 P0F-C1 Original Public Categorical History Development
on:
  push:
    branches:
      - research/p0fc1-original-history-necessity-20261023
permissions:
  contents: read
concurrency:
  group: p0fc1-original-history-${{ github.ref }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  original-source-public-dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Exact upstream source byte line-ending policy on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout frozen source experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original Farama MiniGrid
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          persist-credentials: false
      - name: Checkout original independent DeepMind Pycolab
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          persist-credentials: false
      - name: Python 3.11 exact source runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only existing original source dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 six==1.17.0 psutil==6.1.1 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Supply original Pycolab curses Windows binding
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify contract-FIRST and exact four-path additive source scope
        shell: bash
        run: |
          set -euo pipefail
          cd yggdrasil
          first=c71a941108efbec1724f182b4fe2ce098249fe3c
          parent=3d952e897768b052a5bd89851f2aa0e354f97193
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = 'research/p0fc1/FROZEN_PUBLIC_DEV_CONTRACT.json'
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;x=set(sys.stdin.read().splitlines());y={"research/p0fc1/FROZEN_PUBLIC_DEV_CONTRACT.json","research/p0fc1/original_history.py","research/p0fc1/test_original_history.py",".github/workflows/nci04-p0fc1-original-categorical-history.yml"};assert x==y,(x,y)'
          python -B -m py_compile research/p0fc1/original_history.py research/p0fc1/test_original_history.py
          find research/p0fc1 -type d -name '__pycache__' -prune -exec rm -rf {} +
      - name: Test role isolation and strictly scored complete next-public identities before source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd yggdrasil
          python -B -m unittest -v research.p0fc1.test_original_history
      - name: Verify unchanged original Farama public source identity
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Real original source actions and genuine categorical held scoring
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          cd yggdrasil
          python -B -m research.p0fc1.original_history ../external/minigrid ../external/pycolab | tee ../p0fc1-original-receipt.log
          grep -q '^P0FC1_ORIGINAL_CATEGORICAL_HISTORY=' ../p0fc1-original-receipt.log
      - name: Verify no original/protected worktree mutation
        shell: bash
        run: |
          set -euo pipefail
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          git -C external/pycolab diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
          test -z "$(git -C external/pycolab status --porcelain)"
      - name: Archive public-only DEV evidence, not raw source texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0fc1-original-public-${{ matrix.os }}
          path: p0fc1-original-receipt.log
          retention-days: 30
          if-no-files-found: warn

  independent-cross-os:
    needs: original-source-public-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact dual-OS public original receipts
        uses: actions/download-artifact@v4
        with:
          pattern: p0fc1-original-public-*
          path: receipts
      - name: Independently compare original full-public source stream hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json
          root=pathlib.Path("receipts")
          reports={}
          for tag in ("ubuntu-24.04","windows-2025"):
              p=root / ("p0fc1-original-public-"+tag) / "p0fc1-original-receipt.log"
              lines=p.read_text(encoding="utf-8").splitlines()
              v=[s.split("=",1)[1] for s in lines if s.startswith("P0FC1_ORIGINAL_CATEGORICAL_HISTORY=")]
              assert len(v)==1,(tag,len(v))
              reports[tag]=json.loads(v[0])
          a,b=reports.values()
          assert a["frozen_protocol_sha256"]==b["frozen_protocol_sha256"]
          assert a["disposition"]==b["disposition"]
          assert a["protected_independent_first_use_consumed"] is False
          for name in a["source_dev_reports"]:
              x,y=a["source_dev_reports"][name],b["source_dev_reports"][name]
              for key in ("frozen_fit_observation_action_outcome_sha256",
                          "held_observation_action_outcome_sha256",
                          "original_fit_receipts_sha256","original_dev_receipts_sha256"):
                  assert x[key]==y[key],(name,key)
              for key in ("paired_seed_mean_nats_advantage",
                          "average_current_full_public_logloss_nats",
                          "average_two_step_public_history_logloss_nats"):
                  assert abs(x[key]-y[key])<1e-12,(name,key)
          print("P0FC1_INDEPENDENT_ORIGINAL_CROSS_OS=PASS_PUBLIC_DEV_ONLY")
          print("P0FC1_SCIENTIFIC_FIRST_USE=NOT_CONSUMED")
          PY
