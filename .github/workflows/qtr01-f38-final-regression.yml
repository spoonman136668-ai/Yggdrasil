name: QTR-01 F38 exact-source atlas companion and full regression

on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114

permissions:
  contents: read

jobs:
  source-atlas-once:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): arm F38 exact-source atlas and full qualification'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - name: Checkout exact new workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require unchanged F38 candidate and one workflow-only marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4e47fe3966b94ac5b39d8fe8bf91168a3dc4c5e7"
          test "$(git log -1 --format=%s)" = 'ci(qtr): arm F38 exact-source atlas and full qualification'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f38-final-regression.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f38_prereg.json)" = "bb86d3d7f8b8d9052eb7522f7ed7b616c3b0d66c"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f38_composition_dev.py)" = "988ed16297dd70d4a6557d9f3410d22743fe2da5"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f35_source_depth2_snapshot.json)" = "3fc50ddf7453958c458db697eacf2e27d3d52f57"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f32_source_snapshot.json)" = "453dad0363689cff785c26db5441555c6841f95d"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          test -z "$(git status --porcelain)"
          echo F38_ATLAS_SOURCE_PIN=PASS
      - name: Generate only derived ICE code atlas artifacts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          EXPECTED="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          ACTUAL="$(git diff --cached --name-only | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED"
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'ci(qtr): derive F38 exact-source G29 atlas'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/qtr01-qwen38-donor-intake-20261114
          echo "F38_ATLAS_COMPANION_SHA=$(git rev-parse HEAD)"
          echo F38_ATLAS_DERIVED_CLEAN=PASS

  full-regression:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F38 final full exact-source qualification'
    name: F38 full final regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Stabilize original Windows file bytes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify candidate source and generated companion, unchanged science
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ci(qtr): F38 final full exact-source qualification'
          test -z "$(git diff --name-only HEAD^ HEAD)"
          git merge-base --is-ancestor 4e47fe3966b94ac5b39d8fe8bf91168a3dc4c5e7 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f38_prereg.json)" = "bb86d3d7f8b8d9052eb7522f7ed7b616c3b0d66c"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f38_composition_dev.py)" = "988ed16297dd70d4a6557d9f3410d22743fe2da5"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f32_source_snapshot.json)" = "453dad0363689cff785c26db5441555c6841f95d"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/evidence/f35_source_depth2_snapshot.json)" = "3fc50ddf7453958c458db697eacf2e27d3d52f57"
          python scripts/build_code_atlas.py --check-if-present
          python scripts/build_code_atlas.py --check
          echo F38_ATLAS_ROOT_SOURCE_EXACT=PASS
      - name: Install exact inherited F24 original regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: Full original root test regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full QTR contributor regression on unchanged source archives
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Full exact SHA source checkout unchanged
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F38_FULL_FINAL_SOURCE_EXACT_PASS
