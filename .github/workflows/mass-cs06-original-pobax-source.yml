name: Mass CS06 independent POBAX original causal-information screen
on:
  push:
    branches:
      - research/mass-cs06-independent-pobax-source-screen-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs06-independent-pobax-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-source-information-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      XLA_FLAGS: '--xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1'
      JAX_PLATFORMS: cpu
    steps:
      - name: Checkout immutable first-prereg branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 6
          persist-credentials: false
      - name: Verify original frozen prereg FIRST and additive-only diff
        shell: bash
        run: |
          set -euo pipefail
          first=0f420c7eaf520b2de6d5abe8ec2a250b3d3a8b80
          parent=20ab6ff04f05c9ad5136a567097d2a713299b9e8
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS06_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys; got=set(sys.stdin.read().splitlines()); want={"research/native/itd01/mass_r10/CS06_PREREG.md","research/native/itd01/mass_r10/screen_cs06_original_pobax.py",".github/workflows/mass-cs06-original-pobax-source.yml"}; assert got==want,(got,want)'
      - name: Checkout unmodified independently authored POBAX original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taodav/pobax
          ref: a5e1d62d14e4efe783885b9d4f19cffa2a568eec
          path: external/pobax-original
          persist-credentials: false
      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded original source dependencies on CPU, no extra optional source
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs06-evidence
          set +e
          timeout 480s python -m pip install --no-cache-dir --timeout 35 --retries 1 'jax==0.6.2' 'jaxlib==0.6.2' chex gymnax flax brax >cs06-evidence/pip-install.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            timeout 60s python -m pip install --no-deps -e external/pobax-original >>cs06-evidence/pip-install.log 2>&1
            rc=$?
          fi
          set -e
          printf '%s\n' "$rc" >cs06-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Execute original source-native POBAX RockSample and Battleship public audit
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/screen_cs06_original_pobax.py \
            --upstream external/pobax-original --out cs06-evidence/
      - name: Preserve source qualification evidence including all failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs06-original-pobax-source
          path: cs06-evidence/
          retention-days: 30
