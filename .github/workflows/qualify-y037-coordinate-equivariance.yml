name: Yggdrasil Y037 frozen coordinate sorting ablation
on:
  push:
    branches: [research/y037-coordinate-invariant-matching-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable prereg, source and predecessor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1b89e7039cb750a85ba0a2c384d7b0982e38012e HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-topology/execute.py)" = 1ded906998dd2db7af1e3ce61a865db4a2d21b26
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-coordinate-matching/prereg.json)" = 03d13495eb8f11062163cf906501158e0f8c3128
          test "$(git hash-object research/contrib/chatgpt/20261013-y037-coordinate-matching/execute.py)" = cb5ceb893448d50a561f8376f8f4d9a56f2b3ac1
          python3 -m json.tool research/contrib/chatgpt/20261013-y037-coordinate-matching/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y037-coordinate-matching/execute.py
      - name: One original frozen cell coordinate-equivariance evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y037-coordinate-matching/execute.py >/tmp/Y037-original.json
          python3 -m json.tool /tmp/Y037-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y037-original.json'))
          assert x['sealed_heldout_seeds']==list(range(224,240))
          print('CLASSIFICATION',x['classification'])
          print('CANONICAL_MISMATCHES',x['heldout_assignment_mismatches'])
          print('CHURN_BY_MODE',x['heldout_churn_by_policy_mode'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y037-original-coordinate-equivariance
          path: /tmp/Y037-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
