name: MR34I9B original-source compiled binary64 kernel four-worker falsification
on:
  push:
    branches: [research/mr34i9b-bounded-compiled-sigmoid-20261022]
    paths:
      - research/mr34i9a/candidate_sigmoid8.c
      - research/mr34i9a/measure_compiled.py
      - research/mr34i9a/close_four.py
      - .github/workflows/mr34i9b-compiled-falsification.yml
permissions:
  contents: read
concurrency:
  group: mr34i9b-frozen-source-20261022
  cancel-in-progress: false
jobs:
  candidates:
    name: frozen-original (${{ matrix.os }} replicate-${{ matrix.replicate }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        replicate: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Prevent Windows line-ending mutation
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: s4c1
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Cactus-proj/core-math
          ref: 74fcd1094a316164c94481f40f5c9658439bee63
          path: coremath
          persist-credentials: false
          fetch-depth: 0
      - name: Admit frozen source provenance and only three source files plus workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/Yggdrasil
          test "$GITHUB_REF" = refs/heads/research/mr34i9b-bounded-compiled-sigmoid-20261022
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
          test "$(git -C audit rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C audit merge-base 9d0d66511fcde0d3e7c16489541c077692f08650 HEAD)" = 9d0d66511fcde0d3e7c16489541c077692f08650
          git -C audit diff --check 9d0d66511fcde0d3e7c16489541c077692f08650 HEAD
          git -C audit diff --name-only 9d0d66511fcde0d3e7c16489541c077692f08650 HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' .github/workflows/mr34i9b-compiled-falsification.yml research/mr34i9a/candidate_sigmoid8.c research/mr34i9a/close_four.py research/mr34i9a/measure_compiled.py > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(git -C audit log -1 --format=%H -- research/mr34i9a/frozen_preregistration.json)" = 9d0d66511fcde0d3e7c16489541c077692f08650
          test "$(git -C audit log -1 --format=%H -- research/mr34i9a/frozen_source_toolchain_lock.json)" = 9d0d66511fcde0d3e7c16489541c077692f08650
          test "$(git -C audit hash-object research/mr34i4/kernel_probe.py)" = 79df5303a4278d65363d8ab17a5d832c576b8722
          test "$(git -C s4c1 rev-parse HEAD)" = 8e1561eb1a542e21307bac669c42435cf48e59bd
          test "$(git -C external/minigrid rev-parse HEAD)" = 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C external/pycolab rev-parse HEAD)" = 6504c8065dd5322438f23a2a9026649904f3322a
          test "$(git -C coremath rev-parse HEAD)" = 74fcd1094a316164c94481f40f5c9658439bee63
          test "$(git -C coremath hash-object src/binary64/exp/exp.c)" = 196e71ff8f00ab9df0802f3661cbe845ff8e118c
          grep -q 'Permission is hereby granted, free of charge' coremath/src/binary64/exp/exp.c
          echo MR34I9B_SOURCE_AND_LICENSE_FROZEN=PASS
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact original source Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Windows original Pycolab curses
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify downloaded pinned Zig 0.13.0 archive bytes before extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,tarfile,urllib.request,zipfile
          lock=json.loads(pathlib.Path('audit/research/mr34i9a/frozen_source_toolchain_lock.json').read_text())
          if lock['zig']['version']!='0.13.0':raise SystemExit('MR34I9B_COMPILER_LOCK_VERSION_CHANGED')
          system=os.environ['RUNNER_OS']
          key='windows_x86_64' if system=='Windows' else 'linux_x86_64' if system=='Linux' else None
          if key is None:raise SystemExit('MR34I9B_OS_UNSUPPORTED')
          data=urllib.request.urlopen(lock['zig'][key]['url'],timeout=90).read()
          actual=hashlib.sha256(data).hexdigest()
          if actual!=lock['zig'][key]['sha256']:raise SystemExit('MR34I9B_ZIG_ARCHIVE_SHA_MISMATCH')
          archive=pathlib.Path('zig-frozen.zip' if system=='Windows' else 'zig-frozen.tar.xz')
          archive.write_bytes(data)
          target=pathlib.Path('pinned-zig');target.mkdir(exist_ok=False)
          if system=='Windows':
              with zipfile.ZipFile(archive) as z:z.extractall(target)
          else:
              with tarfile.open(archive,mode='r:xz') as t:t.extractall(target)
          candidates=list(target.glob('*/zig.exe' if system=='Windows' else '*/zig'))
          if len(candidates)!=1:raise SystemExit('MR34I9B_COMPILER_BINARY_NOT_UNIQUE')
          absolute=str(candidates[0].resolve())
          pathlib.Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write('PINNED_ZIG='+absolute+'\n')
          print('MR34I9B_EXACT_ZIG_ARCHIVE_SHA256='+actual)
          PY
      - name: Compile exactly pinned cr_exp plus unintegrated C ABI; refuse compiler substitution
        shell: bash
        run: |
          set -euo pipefail
          test "$("$PINNED_ZIG" version)" = 0.13.0
          mkdir -p evidence
          if [ "$RUNNER_OS" = Windows ]; then extension=dll; else extension=so; fi
          "$PINNED_ZIG" cc -O2 -shared -fno-fast-math -ffp-contract=off -frounding-math \
            -o "evidence/candidate.$extension" \
            coremath/src/binary64/exp/exp.c audit/research/mr34i9a/candidate_sigmoid8.c -lm
          test -s "evidence/candidate.$extension"
          echo "CANDIDATE_LIBRARY=$GITHUB_WORKSPACE/evidence/candidate.$extension" >> "$GITHUB_ENV"
          "$PINNED_ZIG" cc -v > evidence/compiler-identity.txt 2>&1 || true
          echo MR34I9B_FROZEN_ZIG_NATIVE_BUILD=PASS
      - name: Genuine original TRAINING logits and matched ABBA cost + Decimal120 verification
        shell: bash
        run: |
          set -euo pipefail
          python -B audit/research/mr34i9a/measure_compiled.py --evaluate \
            audit s4c1 external/minigrid external/pycolab coremath \
            "$CANDIDATE_LIBRARY" evidence/receipt.json
          test -s evidence/receipt.json
          echo MR34I9B_ORIGINAL_SOURCE_DEVELOPMENT_MEASUREMENT_COMPLETE=TRUE
      - name: Check source-only invariant after original-source execution
        shell: bash
        run: |
          set -euo pipefail
          for dir in audit s4c1 external/minigrid external/pycolab coremath; do
            git -C "$dir" diff --exit-code
            test -z "$(git -C "$dir" status --porcelain)"
          done
          echo MR34I9B_NO_NATIVE_SOURCE_MUTATION=PASS
      - name: Retain all evidence including resource NO-GO (never choose best worker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr34i9b-${{ matrix.os }}-${{ matrix.replicate }}
          path: |
            evidence/receipt.json
            evidence/compiler-identity.txt
          if-no-files-found: warn
          retention-days: 30
  close:
    name: Independent all-four original-training kernel closure (never transfer acceptance)
    if: always()
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve every worker or fail closed, preserving unfavorable receipts
        uses: actions/download-artifact@v4
        with:
          pattern: mr34i9b-*
          path: all-workers
          merge-multiple: false
      - name: Final immutable-source evidence closure
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = spoonman136668-ai/Yggdrasil
          test "$GITHUB_REF" = refs/heads/research/mr34i9b-bounded-compiled-sigmoid-20261022
          mkdir -p closure
          python -B research/mr34i9a/close_four.py all-workers closure/mr34i9b-four-worker-disposition.json
      - name: Preserve final scientific decision including all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr34i9b-all-four-frozen-decision
          path: closure/mr34i9b-four-worker-disposition.json
          if-no-files-found: warn
          retention-days: 30
