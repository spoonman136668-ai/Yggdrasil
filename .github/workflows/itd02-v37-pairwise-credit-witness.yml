name: ITD-02 V37 native public pairwise credit new-world decision witness
on:
  push:
    branches:
      - research/itd02-v37-public-pairwise-credit-20261028
permissions:
  contents: read
jobs:
  v37-pairwise-credit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Set exact Git newline and source checkout policy
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact SHA no retained GitHub credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen V36 parent and V37 prereg-before-executable source integrity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1862966187560bf09f3accd76c270f7afd171d26 "$GITHUB_SHA"
          git merge-base --is-ancestor 8d765ca11d938b2252cf1dea26c09f43f81d9c35 "$GITHUB_SHA"
          git merge-base --is-ancestor 6fc8c06fde7a72fd32f7de6e9611f5f736a03ac4 "$GITHUB_SHA"
          git merge-base --is-ancestor 039fb30fdeba78eede994148a374a69f079c64f7 "$GITHUB_SHA"
          git merge-base --is-ancestor 9c473a638a6004b420e6f9e40b92383fa3f492da "$GITHUB_SHA"
          git merge-base --is-ancestor 716684b24365045ab03e42ffc581c481cc23757a "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object yggdrasil/itd02_v26_calibrated_return_dev.py)" = 8a0417d34c6ba94a4eaef33d767da14a4a5c9709
          test "$(git hash-object yggdrasil/itd02_v30_public_probe_policy_dev.py)" = bcc1f0b4e2ec0fcd8b2af69dfb0e6d4d2ca27a4a
          test "$(git hash-object yggdrasil/itd02_v35_action_conditioned_ring_dev.py)" = 04c21dc35054e98bc1a366af7c962983e64ef02d
          test "$(git hash-object research/itd02_v36_public_identifiability_rank_audit.py)" = 2ccaab236ca56f347d59e47f756e9e78f9104479
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: V37 native pairwise credit, checkpoint and public only focused tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v37_public_pairwise_credit.py' -v
          echo V37_FOCUSED_ORIGINAL_NATIVE_SAFETY_PASS_NOT_SCIENCE
      - name: V37 21 independently chosen toy-world feedback arms and original source return
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v37"
          if ! PYTHONPATH=. python -B research/itd02_v37_public_pairwise_credit_audit.py > "$RUNNER_TEMP/v37/evidence.json" 2> "$RUNNER_TEMP/v37/stderr.log"; then
            cat "$RUNNER_TEMP/v37/stderr.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v37/evidence.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema"]=="ygg.itd02.v37.public_pairwise_local_margin.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["native_original_mutated"] and not d["known_unselected_reward_to_model"]
          assert not d["native_action_identities_learned"]
          assert d["worlds"]==["F1","F2","F3"]
          assert d["independent_arm_count"]==21 and len(d["independent_modes"])==7
          assert d["pretrained_protected_source_public_updates"]==576
          assert d["actual_base_target_public_updates"]==12
          assert d["additional_prospective_target_public_updates"]==3
          assert d["source_return_selected_public_updates"]==12
          assert d["native_trainable_scalars_per_model"]==163
          assert len(set(d["frozen_world_manifest_sha"].values()))==3
          assert len(d["canonical_selected_policy_and_credit_sha"])==64
          assert len(d["arm_summary"])==21
          assert all(x["checkpoint_bytes"] is None or x["checkpoint_bytes"]<=12288
                     for x in d["arm_summary"])
          assert all(x["unchanged"] and x["updates"]==0 and x["margin_updates"]==0
                     for x in d["no_learning_controls"].values())
          assert d["classification"] in {
            "V37_PUBLIC_MARGIN_DID_NOT_IMPROVE_TRANSFER__NO_SCIENCE",
            "V37_STRONG_CONTROL_OR_RETENTION_FAILED__NO_SCIENCE",
            "V37_BOUNDED_SYNTHETIC_MARGIN_CREDIT_ENGINEERING_POSITIVE__NO_SCIENCE"}
          print("V37_CLASSIFICATION",d["classification"])
          print("V37_CANONICAL_SHA",d["canonical_selected_policy_and_credit_sha"])
          print("V37_PREDECLARED_GATES",json.dumps(d["predeclared_outcome"],sort_keys=True))
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exact inherited V36 through V22 native safety tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v36_public_identifiability_rank.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v35_action_conditioned_local_basis.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v34_local_credit_spillover.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v33_unseen_family_independent_controls.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v32_source_surprise_probation.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v31_credit_readout_attribution.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v30_public_probe_policy.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v29_observational_equivalence.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V37_INHERITED_SAFETY_PASS_NOT_SCIENCE
      - name: Preserve source-locked evidence and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v37-public-pairwise-credit-${{ matrix.os }}
          path: ${{ runner.temp }}/v37/*
          retention-days: 7
          if-no-files-found: warn
