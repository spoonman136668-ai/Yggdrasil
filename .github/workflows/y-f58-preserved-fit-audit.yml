name: Y-F58 archive-only FIT source and public-path verification
on:
  push:
    branches:
      - audit/y-f58-preserved-fit-20261015-r1
permissions:
  contents: read
  actions: read
jobs:
  read-only-existing-source:
    if: "${{ github.event.head_commit.message == 'audit(y-f58): source-free verification of existing FIT without replay' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen prereg/source identity and narrow verifier-only repair
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5bdcddcc62359d67f26facb29bb6c572f3e3b3de HEAD
          git merge-base --is-ancestor dd188d9bc39f1c3a73dd033b70ef8811860ebe3a HEAD
          test "$(git hash-object research/foundational/20261015-y-f58/prereg.json)" = 9cb54ec69a04fc1ec963b347ef802615b42f7b48
          test "$(git hash-object research/foundational/20261015-y-f58/source_feasibility.py)" = f275d28e3755e2c90ea482d076d7401d722d71b8
          test "$(git hash-object research/foundational/20261015-y-f58/audit_fit.py)" = 98dfae0831df23407bb47af9f5f96514514f5676
          python3 -B -m py_compile research/foundational/20261015-y-f58/audit_fit.py
      - name: Verify original consumed run and immutable archived ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(curl --fail --silent --show-error --retry 2 --max-time 20 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/runs/38828180915")
          echo "$run" | jq -e --arg sha 5bdcddcc62359d67f26facb29bb6c572f3e3b3de '.head_sha==$sha and .status=="completed" and .conclusion=="failure" and .run_attempt==1'
          arts=$(curl --fail --silent --show-error --retry 2 --max-time 20 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/runs/38828180915/artifacts")
          echo "$arts" | jq -e --arg sha 5bdcddcc62359d67f26facb29bb6c572f3e3b3de '[.artifacts[] | select(.id==12015877837 and .name=="Yggdrasil-F58-once-FIT-feasibility-evidence" and .digest=="sha256:31640dbfa2104f9a0448ef1214a6bf9818b776b807788ed71ea2f5bbea0a21af" and (.expired|not) and .workflow_run.id==38828180915 and .workflow_run.head_sha==$sha)] | length==1'
      - uses: actions/download-artifact@v4
        with:
          name: Yggdrasil-F58-once-FIT-feasibility-evidence
          run-id: 38828180915
          github-token: ${{ github.token }}
          repository: spoonman136668-ai/Yggdrasil
          path: ${{ runner.temp }}/existing
      - name: Independently recount public role paths, byte receipts and frozen source thresholds
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/existing/SOURCE_SHA")" = 5bdcddcc62359d67f26facb29bb6c572f3e3b3de
          python3 -m json.tool "$RUNNER_TEMP/existing/result.json" >/dev/null
          python3 -B research/foundational/20261015-y-f58/audit_fit.py "$RUNNER_TEMP/existing/result.json" research/foundational/20261015-y-f58/prereg.json > "$RUNNER_TEMP/y58-audit-only.txt"
          cat "$RUNNER_TEMP/y58-audit-only.txt"
          sha256sum "$RUNNER_TEMP/existing/result.json" "$RUNNER_TEMP/y58-audit-only.txt" > "$RUNNER_TEMP/y58-audit-manifest.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/y58-audit-head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Y-F58-audit-only-existing-FIT-evidence
          path: |
            ${{ runner.temp }}/y58-audit-only.txt
            ${{ runner.temp }}/y58-audit-manifest.sha256
            ${{ runner.temp }}/y58-audit-head.txt
          retention-days: 90
          if-no-files-found: error
      - name: Explicit exclusions
        run: echo "SOURCE_EXPERIMENT_RERUNS=ZERO DIAG=ZERO ORIGINALS=ZERO UNFAIR_ORACLE_MISSING_DISCLOSED=TRUE"
