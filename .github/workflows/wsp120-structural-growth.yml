name: WSP120 public source-safe structural growth qualification
on:
  push:
    branches: [research/wsp120-structural-growth-20261115]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin prereg-first source and reject any scientific first-use
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor afbec2ce5e25cac09001d00ff1bb777838b7a937 HEAD
          git merge-base --is-ancestor 65393f50007de24cc8611eeda27d2e725d3633bc HEAD
          test ! -e research/contrib/chatgpt/WSP-120/SCIENTIFIC_PASS.json
          test ! -e research/contrib/chatgpt/WSP-120/PROTECTED_FIRST_USE.json
          test -z "$(git status --porcelain)"
      - name: Install pinned CPU conventional comparator dependency
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: WSP120 disjoint engineering fixture and source negatives
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-120 -p 'test_*.py' -v
      - name: Before atlas, only source-safe focused tests are admissible
        shell: bash
        run: |
          set -euo pipefail
          test -f research/contrib/chatgpt/WSP-120/test_wsp120.py
          test -f research/contrib/chatgpt/WSP-120/prereg.json
      - name: Verify immutable source checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp120): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp120-source-only-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create exactly three derived atlas files on isolated WSP120 branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 65393f50007de24cc8611eeda27d2e725d3633bc HEAD
          test -z "$(git status --porcelain)"
          S="$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --write --source-commit "$S"
          git add -- .ice/code-atlas.json .ice/code-atlas.ice .ice/code-atlas.html
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp120): pin G29 source atlas at $S"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp120-structural-growth-20261115
          echo "WSP120_G29_SOURCE=$S"
          echo "WSP120_G29_ARCHIVE=$(git rev-parse HEAD)"

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp120): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned inherited WSP117 dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Install pinned CPU conventional comparator dependency
        run: python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Check exact source atlas and no protected experiment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 65393f50007de24cc8611eeda27d2e725d3633bc HEAD
          python -B scripts/build_code_atlas.py --check-if-present
          test ! -e research/contrib/chatgpt/WSP-120/PROTECTED_FIRST_USE.json
          test ! -e research/contrib/chatgpt/WSP-120/SCIENTIFIC_PASS.json
      - name: WSP120 and WSP119 118 117 inherited focused tests
        shell: bash
        run: |
          set -euo pipefail
          for n in 117 118 119 120; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory final inherited root tests and clean tree
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
