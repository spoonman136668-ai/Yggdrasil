name: ITD-02 V21 local bandwidth and head fragmentation source-only
on:
  push:
    branches:
      - research/itd02-v21-channel-capacity-credit-fragmentation-20261028
permissions:
  contents: read
jobs:
  v21-local-capacity-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact source bytes across hosts
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Exact immutable push
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg ancestry and exact original learner bytes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f5fd77ef7b56c84cf7d8e848a05eee3e2411e56f "$GITHUB_SHA"
          git merge-base --is-ancestor 2cfff46b41ea63083e155f2595ac1ce9c8dec1e9 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v17_neighbor_carried_learner_dev.py)" = 4e3c77797e66df3a26742d23d18f038644891e55
          test "$(git hash-object yggdrasil/itd02_v18_intermediate_plasticity_dev.py)" = 711391944be7bd94f1898005d1233bfe52a6f216
          test "$(git hash-object research/itd02_v18_intermediate_plasticity_audit.py)" = 7a8f361ff13cf75f716c544add192c2ff9c5aae9
          test "$(git hash-object yggdrasil/itd02_v20_causal_credit_dev.py)" = c7eb9cfc0a4820400fb3c8b78febeb11ae035570
          test "$(git hash-object research/itd02_v20_responsibility_gated_audit.py)" = 5ebcfc262016999c39e3b34a48e732d7dabebbb7
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Original ring local information and no hidden target controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v21"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v21_capacity_learning_audit.py' -v > "$RUNNER_TEMP/v21/focused.log" 2>&1
          cat "$RUNNER_TEMP/v21/focused.log"
          echo ITD02_V21_LOCAL_CAPACITY_FOCUSED_PASS_NO_SCIENCE
      - name: Predeclared 5-hop budgets, 128 masks and 72-fold ridge witnesses
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v21_capacity_learning_audit.py > "$RUNNER_TEMP/v21/audit.json"
          python - "$RUNNER_TEMP/v21/audit.json" <<'PY'
          import json,math,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert x["schema"]=="ygg.itd02.v21.transport_capacity_and_head_fragmentation.source_only.v1"
          assert x["source_only"] and not x["scientific_first_use"]
          assert not x["original_world_training"]
          assert x["original_native_model_unchanged"]
          assert x["native_ring_cells"]==8 and x["fixed_source_public_channels"]==7
          assert x["public_history_count_per_head"]==12 and x["full_contexts"]==36
          assert x["max_neighbor_hops"]==4 and x["exhaustive_channel_subsets_checked"]==128
          assert set(x["per_hop_per_head_capacity"])=={"0","1","2","3","4"}
          assert all(len(v)==3 for v in x["per_hop_per_head_capacity"].values())
          for r in x["per_hop_per_head_capacity"].values():
              assert all(1<=z["distinct_local_histories"]<=12 and
                         1<=z["local_feature_rank"]<=12 for z in r.values())
          assert x["unmodified_v20_checkpoint_cold_equal"]
          assert x["unmodified_v20_checkpoint_bytes"]<=8192
          assert len(x["source_only_record_sha256"])==64
          assert all(math.isfinite(v) and v>=0
              for fam in x["all_data_per_head_ridge_error"].values() for v in fam.values())
          assert all(math.isfinite(v) and v>=0
              for fam in x["loo_per_head_and_pooled_ridge_error"].values() for v in fam.values())
          full=all(z["distinct_local_histories"]==12 and z["local_feature_rank"]==12
              for z in x["per_hop_per_head_capacity"]["4"].values())
          assert x["classification"]==(
              "V21_FULL_HOP_CAPACITY_SUFFICIENT_LEARNING_FAILURE_DOWNSTREAM__NO_SCIENCE"
              if full else "V21_TRANSPORT_REPRESENTATION_BOTTLENECK_FOUND__NO_SCIENCE")
          print("ITD02_V21_TRANSPORT_AND_RIDGE_DIAGNOSTIC_PASS_NO_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v21/audit.json"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: One final inherited V20 V19 V18 V17 V16 V15 V12 native regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B research/itd02_v20_responsibility_gated_audit.py > "$RUNNER_TEMP/v21/inherited-v20.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v20_responsibility_gated_credit.py' -v
          PYTHONPATH=. python -B research/itd02_v19_local_credit_causality_audit.py > "$RUNNER_TEMP/v21/inherited-v19.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v19_local_credit_causality.py' -v
          PYTHONPATH=. python -B research/itd02_v18_intermediate_plasticity_audit.py > "$RUNNER_TEMP/v21/inherited-v18.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v18_intermediate_plasticity_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v17_neighbor_carried_learner_dev.py' -v
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v21/inherited-v16.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo ITD02_V21_FINAL_INHERITED_NATIVE_INTEGRATION_PASS_NO_SCIENCE
      - name: Retain per-host exact source-only diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v21-channel-capacity-${{ matrix.os }}
          path: ${{ runner.temp }}/v21/*
          if-no-files-found: warn
          retention-days: 7
