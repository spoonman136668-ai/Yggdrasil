name: ITD-02 V25 unlabeled return candidate safety qualification
on:
  push:
    branches:
      - research/itd02-v25-unlabeled-return-recognition-20261028
permissions:
  contents: read
jobs:
  v25-candidate-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Cross-platform exact source configuration
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source, no persist-credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve V25 prereg-before-code and original native source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d3af4f93f6a34f7685a4fb0fd1afe007041de538 "$GITHUB_SHA"
          git merge-base --is-ancestor 089918a7bdefbdd19cf4b817bf191a60c2e76805 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: V25 focused frozen source, public evidence and corruption tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo ITD02_V25_CANDIDATE_BOUNDARY_PASS_NOT_TRANSFER_SCIENCE
      - name: Preserve inherited negative mechanism and native baseline regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v23_unfamiliar_mapping_audit.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo ITD02_V25_ORIGINAL_NATIVE_SOURCE_INTEGRITY_PASS_NO_SCIENCE
