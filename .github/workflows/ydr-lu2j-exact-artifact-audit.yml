name: YDR LU2J Exact Artifact Audit

on:
  push:
    branches: [dg1a-ar]
    paths:
      - research/control/lu2j-exact-artifact-audit.json

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "spoonman136668-ai/Yggdrasil"
          test -f research/control/lu2j-exact-artifact-audit.json

      - name: Download accepted LU2I duplicate
        uses: actions/download-artifact@v4
        with:
          name: ydr-isolated-36050323979-1
          path: /tmp/lu2j-source
          github-token: ${{ github.token }}
          run-id: 36050323979

      - name: Audit exact accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lu2j-audit
          mkdir -p /tmp/lu2j-audit
          python3 research/applications/track-a/lu2j_exact_artifact_exposure_audit.py \
            /tmp/lu2j-source/primary1.bin \
            /tmp/lu2j-source/primary2.bin \
            /tmp/lu2j-audit/audit.json
          cat /tmp/lu2j-audit/audit.json

      - name: Upload LU2J evidence
        uses: actions/upload-artifact@v4
        with:
          name: lu2j-exact-audit-${{ github.run_id }}
          path: /tmp/lu2j-audit/**
          if-no-files-found: error
          retention-days: 14
