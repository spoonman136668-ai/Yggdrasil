name: WSP-16 contradiction recovery and retention full public DEV regression
on:
  pull_request:
    branches:
      - research/wsp16-numeric-structural-plasticity-20261110
    paths:
      - 'research/contrib/chatgpt/WSP-16/**'
      - '.github/workflows/wsp16-pr-validation.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full original WSP01-16 regression plus unchanged WSP15 and frozen WSP16 DEV
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python research/contrib/chatgpt/WSP-16/qualify.py
