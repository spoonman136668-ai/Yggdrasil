name: Yggdrasil Y038 16-episode original science
on:
  push:
    branches: [research/y038-extended-recurrence-r1]
permissions:
  contents: read
jobs:
  original-science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source and prereg identity freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 481a7ec6ce46100bf7c75d9d1c6fd63f99a2e7fe HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-novel-shifts/execute.py)" = 731b21616691af2f726fb8017ce69b58b08c91a6
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-long-horizon/prereg.json)" = 1ee97ed0b8d444e2252f2191f24fb6a5ff91552c
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-long-horizon/execute.py)" = e7013e30e639772444059da5b1abe85f5f45cc9e
          python3 -m json.tool research/contrib/chatgpt/20261013-y038-long-horizon/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y038-long-horizon/execute.py
      - name: Original first-use extended-horizon memory test
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y038-long-horizon/execute.py > /tmp/Y038-original.json
          python3 -m json.tool /tmp/Y038-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y038-original.json'))
          assert len(x['regimes'])==4
          assert x['sealed_heldout_seeds']==list(range(256,272))
          print('CLASSIFICATION',x['classification'])
          for r in x['regimes']:
              print(r['regime'],'CHURN_FIRST',r['half_churn'][0],
                    'CHURN_SECOND',r['half_churn'][1])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y038-original-16-episode
          path: /tmp/Y038-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Final one full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
