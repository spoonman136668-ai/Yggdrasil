name: A33 F33 Primary Execution

on:
  push:
    branches:
      - exec/a33-f33-primary-r1
    paths:
      - .github/workflows/a33-f33-primary-exec.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify frozen A33 bundle
        shell: bash
        run: |
          set -euo pipefail
          cd research/applications/track-a
          python3 - <<'PY'
          import gzip,hashlib
          from pathlib import Path
          p=Path("a33_t8q_independent_competing_hazard_recruitment_v1.py.gz")
          src=gzip.decompress(p.read_bytes())
          assert len(src)==22282, len(src)
          assert hashlib.sha256(src).hexdigest()=="d483897b88d2948e8c96f375e257702425b5d2ab32ec9599894a73967e03803e"
          print("A33_FROZEN_SOURCE_OK")
          PY
      - name: Show frozen CLI
        shell: bash
        run: |
          set -euo pipefail
          cd research/applications/track-a
          python3 a33_t8q_independent_competing_hazard_recruitment_v1.py --help
