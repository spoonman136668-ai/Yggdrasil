name: LR-92AR DEV01 36-world disjoint source-locked evaluation
'on':
  push:
    branches: [research/lr92ar-dev01-source-qualification-20261119]
    paths: ['.github/workflows/lr92ar-dev01-once.yml']
permissions:
  contents: read
jobs:
  independent_dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LR92AR_NO_PROTECTED_PRIMARY: 'true'
    steps:
      - name: Prevent checkout line-ending mutation
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e8f06f1a89459133d8458b02622f62d2d65071f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native source qualification on exactly frozen candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8e8f06f1a89459133d8458b02622f62d2d65071f"
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          echo LR92AR_DEV01_ROOT_NATIVE_FULL_REGRESSION_PASS
      - name: Git blob custody + source-first chronological lock
        shell: bash
        run: |
          set -euo pipefail
          root='research/contrib/spoonman136668-ai/lr92ar-phase-blind-posterior'
          test "$(git rev-parse HEAD)" = "8e8f06f1a89459133d8458b02622f62d2d65071f"
          test "$(git hash-object "$root/prereg.json.txt")" = 9aa65a206e805f4975741836cb9a5e02158c597e
          test "$(git rev-parse '2e0b0ecb0f4c9d7b3d6431480a81587410d7b3e6':"$root/prereg.json.txt")" = 9aa65a206e805f4975741836cb9a5e02158c597e
          test "$(git hash-object "$root/dev01_prereg.json.txt")" = f43079dc1adddfecebb33a60f99b7b6b0b934606
          test "$(git rev-parse 'e7cfc6416a75e6f8a2272966567955e56bdd450f':"$root/dev01_prereg.json.txt")" = f43079dc1adddfecebb33a60f99b7b6b0b934606
          test "$(git hash-object "$root/phase_blind_posterior.py.txt")" = b53eba44cc5cdcdacfc65e2a9af282a7972ea497
          test "$(git hash-object "$root/dev01_worlds.py.txt")" = e0b72d8b8ada885ec87d0e2d00559e7c5286d9d2
          test "$(git hash-object "$root/dev01_screen.py.txt")" = e8248b98924e1e4850a88b22c49a7c989997a93b
          test "$(git hash-object "$root/test_dev01_screen.py.txt")" = cdd8165aabe098e6616dfd8e2144b89fee446e0b
          git cat-file -t 2d35cfd721e43abddac1e9a36ea557399c6aeb5a | grep -Fx commit
          d="$RUNNER_TEMP/lr92ar-dev01"
          mkdir -p "$d"
          cp "$root/prereg.json.txt" "$d/prereg.json.txt"
          cp "$root/dev01_prereg.json.txt" "$d/dev01_prereg.json.txt"
          for name in phase_blind_posterior dev01_worlds dev01_screen test_dev01_screen; do
            cp "$root/$name.py.txt" "$d/$name.py"
            test "$(git hash-object "$d/$name.py")" = "$(git hash-object "$root/$name.py.txt")"
          done
          ap='research/contrib/spoonman136668-ai/lr92ap-same-address-retention'
          verify_copy() {
            src="$1"; localname="$2"; want="$3"
            actual="$(git rev-parse '2d35cfd721e43abddac1e9a36ea557399c6aeb5a':"$ap/$src.py.txt")"
            test "$actual" = "$want"
            git show '2d35cfd721e43abddac1e9a36ea557399c6aeb5a':"$ap/$src.py.txt" > "$d/$localname.py"
            test "$(git hash-object "$d/$localname.py")" = "$want"
          }
          verify_copy public_dual_timescale_cells public_dual_timescale_cells e2fca6e277efbf0bd3b77ba7e472e4b5432d205f
          verify_copy matched_tabular_controls matched_tabular_controls 7a223f6b097eb6e461853685195ba4b89af2f2b6
          verify_copy two_regime_hmm_control two_regime_hmm_control 41f3adcb8c12d540f3042ae03a6a9dbdd4d6e6f0
          verify_copy bounded_bayesian_controls bounded_bayesian_controls aafba29564433827ba0477d32b999a050571b9f9
          verify_copy bounded_runlength_bocpd bounded_runlength_bocpd 96bb94e608d2062fb4cc488ed010f150b8325787
          verify_copy random_gate_control random_gate_control 47691b96e570d7b14afb8f66ec329f9b89e8ae20
          verify_copy bocpd_exact_reference bocpd_exact_reference 9443839a3c1083cc6a03b9d84ac6927a68f58b08
          echo LR92AR_DEV01_ALL_FROZEN_GIT_BLOBS_VERIFIED_PASS
      - name: Run one frozen DEV screen with ten controls, deterministic receipt output
        shell: bash
        run: |
          set -euo pipefail
          test "$LR92AR_NO_PROTECTED_PRIMARY" = true
          (cd "$RUNNER_TEMP/lr92ar-dev01" && python -B test_dev01_screen.py)
          echo LR92AR_DEV01_ONE_SHOT_DEVELOPMENT_COMPLETE_NOT_PRIMARY
      - name: Final original checkout/source and owner untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8e8f06f1a89459133d8458b02622f62d2d65071f"
          test -z "$(git status --porcelain)"
          echo LR92AR_DEV01_CLEAN_EXACT_SOURCE_NO_OWNER_CHANGE_PASS
