name: ITD02 MG83 One-Shot Source Atlas Transition
on:
  push:
    branches:
      - research/itd02-mg83-public-consequence-revisit-20261030
    paths:
      - .github/workflows/itd02-mg83-atlas-transition.yml
      - .github/workflows/yggdrasil-g29-atlas.yml
      - .github/workflows/itd02-mg83-original-paired-local.yml
      - research/native/itd02/mg83/paired_original_dev.py
      - research/native/itd02/mg83/test_effect_cells.py
permissions:
  contents: write
jobs:
  generate-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source branch and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/itd02-mg83-public-consequence-revisit-20261030"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Generate original authenticated exact-source atlas
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --exit-code
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "MG83: source-pinned generated advisory atlas"
          python scripts/build_code_atlas.py --check-if-present
          git push origin HEAD:research/itd02-mg83-public-consequence-revisit-20261030
