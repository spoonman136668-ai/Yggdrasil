name: ITD-02 R11-on-R10/R9 source-custody qualification
on:
  push:
    branches: [qualification/itd02-r11-on-r10-r9-g29-20261025]
permissions:
  contents: read
jobs:
  source-integrity-and-focused-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pin BOTH original parent histories and frozen sources
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 210a81e90d023759b8fef8e950bb1019e8668e09 HEAD
          git merge-base --is-ancestor 56e0c14393b8a7ddee479dbee6779f092f33267d HEAD
          git merge-base --is-ancestor 77e3e5da623ac183b7491b3ce1dcfa67b1af8040 HEAD
          git merge-base --is-ancestor 50bad5c0568e2eba0c38ab204876f2abae7abdeb HEAD
          git merge-base --is-ancestor 1ff734e7d5c8b0d4a9f26395b23eb50547a4177e HEAD
          test "$(git rev-parse HEAD:.github/workflows/yggdrasil-g29-atlas.yml)" = baa005e32579327d5dde27a1a7bf653eb85c665c
          test "$(git rev-parse HEAD:research/native/itd02/r7/learner.py)" = 204ecd993b954b23e66d6d1e8b3568e7c93183c5
          test "$(git rev-parse HEAD:research/native/itd02/r8/revision.py)" = 346fb9eb7462208a6cbd28cfb51716c22e5ec857
          test "$(git rev-parse HEAD:research/native/itd02/r9/evidence_cells.py)" = 66ec3befe92e2d2c2b7116217354a40f59e659d7
          test "$(git rev-parse HEAD:research/native/itd02/r9/PREREG.json)" = 84637ba02627a4b817b0d894b124055ce352543d
          test "$(git rev-parse HEAD:research/native/itd02/r10/public_adapter.py)" = 3917d36ce9f86a2c1b998a0a2f93fb27674a9205
          test "$(git rev-parse HEAD:research/native/itd02/r10/test_public_adapter.py)" = f48835a97579821f45875db30dba3887d76b6595
          test "$(git rev-parse HEAD:research/native/itd02/r10/PREREG.json)" = 8cfbbe0b17842361a173af3f14ab1a8837cfb763
          test "$(git rev-parse HEAD:research/native/itd02/r11/affordance_cells.py)" = 614c7dfb1b43f485009b70cb85e9b7b5119cafc2
          test "$(git rev-parse HEAD:research/native/itd02/r11/test_affordance_cells.py)" = 67c51fe0ef8ab2e47973284dbd696d8bc169c5b4
          test "$(git rev-parse HEAD:research/native/itd02/r11/PREREG.json)" = 0bb989459762456f462467ffacca9507c0e6ae5e
          echo R11_R10_R9_ORIGINAL_CUSTODY=PASS
      - name: Qualify original R9, R10, R11 test suites with current G29
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r9 -p 'test_evidence_cells.py' -v
          python -B -m unittest discover -s research/native/itd02/r10 -p 'test_public_adapter.py' -v
          python -B -m unittest discover -s research/native/itd02/r11 -p 'test_affordance_cells.py' -v
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo R11_R10_R9_FOCUSED_AND_G29=PASS
          echo R11_CONVENTIONAL_PARITY_AND_COLD_RESTART=SOURCE_ONLY
          echo PROTECTED_FIRST_USE=ZERO
  one-shot-atlas:
    if: github.event.head_commit.message == 'Arm R11-on-R10/R9 G29 qualification artifact reanchor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Regenerate only three G29 artifacts from authenticated combined source
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 210a81e90d023759b8fef8e950bb1019e8668e09 "$A"
          git merge-base --is-ancestor 56e0c14393b8a7ddee479dbee6779f092f33267d "$A"
          test "$(git rev-parse HEAD:research/native/itd02/r11/affordance_cells.py)" = 614c7dfb1b43f485009b70cb85e9b7b5119cafc2
          test "$(git rev-parse HEAD:.github/workflows/yggdrasil-g29-atlas.yml)" = baa005e32579327d5dde27a1a7bf653eb85c665c
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git diff --cached --quiet && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-anchor R11-on-R10/R9 source-only atlas to $A"
          B="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$A" "$B"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = 3
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/qualification/itd02-r11-on-r10-r9-g29-20261025
          echo R11_BRIDGE_SOURCE_A="$A"
          echo R11_GENERATED_ONLY_B="$B"
