name: Yggdrasil Y029 frozen selective-cache scientific validation
on:
  push:
    branches: [research/y029-selective-cache-trust-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen parent, prereg, and code identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 553870f7491390ff8884a824832691a60969f985 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y028-alternating-drift/execute.py)" = b0a570bc7fddc0580f335e586262a0580288be61
          test "$(git hash-object research/contrib/chatgpt/20261012-y029-cache-trust/prereg.json)" = 728914c83a929c072247ef5ebbbe4c930e1e0485
          test "$(git hash-object research/contrib/chatgpt/20261012-y029-cache-trust/execute.py)" = 7d9bbfb074e51364f42c1700efb16ada9c0a78c2
          python3 -m json.tool research/contrib/chatgpt/20261012-y029-cache-trust/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-y029-cache-trust/execute.py
      - name: Original frozen selective-cache science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-y029-cache-trust/execute.py > /tmp/Y029-original.json
          python3 -m json.tool /tmp/Y029-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y029-original-cache-trust
          path: /tmp/Y029-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Final full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
