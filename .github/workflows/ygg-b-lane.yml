      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ygg-b-${{ steps.ctl.outputs.mode }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ygg-b-bootstrap\**
            ${{ runner.temp }}\ygg-b1\**
            ${{ runner.temp }}\ygg-b2\**
            ${{ runner.temp }}\ygg-b3\**
            ${{ runner.temp }}\ygg-b4\**
            ${{ runner.temp }}\ygg-b5\**
            ${{ runner.temp }}\ygg-b6\**
            ${{ runner.temp }}\ygg-b7\**
            ${{ runner.temp }}\ygg-b8\**
            ${{ runner.temp }}\ygg-b9\**
            ${{ runner.temp }}\ygg-b10\**
            ${{ runner.temp }}\ygg-b11\**
            ${{ runner.temp }}\ygg-b12\**
            ${{ runner.temp }}\ygg-b13\**
            ${{ runner.temp }}\ygg-b14\**
          if-no-files-found: warn
          retention-days: 14
