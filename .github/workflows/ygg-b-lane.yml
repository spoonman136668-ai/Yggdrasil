      - name: Run YGG-B9 frozen role-subspace probe
        if: steps.ctl.outputs.mode == 'b9_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b9'
