name: YGG-B Language Lane

on:
  push:
    branches:
      - research/ygg-b-language
    paths:
      - research/control/ygg-b-run.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ygg-b-research-lane
  cancel-in-progress: false

jobs:
  lane-run:
    runs-on: [self-hosted, Windows, X64, yggdrasil, ygg-b, research-only]
    timeout-minutes: 90

    steps:
      - name: Checkout exact lane commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Assert lane isolation and read mode
        id: ctl
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Yggdrasil') { throw "REPOSITORY_MISMATCH actual=$env:GITHUB_REPOSITORY" }
          if ($env:GITHUB_REF_NAME -cne 'research/ygg-b-language') { throw "BRANCH_MISMATCH actual=$env:GITHUB_REF_NAME" }

          $ControlPath = 'research/control/ygg-b-run.json'
          $Raw = Get-Content -LiteralPath $ControlPath -Raw
          $Control = $Raw | ConvertFrom-Json
          if ($Control.schema -ne 1) { throw 'CONTROL_SCHEMA_MISMATCH' }
          if ($Control.lane -cne 'YGG-B') { throw "CONTROL_LANE_MISMATCH actual=$($Control.lane)" }
          if ($Control.mode -notin @('bootstrap','b1_probe','b2_probe','b3_probe','b4_probe','b5_probe','b6_probe','b7_probe','b8_probe','b9_probe','b10_probe','b11_probe','b12_probe','b13_probe','b14_probe','b15_probe','b16_probe','b17_probe','b18_probe','b19_probe','b20_probe','b21_probe','b22_probe','b23_probe','b24_probe','b25_probe','b26_probe','b27_probe','b28_probe','b29_probe','b30_probe','b31_probe','b32_probe','b33_probe','b34_probe','b35_probe','b36_probe','b37_probe','b38_probe','b39_probe','b40_probe','b41_probe','b42_probe','b43_probe','b44_probe','b45_probe','b46_probe','b47_probe','b48_probe','b49_probe','b50_probe','b51_probe','b52_probe','b53_probe','b54_probe','b55_probe','b56_probe','b57_probe','b58_probe','b59_probe','b60_probe')) { throw "CONTROL_MODE_UNSUPPORTED actual=$($Control.mode)" }
          if ($Raw -match '(?i)ckb-plane|ktrade|wingless|coinbase|broker|ygg-a|ygg-c') { throw 'LANE_ISOLATION_TOKEN_VIOLATION' }
          "mode=$($Control.mode)" >> $env:GITHUB_OUTPUT

      - name: Probe runner environment
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b-bootstrap'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          $Python = Get-Command python -ErrorAction SilentlyContinue
          $Nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          $Probe = [ordered]@{
              schema=1
              lane='YGG-B'
              mode='${{ steps.ctl.outputs.mode }}'
              github_sha=$env:GITHUB_SHA
              runner_name=$env:RUNNER_NAME
              identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
              powershell=$PSVersionTable.PSVersion.ToString()
              python=if ($Python) { (& python --version 2>&1 | Out-String).Trim() } else { $null }
              gpu=if ($Nvidia) { @(& nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>&1) } else { @() }
              git=(& git --version | Out-String).Trim()
              isolation='Yggdrasil YGG-B lane only'
          }
          $Probe | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $OutDir 'bootstrap.json') -Encoding UTF8

      - name: Provision portable Python runtime
        if: steps.ctl.outputs.mode == 'b1_probe' || steps.ctl.outputs.mode == 'b2_probe' || steps.ctl.outputs.mode == 'b3_probe' || steps.ctl.outputs.mode == 'b4_probe' || steps.ctl.outputs.mode == 'b5_probe' || steps.ctl.outputs.mode == 'b6_probe' || steps.ctl.outputs.mode == 'b7_probe' || steps.ctl.outputs.mode == 'b8_probe' || steps.ctl.outputs.mode == 'b9_probe' || steps.ctl.outputs.mode == 'b10_probe' || steps.ctl.outputs.mode == 'b11_probe' || steps.ctl.outputs.mode == 'b12_probe' || steps.ctl.outputs.mode == 'b13_probe' || steps.ctl.outputs.mode == 'b14_probe' || steps.ctl.outputs.mode == 'b15_probe' || steps.ctl.outputs.mode == 'b16_probe' || steps.ctl.outputs.mode == 'b17_probe' || steps.ctl.outputs.mode == 'b18_probe' || steps.ctl.outputs.mode == 'b19_probe' || steps.ctl.outputs.mode == 'b20_probe' || steps.ctl.outputs.mode == 'b21_probe' || steps.ctl.outputs.mode == 'b22_probe' || steps.ctl.outputs.mode == 'b23_probe' || steps.ctl.outputs.mode == 'b24_probe' || steps.ctl.outputs.mode == 'b25_probe' || steps.ctl.outputs.mode == 'b26_probe' || steps.ctl.outputs.mode == 'b27_probe' || steps.ctl.outputs.mode == 'b28_probe' || steps.ctl.outputs.mode == 'b29_probe' || steps.ctl.outputs.mode == 'b30_probe' || steps.ctl.outputs.mode == 'b31_probe' || steps.ctl.outputs.mode == 'b32_probe' || steps.ctl.outputs.mode == 'b33_probe' || steps.ctl.outputs.mode == 'b34_probe' || steps.ctl.outputs.mode == 'b35_probe' || steps.ctl.outputs.mode == 'b36_probe' || steps.ctl.outputs.mode == 'b37_probe' || steps.ctl.outputs.mode == 'b38_probe' || steps.ctl.outputs.mode == 'b39_probe' || steps.ctl.outputs.mode == 'b40_probe' || steps.ctl.outputs.mode == 'b41_probe' || steps.ctl.outputs.mode == 'b42_probe' || steps.ctl.outputs.mode == 'b43_probe' || steps.ctl.outputs.mode == 'b44_probe' || steps.ctl.outputs.mode == 'b45_probe' || steps.ctl.outputs.mode == 'b46_probe' || steps.ctl.outputs.mode == 'b47_probe' || steps.ctl.outputs.mode == 'b48_probe' || steps.ctl.outputs.mode == 'b49_probe' || steps.ctl.outputs.mode == 'b50_probe' || steps.ctl.outputs.mode == 'b51_probe' || steps.ctl.outputs.mode == 'b52_probe' || steps.ctl.outputs.mode == 'b53_probe' || steps.ctl.outputs.mode == 'b54_probe' || steps.ctl.outputs.mode == 'b55_probe' || steps.ctl.outputs.mode == 'b56_probe' || steps.ctl.outputs.mode == 'b57_probe' || steps.ctl.outputs.mode == 'b58_probe' || steps.ctl.outputs.mode == 'b59_probe' || steps.ctl.outputs.mode == 'b60_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $PyRoot = Join-Path $env:RUNNER_TEMP 'python312-ygg-b'
          $PyExe = Join-Path $PyRoot 'python.exe'
          if (-not (Test-Path -LiteralPath $PyExe)) {
              if (Test-Path -LiteralPath $PyRoot) { Remove-Item -LiteralPath $PyRoot -Recurse -Force }
              New-Item -ItemType Directory -Path $PyRoot -Force | Out-Null
              $Zip = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
              Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $Zip
              Expand-Archive -LiteralPath $Zip -DestinationPath $PyRoot -Force
              $Pth = Join-Path $PyRoot 'python312._pth'
              @('python312.zip','.','Lib\\site-packages','import site') | Set-Content -LiteralPath $Pth -Encoding ASCII
              New-Item -ItemType Directory -Path (Join-Path $PyRoot 'Lib\\site-packages') -Force | Out-Null
              $GetPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
              Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $GetPip
              & $PyExe $GetPip --disable-pip-version-check --no-warn-script-location
              if ($LASTEXITCODE -ne 0) { throw "GET_PIP_FAILED exit=$LASTEXITCODE" }
          }
          if (-not (Test-Path -LiteralPath $PyExe)) { throw "PYTHON_MISSING path=$PyExe" }
          $PyRoot >> $env:GITHUB_PATH
          (Join-Path $PyRoot 'Scripts') >> $env:GITHUB_PATH
          & $PyExe --version
          & $PyExe -m pip --version

      - name: Install frozen B runtime
        if: steps.ctl.outputs.mode == 'b1_probe' || steps.ctl.outputs.mode == 'b2_probe' || steps.ctl.outputs.mode == 'b3_probe' || steps.ctl.outputs.mode == 'b4_probe' || steps.ctl.outputs.mode == 'b5_probe' || steps.ctl.outputs.mode == 'b6_probe' || steps.ctl.outputs.mode == 'b7_probe' || steps.ctl.outputs.mode == 'b8_probe' || steps.ctl.outputs.mode == 'b9_probe' || steps.ctl.outputs.mode == 'b10_probe' || steps.ctl.outputs.mode == 'b11_probe' || steps.ctl.outputs.mode == 'b12_probe' || steps.ctl.outputs.mode == 'b13_probe' || steps.ctl.outputs.mode == 'b14_probe' || steps.ctl.outputs.mode == 'b15_probe' || steps.ctl.outputs.mode == 'b16_probe' || steps.ctl.outputs.mode == 'b17_probe' || steps.ctl.outputs.mode == 'b18_probe' || steps.ctl.outputs.mode == 'b19_probe' || steps.ctl.outputs.mode == 'b20_probe' || steps.ctl.outputs.mode == 'b21_probe' || steps.ctl.outputs.mode == 'b22_probe' || steps.ctl.outputs.mode == 'b23_probe' || steps.ctl.outputs.mode == 'b24_probe' || steps.ctl.outputs.mode == 'b25_probe' || steps.ctl.outputs.mode == 'b26_probe' || steps.ctl.outputs.mode == 'b27_probe' || steps.ctl.outputs.mode == 'b28_probe' || steps.ctl.outputs.mode == 'b29_probe' || steps.ctl.outputs.mode == 'b30_probe' || steps.ctl.outputs.mode == 'b31_probe' || steps.ctl.outputs.mode == 'b32_probe' || steps.ctl.outputs.mode == 'b33_probe' || steps.ctl.outputs.mode == 'b34_probe' || steps.ctl.outputs.mode == 'b35_probe' || steps.ctl.outputs.mode == 'b36_probe' || steps.ctl.outputs.mode == 'b37_probe' || steps.ctl.outputs.mode == 'b38_probe' || steps.ctl.outputs.mode == 'b39_probe' || steps.ctl.outputs.mode == 'b40_probe' || steps.ctl.outputs.mode == 'b41_probe' || steps.ctl.outputs.mode == 'b42_probe' || steps.ctl.outputs.mode == 'b43_probe' || steps.ctl.outputs.mode == 'b44_probe' || steps.ctl.outputs.mode == 'b45_probe' || steps.ctl.outputs.mode == 'b46_probe' || steps.ctl.outputs.mode == 'b47_probe' || steps.ctl.outputs.mode == 'b48_probe' || steps.ctl.outputs.mode == 'b49_probe' || steps.ctl.outputs.mode == 'b50_probe' || steps.ctl.outputs.mode == 'b51_probe' || steps.ctl.outputs.mode == 'b52_probe' || steps.ctl.outputs.mode == 'b53_probe' || steps.ctl.outputs.mode == 'b54_probe' || steps.ctl.outputs.mode == 'b55_probe' || steps.ctl.outputs.mode == 'b56_probe' || steps.ctl.outputs.mode == 'b57_probe' || steps.ctl.outputs.mode == 'b58_probe' || steps.ctl.outputs.mode == 'b59_probe' || steps.ctl.outputs.mode == 'b60_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -c "import torch; print('torch',torch.__version__)"

      - name: Run YGG-B1 frozen sequence-memory probe
        if: steps.ctl.outputs.mode == 'b1_probe' || steps.ctl.outputs.mode == 'b2_probe' || steps.ctl.outputs.mode == 'b3_probe' || steps.ctl.outputs.mode == 'b4_probe' || steps.ctl.outputs.mode == 'b5_probe' || steps.ctl.outputs.mode == 'b6_probe' || steps.ctl.outputs.mode == 'b7_probe' || steps.ctl.outputs.mode == 'b8_probe' || steps.ctl.outputs.mode == 'b9_probe' || steps.ctl.outputs.mode == 'b10_probe' || steps.ctl.outputs.mode == 'b11_probe' || steps.ctl.outputs.mode == 'b12_probe' || steps.ctl.outputs.mode == 'b13_probe' || steps.ctl.outputs.mode == 'b14_probe' || steps.ctl.outputs.mode == 'b15_probe' || steps.ctl.outputs.mode == 'b16_probe' || steps.ctl.outputs.mode == 'b17_probe' || steps.ctl.outputs.mode == 'b18_probe' || steps.ctl.outputs.mode == 'b19_probe' || steps.ctl.outputs.mode == 'b20_probe' || steps.ctl.outputs.mode == 'b21_probe' || steps.ctl.outputs.mode == 'b22_probe' || steps.ctl.outputs.mode == 'b23_probe' || steps.ctl.outputs.mode == 'b24_probe' || steps.ctl.outputs.mode == 'b25_probe' || steps.ctl.outputs.mode == 'b26_probe' || steps.ctl.outputs.mode == 'b27_probe' || steps.ctl.outputs.mode == 'b28_probe' || steps.ctl.outputs.mode == 'b29_probe' || steps.ctl.outputs.mode == 'b30_probe' || steps.ctl.outputs.mode == 'b31_probe' || steps.ctl.outputs.mode == 'b32_probe' || steps.ctl.outputs.mode == 'b33_probe' || steps.ctl.outputs.mode == 'b34_probe' || steps.ctl.outputs.mode == 'b35_probe' || steps.ctl.outputs.mode == 'b36_probe' || steps.ctl.outputs.mode == 'b37_probe' || steps.ctl.outputs.mode == 'b38_probe' || steps.ctl.outputs.mode == 'b39_probe' || steps.ctl.outputs.mode == 'b40_probe' || steps.ctl.outputs.mode == 'b41_probe' || steps.ctl.outputs.mode == 'b42_probe' || steps.ctl.outputs.mode == 'b43_probe' || steps.ctl.outputs.mode == 'b44_probe' || steps.ctl.outputs.mode == 'b45_probe' || steps.ctl.outputs.mode == 'b46_probe' || steps.ctl.outputs.mode == 'b47_probe' || steps.ctl.outputs.mode == 'b48_probe' || steps.ctl.outputs.mode == 'b49_probe' || steps.ctl.outputs.mode == 'b50_probe' || steps.ctl.outputs.mode == 'b51_probe' || steps.ctl.outputs.mode == 'b52_probe' || steps.ctl.outputs.mode == 'b53_probe' || steps.ctl.outputs.mode == 'b54_probe' || steps.ctl.outputs.mode == 'b55_probe' || steps.ctl.outputs.mode == 'b56_probe' || steps.ctl.outputs.mode == 'b57_probe' || steps.ctl.outputs.mode == 'b58_probe' || steps.ctl.outputs.mode == 'b59_probe' || steps.ctl.outputs.mode == 'b60_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b1'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-b/ygg_b1_sequence_memory_v1.py (Join-Path $OutDir 'b1-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'b1-result.json') -Raw | ConvertFrom-Json
          if (-not $R.duplicate_byte_identical) { throw 'YGG_B1_DUPLICATE_MISMATCH' }
          if (-not $R.primary.qualification.YGG_B1_PERSISTENT_SEQUENCE_MEMORY) { throw 'YGG_B1_SCIENTIFIC_NEGATIVE' }
          Get-Content -LiteralPath (Join-Path $OutDir 'b1-result.json')

      - name: Run YGG-B2 frozen content-binding probe
        if: steps.ctl.outputs.mode == 'b2_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b2'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-b/ygg_b2_content_binding_v1.py (Join-Path $OutDir 'b2-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'b2-result.json') -Raw | ConvertFrom-Json
          if (-not $R.duplicate_byte_identical) { throw 'YGG_B2_DUPLICATE_MISMATCH' }
          if (-not $R.primary.qualification.YGG_B2_CONTENT_ADDRESSED_BINDING) { throw 'YGG_B2_SCIENTIFIC_NEGATIVE' }
          Get-Content -LiteralPath (Join-Path $OutDir 'b2-result.json')

      - name: Run YGG-B3 frozen factorized-binding probe
        if: steps.ctl.outputs.mode == 'b3_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b3'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-b/ygg_b3_factorized_binding_v1.py (Join-Path $OutDir 'b3-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'b3-result.json') -Raw | ConvertFrom-Json
          Get-Content -LiteralPath (Join-Path $OutDir 'b3-result.json')
          if (-not $R.duplicate_byte_identical) { throw 'YGG_B3_DUPLICATE_MISMATCH' }
          if (-not $R.primary.qualification.YGG_B3_FACTORIZED_RELATIONAL_STATE) { throw 'YGG_B3_SCIENTIFIC_NEGATIVE' }

      - name: Run YGG-B4 frozen address-reallocation probe
        if: steps.ctl.outputs.mode == 'b4_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b4'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-b/ygg_b4_address_reallocation_v1.py (Join-Path $OutDir 'b4-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'b4-result.json') -Raw | ConvertFrom-Json
