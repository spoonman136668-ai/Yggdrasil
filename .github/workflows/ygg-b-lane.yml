          if (-not $R.primary.qualification.YGG_B6_ROLE_CONDITIONED_HOLDOUT) { throw 'YGG_B6_SCIENTIFIC_NEGATIVE' }

      - name: Run YGG-B7 frozen multiplicative-role probe
        if: steps.ctl.outputs.mode == 'b7_probe'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $OutDir = Join-Path $env:RUNNER_TEMP 'ygg-b7'
          if (Test-Path -LiteralPath $OutDir) { Remove-Item -LiteralPath $OutDir -Recurse -Force }
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null
          python research/experiments/ygg-b/ygg_b7_multiplicative_role_binding_v1.py (Join-Path $OutDir 'b7-result.json')
          $R = Get-Content -LiteralPath (Join-Path $OutDir 'b7-result.json') -Raw | ConvertFrom-Json
