name: WSP93 exact-source Wikipedia free-span reading qualification
on:
  push:
    branches: [research/wsp93-source-binding-program-20261114]
permissions:
  contents: read
jobs:
  source-capture:
    if: "github.event.head_commit.message == 'ci(wsp93): capture pinned original TRAIN source once'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    concurrency:
      group: wsp93-one-shot-wikipedia-source-capture
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-hash and preregistration custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3eb12021dc6954410b91becd785375ce60119887 "$GITHUB_SHA"
          test ! -f research/contrib/chatgpt/WSP-93/data/binding-contexts-frozen.json
          test ! -f research/contrib/chatgpt/WSP-93/data/binding-labels-frozen.json
          test -z "$(git status --porcelain)"
      - name: One-shot bounded public CC-BY-SA source capture
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python research/contrib/chatgpt/WSP-93/source.py --capture-once
      - name: Verify captured source and commit only its single frozen file
        shell: bash
        run: |
          set -euo pipefail
          python research/contrib/chatgpt/WSP-93/source.py --verify
          git add -- research/contrib/chatgpt/WSP-93/data/binding-contexts-frozen.json research/contrib/chatgpt/WSP-93/data/binding-labels-frozen.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' research/contrib/chatgpt/WSP-93/data/binding-contexts-frozen.json research/contrib/chatgpt/WSP-93/data/binding-labels-frozen.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(wsp93): freeze attributed Wikipedia lead excerpts"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "2"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp93-source-binding-program-20261114
          echo "WSP93_FROZEN_SOURCE_CAPTURE_COMMIT=$B"

  public-source-fixture:
    if: "github.event.head_commit.message == 'ci(wsp93): public-binding fixtures'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source integrity and public-only prose fixture tests, no reserved DEV
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python research/contrib/chatgpt/WSP-93/source.py --verify
          python -m unittest discover -s research/contrib/chatgpt/WSP-93 -p 'test_*.py' -v
      - name: Clean source
        shell: bash
        run: test -z "$(git status --porcelain)"

  final-regression:
    if: "github.event.head_commit.message == 'ci(wsp93): exact-tree final dual-platform regression'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate frozen Wikipedia prose, WSP93 fixtures and negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python research/contrib/chatgpt/WSP-93/source.py --verify
          python -m unittest discover -s research/contrib/chatgpt/WSP-93 -p 'test_*.py' -v
      - name: Mandatory complete WSP80-WSP88 inherited regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          for n in 80 81 82 83 84 85 86 87 88 89 90 91 92; do
            python -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
      - name: Mandatory full Yggdrasil root regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pinned G29 atlas and exact-source clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"

  # PUBLIC_NO_GO: exact-source public scientific classifier was negative
  # on BOTH Ubuntu and Windows at 0a122b3b; 0/24 direct, 3/24 char retrieval.
  # No original 50-question DEV first use is authorized while this approach
  # fails the frozen 2/24 public feasibility criterion. Preserve those
  # article-disjoint questions for a newly preregistered scientific mechanism.
  frozen-dev-first-use:
    needs: [final-regression]
    if: "false"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: wsp93-one-shot-reserved-dev-first-use
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze source custody and verify no unregistered source retrieval
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3eb12021dc6954410b91becd785375ce60119887 HEAD
          python research/contrib/chatgpt/WSP-93/source.py --verify
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - name: First-use reserved Wikipedia prose element free-span reader DEV cohort
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: python research/contrib/chatgpt/WSP-93/experiment.py --reserved-dev-first-use
      - name: Ensure no mutation
        shell: bash
        run: test -z "$(git status --porcelain)"
