name: ITD-02 native session boundary G29 one-time refresh
on:
  push:
    branches:
      - research/itd02-native-session-boundary-guard-20261027
    paths:
      - .github/workflows/itd02-native-session-boundary-g29-once.yml
permissions:
  contents: write
concurrency:
  group: itd02-native-session-boundary-g29-once
  cancel-in-progress: false
jobs:
  exact-source-index:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    if: ${{ github.actor == 'spoonman136668-ai' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: One-time original integrated learner source pin
        shell: bash
        run: |
          set -euo pipefail
          source='33c686e0e5d98e6889c73ed954215f516e6d66db'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$source" HEAD
          test "$(git rev-list --count "$source"..HEAD)" = 2
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff --name-only "$source" HEAD)"
          test "$changed" = '.github/workflows/itd02-native-session-boundary-g29-once.yml'
          echo 'NATIVE_SESSION_BOUNDARY_EXACT_SOURCE=PASS'
      - name: Generate G29 source locator and validate native boundary regression
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          python -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
          python -m unittest discover -s tests -p test_itd02_native_task_bridge_dev.py -v
      - name: Commit and verify only generated source locators
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/itd02-native-session-boundary-guard-20261027
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(itd02): exact-head G29 native session source refresh'
          python scripts/build_code_atlas.py --check-if-present
          python -m unittest discover -s tests -p test_code_atlas.py -v
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            git status --porcelain --untracked-files=all
            echo "G29_QUALIFICATION_WORKTREE_DIRTY" >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/research/itd02-native-session-boundary-guard-20261027
          echo 'NATIVE_SESSION_BOUNDARY_INDEX_SOURCE_QUALIFIED=PASS'
