name: DG1-HC08 Charged Controllability DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-hc08-20261113/**'
      - '.github/workflows/dg1-hc08-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile source-only steering and evaluator
        run: |
          python -m py_compile research/contrib/chatgpt/dg1-hc08-20261113/steering_policy.py
          python -m py_compile research/contrib/chatgpt/dg1-hc08-20261113/bayesian_steering_policy.py
          python -m py_compile research/contrib/chatgpt/dg1-hc08-20261113/eval_dev.py
      - name: Public action accounting, cold restore, adverse controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-hc08-20261113 -p "test_*.py" -v
      - name: Frozen physically charged DEV experiment
        run: python research/contrib/chatgpt/dg1-hc08-20261113/eval_dev.py > hc08-result.json
      - name: Report frozen verdict including negative physics and ABA
        run: python -c "import json; r=json.load(open('hc08-result.json')); print('HC08_DEV',r['classification'],'known',r['known_absorbing_replay_pass'],'new_rewired',r['new_rewired_primary_pass'],'ABA',r['ABA_retention_pass'],'OOD_confident_wrong',r['outside_grammar_confident_wrong']); print(r['cohort_accuracy'])"
      - name: Preserve full frozen source-only receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc08-dev-evidence-${{ matrix.os }}
          path: hc08-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Mandatory inherited full source regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: G29 fail-closed pinned source graph
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Clean git source after experiment
        run: git diff --exit-code
      - name: Generate G29 atlas for exact science-source identity
        if: always() && matrix.os == 'ubuntu-latest'
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
      - name: Emit exact-source atlas chunks for generated-only pin
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for ext in ('json', 'html', 'ice'):
              raw = Path('.ice/code-atlas.' + ext).read_bytes()
              print('DG1_HC08_ATLAS_START:' + ext + ':' + str(len(raw)))
              b64 = base64.b64encode(raw).decode('ascii')
              for j in range(0,len(b64),4096):
                  print('DG1_HC08_ATLAS_CHUNK:' + ext + ':' + b64[j:j+4096])
              print('DG1_HC08_ATLAS_END:' + ext)
          PY
      - name: Preserve exact-source generated atlas
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-hc08-g29-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: warn
          retention-days: 7
