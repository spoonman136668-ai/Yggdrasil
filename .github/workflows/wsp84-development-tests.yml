name: WSP84 learned Boolean operator exact-source development tests
on:
  push:
    branches: [research/wsp80-paid-novelty-structural-weight-repair-20261113]
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-84/**'
      - '.github/workflows/wsp84-development-tests.yml'
permissions:
  contents: read
jobs:
  operator-dev:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prereg, synthetic parity and source-blind cold numeric weights
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
          WSP84_CHECKOUT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-84 -p 'test_*.py' -v
      - name: Verify clean exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
