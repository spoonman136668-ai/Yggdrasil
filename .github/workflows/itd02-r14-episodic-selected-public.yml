name: ITD-02 R14 selected-public episodic memory local cells qualification
on:
  push:
    branches:
      - research/itd02-r14-episodic-transition-source-20261028
permissions:
  contents: read
jobs:
  original-local-cell-source-only:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - name: Git original source LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact original native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact independent R10/R11/R12/R13 and early prereg
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b27372e6c670166749dc3dc41ab6cfe9b263292f "$GITHUB_SHA"
          git merge-base --is-ancestor 8e7621f511043c8300740ef0aaf4640fff52ad6f "$GITHUB_SHA"
          test "$(git hash-object research/native/itd02/r14/PREREG.md)" = 4d949530f5580f4dfe782591b02fcc51d6648535
          test "$(git hash-object research/native/itd02/r10/public_adapter.py)" = 3917d36ce9f86a2c1b998a0a2f93fb27674a9205
          test "$(git hash-object research/native/itd02/r11/affordance_cells.py)" = 614c7dfb1b43f485009b70cb85e9b7b5119cafc2
          test "$(git hash-object research/native/itd02/r12/outcome_choice.py)" = 2d19b28d6d4db1988ae908fe91be1a27ce4c1907
          test "$(git hash-object research/native/itd02/r13/explore_choice.py)" = 51c421fbd34b5e88e02bf89acab0de7b11eee1c9
          echo R14_PRE_REGISTERED_UNCHANGED_NATIVE_FOUNDATIONS
      - name: R10 through R14 original-public native source regression
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            research.native.itd02.r10.test_public_adapter \
            research.native.itd02.r11.test_affordance_cells \
            research.native.itd02.r12.test_outcome_choice \
            research.native.itd02.r13.test_explore_choice \
            research.native.itd02.r14.test_episodic_cells
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R14_EPISODIC_LOCAL_PUBLIC_SOURCE_ONLY__NO_SCIENCE
