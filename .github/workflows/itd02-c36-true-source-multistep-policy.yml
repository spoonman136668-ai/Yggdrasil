name: ITD-02 C36 original-world causal two-step option policy
on:
  push:
    branches: [research/itd02-c36-multistep-policy-20261025]
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate protocol source-first freeze and unchanged native original R3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse bd1688a33ae3bbf27548fd84081db80fc8d9d868^)" = cc2f53e507e62f3095fb09e04399e7e7d335a6bd
          git merge-base --is-ancestor bd1688a33ae3bbf27548fd84081db80fc8d9d868 "$GITHUB_SHA"
          test "$(git hash-object research/mass_r7c36/PREREG.json)" = aa8471767755030bd288efc4a58d4ed5849ef56b
          test "$(git hash-object research/native/itd02/r3/navigator.py)" = 5348238f4ec2183bea29262659883391b5f429fd
          python -m pip install numpy==1.26.4
          python -B -m unittest research.mass_r7c36.test_policy -v
          echo C36_SOURCE_ONLY_R3_AND_CAUSAL_OPTION_PREFLIGHT=PASS
          echo C36_NEW_REAL_SOURCE_ACTIONS=ZERO
  original-world:
    needs: [source-only]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      FIT_ARTIFACT: '12603145885'
      FIT_ZIP_SHA256: '4e35aef3238b6ba2b9d83c4e9e288ff2d8dd3edd23177974b9deb088cca66ca3'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          path: research
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          fetch-depth: 0
          persist-credentials: false
          path: external/minigrid
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authentic unchanged native and upstream source sha
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C research hash-object research/mass_r7c36/PREREG.json)" = aa8471767755030bd288efc4a58d4ed5849ef56b
          test "$(git -C research hash-object research/native/itd02/r3/navigator.py)" = 5348238f4ec2183bea29262659883391b5f429fd
          test "$(git -C external/minigrid rev-parse HEAD)" = 7f5853792ea7f04f75614661006d87fcf949f26d
          test "$(git -C external/minigrid hash-object minigrid/envs/fourrooms.py)" = d79f007e00f95f48284da66d760872483c02fab2
          test "$(git -C external/minigrid hash-object minigrid/envs/dynamicobstacles.py)" = 68436cecc35116c23c2f196c22fa3a19c6410b95
          echo C36_IMMUTABLE_ORIGINAL_R3_AND_FARAMA_SOURCE=PASS
      - name: Install original unmodified source
        run: |
          python -m pip install ./external/minigrid
          python -m pip install numpy==1.26.4
      - name: Download and authenticate frozen C35 FIT-only real two-action training
        working-directory: research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c36-c35-FIT" "$RUNNER_TEMP/c36-evidence"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/c36-original-fit.zip" "https://api.github.com/repos/spoonman136668-ai/Yggdrasil/actions/artifacts/$FIT_ARTIFACT/zip"
          echo "$FIT_ZIP_SHA256  $RUNNER_TEMP/c36-original-fit.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/c36-original-fit.zip" -d "$RUNNER_TEMP/c36-c35-FIT"
          echo C36_C35_TRUE_SOURCE_FIT_AUTHENTICATED=PASS
      - name: Actually execute each original R3 and learned-policy source action twice
        working-directory: research
        shell: bash
        run: |
          set -euo pipefail
          python -B -m research.mass_r7c36.run --c35-fit-dir "$RUNNER_TEMP/c36-c35-FIT" --output "$RUNNER_TEMP/c36-evidence/process-a.json" > "$RUNNER_TEMP/c36-evidence/process-a.log" 2>&1 || { cat "$RUNNER_TEMP/c36-evidence/process-a.log"; exit 1; }
          python -B -m research.mass_r7c36.run --c35-fit-dir "$RUNNER_TEMP/c36-c35-FIT" --output "$RUNNER_TEMP/c36-evidence/process-b.json" > "$RUNNER_TEMP/c36-evidence/process-b.log" 2>&1 || { cat "$RUNNER_TEMP/c36-evidence/process-b.log"; exit 1; }
          cat "$RUNNER_TEMP/c36-evidence/process-a.log"
          cat "$RUNNER_TEMP/c36-evidence/process-b.log"
          python -B -m research.mass_r7c36.compare --first "$RUNNER_TEMP/c36-evidence/process-a.json" --second "$RUNNER_TEMP/c36-evidence/process-b.json" --output "$RUNNER_TEMP/c36-evidence/comparison.json"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo C36_TWO_ACTUAL_SOURCE_PROCESSES_EXACT=PASS
          echo C36_PROTECTED_FIRST_USE=FALSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: itd02-c36-real-original-two-step-causal-policy-FIT
          path: ${{ runner.temp }}/c36-evidence/
          if-no-files-found: warn
          retention-days: 80
