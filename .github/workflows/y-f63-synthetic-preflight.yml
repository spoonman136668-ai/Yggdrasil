name: Yggdrasil F63 synthetic-only source preflight
on:
  push:
    branches: [research/y-f63-public-path-reliability-precode-20261016-r1]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check frozen prereg and run synthetic-only causal preflight
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 742c6017dfa81acbe6ba15f9b55634ddc894ab3e HEAD
          test "$(git hash-object research/foundational/20261016-y-f63/prereg.json)" = ecd9f177c9a47fd42c50e6e2502f938082028513
          python3 -B research/foundational/20261016-y-f63/source_engineering.py --synthetic-only
          python3 -B research/foundational/20261016-y-f63/learn_reliability.py --synthetic-only
          python3 -B research/foundational/20261016-y-f63/trainonly_source_feasibility.py > /tmp/y-f63-trainonly-source.json
          python3 -B -m json.tool /tmp/y-f63-trainonly-source.json >/dev/null
          python3 -B -c 'import json; d=json.load(open("/tmp/y-f63-trainonly-source.json")); print("F63_TRAINONLY_FEASIBILITY",d["fixed_correct"],d["witness_correct"],"NOVELTY",d["source_novelty_qualified"])'
          python3 -B research/foundational/20261016-y-f63/replacement_source.py --synthetic-only
          python3 -B -c 'import sys; sys.path.insert(0,"research/foundational/20261016-y-f63"); import replacement_source as s, audit_replacement_public as a; [a.verify(*s.source(seed,fam)[:2]) for seed,fam in ((-201,-2),(-202,-1))]; print("F63A_INDEPENDENT_GRAPH_AUDIT_PASS")'
          echo 'FIT=UNCONSUMED DIAG=UNCONSUMED ORIGINAL=UNCONSUMED'
