name: FKP17 blind public actions and portable GRU qualification
on:
  push:
    branches: [ci/fkp17-public-blind-portable-once-20261115]
    paths: [.github/workflows/fkp17-public-blind-portable.yml]
permissions:
  contents: write
concurrency:
  group: fkp17-public-blind-portable-once-20261115
  cancel-in-progress: false
jobs:
  source-only-atlas:
    if: >-
      github.event.head_commit.message == 'ci(FKP-17): exact public blind action and cold GRU qualification only' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    env:
      SOURCE: 6345ea85e03abd17cffa8e92f9b552c7beb2e0a5
      TARGET: research/fkp17-structured-prior-novel-causal-law-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep native Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6345ea85e03abd17cffa8e92f9b552c7beb2e0a5
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned free CPU gradient reference for source-only tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
      - name: Assert exact frozen source and preregistration before tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor fe5e259d24100c03b5de8184090e3d6f56fcb7e3 "$SOURCE"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/prereg.json)" = 17d676c9374060515c7ebee2e2fdc262a884343c
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/source_fixture.py)" = 8da7aa4a0892f2277bccca610bd2ad0b5cf9fcb3
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_source_fixture.py)" = a8869311137310858e9c479812a4b4e0242d1014
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/public_policies.py)" = a8837bf7edfc0a229b43c4bd97faa9de4bfadcf0
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_public_policies.py)" = ca3413d2105add3403dd8156dee90aa2e7c8f684
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/README.md)" = d25075a52e9ccf9b4297aad494c9714718bb275d
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_prereg.py)" = 7f5b11339b4464459b7590a5fbd3b08cdae4aa53
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/portable_recurrent.py)" = 43d161bf438b2023c0cbf61b18559ec4447767d1
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_portable_recurrent.py)" = edd375c914165bf82ef7db4a122d3ef3b9d5e9e3
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/blind_public_harness.py)" = 8dd0e9a1dfc59c5607ce06216bfecbfee13b36aa
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_blind_public_harness.py)" = ddb0e9dd8260c342f204fe78a94e4628f514fda4
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/run_public_onpolicy.py)" = f12a9b29228b3a148a4a732b320de5fd12ca5961
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_run_public_onpolicy.py)" = b6206797741e36b5e5200bf9ef3f0f1745c86e2a
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/verify_public_checkpoint.py)" = 82b42f73ebf9f8f35ee1a9faa6e836fbdad22cde
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/strong_controls.py)" = f2d37ffcc628194eb443cc721524b2f625a7f148
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_strong_controls.py)" = 23db82cd95650a22cc2c68913c26ff3fbeb3201e
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/recurrent_control.py)" = 59a91fdf814e0c52c6172dbad681ef845be2a55e
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_recurrent_control.py)" = 6984fa0721e3e7d83540dace6a8810fc55223f54
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/qualify_public_recurrent.py)" = 8c9106b0d82c70a20047c82f798fac2f87304c6f
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_SOURCE_SAFE_FOCUSED_QUALIFIED=PASS
      - name: Require all current model and control tests before derived-index publication
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p 'test_*.py' -v
          echo FKP17_POLICY_PRE_ATLAS_FOCUSED=PASS
      - name: Generate and publish only 3 derived G29 files to existing draft branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf "%s\n" .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-17): exact-source G29 atlas only'
          NEXT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          diff -u "$RUNNER_TEMP/expected" <(git diff --name-only "$SOURCE" "$NEXT" | LC_ALL=C sort)
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git push origin "HEAD:refs/heads/$TARGET"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "candidate=$NEXT" >> "$GITHUB_OUTPUT"
          echo "FKP17_G29_GENERATED_ONLY_CANDIDATE=$NEXT"
  qualification-two-os:
    needs: source-only-atlas
    if: needs.source-only-atlas.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Disable checkout line translation
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned free CPU gradient reference for source-only tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
      - name: Focused source-safe fixtures and negative held-seed controls
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p 'test_*.py' -v
      - name: G29 source atlas and mandatory inherited complete regression
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_TWO_OS_SOURCE_SAFE_FULL_REGRESSION=PASS


  full-public-foundation-recurrent:
    needs: [source-only-atlas, qualification-two-os]
    if: needs.source-only-atlas.result == 'success' && needs.qualification-two-os.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      checkpoint_sha256: ${{ steps.receipt.outputs.checkpoint_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FKP17_CHECKPOINT_PATH: ${{ runner.temp }}/fkp17-public-gru-f32.json
    steps:
      - name: Keep Git source byte parity
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned free CPU recurrent training reference
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
      - name: Complete original FOUNDATION-only two-seed twenty-four-epoch training
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-17/qualify_public_recurrent.py | tee "$RUNNER_TEMP/train.log"
          test -s "$FKP17_CHECKPOINT_PATH"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Fresh-process all eight methods on actual chosen public TRAIN actions only
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-17/run_public_onpolicy.py "$FKP17_CHECKPOINT_PATH" | tee "$RUNNER_TEMP/diagnostic.log"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_EIGHT_ARM_CHOSEN_PUBLIC_TRAIN_ACTIONS=PASS
      - name: Freeze SHA256 checkpoint and complete public-only receipts
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          def parse(name,prefix):
              lines=(base/name).read_text('utf-8').splitlines()
              vals=[json.loads(x.split(prefix,1)[1]) for x in lines if prefix in x]
              assert len(vals)==1,(name,'record count')
              return vals[0]
          train=parse('train.log','FKP17_ORIGINAL_PUBLIC_FOUNDATION_FULL_TRAIN=')
          diag=parse('diagnostic.log','FKP17_PUBLIC_TRAIN_BLIND_DIAGNOSTIC=')
          path=pathlib.Path(os.environ['FKP17_CHECKPOINT_PATH'])
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest==train['checkpoint_sha256']
          assert train['portable_cold_replay']=='PASS'
          assert train['trained_seeds']==[1515,2626] and train['epochs_per_seed']==24
          assert train['original_dev_opened'] is False and train['scientific_pass'] is False
          assert diag['classification']=='PUBLIC_TRAIN_DIAGNOSTIC_ONLY_NOT_SCIENCE'
          assert len(diag['actual_reward_by_arm'])==8
          assert diag['dev_opened'] is False and diag['transfer_opened'] is False
          assert train['source_prior_sha256']==diag['shared_foundation_sha256']
          (base/'fkp17-full-public-train-receipt.json').write_text(json.dumps(train,sort_keys=True,indent=2)+'\n')
          (base/'fkp17-public-action-diagnostic.json').write_text(json.dumps(diag,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h:
              h.write('checkpoint_sha256='+digest+'\n')
          print('FKP17_FULL_PUBLIC_TRAIN_AND_EIGHT_ACTION_DIAGNOSTIC=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fkp17-public-foundation-gru-and-training-only
          path: |
            ${{ runner.temp }}/fkp17-public-gru-f32.json
            ${{ runner.temp }}/fkp17-full-public-train-receipt.json
            ${{ runner.temp }}/fkp17-public-action-diagnostic.json
          retention-days: 30
          if-no-files-found: error
  portable-fresh-process-two-os:
    needs: [source-only-atlas, full-public-foundation-recurrent]
    if: needs.full-public-foundation-recurrent.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep Git source byte parity
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-only-atlas.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned free CPU checkpoint verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1+cpu'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fkp17-public-foundation-gru-and-training-only
          path: ${{ runner.temp }}/fkp17-artifact
      - name: Verify retained model in independent Python process on this OS
        shell: bash
        env:
          FILE_SHA256: ${{ needs.full-public-foundation-recurrent.outputs.checkpoint_sha256 }}
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-17/verify_public_checkpoint.py "$RUNNER_TEMP/fkp17-artifact/fkp17-public-gru-f32.json" "$FILE_SHA256"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_PUBLIC_GRU_COLD_CROSS_OS=PASS
