name: DG1-SL14 Causal DNA six-bit physical mechanisms DEV
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/dg1-sl14-20261113/**'
      - '.github/workflows/dg1-sl14-qualification.yml'
      - '.ice/code-atlas.*'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact original 6-bit causal source syntax
        run: python -m py_compile research/contrib/chatgpt/dg1-sl14-20261113/sl14.py research/contrib/chatgpt/dg1-sl14-20261113/test_sl14.py
      - name: Frozen registration, six-bit physics, paid controls and negative tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s research/contrib/chatgpt/dg1-sl14-20261113 -p 'test_*.py' -v
      - name: Prospective original 32-world six-arm Causal DNA physical study
        run: python research/contrib/chatgpt/dg1-sl14-20261113/sl14.py > sl14-original-result.json
      - name: Enforce original charged physical action and checkpoint budget
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("sl14-original-result.json").read_text())
          assert d["freeze_sha"]=="272cbb87542d87c779161780602cfddfb7439e8a"
          assert d["world_count"]==32 and len(d["arms"])==6
          assert d["charged_steps"]==18432
          assert d["paid_causal_observations"]==14784
          assert d["charged_input_perturbations"]==3648
          paired=("fingerprint_active","no_retrieval_on_active",
                  "independent_bayes_on_active","rolling_window_on_active",
                  "flat_lookup_on_active")
          assert all(len({w["arms"][a]["trace_sha256"] for a in paired})==1
                     for w in d["worlds"])
          assert all(len({v["trace_first48_sha256"]
                          for v in w["arms"].values()})==1
                     for w in d["worlds"])
          assert all(v["charged_steps"]==96 and
                     v["causal_observations"]==77 and
                     v["charged_input_perturbations"]==19 and
                     len(v["snapshot_bytes"])==3 and
                     max(v["snapshot_bytes"]+[v["final_snapshot_bytes"]])<=8192
                     for w in d["worlds"] for v in w["arms"].values())
          assert all(v["audits"][str(t)]["correct"]+
                     v["audits"][str(t)]["wrong_confident"]==24
                     for w in d["worlds"] for v in w["arms"].values()
                     for t in (24,48,54,72,78,96))
          assert all(not any(t["archived_reuse"] for t in
                      w["arms"]["no_retrieval_on_active"]["transitions"])
                      for w in d["worlds"])
          print("SL14_PRIMARY:"+str(d["primary_pass"]))
          print("SL14_CLASSIFICATION:"+d["classification"])
          print("SL14_RETRIEVAL:"+json.dumps(d["archive_reuse_world_counts"],sort_keys=True,separators=(",",":")))
          print("SL14_GATES:"+json.dumps(d["primary_gates"],sort_keys=True,separators=(",",":")))
          print("SL14_AUDITS:"+json.dumps(d["aggregates"],sort_keys=True,separators=(",",":")))
          print("SL14_CPU_BAYES:"+str(d["median_cpu_ratio_candidate_vs_bayes"]))
          print("SL14_CPU_NOARCHIVE:"+str(d["median_cpu_ratio_candidate_vs_noarchive"]))
          PY
      - name: Mandatory complete inherited repository regression on original source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: G29 exact source index verification
        run: python scripts/build_code_atlas.py --check-if-present
      - name: Preserve original full per-world physical receipts in GitHub Actions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-sl14-original-paid-worlds-${{ matrix.os }}
          path: sl14-original-result.json
          if-no-files-found: ignore
      - name: Remove transient science output before source cleanliness proof
        if: always()
        shell: bash
        run: rm -f sl14-original-result.json
      - name: Verify scientific source was not modified by experiment
        if: always()
        run: git diff --exit-code
      - name: Emit bounded exact-source G29 generated atlas after original science
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
          python - <<'PY'
          from pathlib import Path
          import hashlib,base64
          for ext in ('json','html','ice'):
              raw=Path('.ice/code-atlas.'+ext).read_bytes()
              print('SL14_ATLAS_START:'+ext+':'+str(len(raw))+':'+hashlib.sha256(raw).hexdigest())
              enc=base64.b64encode(raw).decode('ascii')
              for pos in range(0,len(enc),4096):
                  print('SL14_ATLAS_CHUNK:'+ext+':'+enc[pos:pos+4096])
              print('SL14_ATLAS_END:'+ext)
          PY
