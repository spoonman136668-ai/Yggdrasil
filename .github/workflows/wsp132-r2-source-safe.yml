name: WSP132-R2 bounded active confidence repair source-safe qualification
on:
  push:
    branches: [research/wsp132-r2-active-challenger-audits-20261116]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check R2 prereg FIRST and immutable original R1 result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 61646b23051430ceb8da9685ea550af1d5749022 HEAD
          git diff --exit-code 61646b23051430ceb8da9685ea550af1d5749022 HEAD -- research/contrib/chatgpt/WSP-132-R2/prereg.json
          git diff --exit-code 17388464a6ce2c3f829bc61190ba9c38eb9450f1 HEAD -- research/contrib/chatgpt/WSP-131 research/contrib/chatgpt/WSP-132
          test ! -e research/contrib/chatgpt/WSP-132-R2/result.json
          test ! -e research/contrib/chatgpt/WSP-132-R2/first_use_authorization.json
          test ! -e research/contrib/chatgpt/WSP-131/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Run bounded R2 active challenger repair and negatives
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-132-R2 -p 'test_*.py' -v
      - name: Verify pristine checkout
        shell: bash
        run: test -z "$(git status --porcelain)"

  source-atlas-once:
    needs: [development]
    if: "github.event.head_commit.message == 'ci(wsp132-r2): source-pin G29 atlas' && github.run_attempt == 1 && needs.development.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: wsp132-r2-source-atlas-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild exact three derived G29 artifacts on frozen R2 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp132-r2): pin G29 source atlas at $SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp132-r2-active-challenger-audits-20261116

  final-regression:
    needs: [development]
    if: "startsWith(github.event.head_commit.message, 'docs(wsp132-r2): pin G29 source atlas at ') && github.run_attempt == 1 && needs.development.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install inherited pinned reference dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6'
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
      - name: Verify original results untouched and generated G29 exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 61646b23051430ceb8da9685ea550af1d5749022 HEAD
          git diff --exit-code 61646b23051430ceb8da9685ea550af1d5749022 HEAD -- research/contrib/chatgpt/WSP-132-R2/prereg.json
          git diff --exit-code 17388464a6ce2c3f829bc61190ba9c38eb9450f1 HEAD -- research/contrib/chatgpt/WSP-131 research/contrib/chatgpt/WSP-132
          test ! -e research/contrib/chatgpt/WSP-132-R2/first_use_authorization.json
          python -B scripts/build_code_atlas.py --check-if-present
      - name: Mandatory inherited full WSP117–132 including original failed result
        shell: bash
        run: |
          set -euo pipefail
          for n in 117 118 119 120 121 122 123 124 125 126 127 128 129 130 131 132; do
            python -B -m unittest discover -s "research/contrib/chatgpt/WSP-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/WSP-132-R2 -p 'test_*.py' -v
      - name: Mandatory entire root regression clean G29
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
