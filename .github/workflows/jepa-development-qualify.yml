name: Yggdrasil source-only JEPA development qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'yggdrasil/paired_view_jepa.py'
      - 'tests/test_paired_view_jepa.py'
      - 'research/experiments/jepa-dev/**'
      - '.github/workflows/jepa-development-qualify.yml'
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Focused development tests
        run: python -B -m unittest discover -s tests -p test_paired_view_jepa.py -v
      - name: Full original Python regression
        run: python -B -m unittest discover -s tests -p test_*.py -v
      - name: Verify source compiles
        run: python -B -m compileall -q yggdrasil tests
