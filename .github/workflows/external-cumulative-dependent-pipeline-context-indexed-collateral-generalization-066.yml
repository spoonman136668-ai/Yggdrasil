name: Yggdrasil context-indexed collateral generalization 066
on:
  push:
    branches:
      - research/external-hosted-yggdrasil-dependent-pipeline-context-indexed-collateral-generalization-r1
    paths:
      - 'research/experiments/external-future-data-third-manifest-066.json'
      - 'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.ice'
      - 'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.py'
      - '.github/workflows/external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          prereg="71ca8fe805a6955a98c6dc61de4c5b8b089f550c"
          parent="bf572db74dac4b3c76ba845e3e2b0ac3057ac00f"
          test "$(git rev-parse "$prereg^")" = "$parent"
          git merge-base --is-ancestor "$prereg" HEAD
          changed="$(git diff --name-only "$parent..HEAD" | sort)"
          expected="$(printf '%s\n'             '.github/workflows/external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.yml'             'research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.py'             'research/experiments/exp-dgr-external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.ice'             'research/experiments/external-future-data-third-manifest-066.json' | sort)"
          test "$changed" = "$expected"
          printf '%s  %s\n' 'e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7' 'research/experiments/external-future-data-third-manifest-066.json' | sha256sum -c -
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-CONTEXT-INDEXED-COLLATERAL-GENERALIZATION-066","preregistration_sha":"71ca8fe805a6955a98c6dc61de4c5b8b089f550c","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001856","manifest_sha256":"e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"2518306c74ff426278f31b1199f8ad9891299d14"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="a6992353331210bd7756a103f16ad713d2aa28365adfaaf18b94b83f4512fe97"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="71ca8fe805a6955a98c6dc61de4c5b8b089f550c"
          assert r["manifest_sha256"]=="e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7"
          assert r["ckb_plane_main_sha"]=="2518306c74ff426278f31b1199f8ad9891299d14"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact third-manifest sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-066"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c",303863,"9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
            ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json",118601,"d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
            ("technical-prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md",11025,"61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for name,url,full_n,full_h,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"ygg-066"}),timeout=30).read(full_n+1)
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h,(name,len(b),hashlib.sha256(b).hexdigest())
              p=b[:prefix_n]
              assert len(p)==prefix_n and hashlib.sha256(p).hexdigest()==prefix_h
              (root/(name+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Run frozen generalization twice
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-cumulative-dependent-pipeline-context-indexed-collateral-generalization-066.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          m=json.loads(pathlib.Path("/tmp/result1.json").read_text())["metrics"]
          valid=(
            m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["transfer_manifest_identity_mismatch_count"]==0 and m["base_training_identity_mismatch_count"]==0 and
            m["affected_schedule_count"]==4 and m["packet_budget_per_schedule"]==12 and
            m["history_byte_budget_mismatch_count"]==0 and m["candidate_selection_heldout_use_count"]==0 and
            m["gate_use_schedule_count"]+m["gate_noop_schedule_count"]==4 and
            m["retained_memory_donor_missing_count"]==0 and m["candidate_reserved_key_missing_count"]==0 and
            m["candidate_required_union_over_capacity_count"]==0 and m["candidate_state_capacity_failure_count"]==0 and
            m["preserved_state_structure_count_min"]==16 and m["preserved_state_structure_count_max"]==16 and
            m["active_structure_count_min"]==7 and m["active_structure_count_max"]==7 and
            m["retained_structure_count_min"]==9 and m["retained_structure_count_max"]==9 and
            m["matched_assignment_failure_count"]==0 and m["capacity_growth_event_count"]==0 and
            m["row_mutation_event_count"]==0 and m["tokenizer_use_count"]==0 and
            m["external_model_call_count"]==0 and m["invalid_evaluation_rows"]==0 and
            all(math.isfinite(float(v)) for v in m.values())
          )
          collateral=(m["candidate_positive_prose_collateral_schedule_count"]==4 and m["candidate_partner_collateral_failure_count"]==0)
          efficiency=(m["candidate_schedule_slower_than_baseline_count"]==0 and m["candidate_mean_packet_reduction"]>=1)
          if not valid: cls="invalid"
          elif m["gate_context_incompatible_schedule_count"]==0 and collateral and efficiency: cls="supported"
          elif m["gate_context_incompatible_schedule_count"]==0 and collateral: cls="mixed"
          else: cls="negative"
          out={"schema":"yggdrasil.research-classification.v1","experiment":"EXP-DGR-EXTERNAL-CUMULATIVE-DEPENDENT-PIPELINE-CONTEXT-INDEXED-COLLATERAL-GENERALIZATION-066","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"a6992353331210bd7756a103f16ad713d2aa28365adfaaf18b94b83f4512fe97","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/ygg-066"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-context-indexed-collateral-generalization-066
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
