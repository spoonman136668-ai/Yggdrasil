name: Yggdrasil Y036 novel global shift first-use
on:
  push:
    branches: [research/y036-global-shift-novelty-r1]
permissions:
  contents: read
jobs:
  scientific-first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze source and prereg exact identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 35eace118e16ab8195a6810f2bc6ec569dfd0106 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/execute.py)" = 692e92cf931a2d63b39a618c0044af390984f099
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-novel-shifts/prereg.json)" = 990f10cdbb7c661310e87913814cb12f1b3eadee
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-novel-shifts/execute.py)" = 731b21616691af2f726fb8017ce69b58b08c91a6
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-novel-shifts/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-novel-shifts/execute.py
      - name: Original frozen novel-shift cache experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-novel-shifts/execute.py > /tmp/Y036-original.json
          python3 -m json.tool /tmp/Y036-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y036-original.json'))
          assert len(x['regimes'])==4
          assert x['sealed_heldout_seeds']==list(range(208,224))
          print('CLASSIFICATION',x['classification'])
          for r in x['regimes']:
              print('REGIME',r['regime'],'CHURN',r['heldout_churn'],
                    'SAVINGS',r['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original-novel-global-shifts
          path: /tmp/Y036-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One complete Yggdrasil integration
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
