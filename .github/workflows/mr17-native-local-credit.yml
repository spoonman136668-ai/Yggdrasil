name: MR17 Original Native Local Causal Credit
on:
  push:
    branches:
      - research/mr17-centered-local-causal-residual-20261021
  pull_request:
    branches:
      - research/mr16-native-prequential-local-learning-20261021
permissions:
  contents: read
concurrency:
  group: mr17-source-native-contrast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-native-local-credit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Fix Git source bytes before Windows checkouts
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Exact Yggdrasil candidate without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: yggdrasil
          fetch-depth: 0
          persist-credentials: false
      - name: Original third-party MiniGrid exact-source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Original external source Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Independent external source Git blobs and license discrepancy
        shell: bash
        run: python -B yggdrasil/research/mr14/verify_farama_native.py --manifest yggdrasil/research/mr14/farama_source_manifest.json --upstream external/minigrid
      - name: Fixed open source native dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3
      - name: Real native pre-outcome MR17 versus MR16 and fully trained counts
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -B yggdrasil/research/mr17/run_original.py external/minigrid
      - name: Preserve earlier original MR16 native development evidence
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -B yggdrasil/research/mr16/run_native.py external/minigrid
      - name: Protect exact source checkout without tracked or untracked mutations
        shell: bash
        run: |
          git -C yggdrasil diff --exit-code
          git -C external/minigrid diff --exit-code
          test -z "$(git -C yggdrasil status --porcelain)"
          test -z "$(git -C external/minigrid status --porcelain)"
