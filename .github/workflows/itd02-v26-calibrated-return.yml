name: ITD-02 V26 hysteretic source return development
on:
  push:
    branches:
      - research/itd02-v26-calibrated-return-evidence-20261028
permissions:
  contents: read
jobs:
  v26-return:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact cross host source
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prior V25 results and V26 prereg chronological source pins
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f3d16b542e83c87abdacdf8e8988ca20c1e215e "$GITHUB_SHA"
          git merge-base --is-ancestor 00dcb0a7f166e0efb5473b49a40c0ba555350cdc "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
      - name: V26 focused eligibility, frozen bank and private reward controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v26"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_calibrated_return.py' -v
      - name: Seven source-only streams and full matrix conventional comparator
        shell: bash
        run: |
          set -euo pipefail
          if ! PYTHONPATH=. python -B research/itd02_v26_calibrated_return_audit.py > "$RUNNER_TEMP/v26/result.json" 2> "$RUNNER_TEMP/v26/err.log"; then
            cat "$RUNNER_TEMP/v26/err.log"
            exit 1
          fi
          python - "$RUNNER_TEMP/v26/result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="ygg.itd02.v26.hysteretic_return.source_only.v1"
          assert not d["scientific_first_use"] and not d["original_world_training"]
          assert d["action_regret_measured"] and len(d["streams"])==7
          assert len(d["canonical_public_evidence_sha256"])==64
          assert all(x["source_sha_unchanged"] and x["checkpoint_bytes"]<=12288 for x in d["streams"])
          assert d["classification"] in ("V26_RETURN_REACTIVATION_NOT_ESTABLISHED__NO_SCIENCE","V26_REACTIVATION_WITHOUT_STRONG_CONTROLS__NO_SCIENCE")
          print("V26_PRELIMINARY_SOURCE_ONLY_WITNESS_NOT_SCIENTIFIC_FIRST_USE")
          PY
          cat "$RUNNER_TEMP/v26/result.json"
      - name: Original V25 V24 and native focused safety regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve source-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v26-public-return-${{ matrix.os }}
          path: ${{ runner.temp }}/v26/*
          retention-days: 7
          if-no-files-found: warn
