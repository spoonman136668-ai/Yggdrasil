name: Mass MR34I2 first native gradient/Adam numeric divergence forensic
on:
  pull_request:
    branches: [research/mr34i1-train-only-numeric-custody-20261022]
    paths:
      - 'research/mr34i2/**'
      - '.github/workflows/mass-mr34i2-original-trace.yml'
permissions:
  contents: read
concurrency:
  group: mass-mr34i2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  original-native-trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Do not transform checkout source blobs on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: s4c1
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original public environment numerical dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Original Pycolab curses on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify frozen FIRST-only protocol, pinned unchanged numeric source
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          parent=98cb359a7a61372e6d2fad73a5a1483313a30afd
          first=1d867b52af3062096b3f4f8df3b4726b499b2dbf
          test "$(git rev-parse "${first}^")" = "$parent"
          git merge-base --is-ancestor "$first" HEAD
          test "$(git show --format= --name-only "$first")" = 'research/mr34i2/INITIAL_ONLY_PROTOCOL.md'
          test "$(git hash-object research/mr34i1/train_only_numeric.py)" = "$(git rev-parse "$parent:research/mr34i1/train_only_numeric.py")"
          actual="$(git diff --name-only "$parent" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/mass-mr34i2-original-trace.yml' \
            'research/mr34i2/INITIAL_ONLY_PROTOCOL.md' \
            'research/mr34i2/trace_first_update.py' \
            'research/mr34i2/test_trace.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          echo MR34I2_FROZEN_SOURCE_SCOPE_PASS
      - name: Focused source-free coefficient-update and role tests
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m unittest -v research.mr34i2.test_trace 2>&1 | tee ../mr34i2-focused.log
      - name: Unchanged original native source TRAIN-only 40-epoch forensic
        shell: bash
        run: |
          set -euo pipefail
          cd audit
          python -B -m research.mr34i2.trace_first_update ../s4c1 ../external/minigrid ../external/pycolab | tee ../mr34i2-original-trace.log
          python - <<'PY'
          import json,pathlib
          lines=pathlib.Path("../mr34i2-original-trace.log").read_text().splitlines()
          data=[json.loads(x.split("=",1)[1]) for x in lines if x.startswith("MR34I2_UNMODIFIED_ORIGINAL_TRAIN_STAGE_TRACE=")]
          assert len(data)==1
          result=data[0]
          assert result["new_or_old_held_DEV_source_actions"]==0
          assert result["protected_first_use"] is False
          assert len(result["source_reports"])==2
          for z in result["source_reports"].values():
              assert len(z["first_20_original_epoch_updates"])==20
              assert len(z["all_40_train_only_epoch_model_snapshots"])==40
              assert z["tracer_matches_unmodified_original_trainer_and_previous_MR34I1"]
          print("MR34I2_ORIGINAL_TRAIN_ONLY_TRACER_EXACT_PINNED_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-mr34i2-${{ matrix.os }}-repeat-${{ matrix.repeat }}
          path: |
            mr34i2-focused.log
            mr34i2-original-trace.log
          if-no-files-found: warn
          retention-days: 30
      - name: Verify no original source or training code mutation
        shell: bash
        run: |
          set -euo pipefail
          for path in audit s4c1 external/minigrid external/pycolab; do
            git -C "$path" diff --exit-code
            test -z "$(git -C "$path" status --porcelain)"
          done
          echo MR34I2_ALL_SOURCE_CHECKOUTS_CLEAN

  original-stage-reconciliation:
    needs: original-native-trace
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mass-mr34i2-*
          path: evidence
      - name: Identify exact FIRST trained-state divergence and preserve four originals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          reports={}
          for os in ("ubuntu-24.04","windows-2025"):
              for rep in (1,2):
                  path=pathlib.Path("evidence")/f"mass-mr34i2-{os}-repeat-{rep}"/"mr34i2-original-trace.log"
                  rec=[json.loads(z.split("=",1)[1]) for z in path.read_text().splitlines()
                       if z.startswith("MR34I2_UNMODIFIED_ORIGINAL_TRAIN_STAGE_TRACE=")]
                  assert len(rec)==1,(os,rep,len(rec))
                  reports[os,rep]=rec[0]
          checks={}
          for family in ("DeepMindPycolabApprehend","FaramaMiniGridDoorKey8"):
              A,B,C,D=[reports[os,rep]["source_reports"][family]
                       for os,rep in (("ubuntu-24.04",1),("ubuntu-24.04",2),
                                      ("windows-2025",1),("windows-2025",2))]
              for x,y in ((A,B),(C,D)):
                  for k in ("source_training_only_action_receipt_sha256","source_training_only_float64_tensor_sha256",
                            "native_initial_45_snapshot_sha256","first_original_bptt_gradient_sha256",
                            "first_20_original_epoch_updates","all_40_train_only_epoch_model_snapshots",
                            "tracer_selected_train_only_epoch","tracer_trained_native_snapshot_sha256"):
                      assert x[k]==y[k],("SAME_OS_ORIGINAL_TRAINING_DRIFT",family,k)
              for k in ("source_training_only_action_receipt_sha256","source_training_only_float64_tensor_sha256",
                        "native_initial_45_snapshot_sha256","first_original_bptt_gradient_sha256"):
                  assert A[k]==C[k],("ORIGINAL_SOURCE_OR_INIT_OR_FIRST_GRAD_DRIFT",family,k)
              first=None
              for i,(x,y) in enumerate(zip(A["first_20_original_epoch_updates"],C["first_20_original_epoch_updates"]),1):
                  for field in ("original_unregularized_gradient_sha256","adam_first_moment_sha256",
                                "adam_second_moment_sha256","post_update_parameter_float64_sha256"):
                      if x[field]!=y[field]:
                          first={"original_update":i,"first_stage":field,
                                 "linux_step_param_sha":x["post_update_parameter_float64_sha256"],
                                 "windows_step_param_sha":y["post_update_parameter_float64_sha256"]}
                          break
                  if first:break
              if first is None:
                  for i,(x,y) in enumerate(zip(A["all_40_train_only_epoch_model_snapshots"],C["all_40_train_only_epoch_model_snapshots"]),1):
                      if x["end_epoch_float64_parameter_sha256"]!=y["end_epoch_float64_parameter_sha256"]:
                          first={"first_different_epoch_end":i,
                                 "first_20_updates_bit_equal":True}
                          break
              if first is None:
                  first={"cross_OS_full_training_stage_divergence":"NOT_FOUND"}
              checks[family]={
                  "first_cross_OS_divergence":first,
                  "initial_and_first_gradient_bit_identical":True,
                  "each_OS_repeats_bit_identical":True,
                  "linux_train_only_selected_epoch":A["tracer_selected_train_only_epoch"],
                  "windows_train_only_selected_epoch":C["tracer_selected_train_only_epoch"],
                  "linux_full_original_checkpoint_sha":A["tracer_trained_native_snapshot_sha256"],
                  "windows_full_original_checkpoint_sha":C["tracer_trained_native_snapshot_sha256"]
              }
              assert A["tracer_trained_native_snapshot_sha256"]!=C["tracer_trained_native_snapshot_sha256"],family
          print("MR34I2_ORIGINAL_TRAIN_ONLY_CROSS_OS_CUSTODY=PASS_NEGATIVE")
          print("MR34I2_ROOT_CAUSE_STAGE="+json.dumps(checks,sort_keys=True))
          print("MR34I2_SCIENTIFIC_FIRST_USE=UNTOUCHED")
          PY
