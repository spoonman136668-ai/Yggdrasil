name: Yggdrasil NCI-04G7A Environment Contrast
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: G7A authentic-source causal observation and controls
        run: |
          python -B -m unittest discover -s tests -p test_nci04g7a_environment.py -v
          python -B -m unittest discover -s tests -p test_nci04h_local_repair.py -v
      - name: Exact-source read-only acceptance
        run: |
          test -z "$(git status --porcelain)"
          echo "NCI04G7A_EXACT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
