name: ITD-02 V26 candidate cross-cue integrity and inherited native regression
on:
  push:
    branches:
      - research/itd02-v26-return-selectivity-20261028
permissions:
  contents: read
jobs:
  v26-crosscue-source-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Cross-host byte-exact git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact V26 source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preregistration and exact native and V25 inherited source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f3d16b542e83c87abdacdf8e8988ca20c1e215e "$GITHUB_SHA"
          git merge-base --is-ancestor 9eb4e7305cbd55e146ff64c8f82f06edb87a5350 "$GITHUB_SHA"
          git merge-base --is-ancestor 28075b87f76a6a03d525fcacc0eabac940915736 "$GITHUB_SHA"
          git merge-base --is-ancestor 19ec2bcd6c3529fbc5c17d8c47afdf9490402bbe "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object yggdrasil/itd02_v24_protected_dual_memory_dev.py)" = 9ef95a28e9060dd79105f51122d527351756a1e0
          test "$(git hash-object yggdrasil/itd02_v25_unlabeled_return_dev.py)" = f90e5029b121cbfc2e361f9e0941985eb1e69e3d
          test "$(git hash-object research/itd02_v25_return_sequence_audit.py)" = 6bd7b9ffc92b8b4739f7d2c7f73d4e7cdbd2b0a5
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: V26 focused crosscue and prior source protection tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v26_crosscue_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          echo V26_CANDIDATE_PUBLIC_EVIDENCE_SAFETY_PASS_NOT_SCIENCE
      - name: One final inherited V25 through V12 native regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v26"
          PYTHONPATH=. python -B research/itd02_v25_return_sequence_audit.py > "$RUNNER_TEMP/v26/inherited-v25.json"
          PYTHONPATH=. python -B research/itd02_v24_protected_dual_memory_audit.py > "$RUNNER_TEMP/v26/inherited-v24.json"
          PYTHONPATH=. python -B research/itd02_v23_unfamiliar_mapping_audit.py > "$RUNNER_TEMP/v26/inherited-v23.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v23_unfamiliar_mapping_audit.py' -v
          PYTHONPATH=. python -B research/itd02_v22_shared_ring_learning_audit.py > "$RUNNER_TEMP/v26/inherited-v22.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v22_shared_context_ring.py' -v
          PYTHONPATH=. python -B research/itd02_v21_capacity_learning_audit.py > "$RUNNER_TEMP/v26/inherited-v21.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v21_capacity_learning_audit.py' -v
          PYTHONPATH=. python -B research/itd02_v20_responsibility_gated_audit.py > "$RUNNER_TEMP/v26/inherited-v20.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v20_responsibility_gated_credit.py' -v
          PYTHONPATH=. python -B research/itd02_v19_local_credit_causality_audit.py > "$RUNNER_TEMP/v26/inherited-v19.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v19_local_credit_causality.py' -v
          PYTHONPATH=. python -B research/itd02_v18_intermediate_plasticity_audit.py > "$RUNNER_TEMP/v26/inherited-v18.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v18_intermediate_plasticity_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v17_neighbor_carried_learner_dev.py' -v
          PYTHONPATH=. python -B research/itd02_v16_locality_transfer_audit.py > "$RUNNER_TEMP/v26/inherited-v16.json"
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v15_frozen_native_local_readout.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_native_task_bridge_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_local_ring_memory_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v12_delayed_local_eligibility.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V26_FINAL_V25_TO_V12_ORIGINAL_NATIVE_REGRESSION_PASS_NO_SCIENCE
      - name: Preserve host native regression receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v26-candidate-inherited-regression-${{ matrix.os }}
          path: ${{ runner.temp }}/v26/*
          retention-days: 7
          if-no-files-found: warn
