name: Yggdrasil Y052 frozen four-parameter learned probe selector
on:
  push:
    branches: [research/y052-learned-observable-schedule-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed immutable frozen source identity gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 157905e34bf50af3528c4a0b39cbd2d6715a54bf HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y051-probe-timing/execute.py)" = 17b6cf91d7d4c1f55a379059c7bf429647b205be
          test "$(git hash-object research/contrib/chatgpt/20261013-y052-learned-probe/prereg.json)" = 3733fd81bb2fb23a2ee6ac6a590a1fae04635a55
          test "$(git hash-object research/contrib/chatgpt/20261013-y052-learned-probe/execute.py)" = 303d3d852370323752740fd5f37b5a09e79d8704
          python3 -m json.tool research/contrib/chatgpt/20261013-y052-learned-probe/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y052-learned-probe/execute.py
      - name: Original sealed first-use four-weight learned selector experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y052-learned-probe/execute.py > /tmp/Y052-original.json
          python3 -m json.tool /tmp/Y052-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/Y052-original.json'))
          assert a['development_seeds']==list(range(1888,1896))
          assert a['sealed_heldout_seeds']==list(range(1896,1912))
          assert a['train_examples']==8*4*5*3
          assert len(a['heldout_records'])==16*4*5*3
          assert len(a['learned_four_weights'])==4
          assert a['causal_pre_shock_feature_equivalence']
          print('CLASSIFICATION',a['classification'])
          print('POOLED_ERRORS',a['pooled_errors_by_arm'])
          print('TRAINING',a['development_summary'])
          print('WEIGHTS',a['learned_four_weights'])
          print('ORACLE_DIAGNOSTIC_NOT_DEPLOYABLE',a['paired_world_oracle_diagnostic_not_deployable'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y052-original-four-weight-probe-selector
          path: /tmp/Y052-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full required Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
