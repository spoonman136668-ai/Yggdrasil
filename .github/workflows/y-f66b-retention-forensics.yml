name: Yggdrasil F66B exposed synthetic retention forensics
on:
  push:
    branches: [research/y-f66b-frozen-retention-forensics-20261016-r1]
permissions:
  contents: read
jobs:
  immutable-retention-forensics:
    if: "${{ github.event.head_commit.message == 'ci(y-f66b): quantify frozen answer path loss on exposed synthetic cases' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen model identity before analyzing exposed synthetics
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 50cf785dda95e35c3d2d7d13840eff4cf4b7fd9b HEAD
          test "$(git hash-object research/foundational/20261016-y-f66/two_head_continuation.py)" = fa08d72d79380a82814c86482e98b206b69b4d4a
          test "$(git hash-object research/foundational/20261016-y-f66/f66b_synthetic_retention_forensics.py)" = 2fe6db08875fe51556de54f8c8502807efcc7251
      - name: Read-only post-retention forensic audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f66b-forensics/"
          python3 -B research/foundational/20261016-y-f66/f66b_synthetic_retention_forensics.py > "$RUNNER_TEMP/f66b-forensics/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f66b-forensics/result.json" >/dev/null
          python3 -B -c 'import os,json;r=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f66b-forensics/result.json")));print("F66B_PATH_LOSS",r["learned_final_true_fragments"],r["baseline_final_true_fragments"]);print("F66B_LONG_RECORDS",r["learned_final_long_records"],r["baseline_final_long_records"]);print("F66B_KIND_SCORES",r["by_kind"]);assert not r["registered_fit_read"] and not r["heldout_read"]'
          sha256sum "$RUNNER_TEMP/f66b-forensics/result.json" > "$RUNNER_TEMP/f66b-forensics/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f66b-forensics/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f66b-exposed-synthetic-retention-forensics
          path: ${{ runner.temp }}/f66b-forensics/
          retention-days: 90
          if-no-files-found: warn
