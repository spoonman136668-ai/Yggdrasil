name: Yggdrasil Y020 maximum-cardinality witnesses
on:
  push:
    branches: [research/y020-radius-two-feasibility-witness-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact predecessor identity
        run: git merge-base --is-ancestor 8a0da57f993615687e2c6131424362ec131cbcc5 HEAD
      - name: Install existing test dependencies
        run: python -m pip install -e ".[test]"
      - name: Execute Y020 frozen experiment once
        run: |
          python -B research/contrib/chatgpt/20261012-y020-radius-witness/execute.py --output "$RUNNER_TEMP/y020.json"
          python -m json.tool "$RUNNER_TEMP/y020.json"
      - uses: actions/upload-artifact@v4
        with:
          name: y020-frozen-cardinality-result
          path: ${{ runner.temp }}/y020.json
          retention-days: 90
      - name: Full Yggdrasil regression
        run: python -m pytest -q tests
