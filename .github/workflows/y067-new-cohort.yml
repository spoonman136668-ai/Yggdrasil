name: Yggdrasil frozen independent replication Y067
on:
  push:
    branches: [research/y067-onset5-independent-replication-r1]
permissions:
  contents: read
jobs:
  scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Immutable source identity check
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/20261013-y067-onset5-replication/prereg.json)" = ac9421c0614b19133f41032047efb8fd8c998fdb
          test "$(git hash-object research/contrib/chatgpt/20261013-y067-onset5-replication/execute.py)" = 4029e274b280e5b2cdd5c5df55ee72d130efe7c1
          test "$(git hash-object research/contrib/chatgpt/20261013-y066-onset5/execute.py)" = d42fc398dce9442473b13451c4ab9e10e0d81fae
          python3 -m json.tool research/contrib/chatgpt/20261013-y067-onset5-replication/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y067-onset5-replication/execute.py
      - name: Original sealed first-use
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y067-onset5-replication/execute.py > /tmp/Y067.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/Y067.json'))
          assert x['sealed_heldout_seeds']==list(range(6432,6448)); assert len(x['new_onset5_comparisons'])==2
          print('CLASSIFICATION',x['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y067-original-sealed
          path: /tmp/Y067.json
          retention-days: 90
          if-no-files-found: error
      - name: Full repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
