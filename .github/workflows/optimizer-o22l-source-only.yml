name: Optimizer O22-L source-only public effect provenance

on:
  push:
    branches:
      - research/optimizer-o22l-public-effect-provenance-20261025
  pull_request:
    paths:
      - research/optimizer_o22l/**
      - .github/workflows/optimizer-o22l-source-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-effect-unit:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original R12 and protocol-first commit retained
        shell: bash
        run: |
          git merge-base --is-ancestor 6e2d4a219b1fb62e0124ba053b65b7e3fdd46546 HEAD
          git merge-base --is-ancestor 17cb83e89356d4b2377ea915c50dc69aa7dd0e5c HEAD
          python -B -c "import json; p=json.load(open('research/optimizer_o22l/PREREG.json')); assert p['original_episode_rights']==0 and p['protected_first_use_rights']==0"
      - name: Bounded source-only seven-test causal attribution and cold process
        run: python -B -m unittest -v research.optimizer_o22l.test_observed_effect
