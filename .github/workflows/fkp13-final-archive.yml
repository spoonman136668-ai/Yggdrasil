name: FKP13 freeze observed negative and final G29 dual-OS regression
on:
  push:
    branches: [ci/fkp13-frozen-negative-archive-20261115]
    paths: [.github/workflows/fkp13-final-archive.yml]
permissions:
  contents: write
concurrency:
  group: fkp13-frozen-negative-archive-20261115
  cancel-in-progress: false
jobs:
  seal-evidence-derived-atlas-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-13): seal consumed 175302-step negative without model retuning' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    outputs:
      head: ${{ steps.seal.outputs.head }}
    env:
      SOURCE: 4b5e87764b20d1e2acc14d6a5a91de7abcce6a69
      TREE: e432c138d8c6e8faec5090fcf1b01e888ed4a009
      TARGET: research/fkp13-mysterypath-closedloop-weight-actions-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact source checkout configuration
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4b5e87764b20d1e2acc14d6a5a91de7abcce6a69
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prereg, unchanged model and actual source-failure custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 48b977cd3263f749bebdcc109d629d97e571a272 HEAD
          git merge-base --is-ancestor b99aab33d54c719c2ab07169ed9fa2b2b1f9ebb8 HEAD
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/prereg.json)" = 12e38b10fe5cc201e0d15217aa071f98cfb6b3a8
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/cohorts.py)" = dd29ad6823303362811eff8064d30deaefa73469
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/controller.py)" = c7703311d93737a1792e0290c95a92dc41566670
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/run_dev.py)" = ee8aabca90b0a1ef3e7313691047deee70072512
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/test_fkp13.py)" = 0f74f913ffa60b2d0e079368a6626fc9a4a721ae
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-13/result.json)" = b4c9e1153d0bc4d2f7e2dd41775eb58d0f99dc31
          python - <<'PY'
          import json
          p="research/contrib/chatgpt/FKP-13/result.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["model"]["classification"]=="DEV_MIXED_BEATS_WEAK_NOT_STRONG"
          assert not x["model"]["scientific_pass"]
          assert not x["model"]["preregistered_dev_action_signal"]
          assert x["first_use"]["source_actions"]["total"]==175302
          assert x["first_use"]["original_public_dev_consumed"]
          assert x["first_use"]["protected_science_opened"]==False
          assert x["first_use"]["reserved_transfer_opened"]==False
          assert x["engineering"]["workflow_all_jobs"]=="5/5 completed success"
          print("FKP13_CONSUMED_ORIGINAL_NEGATIVE_EXACT_BLOBS=PASS")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Generate ONLY G29 source-derived atlas from exact archive commit
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
      - name: Publish generated-only final archive child, never model/rules/main
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-13): G29-index frozen original negative outcome"
          NEW="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "head=$NEW" >> "$GITHUB_OUTPUT"
          echo "FKP13_FINAL_ARCHIVE_HEAD=$NEW"

  exact-source-full-final-regression:
    needs: seal-evidence-derived-atlas-only
    if: needs.seal-evidence-derived-atlas-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: No CRLF change
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal-evidence-derived-atlas-only.outputs.head }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact CPU fixture packages; no upstream DEV source and no training
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "numpy==1.26.4"
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          python - <<'PY'
          import torch,numpy
          assert torch.__version__=="2.5.1+cpu"
          assert numpy.__version__=="1.26.4"
          print("FKP13_FINAL_PINNED_CPU_DEPS=PASS")
          PY
      - name: Focused source-safe fixture and G29 plus MANDATORY inherited 54-test full regression
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-13 -p test_fkp13.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          x=json.load(open("research/contrib/chatgpt/FKP-13/result.json",encoding="utf-8"))
          assert x["model"]["strongest_return_control"]=="SHUFFLED_FROZEN"
          assert x["model"]["goal_events_per_arm"]["DIRECT_ONLINE"]==0
          assert x["model"]["retention_gate_pass"]
          assert x["first_use"]["source_actions"]["total"]==175302
          assert not x["model"]["scientific_pass"]
          print("FKP13_SOURCE_FROZEN_DEV_NO_GO_AND_ROOT_FULL=PASS")
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP13_FINAL_BOTH_OS_FROZEN_NEGATIVE_REGRESSION=PASS
