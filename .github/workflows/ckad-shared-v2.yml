name: CKAD-SHARED-V2 native shared causal operator transfer
on:
  push:
    branches: [research/ckad-shared-v2-20261117]
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: "github.event.head_commit.message == 'ci(ckad-shared-v2): execute frozen source-free shared operator transfer'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen prereg source/custody and sourcefree negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4e0a135db9efb477d97de9dc638e68e4e1d1c0e0 HEAD
          python -B -m unittest discover -s tests -p test_native_shared_operator_memory.py -v
          test -z "$(git status --porcelain)"
  primary:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned independent conventional-control dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: One frozen sourcefree Linux TRAIN then first-use synthetic TRANSFER/SHIFT/CORRUPT
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-SHARED-V2/campaign.py --out "$RUNNER_TEMP/ckad-shared-v2-primary"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad-shared-v2-primary-linux
          path: ${{ runner.temp }}/ckad-shared-v2-primary/
          if-no-files-found: error
          retention-days: 30
  replica:
    needs: [primary]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad-shared-v2-primary-linux
          path: ${{ runner.temp }}/ckad-shared-v2-primary-proof
      - name: Pinned independent conventional-control dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Windows exact synthetic sourcefree replication against Linux receipt
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'ckad-shared-v2-primary-proof/result.json'
          a=json.loads(path.read_bytes())
          print(a['stable_sha256'])
          PY
          )"
          test -n "$EXPECTED"
          python -B research/contrib/chatgpt/CKAD-SHARED-V2/campaign.py --out "$RUNNER_TEMP/ckad-shared-v2-replica" --expected-stable "$EXPECTED"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad-shared-v2-replica-windows
          path: ${{ runner.temp }}/ckad-shared-v2-replica/
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: [primary, replica]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      final_sha: ${{ steps.record.outputs.final_sha }}
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad-shared-v2-primary-linux
          path: ${{ runner.temp }}/ckad-shared-v2-primary-proof
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ckad-shared-v2-replica-windows
          path: ${{ runner.temp }}/ckad-shared-v2-replica-proof
      - name: Seal identical cross-platform evidence and source-pinned G29 atlas
        id: record
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin research/ckad-shared-v2-20261117
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          from yggdrasil.native_hypothesis_portfolio import canonical,digest
          from yggdrasil.native_shared_operator_memory import NativeSharedOperatorMemory
          b=Path(os.environ['RUNNER_TEMP'])
          source=b/'ckad-shared-v2-primary-proof'
          replica=b/'ckad-shared-v2-replica-proof'
          u=json.loads((source/'result.json').read_bytes())
          v=json.loads((replica/'result.json').read_bytes())
          a=json.loads((source/'native-shared-checkpoint.json').read_bytes())
          c=json.loads((replica/'native-shared-checkpoint.json').read_bytes())
          spec=importlib.util.spec_from_file_location('ckad_shared_v2_seal',Path('research/contrib/chatgpt/CKAD-SHARED-V2/campaign.py'))
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert u['stable_sha256']==v['stable_sha256']
          assert m.stable_view(u)==m.stable_view(v),'CROSS_OS_RESULT_DRIFT'
          assert digest(canonical(m.stable_view(u)))==u['stable_sha256']
          assert a==c,'CROSS_OS_CUMULATIVE_NATIVE_MEMORY_DRIFT'
          assert u['fit_worlds']==16 and u['evaluation_worlds']==48
          assert u['worlds_total']==64 and len(u['cases'])==48
          assert u['original_source_actions']==0 and not u['original_first_use']
          assert u['total_sourcefree_effects']==1408
          assert u['cold_retained_worlds']==64
          raw=a['native_ascii'].encode('ascii')
          assert digest(raw)==a['checkpoint_sha256']
          restored=NativeSharedOperatorMemory.restore(raw,a['checkpoint_sha256'])
          assert digest(canonical([restored.vector(i) for i in range(64)]))==a['all_world_vector_sha256']
          assert restored.global_gate_support==a['fit_global_gate_mask']
          root=Path('research/contrib/chatgpt/CKAD-SHARED-V2')
          (root/'result.json').write_bytes(canonical(u))
          (root/'native-shared-checkpoint.json').write_bytes(canonical(a))
          lines=['# CKAD-SHARED-V2 — learned cross-world causal operator','',
             'Classification: '+u['classification'],
             'Source-free DEVELOPMENT only; scientific_pass=false; accepted_native=false.',
             'No original source actions/first-use, no accepted model or deployment.','',
             '| Condition | Arm | Correct | Wrong | Abstained |',
             '|---|---|---:|---:|---:|']
          for condition,s in u['summary'].items():
              for method,row in s['arms'].items():
                  lines.append(f"| {condition} | {method} | {row['correct']} | {row['wrong']} | {row['abstained']} |")
          lines.extend(['',
             'Shared gate count learned (from FIT source histories): '+str(u['global_fit_gate_count']),
             'Paired gain vs SAME-ACTION no memory: '+str(u['paired_gain']),
             'Paired frozen bootstrap 95% lower: '+str(u['bootstrap_lower_95']),
             'Frozen gates: '+str(u['gates']),
             'Shift wrong among answered: '+str(u['wrong_answered_shift']),
             'Corrupt wrong among answered: '+str(u['wrong_answered_corrupt']),
             'Cold retained worlds: '+str(u['cold_retained_worlds']),
             'Source-free effect calls: '+str(u['total_sourcefree_effects']),
             'Checkpoint bytes: '+str(u['training_memory_bytes']),
             'Linux whole process wall seconds: '+str(u['whole_wall_seconds']),
             'Stable SHA256: '+u['stable_sha256'],
             'Frozen qualified source candidate: '+os.environ['GITHUB_SHA'],
             'Shared operator was inferred from TRAIN witnesses but broad operator grammar supplied.',
             'Independent full symbolic strong control is exact and does not prove native advantage.',
             'All negative outcomes and measured costs preserved, with NO scientific pass.',''])
          (root/'SESSION_REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
          print('CKAD_SHARED_V2_CROSS_PLATFORM_SEAL=PASS',u['stable_sha256'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/contrib/chatgpt/CKAD-SHARED-V2/result.json research/contrib/chatgpt/CKAD-SHARED-V2/native-shared-checkpoint.json research/contrib/chatgpt/CKAD-SHARED-V2/SESSION_REPORT.md
          git commit -m "research(ckad-shared-v2): seal cross-world learning evidence and negatives"
          SOURCE="$(git rev-parse HEAD)"
          python scripts/build_code_atlas.py --write --source-commit "$SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git diff --cached --quiet && exit 1
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m "docs(ckad-shared-v2): pin G29 atlas at $SOURCE"
          FINAL="$(git rev-parse HEAD)"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ckad-shared-v2-20261117
          echo "final_sha=$FINAL" >> "$GITHUB_OUTPUT"
          echo "CKAD_SHARED_V2_FINAL_SHA=$FINAL"
  final:
    needs: [seal]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory exact-final full regression root+NKR-05 and independent G29
        env:
          EXPECTED: ${{ needs.seal.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python -B -m unittest discover -s tests -p 'test_*.py'
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py'
          python scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py
          test -z "$(git status --porcelain)"
