name: CKAD40 isolated native causal-archive development diagnostic
on:
  push:
    branches:
      - research/ckad40-causal-archive-identifiability-20261118
permissions:
  contents: read
env:
  PYTHONPATH: '.'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  dev:
    if: "github.event.head_commit.message == 'ci(ckad40): frozen source development qualification'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Prevent line-ending rewrites
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source and split preflight, no held first use
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d38ba4e7c438b0a2eb89bf08cd5f54e6ff0fe2e3 HEAD
          git merge-base --is-ancestor feef03a15ec68a8e3da073e9d78d197acf656ea8 HEAD
          test ! -e research/contrib/chatgpt/CKAD-40/pilot_screen_report.json
          test ! -e research/contrib/chatgpt/CKAD-40/primary_report.json
          python -B -c "import ast,pathlib; p=pathlib.Path('research/contrib/chatgpt/CKAD-40'); [ast.parse(x.read_text()) for x in p.glob('*.py')]"
          python -B research/contrib/chatgpt/CKAD-40/diagnostic.py --mode preflight
      - name: Frozen logic and isolation tests
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-40 -p 'test_ckad40.py' -v
      - name: Two fresh development seeds once; negative result is evidence
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD-40/screen_dev.py
          test -z "$(git status --porcelain)"
