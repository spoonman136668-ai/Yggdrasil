name: AAI-11D fixed posterior-vs-risk source-only admission
on:
  push:
    branches: [research/aai11d-uncertainty-calibrated-decisions-20261114]
    paths: [.github/workflows/aai11d-source-atlas-once.yml]
permissions:
  contents: write
concurrency:
  group: aai11d-source-once-20261114
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-11D frozen posterior uncertainty development qualification one-shot' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg BEFORE model code and unchanged baseline source exact readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '331cdffca258456489356999f038a7de3761713d'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai11d-source-atlas-once.yml'
          test "$(git rev-parse d17c65e6f1e55787c1afa9a2b5a517d97a538a04^)" = '44729734a17a658873b344024913587a596239b2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/prereg.json)" = '19633a9328593eb566dfbf0ddec0073b24a5752a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/prereg.json)" = "$(git rev-parse d17c65e6f1e55787c1afa9a2b5a517d97a538a04:research/contrib/chatgpt/AAI-11D/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/calibration.py)" = '49f7de063e3577ef8f0b4e42043a24581e6cd09c'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/dev.py)" = 'ce807c4fa3b7742b4299580087dc41b68359533e'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11D/test_calibration.py)" = 'dc528fc4917d76104cb258f6e515a4ba3aff0aab'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11C/diagnose.py)" = '499662a5939796f502ccd47c97950a4d1fbd6b2f'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11B/contrast.py)" = '69ff21daf627feeaaca6661f8f3c8096efbe4de8'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11A/learner.py)" = '331a97b566d41785be06923a7acc63df6105cffd'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/world.py)" = '88d220e94ccf736e490f20922f1c7f5d3c1d3746'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-11P/controls.py)" = 'b554db7d8d25ae9b6a5f8bffb066181a00b35ffc'
          test -z "$(git status --porcelain)"
          echo AAI11D_SOURCE_FROZEN_AND_MATCHED_PUBLIC_BASELINES_PASS
      - name: Same data and posterior/risk causal rules, privacy, cold, negative first-use
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-11D -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-11D/dev.py --primary >/dev/null 2>&1; then
            echo AAI11D_FIRST_USE_DISARM_FAILED >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo AAI11D_FOCUSED_CALIBRATION_AND_DISARM_PASS
      - name: Frozen first 3-fixture DEV screen, stop early if posterior/risk loses
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/AAI-11D/dev.py --fixture-admission
          test -z "$(git status --porcelain)"
          echo AAI11D_POSTERIOR_RISK_FIRST_DEV_SCREEN_RECORDED_NO_SCIENCE
  atlas:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate three standard G29 atlas artifacts exactly source pinned
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '331cdffca258456489356999f038a7de3761713d'
          test -z "$(git status --porcelain)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AAI-11D source-pinned generated-only G29 atlas'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = 3
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/research/aai11d-uncertainty-calibrated-decisions-20261114 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/research/aai11d-uncertainty-calibrated-decisions-20261114
          echo AAI11D_SOURCE_PINNED_G29_ATLAS_ONLY_PASS
