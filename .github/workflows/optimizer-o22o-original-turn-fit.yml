name: Optimizer O22-O authentic turn-inclusive FIT-only original source
on:
  push:
    branches:
      - research/optimizer-o22o-authentic-turn-fit-20261025
permissions:
  contents: read
concurrency:
  group: optimizer-o22o-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authenticated-selected-action-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: research
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify source-first contract and immutable owner/upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = "$GITHUB_SHA"
          git -C research merge-base --is-ancestor b9dfb9a3766e13e3aad5b1d1c0dcf35e1f0857a9 "$GITHUB_SHA"
          git -C research merge-base --is-ancestor 80e9b195bbd8aa9b67e0ab88e7832f0de7f8eff2 "$GITHUB_SHA"
          test "$(git -C external/minigrid rev-parse HEAD)" = "7f5853792ea7f04f75614661006d87fcf949f26d"
          test "$(git -C external/minigrid hash-object minigrid/envs/dynamicobstacles.py)" = "68436cecc35116c23c2f196c22fa3a19c6410b95"
          test "$(git -C research hash-object research/native/itd02/r1/native_policy.py)" = "3aa22b1e418a7f8cd9619c476f02b8c614917b16"
          test "$(git -C research hash-object research/native/itd02/r2/affordance_cells.py)" = "f7e47dfef309e1c0bcc871d518154fd950b3eca0"
          test "$(git -C research hash-object research/native/itd02/r3/navigator.py)" = "5348238f4ec2183bea29262659883391b5f429fd"
          python -m py_compile research/research/optimizer_o22o/collect.py research/research/optimizer_o22o/compare.py
          echo 'O22O_SOURCE_FIRST_AND_ORIGINAL_GIT_IDENTITY=PASS'
      - name: Install exact original external source without paid API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./external/minigrid
      - name: Original native focused safety tests
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/native/itd02/r1 -p test_native_policy.py -q
          python -B -m unittest discover -s research/native/itd02/r2 -p test_affordance_cells.py -q
          python -B -m unittest discover -s research/native/itd02/r3 -p test_navigator.py -q
          echo 'O22O_NATIVE_ORIGINAL_FOCUSED=PASS'
      - name: Two complete FIT-only original action collection processes
        shell: bash
        working-directory: research
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/optimizer-o22o-fit"
          for rep in 1 2; do
            python -B research/optimizer_o22o/collect.py --out "$RUNNER_TEMP/optimizer-o22o-fit/fit-$rep.json"
          done
          python -B research/optimizer_o22o/compare.py "$RUNNER_TEMP/optimizer-o22o-fit"
      - name: Archive original selected FIT source action transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimizer-o22o-authentic-original-turn-action-FIT-receipts
          path: ${{ runner.temp }}/optimizer-o22o-fit/
          if-no-files-found: warn
          retention-days: 80
