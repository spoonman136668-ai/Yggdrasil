name: NCI05 and NCI06 source-free research qualification
on:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s research/contrib/chatgpt/NCI-NOVEL-05 -p "test_*.py" -v
      - run: python -m unittest discover -s research/contrib/chatgpt/NCI-NOVEL-06 -p "test_*.py" -v
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: git diff --exit-code
  windows:
    runs-on: windows-2022
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s research/contrib/chatgpt/NCI-NOVEL-05 -p "test_*.py" -v
      - run: python -m unittest discover -s research/contrib/chatgpt/NCI-NOVEL-06 -p "test_*.py" -v
      - run: python scripts/build_code_atlas.py --check-if-present
      - run: git diff --exit-code
