name: ITD-02 native public FIT cohort CPU-only development
on:
  push:
    branches:
      - research/itd02-native-multiepisode-retail-dev-20261027
  pull_request:
    paths:
      - yggdrasil/itd02_native_public_cohort_dev.py
      - tests/test_itd02_native_public_cohort_dev.py
      - .github/workflows/itd02-native-public-cohort-dev.yml
      - scripts/itd02_native_cohort_checkpoint_evidence_dev.py
permissions:
  contents: read
jobs:
  native-local-cpu-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native unassisted multi-episode learning and real disk/process cold resume
        shell: pwsh
        run: |
          python -B -m unittest discover -s tests -p test_itd02_native_public_cohort_dev.py -v
          if ($LASTEXITCODE -ne 0) { throw "ITD02_NATIVE_COHORT_FAILED" }
          python -B -m unittest discover -s tests -p test_itd02_public_source_journal_dev.py -v
          if ($LASTEXITCODE -ne 0) { throw "ITD02_CUSTODY_FAILED" }
          python -B -m unittest discover -s tests -p test_itd02_native_training_session_dev.py -v
          if ($LASTEXITCODE -ne 0) { throw "ITD02_NATIVE_SESSION_FAILED" }
      - name: Preserve original checkout and non-promotional evidence
        shell: pwsh
        run: |
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) { throw "ITD02_DEVELOPMENT_CHECKOUT_DIRTY $($dirty -join ',')" }
          "SOURCE_FREE_COHORT_ENGINEERING_CHECK=PASS" >> $env:GITHUB_STEP_SUMMARY
          "Not original Shuttle source first-use; not retail PC energy/RAM acceptance." >> $env:GITHUB_STEP_SUMMARY
      - name: Export actual source-free learned-state checkpoint across three OS processes
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ygg-itd02-cold-native-artifact"
          $sha = (git rev-parse HEAD).Trim()
          python -B scripts/itd02_native_cohort_checkpoint_evidence_dev.py --phase prefix --root $root --source-commit-sha $sha
          if ($LASTEXITCODE -ne 0) { throw "ITD02_PREFIX_EVIDENCE_FAILED" }
          python -B scripts/itd02_native_cohort_checkpoint_evidence_dev.py --phase resume --root $root --source-commit-sha $sha
          if ($LASTEXITCODE -ne 0) { throw "ITD02_RESUME_EVIDENCE_FAILED" }
          python -B scripts/itd02_native_cohort_checkpoint_evidence_dev.py --phase verify --root $root --source-commit-sha $sha
          if ($LASTEXITCODE -ne 0) { throw "ITD02_COLD_READBACK_FAILED" }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ygg-itd02-sourcefree-native-checkpoint-${{ matrix.os }}
          path: ${{ runner.temp }}/ygg-itd02-cold-native-artifact/
          if-no-files-found: error
          retention-days: 30
