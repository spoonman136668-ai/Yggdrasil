name: Q8 pinned source static feasibility (no engine execution)
on:
  push:
    branches: [audit/nci04-p0fc2r-source-preflight-20261022]
    paths: [.github/workflows/q8-pinned-source-static-audit.yml]
permissions:
  contents: read
jobs:
  pinned-source-static:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fail closed on audit-only identity and frozen source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9fb7f0284bb8c362e5e4fb22dd17e4c59ecd24c2"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/q8-pinned-source-static-audit.yml"
          test "$(git rev-parse HEAD:research/nci04_p0fc2/FROZEN_DESIGN.json)" = "42db4b7e285a1ee0423c219febc6892f76d9e875"
          test "$(git rev-parse HEAD:research/nci04_p0fc2/public_counts.py)" = "6a42b4d1d040d0924dbb153a6dfc1d24c3dc3e10"
          echo "Q8_FROZEN_SOURCE_SCOPE=PASS"
      - name: Static original-source attestation only — NO native engine import, reset, or episode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q8-evidence
          python -B - <<'PY'
          import ast
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          design = json.loads(Path('research/nci04_p0fc2/FROZEN_DESIGN.json').read_text(encoding='utf-8'))
          source = design['source']['original_git_commits']
          expected = {
              'minigrid_license': (
                  'Farama-Foundation/Minigrid', source['FaramaMiniGridDoorKey8'],
                  'LICENSE', '880057397a1f9f7b3b1f0870eb84fa699ecbf50c'),
              'minigrid_pyproject': (
                  'Farama-Foundation/Minigrid', source['FaramaMiniGridDoorKey8'],
                  'pyproject.toml', '61ab88372ca553af255a42564260994be808ac12'),
              'minigrid_door_key': (
                  'Farama-Foundation/Minigrid', source['FaramaMiniGridDoorKey8'],
                  'minigrid/envs/doorkey.py', 'df5b29ef063be34e6d83b8b478e092c6e3e01512'),
              'pycolab_license': (
                  'google-deepmind/pycolab', source['DeepMindPycolabApprehend'],
                  'LICENSE', 'd645695673349e3947e8e5ae42332d0ac3164cd7'),
              'pycolab_apprehend': (
                  'google-deepmind/pycolab', source['DeepMindPycolabApprehend'],
                  'pycolab/examples/apprehend.py', '6487af77548f35b046a2b9c4d08bfa42b5982e16'),
          }
          content = {}
          for name, (repo, sha, path, expected_blob) in expected.items():
              # Read only original, commit-pinned upstream FILE bytes. Never import
              # engine code, construct a world, choose an actor or consume a seed.
              url = f'https://raw.githubusercontent.com/{repo}/{sha}/{path}'
              with urlopen(url, timeout=25) as response:
                  data = response.read(200_000)
              digest = hashlib.sha1(
                  b'blob ' + str(len(data)).encode('ascii') + b'\x00' + data
              ).hexdigest()
              if digest != expected_blob:
                  raise RuntimeError(f'Q8_UPSTREAM_BLOB_DRIFT:{name}:{digest}')
              content[name] = data.decode('utf-8')
          seeds = design['cohorts']
          groups = ('engineering_only', 'train_fit', 'train_validation', 'held_development')
          ids = [seed for group in groups for seed in seeds[group]]
          if len(ids) != 40 or len(set(ids)) != 40:
              raise RuntimeError('Q8_INTERNAL_COHORT_COLLISION')
          if seeds['protected_scientific_first_use'] != 'NOT_ALLOCATED_AND_NOT_AUTHORIZED':
              raise RuntimeError('Q8_PROTECTED_COHORT_DRIFT')
          tree = ast.parse(content['pycolab_apprehend'])
          uses_curses = any(isinstance(x, ast.Import) and
                            any(a.name == 'curses' for a in x.names)
                            for x in tree.body)
          if not uses_curses:
              raise RuntimeError('Q8_APPREHEND_CURSES_IMPORT_DRIFT')
          layouts = [x for x in tree.body
                     if isinstance(x, ast.Assign) and
                     any(isinstance(target, ast.Name) and target.id == 'GAME_ART'
                         for target in x.targets)]
          if len(layouts) != 1:
              raise RuntimeError('Q8_APPREHEND_LAYOUT_DRIFT')
          board = ast.literal_eval(layouts[0].value)
          if len(board) != 10 or any(len(row) != 7 for row in board):
              raise RuntimeError('Q8_ORIGINAL_PUBLIC_BOARD_SHAPE_DRIFT')
          if not ('import curses' in content['pycolab_apprehend']
                  and 'Apache License' in content['pycolab_license']
                  and 'Apache License' in content['minigrid_license']
                  and 'license = { text = "MIT License" }' in content['minigrid_pyproject']):
              raise RuntimeError('Q8_UPSTREAM_LICENSE_METADATA_DRIFT')
          curses_available = importlib.util.find_spec('curses') is not None
          receipt = {
              'schema':'yggdrasil.q8.pinned-upstream-static-preflight.v1',
              'source_branch_parent': '9fb7f0284bb8c362e5e4fb22dd17e4c59ecd24c2',
              'runner_os': os.environ.get('RUNNER_OS'),
              'upstream_original_git_blob_identity': 'PASS',
              'original_pinned_commits': source,
              'upstream_blobs': {k:v[3] for k,v in expected.items()},
              'provisional_seed_counts': {group:len(seeds[group]) for group in groups},
              'seed_internal_unique': True,
              'external_consumed_seed_ledger': 'NOT_CHECKED',
              'minigrid_license_file': 'Apache-2.0-text',
              'minigrid_pyproject_license_metadata': 'MIT-text',
              'license_consistency': 'REVIEW_REQUIRED',
              'pycolab_apprehend_unconditional_curses_import': True,
              'pycolab_public_board_shape': [10,7],
              'runner_curses_module_available': curses_available,
              'native_pycolab_windows_source_replay_admitted': False,
              'scientific_first_use_authorized': False,
              'original_source_engine_executed': False,
              'original_source_episodes_generated': 0,
              'engineering_static_source_preflight': 'PASS',
          }
          Path('q8-evidence/source-preflight.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          print('Q8_PINNED_UPSTREAM_STATIC_SOURCE=PASS')
          print('Q8_40_SEEDS_INTERNAL_UNIQUE=PASS_EXTERNAL_LEDGER_NOT_VERIFIED')
          print('Q8_PYCOLAB_CURSES_AVAILABLE=' + str(curses_available).upper())
          print('Q8_LICENSE_CONSISTENCY=REVIEW_REQUIRED')
          print('Q8_SCIENTIFIC_SOURCE_EXECUTION=NOT_AUTHORIZED')
          PY
      - name: Read-only verification of no tracked source modifications
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "Q8_REPOSITORY_SOURCE_UNCHANGED=PASS"
      - name: Archive static audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q8-static-${{ matrix.os }}
          path: q8-evidence/source-preflight.json
          if-no-files-found: warn
          retention-days: 30
