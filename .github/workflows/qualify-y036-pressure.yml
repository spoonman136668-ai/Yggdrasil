name: Yggdrasil Y036 frozen eviction pressure
on:
  push:
    branches: [research/y036-eviction-pressure-r1]
permissions:
  contents: read
jobs:
  original_science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned source and frozen preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6ee81d14358338216bf4a57a2607de6f6fc984e0 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-frequency-eviction/execute.py)" = 859cb95a9a6daa3c1d62fa33a94c4ab20616c69c
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-real-eviction/prereg.json)" = 63b5d23e3d7722b1300fee5fb2eb37c1e86a9849
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-real-eviction/execute.py)" = d583f168de51910712ebce91633db274fef0a849
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-real-eviction/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-real-eviction/execute.py
      - name: First-use frozen scientific experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-real-eviction/execute.py > /tmp/y036-original.json
          python3 -m json.tool /tmp/y036-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original
          path: /tmp/y036-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Single full repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
