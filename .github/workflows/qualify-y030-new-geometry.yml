name: Yggdrasil Y030 keyed geometry scientific qualification
on:
  push:
    branches: [research/y030-new-geometry-family-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin parent and frozen original new source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3d169808b5996ee1d9ca7304574843d2152018a9 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-y029-cache-trust/execute.py)" = 7d9bbfb074e51364f42c1700efb16ada9c0a78c2
          test "$(git hash-object research/contrib/chatgpt/20261012-y030-new-family/prereg.json)" = 902d2aa21c2d15fc229df3c70a95f1188b5a61ea
          test "$(git hash-object research/contrib/chatgpt/20261012-y030-new-family/execute.py)" = c6396dd8fb125044618c5e4cfa99a89243a0c481
          python3 -m json.tool research/contrib/chatgpt/20261012-y030-new-family/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-y030-new-family/execute.py
      - name: Original keyed geometry and independent Hall science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-y030-new-family/execute.py > /tmp/Y030-original.json
          python3 -m json.tool /tmp/Y030-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y030-original-keyed-geometry
          path: /tmp/Y030-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
