name: Y-F47 one frozen group-robust task-calibration TRAIN-only experiment
on:
  push:
    branches:
      - research/y-f47-minimax-transfer-20261015-r1
permissions:
  contents: read
jobs:
  frozen-train:
    if: "${{ github.event.head_commit.message == 'science(y-f47): execute frozen source once train-only' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify parent, prereg prior to coding, and unchanged source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 88963d04511a49e935c0873bf14af15f771274d0 HEAD
          git merge-base --is-ancestor bc2c116f7e8c46eb3ff960b607fe142d5adba4c0 HEAD
          test "$(git hash-object research/foundational/20261015-y-f47/prereg-candidate.json)" = 4c9c8536b55182f3ef7e5897e99d6f9a09bafdd8
          test "$(git hash-object research/foundational/20261015-y-f47/source_pilot.py)" = 6f1ec38748ac9cc5ea0c3cd02ff2002c1154f15d
          python3 -m json.tool research/foundational/20261015-y-f47/prereg-candidate.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-y-f47 -p test_preflight.py -v
      - name: One full repository pytest regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e '.[test]'
          python3 -m pytest -q tests
      - name: Exactly one genuine new synthetic TRAIN-only fit/heldout mechanism cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261015-y-f47/source_pilot.py > /tmp/y-f47-source.json
          python3 -m json.tool /tmp/y-f47-source.json >/dev/null
          sha256sum /tmp/y-f47-source.json > /tmp/y-f47-source.sha256
          git rev-parse HEAD > /tmp/y-f47-head.txt
      - name: Independently recount 128 rows, mechanism controls, FP FN Brier logloss and frozen gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math
          d=json.load(open('/tmp/y-f47-source.json'))
          p=json.load(open('research/foundational/20261015-y-f47/prereg-candidate.json'))
          t=p['train_only'];a=p['acceptance'];arms=p['controls']
          assert d['schema']=='yggdrasil.f47.groupDRO-typed-task.trainonly.v1'
          assert d['stage']=='TRAIN_ONLY_UNSEEN_MECHANISM_NO_PRIMARY_ORIGINAL'
          assert d['fit_seeds']==t['fit_seeds'] and d['diagnostic_seeds']==t['diagnostic_seeds']
          assert d['fit_families']==t['fit_families'] and d['diagnostic_families']==t['diagnostic_families']
          assert d['train_mechanisms']==t['fit_mechanisms']
          assert d['heldout_mechanisms']==t['heldout_mechanisms']
          assert set(d['train_mechanisms']).isdisjoint(d['heldout_mechanisms'])
          assert set(d['fit_families']).isdisjoint(d['diagnostic_families'])
          assert d['questions']==t['expected_diagnostic_cases']==128 and len(d['rows'])==128
          assert d['training_examples']==8*4*2*2*10*3*3
          assert d['packed_parameter_bytes']==144 and d['parameter_bytes_not_total_native_residency']
          assert len(d['robust_group_weights'])==2
          assert math.isclose(sum(d['robust_group_weights']),1.,abs_tol=1e-12)
          assert d['public_anchor_count']==t['public_labeled_anchors']==24
          assert d['paid_channels_per_role']==t['physical_paid_reads_per_role']==2
          assert d['proposed_original_seeds_NOT_RESERVED']==p['future_original_proposal_NOT_RESERVED']['seeds']
          assert d['diagnostic_labels_not_used_in_fit'] and d['private_mode_never_selector_feature']
          assert not d['source_independent_F3_custody'] and not d['original_executed']
          assert not d['native_576_bytes_residency_qualified']
          assert not d['accepted_ref_mutation'] and d['paid_api_calls']==0
          rows=d['rows']
          assert len({(r['seed'],r['family'],r['mechanism'],r['condition']) for r in rows})==128
          for row in rows:
              assert 431100<=row['seed']<431108
              assert row['family'] in t['diagnostic_families']
              assert row['mechanism'] in t['heldout_mechanisms']
              assert row['condition'] in t['conditions']
              assert row['public_anchor_count']==24
              assert set(row['predictions'])==set(arms)
              assert set(row['task_probabilities'])==set(arms)
              assert set(row['receipts'])==set(arms)-{'private_oracle_unfair'}
              for traces in row['receipts'].values():
                  assert len(traces)==3
                  assert all(len(trace)==2 and trace[0]==0 and trace[1] in (1,2,3) for trace in traces)
              assert all(0<q<1 for q in row['task_probabilities'].values())
          def score(subset,arm):
              n=len(subset)
              correct=sum(r['predictions'][arm]==r['truth'] for r in subset)
              fp=sum(bool(r['predictions'][arm]) and not r['truth'] for r in subset)
              fn=sum(not bool(r['predictions'][arm]) and r['truth'] for r in subset)
              brier=sum((r['task_probabilities'][arm]-float(r['truth']))**2 for r in subset)/n
              loss=-sum(math.log(r['task_probabilities'][arm] if r['truth'] else
                    1-r['task_probabilities'][arm]) for r in subset)/n
              return dict(correct=correct,total=n,accuracy=correct/n,fp=fp,fn=fn,Brier=brier,logloss=loss)
          def equal(a,b):
              assert a.keys()==b.keys()
              for k,v in b.items():
                  if isinstance(v,float):assert math.isclose(a[k],v,abs_tol=1e-11,rel_tol=1e-11)
                  else:assert a[k]==v
          for arm in arms:equal(d['scores'][arm],score(rows,arm))
          assert d['scores']['private_oracle_unfair']['correct']==128
          for mechanism in t['heldout_mechanisms']:
              subset=[r for r in rows if r['mechanism']==mechanism]
              assert len(subset)==64
              for arm in arms:equal(d['by_mechanism'][mechanism][arm],score(subset,arm))
          fair=('equal_data_ERM_task_selector','fitted_Gaussian_risk',
            'empirical_conditional_Brier','public_static','variance_control')
          strongest=max(fair,key=lambda arm:d['scores'][arm]['accuracy'])
          cand='groupDRO_task_selector'
          gain=d['scores'][cand]['accuracy']-d['scores'][strongest]['accuracy']
          ablation=d['scores'][cand]['accuracy']-d['scores']['first_read_masked_groupDRO']['accuracy']
          nonreg=all(d['by_mechanism'][m][cand]['correct']>=max(
            d['by_mechanism'][m][arm]['correct'] for arm in fair) for m in t['heldout_mechanisms'])
          qualified=gain>=a['gain_vs_strongest_fair_min'] and ablation>0 and nonreg
          assert d['strongest_fair_control']==strongest
          assert math.isclose(d['candidate_gain'],gain,abs_tol=1e-12)
          assert math.isclose(d['first_read_ablation_gain'],ablation,abs_tol=1e-12)
          assert d['per_mechanism_nondegradation']==nonreg
          assert d['frozen_criterion_met']==qualified
          assert d['verdict']==('TRAIN_ONLY_GROUP_ROBUST_CALIBRATION_SUPPORTED' if qualified else 'TRAIN_ONLY_GROUP_ROBUST_CALIBRATION_NEGATIVE')
          print('Y_F47',d['verdict'],'accuracy',{arm:d['scores'][arm]['correct'] for arm in arms},
            'Brier',{arm:round(d['scores'][arm]['Brier'],5) for arm in arms},
            'gain',gain,'first_masked_delta',ablation,'no_mechanism_regress',nonreg)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Y-F47-one-new-group-robust-TRAIN-only
          path: |
            /tmp/y-f47-source.json
            /tmp/y-f47-source.sha256
            /tmp/y-f47-head.txt
          retention-days: 90
          if-no-files-found: error
      - name: Explicit authority isolation
        run: |
          echo "ORIGINALS_EXECUTED=0"
          echo "F3_NATIVE_576B_QUALIFIED=FALSE"
          echo "CKB_FORGE_SCIENCE_DISPATCH_UNCHANGED=TRUE"
