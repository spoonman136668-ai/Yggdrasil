name: AAI-12Q immutable final native+AAI12P+AAI12Q full source regression
on:
  push:
    branches: [research/aai12q-final-regression-once-20261114]
    paths: [.github/workflows/aai12q-exact-final-regression.yml]
permissions:
  contents: read
concurrency:
  group: aai12q-final-main-readonly-one-shot-20261114
  cancel-in-progress: false
jobs:
  final:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'AAI-12Q immutable 74-test per OS original native and research final qualification' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Independent original-main based read-only one-file qualification harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C harness rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C harness rev-parse HEAD^)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git -C harness diff --name-only HEAD^ HEAD)" = '.github/workflows/aai12q-exact-final-regression.yml'
          test -z "$(git -C harness status --porcelain)"
          echo AAI12Q_FINAL_MAIN_ISOLATED_READONLY_HARNESS_PASS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: 4ed9ef07b0d4b7ade73751d1b4e07e280c4acdcb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Immutable final actual PR/source, original baseline, prereg-first and G29 atlas
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4ed9ef07b0d4b7ade73751d1b4e07e280c4acdcb'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '5e74f8db85b2f5839c42148c0dfba69a88b1a2c9'
          test "$(git ls-remote origin refs/heads/research/aai12p-diverse-causal-worlds-20261114 | cut -f1)" = 'abd374e7dc433981df991e103d8ebdff0b5eb093'
          test "$(git ls-remote origin refs/heads/research/aai12q-contrastive-intervention-invariants-20261114 | cut -f1)" = '4ed9ef07b0d4b7ade73751d1b4e07e280c4acdcb'
          test "$(git rev-parse 8fd3fab547db14b997345f4d6dbc0aaaaf831e1a^)" = 'abd374e7dc433981df991e103d8ebdff0b5eb093'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12Q/prereg.json)" = '9ded7ffd9829008639ff6239968859179de2c92a'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12Q/prereg.json)" = "$(git rev-parse 8fd3fab547db14b997345f4d6dbc0aaaaf831e1a:research/contrib/chatgpt/AAI-12Q/prereg.json)"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12Q/invariants.py)" = 'c7e329302f8b4faecc3a22394d1daba1c2851229'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12Q/dev.py)" = '94d69d0d0af1b78ae5a34b86504fe968c39cd058'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12Q/test_invariants.py)" = '0d3d469e584c31cc2e303812319d5a151a382332'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/prereg.json)" = '74f57c2175e7ae87926e4f7fd985d741f719c0a9'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/world.py)" = '488c54aee283434599f106b22b6008cd596bac37'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/controls.py)" = '042b36f66fa14e0c7c7f39fe709ed58df9776eed'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/admit.py)" = '1aedb903e6c359c962b3d36009d78ce2d2f235b2'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-12P/test_benchmark.py)" = 'e3310597abf3cae08bd860e2a497be920baf3202'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo AAI12Q_FINAL_EXACT_SOURCE_PARENT_PREREG_G29_CUSTODY_PASS
      - name: Mandatory original native plus parent and novel causal source complete suites
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-12P -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-12Q -p 'test_*.py' -v
          if python -B research/contrib/chatgpt/AAI-12Q/dev.py --primary >/dev/null 2>&1; then
            echo AAI12Q_UNAUTHORIZED_SCIENCE_FIRST_USE >&2
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo AAI12Q_MANDATORY_EXACT_FINAL_74_TESTS_PER_OS_PASS_NO_SCIENCE
