name: Mass CS06 original POPGym public count-memory source probe
on:
  push:
    branches:
      - research/mass-cs06-popgym-count-memory-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs06-popgym-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-popgym-public-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout frozen source FIRST protocol and additions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Guard exact upstream baseline first-commit and additive change scope
        shell: bash
        run: |
          set -euo pipefail
          first=ff46052e70a8f74f977a2c3bffee90494b8e0a16
          parent=20ab6ff04f05c9ad5136a567097d2a713299b9e8
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS06_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;actual=set(sys.stdin.read().splitlines());expected={"research/native/itd01/mass_r10/CS06_PREREG.md","research/native/itd01/mass_r10/run_cs06_popgym_retention.py","research/native/itd01/mass_r10/test_cs06_popgym_retention.py",".github/workflows/mass-cs06-popgym-retention.yml"};assert actual==expected,(actual,expected)'
      - name: Checkout original independent POPGym source pinned to exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: proroklab/popgym
          ref: 410d5aa626dae8024f498354d8781a0d1870c399
          path: external/popgym
          persist-credentials: false
      - name: Setup Python compatible with unchanged source
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install original untouched POPGym package
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs06-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/popgym >cs06-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >cs06-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: No-source focused memory and seed tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v research/native/itd01/mass_r10/test_cs06_popgym_retention.py 2>&1 | tee cs06-evidence/focused-tests.log
      - name: Execute frozen original public source FIT VALID DEV once
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/run_cs06_popgym_retention.py --upstream external/popgym --out cs06-evidence/
      - name: Preserve source fit and all negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs06-original-popgym-count-recall
          path: cs06-evidence/
          retention-days: 30
