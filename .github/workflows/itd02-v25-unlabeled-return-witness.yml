name: ITD-02 V25 preliminary unlabeled-return behavior audit
on:
  push:
    branches:
      - research/itd02-v25-unlabeled-return-recognition-20261028
permissions:
  contents: read
jobs:
  v25-return-behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact cross-host source
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Frozen original and prereg chronology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 089918a7bdefbdd19cf4b817bf191a60c2e76805 "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_local_ring_memory_dev.py)" = 1db0835d5c99456bcf99a013d4836f49314a9d39
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
      - name: Execute seven fixed public streams with fail-closed logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v25"
          if ! PYTHONPATH=. python -B research/itd02_v25_return_sequence_audit.py > "$RUNNER_TEMP/v25/return.json" 2> "$RUNNER_TEMP/v25/return.err"; then
            cat "$RUNNER_TEMP/v25/return.err"
            exit 1
          fi
          python - "$RUNNER_TEMP/v25/return.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"]=="ygg.itd02.v25.unlabeled_return.source_only.v1"
          assert d["source_only"] and not d["scientific_first_use"]
          assert not d["original_world_training"]
          assert d["candidate_scalars"]==326 and len(d["streams"])==7
          assert len(d["canonical_public_evidence_sha256"])==64
          assert all(s["source_sha_unchanged"] and s["checkpoint_bytes"]<=12288 for s in d["streams"])
          print("V25_PRELIMINARY_UNLABELED_RETURN_WITNESS_NOT_FULL_SCIENCE")
          PY
          cat "$RUNNER_TEMP/v25/return.json"
      - name: V25 mechanism, V24, original native integrity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v25_unlabeled_return_dev.py' -v
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_v24_protected_dual_memory.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve host output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: itd02-v25-return-witness-${{ matrix.os }}
          path: ${{ runner.temp }}/v25/*
          retention-days: 7
          if-no-files-found: warn
