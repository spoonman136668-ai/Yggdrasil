name: ITD-02 V31K exact-source G29 reanchor and complete regression
on:
  push:
    branches: [qualification/itd02-v31k-contract-g29-20261028]
    paths: [.github/workflows/itd02-v31k-reanchor-full-regression.yml]
permissions:
  contents: read
concurrency:
  group: itd02-v31k-g29-single-source-20261028
  cancel-in-progress: false
jobs:
  source-reanchor:
    if: ${{ github.actor == 'spoonman136668-ai' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.publish.outputs.published_sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve exact Git source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate frozen ancestor, exact V31K contract-only delta
        shell: bash
        run: |
          set -euo pipefail
          parent=00f9b3c67459516eb5f362a6113ae219b6e9fd8d
          prereg=2d5517304c93e87e1ac7c46c4114df5979d918ab
          test "$GITHUB_REF_NAME" = 'qualification/itd02-v31k-contract-g29-20261028'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$prereg^")" = "$parent"
          test "$(git rev-parse HEAD^)" = d822af0dfdd0e29de0e938aadc3779a6b320b472
          git merge-base --is-ancestor "$prereg" HEAD
          test -z "$(git diff --name-only "$parent" HEAD -- yggdrasil)"
          git diff --name-only "$parent" HEAD | sort > "$RUNNER_TEMP/v31k-actual"
          printf '%s\n' \
            .github/workflows/itd02-v31k-reanchor-full-regression.yml \
            qualification/itd02_v31k_regression_contract_20261028.md \
            tests/test_itd02_cell_temporal_register_dev.py \
            tests/test_itd02_context_credit_v7_dev.py \
            tests/test_itd02_local_credit_v6_dev.py \
            tests/test_itd02_neighbor_trace_dev.py \
            tests/test_itd02_two_phase_public_native_dev.py | sort > "$RUNNER_TEMP/v31k-allowed"
          diff -u "$RUNNER_TEMP/v31k-allowed" "$RUNNER_TEMP/v31k-actual"
          test "$(git hash-object yggdrasil/itd02_native_task_bridge_dev.py)" = 71eff80e3cfabb627e9d08d558b63f4043ce1fd5
          test "$(git hash-object yggdrasil/itd02_v22_shared_context_ring_dev.py)" = 73dc4d7580f7f0b8ed8de1119b06504c44b0818f
          test "$(git hash-object research/itd02_v31j_executed_edge_ledger_audit.py)" = "$(git rev-parse "$parent:research/itd02_v31j_executed_edge_ledger_audit.py")"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V31K_CONTRACT_SCOPE_PASS
      - name: Run source-only inherited focused tests and unchanged V31J ledger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_itd02_*.py' -v
          PYTHONPATH=. python -B research/itd02_v31i_cold_restart_audit.py
          PYTHONPATH=. python -B research/itd02_v31j_executed_edge_ledger_audit.py
      - name: Recreate G29 derived Atlas from exactly this qualified source
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          test -z "$(git diff --name-only -- ':!/.ice/code-atlas.json' ':!/.ice/code-atlas.html' ':!/.ice/code-atlas.ice')"
      - name: Commit only derived source locators on isolated branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'qualification/itd02-v31k-contract-g29-20261028'
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git diff --cached --name-only > "$RUNNER_TEMP/v31k-atlas-actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/v31k-atlas-allowed"
          diff -u "$RUNNER_TEMP/v31k-atlas-allowed" "$RUNNER_TEMP/v31k-atlas-actual"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'index(V31K): pin source-derived G29 locators without learner changes'
          python -B scripts/build_code_atlas.py --check-if-present
          PYTHONPATH=. python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo V31K_EXACT_G29_SOURCE_REANCHORED
      - name: One complete inherited Python regression after committed G29 (Ubuntu)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V31K_UBUNTU_FULL_REGRESSION_PASS
  cross-host:
    needs: source-reanchor
    if: ${{ needs.source-reanchor.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-reanchor.outputs.published_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact generated source and complete Windows regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.source-reanchor.outputs.published_sha }}'
          python -B scripts/build_code_atlas.py --check-if-present
          PYTHONPATH=. python -B research/itd02_v31j_executed_edge_ledger_audit.py
          PYTHONPATH=. python -B -m unittest discover -s tests -p 'test_*.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo V31K_WINDOWS_FULL_REGRESSION_PASS
