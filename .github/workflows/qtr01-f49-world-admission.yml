name: QTR-01 F49 world-admission preflight and full regression
on:
  push:
    branches:
      - research/qtr01-qwen38-donor-intake-20261114
permissions:
  contents: read
jobs:
  qualify:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'ci(qtr): F49 world admission final qualification'
    name: F49 no-outcome admission and full regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Windows byte-stable checkout configuration
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen protocol and exact unchanged F49 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '5a20d5c413262dc8fe76a6ab871c5a68e5650738'
          test "$(git log -1 --format=%s)" = 'ci(qtr): F49 world admission final qualification'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/qtr01-f49-world-admission.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_prereg.json)" = '839309211feef018d1c308091716bc6e0d4e7a70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/f49_worlds.py)" = '9a5185584b965f6529ceceadc1da8da8eb36be70'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/QTR-01/test_f49_worlds.py)" = '12c747fe59b31c535d459fd4e19e1d7610841e9f'
          git merge-base --is-ancestor 4ae900157c22974696f37a5463b68d8c317f6c37 HEAD
          echo F49_FROZEN_SOURCE_SHA_AND_BLOB_CUSTODY=PASS
      - name: Install inherited pinned original-regression dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3 gymnasium==1.1.1 pygame-ce==2.5.3 psutil==6.1.1 pyarrow==18.1.0
      - name: F49 nine-world admission-only and negative controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_f49_*.py' -v
      - name: Full original repository regression
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full QTR contributor regression
        run: python -B -m unittest discover -s research/contrib/chatgpt/QTR-01 -p 'test_*.py' -v
      - name: Exact-source and no scientific first-use end fence
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/QTR-01/f49_worlds.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo F49_NO_TARGET_OBSERVATION_OR_ACCEPTED_MODEL_CHANGE=PASS
