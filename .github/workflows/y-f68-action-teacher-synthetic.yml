name: Yggdrasil F68 structural action-distillation synthetic gate
on:
  push:
    branches:
      - research/y-f68-context-action-junction-precode-20261016-r1
permissions:
  contents: read
jobs:
  frozen-structural-synthetic:
    if: "${{ github.event.head_commit.message == 'ci(y-f68): qualify genuine public action supervision before protected FIT' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify training protocol was frozen before synthetic first-use
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7e9672afcb2f19b1395aaafbef5f52951cc459d8 HEAD
          test "$(git hash-object research/foundational/20261016-y-f68/prereg.json)" = d6bb9395bce54562bb89bfb07dcb445a9996123a
          test "$(git hash-object research/foundational/20261016-y-f68/train_method_precode.json)" = 99d024db0ab22775f8a2790f0156eb2c56fe2101
          test "$(git hash-object research/foundational/20261016-y-f68/action_conditioned.py)" = c079cb2b6993429c302f4f634e2862d05056fbdb
          test "$(git hash-object research/foundational/20261016-y-f68/teacher_action_distill.py)" = 49c07bc81710889a0b4ee1f02c3eee043ebf87e3
      - name: Fit unregistered synthetic cases then audit distinct guard identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f68-teacher/"
          python3 -B research/foundational/20261016-y-f68/teacher_action_distill.py --synthetic-only > "$RUNNER_TEMP/f68-teacher/synthetic_method.json"
          python3 -B -m json.tool "$RUNNER_TEMP/f68-teacher/synthetic_method.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"f68-teacher/synthetic_method.json")));print("F68_TRAINED_SYNTHETIC_COUNTS",d["teacher_counts"]);print("F68_TRUE_JUNCTIONS",d["guards"]);print("F68_SCIENTIFIC_PRECURSOR",d["synthetic_model_qualified"]);assert not d["FIT_train_consumed"] and not d["FIT_validation_consumed"]'
          sha256sum "$RUNNER_TEMP/f68-teacher/synthetic_method.json" > "$RUNNER_TEMP/f68-teacher/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/f68-teacher/head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f68-frozen-action-supervision-synthetic-evidence
          path: ${{ runner.temp }}/f68-teacher/
          retention-days: 90
          if-no-files-found: warn
