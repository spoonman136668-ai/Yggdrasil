name: Yggdrasil external final cue reactivation 019

on:
  push:
    branches:
      - research/external-hosted-yggdrasil-reactivation-r1
    paths:
      - 'research/applications/plane/exp-dgr-external-final-cue-reactivation-019.py'
      - '.github/workflows/external-final-cue-reactivation-019.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen two-commit package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e6c272e36c50cfce781a9c82b8aed6483ed1372a"
          test "$(git rev-parse HEAD^^)" = "139eb131d5c86c60c305c727af027142393bb1b1"
          mapfile -t p < <(git diff-tree --no-commit-id --name-only -r HEAD^)
          test "${#p[@]}" -eq 1
          test "${p[0]}" = 'research/experiments/exp-dgr-external-final-cue-reactivation-019.ice'
          mapfile -t f < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#f[@]}" -eq 2
          printf '%s\n' "${f[@]}" | grep -Fx 'research/applications/plane/exp-dgr-external-final-cue-reactivation-019.py'
          printf '%s\n' "${f[@]}" | grep -Fx '.github/workflows/external-final-cue-reactivation-019.yml'

      - name: Verify exact CKB-plane READY_RESEARCH receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Yggdrasil","experiment":"EXP-DGR-EXTERNAL-FINAL-CUE-REACTIVATION-019","preregistration_sha":"e6c272e36c50cfce781a9c82b8aed6483ed1372a","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001351","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=='adea29d0dc0994147a287162f0a4ed938dd76710a7e2aa85ab46334c023840be'
          r=json.loads(raw)
          assert r['research_decision']['disposition']=='READY_RESEARCH'
          assert r['research_decision']['scope']=='research-consume-once'
          assert r['preregistration_sha']=='e6c272e36c50cfce781a9c82b8aed6483ed1372a'
          pathlib.Path('/tmp/yggdrasil-019-authority.json').write_text(raw,encoding='utf-8')
          PY

      - name: Fetch exact external sources into ephemeral scratch
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/ygg-external-019"
          mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          p=json.load(open('research/experiments/exp-dgr-external-raw-cumulative-consolidation-017.ice',encoding='utf-8'))
          assert p['external_authority']['manifest_sha256']=='75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4'
          root=pathlib.Path(os.environ['EXTERNAL_ROOT'])
          rows=[]
          for src in p['sources']:
              u=urllib.parse.urlparse(src['uri'])
              assert u.scheme=='https' and u.hostname=='raw.githubusercontent.com'
              req=urllib.request.Request(src['uri'],headers={'User-Agent':'yggdrasil-external-019'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(int(src['bytes'])+1)
              assert len(data)==int(src['bytes'])
              actual=hashlib.sha256(data).hexdigest()
              assert actual==src['sha256']
              (root/(src['domain']+'.bin')).write_bytes(data)
              rows.append({'domain':src['domain'],'bytes':len(data),'sha256':actual})
          assert sum(x['bytes'] for x in rows)==57272
          pathlib.Path('/tmp/yggdrasil-019-sources.json').write_text(json.dumps(rows,separators=(',',':')),encoding='utf-8')
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"

      - name: Run frozen final cue-reactivation experiment twice
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python research/applications/plane/exp-dgr-external-final-cue-reactivation-019.py --root "$EXTERNAL_ROOT" --out /tmp/result1.json
          python research/applications/plane/exp-dgr-external-final-cue-reactivation-019.py --root "$EXTERNAL_ROOT" --out /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          echo 'YGGDRASIL_019_DUPLICATE_BYTE_IDENTICAL=PASS'
          cat /tmp/result1.json

      - name: Classify only from frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('/tmp/result1.json').read_text(encoding='utf-8'))['metrics']
          validity=(
              m['source_identity_mismatch_count']==0 and
              m['source_count']==3 and
              m['total_source_bytes']==57272 and
              m['base_training_identity_mismatch_count']==0 and
              m['valid_final_state_count']==2 and
              m['reactivation_evaluation_count']==12 and
              m['matched_assignment_failure_count']==0 and
              m['minimum_selected_motif_count']==16 and m['maximum_selected_motif_count']==16 and
              m['minimum_active_structure_count']==7 and m['maximum_active_structure_count']==7 and
              m['minimum_retained_structure_count']==9 and m['maximum_retained_structure_count']==9 and
              m['retained_record_integrity_mismatch_count']==0 and
              m['state_partition_mismatch_count']==0 and
              m['capacity_growth_event_count']==0 and
              m['tokenizer_use_count']==0 and
              m['external_model_call_count']==0 and
              m['invalid_evaluation_rows']==0
          )
          window_clean=(m['active_reactivation_nonpositive_window_count']==0 and m['minimum_active_reactivation_incremental_correct_count']>0)
          aggregate_clean=m['minimum_domain_order_active_aggregate_incremental_correct_count']>0
          if not validity:
              cls='invalid'
          elif window_clean and aggregate_clean:
              cls='supported'
          elif aggregate_clean:
              cls='mixed'
          else:
              cls='negative'
          out={
              'schema':'yggdrasil.research-classification.v1',
              'experiment':'EXP-DGR-EXTERNAL-FINAL-CUE-REACTIVATION-019',
              'classification':cls,
              'validity_pass':validity,
              'window_thresholds_pass':window_clean,
              'aggregate_thresholds_pass':aggregate_clean,
              'authority_receipt_sha256':'adea29d0dc0994147a287162f0a4ed938dd76710a7e2aa85ab46334c023840be',
              'metrics':{
                  'active_reactivation_nonpositive_window_count':m['active_reactivation_nonpositive_window_count'],
                  'minimum_active_reactivation_incremental_correct_count':m['minimum_active_reactivation_incremental_correct_count'],
                  'minimum_domain_order_active_aggregate_incremental_correct_count':m['minimum_domain_order_active_aggregate_incremental_correct_count'],
                  'independent_nonpositive_window_count':m['independent_nonpositive_window_count'],
                  'full_store_nonpositive_window_count':m['full_store_nonpositive_window_count'],
                  'active_reactivation_rescue_window_count':m['active_reactivation_rescue_window_count'],
                  'minimum_active_to_independent_fraction_when_independent_positive':m['minimum_active_to_independent_fraction_when_independent_positive']
              }
          }
          pathlib.Path('/tmp/classification.json').write_text(json.dumps(out,separators=(',',':')),encoding='utf-8')
          print(json.dumps(out,separators=(',',':')))
          if not validity:
              raise SystemExit('FROZEN_019_VALIDITY_FAILED')
          PY

      - name: Delete external bytes
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ygg-external-019"
          test ! -e "$RUNNER_TEMP/ygg-external-019"

      - name: Upload evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-external-final-cue-reactivation-019
          path: |
            /tmp/yggdrasil-019-authority.json
            /tmp/yggdrasil-019-sources.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
