name: Optimizer O22-N explicit unknown public sensor contract

on:
  push:
    branches:
      - research/optimizer-o22n-explicit-unknown-20261025
  pull_request:
    paths:
      - research/optimizer_o22n/**
      - .github/workflows/optimizer-o22n-source-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  missingness-certificate:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg first and zero external source actions
        shell: bash
        run: |
          git merge-base --is-ancestor bc12f4235ff09011be53ffa3a3ba85fcb7e1c937 HEAD
          git merge-base --is-ancestor fbf3946fc9a9efbb631c159994a3f9790b1f907e HEAD
          python -B -c "import json; p=json.load(open('research/optimizer_o22n/PREREG.json')); assert p['source_environment_resets']==0 and p['source_environment_steps']==0 and p['protected_first_use_allowed'] is False"
      - name: Six exact original-Python public presence tests
        run: python -B -m unittest -v research.optimizer_o22n.test_public_presence
