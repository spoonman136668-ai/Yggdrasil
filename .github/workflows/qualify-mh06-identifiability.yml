name: MH06 source-only public-evidence identifiability
on:
  push:
    branches:
      - research/mh06-public-evidence-identifiability-20261120
    paths-ignore:
      - .ice/code-atlas.html
      - .ice/code-atlas.ice
      - .ice/code-atlas.json
permissions:
  contents: read
concurrency:
  group: ygg-mh06-engineering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  derived-atlas:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.seal.outputs.source_sha }}
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Preserve exact source files
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Seal exact native parent and source-only change set
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 69a514ea24c39a8d07639f832bf5220aee9968f8 "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/itd02_v32e_pair_consensus.rs)" = 85237dcc82905e05a273b11023b5be5db722726e
          test "$(git rev-parse HEAD:research/mh05_fresh_storage.py)" = "$(git rev-parse 778478247077b92611e099540ae320380832566f:research/mh05_fresh_storage.py)"
          git diff --name-only 778478247077b92611e099540ae320380832566f "$GITHUB_SHA" |
            python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); e={"research/mh06_public_evidence_identifiability_prereg.md","research/mh06_public_evidence_identifiability.py","research/test_mh06_public_evidence_identifiability.py",".github/workflows/qualify-mh06-identifiability.yml"}; assert a==e,(a,e)'
          test -z "$(git status --porcelain --untracked-files=all)"
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git diff --cached --name-only |
            python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); e={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert a==e,(a,e)'
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "index(MH06): pin source-only G29 Atlas"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo MH06_SOURCE_ONLY_DERIVED_ATLAS_PASS

  exact-final-qualify:
    needs: derived-atlas
    if: ${{ needs.derived-atlas.result == 'success' && github.run_attempt == 1 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve exact source files
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ needs.derived-atlas.outputs.final_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify exact final candidate and derived-only last commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.derived-atlas.outputs.final_sha }}'
          test "$(git rev-parse HEAD^)" = '${{ needs.derived-atlas.outputs.source_sha }}'
          git diff --name-only HEAD^ HEAD |
            python -B -c 'import sys; a=set(sys.stdin.read().splitlines()); e={".ice/code-atlas.html",".ice/code-atlas.ice",".ice/code-atlas.json"}; assert a==e,(a,e)'
          test "$(git rev-parse HEAD:research/itd02_v32e_pair_consensus.rs)" = 85237dcc82905e05a273b11023b5be5db722726e
          python -B scripts/build_code_atlas.py --check-if-present
          echo MH06_EXACT_SOURCE_CUSTODY_PASS
      - name: Run all focused MH06 mechanical/no-oracle tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research -p 'test_mh06_*.py' -v
          echo MH06_NO_FEEDBACK_AND_PUBLIC_EVIDENCE_MECHANICAL_PASS
      - name: MANDATORY full original root regression on final SHA
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import sys,unittest
          suite=unittest.TestLoader().discover("tests",pattern="test_*.py")
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(),"MH06_ROOT_FAIL"
          assert result.testsRun==139,("MH06_ROOT_COUNT_DRIFT",result.testsRun)
          if sys.platform=="win32":
              expected={"test_missing_result_rejected","test_mismatched_candidate_id_rejected",
                        "test_existing_roles_learn_from_own_measured_residual_only",
                        "test_separate_native_model_output_and_equal_information_controls"}
              actual={x.id().rsplit(".",1)[-1] for x,why in result.skipped}
              assert actual==expected and all("POSIX" in why for x,why in result.skipped),(actual,expected)
          else:
              assert not result.skipped,result.skipped
          print("MH06_FULL_ORIGINAL_ROOT_139_PASS")
          PY
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          echo MH06_FULL_FINAL_SOURCE_REGRESSION_PASS
