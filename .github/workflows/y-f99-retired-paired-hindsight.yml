name: F99 retired paired hindsight (read-only, no scientific acceptance)
on:
  push:
    branches:
      - research/y-f99-retired-paired-20261017-r1
    paths:
      - '.github/workflows/y-f99-retired-paired-hindsight.yml'
permissions:
  contents: read
jobs:
  retired-paired:
    strategy:
      fail-fast: false
      matrix:
        scope: [f96_holdout, f98_validation, f98_guard]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout pinned frozen implementation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source and exact one-file CI-only delta
        shell: bash
        run: |
          set -euo pipefail
          base=cd9304a4184692bc837a2bd36a2903d69ea366af
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only "$base" "$GITHUB_SHA")" = '.github/workflows/y-f99-retired-paired-hindsight.yml'
          test "$(git hash-object research/foundational/20261016-y-f99/prereg.json)" = 9abcfbde16137d15248e8ce1229660a46b853dc1
          test "$(git hash-object research/foundational/20261016-y-f99/causal_closure.py)" = 5de08fe74eb74dd917a7559cc3a8755185aac823
          test "$(git hash-object research/foundational/20261016-y-f99/retrospective.py)" = d8cc29fc535e02dbee2f1b1f92a8d419383106df
          test "$(git hash-object research/foundational/20261016-y-f99/test_retrospective.py)" = 2dc27defeb1baa4bbb61b7a3e508299b821d9f06
          test "$(git hash-object research/foundational/20261016-y-f94/single_deviation_feasibility.py)" = 0284a3ed1cd5f263dc4ad7cf3f3f21969bb665ad
          test "$(git hash-object research/foundational/20261016-y-f96/paired_order_probe.py)" = 2cf14367527c9790661af65a84d15cbe11132bc7
          test "$(git hash-object research/foundational/20261016-y-f98/holdout.py)" = be61a466d7e1eafd635e2ebc31a4c103444aec02
          test "$(git hash-object research/foundational/20261016-y-f76/source.py)" = 5b8928b0399ce9f869854beadeab04b29c8703a5
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
          test "$(git hash-object research/foundational/20261016-y-f85/global_solver.py)" = e4eb4bfbd6a01212f8c1eebc38af09b15c6d9cc3
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Noncohort gate test and exact source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s research/foundational/20261016-y-f99 -p 'test_retrospective.py'
      - name: Previously consumed paired-order retrospective only
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/f99-retired-$SCOPE.json"
          python3 -B research/foundational/20261016-y-f99/retrospective.py --consumed "$SCOPE" > "$result"
          python3 - "$result" "$SCOPE" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1]))
          scope=sys.argv[2]
          count={"f96_holdout":64,"f98_validation":32,"f98_guard":64}[scope]
          assert row["schema"]=="yggdrasil.f99.retired-closure-feasibility.v1"
          assert row["stage"]=="CONSUMED_SOURCE_RETROSPECTIVE_ONLY_NOT_ACCEPTED"
          assert row["scope"]==scope and row["overall"]["episodes"]==count
          assert len(row["rows"])==count
          assert all(v["public_prefixes"]==72 for v in row["rows"])
          assert sum(v["public_prefixes"] for v in row["rows"])==72*count
          assert row["exact_native_72_prefixes"] and row["native_memory_limit_bytes"]==144
          assert row["future_question_never_used_in_online_choice"]
          assert row["paired_source_matches"] and not row["fitting_executed"]
          assert not row["new_first_use"] and not row["protected_FIT_DIAG_ORIGINAL_F3"]
          assert not row["valid_online_selector"] and not row["scientific_accepted"]
          assert not row["optimizer_promotion"] and not row["controller_mutation"]
          assert row["classification"] in ("RETROSPECTIVE_FEASIBLE_ONLY",
                                          "RETROSPECTIVE_NO_WITNESS",
                                          "SOURCE_RESOURCE_INELIGIBLE")
          assert row["by_order"]["original"]["episodes"]==count//2
          assert row["by_order"]["local_rotate4"]["episodes"]==count//2
          keys=("classification","six_step_failed_episodes_rescuable","overall",
                "four_step","six_step","by_order")
          print("F99_RETRO_"+scope.upper()+"="+json.dumps({k:row[k] for k in keys},sort_keys=True))
          print("F99_READONLY_NONACCEPTING=TRUE")
          PY
          sha256sum "$result"
      - name: Verify immutable source and no authority mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'NO_NEW_FIRST_USE=TRUE'
          echo 'NO_CONTROLLER_OR_ACCEPTED_REFS=TRUE'
      - name: Archive source-locked historical diagnostic
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f99-retired-${{ matrix.scope }}-readonly
          path: ${{ runner.temp }}/f99-retired-${{ matrix.scope }}.json
          retention-days: 90
