name: YGG-JEPA2-05 archived evidence-gated reentry only
'on':
  push:
    branches:
      - research/jepa2-05-evidence-reentry-posthoc-20261119
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  atlas-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Byte stable checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Seal G29 source-only atlas; no archived source actions
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD 4e6768cca5b5c9d998e9ef0ccda316a66827933b)" = 4e6768cca5b5c9d998e9ef0ccda316a66827933b
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git commit -m 'docs(jepa2-evidence-reentry): seal exact G29 source atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/research/jepa2-05-evidence-reentry-posthoc-20261119
  source-only:
    needs: atlas-seal
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Byte stable checkout exact sealed candidate
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original JEPA2 pinned numeric environment
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Source identity, prereg-before-code and original learned-state immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas-seal.outputs.final_sha }}"
          git diff --exit-code 7b0d9fd8c16b8e0433a632666cec88d8d008c19f HEAD -- yggdrasil research/contrib/chatgpt/YGG-JEPA2-05 research/contrib/chatgpt/YGG-RET01
          git diff --exit-code 594c553d2d6033598d37859d81b9ee25481ec4c6 HEAD -- research/contrib/chatgpt/YGG-JEPA2-05-RESET-POSTHOC research/contrib/chatgpt/YGG-JEPA2-05-RESET-TRADEOFF-POSTHOC
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-05-EVIDENCE-REENTRY-POSTHOC/prereg.json)" = "$(git rev-parse 4e6768cca5b5c9d998e9ef0ccda316a66827933b:research/contrib/chatgpt/YGG-JEPA2-05-EVIDENCE-REENTRY-POSTHOC/prereg.json)"
          python -B -c "import ast,pathlib; ast.parse(pathlib.Path('research/contrib/chatgpt/YGG-JEPA2-05-EVIDENCE-REENTRY-POSTHOC/gate.py').read_text('utf-8'))"
          python -B -c "import ast,pathlib; ast.parse(pathlib.Path('research/contrib/chatgpt/YGG-JEPA2-05-EVIDENCE-REENTRY-POSTHOC/paired_view_reset.py').read_text('utf-8'))"
      - name: Already consumed source only, prequential gate and matched controls
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/YGG-JEPA2-05-EVIDENCE-REENTRY-POSTHOC/gate.py --platform ${{ matrix.platform }} --output "$RUNNER_TEMP/jepa2-gate/result.json"
          test -s "$RUNNER_TEMP/jepa2-gate/result.json"
          python -B research/contrib/chatgpt/YGG-JEPA2-05-EVIDENCE-REENTRY-POSTHOC/paired_view_reset.py --platform ${{ matrix.platform }} --output "$RUNNER_TEMP/jepa2-gate/paired-view-reset.json"
          test -s "$RUNNER_TEMP/jepa2-gate/paired-view-reset.json"
      - name: Mandatory full native cross-platform regression and G29
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jepa2-evidence-reentry-${{ matrix.platform }}
          path: ${{ runner.temp }}/jepa2-gate/
          if-no-files-found: warn
          retention-days: 30
