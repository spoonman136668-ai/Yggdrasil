name: Yggdrasil Y036 frozen conflict-degree five and six
on:
  push:
    branches: [research/y036-conflict-threshold-56-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original immutable parent, source and prereg
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 35eace118e16ab8195a6810f2bc6ec569dfd0106 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y035-interaction/execute.py)" = 692e92cf931a2d63b39a618c0044af390984f099
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-degree56/prereg.json)" = 12157126ce2f9c99d21b928e0d1878507d4294df
          test "$(git hash-object research/contrib/chatgpt/20261013-y036-degree56/execute.py)" = 5eac5e0b18d3c009c7dd1d160c3a48b8b4c6f3ef
          python3 -m json.tool research/contrib/chatgpt/20261013-y036-degree56/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y036-degree56/execute.py
      - name: Original frozen new-cohort degree frontier science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y036-degree56/execute.py > /tmp/Y036-original.json
          python3 -m json.tool /tmp/Y036-original.json >/dev/null
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/Y036-original.json'))
          assert len(r['regimes'])==4 and r['heldout_seeds']==list(range(208,224))
          print('CLASSIFICATION',r['classification'])
          for a in r['regimes']:
              print('REGIME',a['regime'],a['heldout_churn'],a['sham_relative_savings'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y036-original-degree56
          path: /tmp/Y036-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
