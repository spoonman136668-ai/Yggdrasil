name: YGG-JEPA2-02 native specialist source-bound training
'on':
  push:
    branches:
      - research/ygg-jepa2-02-native-shift-specialists-20261118
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  preflight:
    if: "github.event.head_commit.message == 'ci(jepa2-02): preflight native multi-learner source' || github.event.head_commit.message == 'ci(jepa2-02): run frozen source-bound multilearner training'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Source-preserving Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned original native test dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Frozen prereg, original source, critical native interfaces and negatives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CKAD-37/pilot-14071.json)" = 7f57794658a305e061d236ff15efca6cba1c4950
          test "$(git rev-parse HEAD:research/contrib/chatgpt/CKAD-37/pilot-14072.json)" = 4ea587d99ea3852f396f9d79dfcafab64c3ab4f8
          git diff --exit-code f00d39793bff2091b7c74c05192a873725e675c2 HEAD -- research/contrib/chatgpt/YGG-JEPA2-02/prereg.json
          python -B -m unittest discover -s tests -p test_native_jepa2_multilearner.py -v
          python -B -m unittest discover -s tests -p test_native_cumulative_learner.py -v
          python -B research/contrib/chatgpt/YGG-JEPA2-02/campaign.py --help
          python -B research/contrib/chatgpt/YGG-JEPA2-02/audit.py --help
          test -z "$(git status --porcelain)"
  train:
    if: "github.event.head_commit.message == 'ci(jepa2-02): run frozen source-bound multilearner training'"
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Source-preserving Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Actual Yggdrasil native+JEPA training and independent evidence audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code f00d39793bff2091b7c74c05192a873725e675c2 HEAD -- research/contrib/chatgpt/YGG-JEPA2-02/prereg.json
          python -B research/contrib/chatgpt/YGG-JEPA2-02/campaign.py --output-directory "$RUNNER_TEMP/YGG-JEPA2-02"
          python -B research/contrib/chatgpt/YGG-JEPA2-02/audit.py "$RUNNER_TEMP/YGG-JEPA2-02"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: YGG-JEPA2-02-${{ matrix.os }}
          path: ${{ runner.temp }}/YGG-JEPA2-02/
          if-no-files-found: warn
          retention-days: 30
  seal:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.commit.outputs.final_sha }}
    steps:
      - name: Source-preserving Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-JEPA2-02-ubuntu-latest
          path: ${{ runner.temp }}/YGG-JEPA2-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: YGG-JEPA2-02-windows-2022
          path: ${{ runner.temp }}/YGG-JEPA2-windows
      - name: Independent dual-OS source-state agreement and immutable evidence seal
        id: commit
        shell: bash
        env:
          YGG_JEPA2_LINUX: ${{ runner.temp }}/YGG-JEPA2-linux
          YGG_JEPA2_WINDOWS: ${{ runner.temp }}/YGG-JEPA2-windows
          YGG_JEPA2_RUN_ID: ${{ github.run_id }}
          YGG_JEPA2_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code f00d39793bff2091b7c74c05192a873725e675c2 HEAD -- research/contrib/chatgpt/YGG-JEPA2-02/prereg.json
          python -B research/contrib/chatgpt/YGG-JEPA2-02/seal.py
          python -B research/contrib/chatgpt/YGG-JEPA2-02/audit.py research/contrib/chatgpt/YGG-JEPA2-02
          git add -- research/contrib/chatgpt/YGG-JEPA2-02/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(jepa2-02): preserve frozen native multi-learner training and negative evidence'
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$SOURCE_COMMIT"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git commit -m "docs(jepa2-02): exact source atlas at $SOURCE_COMMIT"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ygg-jepa2-02-native-shift-specialists-20261118
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Source-preserving Git checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original pinned native solver/test dependencies
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: MANDATORY exact-candidate full native regression and G29
        shell: bash
        env:
          EXACT_CANDIDATE: ${{ needs.seal.outputs.final_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}'
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          test -z "$(git status --porcelain)"
