name: FKP07 one-shot exact-source fixed causal weight repair DEV qualification
on:
  push:
    branches: [ci/fkp07-repair-one-shot-20261115]
    paths: [.github/workflows/fkp07-once.yml]

permissions:
  contents: write

concurrency:
  group: fkp07-original-public-dev-once-20261115
  cancel-in-progress: false

jobs:
  publish-source:
    if: >-
      github.event.head_commit.message == 'ci(FKP-07): one-shot exact-source repair experiment' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.commit-source.outputs.sha }}
    steps:
      - name: Pin Git checkout to LF on isolated helper
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: helper
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 34f22d6f7fb60941e3ddf8bba40082988ecc43b0
          path: src
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact immutable source archive before unpacking
        shell: bash
        run: |
          set -euo pipefail
          archive="helper/ci-helper/fkp07-original-sources.tar.xz"
          test "$(git -C helper hash-object ci-helper/fkp07-original-sources.tar.xz)" = 033f63f4ac282a0178965652eb00fe4847555093
          echo "5249a6ed8822b57ab4c006f871ddcb00ef4e20354cdfc70a182011bbb783b3d0  $archive" | sha256sum -c -
          tar -tJf "$archive" | LC_ALL=C sort > "$RUNNER_TEMP/archive-files.txt"
          printf '%s\n' FKP-07/README.md FKP-07/repair.py FKP-07/run_dev.py FKP-07/source.py FKP-07/test_fkp07.py | LC_ALL=C sort > "$RUNNER_TEMP/expected-archive-files.txt"
          diff -u "$RUNNER_TEMP/expected-archive-files.txt" "$RUNNER_TEMP/archive-files.txt"
          test "$(git -C src rev-parse HEAD)" = 34f22d6f7fb60941e3ddf8bba40082988ecc43b0
          test "$(git -C src rev-parse HEAD:research/contrib/chatgpt/FKP-07/prereg.json)" != ""
          test -z "$(git -C src status --porcelain --untracked-files=all)"
          tar -xJf "$archive" -C src/research/contrib/chatgpt/
          cd src/research/contrib/chatgpt
          echo "dcf75d1b65929c1b42e52e1c16dc734ebc9ea94b65c6f8e5285fa1fce9c2368f  FKP-07/README.md" | sha256sum -c -
          echo "3935612681618434e7e08748425b352119a2d16517c42dca4b8819051ee3fb1c  FKP-07/repair.py" | sha256sum -c -
          echo "17c465c8e5819b418bf2706f654395cbf6ab4fc231b39d9a4ba261a8426eb2c9  FKP-07/run_dev.py" | sha256sum -c -
          echo "53a2b8414c6b70ba585d30b906b1f5ed8c7989947b07d3c8086890101347e4f9  FKP-07/source.py" | sha256sum -c -
          echo "956d204091833d217ae610fa85de5e2cf1ef62e2c45d3063b362fd2f837d64a1  FKP-07/test_fkp07.py" | sha256sum -c -
          echo "FKP07_ORIGINAL_SOURCE_TRANSFER_SHA256=PASS"
      - name: Publish source-only as one child of frozen protocol
        id: commit-source
        shell: bash
        run: |
          set -euo pipefail
          cd src
          git add research/contrib/chatgpt/FKP-07/README.md research/contrib/chatgpt/FKP-07/{source,repair,run_dev,test_fkp07}.py
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-new-files.txt"
          printf '%s\n' research/contrib/chatgpt/FKP-07/README.md research/contrib/chatgpt/FKP-07/repair.py research/contrib/chatgpt/FKP-07/run_dev.py research/contrib/chatgpt/FKP-07/source.py research/contrib/chatgpt/FKP-07/test_fkp07.py | LC_ALL=C sort > "$RUNNER_TEMP/expected-new-files.txt"
          diff -u "$RUNNER_TEMP/expected-new-files.txt" "$RUNNER_TEMP/actual-new-files.txt"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'research(FKP-07): publish frozen source and controls before first DEV outcome'
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 34f22d6f7fb60941e3ddf8bba40082988ecc43b0
          git fetch origin refs/heads/research/fkp07-shared-weight-causal-repair-20261115
          test "$(git rev-parse FETCH_HEAD)" = 34f22d6f7fb60941e3ddf8bba40082988ecc43b0
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/research/fkp07-shared-weight-causal-repair-20261115"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "FKP07_EXACT_SOURCE_SHA=$SOURCE_SHA"

  source-qualification:
    needs: publish-source
    if: needs.publish-source.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Consistent Git LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish-source.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fixture-only source/negative/repair tests, no DEV held labels
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.publish-source.outputs.source_sha }}"
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-07 -p test_fkp07.py -v
          python -B research/contrib/chatgpt/FKP-07/source.py
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FKP07_SOURCE_AND_INHERITED_REGRESSION=PASS"
      - name: Validate regenerated-only G29 source-index contents without publishing
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit ${{ needs.publish-source.outputs.source_sha }} --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/atlas-actual.txt"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort > "$RUNNER_TEMP/atlas-expected.txt"
          diff -u "$RUNNER_TEMP/atlas-expected.txt" "$RUNNER_TEMP/atlas-actual.txt"
          echo "FKP07_PROVISIONAL_ATLAS=PASS"

  original-public-dev:
    needs: [publish-source, source-qualification]
    if: needs.source-qualification.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      final_sha: ${{ steps.publish-result.outputs.final_sha }}
      original_result_sha: ${{ steps.publish-result.outputs.result_sha }}
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Consistent Git LF
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.publish-source.outputs.source_sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check source hashes and exact fixed cohort before original first DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.publish-source.outputs.source_sha }}"
          echo "3935612681618434e7e08748425b352119a2d16517c42dca4b8819051ee3fb1c  research/contrib/chatgpt/FKP-07/repair.py" | sha256sum -c -
          echo "17c465c8e5819b418bf2706f654395cbf6ab4fc231b39d9a4ba261a8426eb2c9  research/contrib/chatgpt/FKP-07/run_dev.py" | sha256sum -c -
          echo "53a2b8414c6b70ba585d30b906b1f5ed8c7989947b07d3c8086890101347e4f9  research/contrib/chatgpt/FKP-07/source.py" | sha256sum -c -
          python - <<'PY'
          import sys
          sys.path.insert(0, 'research/contrib/chatgpt/FKP-07')
          import source
          assert tuple(source.ORIGINAL) == tuple(range(800,824))
          assert tuple(source.REVISIONS) == tuple(range(840,848))
          assert tuple(source.PROTECTED) == tuple(range(1800,1864))
          assert tuple(source.PROTECTED_NEGATIVE) == tuple(range(2800,2816))
          print('FKP07_FIRST_USE_DEV_ONLY_SOURCE_COHORT=PASS')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: One original paid public DEV world comparison; preserve negative outcome
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/FKP-07/run_dev.py > "$RUNNER_TEMP/fkp07-original-dev.json"
          python - "$RUNNER_TEMP/fkp07-original-dev.json" <<'PY'
          import json,sys,hashlib
          p=sys.argv[1]
          raw=open(p,'rb').read()
          x=json.loads(raw)
          assert x['schema']=='fkp07.public-dev-direct-shared-repair.v1'
          assert not x['protected_first_use'] and not x['native_accepted_model_changed']
          assert x['genuine_observed_consequences']==2048
          assert x['original_worlds']==24 and x['revision_worlds']==8
          assert x['paid_actions_per_world']==64
          print('FKP07_DEV_OUTCOME='+json.dumps({k:x[k] for k in (
              'classification','per_prefix_mean_held_accuracy','exact_law_identified_64',
              'unaffected_contexts_retained','revisions_repaired','independent_replay_weight_parity',
              'unscoped_naive_accuracy_on_16_untouched_contexts','direct_edit_total_seconds',
              'independent_replay_edit_total_seconds','full_process_wall_seconds',
              'shared_weight_bytes_fixed','checkpoint_bytes_fixed','scientific_status')},sort_keys=True))
          print('FKP07_ORIGINAL_RESULT_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
      - name: Commit original outcome and generated-only G29 to same isolated draft branch
        id: publish-result
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${{ needs.publish-source.outputs.source_sha }}"
          git fetch origin refs/heads/research/fkp07-shared-weight-causal-repair-20261115
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          cp "$RUNNER_TEMP/fkp07-original-dev.json" research/contrib/chatgpt/FKP-07/result.json
          git add research/contrib/chatgpt/FKP-07/result.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'research(FKP-07): preserve original source-locked public DEV result (positive or negative)'
          RESULT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          echo "result_sha=$RESULT" >> "$GITHUB_OUTPUT"
          python -B scripts/build_code_atlas.py --source-commit "$RESULT" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/atlas-actual.txt"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort > "$RUNNER_TEMP/atlas-expected.txt"
          diff -u "$RUNNER_TEMP/atlas-expected.txt" "$RUNNER_TEMP/atlas-actual.txt"
          git add .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(FKP-07): index exact original result source, generated atlas only'
          test "$(git rev-parse HEAD^)" = "$RESULT"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/research/fkp07-shared-weight-causal-repair-20261115"
          FINAL="$(git rev-parse HEAD)"
          echo "final_sha=$FINAL" >> "$GITHUB_OUTPUT"
          echo "FKP07_INDEXED_FINAL_SHA=$FINAL"
          echo "FKP07_ORIGINAL_RESULT_SOURCE_SHA=$RESULT"

  final-exact-regression:
    needs: [original-public-dev]
    if: needs.original-public-dev.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Git LF on both platforms
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.original-public-dev.outputs.final_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Final exact-source G29, fixtures and mandatory inherited regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.original-public-dev.outputs.final_sha }}"
          test "$(git rev-parse HEAD^)" = "${{ needs.original-public-dev.outputs.original_result_sha }}"
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-07 -p test_fkp07.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          with open('research/contrib/chatgpt/FKP-07/result.json',encoding='utf-8') as f:
              result=json.load(f)
          assert not result['protected_first_use']
          assert result['genuine_observed_consequences']==2048
          assert result['classification'] in ('DEV_REPAIR_FEASIBLE_ONLY','DEV_NO_GO')
          print('FKP07_FINAL_RECORDED_RESULT_CLASS='+result['classification'])
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "FKP07_FINAL_EXACT_SHA_ENGINEERING_PASS"
