name: CK21-OH01 frozen informed-oracle headroom
on:
  push:
    branches: [research/ck21-oracle-headroom-20261118]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  development:
    if: "github.event.head_commit.message == 'ci(ck21-oh01): run frozen oracle headroom'"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce exact frozen source and preregistration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 75c23a3bde818056c3035a73e7bf89fdfda71cce HEAD
          test "$(git hash-object research/contrib/chatgpt/CK21-OH01/campaign.py)" = fa90fb56797477789099d1d2621b27f31f334928
          test "$(git hash-object research/contrib/chatgpt/CK21-OH01/prereg.json)" = 6c4143de7c2286d154d40de646e890763623e1d4
          test "$(git hash-object research/contrib/chatgpt/CK21-OH01/test_oracle.py)" = 9e77ad4d61f1f476ecfdc9e7e3ffe6aa5f2624fa
      - name: Execute pre-registered evaluator-only oracle and independent replay
        run: |
          set -euo pipefail
          python -B -m unittest discover -s research/contrib/chatgpt/CK21-OH01 -p test_*.py -v
          python -B research/contrib/chatgpt/CK21-OH01/campaign.py --output-directory "$RUNNER_TEMP/ck21oh"
          python -B research/contrib/chatgpt/CK21-OH01/independent_audit.py --result "$RUNNER_TEMP/ck21oh/result.json"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ck21oh-${{ matrix.os }}-source-receipts
          path: ${{ runner.temp }}/ck21oh/result.json
          if-no-files-found: error
          retention-days: 30
  seal:
    needs: development
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      candidate: ${{ steps.seal.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ck21oh-ubuntu-latest-source-receipts
          path: ${{ runner.temp }}/ck21oh-linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ck21oh-windows-2022-source-receipts
          path: ${{ runner.temp }}/ck21oh-windows
      - name: Seal exact OS-matched negative or positive and source atlas
        id: seal
        env:
          CK21OH_LINUX: ${{ runner.temp }}/ck21oh-linux
          CK21OH_WINDOWS: ${{ runner.temp }}/ck21oh-windows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B research/contrib/chatgpt/CK21-OH01/seal.py
          git add -- research/contrib/chatgpt/CK21-OH01
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(ck21-oh01): preserve informed-oracle headroom outcome'
          RESULT_SOURCE="$(git rev-parse HEAD)"
          python -B scripts/build_code_atlas.py --write --source-commit "$RESULT_SOURCE"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          python -B -c "import subprocess; assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json'}"
          git commit -m "docs(ck21-oh01): seal frozen oracle source atlas at $RESULT_SOURCE"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/ck21-oracle-headroom-20261118
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  final-regression:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned native full-regression dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Mandatory full exact-SHA root regression and frozen oracle replay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.seal.outputs.candidate }}"
          git rev-parse HEAD HEAD^{tree}
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p test_*.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/CK21-OH01 -p test_*.py -v
          python -B research/contrib/chatgpt/CK21-OH01/campaign.py --output-directory "$RUNNER_TEMP/ck21oh-final"
          python -B research/contrib/chatgpt/CK21-OH01/independent_audit.py --result "$RUNNER_TEMP/ck21oh-final/result.json"
          python -c "import json,os,pathlib; local=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'ck21oh-final/result.json').read_text()); sealed=json.loads(pathlib.Path('research/contrib/chatgpt/CK21-OH01/result.json').read_text()); assert local['stable_sha256']==sealed['stable_sha256']"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
  independent-atlas:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.seal.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independently audit source atlas and predecessor source receipts
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B research/contrib/chatgpt/CKAD-13/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-14/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-15/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-16/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-17/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-18/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-19/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-20/independent_audit.py
          python -B research/contrib/chatgpt/CKAD-21/independent_audit.py
          python -B research/contrib/chatgpt/CK21-OH01/independent_audit.py --result research/contrib/chatgpt/CK21-OH01/result.json
          test -z "$(git status --porcelain)"
