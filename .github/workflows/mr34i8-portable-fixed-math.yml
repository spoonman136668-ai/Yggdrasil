name: MR34I8 Portable Fixed-Math Candidate Native and CPU Qualification
on:
  push:
    branches:
      - research/mr34i8-portable-decimal-candidate-20261022
permissions:
  contents: read
concurrency:
  group: mr34i8-fixed-math-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable-decimal80-source-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        repeat: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Avoid Windows line-ending mutation of frozen source
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Checkout original MR34I8 isolated frozen audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged S4C1 genuine 45-coefficient original
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8e1561eb1a542e21307bac669c42435cf48e59bd
          path: s4c1
          fetch-depth: 0
          persist-credentials: false
      - name: Original Farama MiniGrid checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/minigrid
          fetch-depth: 0
          persist-credentials: false
      - name: Independently authored original Pycolab checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: google-deepmind/pycolab
          ref: 6504c8065dd5322438f23a2a9026649904f3322a
          path: external/pycolab
          fetch-depth: 0
          persist-credentials: false
      - name: Original Python 3.11 interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned runtime numerical packages
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 gymnasium==1.1.1 pygame-ce==2.5.3 six==1.17.0 psutil==6.1.1
      - name: Pycolab original Windows curses support
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install --disable-pip-version-check windows-curses==2.4.1
      - name: Verify immutable protocol was source-only first
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C audit log -1 --format=%H -- research/mr34i8/frozen_protocol.json)" = "64565886ca45eaa57087eebc74981194a782ed4d"
          test "$(git -C audit hash-object research/mr34i4/kernel_probe.py)" = "79df5303a4278d65363d8ab17a5d832c576b8722"
          test "$(git -C s4c1 rev-parse HEAD)" = "8e1561eb1a542e21307bac669c42435cf48e59bd"
          test "$(git -C external/minigrid rev-parse HEAD)" = "7f5853792ea7f04f75614661006d87fcf949f26d"
          test "$(git -C external/pycolab rev-parse HEAD)" = "6504c8065dd5322438f23a2a9026649904f3322a"
      - name: Genuine source-born first-public logits and isolated portable-sigmoid resource comparison
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          BLIS_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          set -o pipefail
          python -B audit/research/mr34i8/portable_probe.py audit s4c1 external/minigrid external/pycolab | tee mr34i8-original-native-portable-kernel.log
          grep -q '^MR34I8_PORTABLE_FIXED_MATH_CANDIDATE=' mr34i8-original-native-portable-kernel.log
      - name: Keep all original worktrees byte-identical
        shell: bash
        run: |
          set -euo pipefail
          for path in audit s4c1 external/minigrid external/pycolab; do
            git -C "$path" diff --exit-code
            test -z "$(git -C "$path" status --porcelain)"
          done
