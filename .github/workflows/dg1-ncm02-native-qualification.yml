name: DG1-NCM02 Native-Cell Focused Qualification
on:
  pull_request:
    paths:
      - 'yggdrasil/public_causal_cells.py'
      - 'tests/test_native*.py'
      - 'research/contrib/chatgpt/dg1-ncm02-20261113/**'
      - '.github/workflows/dg1-ncm02-native-qualification.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native-cell source compatibility and retention negatives
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p "test_native*.py" -v
      - name: Compile native source
        run: python -m py_compile yggdrasil/public_causal_cells.py
      - name: Ensure no tests modify the repository
        run: git diff --exit-code
      - name: Build exact-source G29 atlas bundle for later review (artifact only)
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/build_code_atlas.py --source-commit ${{ github.event.pull_request.head.sha }} --write
      - name: Upload generated G29 source atlas bundle (no source mutation)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dg1-ncm02-g29-atlas
          path: |
            .ice/code-atlas.json
            .ice/code-atlas.html
            .ice/code-atlas.ice
          if-no-files-found: error
          retention-days: 3
