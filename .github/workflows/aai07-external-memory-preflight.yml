name: AAI-07 external MiniGrid memory mechanical preflight (no science)
on:
  push:
    branches: [research/aai07-independent-minigrid-memory-20261114]
    paths: [.github/workflows/aai07-external-memory-preflight.yml]
permissions:
  contents: read
jobs:
  pinned-environment-mechanical:
    if: >-
      github.repository == 'spoonman136668-ai/Yggdrasil' &&
      github.event.head_commit.message == 'AAI-07 pinned external benchmark smoke once' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify contributor source and preflight-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '52aa6480de6fb61075cffea5fe1a6e7f297b3f1d'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/aai07-external-memory-preflight.yml'
          test "$(git rev-parse HEAD:research/contrib/chatgpt/AAI-07/preflight.py)" = "$(git rev-parse 1ce3e71e138563cd4c6f600168173df2d7a4f06b:research/contrib/chatgpt/AAI-07/preflight.py)"
          test -z "$(git status --porcelain)"
          echo AAI07_NO_SCIENTIFIC_FIRST_USE=PASS
      - name: Fetch exact upstream environment source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aai07-external"
          git -C "$RUNNER_TEMP/aai07-external" init -q
          git -C "$RUNNER_TEMP/aai07-external" remote add origin https://github.com/Farama-Foundation/Minigrid.git
          git -C "$RUNNER_TEMP/aai07-external" -c protocol.version=2 fetch --no-tags --depth 1 origin 64e1eaec904bc35e7de041167274e2c0dfe541d2
          git -C "$RUNNER_TEMP/aai07-external" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/aai07-external" rev-parse HEAD)" = "64e1eaec904bc35e7de041167274e2c0dfe541d2"
          test "$(git -C "$RUNNER_TEMP/aai07-external" rev-parse HEAD:minigrid/envs/memory.py)" = "660b0a1b769948034c87bb421759c2b9a4f24548"
          echo AAI07_EXTERNAL_IMMUTABLE_SOURCE=PASS
      - name: Install pinned third-party environment dependencies, no AI API
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --prefer-binary \
            numpy==1.26.4 gymnasium==1.2.2 pygame-ce==2.5.8 networkx==3.4.2
          python -m pip install --disable-pip-version-check --no-input --no-deps -e "$RUNNER_TEMP/aai07-external"
          python -m pip check
      - name: Smoke original environment, repeat reserved seeds and audit observation boundary
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          export AAI07_EXTERNAL_ROOT="$RUNNER_TEMP/aai07-external"
          python -B -m unittest discover -s research/contrib/chatgpt/AAI-07 -p 'test_preflight.py' -v
          python -B research/contrib/chatgpt/AAI-07/preflight.py
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$AAI07_EXTERNAL_ROOT" status --porcelain)"
          echo AAI07_EXTERNAL_MECHANICAL_PASS=PASS
