name: YGG-JEPA2-05 archived reset-suppression tradeoff only
'on':
  push:
    branches:
      - research/jepa2-05-reset-tradeoff-posthoc-20261119
permissions:
  contents: read
env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  atlas-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      final_sha: ${{ steps.seal.outputs.final_sha }}
    steps:
      - name: Byte-stable Git
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-only G29 atlas seal without research execution
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base HEAD acb7df218d0e41415187041e725904173a9eec10)" = acb7df218d0e41415187041e725904173a9eec10
          python -B scripts/build_code_atlas.py --write --source-commit "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          git commit -m 'docs(jepa2-reset-tradeoff): seal source-only G29 atlas'
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/research/jepa2-05-reset-tradeoff-posthoc-20261119
  archived-tradeoff-only:
    needs: atlas-seal
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Byte-stable checkout exact final atlas-sealed source
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.atlas-seal.outputs.final_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original pinned JEPA2 numeric environment
        shell: bash
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0'
      - name: Freeze source, old experiment receipts and prereg-before-code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.atlas-seal.outputs.final_sha }}"
          test "$(git merge-base HEAD acb7df218d0e41415187041e725904173a9eec10)" = acb7df218d0e41415187041e725904173a9eec10
          git diff --exit-code 7b0d9fd8c16b8e0433a632666cec88d8d008c19f HEAD -- yggdrasil research/contrib/chatgpt/YGG-JEPA2-05 research/contrib/chatgpt/YGG-RET01
          git diff --exit-code 6cef0688a2c70cee2c60f38a2774f83661c7e3ef HEAD -- research/contrib/chatgpt/YGG-JEPA2-05-RESET-POSTHOC
          test "$(git rev-parse HEAD:research/contrib/chatgpt/YGG-JEPA2-05-RESET-TRADEOFF-POSTHOC/prereg.json)" = "$(git rev-parse acb7df218d0e41415187041e725904173a9eec10:research/contrib/chatgpt/YGG-JEPA2-05-RESET-TRADEOFF-POSTHOC/prereg.json)"
          python -B -c "import ast,pathlib; ast.parse(pathlib.Path('research/contrib/chatgpt/YGG-JEPA2-05-RESET-TRADEOFF-POSTHOC/tradeoff.py').read_text('utf-8'))"
      - name: Original-data-only prequential tradeoff, cold source replay
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/YGG-JEPA2-05-RESET-TRADEOFF-POSTHOC/tradeoff.py --platform ${{ matrix.platform }} --output "$RUNNER_TEMP/jepa2-tradeoff/result.json"
          test -s "$RUNNER_TEMP/jepa2-tradeoff/result.json"
      - name: Mandatory original source tree full native regression and source index
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/NKR-05 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/CKAD-28 -p 'test_*.py' -v
          for n in 31 32 33 33R 34 35 36 37; do
            python -B -m unittest discover -s "research/contrib/chatgpt/CKAD-$n" -p 'test_*.py' -v
          done
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-RET02 -p 'test_*.py' -v
          python -B -m unittest discover -s research/contrib/chatgpt/YGG-JEPA2-05 -p 'test_*.py' -v
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jepa2-reset-tradeoff-${{ matrix.platform }}
          path: ${{ runner.temp }}/jepa2-tradeoff/
          if-no-files-found: warn
          retention-days: 30
