name: WSP60 one-shot source atlas companion
on:
  push:
    branches: [research/wsp60-counterexample-causal-disambiguation-20261112]
permissions:
  contents: read
jobs:
  atlas-only:
    if: github.event.head_commit.message == 'Arm WSP60 one-shot G29 source atlas reanchor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Re-anchor exact-source G29 generated files only
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$A"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 6c4a5992bd796c1b71889a57bb39a85a8c6e3633 "$A"
          test "$(git rev-parse HEAD:scripts/build_code_atlas.py)" = "cef1378fd3c47ebc74675bd9dde19a183775ceeb"
          python scripts/build_code_atlas.py --write --source-commit "$A"
          git add -- .ice/code-atlas.json .ice/code-atlas.html .ice/code-atlas.ice
          diff -u <(git diff --cached --name-only | LC_ALL=C sort) <(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json | LC_ALL=C sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(wsp60): pin G29 companions to source $A"
          B="$(git rev-parse HEAD)"
          test "$(git diff-tree --no-commit-id --name-only -r "$B" | wc -l | tr -d ' ')" = "3"
          python scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/research/wsp60-counterexample-causal-disambiguation-20261112
          echo "WSP60_G29_SOURCE=$A"
          echo "WSP60_G29_ATLAS_ONLY=$B"
