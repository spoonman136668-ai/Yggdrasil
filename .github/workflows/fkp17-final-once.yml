name: FKP17 final frozen negative evidence full regression, NEVER rerun H128 source
on:
  push:
    branches: [ci/fkp17-final-negative-once-20261115]
    paths: [.github/workflows/fkp17-final-once.yml]
permissions:
  contents: read
concurrency:
  group: fkp17-final-source-negative-doc-only-20261115
  cancel-in-progress: false
jobs:
  source-atlas-doc-only:
    if: >-
      github.event.head_commit.message == 'ci(FKP-17): final frozen negative evidence both OS' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE: 8c719a4c83f71cbc85edc30242c3e3283fdfd4d2
      TREE: d52d0aa1f0f254bc7de247e2b7febb5fdf11c0d2
      TARGET: research/fkp17-128step-temporal-plan-headroom-20261115
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      exact_child: ${{ steps.seal.outputs.exact_child }}
    steps:
      - name: Canonical git bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8c719a4c83f71cbc85edc30242c3e3283fdfd4d2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Original method unchanged, document-only result and prereg pinned
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          git fetch origin "refs/heads/$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 11133597b3e0e59dcb27e0c563e30d6b150287e1 "$SOURCE"
          git merge-base --is-ancestor 240b2c53ccdecc3a7ada477c335c603a053a4de9 "$SOURCE"
          git diff --name-only 240b2c53ccdecc3a7ada477c335c603a053a4de9 "$SOURCE" | LC_ALL=C sort > "$RUNNER_TEMP/actual"
          printf '%s\n' research/contrib/chatgpt/FKP-17/README.md research/contrib/chatgpt/FKP-17/result.json > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/prereg.json)" = 1d3eadeac9b6ca7179c6f99ef14d0c58f30fe51f
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/headroom.py)" = b60be958dd2c4d4d9867d574fcf0f0e9f2e9d61d
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/test_fkp17.py)" = 381236ecad49ae6c1b4306f7a941d21dfc8da163
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/result.json)" = 27947e8f748226e2c8fb30387878da43745d8076
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/README.md)" = 0a383efc8f23e2d3b3827f0b69c049cb22fc04f3
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-16/source.py)" = bf620c3521c42c3915e6dc54a755dcb42b1675bb
          python -B - <<'PY'
          import json
          p=json.load(open("research/contrib/chatgpt/FKP-17/result.json",encoding="utf-8"))
          assert p["experiment_id"]=="FKP-17-128STEP-TEMPORAL-PLAN-HEADROOM"
          assert p["scientific_pass"] is False
          assert p["source_information_signal"] is False
          assert p["frozen_actions"]["full_original_source_actions"]["total"]==238655
          assert p["H128"]["goal_reachable_anchors"]==2
          assert p["H128"]["distinct_worlds_with_some_goal"]==1
          assert p["provenance"]["original_run_id"]==43764698791
          print("FKP17_ARCHIVED_NEGATIVE_SOURCE_RECEIPTS=PASS")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Regenerate ONLY 3 derived source index artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$SOURCE" --write
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/source-actual"
          printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json > "$RUNNER_TEMP/source-expected"
          diff -u "$RUNNER_TEMP/source-expected" "$RUNNER_TEMP/source-actual"
          git add -- .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          test -z "$(git diff --name-only)"
      - name: Commit ONLY regenerated G29 negative evidence index
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(FKP-17): index original negative source evidence only"
          CHILD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test "$(git show --pretty= --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json)"
          python -B scripts/build_code_atlas.py --check-if-present
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET"
          echo "exact_child=$CHILD" >> "$GITHUB_OUTPUT"
          echo FKP17_POST_RESULT_INDEXED_SHA=$CHILD

  final-both-os-full-root:
    needs: source-atlas-doc-only
    if: needs.source-atlas-doc-only.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Stable original source bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.source-atlas-doc-only.outputs.exact_child }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Numeric fixture dependency only, NEVER call the source evaluator
        shell: bash
        run: python -m pip install "numpy==1.26.4"
      - name: Mandatory post-archive source G29+focused+full root and durable negative custody
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --check-if-present
          python -B -m unittest discover -s tests -p test_code_atlas.py -v
          python -B -m unittest discover -s research/contrib/chatgpt/FKP-17 -p test_fkp17.py -v
          python -B -m unittest discover -s tests -p 'test_*.py' -v
          test "$(git rev-parse HEAD^)" = "8c719a4c83f71cbc85edc30242c3e3283fdfd4d2"
          test "$(git rev-parse HEAD:research/contrib/chatgpt/FKP-17/result.json)" = 27947e8f748226e2c8fb30387878da43745d8076
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo FKP17_FINAL_DUAL_OS_ROOT_NEGATIVE_EVIDENCE_QUALIFIED=PASS
