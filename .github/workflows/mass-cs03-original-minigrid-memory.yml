name: Mass CS03 original MiniGrid public memory-identifiability screen
on:
  push:
    branches:
      - research/mass-cs03-original-minigrid-memory-cue-20261023
permissions:
  contents: read
concurrency:
  group: mass-cs03-memory-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-partial-memory-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout frozen-first source review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 7
      - name: Prove immutable prereg-first and purely additive source changes
        shell: bash
        run: |
          set -euo pipefail
          first=5992c17ff3730332171475f7913d7de27e00cb2e
          parent=63c3c79a5404e1a42dd1bcbe3e03174cac2babf5
          test "$(git rev-parse "$first^")" = "$parent"
          test "$(git show --format= --name-only "$first")" = "research/native/itd01/mass_r10/CS03_PREREG.md"
          git merge-base --is-ancestor "$first" HEAD
          git diff --name-only "$parent" HEAD | python -B -c 'import sys;got=set(sys.stdin.read().splitlines());want={"research/native/itd01/mass_r10/CS03_PREREG.md","research/native/itd01/mass_r10/screen_original_minigrid_memory.py",".github/workflows/mass-cs03-original-minigrid-memory.yml"};assert got==want,(got,want)'
      - name: Checkout exact separately authored MiniGrid original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Farama-Foundation/Minigrid
          ref: 7f5853792ea7f04f75614661006d87fcf949f26d
          path: external/Minigrid
          persist-credentials: false
      - name: Install clean Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact original upstream package, unmodified
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p cs03-evidence
          set +e
          timeout 240s python -m pip install --no-cache-dir --timeout 30 --retries 1 -e external/Minigrid > cs03-evidence/pip-install.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >cs03-evidence/pip-exit.txt
          test "$rc" -eq 0
      - name: Run exact preregistered 128-seed original MemoryEnv source screen
        shell: bash
        run: |
          set -euo pipefail
          python -B research/native/itd01/mass_r10/screen_original_minigrid_memory.py \
            --upstream external/Minigrid --out cs03-evidence/
      - name: Preserve all original public evidence and terminal negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-cs03-original-minigrid-memory-source
          path: cs03-evidence/
          retention-days: 30
