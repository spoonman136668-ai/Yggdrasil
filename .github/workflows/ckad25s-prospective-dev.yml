name: CKAD25-S prospective native law-family development
on:
  pull_request:
    paths:
      - "research/contrib/chatgpt/CKAD25-S/**"
      - ".github/workflows/ckad25s-prospective-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  frozen-native-prospective:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve tracked bytes across OS
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install CKAD25 prequalified native baseline controls
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 scipy==1.16.3 scikit-learn==1.8.0 joblib==1.5.2 threadpoolctl==3.6.0
      - name: Lock source Git blob before scoring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/contrib/chatgpt/CKAD25-S/run.py)" = "31e06746dd2fa83cf4bfedf28da43cacbc68c99f"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib
          x=Path("research/contrib/chatgpt/CKAD-25/qualified-development-runs/44331408493")
          l=(x/"linux/stage-02.native.json").read_bytes()
          w=(x/"windows/stage-02.native.json").read_bytes()
          assert l == w
          assert hashlib.sha256(l).hexdigest()=="c52681bf26f08817b3747647472913fa792da2de33f74b8fa7c0f2b0e78c119f"
          print("CKAD25S_FROZEN_CHECKPOINT_PASS")
          PY
      - name: One frozen prospective native learning score
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-S/run.py --output "$RUNNER_TEMP/ckad25s-result.json"
          cp "$RUNNER_TEMP/ckad25s-result.json" "$RUNNER_TEMP/ckad25s-first.json"
      - name: Deterministic replay of the SAME consumed development cohort
        shell: bash
        run: |
          set -euo pipefail
          python -B research/contrib/chatgpt/CKAD25-S/run.py --output "$RUNNER_TEMP/ckad25s-result.json"
          cmp "$RUNNER_TEMP/ckad25s-result.json" "$RUNNER_TEMP/ckad25s-first.json"
          python -B - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          result=Path(os.environ["RUNNER_TEMP"])/"ckad25s-result.json"
          x=json.loads(result.read_bytes())
          assert x["native_state_count"]==1
          assert x["candidate_total"]==48
          assert x["new_synthetic_training_observations_per_seed"]==48
          assert x["protected_original_world_actions"]==0
          assert x["source_first_use"] is False
          assert x["scientific_pass"] is False
          assert x["forge_dispatch_authorized"] is False
          assert x["promotion_authorized"] is False
          assert len(x["per_family_seed"])==12
          assert all(v["old_slot_retained"] for v in x["per_family_seed"])
          print("CKAD25S_FOCUSED_CUSTODY_PASS")
          print("CKAD25S_RESULT_SHA256="+hashlib.sha256(result.read_bytes()).hexdigest())
          print("CKAD25S_FINAL_DISPOSITION="+x["disposition"])
          PY
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ckad25s-prospective-${{ matrix.os }}
          path: ${{ runner.temp }}/ckad25s-result.json
          if-no-files-found: error
          retention-days: 60
