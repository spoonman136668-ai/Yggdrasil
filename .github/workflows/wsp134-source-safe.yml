name: WSP134 source-safe open-structure causal learning development
on:
  push:
    branches: [research/wsp134-open-structure-development-20261116]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prereg is FIRST and immutable; source-safe only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 25d391dcb6e856bc19a480b05674f5554c3ecea0 HEAD
          git diff --exit-code 25d391dcb6e856bc19a480b05674f5554c3ecea0 HEAD -- research/contrib/chatgpt/WSP-134/prereg.json
          test ! -e research/contrib/chatgpt/WSP-134/result.json
          test ! -e research/contrib/chatgpt/WSP-134/first_use_authorization.json
          test -z "$(git status --porcelain)"
      - name: Run authentic WSP134 public synthetic development and negative controls
        run: python -B -m unittest discover -s research/contrib/chatgpt/WSP-134 -p 'test_*.py' -v
      - name: Verify source and checkout unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"
