name: NCI04F Yggdrasil one-neighbor recovery falsification
on:
  push:
    branches: [research/nci04f-one-neighbor-recovery-control-20261020]
    paths: ['.github/workflows/nci04f-one-neighbor.yml']
permissions:
  contents: read
jobs:
  bounded-local-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen earlier preregistration and original source identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 98d9eec0eb96a1aca250496e25ddd6c249435f4e "$GITHUB_SHA"
          test "$(git hash-object yggdrasil/distributed_setpoint.py)" = 19affab124502a757bf273341e0032c6c794fdf2
          test "$(git hash-object tests/test_nci04f_one_neighbor.py)" = 68302e5c0b04c0286df9ce2804be392db592c5a8
          python - <<'PY'
          import json
          d=json.load(open('research/contrib/openai/nci04f/frozen.json'))
          assert d['schema']=='nci04f.yggdrasil.asymmetric_neighbor_recovery_falsification.v1'
          assert d['constraints']['original_nci04e_source_untouched']
          assert d['constraints']['scientific_first_use']==0
          print('NCI04F_Y_FROZEN_SOURCE=PASS')
          PY
      - name: Unmodified two-neighbor consensus vs equally informed trained single-neighbor control
        shell: bash
        run: |
          set -euo pipefail
          NCI04F_RESULT_PATH="$RUNNER_TEMP/nci04f-yggdrasil.json" PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -p 'test_nci04f_one_neighbor.py' -v 2>&1 | tee "$RUNNER_TEMP/nci04f-yggdrasil.log"
          python - <<'PY'
          import os,json,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'nci04f-yggdrasil.json').read_text())
          assert r['result'] in ('NEGATIVE','PASS_NECESSARY_CONDITION_ONLY')
          assert r['scientific_first_use']==0
          assert r['conventional_local_lookup_correct']==16
          assert r['irrecoverable_hard_false_predictions']==0
          print('NCI04F_Y_ACTUAL_RESULT='+r['result'])
          PY
      - name: Original unchanged native operation regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -p 'test_native_cells.py' -v
          PYTHONDONTWRITEBYTECODE=1 python -B -m unittest discover -s tests -p 'test_distributed_setpoint.py' -v
          echo 'NCI04F_Y_ORIGINAL_NATIVE_REGRESSION=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nci04f-yggdrasil-local
          path: |
            ${{ runner.temp }}/nci04f-yggdrasil.json
            ${{ runner.temp }}/nci04f-yggdrasil.log
          if-no-files-found: warn
          retention-days: 90
