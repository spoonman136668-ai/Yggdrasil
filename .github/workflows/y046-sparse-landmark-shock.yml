name: Yggdrasil Y046 sparse landmark shock falsification
on:
  push:
    branches: [research/y046-sparse-landmark-retiming-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source lineage and frozen first-use gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 54eece368ec286bc42b17073ec9336aed324be89 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y045-landmark-calibration/execute.py)" = aaa3d50d564c56a0ebcf9ea16f53a79b4c7a9690
          test "$(git hash-object research/contrib/chatgpt/20261013-y046-sparse-landmark/prereg.json)" = 39bd3d217284ad4334fa3ae2b729aaf9c8a9d143
          test "$(git hash-object research/contrib/chatgpt/20261013-y046-sparse-landmark/execute.py)" = 3cf0be33b9b14faa548e518a1fd2949a2b4c18e2
          python3 -m json.tool research/contrib/chatgpt/20261013-y046-sparse-landmark/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y046-sparse-landmark/execute.py
      - name: One original first-use sparse-landmark experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y046-sparse-landmark/execute.py > /tmp/Y046-original.json
          python3 -m json.tool /tmp/Y046-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/Y046-original.json"))
          assert x["development_seeds"]==list(range(1312,1320))
          assert x["sealed_heldout_seeds"]==list(range(1320,1336))
          assert len(x["by_family"])==4
          print("CLASSIFICATION",x["classification"])
          print("MISMATCHES",x["heldout_assignment_mismatches"])
          print("LATE_SHOCK_MISMATCHES",x["after_episode4_shock_mismatches"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Y046-original-sparse-landmark-shock
          path: /tmp/Y046-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Yggdrasil repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
