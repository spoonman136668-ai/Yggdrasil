name: Yggdrasil F70 frozen causal memory reachability
on:
  push:
    branches: [research/y-f70-bounded-causal-reachability-20261016-r1]
permissions:
  contents: read
jobs:
  synthetic-reachability:
    if: "${{ github.event.head_commit.message == 'ci(y-f70): test one/two-step legal memory reachability on synthetic source' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the original action engine and diagnostic preregistration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 87a288b6b78a6bf5e93233073b3fe4558326ef62 HEAD
          test "$(git hash-object research/foundational/20261016-y-f70/prereg.json)" = f9ce48f01e499d83fbf714e0982101208f1cfddc
          test "$(git hash-object research/foundational/20261016-y-f70/reachability.py)" = ab650d69d823a0d29eb27af9fd56147e65ccfd73
          test "$(git hash-object research/foundational/20261015-y-f62/source_pilot.py)" = 7ed72deca5584d7c0b6562d74456fa7d4bee6712
      - name: Exhaust frozen one-step then bounded two-step interventions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/y-f70-reachability"
          python3 -B research/foundational/20261016-y-f70/reachability.py --synthetic-only > "$RUNNER_TEMP/y-f70-reachability/result.json"
          python3 -B -m json.tool "$RUNNER_TEMP/y-f70-reachability/result.json" >/dev/null
          python3 -B -c 'import json,os;d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"y-f70-reachability/result.json")));print("F70_F60_FAILURES",d["frozen_F60_failures"]);print("F70_ORACLE_RESCUES",d["one_step_rescues"],d["two_step_rescues"]);print("F70_EVALUATED",d["total_first_step_candidates"],d["total_two_step_pairs"]);assert d["unfair_oracle_noncompetitive"] and not d["protected_fit_used"] and not d["heldout_used"]'
          sha256sum "$RUNNER_TEMP/y-f70-reachability/result.json" > "$RUNNER_TEMP/y-f70-reachability/sha256.txt"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/y-f70-reachability/exact_head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y-f70-frozen-memory-oracle-reachability
          path: ${{ runner.temp }}/y-f70-reachability/
          retention-days: 90
