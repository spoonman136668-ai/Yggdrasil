name: YGG CAP04 prospective source staging fixture qualification
on:
  push:
    branches:
      - research/ygg-cap04-prospective-source-staging-20261119
permissions:
  contents: read
jobs:
  source-contract-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Engineering-only source gate; registered seeds forbidden
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          export PYTHONDONTWRITEBYTECODE=1
          python -B -m unittest discover -s tests -p test_cap04_prospective_source_contract.py -v
          python -B - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ("research/contrib/chatgpt/YGG-CAP04/prospective_source.py", "tests/test_cap04_prospective_source_contract.py"):
              print("CAP04_STAGING_FILE_SHA256", name, hashlib.sha256(Path(name).read_bytes()).hexdigest())
          print("CAP04_STAGING_ENGINEERING_ONLY_PASS")
          PY
          test -z "$(git status --porcelain)"
