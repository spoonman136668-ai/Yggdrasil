name: Yggdrasil DEV source-bound advisory atlas generator
on:
  push:
    branches: [dev/f139-native-cells-focused-tests-20261023]
    paths:
      - '.github/workflows/generate-native-public-atlas-dev.yml'
      - '.github/workflows/qualify-native-public-cells-dev.yml'
      - 'tests/test_native_cells.py'
      - 'yggdrasil/public_causal_cells.py'
permissions:
  contents: read
concurrency:
  group: ygg-native-advisory-atlas-generation
  cancel-in-progress: true
jobs:
  immutable-advisory-locators-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact unchanged main plus only advisory source revision
        shell: bash
        run: |
          set -euo pipefail
          base=9b069040feeddd9f509ab2c8ac9656d0a2c07d77
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo YGG_ADVISORY_ATLAS_FROZEN_PARENT="$GITHUB_SHA"
      - name: Generate exact pinned source atlas without modifying accepted source
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/build_code_atlas.py --source-commit "$GITHUB_SHA" --write
          expected="$(printf '%s\n' '.ice/code-atlas.html' '.ice/code-atlas.ice' '.ice/code-atlas.json')"
          test "$(git diff --name-only)" = "$expected"
          for f in .ice/code-atlas.html .ice/code-atlas.ice .ice/code-atlas.json; do
            test -s "$f"
            git hash-object "$f"
          done
          echo YGG_ADVISORY_ATLAS_REBUILT_WITHOUT_ACCEPTED_REFS=PASS
      - name: Emit independently transferable exact UTF-8 blobs in bounded log chunks
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import base64
          from pathlib import Path
          paths = ('.ice/code-atlas.html','.ice/code-atlas.ice','.ice/code-atlas.json')
          for n,path in enumerate(paths):
              data=Path(path).read_bytes()
              text=base64.b64encode(data).decode('ascii')
              for offset in range(0,len(text),2048):
                  print('YGGATLAS|%d|%d|%s'%(n,offset//2048,text[offset:offset+2048]),flush=True)
              print('YGGATLAS-END|%d|%d'%(n,(len(text)+2047)//2048),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-native-advisory-atlas
          path: |
            .ice/code-atlas.html
            .ice/code-atlas.ice
            .ice/code-atlas.json
          include-hidden-files: true
          retention-days: 2
      - name: Explicit zero scientific or owner authority
        shell: bash
        run: |
          echo YGG_NATIVE_ATLAS_LOCATORS_ONLY=TRUE
          echo YGG_NATIVE_SCIENTIFIC_FIRST_USE=FALSE
          echo YGG_NATIVE_ACCEPTED_REF_MUTATIONS=0
