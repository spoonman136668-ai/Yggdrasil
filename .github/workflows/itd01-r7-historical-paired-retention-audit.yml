name: ITD01 R7 historical DEV paired-retention causal audit
on:
  push:
    branches: [research/ygg-r7-retention-causal-audit-20261025]
    paths:
      - 'research/native/itd01/r7_retention_causal_audit/**'
      - '.github/workflows/itd01-r7-historical-paired-retention-audit.yml'
permissions:
  contents: read
concurrency:
  group: ygg-itd01-r7-20261025-paired-retention
  cancel-in-progress: false
jobs:
  original-source-paired-control:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin original historical DEV learner and immutable prereg
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/native/itd01/r7/native_cells.py)" = '4c492a494ac5b25d5e9c49b98185be6a2c966b2f'
          test "$(git rev-parse HEAD:research/native/itd01/r7/test_native_cells.py)" = '5565929be0e91c679bfd3c6741d171b69d9a013f'
          test "$(git rev-parse HEAD:research/native/itd01/r7_retention_causal_audit/PREREG.json)" = 'fc19c944e4fb4ee04c31b7e194080957b4dc8792'
          test "$(git rev-parse HEAD:research/native/itd01/r7_retention_causal_audit/probe.py)" = '2d103ed00af371637cbf3c7da9b1e65aa23457a1'
          python -B - <<'PY'
          import json,pathlib
          c=json.loads(pathlib.Path('research/native/itd01/r7_retention_causal_audit/PREREG.json').read_text())
          assert c["schema"]=="ygg.itd01.r7.dev_retention_causal_audit.v1"
          assert c["status"]=="FROZEN_BEFORE_AUDIT_EXECUTION"
          assert c["original_source_git_blob"]=="4c492a494ac5b25d5e9c49b98185be6a2c966b2f"
          assert c["historical_only_dev_seeds"]==[17,31,47]
          assert c["scientific_go"] is False and c["protected_original_source_first_use"] is False
          PY
      - name: Same-input causal attribution, sham no-B control and frozen-negative preservation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B research/native/itd01/r7_retention_causal_audit/probe.py
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R7_HISTORICAL_DEV_PAIRED_RETENTION_CAUSAL_AUDIT=PASS
          echo R7_ORIGINAL_FROZEN_FAILURE_PRESERVED=TRUE
          echo R7_EXTERNAL_ORIGINAL_SOURCE_FIRST_USE=NONE
          echo R7_SCIENTIFIC_GO=FALSE
