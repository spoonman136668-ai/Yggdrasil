name: WSP-215 Frozen Gate Admission / Equal-Write Science
on:
  pull_request:
    paths:
      - 'research/contrib/chatgpt/WSP-215/**'
      - '.github/workflows/wsp215-source-free.yml'
      - '.ice/code-atlas.json'
      - '.ice/code-atlas.html'
      - '.ice/code-atlas.ice'
permissions:
  contents: read

jobs:
  exact_source_os:
    # Prevent replay of consumed source-free primaries on later stacked PRs.
    if: github.event.pull_request.head.ref == 'research/wsp215-exact-split-audit-20261119-training-gaps'
    name: WSP215 Python3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source-exact SHA and Python 3.12 receipt
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python --version
      - name: Emit source-pinned G29 atlas in bounded log chunks (pre-evaluation)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          sha = "${{ github.event.pull_request.head.sha }}"
          output = subprocess.run(
              ["python","scripts/build_code_atlas.py",
               "--source-commit",sha,"--emit-base64"],
              capture_output=True,text=True,check=True).stdout
          b64 = [x.split(":",1)[1] for x in output.splitlines()
                 if x.startswith("YGG_ATLAS_BUNDLE_B64:")]
          assert len(b64)==1
          raw=b64[0]
          print("WSP215_ATLAS_SOURCE="+sha)
          for i in range(0,len(raw),4096):
              print(f"WSP215_ATLAS_CHUNK_{i//4096:04d}="+raw[i:i+4096])
          print("WSP215_ATLAS_TOTAL_CHUNKS="+str((len(raw)+4095)//4096))
          PY
      - name: MANDATORY full original Yggdrasil regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: WSP200 inherited full regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-200 -p 'test_*.py' -v
      - name: WSP209 inherited regression
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-209 -p 'test_*.py' -v
      - name: WSP210 smoke only; no invalid first-use repetition
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-210 -p test_00_smoke.py -v
      - name: WSP211 source allowlist only; no consumed calibration
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-211 -p test_calibration.py -k strict_world_allowlist -v
      - name: WSP212 source-only preflight; no consumed calibration
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-212 -p test_preflight.py -v
      - name: WSP213 source-only preflight; no consumed primary
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-213 -p test_preflight.py -v
      - name: WSP214B inherited source-only preflight; no consumed primary replay
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-214 -p test_preflight.py -v
      - name: WSP215 NEW prereg and negative source-only tests (no primary targets)
        run: python -m unittest discover -s research/contrib/chatgpt/WSP-215 -p test_preflight.py -v
      - name: Mandatory pinned G29 atlas seal BEFORE WSP215 first evaluation
        run: python scripts/build_code_atlas.py --check
      - name: ONE frozen source-free WSP215 primary evaluation per OS
        run: python research/contrib/chatgpt/WSP-215/experiment.py --output "${{ runner.temp }}/wsp215.json"
      - name: Upload bounded synthetic metrics (never model bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsp215-${{ matrix.os }}
          path: ${{ runner.temp }}/wsp215.json
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm source exact and checkout clean
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code
  independent_cross_os:
    needs: exact_source_os
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wsp215-ubuntu-24.04
          path: receipts/linux
      - uses: actions/download-artifact@v4
        with:
          name: wsp215-windows-2022
          path: receipts/windows
      - name: Independent verify full frozen result and numerical parity
        run: python research/contrib/chatgpt/WSP-215/verify_parity.py receipts/linux/wsp215.json receipts/windows/wsp215.json
      - name: Confirm checkout clean
        run: git diff --exit-code
