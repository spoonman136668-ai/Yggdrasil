name: Yggdrasil Y039 legality gated learned frequency
on:
  push:
    branches: [research/y039-legal-hit-frequency-r1]
permissions:
  contents: read
jobs:
  frozen_science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen ancestry and source identities before first use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 439a84addf877ecf0d67b0656b1480147d5cc0aa HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-y038-eviction-drift/execute.py)" = fb3a3fca2fcc88cecdba9229bb03c9b336ca0ba8
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-legality-learning/prereg.json)" = d12f4d8b372cc1fccc5552f99c0e4e959fc033b5
          test "$(git hash-object research/contrib/chatgpt/20261013-y039-legality-learning/execute.py)" = ce65120a4c1001d1a161f45e69d2c997ce6bde42
          python3 -m json.tool research/contrib/chatgpt/20261013-y039-legality-learning/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-y039-legality-learning/execute.py
      - name: Original frozen scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-y039-legality-learning/execute.py > /tmp/y039-original.json
          python3 -m json.tool /tmp/y039-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: Y039-original
          path: /tmp/y039-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Single complete repository regression
        run: python -m pip install -e '.[test]' && python -m pytest -q tests
