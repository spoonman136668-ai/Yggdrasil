[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrasil-developmental-intelligence"
version = "0.0.1"
description = "Bounded developmental intelligence research prototypes"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
